      case 'shuttlepad': return [[W - 1.05, 0.15, W - 0.35, 0.68], [0.45, 0.33, 1.05, 0.68]];
      case 'port': return [[W / 2 - 0.45, 0.28, W / 2 + 0.45, 1.05], [0.45, 0.35, 2.85, 0.9], [W - 2.85, 0.35, W - 0.45, 0.9], [0.46, H - 0.84, 0.64, H - 0.62], [W - 0.64, H - 0.84, W - 0.46, H - 0.62]];
      case 'dock': return [[0.3, 0.35, 1.9, 1.32], [W - 1.45, 1.0, W - 0.55, 1.45], [0.2, 2.4, 1.5, 7.8], [W - 1.55, 2.4, W - 0.25, 7.8], [0.95, 7.55, 1.15, 7.85], [W - 1.15, 7.55, W - 0.95, 7.85]];
      default: return [[0.1, 0.1, W - 0.1, H - 0.1]];
    }
  },
  // where customers stand: centre of the free strip
  stripPoint(b, slot) {
    const s = Collide.SIDE[b.rot & 3];
    if (s[1] === 1) return [b.x + 0.6 + (slot % 3) * ((b.w - 1.2) / 2), b.y + b.h - 0.32];
    if (s[1] === -1) return [b.x + 0.6 + (slot % 3) * ((b.w - 1.2) / 2), b.y + 0.32];
    if (s[0] === 1) return [b.x + b.w - 0.32, b.y + 0.6 + (slot % 3) * ((b.h - 1.2) / 2)];
    return [b.x + 0.32, b.y + 0.6 + (slot % 3) * ((b.h - 1.2) / 2)];
  },
  extra: [], // additional rectangles (e.g. the intro lander's hull)
  near(g, x, y, r, out) {
    out.length = 0;
    const seen = Collide._seen || (Collide._seen = new Set());
    seen.clear();
    const R = Math.ceil(r + 1);
    for (let ty = Math.floor(y) - R; ty <= Math.floor(y) + R; ty++) for (let tx = Math.floor(x) - R; tx <= Math.floor(x) + R; tx++) {
      const id = g.occ.get(U.tileKey(tx, ty));
      if (id === undefined || seen.has(id)) continue;
      seen.add(id);
      const b = g.buildings.get(id);
      if (!b || Collide.mode(b.type) === 'none') continue;
      for (const rc of Collide.boxes(b)) out.push(rc);
    }
    for (const rc of Collide.extra) if (rc[0] < x + R && rc[2] > x - R && rc[1] < y + R && rc[3] > y - R) out.push(rc);
    return out;
  },
  // push a circle out of rectangles; returns penetration depth handled
  resolve(rects, p, r) {
    let depth = 0;
    for (let it = 0; it < 3; it++) {
      let moved = false;
      for (const rc of rects) {
        const cx = Math.max(rc[0], Math.min(p.x, rc[2])), cy = Math.max(rc[1], Math.min(p.y, rc[3]));
        let dx = p.x - cx, dy = p.y - cy, d2 = dx * dx + dy * dy;
        if (d2 >= r * r) continue;
        if (d2 > 1e-9) { const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.y += dy * k; depth = Math.max(depth, r - d); }
        else {
          // centre inside: leave through the nearest edge
          const l = p.x - rc[0], rr = rc[2] - p.x, t = p.y - rc[1], bb = rc[3] - p.y, m = Math.min(l, rr, t, bb);
          if (m === l) p.x = rc[0] - r; else if (m === rr) p.x = rc[2] + r; else if (m === t) p.y = rc[1] - r; else p.y = rc[3] + r;
          depth = Math.max(depth, m + r);
        }
        moved = true;
      }
      if (!moved) break;
    }
    return depth;
  },
  blockedAt(g, x, y, r) {
    const rects = Collide.near(g, x, y, r, Collide._tmp || (Collide._tmp = []));
    for (const rc of rects) { const cx = Math.max(rc[0], Math.min(x, rc[2])), cy = Math.max(rc[1], Math.min(y, rc[3])); if ((x - cx) * (x - cx) + (y - cy) * (y - cy) < r * r) return true; }
    return false;
  },
  // nearest free point (spiral search), used for the stuck rescue and placing on the player
  freePoint(g, x, y, r) {
    for (let d = 0; d <= 16; d += 0.5) {
      const n = Math.max(1, Math.round(d * 8));
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, px = x + Math.cos(a) * d, py = y + Math.sin(a) * d; if (!Collide.blockedAt(g, px, py, r)) return [px, py]; }
    }
    return [x, y];
  },
  // movement with sub-steps; also handles push-out after placing and soft landing zones
  move(g, p, dx, dy, dt) {
    const rover = g.run.research.done.has('rover') && p.moving;
    const r = rover ? 0.45 : 0.28;
    const rects = Collide._r || (Collide._r = []);
    // a rescue glide ignores collisions until it arrives
    if (p.rescue) {
      const ex = p.rescue[0] - p.x, ey = p.rescue[1] - p.y, d = Math.hypot(ex, ey), sp = 7 * dt;
      if (d <= sp) { p.x = p.rescue[0]; p.y = p.rescue[1]; p.rescue = null; } else { p.x += ex / d * sp; p.y += ey / d * sp; }
      return;
    }
    const len = Math.hypot(dx, dy), n = Math.max(1, Math.ceil(len / 0.12));
    for (let i = 0; i < n; i++) {
      p.x += dx / n; p.y += dy / n;
      Collide.near(g, p.x, p.y, r, rects);
      if (rects.length) {
        const before = [p.x, p.y];
        const depth = Collide.resolve(rects, p, r);
        // a building placed on top of the player: push out gently (max ~0.3 s), never block placing
        if (depth > 0.2) {
          const fp = Collide.freePoint(g, before[0], before[1], r);
          p.x = before[0]; p.y = before[1];
          p.rescue = fp; p.rescueSoft = true;
          return;
        }
      }
    }
    // soft no-stand zones while a ship touches down
    for (const z of Collide.zones) {
      if (p.x > z[0] - r && p.x < z[2] + r && p.y > z[1] - r && p.y < z[3] + r) {
        const cx = (z[0] + z[2]) / 2, cy = (z[1] + z[3]) / 2, ex = p.x - cx, ey = p.y - cy, d = Math.hypot(ex, ey) || 1;
        p.x += ex / d * 3 * dt; p.y += ey / d * 3 * dt;
        if (!g._hornAt || g.run.time - g._hornAt > 2) { g._hornAt = g.run.time; g.events.push({ type: 'landingZone' }); }
      }
    }
  },
  zones: [],
  updateZones(g) {
    Collide.zones.length = 0;
    for (const b of g.lists.seller || []) {
      if (!b.customers || SELLER_TIER[b.type] < 2) continue;
      for (const c of b.customers) {
        if (c.state !== 'in' || c.arrive - c.t > 2.2) continue;
        const c0 = b.type === 'port' ? (c.slot % 2 ? [b.x + 5.05, b.y + 3.9] : [b.x + 1.95, b.y + 3.9]) : [b.x + b.w / 2, b.y + b.h / 2 + 0.2];
        const half = b.type === 'dock' ? 2.1 : 1.4;
        Collide.zones.push([c0[0] - half, c0[1] - half, c0[0] + half, c0[1] + half]);
      }
    }
  }
};

// ===== src/core/05_logistics.js =====
// =====================================================================
// Logistics: items, belts, splitters, mergers, crossings, bridges
// =====================================================================
const Items = {
  pool: [],
  live: 0,
  make(res, ref) {
    const it = Items.pool.length ? Items.pool.pop() : { res: 0, ref: 0, p: 0, pp: 0, from: 0 };
    it.res = res; it.ref = ref; it.p = 0; it.pp = 0; it.from = 0; it._born = 0; // _born: render-only spawn marker
    Items.live++;
    return it;
  },
  free(it) { Items.live--; if (Items.pool.length < 20000) Items.pool.push(it); },
  key: it => it.res * 4 + it.ref
};

const Logistics = {
  spacing(grade) { return CONFIG.belt.speed[grade] / CONFIG.belt.throughput[grade]; },
  beltStep(g, b) { return CONFIG.belt.speed[b.grade] * g.mods.beltSpeed * b.boost / CONFIG.tickRate; },

  // Can a building at tile (tx,ty) take an item moving in direction dir? (no side effects)
  wouldAccept(g, b, dir, it, tx, ty) {
    switch (b.type) {
      case 'belt': {
        if (dir === ((b.rot + 2) & 3)) return false;
        const sp = Logistics.spacing(b.grade);
        return b.items.length === 0 || b.items[0].p >= sp;
      }
      case 'splitter': case 'fsplitter': case 'osplitter':
        return dir === b.rot && b.buf.length < 2;
      case 'merger':
        return dir !== ((b.rot + 2) & 3) && b.buf.length < 2;
      case 'crossing': { const l = b.lanes[dir]; return !l || l.length < 2; }
      case 'bridge': {
        if (dir !== b.rot || tx !== b.x || ty !== b.y) return false;
        const q = b.queue; return q.length === 0 || q[q.length - 1].t >= 0.34;
      }
      case 'silo': return b.total < Economy.siloCap(g, b);
      default:
        if (REFINERY_LEVEL[b.type]) {
          if (it.ref !== REFINERY_LEVEL[b.type] - 1) { b.wrongTick = g.tick; return false; }
          return b.inBuf.length < CONFIG.refineBuffer;
        }
        if (SELLER_TIER[b.type] !== undefined) return Economy.sellerAccepts(g, b, it);
        return false;
    }
  },

  // Tries to move item into the tile; returns true when the item now belongs to the target.
  insert(g, tx, ty, dir, it, carry = 0) {
    const id = g.occ.get(U.tileKey(tx, ty));
    if (id === undefined) return false;
    const b = g.buildings.get(id);
    if (!Logistics.wouldAccept(g, b, dir, it, tx, ty)) return false;
    switch (b.type) {
      case 'belt': {
        const sp = Logistics.spacing(b.grade);
        const c = carry > 0 ? Math.min(carry, 0.5) : 0;
        it.p = b.items.length ? Math.min(c, b.items[0].p - sp) : c;
        it.pp = it.p - Logistics.beltStep(g, b);
        it.from = dir;
        b.items.unshift(it);
        return true;
      }
      case 'splitter': case 'fsplitter': case 'osplitter': case 'merger':
        it.from = dir; b.buf.push(it);
        if (b.type === 'merger') b.lastSide = dir;
        return true;
      case 'crossing':
        if (!b.lanes[dir]) b.lanes[dir] = [];
        it.from = dir; b.lanes[dir].push(it); return true;
      case 'bridge':
        b.queue.push({ it, t: 0 }); return true;
      case 'silo':
        Economy.siloAdd(b, Items.key(it), 1); Items.free(it); return true;
      default:
        if (REFINERY_LEVEL[b.type]) { b.inBuf.push(it); return true; }
        if (SELLER_TIER[b.type] !== undefined) { Economy.sellerTake(g, b, it); return true; }
        return false;
    }
  },

  // ---------------- per-tick update of transport nodes ----------------
  tickBelt(g, b) {
    const items = b.items;
    const n = items.length;
    if (!n) return;
    const step = Logistics.beltStep(g, b);
    const sp = Logistics.spacing(b.grade);
    // transfer the front item if it reached the end
    const front = items[n - 1];
    if (front.p >= 1) {
      const tx = b.x + U.DX[b.rot], ty = b.y + U.DY[b.rot];
      if (Logistics.insert(g, tx, ty, b.rot, front, front.p - 1)) { items.pop(); }
    }
    const m = items.length;
    for (let i = m - 1; i >= 0; i--) {
      const it = items[i];
      it.pp = it.p;
      const limit = i === m - 1 ? 1 : items[i + 1].p - sp;
      const np = it.p + step < limit ? it.p + step : limit;
      if (np > it.p) it.p = np;
    }
  },

  splitOutputs(b, it) {
    const f = b.rot, l = (b.rot + 3) & 3, r = (b.rot + 1) & 3;
    if (b.type === 'fsplitter') {
      if (Logistics.matches(b.filter, it)) return [f];
      return b.rr & 1 ? [r, l] : [l, r];
    }
    if (b.type === 'osplitter') return b.rr & 1 ? [f, r, l] : [f, l, r];
    const order = [f, l, r];
    const s = b.rr % 3;
    return [order[s], order[(s + 1) % 3], order[(s + 2) % 3]];
  },
  matches(filter, it) {
    if (!filter) return true;
    if (filter.kind === 'res') return it.res === filter.res;
    if (filter.kind === 'tier') return DATA.RESOURCES[it.res].tier === filter.tier;
    if (filter.kind === 'ref') return it.ref === filter.ref;
    return true;
  },
  tickNode(g, b) {
    switch (b.type) {
      case 'belt': Logistics.tickBelt(g, b); return;
      case 'splitter': case 'fsplitter': case 'osplitter': {
        for (let k = 0; k < 2 && b.buf.length; k++) {
          const it = b.buf[0];
          const outs = Logistics.splitOutputs(b, it);
          let done = false;
          for (const d of outs) {
            if (Logistics.insert(g, b.x + U.DX[d], b.y + U.DY[d], d, it)) { done = true; break; }
          }
          if (!done) break;
          b.buf.shift();
          b.rr++;
        }
        return;
      }
      case 'merger': {
        for (let k = 0; k < 2 && b.buf.length; k++) {
          if (Logistics.insert(g, b.x + U.DX[b.rot], b.y + U.DY[b.rot], b.rot, b.buf[0])) b.buf.shift();
          else break;
        }
        return;
      }
      case 'crossing': {
        for (let d = 0; d < 4; d++) {
          const lane = b.lanes[d];
          if (!lane) continue;
          for (let k = 0; k < 2 && lane.length; k++) {
            if (Logistics.insert(g, b.x + U.DX[d], b.y + U.DY[d], d, lane[0])) lane.shift(); else break;
          }
        }
        return;
      }
      case 'bridge': {
        const q = b.queue;
        if (!q.length) return;
        const step = 6 * g.mods.beltSpeed / CONFIG.tickRate;
        const front = q[0];
        if (front.t >= b.len - 1) {
          const ex = b.x + U.DX[b.rot] * b.len, ey = b.y + U.DY[b.rot] * b.len;
          if (Logistics.insert(g, ex, ey, b.rot, front.it)) q.shift();
        }
        for (let i = 0; i < q.length; i++) {
          const lim = i === 0 ? b.len - 1 : q[i - 1].t - 0.34;
          q[i].pt = q[i].t;
          q[i].t = Math.min(q[i].t + step, lim);
        }
        return;
      }
    }
  },

  // ---------------- topology ----------------
  downstream(g, b) {
    const out = [];
    const add = (x, y) => { const o = Grid.at(g, x, y); if (o && o !== b && TRANSPORT[o.type]) out.push(o); };
    switch (b.type) {
      case 'belt': case 'merger': add(b.x + U.DX[b.rot], b.y + U.DY[b.rot]); break;
      case 'splitter': case 'fsplitter': case 'osplitter':
        for (const d of [b.rot, (b.rot + 1) & 3, (b.rot + 3) & 3]) add(b.x + U.DX[d], b.y + U.DY[d]);
        break;
      case 'crossing': for (let d = 0; d < 4; d++) add(b.x + U.DX[d], b.y + U.DY[d]); break;
      case 'bridge': add(b.x + U.DX[b.rot] * b.len, b.y + U.DY[b.rot] * b.len); break;
    }
    return out;
  },

  computeOrder(g) {
    const nodes = [];
    for (const b of g.buildings.values()) if (TRANSPORT[b.type]) nodes.push(b);
    const up = new Map();
    const downCount = new Map();
    for (const b of nodes) { up.set(b.id, []); }
    for (const b of nodes) {
      const ds = Logistics.downstream(g, b);
      downCount.set(b.id, ds.length);
      for (const d of ds) up.get(d.id).push(b);
    }
    const order = [];
    const seen = new Set();
    const queue = [];
    for (const b of nodes) if (downCount.get(b.id) === 0) { queue.push(b); seen.add(b.id); }
    for (let qi = 0; qi < queue.length; qi++) {
      const b = queue[qi];
      order.push(b);
      for (const u of up.get(b.id)) if (!seen.has(u.id)) { seen.add(u.id); queue.push(u); }
    }
    // cycles / leftovers
    for (const b of nodes) if (!seen.has(b.id)) {
      // walk downstream-first within the cycle
      const stack = [b];
      while (stack.length) {
        const c = stack.pop();
        if (seen.has(c.id)) continue;
        seen.add(c.id); order.push(c);
        for (const u of up.get(c.id)) if (!seen.has(u.id)) stack.push(u);
      }
    }
    g.order = order;
  },

  // Belt chain that a charger touches: walk downstream and upstream through belts.
  chargerBoost(g) {
    for (const b of g.buildings.values()) if (b.type === 'belt') b.boost = 1;
    for (const c of g.buildings.values()) {
      if (c.type !== 'charger') continue;
      const mult = 1 + CONFIG.chargerBonus * (1 + 0.2 * (c.level - 1));
      const start = [...Grid.neighbors(g, c)].filter(o => o.type === 'belt');
      const visited = new Set();
      const stack = start.slice();
      let guard = 0;
      while (stack.length && guard++ < 1500) {
        const b = stack.pop();
        if (visited.has(b.id)) continue;
        visited.add(b.id);
        b.boost = Math.max(b.boost, mult);
        const f = Grid.at(g, b.x + U.DX[b.rot], b.y + U.DY[b.rot]);
        if (f && f.type === 'belt' && !visited.has(f.id)) stack.push(f);
        for (let d = 0; d < 4; d++) {
          if (d === b.rot) continue;
          const o = Grid.at(g, b.x + U.DX[d], b.y + U.DY[d]);
          if (o && o.type === 'belt' && !visited.has(o.id) && o.x + U.DX[o.rot] === b.x && o.y + U.DY[o.rot] === b.y) stack.push(o);
        }
      }
    }
  },

  // Output targets of an extractor (perimeter tiles filtered by mask, only where something could accept).
  extractorOuts(g, b) {
    const outs = [];
    for (const p of Grid.perimeter(b)) {
      if (!(b.outMask & (1 << p[2]))) continue;
      const o = Grid.at(g, p[0], p[1]);
      if (!o) continue;
      if (o.type === 'belt' && o.rot === ((p[2] + 2) & 3)) continue;
      if (o.type === 'belt' || o.type === 'merger' || o.type === 'silo' || o.type === 'crossing' || REFINERY_LEVEL[o.type] || SELLER_TIER[o.type] !== undefined ||
        ((o.type === 'splitter' || o.type === 'fsplitter' || o.type === 'osplitter' || o.type === 'bridge') && o.rot === p[2])) outs.push(p);
    }
    return outs;
  }
};

// ===== src/core/06_economy.js =====
// =====================================================================
// Economy: production, refining, storage, selling, customers, demand, events, contracts
// =====================================================================
const MAX_CUSTOMERS = [3, 2, 1, 1, 1, 0];
const QTY_SCALE = [1, 5, 19, 77, 318, 2270]; // average visit size relative to aliens (saturation scaling)
const ARRIVE_TIME = [5, 4, 3.5, 4, 5, 0];
const WISH_COUNT = [[0.7, 0.25, 0.05], [0.4, 0.45, 0.15], [0.25, 0.5, 0.25], [0.2, 0.5, 0.3], [0.15, 0.5, 0.35], [0.3, 0.5, 0.2]];

const Economy = {
  // ---------------- capacities and rates ----------------
  siloCap(g, b) { return Math.floor(CONFIG.siloCapacity * Math.pow(CONFIG.siloLevelCapacity, b.level - 1) * g.mods.siloCap); },
  shelfCap(g, b) { return Math.floor(CONFIG.shelfCapacity[SELLER_TIER[b.type]] * Math.pow(1.5, b.level - 1) * g.mods.shelfCap); },
  serviceRate(g, b) {
    const t = SELLER_TIER[b.type];
    return CONFIG.serviceRate[t] * Math.pow(1.3, b.level - 1) * g.mods.service * (b.ramps && b.ramps.length ? 1 + CONFIG.rampBonus : 1);
  },
  extractRate(g, b) {
    return CONFIG.extractRate[b.tier] * Math.pow(CONFIG.extractorLevelSpeed, b.level - 1) * (1 + b.bonus) * g.mods.extract;
  },
  refineRate(g, b) {
    return CONFIG.refineRate[REFINERY_LEVEL[b.type] - 1] * Math.pow(1.25, b.level - 1) * (1 + b.bonus) * g.mods.refine;
  },
  arrivalMult(g, b) {
    const t = SELLER_TIER[b.type];
    const same = (g.run.counts[b.type] || 1) - 1;
    let m = g.mods.arrival * Math.pow(CONFIG.sellerLevelArrival, b.level - 1) / (1 + (CONFIG.crowding[t] || 0) * Math.max(0, same));
    if (b.type === 'bazaar') m *= 1 + Math.min(CONFIG.pathBonusMax, b.pathTiles * CONFIG.pathBonusPerTile);
    return m;
  },
  itemValue(res, ref) { return DATA.RESOURCES[res].value * CONFIG.refineFactor[ref]; },

  // ---------------- silo helpers ----------------
  siloAdd(b, key, n) {
    const c = b.store.get(key) || 0;
    b.store.set(key, c + n);
    b.total += n;
  },
  siloTake(b, key, n) {
    const c = b.store.get(key) || 0;
    const t = Math.min(c, n);
    if (t <= 0) return 0;
    if (c - t <= 0) b.store.delete(key); else b.store.set(key, c - t);
    b.total -= t;
    return t;
  },

  // ---------------- per tick: producers ----------------
  tickExtractor(g, b) {
    const dt = 1 / CONFIG.tickRate;
    if (b.buf.length < CONFIG.maxItemsPerBuffer) {
      b.acc += b.rate * dt;
      while (b.acc >= 1 && b.buf.length < CONFIG.maxItemsPerBuffer) {
        b.acc -= 1;
        b.buf.push(Items.make(b.res, 0));
        Economy.onProduced(g, b.res, 0, 1, true);
        b.made++;
      }
      if (b.buf.length < CONFIG.maxItemsPerBuffer) b.blocked = 0;
    } else {
      b.blocked += dt;
      if (b.acc > 1) b.acc = 1;
    }
    const outs = b.outs;
    if (!outs || !outs.length) return;
    for (let k = 0; k < 3 && b.buf.length; k++) {
      let ok = false;
      for (let i = 0; i < outs.length; i++) {
        const o = outs[(b.rr + i) % outs.length];
        if (Logistics.insert(g, o[0], o[1], o[2], b.buf[0])) { b.buf.shift(); b.rr = (b.rr + i + 1) % outs.length; ok = true; break; }
      }
      if (!ok) break;
    }
  },

  tickSilo(g, b) {
    if (!b.outEnabled || b.total <= 0) return;
    const port = b.port;
    if (!port) return;
    for (let k = 0; k < 2 && b.total > 0; k++) {
      let key = -1;
      if (b.outFilter !== null && b.outFilter !== undefined) {
        for (const [kk, c] of b.store) if (c > 0 && Logistics.matches(b.outFilter, { res: kk >> 2, ref: kk & 3 })) { key = kk; break; }
      } else {
        const keys = [...b.store.keys()];
        if (keys.length) key = keys[b.rr % keys.length];
      }
      if (key < 0) return;
      const it = Items.make(key >> 2, key & 3);
      if (Logistics.insert(g, port[0], port[1], b.rot, it)) { Economy.siloTake(b, key, 1); b.rr++; }
      else { Items.free(it); return; }
    }
  },

  tickRefinery(g, b) {
    const dt = 1 / CONFIG.tickRate;
    if (!b.cur && b.inBuf.length && b.outBuf.length < 4) { b.cur = b.inBuf.shift(); }
    if (b.cur) {
      b.prog += b.rate * dt;
      if (b.prog >= 1) {
        b.prog -= 1;
        b.cur.ref++;
        Economy.onProduced(g, b.cur.res, b.cur.ref, 1, false);
        b.outBuf.push(b.cur);
        b.cur = null;
        b.made++;
        if (b.inBuf.length && b.outBuf.length < 4) b.cur = b.inBuf.shift(); else b.prog = 0;
      }
    } else b.prog = 0;
    if (b.outBuf.length && b.port) {
      if (Logistics.insert(g, b.port[0], b.port[1], b.rot, b.outBuf[0])) b.outBuf.shift();
    }
  },

  onProduced(g, res, ref, n, mined) {
    const key = res * 4 + ref;
    if (!g.run.produced.has(key)) { g.run.produced.add(key); g.events.push({ type: 'newProduct', res, ref }); }
    if (mined) {
      const cx = g.meta.codex;
      if (cx.state[res] < 2) { cx.state[res] = 2; g.events.push({ type: 'codex', res }); Progression.onCodex(g); }
      cx.mined[res] += n;
      g.stats.minedByTier[DATA.RESOURCES[res].tier] += n;
      g.run.minedRun[DATA.RESOURCES[res].tier] += n;
    } else {
      g.stats.refined += n;
      if (ref >= 1) Progression.unlock(g, 'refine1');
      if (ref >= 3) Progression.unlock(g, 'refine3');
    }
  },

  // ---------------- sellers ----------------
  wishMatches(w, res, ref) {
    if (ref < w.ref) return false;
    if (w.res >= 0) return w.res === res;
    return DATA.RESOURCES[res].tier === w.tier;
  },
  shelfMatching(b, w) {
    let n = 0;
    for (const [k, c] of b.shelf) if (Economy.wishMatches(w, k >> 2, k & 3)) n += c;
    return n;
  },
  sellerAccepts(g, b, it) {
    if (b.shelfTotal >= Economy.shelfCap(g, b)) return false;
    if (b.type === 'terminal') {
      for (const c of g.run.contracts) for (const r of c.req) {
        if (r.got < r.qty && it.res === r.res && it.ref >= r.ref) {
          const onShelf = b.shelf.get(it.res * 4 + it.ref) || 0;
          if (r.qty - r.got > onShelf) return true;
        }
      }
      return false;
    }
    for (const c of b.customers) {
      if (c.state === 'out') continue;
      for (const w of c.wishes) {
        if (w.got >= w.qty || !Economy.wishMatches(w, it.res, it.ref)) continue;
        if (w.qty - w.got > Economy.shelfMatching(b, w)) return true;
      }
    }
    return b.shelfTotal < Economy.shelfCap(g, b) * CONFIG.shelfPrestock;
  },
  sellerTake(g, b, it) {
    const k = Items.key(it);
    b.shelf.set(k, (b.shelf.get(k) || 0) + 1);
    b.shelfTotal++;
    Items.free(it);
  },

  priceFactor(g, res, custTier) {
    const dm = g.run.demand;
    const vol = Math.max(0.3, 1 - 0.1 * custTier);
    let f = (1 + (dm.d[res] - 1) * vol) * dm.s[res];
    for (const ev of g.run.events) {
      if (ev.res !== res) continue;
      f *= ev.mult >= 1 ? 1 + (ev.mult - 1) * (1 + 0.15 * custTier) : 1 + (ev.mult - 1) * vol;
    }
    return f;
  },
  eventMult(g, res) {
    let m = 1;
    for (const ev of g.run.events) if (ev.res === res) m *= ev.mult;
    return m;
  },

  // Pays for n units sold to a customer of tier ct. Returns revenue.
  pay(g, res, ref, n, ct, opts = {}) {
    if (n <= 0) return 0;
    const base = Economy.itemValue(res, ref);
    const pf = opts.stable ? 1 + (g.run.demand.d[res] - 1) * 0.3 : Economy.priceFactor(g, res, ct);
    const rev = U.safe(base * n * CONFIG.customers[ct].factor * pf * g.mods.sales);
    if (!opts.stable) {
      const t = DATA.RESOURCES[res].tier;
      const dm = g.run.demand;
      dm.s[res] = Math.max(CONFIG.saturationMin, dm.s[res] - n * CONFIG.saturationPerUnit / (1 + t * 0.3) / QTY_SCALE[ct]);
      if (Economy.eventMult(g, res) > 1) Progression.unlock(g, 'event');
    }
    Economy.earn(g, rev);
    const cx = g.meta.codex;
    const unit = rev / n;
    if (unit > cx.best[res]) cx.best[res] = unit;
    g.stats.sold += n;
    g.run.soldRun += n;
    return rev;
  },
  earn(g, rev) {
    rev = U.safe(rev);
    g.run.money = U.safe(g.run.money + rev);
    g.run.earned = U.safe(g.run.earned + rev);
    g.meta.totalEarned = U.safe(g.meta.totalEarned + rev);
    g.incomeAcc += rev;
    if (g.run.earned > 0) Progression.unlock(g, 'firstSale');
  },

  tickSeller(g, b) {
    const dt = 1 / CONFIG.tickRate;
    const tier = SELLER_TIER[b.type];
    if (tier === 5) { Economy.tickTerminal(g, b, dt); return; }
    // arrivals
    if (b.customers.length < MAX_CUSTOMERS[tier]) {
      b.timer -= dt * Economy.arrivalMult(g, b);
      if (b.timer <= 0) {
        b.customers.push(Customers.spawn(g, b, tier));
        const iv = CONFIG.customers[tier].interval;
        b.timer = U.randRange(iv[0], iv[1], g.rnd);
      }
    }
    // service budget
    b.svc = (b.svc || 0) + Economy.serviceRate(g, b) * dt;
    for (let i = b.customers.length - 1; i >= 0; i--) {
      const c = b.customers[i];
      c.t += dt;
      if (c.state === 'in') {
        if (c.t >= c.arrive) { c.state = 'wait'; c.t = 0; }
        continue;
      }
      if (c.state === 'out') {
        if (c.t >= 3) b.customers.splice(i, 1);
        continue;
      }
      // waiting & buying
      let done = true;
      for (const w of c.wishes) {
        if (w.got >= w.qty) continue;
        done = false;
        if (b.svc < 1) continue;
        const want = Math.min(w.qty - w.got, Math.floor(b.svc));
        const got = Economy.takeForWish(g, b, w, want, c, tier);
        if (got > 0) { w.got += got; b.svc -= got; c.buying = 0.4; }
      }
      if (c.buying > 0) c.buying -= dt;
      if (!done) done = c.wishes.every(w => w.got >= w.qty);
      if (done || c.t >= c.patience) Customers.leave(g, b, c, done);
    }
    if (b.svc > 4) b.svc = 4;
  },

  // Takes up to n matching units from the shelf, then adjacent silos (loading ramp). Pays them.
  takeForWish(g, b, w, n, c, tier) {
    let got = 0;
    const takeFrom = (store, isShelf, silo) => {
      for (const [k, cnt] of store) {
        if (got >= n) break;
        const res = k >> 2, ref = k & 3;
        if (!Economy.wishMatches(w, res, ref)) continue;
        const t = Math.min(cnt, n - got);
        if (isShelf) {
          if (cnt - t <= 0) store.delete(k); else store.set(k, cnt - t);
          b.shelfTotal -= t;
        } else Economy.siloTake(silo, k, t);
        c.spent += Economy.pay(g, res, ref, t, tier);
        c.units += t;
        c.lastKey = k;
        got += t;
      }
    };
    takeFrom(b.shelf, true, null);
    if (got < n && b.ramps) for (const s of b.ramps) { if (got >= n) break; if (s.total > 0) takeFrom(s.store, false, s); }
    return got;
  },

  tickTerminal(g, b, dt) {
    b.svc = (b.svc || 0) + Economy.serviceRate(g, b) * dt;
    if (b.svc < 1) return;
    for (const c of g.run.contracts) {
      for (const r of c.req) {
        if (r.got >= r.qty || b.svc < 1) continue;
        const want = Math.min(r.qty - r.got, Math.floor(b.svc));
        let got = 0;
        const takeFrom = (store, isShelf, silo) => {
          for (const [k, cnt] of store) {
            if (got >= want) break;
            const res = k >> 2, ref = k & 3;
            if (res !== r.res || ref < r.ref) continue;
            const t = Math.min(cnt, want - got);
            if (isShelf) { if (cnt - t <= 0) store.delete(k); else store.set(k, cnt - t); b.shelfTotal -= t; }
            else Economy.siloTake(silo, k, t);
            c.paid += Economy.pay(g, res, ref, t, 5, { stable: true });
            got += t;
          }
        };
        takeFrom(b.shelf, true, null);
        if (got < want && b.ramps) for (const s of b.ramps) if (got < want && s.total > 0) takeFrom(s.store, false, s);
        r.got += got; b.svc -= got;
      }
    }
    if (b.svc > 4) b.svc = 4;
  },

  // ---------------- contracts ----------------
  tickContracts(g, dt) {
    const run = g.run;
    if (run.custTier < 5) return;
    const hasTerminal = g.lists.terminal && g.lists.terminal.length > 0;
    for (let i = run.contracts.length - 1; i >= 0; i--) {
      const c = run.contracts[i];
      const complete = c.req.every(r => r.got >= r.qty);
      if (complete) {
        const bonus = c.paid * CONFIG.satisfiedBonus;
        Economy.earn(g, bonus);
        let rp = 0;
        if (g.rnd() < CONFIG.contractRpChance) { rp = 1; g.meta.bonusRp += 1; }
        g.stats.contracts++;
        Progression.unlock(g, 'contract');
        g.events.push({ type: 'contractDone', c, bonus, rp });
        run.contracts.splice(i, 1);
      } else if (run.time >= c.end) {
        g.events.push({ type: 'contractFail', c });
        run.contracts.splice(i, 1);
      }
    }
    if (!hasTerminal) return;
    run.contractTimer -= dt;
    if (run.contracts.length < g.mods.contractSlots && (run.contractTimer <= 0 || run.contracts.length === 0 && run.contractTimer > 30)) {
      if (run.contracts.length === 0 && run.contractTimer > 30) run.contractTimer = 0;
      if (run.contractTimer <= 0) {
        const c = Customers.makeContract(g);
        if (c) { run.contracts.push(c); g.events.push({ type: 'contractNew', c }); }
        const iv = CONFIG.customers[5].interval;
        run.contractTimer = U.randRange(iv[0], iv[1], g.rnd);
      }
    }
  },

  // ---------------- demand, saturation and events ----------------
  tickDemand(g, dt) {
    const dm = g.run.demand;
    const rec = CONFIG.saturationRecover * dt;
    for (let i = 0; i < 91; i++) if (dm.s[i] < 1) dm.s[i] = Math.min(1, dm.s[i] + rec);
    dm.timer -= dt;
    if (dm.timer <= 0) {
      dm.timer += CONFIG.demandInterval;
      for (let i = 0; i < 91; i++) {
        let d = dm.d[i];
        d += (1 - d) * CONFIG.demandRevert + U.gauss(g.rnd) * CONFIG.demandNoise;
        dm.d[i] = U.clamp(d, CONFIG.demandMin, CONFIG.demandMax);
      }
    }
    dm.histTimer -= dt;
    if (dm.histTimer <= 0) {
      dm.histTimer += CONFIG.historyInterval;
      const L = CONFIG.historyLength;
      for (let i = 0; i < 91; i++) dm.hist[i * L + dm.histPos] = dm.d[i] * dm.s[i] * Economy.eventMult(g, i);
      dm.histPos = (dm.histPos + 1) % L;
      dm.histCount = Math.min(L, dm.histCount + 1);
    }
    // events
    const run = g.run;
    for (let i = run.events.length - 1; i >= 0; i--) {
      if (run.time >= run.events[i].end) { g.events.push({ type: 'eventEnd', ev: run.events[i] }); run.events.splice(i, 1); }
    }
    run.eventTimer -= dt * g.mods.eventFreq;
    if (run.eventTimer <= 0) {
      const iv = CONFIG.eventInterval;
      run.eventTimer = U.randRange(iv[0], iv[1], g.rnd);
      Economy.spawnEvent(g);
    }
  },
  spawnEvent(g, forcePositive) {
    const run = g.run;
    const owned = [...new Set([...run.produced].map(k => k >> 2))].filter(r => !run.events.some(e => e.res === r));
    if (!owned.length) return null;
    const res = U.pick(owned, g.rnd);
    const neg = forcePositive === undefined ? g.rnd() < CONFIG.eventNegativeChance : !forcePositive;
    const cfg = neg ? CONFIG.eventNegative : CONFIG.eventPositive;
    let dur = U.randRange(cfg.dur[0], cfg.dur[1], g.rnd);
    if (!neg) dur *= g.mods.eventLen;
    const mult = Math.round(U.randRange(cfg.mult[0], cfg.mult[1], g.rnd) * 10) / 10;
    const ev = { res, mult, start: run.time, end: run.time + dur, pos: !neg, who: neg ? null : U.pick(['Frachter', 'Händlergilde', 'Kolonie', 'Forschungsstation', 'Orbitalwerft'], g.rnd) };
    run.events.push(ev);
    g.events.push({ type: 'eventStart', ev });
    return ev;
  },
  demandTrend(g, res) {
    const dm = g.run.demand, L = CONFIG.historyLength;
    const now = dm.d[res] * dm.s[res] * Economy.eventMult(g, res);
    if (dm.histCount < 2) return { now, arrow: '→', cls: now > 1.15 ? 'up' : now < 0.85 ? 'down' : '' };
    const prev = dm.hist[res * L + ((dm.histPos - 3 + L * 2) % L)] || now;
    const diff = now - prev;
    const arrow = diff > 0.25 ? '↑↑' : diff > 0.04 ? '↑' : diff < -0.25 ? '↓↓' : diff < -0.04 ? '↓' : '→';
    return { now, arrow, cls: now > 1.15 ? 'up' : now < 0.85 ? 'down' : '' };
  },
  history(g, res) {
    const dm = g.run.demand, L = CONFIG.historyLength, out = [];
    for (let i = dm.histCount - 1; i >= 0; i--) out.push(dm.hist[res * L + ((dm.histPos - 1 - i + L * 2) % L)]);
    return out;
  }
};

// =====================================================================
// Customers: spawning, wishes, leaving
// =====================================================================
const Customers = {
  stockKeys(g, b) {
    const m = new Map();
    for (const [k, c] of b.shelf) m.set(k, (m.get(k) || 0) + c);
    if (b.ramps) for (const s of b.ramps) for (const [k, c] of s.store) m.set(k, (m.get(k) || 0) + c);
    return m;
  },
  candidateKeys(g) {
    const list = [...g.run.produced];
    if (list.length) return list;
    // nothing produced yet: wish for what the player can find near the landing site
    const start = g.world.start.deposits.filter(d => d.tier <= 1).map(d => d.res * 4);
    return start.length ? start : [0];
  },

  genWishes(g, b, tier) {
    const rnd = g.rnd;
    const n = U.weighted(WISH_COUNT[tier], rnd) + 1;
    const qr = CONFIG.customers[tier].qty;
    const total = U.randInt(qr[0], qr[1], rnd);
    const stock = Customers.stockKeys(g, b);
    const maxT = CONFIG.wishMaxTier[tier];
    const inRange = k => DATA.RESOURCES[k >> 2].tier <= maxT;
    const stockAll = [...stock.keys()];
    const candAll = Customers.candidateKeys(g);
    const stockIn = stockAll.filter(inRange), candIn = candAll.filter(inRange);
    const wishes = [];
    const weights = [];
    for (let i = 0; i < n; i++) weights.push(0.5 + rnd());
    const wsum = weights.reduce((a, c) => a + c, 0);
    for (let i = 0; i < n; i++) {
      let qty = Math.max(1, Math.round(total * weights[i] / wsum));
      const r = rnd();
      let w;
      if (i > 0 && r < 0.07) {
        // exploration wish: something rarer than anything owned so far
        const maxOwned = Math.max(0, ...candAll.map(k => DATA.RESOURCES[k >> 2].tier));
        const t = Math.min(7, maxT + 1, maxOwned + 1 + (rnd() < 0.3 ? 1 : 0));
        w = { res: -1, tier: t, ref: 0, qty: Math.max(1, Math.round(qty * 0.3)), got: 0, explore: true };
      } else {
        let key;
        const lux = rnd() < CONFIG.luxuryChance;
        const stockList = lux || !stockIn.length ? stockAll : stockIn;
        const cand = lux || !candIn.length ? candAll : candIn;
        if (stockList.length && r < 0.78 && (lux || stockIn.length)) key = U.pick(stockList, rnd);
        else {
          // weight refined products higher for better customers
          const ws = cand.map(k => 1 + (k & 3) * tier * 0.8);
          key = cand[U.weighted(ws, rnd)];
        }
        const res = key >> 2;
        let ref = key & 3;
        if (ref > 0 && rnd() < 0.25) ref--;
        const tierWish = rnd() < 0.06 + 0.04 * tier;
        w = tierWish ? { res: -1, tier: DATA.RESOURCES[res].tier, ref, qty, got: 0 } : { res, tier: DATA.RESOURCES[res].tier, ref, qty, got: 0 };
      }
      const dup = wishes.find(o => o.res === w.res && o.tier === w.tier && o.ref === w.ref);
      if (dup) dup.qty += w.qty; else wishes.push(w);
    }
    return wishes;
  },

  spawn(g, b, tier) {
    const rnd = g.rnd;
    const pat = CONFIG.patience;
    // spawn point for walking aliens: farthest path tile near the bazaar, else a random edge point
    let sx, sy;
    if (tier === 0 && b.pathEnds && b.pathEnds.length) { const p = U.pick(b.pathEnds, rnd); sx = p[0] + 0.5; sy = p[1] + 0.5; }
    else { const a = rnd() * Math.PI * 2; sx = b.x + b.w / 2 + Math.cos(a) * 12; sy = b.y + b.h / 2 + Math.sin(a) * 12; }
    return {
      tier,
      wishes: Customers.genWishes(g, b, tier),
      patience: U.randRange(pat[0], pat[1], rnd) * (1 + 0.6 * tier) * g.mods.patience,
      state: 'in', t: 0, arrive: ARRIVE_TIME[tier],
      sx, sy, skin: Math.floor(rnd() * 6), spent: 0, units: 0, buying: 0, slot: b.customers.length, lastKey: -1
    };
  },

  leave(g, b, c, satisfied) {
    c.state = 'out'; c.t = 0;
    let bonus = 0;
    if (satisfied) {
      bonus = c.spent * CONFIG.satisfiedBonus;
      Economy.earn(g, bonus);
      g.stats.satisfied++;
      if (g.stats.satisfied >= 100) Progression.unlock(g, 'satisfied100');
    }
    c.satisfied = satisfied;
    if (c.units > 0) {
      b.sold += c.units;
      const entry = { t: g.run.time, tier: c.tier, units: c.units, rev: c.spent + bonus, key: c.lastKey, ok: satisfied };
      g.run.salesLog.unshift(entry);
      if (g.run.salesLog.length > 20) g.run.salesLog.length = 20;
      g.events.push({ type: 'sale', b, entry });
      if (g.rnd() < CONFIG.tipChance) {
        g.run.tips.push({ x: b.x + b.w / 2 + (g.rnd() - 0.5) * b.w, y: b.y - 0.3, value: (c.spent + bonus) * CONFIG.tipValue + 1, life: CONFIG.tipLifetime });
      }
    }
  },

  makeContract(g) {
    const rnd = g.rnd;
    const cand = Customers.candidateKeys(g);
    if (!cand.length) return null;
    const n = rnd() < 0.5 ? 1 : 2;
    const qr = CONFIG.customers[5].qty;
    const total = U.randInt(qr[0], qr[1], rnd);
    const req = [];
    for (let i = 0; i < n; i++) {
      const ws = cand.map(k => 1 + (k & 3));
      const key = cand[U.weighted(ws, rnd)];
      if (req.some(r => r.res === (key >> 2))) continue;
      req.push({ res: key >> 2, ref: key & 3, qty: Math.max(100, Math.round(total / n / 50) * 50), got: 0 });
    }
    g.run.contractSeq = (g.run.contractSeq || 0) + 1;
    return { id: g.run.contractSeq, planet: U.pick(DATA.CONTRACT_PLANETS, rnd), req, end: g.run.time + CONFIG.contractDuration, paid: 0 };
  }
};

// ===== src/core/07_progression.js =====
// =====================================================================
// Progression: modifiers, research, customer tiers, rebirth, codex, achievements
// =====================================================================
const Progression = {
  shop(g, id) { return g.meta.shop[id] || 0; },
  has(g, id) { return g.run.research.done.has(id); },

  computeMods(g) {
    const has = id => g.run.research.done.has(id);
    const sh = id => g.meta.shop[id] || 0;
    const sp = g.world.planet.special;
    const m = {};
    m.extract = (1 + (has('drill1') ? 0.10 : 0) + (has('drill2') ? 0.15 : 0) + (has('drill3') ? 0.20 : 0)) * (sp === 'extract' ? 1.1 : 1);
    m.refine = (1 + (has('refSpeed') ? 0.15 : 0)) * (sp === 'refine' ? 1.1 : 1);
    m.beltSpeed = (1 + (has('beltSpeed') ? 0.15 : 0)) * (1 + 0.1 * sh('belts'));
    m.siloCap = (1 + (has('silo2') ? 0.5 : 0) + (has('silo3') ? 1.0 : 0)) * (1 + 0.25 * sh('storage')) * (sp === 'storage' ? 1.25 : 1);
    m.shelfCap = (1 + (has('shelf1') ? 0.5 : 0)) * (1 + 0.25 * sh('storage'));
    m.patience = has('patience') ? 1.3 : 1;
    m.arrival = (1 + (has('traffic1') ? 0.15 : 0)) * (1 + (has('traffic2') ? 0.2 : 0)) * (sp === 'customers' ? 1.15 : 1);
    m.service = has('service') ? 1.4 : 1;
    m.eventLen = (1 + (has('marketing') ? 0.25 : 0)) * (1 + 0.15 * sh('events'));
    m.eventFreq = sp === 'events' ? 1.5 : 1;
    m.scanRadius = CONFIG.scanRadius * (1 + (has('scan1') ? 0.3 : 0) + (has('scan2') ? 0.4 : 0)) * (1 + 0.2 * sh('scanner'));
    m.scanCd = CONFIG.scanCooldown * (has('scanCd') ? 0.6 : 1) * Math.pow(0.9, sh('scanner'));
    m.walk = CONFIG.walkSpeed * (1 + (has('jet1') ? 0.5 : 0) + (has('jet2') ? 0.5 : 0) + (has('rover') ? 1.5 : 0)) * (1 + 0.12 * sh('speed'));
    m.buildRadius = Math.min(CONFIG.maxBuildRadius, CONFIG.buildRadius + (has('radius1') ? 6 : 0) + (has('radius2') ? 8 : 0) + (has('radius3') ? 8 : 0) + 3 * sh('radius'));
    m.undoLimit = has('undo2') ? 60 : CONFIG.undoLimit;
    m.extCap = CONFIG.extractorStartMaxLevel + sh('extCap');
    m.contractSlots = CONFIG.contractSlots + (has('contracts') ? 1 : 0);
    m.researchCost = Math.pow(0.9, sh('research'));
    m.researchSpeed = 1 + 0.2 * sh('research');
    m.offline = 1 + 0.1 * sh('offlineBoost');
    // sales multiplier chain
    const research = 1 + (has('haggle1') ? 0.08 : 0) + (has('haggle2') ? 0.12 : 0) + (has('haggle3') ? 0.18 : 0);
    m.rebirthMult = 1 + CONFIG.rebirthMultPerPoint * g.meta.rpTotal;
    m.codexBonus = 1 + Progression.codexTiersComplete(g) * CONFIG.codexTierBonus;
    m.achBonus = 1 + Progression.achievementBonus(g);
    m.shopSales = 1 + 0.1 * sh('sales');
    m.planetSales = sp === 'sales' ? 1.15 : 1;
    m.researchSales = research;
    m.sales = U.safe(m.rebirthMult * m.codexBonus * m.achBonus * m.shopSales * m.planetSales * research, 1);
    g.mods = m;
    return m;
  },

  // ---------------- research ----------------
  researchCost(g, r) { return r.cost * g.mods.researchCost; },
  researchTime(g, r) {
    let speed = 0;
    for (const b of g.lists.lab || []) speed += Math.pow(1.3, b.level - 1);
    return r.time * CONFIG.researchTimeFactor / (Math.max(1, speed) * g.mods.researchSpeed);
  },
  researchState(g, r) {
    if (g.run.research.done.has(r.id)) return 'done';
    if (g.run.research.active && g.run.research.active.id === r.id) return 'active';
    if (!r.req.every(q => g.run.research.done.has(q))) return 'locked';
    return 'available';
  },
  canResearch(g, r) {
    if (!(g.lists.lab && g.lists.lab.length)) return 'Forschungslabor nötig';
    if (g.run.research.active) return 'Es läuft bereits eine Forschung';
    const st = Progression.researchState(g, r);
    if (st === 'done') return 'Bereits erforscht';
    if (st === 'locked') return 'Voraussetzungen fehlen';
    if (Progression.researchCost(g, r) > g.run.money) return 'Zu teuer';
    return null;
  },
  startResearch(g, id) {
    const r = DATA.RESEARCH_BY_ID[id];
    const err = Progression.canResearch(g, r);
    if (err) return err;
    g.run.money -= Progression.researchCost(g, r);
    g.run.research.active = { id, prog: 0 };
    return null;
  },
  tickResearch(g, dt) {
    const a = g.run.research.active;
    if (!a || !(g.lists.lab && g.lists.lab.length)) return; // paused without a lab
    const r = DATA.RESEARCH_BY_ID[a.id];
    const total = Progression.researchTime(g, r);
    if (!isFinite(total)) return;
    a.prog += dt / total;
    if (a.prog >= 1) Progression.finishResearch(g, a.id);
  },
  finishResearch(g, id) {
    g.run.research.done.add(id);
    g.run.research.active = null;
    g.stats.research++;
    g.topologyDirty = true;
    Progression.computeMods(g);
    g.events.push({ type: 'research', id });
    if (g.stats.research >= 10) Progression.unlock(g, 'research10');
    if (g.run.research.done.size >= DATA.RESEARCH.length) Progression.unlock(g, 'researchAll');
  },

  // ---------------- customer tiers ----------------
  checkTiers(g) {
    const run = g.run;
    while (run.custTier < 5 && run.earned >= CONFIG.customers[run.custTier + 1].unlock) {
      run.custTier++;
      g.events.push({ type: 'tier', tier: run.custTier });
      Progression.unlock(g, 'cust' + (run.custTier + 1));
    }
  },

  // ---------------- codex ----------------
  codexTiersComplete(g) {
    let n = 0;
    for (let t = 0; t < 8; t++) if (DATA.BY_TIER[t].every(r => g.meta.codex.state[r] >= 2)) n++;
    return n;
  },
  codexCount(g) { let n = 0; for (let i = 0; i < 91; i++) if (g.meta.codex.state[i] >= 2) n++; return n; },
  onCodex(g) {
    const n = Progression.codexCount(g);
    if (n >= 45) Progression.unlock(g, 'codex45');
    if (n >= 91) Progression.unlock(g, 'codexFull');
    for (let t = 0; t < 8; t++) {
      if (DATA.BY_TIER[t].some(r => g.meta.codex.state[r] >= 2)) Progression.unlock(g, 'tier' + t);
    }
    Progression.computeMods(g);
  },
  seeDeposit(g, d) {
    if (g.meta.codex.state[d.res] < 1) g.meta.codex.state[d.res] = 1;
  },

  // ---------------- achievements ----------------
  achievementBonus(g) {
    let s = 0;
    for (const id of g.meta.ach) { const a = DATA.ACH_BY_ID[id]; if (a) s += a.bonus; }
    return s;
  },
  unlock(g, id) {
    if (g.meta.ach.has(id) || !DATA.ACH_BY_ID[id]) return;
    g.meta.ach.add(id);
    g.events.push({ type: 'achievement', id });
    g.modsDirty = true;
  },
  checkAchievements(g) {
    const st = g.stats, run = g.run;
    if (g.meta.totalEarned >= 1e3) Progression.unlock(g, 'earn1k');
    if (g.meta.totalEarned >= 1e5) Progression.unlock(g, 'earn100k');
    if (g.meta.totalEarned >= 1e7) Progression.unlock(g, 'earn10m');
    if (g.meta.totalEarned >= 1e9) Progression.unlock(g, 'earn1b');
    if (g.meta.totalEarned >= 1e12) Progression.unlock(g, 'earn1t');
    const belts = run.counts.belt || 0;
    if (belts >= 100) Progression.unlock(g, 'belts100');
    if (belts >= 1000) Progression.unlock(g, 'belts1000');
    if ((g.lists.extractor || []).length > 0) Progression.unlock(g, 'firstExtractor');
    if ((g.lists.extractor || []).some(b => b.level >= 10)) Progression.unlock(g, 'maxLevel');
    let big = 0;
    for (const b of g.buildings.values()) if (!TRANSPORT[b.type] && !Grid.isDeco(b.type)) big++;
    if (big >= 100) Progression.unlock(g, 'buildings100');
    const L = CONFIG.landing;
    if (U.dist2(run.player.x, run.player.y, L.x, L.y) > 500 * 500) Progression.unlock(g, 'explorer');
    if (g.meta.rebirths >= 1) Progression.unlock(g, 'rebirth1');
    if (g.meta.rebirths >= 5) Progression.unlock(g, 'rebirth5');
    if (g.meta.rebirths >= 10) Progression.unlock(g, 'rebirth10');
    if (run.planet >= 8) Progression.unlock(g, 'planet8');
    if (g.world.start.luck >= 2) Progression.unlock(g, 'jackpot');
  },

  // ---------------- rebirth ----------------
  threshold(k) { return CONFIG.rebirthBase * Math.pow(CONFIG.rebirthGrowth, k - 1); },
  rebirthPoints(g) {
    const th = Progression.threshold(g.run.planet);
    if (g.run.earned < th) return 0;
    return Math.max(1, Math.floor(Math.sqrt(g.run.earned / th)));
  },
  rebirthPreview(g) {
    const p = Progression.rebirthPoints(g);
    const total = g.meta.rpTotal + p + (p > 0 ? g.meta.bonusRp : 0);
    return { points: p, bonus: g.meta.bonusRp, newMult: 1 + CONFIG.rebirthMultPerPoint * total, threshold: Progression.threshold(g.run.planet), next: Math.min(g.meta.maxPlanet + 1, Math.max(g.meta.maxPlanet, g.run.planet + 1)) };
  },
  buyShop(g, id) {
    const def = DATA.REBIRTH_BY_ID[id];
    const lvl = g.meta.shop[id] || 0;
    if (lvl >= def.max) return 'Maximale Stufe erreicht';
    const c = DATA.rebirthUpgradeCost(def, lvl);
    if (c > g.meta.rp) return 'Zu wenig Rebirth-Punkte';
    g.meta.rp -= c;
    g.meta.shop[id] = lvl + 1;
    Progression.computeMods(g);
    g.topologyDirty = true;
    return null;
  }
};

// ===== src/core/08_offline.js =====
// =====================================================================
// Offline: expected-value simulation in coarse steps (no randomness, average prices)
// =====================================================================
const Offline = {
  // Follows an output into the transport network; returns [{node, frac, path:[transport nodes]}].
  trace(g, tx, ty, dir, visited, depth = 0) {
    if (depth > 4000) return [];
    const b = Grid.at(g, tx, ty);
    if (!b) return [];
    const key = b.id * 4 + dir;
    if (visited.has(key)) return [];
    visited.add(key);
    const cont = (nb, nx, ny, nd) => Offline.trace(g, nx, ny, nd, visited, depth + 1).map(r => ({ node: r.node, frac: r.frac, path: [nb].concat(r.path) }));
    switch (b.type) {
      case 'belt':
        if (dir === ((b.rot + 2) & 3)) return [];
        return cont(b, b.x + U.DX[b.rot], b.y + U.DY[b.rot], b.rot);
      case 'merger':
        if (dir === ((b.rot + 2) & 3)) return [];
        return cont(b, b.x + U.DX[b.rot], b.y + U.DY[b.rot], b.rot);
      case 'crossing':
        return cont(b, b.x + U.DX[dir], b.y + U.DY[dir], dir);
      case 'bridge':
        if (dir !== b.rot || tx !== b.x || ty !== b.y) return [];
        return cont(b, b.x + U.DX[b.rot] * b.len, b.y + U.DY[b.rot] * b.len, b.rot);
      case 'splitter': case 'fsplitter': case 'osplitter': {
        if (dir !== b.rot) return [];
        const outs = [b.rot, (b.rot + 3) & 3, (b.rot + 1) & 3].map(d => cont(b, b.x + U.DX[d], b.y + U.DY[d], d)).filter(r => r.length);
        if (!outs.length) return [];
        if (b.type === 'osplitter') return outs[0];
        const res = [];
        for (const o of outs) for (const r of o) res.push({ node: r.node, frac: r.frac / outs.length, path: r.path });
        return res;
      }
      case 'silo': return [{ node: b, frac: 1, path: [] }];
      case 'terminal': return [];
      default:
        if (REFINERY_LEVEL[b.type] || SELLER_TIER[b.type] !== undefined) return [{ node: b, frac: 1, path: [] }];
        return [];
    }
  },

  nodeCap(g, b) {
    if (b.type === 'belt') return CONFIG.belt.throughput[b.grade] * g.mods.beltSpeed * b.boost;
    return 40;
  },

  // Builds flow routes for all producers.
  build(g) {
    if (g.topologyDirty) Game.recompute(g);
    const routes = new Map(); // building id -> [{node, frac, scale}]
    const load = new Map();
    const addRoutes = (src, list, rate) => {
      routes.set(src.id, list.map(r => ({ node: r.node, frac: r.frac, path: r.path, scale: 1 })));
      for (const r of list) for (const n of r.path) load.set(n.id, (load.get(n.id) || 0) + rate * r.frac);
    };
    for (const b of g.lists.extractor) {
      let list = [];
      const seen = new Set();
      for (const o of (b.outs || [])) {
        const ds = o.slice(0, 2).join(',');
        if (seen.has(ds)) continue; seen.add(ds);
        list = list.concat(Offline.trace(g, o[0], o[1], o[2], new Set()));
      }
      // split evenly between all reachable outputs
      const n = list.length;
      list.forEach(r => { r.frac = r.frac / Math.max(1, (b.outs || []).length > 0 ? 1 : 1); });
      const total = list.reduce((a, r) => a + r.frac, 0) || 1;
      list.forEach(r => { r.frac /= total; });
      if (n) addRoutes(b, list, b.rate);
    }
    for (const b of g.lists.refinery) if (b.port) addRoutes(b, Offline.trace(g, b.port[0], b.port[1], b.rot, new Set()), b.rate);
    for (const b of g.lists.silo) if (b.port && b.outEnabled) addRoutes(b, Offline.trace(g, b.port[0], b.port[1], b.rot, new Set()), 10);
    // proportional capacity scaling for shared belts
    for (const list of routes.values()) for (const r of list) {
      let s = 1;
      for (const n of r.path) { const l = load.get(n.id) || 0; if (l > 0) s = Math.min(s, Offline.nodeCap(g, n) / l); }
      r.scale = Math.min(1, s);
      r.cap = r.path.length ? Math.min(...r.path.map(n => Offline.nodeCap(g, n))) : 40;
    }
    return routes;
  },

  sellerDemandRate(g, b) {
    const t = SELLER_TIER[b.type];
    const c = CONFIG.customers[t];
    const interval = (c.interval[0] + c.interval[1]) / 2 / Economy.arrivalMult(g, b);
    const qty = (c.qty[0] + c.qty[1]) / 2;
    return Math.min(Economy.serviceRate(g, b), qty / interval * 0.85);
  },

  simulate(g, seconds) {
    seconds = U.clamp(U.safe(seconds), 0, CONFIG.offlineMax);
    const rep = { seconds, earned: 0, mined: new Array(8).fill(0), sold: 0, storageLimited: false, blockedShare: 0 };
    if (seconds <= 0) return rep;
    const routes = Offline.build(g);
    const step = CONFIG.offlineStep;
    const steps = Math.min(480, Math.ceil(seconds / step));
    const dtStep = seconds / steps;
    const sellers = g.lists.seller.filter(b => b.type !== 'terminal');
    const sellerRate = new Map(sellers.map(b => [b.id, Offline.sellerDemandRate(g, b)]));
    const refRate = new Map(g.lists.refinery.map(b => [b.id, b.rate]));
    const mult = g.mods.sales * g.mods.offline * (1 + CONFIG.satisfiedBonus * 0.6);
    const sellCap = new Map(), refCap = new Map();
    let wanted = 0, got = 0;

    const sell = (b, key, amt) => {
      const cap = sellCap.get(b.id) || 0;
      // customers mostly ask for resources within their range (see CONFIG.wishMaxTier)
      if (DATA.RESOURCES[key >> 2].tier > CONFIG.wishMaxTier[SELLER_TIER[b.type]]) amt *= CONFIG.luxuryChance;
      const take = Math.min(cap, amt);
      if (take <= 0) return 0;
      sellCap.set(b.id, cap - take);
      const res = key >> 2, ref = key & 3;
      const rev = U.safe(Economy.itemValue(res, ref) * take * CONFIG.customers[SELLER_TIER[b.type]].factor * mult);
      rep.earned += rev; rep.sold += take;
      return take;
    };
    const deliverRoutes = (list, key, amt, depth) => {
      let acc = 0;
      for (const r of list) acc += deliver(r.node, key, amt * r.frac * r.scale, depth);
      return acc;
    };
    const deliver = (node, key, amt, depth) => {
      if (amt <= 0 || depth > 6) return 0;
      if (node.type === 'silo') {
        const space = Economy.siloCap(g, node) - node.total;
        const take = Math.max(0, Math.min(space, amt));
        if (take < amt) rep.storageLimited = true;
        if (take > 0) Economy.siloAdd(node, key, take);
        return take;
      }
      if (REFINERY_LEVEL[node.type]) {
        if ((key & 3) !== REFINERY_LEVEL[node.type] - 1) return 0;
        const cap = refCap.get(node.id) || 0;
        const take = Math.min(cap, amt);
        if (take <= 0) return 0;
        const out = routes.get(node.id) || [];
        const passed = deliverRoutes(out, key + 1, take, depth + 1);
        refCap.set(node.id, cap - passed);
        if (passed > 0) g.stats.refined += passed;
        return passed;
      }
      if (SELLER_TIER[node.type] !== undefined) return sell(node, key, amt);
      return 0;
    };

    for (let s = 0; s < steps; s++) {
      for (const b of sellers) sellCap.set(b.id, sellerRate.get(b.id) * dtStep);
      for (const b of g.lists.refinery) refCap.set(b.id, refRate.get(b.id) * dtStep);
      // 1) extractors push into their chains
      for (const b of g.lists.extractor) {
        const list = routes.get(b.id);
        const amt = b.rate * dtStep;
        wanted += amt;
        if (!list) continue;
        const acc = deliverRoutes(list, b.res * 4, amt, 0);
        got += acc;
        rep.mined[b.tier] += acc;
        g.meta.codex.mined[b.res] += acc;
      }
      // 2) silo outputs
      for (const b of g.lists.silo) {
        const list = routes.get(b.id);
        if (!list || !list.length || b.total <= 0) continue;
        const cap = Math.min(b.total, (list[0].cap || 10) * dtStep);
        const keys = [...b.store.entries()].filter(([k]) => !b.outFilter || Logistics.matches(b.outFilter, { res: k >> 2, ref: k & 3 }));
        const sum = keys.reduce((a, e) => a + e[1], 0);
        if (sum <= 0) continue;
        for (const [k, c] of keys) {
          const want = cap * c / sum;
          const acc = deliverRoutes(list, k, want, 0);
          Economy.siloTake(b, k, acc);
        }
      }
      // 3) loading ramps: sellers pull from adjacent silos
      for (const b of sellers) {
        if (!b.ramps || !b.ramps.length) continue;
        for (const silo of b.ramps) {
          let cap = sellCap.get(b.id) || 0;
          if (cap <= 0 || silo.total <= 0) break;
          const entries = [...silo.store.entries()];
          const sum = entries.reduce((a, e) => a + e[1], 0);
          for (const [k, c] of entries) {
            const want = Math.min(c, cap * c / sum);
            const taken = sell(b, k, want);
            Economy.siloTake(silo, k, taken);
          }
          cap = sellCap.get(b.id) || 0;
        }
      }
    }
    // silo stores may hold fractional amounts now: round down
    for (const b of g.lists.silo) {
      for (const [k, c] of [...b.store.entries()]) { const f = Math.floor(c); if (f <= 0) b.store.delete(k); else b.store.set(k, f); }
      b.total = 0; for (const c of b.store.values()) b.total += c;
    }
    rep.blockedShare = wanted > 0 ? 1 - got / wanted : 0;
    for (let t = 0; t < 8; t++) g.stats.minedByTier[t] += rep.mined[t];
    rep.earned = U.safe(rep.earned);
    return rep;
  },

  apply(g, rep) {
    Economy.earn(g, rep.earned);
    g.incomeAcc = 0;
    g.stats.offlineEarned += rep.earned;
    g.stats.sold += rep.sold;
    Progression.checkTiers(g);
    if (rep.earned > 0) Progression.unlock(g, 'offline');
  }
};

// ===== src/core/09_save.js =====
// =====================================================================
// Save: serialisation, versioning, migration, export/import
// =====================================================================
const Save = {
  KEY: 'aresOutpost.save',
  BACKUP: 'aresOutpost.backup',
  SETTINGS: 'aresOutpost.settings',

  mapToArr: m => [...m.entries()].map(([k, v]) => [k, Math.round(v * 1000) / 1000]),

  toObject(g, extra = {}) {
    const m = g.meta, r = g.run;
    const bl = [];
    for (const b of g.buildings.values()) {
      const o = { i: b.id, t: b.type, x: b.x, y: b.y, r: b.rot, l: b.level, p: Math.round(b.paid * 100) / 100 };
      if (b.type === 'belt') { o.g = b.grade; if (b.items.length) o.it = b.items.map(it => Items.key(it)); }
      if (b.type === 'bridge') { o.n = b.len; if (b.queue.length) o.it = b.queue.map(q => Items.key(q.it)); }
      if (b.filter) o.f = b.filter;
      if (b.type === 'extractor') { o.d = b.dep; o.rs = b.res; o.tr = b.tier; o.om = b.outMask; if (b.buf.length) o.it = b.buf.map(it => Items.key(it)); }
      if (b.buf && b.type !== 'extractor' && b.buf.length) o.it = b.buf.map(it => Items.key(it));
      if (b.type === 'silo') { o.st = Save.mapToArr(b.store); o.of = b.outFilter; o.oe = b.outEnabled; }
      if (b.shelf && b.shelf.size) o.sh = Save.mapToArr(b.shelf);
      if (b.inBuf) { const keys = b.inBuf.concat(b.outBuf).map(it => Items.key(it)); if (b.cur) keys.push(Items.key(b.cur)); if (keys.length) o.it = keys; }
      bl.push(o);
    }
    return {
      version: SAVE_VERSION,
      game: GAME_TITLE,
      savedAt: Date.now(),
      lastSeen: extra.lastSeen || Date.now(),
      meta: {
        baseSeed: m.baseSeed, rebirths: m.rebirths, rp: m.rp, rpTotal: m.rpTotal, bonusRp: m.bonusRp,
        shop: m.shop, maxPlanet: m.maxPlanet,
        codex: { state: Array.from(m.codex.state), mined: Array.from(m.codex.mined, v => Math.round(v)), best: Array.from(m.codex.best, v => Math.round(v * 100) / 100) },
        ach: [...m.ach], totalEarned: m.totalEarned, tutorial: m.tutorial, introSeen: m.introSeen,
        stats: m.stats, earnHistory: m.earnHistory
      },
      run: {
        planet: r.planet, seed: r.seed, money: r.money, earned: r.earned, time: r.time,
        player: { x: r.player.x, y: r.player.y }, home: r.home, counts: r.counts,
        research: { done: [...r.research.done], active: r.research.active },
        custTier: r.custTier,
        demand: { d: Array.from(r.demand.d, v => Math.round(v * 1000) / 1000), s: Array.from(r.demand.s, v => Math.round(v * 1000) / 1000) },
        events: r.events, eventTimer: r.eventTimer, contracts: r.contracts, contractTimer: r.contractTimer, contractSeq: r.contractSeq,
        produced: [...r.produced], salesLog: r.salesLog, tips: r.tips, pins: r.pins,
        scanCd: r.scanCd, probeCd: r.probeCd, probeTarget: r.probeTarget, kits: r.kits,
        minedRun: r.minedRun, soldRun: r.soldRun, startShown: r.startShown,
        landerSite: r.lander ? { x: r.lander.x, y: r.lander.y } : undefined, luckyRevealSeen: r.luckyRevealSeen || undefined
      },
      world: { disc: [...g.world.discovered.entries()], known: [...g.world.known] },
      buildings: bl,
      undoDepth: 0,
      camera: extra.camera || null
    };
  },

  // Version migrations: each takes an object of version v and returns version v+1.
  migrations: {
    1: o => { o.run.pins = o.run.pins || []; o.version = 2; return o; },
    2: o => { o.run.kits = o.run.kits || {}; o.meta.bonusRp = o.meta.bonusRp || 0; o.version = 3; return o; }
  },
  migrate(o) {
    if (!o || typeof o !== 'object') throw new Error('Kein Spielstand');
    if (typeof o.version !== 'number') throw new Error('Version fehlt');
    if (o.version > SAVE_VERSION) throw new Error('Spielstand ist neuer als das Spiel');
    while (o.version < SAVE_VERSION) {
      const f = Save.migrations[o.version];
      if (!f) throw new Error('Keine Migration für Version ' + o.version);
      o = f(o);
    }
    return o;
  },

  fromObject(o) {
    o = Save.migrate(o);
    if (!o.meta || !o.run || !Array.isArray(o.buildings)) throw new Error('Unvollständiger Spielstand');
    const mm = o.meta;
    const meta = Game.createMeta(mm.baseSeed);
    meta.rebirths = mm.rebirths | 0; meta.rp = +mm.rp || 0; meta.rpTotal = +mm.rpTotal || 0; meta.bonusRp = +mm.bonusRp || 0;
    meta.shop = Object.assign({}, mm.shop); meta.maxPlanet = Math.max(1, mm.maxPlanet | 0);
    if (mm.codex) {
      for (let i = 0; i < 91; i++) {
        meta.codex.state[i] = mm.codex.state[i] | 0;
        meta.codex.mined[i] = +mm.codex.mined[i] || 0;
        meta.codex.best[i] = +mm.codex.best[i] || 0;
      }
    }
    meta.ach = new Set(mm.ach || []);
    meta.totalEarned = U.safe(+mm.totalEarned || 0);
    meta.tutorial = mm.tutorial || { done: false, step: 0 };
    meta.introSeen = !!mm.introSeen;
    meta.stats = Object.assign(Game.newStats(), mm.stats || {});
    if (!Array.isArray(meta.stats.minedByTier) || meta.stats.minedByTier.length !== 8) meta.stats.minedByTier = new Array(8).fill(0);
    meta.earnHistory = Array.isArray(mm.earnHistory) ? mm.earnHistory : [];

    const r = o.run;
    const g = Game.create(meta, Math.max(1, r.planet | 0), { seed: r.seed >>> 0 });
    const run = g.run;
    run.money = U.safe(+r.money || 0); run.earned = U.safe(+r.earned || 0); run.time = +r.time || 0;
    run.player.x = +r.player.x || run.player.x; run.player.y = +r.player.y || run.player.y;
    if (r.home) run.home = r.home;
    run.counts = r.counts || {};
    run.research.done = new Set(r.research ? r.research.done : []);
    run.research.active = r.research && r.research.active && DATA.RESEARCH_BY_ID[r.research.active.id] ? r.research.active : null;
    run.custTier = U.clamp(r.custTier | 0, 0, 5);
    if (r.demand) for (let i = 0; i < 91; i++) { run.demand.d[i] = U.clamp(+r.demand.d[i] || 1, 0.5, 2); run.demand.s[i] = U.clamp(+r.demand.s[i] || 1, 0.4, 1); }
    run.events = (r.events || []).filter(e => e && typeof e.res === 'number');
    run.eventTimer = +r.eventTimer || 200;
    run.contracts = r.contracts || []; run.contractTimer = +r.contractTimer || 60; run.contractSeq = r.contractSeq | 0;
    run.produced = new Set(r.produced || []);
    run.salesLog = r.salesLog || []; run.tips = r.tips || []; run.pins = r.pins || [];
    run.scanCd = +r.scanCd || 0; run.probeCd = +r.probeCd || 0; run.probeTarget = r.probeTarget || null;
    run.kits = Object.assign({}, r.kits || {});
    run.minedRun = Array.isArray(r.minedRun) ? r.minedRun : new Array(8).fill(0);
    run.soldRun = +r.soldRun || 0; run.startShown = !!r.startShown;
    if (r.landerSite && isFinite(r.landerSite.x) && isFinite(r.landerSite.y)) run.lander = { x: Math.round(r.landerSite.x), y: Math.round(r.landerSite.y) };
    run.luckyRevealSeen = !!r.luckyRevealSeen;
    if (o.world) {
      g.world.discovered = new Map(o.world.disc || []);
      g.world.known = new Set(o.world.known || []);
    }
    Progression.computeMods(g);
    // buildings
    const counts = {};
    for (const s of o.buildings) {
      if (!DATA.BUILDINGS[s.t]) continue;
      const spec = { id: s.i, type: s.t, x: s.x, y: s.y, rot: s.r & 3, level: s.l || 1, paid: +s.p || 0, grade: s.g || 0, len: s.n, filter: s.f || null,
        dep: s.d, res: s.rs, tier: s.tr, outMask: s.om, outFilter: s.of || null, outEnabled: s.oe !== false };
      if (Grid.occTiles(spec.type, spec.x, spec.y, spec.rot, spec.len).some(t => g.occ.has(U.tileKey(t[0], t[1])))) continue;
      if (spec.type === 'extractor') {
        const d = World.depositById(g.world, spec.dep);
        if (!d) continue;
        spec.res = d.res; spec.tier = d.tier;
      }
      const b = Grid.make(g, spec);
      Grid.register(g, b);
      const ck = Grid.countKey(b.type, b.tier);
      counts[ck] = (counts[ck] || 0) + 1;
      const items = (s.it || []).filter(k => k >= 0 && k < 364).map(k => Items.make(k >> 2, k & 3));
      if (b.type === 'belt') {
        const sp = Logistics.spacing(b.grade);
        const keep = items.slice(0, Math.floor(1 / sp + 1e-9) + 1);
        keep.forEach((it, i) => { it.p = Math.max(0, 1 - (keep.length - 1 - i) * sp); it.pp = it.p; it.from = b.rot; });
        items.slice(keep.length).forEach(it => Items.free(it));
        b.items = keep;
      } else if (b.type === 'bridge') {
        b.queue = items.map((it, i) => ({ it, t: Math.max(0, b.len - 1 - i * 0.4) })).filter(q => q.t >= 0);
      } else if (b.type === 'extractor' || b.buf) {
        b.buf = items.slice(0, CONFIG.maxItemsPerBuffer);
      } else if (b.inBuf) {
        for (const it of items) { if (it.ref === REFINERY_LEVEL[b.type] - 1 && b.inBuf.length < CONFIG.refineBuffer) b.inBuf.push(it); else if (b.outBuf.length < 4) b.outBuf.push(it); else Items.free(it); }
      }
      if (b.type === 'silo' && s.st) for (const [k, c] of s.st) if (c > 0) Economy.siloAdd(b, k | 0, Math.floor(c));
      if (b.shelf && s.sh) for (const [k, c] of s.sh) if (c > 0) { b.shelf.set(k | 0, Math.floor(c)); b.shelfTotal += Math.floor(c); }
    }
    // counts drive cost growth: trust the rebuilt state
    run.counts = counts;
    g.topologyDirty = true;
    Game.recompute(g);
    return { game: g, lastSeen: +o.lastSeen || Date.now(), camera: o.camera || null };
  },

  serialize(g, extra) { return JSON.stringify(Save.toObject(g, extra)); },
  exportString(g, extra) { return 'AO1:' + Codec.pack(Save.serialize(g, extra)); },
  parseImport(text) {
    text = (text || '').trim();
    if (!text) throw new Error('Leerer Text');
    let json;
    if (text.startsWith('AO1:')) json = Codec.unpack(text.slice(4));
    else if (text.startsWith('{')) json = text;
    else throw new Error('Unbekanntes Format');
    const obj = JSON.parse(json);
    // validate by building a full game from it without touching the current one
    const loaded = Save.fromObject(JSON.parse(json));
    return { obj, loaded };
  },

  // localStorage wrappers (all failures are reported, never thrown)
  storage() {
    try { if (typeof localStorage === 'undefined') return null; const k = '__ao_test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) { return null; }
  },
  write(g, extra) {
    const ls = Save.storage();
    if (!ls) return { ok: false, err: 'Speicher nicht verfügbar' };
    try {
      const data = Save.serialize(g, extra);
      const prev = ls.getItem(Save.KEY);
      if (prev) { try { ls.setItem(Save.BACKUP, prev); } catch (e) { /* backup is optional */ } }
      ls.setItem(Save.KEY, data);
      return { ok: true, size: data.length };
    } catch (e) {
      return { ok: false, err: 'Speicher voll oder gesperrt' };
    }
  },
  read(key = Save.KEY) {
    const ls = Save.storage();
    if (!ls) return null;
    try { const s = ls.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  },
  load() {
    for (const key of [Save.KEY, Save.BACKUP]) {
      const o = Save.read(key);
      if (!o) continue;
      try { return Object.assign(Save.fromObject(o), { fromBackup: key === Save.BACKUP }); } catch (e) { /* try backup */ }
    }
    return null;
  },
  writeRaw(obj) {
    const ls = Save.storage();
    if (!ls) return false;
    try {
      const prev = ls.getItem(Save.KEY);
      if (prev) ls.setItem(Save.BACKUP, prev);
      ls.setItem(Save.KEY, JSON.stringify(obj));
      return true;
    } catch (e) { return false; }
  },
  wipe() {
    const ls = Save.storage();
    if (!ls) return;
    try { ls.removeItem(Save.KEY); ls.removeItem(Save.BACKUP); } catch (e) { /* ignore */ }
  }
};

// ===== src/core/10_game.js =====
// =====================================================================
// Game: state creation, tick orchestration, scanner, rebirth
// =====================================================================
const Game = {
  createMeta(baseSeed) {
    return {
      baseSeed: (baseSeed === undefined ? RNG.newSeed() : baseSeed) >>> 0,
      rebirths: 0, rp: 0, rpTotal: 0, bonusRp: 0, shop: {}, maxPlanet: 1,
      codex: { state: new Uint8Array(91), mined: new Float64Array(91), best: new Float64Array(91) },
      ach: new Set(),
      totalEarned: 0,
      tutorial: { done: false, step: 0 },
      introSeen: false,
      stats: Game.newStats(),
      earnHistory: []
    };
  },
  newStats() {
    return { playTime: 0, minedByTier: new Array(8).fill(0), sold: 0, refined: 0, satisfied: 0, research: 0, contracts: 0, extractorsBuilt: 0, bestRunEarned: 0, bestIncome: 0, offlineEarned: 0, scans: 0, runs: [] };
  },
  planetSeed(meta, k) { return RNG.hash(meta.baseSeed, k, 0x5eed); },

  create(meta, k, opts = {}) {
    const seed = opts.seed !== undefined ? opts.seed : Game.planetSeed(meta, k);
    const world = World.create(seed, k, { luckLevel: meta.shop.luck || 0 });
    const L = CONFIG.landing;
    const g = {
      meta, stats: meta.stats, world,
      buildings: new Map(), occ: new Map(), bchunk: new Map(), depUse: new Map(),
      nextId: 1, order: [], lists: {}, mods: null,
      topologyDirty: true, modsDirty: false,
      events: [], tick: 0,
      rnd: RNG.mulberry32(RNG.hash(seed, meta.rebirths, Date.now() & 0xffff)),
      undo: [], redo: [],
      incomeAcc: 0, incomeBuf: new Float64Array(30), incomePos: 0, incomeTimer: 0, income: 0,
      input: { x: 0, y: 0, sprint: false },
      lastCell: null, warnTimer: 0, notified: new Map()
    };
    const sh = id => meta.shop[id] || 0;
    const kitLvl = sh('kit');
    g.run = {
      planet: k, seed,
      money: CONFIG.startMoney + 400 * (Math.pow(2, sh('capital')) - 1),
      earned: 0, time: 0,
      player: { x: L.x + 0.5, y: L.y + 0.5, vx: 0, vy: 0, face: 1, moving: false },
      home: { x: L.x + 0.5, y: L.y + 0.5 },
      counts: {},
      research: { done: new Set(), active: null },
      custTier: Math.min(2, sh('startTier')),
      demand: {
        d: new Float64Array(91).fill(1), s: new Float64Array(91).fill(1),
        hist: new Float32Array(91 * CONFIG.historyLength).fill(1), histPos: 0, histCount: 0,
        timer: CONFIG.demandInterval, histTimer: CONFIG.historyInterval
      },
      events: [], eventTimer: 120 + (seed % 120),
      contracts: [], contractTimer: 60, contractSeq: 0,
      produced: new Set(), salesLog: [], tips: [], pins: [],
      scanCd: 0, scanPing: null, probeCd: 0, probeTarget: null,
      kits: {
        extractor: kitLvl >= 1 ? (kitLvl >= 2 ? 2 : 1) : 0, bazaar: kitLvl >= 1 ? 1 : 0, belt: kitLvl >= 1 ? (kitLvl >= 3 ? 100 : 40) : 0,
        silo: kitLvl >= 2 ? 1 : 0, refinery1: kitLvl >= 2 ? 1 : 0, lab: kitLvl >= 3 ? 1 : 0
      },
      minedRun: new Array(8).fill(0), soldRun: 0,
      startShown: false, luckyRevealSeen: false, lander: null
    };
    Progression.computeMods(g);
    World.discover(world, L.x, L.y, CONFIG.viewDiscoverRadius + 6);
    for (const d of World.reveal(world, L.x, L.y, CONFIG.startRadius)) Progression.seeDeposit(g, d);
    return g;
  },

  // ---------------- topology ----------------
  recompute(g) {
    g.topologyDirty = false;
    g.topoVersion = (g.topoVersion || 0) + 1;
    const lists = { extractor: [], silo: [], refinery: [], seller: [], lab: [], terminal: [] };
    for (const b of g.buildings.values()) {
      if (b.type === 'extractor') lists.extractor.push(b);
      else if (b.type === 'silo') lists.silo.push(b);
      else if (REFINERY_LEVEL[b.type]) lists.refinery.push(b);
      else if (SELLER_TIER[b.type] !== undefined) { lists.seller.push(b); if (b.type === 'terminal') lists.terminal.push(b); }
      else if (b.type === 'lab') lists.lab.push(b);
    }
    g.lists = lists;
    for (const b of lists.extractor) {
      b.outs = Logistics.extractorOuts(g, b);
      let cluster = 0, servo = 0;
      const src = [];
      for (const o of Grid.neighbors(g, b)) {
        if (o.type === 'extractor' && o.res === b.res) cluster++;
        if (o.type === 'servo') servo = Math.max(servo, CONFIG.servoBonus * (1 + 0.2 * (o.level - 1)));
      }
      const cb = Math.min(CONFIG.clusterBonusMax, cluster * CONFIG.clusterBonus);
      if (cb > 0) src.push({ name: 'Extraktor-Cluster (' + cluster + ')', v: cb });
      if (servo > 0) src.push({ name: 'Servo-Hub', v: servo });
      b.bonus = cb + servo; b.bonusSrc = src;
      b.rate = Economy.extractRate(g, b);
    }
    for (const b of lists.refinery) {
      const coolers = [], src = [];
      let servo = 0, silo = false;
      for (const o of Grid.neighbors(g, b)) {
        if (o.type === 'cooler') coolers.push(CONFIG.coolerBonus * (1 + 0.2 * (o.level - 1)));
        if (o.type === 'servo') servo = Math.max(servo, CONFIG.servoBonus * (1 + 0.2 * (o.level - 1)));
        if (o.type === 'silo') silo = true;
      }
      coolers.sort((a, c) => c - a);
      const cool = coolers.slice(0, CONFIG.coolerMax).reduce((a, c) => a + c, 0);
      if (cool > 0) src.push({ name: 'Kühlturm (' + Math.min(coolers.length, CONFIG.coolerMax) + ')', v: cool });
      if (servo > 0) src.push({ name: 'Servo-Hub', v: servo });
      if (silo) src.push({ name: 'Lager (Materialnähe)', v: CONFIG.siloRefineryBonus });
      b.bonus = cool + servo + (silo ? CONFIG.siloRefineryBonus : 0); b.bonusSrc = src;
      b.port = Grid.frontPort(b);
      b.rate = Economy.refineRate(g, b);
    }
    for (const b of lists.silo) b.port = Grid.frontPort(b);
    for (const b of lists.seller) {
      b.ramps = [...Grid.neighbors(g, b)].filter(o => o.type === 'silo');
      b.bonusSrc = b.ramps.length ? [{ name: 'Verladerampe (Lager angrenzend)', v: CONFIG.rampBonus }] : [];
      if (b.type === 'bazaar') {
        const R = CONFIG.pathRadius;
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        let n = 0; const ends = [];
        for (let y = Math.floor(cy - R * 2); y <= cy + R * 2; y++) for (let x = Math.floor(cx - R * 2); x <= cx + R * 2; x++) {
          const o = Grid.at(g, x, y);
          if (!o || o.type !== 'path') continue;
          const d2 = U.dist2(x + 0.5, y + 0.5, cx, cy);
          if (d2 <= R * R) n++;
          let nb = 0;
          for (let d = 0; d < 4; d++) { const q = Grid.at(g, x + U.DX[d], y + U.DY[d]); if (q && q.type === 'path') nb++; }
          if (nb <= 1 && d2 > 9) ends.push([x, y]);
        }
        b.pathTiles = n; b.pathEnds = ends;
        if (n > 0) b.bonusSrc.push({ name: 'Alien-Wege (' + n + ' Felder) Kunden', v: Math.min(CONFIG.pathBonusMax, n * CONFIG.pathBonusPerTile) });
      }
    }
    Logistics.chargerBoost(g);
    Logistics.computeOrder(g);
  },

  // ---------------- main tick ----------------
  tick(g) {
    const dt = 1 / CONFIG.tickRate;
    const run = g.run;
    g.tick++;
    run.time += dt;
    g.stats.playTime += dt;
    if (g.modsDirty) { g.modsDirty = false; Progression.computeMods(g); g.topologyDirty = true; }
    if (g.topologyDirty) Game.recompute(g);
    Game.movePlayer(g, dt);
    const order = g.order;
    for (let i = 0; i < order.length; i++) Logistics.tickNode(g, order[i]);
    const L = g.lists;
    for (let i = 0; i < L.extractor.length; i++) Economy.tickExtractor(g, L.extractor[i]);
    for (let i = 0; i < L.silo.length; i++) Economy.tickSilo(g, L.silo[i]);
    for (let i = 0; i < L.refinery.length; i++) Economy.tickRefinery(g, L.refinery[i]);
    for (let i = 0; i < L.seller.length; i++) Economy.tickSeller(g, L.seller[i]);
    Economy.tickDemand(g, dt);
    Economy.tickContracts(g, dt);
    Progression.tickResearch(g, dt);
    Game.tickMisc(g, dt);
  },

  tickMisc(g, dt) {
    const run = g.run;
    if (run.scanCd > 0) run.scanCd = Math.max(0, run.scanCd - dt);
    if (run.probeCd > 0) run.probeCd = Math.max(0, run.probeCd - dt);
    if (run.scanPing) { run.scanPing.t += dt; if (run.scanPing.t > 2.5) run.scanPing = null; }
    // tips
    for (let i = run.tips.length - 1; i >= 0; i--) {
      const tp = run.tips[i];
      tp.life -= dt;
      const near = U.dist2(tp.x, tp.y, run.player.x, run.player.y) < 2.5;
      if (near || g.run.research.done.has('autocollect')) { Game.collectTip(g, i); continue; }
      if (tp.life <= 0) run.tips.splice(i, 1);
    }
    // income moving average (per second buckets over 30 s)
    g.incomeTimer += dt;
    if (g.incomeTimer >= 1) {
      g.incomeTimer -= 1;
      g.incomeBuf[g.incomePos] = g.incomeAcc;
      g.incomePos = (g.incomePos + 1) % g.incomeBuf.length;
      g.incomeAcc = 0;
      let s = 0; for (let i = 0; i < g.incomeBuf.length; i++) s += g.incomeBuf[i];
      g.income = s / Math.min(g.incomeBuf.length, Math.max(1, Math.floor(run.time)));
      if (g.income > g.stats.bestIncome) g.stats.bestIncome = g.income;
    }
    if (g.tick % 20 === 0) {
      Progression.checkTiers(g);
      Progression.checkAchievements(g);
      Game.updateWarnings(g);
      if (run.earned > g.stats.bestRunEarned) g.stats.bestRunEarned = run.earned;
    }
    if (g.tick % (CONFIG.tickRate * 60) === 0) {
      const h = g.meta.earnHistory;
      h.push([Math.round(g.stats.playTime), g.meta.totalEarned]);
      if (h.length > 720) h.splice(0, h.length - 720);
    }
  },

  collectTip(g, i) {
    const tp = g.run.tips[i];
    if (!tp) return 0;
    g.run.tips.splice(i, 1);
    Economy.earn(g, tp.value);
    g.events.push({ type: 'tip', tp });
    return tp.value;
  },

  movePlayer(g, dt) {
    const p = g.run.player, inp = g.input;
    let ix = inp.x, iy = inp.y;
    const len = Math.hypot(ix, iy);
    if (len > 1) { ix /= len; iy /= len; }
    const speed = g.mods.walk * (inp.sprint ? CONFIG.sprintFactor : 1);
    const tx = ix * speed, ty = iy * speed;
    const k = Math.min(1, dt * 10);
    p.vx += (tx - p.vx) * k; p.vy += (ty - p.vy) * k;
    if (Math.abs(p.vx) < 0.01 && len === 0) p.vx = 0;
    if (Math.abs(p.vy) < 0.01 && len === 0) p.vy = 0;
    p.px = p.x; p.py = p.y;
    if (g.introLock) { p.vx = 0; p.vy = 0; p.moving = false; return; }
    Collide.updateZones(g);
    const ox = p.x, oy = p.y;
    Collide.move(g, p, p.vx * dt, p.vy * dt, dt);
    // stuck rescue: pushing for 1.5 s without moving -> glide to the nearest free point
    if (len > 0.3 && !p.rescue && Math.hypot(p.x - ox, p.y - oy) < 0.01 * Math.max(1, speed * dt * 10)) {
      p.stuckT = (p.stuckT || 0) + dt;
      if (p.stuckT > 1.5) {
        const enc = Collide.freePoint(g, p.x, p.y, 0.3);
        const far = Math.hypot(enc[0] - p.x, enc[1] - p.y) > 0.05;
        // only when truly enclosed: no direction is free within one step
        let free = 0; for (let a = 0; a < 8; a++) if (!Collide.blockedAt(g, p.x + Math.cos(a * 0.785) * 0.4, p.y + Math.sin(a * 0.785) * 0.4, 0.28)) free++;
        if (free === 0 || far) { const fp = free === 0 ? Collide.freePoint(g, p.x + 0.01, p.y + 0.01, 0.3) : enc; p.rescue = fp; g.events.push({ type: 'stuck' }); }
        p.stuckT = 0;
      }
    } else p.stuckT = 0;
    p.x = U.clamp(p.x, -2e6, 2e6); p.y = U.clamp(p.y, -2e6, 2e6);
    p.moving = Math.hypot(p.x - p.px, p.y - p.py) / Math.max(1e-4, dt) > 0.3 && Math.hypot(p.vx, p.vy) > 0.3;
    if (Math.abs(p.vx) > 0.2) p.face = p.vx > 0 ? 1 : -1;
    const cell = Math.floor(p.x / 4) + ',' + Math.floor(p.y / 4);
    if (cell !== g.lastCell) {
      g.lastCell = cell;
      World.discover(g.world, p.x, p.y, CONFIG.viewDiscoverRadius);
      for (const d of World.reveal(g.world, p.x, p.y, CONFIG.viewDiscoverRadius)) {
        Progression.seeDeposit(g, d);
        g.events.push({ type: 'depositSeen', d });
      }
    }
  },

  updateWarnings(g) {
    const alerts = g.run.research.done.has('alerts');
    for (const b of g.lists.extractor) {
      b.warn = b.outs && !b.outs.length ? 'nocon' : b.blocked > 2 ? 'blocked' : null;
      if (b.warn === 'blocked') Game.notifyOnce(g, b, 'blocked');
    }
    for (const b of g.lists.silo) {
      const cap = Economy.siloCap(g, b);
      b.warn = b.total >= cap ? 'full' : alerts && b.total >= cap * 0.9 ? 'nearfull' : null;
      if (b.warn) Game.notifyOnce(g, b, b.warn);
    }
    for (const b of g.lists.refinery) b.warn = b.wrongTick && g.tick - b.wrongTick < 40 ? 'wrong' : null;
    for (const b of g.lists.seller) {
