// ===== src/app/03_render.js =====
// =====================================================================
// Render: camera, terrain chunks (colour zones + grain), decoration sprites,
// planet props, footprints, particles, atmosphere and night
// =====================================================================
// Planet looks beyond the core palette: ground zones, wind, prop set, ambient particles
const PLANET_LOOK = {
  1: { zones: ['#6e3a52', '#c98a4a', '#e8c9a8'], wind: 0.35, props: ['basalt'], amb: 'dust', rockTint: '#4a2216' },
  2: { zones: ['#3f6e62', '#c98a4a', '#e0b07a'], wind: 0.9, props: ['pool', 'shard'], amb: 'dust', rockTint: '#5a3a22' },
  3: { zones: ['#7aa6d0', '#e8f4ff', '#bcd8ee'], wind: -0.4, props: ['floe', 'frost'], amb: 'snow', rockTint: '#6a8aaa' },
  4: { zones: ['#2a1a14', '#4a2a1a', '#3a3230'], wind: 1.6, props: ['lava', 'ash'], amb: 'ash', rockTint: '#151112' },
  5: { zones: ['#3a2a5a', '#3a6a3a', '#5a4a7a'], wind: 0.2, props: ['plant', 'shroom'], amb: 'spore', rockTint: '#2a2240' },
  6: { zones: ['#24164a', '#3a2a6a', '#1a2a5a'], wind: 0.0, props: ['panel', 'beamline'], amb: 'neon', rockTint: '#1a1030' },
  7: { zones: ['#c8b8e8', '#f4ecff', '#b8e0f0'], wind: 0.6, props: ['crystal'], amb: 'glitter', rockTint: '#9a8ab8' },
  8: { zones: ['#0a0a1a', '#141430', '#20103a'], wind: 0.0, props: ['stars', 'gring', 'arc'], amb: 'stardust', rockTint: '#06060c' }
};
const PROP_SETS = [['basalt'], ['pool', 'shard'], ['floe', 'frost'], ['lava', 'ash'], ['plant', 'shroom'], ['panel', 'beamline'], ['crystal'], ['stars', 'gring', 'arc']];
const AMBS = ['dust', 'snow', 'ash', 'spore', 'neon', 'glitter', 'stardust'];

const Render = {
  canvas: null, ctx: null,
  chunks: new Map(), chunkGenBudget: 2,
  ox: 0, oy: 0, S: 1,
  particles: [], pool: [],
  palette: null, planetStyle: 1, look: PLANET_LOOK[1],
  floating: [],
  edgeMarks: [],
  prints: [], printDist: 0, lastStep: null,
  stormT: 0, storm: 0, nextStorm: 300,
  grain: null,

  init(canvas) {
    Render.canvas = canvas;
    Render.ctx = canvas.getContext('2d', { alpha: false });
    Render.resize();
  },
  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth, hh = window.innerHeight;
    App.view.w = w; App.view.h = hh; App.view.dpr = dpr;
    Render.canvas.width = Math.round(w * dpr);
    Render.canvas.height = Math.round(hh * dpr);
  },
  setPlanet(planet, seed) {
    Render.chunks.clear(); Render.comps.clear();
    TerrainSys.setPlanet(planet, seed !== undefined ? seed : (App.g ? App.g.world.seed : 1));
    Render.darkGround = ItemArt.lum(planet.ground[1]) < 0.16;
    Render.lightGround = ItemArt.lum(planet.ground[1]) > 0.6;
    Art.clearPlanet();
    Render.palette = planet;
    Render.planetStyle = planet.index <= 8 ? planet.index : (RNG.hash(planet.index, 3) % 8) + 1;
    if (planet.index <= 8) Render.look = PLANET_LOOK[planet.index];
    else {
      // procedural planets: palette-derived zones plus a random combination of prop sets
      const rnd = RNG.mulberry32(RNG.hash(planet.index, 51));
      const a = PROP_SETS[Math.floor(rnd() * PROP_SETS.length)], b = PROP_SETS[Math.floor(rnd() * PROP_SETS.length)];
      Render.look = { zones: [Col.shade(planet.ground[0], 0.15), Col.mix(planet.ground[2], planet.accent, 0.25), Col.shade(planet.ground[2], 0.2)], wind: rnd() * 2 - 1, props: [...new Set(a.concat(b))].slice(0, 3), amb: AMBS[Math.floor(rnd() * AMBS.length)], rockTint: planet.rock };
    }
    Render.look = Object.assign({}, Render.look, { wind: TerrainSys.P.wind });
    Render.prints.length = 0;
    document.documentElement.style.setProperty('--accent', planet.accent);
    const lum = Col.rgb(planet.accent).reduce((a, c, i) => a + c * [0.299, 0.587, 0.114][i], 0);
    document.documentElement.style.setProperty('--accent-ink', lum > 140 ? '#160b04' : '#ffffff');
  },

  // ---------------- coordinates ----------------
  worldToScreen(x, y) {
    const c = App.cam;
    return [(x - c.x) * c.zoom + App.view.w / 2, (y - c.y) * c.zoom + App.view.h / 2];
  },
  screenToWorld(sx, sy) {
    const c = App.cam;
    return [(sx - App.view.w / 2) / c.zoom + c.x, (sy - App.view.h / 2) / c.zoom + c.y];
  },
  visibleRect(margin = 2) {
    const c = App.cam;
    const hw = App.view.w / 2 / c.zoom, hh = App.view.h / 2 / c.zoom;
    return { x0: Math.floor(c.x - hw - margin), y0: Math.floor(c.y - hh - margin), x1: Math.ceil(c.x + hw + margin), y1: Math.ceil(c.y + hh + margin) };
  },
  setWorldTransform(ctx) {
    const c = App.cam, d = App.view.dpr;
    Render.ox = Math.floor(c.x); Render.oy = Math.floor(c.y);
    const S = d * c.zoom;
    Render.S = S;
    ctx.setTransform(S, 0, 0, S, d * App.view.w / 2 - S * (c.x - Render.ox), d * App.view.h / 2 - S * (c.y - Render.oy));
  },
  ppt() { return App.cam.zoom * App.view.dpr; },

  // ---------------- terrain ----------------
  smooth(a, b, x) { const t = U.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); },
  terrainColor(w, x, y, out) { TerrainCore.sampleColor(x, y, TerrainSys.P, out); },
  genChunk(g, cx, cy) {
    const S = CONFIG.chunkSize;
    const spt = App.quality === 'low' ? 2 : 3;
    const n = S * spt;
    const c = document.createElement('canvas'); c.width = c.height = n;
    const x = c.getContext('2d');
    const img = x.createImageData(n, n);
    const d = img.data, col = [0, 0, 0];
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      Render.terrainColor(g.world, cx * S + (i + 0.5) / spt, cy * S + (j + 0.5) / spt, col);
      const o = (j * n + i) * 4;
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    return c;
  },
  // height-field terrain baked per chunk (TerrainCore / TerrainSys)
  drawTerrain(ctx, g, vr) { TerrainSys.draw(ctx, g, vr); },
  comps: new Map(),
  buildComp(g, cx, cy, sx, sy, CS, cp, terrain) {
    const S = CONFIG.chunkSize, c = Art.canvas(CS * cp, CS * cp), x = c.getContext('2d');
    x.imageSmoothingEnabled = true;
    const tw = terrain.width / S;
    x.drawImage(terrain, sx * tw, sy * tw, CS * tw, CS * tw, 0, 0, CS * cp, CS * cp);
    const X0 = cx * S + sx, Y0 = cy * S + sy;
    if (App.quality !== 'low') {
      const G = Render.grainCanvas(), T = 6, step = T * cp;
      x.globalAlpha = 0.08 * U.clamp((cp - 8) / 16, 0.4, 1);
      const ox = ((X0 % T) + T) % T, oy = ((Y0 % T) + T) % T;
      for (let yy = -oy * cp; yy < CS * cp; yy += step) for (let xx = -ox * cp; xx < CS * cp; xx += step) x.drawImage(G, xx, yy, step, step);
      x.globalAlpha = 1;
    }
    x.setTransform(cp, 0, 0, cp, -X0 * cp, -Y0 * cp);
    const c0x = Math.floor((X0 - 7) / S), c1x = Math.floor((X0 + CS + 7) / S), c0y = Math.floor((Y0 - 7) / S), c1y = Math.floor((Y0 + CS + 7) / S);
    const small = cp < 12;
    for (let ny = c0y; ny <= c1y; ny++) for (let nx = c0x; nx <= c1x; nx++) {
      for (const d of Render.decorFor(g, nx, ny)) {
        if (d.x < X0 - 7 || d.x > X0 + CS + 7 || d.y < Y0 - 7 || d.y > Y0 + CS + 7) continue;
        if (small && (d.kind === 'pebbles' || d.kind === 'dune')) continue;
        const spr = DecorArt.sprite(d.kind, d.v, Art.bucket(cp * Math.min(2, d.s), 128));
        const w = spr.w * d.s, h = spr.h * d.s;
        x.drawImage(spr.canvas, d.x - w * spr.ax, d.y - h * spr.ay, w, h);
      }
    }
    return c;
  },
  grainCanvas() {
    if (!Render.grain) {
      const c = Art.canvas(128, 128), x = c.getContext('2d');
      const rnd = RNG.mulberry32(99);
      for (let i = 0; i < 2600; i++) { const v = rnd(); x.fillStyle = v < 0.5 ? 'rgba(0,0,0,' + (0.25 + rnd() * 0.5) + ')' : 'rgba(255,255,255,' + (0.18 + rnd() * 0.4) + ')'; x.fillRect(Math.floor(rnd() * 128), Math.floor(rnd() * 128), 1, 1 + (rnd() < 0.2 ? 1 : 0)); }
      Render.grain = { canvas: c, pat: null };
    }
    return Render.grain.canvas;
  },
  // static seamless micro-grain, anchored to the world (one pattern fill per frame)
  drawGrain(ctx, vr) {
    if (App.cam.zoom < 14 || App.quality === 'low') return;
    Render.grainCanvas();
    if (!Render.grain) {
      const c = Art.canvas(128, 128), x = c.getContext('2d');
      const rnd = RNG.mulberry32(99);
      for (let i = 0; i < 2600; i++) { const v = rnd(); x.fillStyle = v < 0.5 ? 'rgba(0,0,0,' + (0.25 + rnd() * 0.5) + ')' : 'rgba(255,255,255,' + (0.18 + rnd() * 0.4) + ')'; x.fillRect(Math.floor(rnd() * 128), Math.floor(rnd() * 128), 1, 1 + (rnd() < 0.2 ? 1 : 0)); }
      Render.grain = { canvas: c, pat: null };
    }
    const G = Render.grain;
    if (!G.pat) G.pat = Render.ctx.createPattern(G.canvas, 'repeat');
    const T = 6; // tiles covered by one pattern tile
    if (G.pat.setTransform) G.pat.setTransform(new DOMMatrix([T / 128, 0, 0, T / 128, -(((Render.ox % T) + T) % T), -(((Render.oy % T) + T) % T)]));
    ctx.globalAlpha = 0.09 * U.clamp((App.cam.zoom - 14) / 10, 0.3, 1);
    ctx.fillStyle = G.pat;
    ctx.fillRect(vr.x0 - Render.ox, vr.y0 - Render.oy, vr.x1 - vr.x0, vr.y1 - vr.y0);
    ctx.globalAlpha = 1;
  },

  // ---------------- decoration (render side, deterministic per chunk) ----------------
  decorFor(g, cx, cy) {
    const key = 'D' + U.chunkKey(cx, cy);
    let list = Render.decorCache && Render.decorCache.get(key);
    if (list) return list;
    if (!Render.decorCache || Render.decorCache.size > 600) Render.decorCache = new Map();
    const S = CONFIG.chunkSize;
    const rnd = RNG.forChunk(g.world.seed, cx, cy, 7);
    list = [];
    const add = (kind, x, y, s, v) => list.push({ kind, x, y, s, v, ph: rnd() });
    const n = 30 + Math.floor(rnd() * 14);
    for (let i = 0; i < n; i++) {
      const x = cx * S + rnd() * S, y = cy * S + rnd() * S;
      const bi = World.biome(g.world, Math.floor(x), Math.floor(y));
      const roll = rnd();
      if (bi === 3) { if (roll < 0.3) add('crater', x, y, 1.6 + rnd() * 3.2, Math.floor(rnd() * 6)); else if (roll < 0.65) add('rock', x, y, 0.6 + rnd() * 0.8, Math.floor(rnd() * 12)); else add('pebbles', x, y, 1, Math.floor(rnd() * 4)); }
      else if (bi === 2) { if (roll < 0.62) add('rock', x, y, 0.7 + rnd() * 1.1, Math.floor(rnd() * 12)); else add('pebbles', x, y, 1, Math.floor(rnd() * 4)); }
      else if (bi === 4) { if (roll < 0.7) add('pebbles', x, y, 1 + rnd() * 0.5, Math.floor(rnd() * 4)); else add('rock', x, y, 0.5 + rnd() * 0.5, Math.floor(rnd() * 12)); }
      else if (bi === 1) { if (roll < 0.6) add('dune', x, y, 2 + rnd() * 2, Math.floor(rnd() * 3)); else if (roll < 0.8) add('pebbles', x, y, 1, Math.floor(rnd() * 4)); else add('rock', x, y, 0.5 + rnd() * 0.6, Math.floor(rnd() * 12)); }
      else { if (roll < 0.1) add('crater', x, y, 1.2 + rnd() * 2, Math.floor(rnd() * 6)); else if (roll < 0.38) add('pebbles', x, y, 1, Math.floor(rnd() * 4)); else if (roll < 0.55) add('rock', x, y, 0.5 + rnd() * 0.6, Math.floor(rnd() * 12)); else if (roll < 0.7) add('dune', x, y, 1.5 + rnd() * 1.5, Math.floor(rnd() * 3)); }
    }
    // planet props
    const props = Render.look.props;
    const np = 6 + Math.floor(rnd() * 7);
    for (let i = 0; i < np; i++) {
      const kind = props[Math.floor(rnd() * props.length)];
      if (kind === 'basalt') { add('rock', cx * S + rnd() * S, cy * S + rnd() * S, 0.9 + rnd() * 0.9, 8 + Math.floor(rnd() * 4)); continue; }
      add(kind, cx * S + rnd() * S, cy * S + rnd() * S, 0.8 + rnd() * 1.4, Math.floor(rnd() * 4));
    }
    list.sort((a, b) => (DECOR_LAYER[a.kind] || 1) - (DECOR_LAYER[b.kind] || 1) || a.y - b.y);
    Render.decorCache.set(key, list);
    return list;
  },
  // rocks and props: baked into the chunk image at far zoom, live sprites when close
  drawDecor(ctx, g, vr) { TerrainSys.drawProps(ctx, vr); },

  // ---------------- footprints ----------------
  updatePrints(g, dt) { Ground.update(g, dt); Ground.decayWear(dt); Ground.sandDrift(g, dt); },
  drawPrints(ctx) { Ground.draw(ctx); },

  roundRect(ctx, x, y, w, hh, r) { Art.rrect(ctx, x, y, w, hh, r); },

  // ---------------- particles (pooled, sprite based) ----------------
  maxParticles() { return App.settings.reducedFx ? 80 : App.quality === 'low' ? 150 : App.quality === 'medium' ? 500 : 1500; },
  spawn(type, x, y, vx, vy, life, color, size, extra) {
    if (Render.particles.length >= Render.maxParticles()) return null;
    const p = Render.pool.pop() || {};
    p.type = type; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.color = color; p.size = size;
    p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 6; p.v = Math.floor(Math.random() * 3); p.g = 0; p.z = 0; p.vz = 0;
    if (extra) Object.assign(p, extra);
    Render.particles.push(p);
    return p;
  },
  updateParticles(dt) {
    const arr = Render.particles;
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      p.life -= dt;
      if (p.life <= 0) { arr[i] = arr[arr.length - 1]; arr.pop(); Render.pool.push(p); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.type === 'coin') {
        // flies in an arc with gravity on a virtual height, bounces once
        p.vz -= 9 * dt; p.z += p.vz * dt;
        if (p.z < 0) { p.z = 0; p.vz = -p.vz * 0.35; p.vx *= 0.6; p.vy *= 0.6; }
      }
      if (p.type === 'smoke' || p.type === 'dust' || p.type === 'steam') { p.vx *= 0.97; p.vy *= 0.97; p.size += dt * (p.type === 'steam' ? 0.35 : 0.22); }
      if (p.type === 'snow' || p.type === 'ash' || p.type === 'spore') { p.vx += Math.sin(p.life * 2 + p.rot) * dt * 0.3; }
    }
  },
  drawParticles(ctx) {
    const arr = Render.particles;
    if (!arr.length) return;
    // pass 1: normal blending
    for (const p of arr) {
      const T = PTYPES[p.type] || PTYPES.dust;
      if (T.add) continue;
      Render.drawParticle(ctx, p, T);
    }
    // pass 2: additive (batched)
    ctx.globalCompositeOperation = 'lighter';
    for (const p of arr) { const T = PTYPES[p.type] || PTYPES.dust; if (T.add) Render.drawParticle(ctx, p, T); }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },
  drawParticle(ctx, p, T) {
    const k = U.clamp(p.life / p.max, 0, 1);
    const x = p.x - Render.ox, y = p.y - Render.oy - (p.z || 0) * 0.5;
    const s = p.size * (T.grow ? 1 + (1 - k) * T.grow : 1);
    ctx.globalAlpha = T.fadeIn ? Math.min(1, (1 - k) * 6) * k : k * (T.a || 1);
    if (p.type === 'coin') {
      ctx.globalAlpha = Math.min(1, k * 3);
      // shadow on the ground
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, p.y - Render.oy + 0.05, s * 0.8, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
      const fr = Math.floor((p.life * 14 + p.v)) & 7;
      ctx.drawImage(FxLib.get('coin', fr), x - s, y - s, s * 2, s * 2);
      return;
    }
    const spr = p.color ? FxLib.tinted(T.spr, T.vars ? p.v % T.vars : 0, p.color) : FxLib.get(T.spr, T.vars ? p.v % T.vars : 0);
    if (T.rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.drawImage(spr, -s, -s, s * 2, s * 2); ctx.restore(); }
    else ctx.drawImage(spr, x - s, y - s, s * 2, s * 2);
  },
  // coin fountain at a seller
  coinBurst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 1.4;
      Render.spawn('coin', x, y, Math.cos(a) * sp, Math.sin(a) * sp * 0.5, 1.1 + Math.random() * 0.4, null, 0.13 + Math.random() * 0.05, { z: 0.4, vz: 3 + Math.random() * 2.5 });
    }
    Render.spawn('glint', x, y - 0.4, 0, -0.2, 0.5, '#fff6c0', 0.5);
  },
  puff(x, y, n, color, size = 0.25) {
    for (let i = 0; i < n; i++) Render.spawn('dust', x + (Math.random() - 0.5) * 0.4, y + (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 1.6, -Math.random() * 0.6, 0.6 + Math.random() * 0.5, color, size * (0.6 + Math.random() * 0.6));
  },
  ring(x, y, r, color, life = 0.6) { Render.spawn('ring', x, y, 0, 0, life, color, r); },

  // Floating texts (+12 ET) in world space.
  float(text, x, y, color = '#7dff8a') {
    if (Render.floating.length > 40) Render.floating.shift();
    Render.floating.push({ text, x, y, t: 0, color });
  },
  drawFloating(ctx, dt) {
    const z = App.cam.zoom;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = Render.floating.length - 1; i >= 0; i--) {
      const f = Render.floating[i];
      f.t += dt;
      if (f.t > 1.6) { Render.floating.splice(i, 1); continue; }
      const a = 1 - Math.max(0, f.t - 1) / 0.6;
      const pop = Art.ease.outBack(Math.min(1, f.t / 0.25));
      const fs = 15 / z * (0.6 + 0.4 * pop);
      ctx.font = '800 ' + fs + 'px system-ui, sans-serif';
      ctx.globalAlpha = a;
      ctx.lineWidth = fs * 0.24; ctx.strokeStyle = 'rgba(0,0,0,.75)';
      const x = f.x - Render.ox, y = f.y - Render.oy - Art.ease.outCubic(Math.min(1, f.t / 1.6)) * 1.1;
      ctx.strokeText(f.text, x, y); ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
    }
    ctx.globalAlpha = 1;
  },

  // ---------------- atmosphere ----------------
  dayNight(g) {
    if (!App.settings.dayNight) return 0;
    const cycle = 600;
    const ph = ((g.run.time % cycle) / cycle) * Math.PI * 2;
    return U.clamp(-Math.cos(ph) * 1.1 - 0.05, 0, 1) * (Render.planetStyle === 8 ? 0.7 : 1);
  },
  // sun direction for cast shadows: longer in the evening, softer at night
  sun(g) {
    if (!App.settings.dayNight) return { dx: Art.SHADOW[0], dy: Art.SHADOW[1], a: 0.26 };
    const ph = ((g.run.time % 600) / 600) * Math.PI * 2;
    const len = 1 + Math.max(0, Math.cos(ph)) * 0.2 + Math.max(0, -Math.cos(ph)) * 0.9;
    const night = Render.dayNight(g);
    return { dx: (0.4 + 0.3 * Math.sin(ph)) * len, dy: 0.38 * len, a: 0.26 * (1 - night * 0.55) };
  },
  devils: [],
  updateDevils(g, dt) {
    Render.updatePrints(g, dt);
    if (App.settings.reducedFx || !App.settings.weather || App.quality === 'low') { Render.devils.length = 0; return; }
    if (Render.devils.length < 2 && Math.random() < dt * 0.04) {
      const p = g.run.player, a = Math.random() * Math.PI * 2, d = 8 + Math.random() * 10;
      Render.devils.push({ x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d, vx: Math.cos(Render.look.wind) * 1.2, vy: Math.sin(Render.look.wind) * 1.2, life: 8 + Math.random() * 6 });
    }
    for (let i = Render.devils.length - 1; i >= 0; i--) {
      const dv = Render.devils[i];
      dv.life -= dt; dv.x += dv.vx * dt; dv.y += dv.vy * dt;
      if (dv.life <= 0) { Render.devils.splice(i, 1); continue; }
      const k = Math.min(1, dv.life / 2);
      for (let j = 0; j < 2; j++) {
        const ang = App.now / 120 + j * Math.PI + Math.random() * 0.5, r = 0.3 + Math.random() * 0.6;
        Render.spawn('dust', dv.x + Math.cos(ang) * r, dv.y + Math.sin(ang) * r * 0.5 - Math.random() * 0.8, -Math.sin(ang) * 1.5 * k, Math.cos(ang) * 0.7 * k - 0.4, 0.9, Render.palette.particle, 0.09);
      }
    }
    Render.ambient(g, dt);
  },
  // planet-specific ambient particles around the camera
  ambient(g, dt) {
    const rate = App.quality === 'high' ? 14 : 6;
    const n = Math.random() < (rate * dt) % 1 ? Math.ceil(rate * dt) : Math.floor(rate * dt);
    const vr = Render.visibleRect(0);
    const P = Render.palette, w = Render.look.wind;
    for (let i = 0; i < n; i++) {
      const x = vr.x0 + Math.random() * (vr.x1 - vr.x0), y = vr.y0 + Math.random() * (vr.y1 - vr.y0);
      switch (Render.look.amb) {
        case 'snow': Render.spawn('snow', x, y, Math.cos(w) * 0.8, 0.9, 4, '#ffffff', 0.07); break;
        case 'ash': Render.spawn(Math.random() < 0.3 ? 'ember' : 'ash', x, y, Math.cos(w) * 1, -0.2, 3, Math.random() < 0.3 ? '#ffb04a' : '#4a4040', 0.06); break;
        case 'spore': Render.spawn('spore', x, y, Math.cos(w) * 0.3, -0.25, 5, Math.random() < 0.5 ? '#9aff8a' : '#d08aff', 0.07); break;
        case 'neon': Render.spawn('spore', x, y, 0, -0.4, 3, Math.random() < 0.5 ? '#3ff0ff' : '#ff4fd8', 0.06); break;
        case 'glitter': Render.spawn('glint', x, y, 0, 0, 0.8, '#ffffff', 0.12); break;
        case 'stardust': Render.spawn('spore', x, y, 0.1, 0.05, 4, '#c8c0ff', 0.04); break;
        default: Render.spawn('mote', x, y, Math.cos(w) * 1.6, Math.sin(w) * 0.6, 3, P.particle, 0.05);
      }
    }
  },
  drawAtmosphere(ctx, g, dt) {
    const d = App.view.dpr, W = App.view.w * d, H = App.view.h * d;
    const night = Render.dayNight(g);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // dusk tint and night: multiply grade (clearly darker and cooler at night)
    const ph = ((g.run.time % 600) / 600) * Math.PI * 2;
    const dusk = App.settings.dayNight ? Math.max(0, 1 - Math.abs(Math.cos(ph)) * 1.6) * 0.5 : 0;
    if (night > 0.01 || dusk > 0.02) {
      ctx.globalCompositeOperation = 'multiply';
      const r = 255 - night * 175 - dusk * 10, gg = 255 - night * 165 - dusk * 45, b = 255 - night * 95 - dusk * 80;
      ctx.fillStyle = 'rgb(' + Math.round(r) + ',' + Math.round(gg) + ',' + Math.round(b) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }
    // distance haze when zoomed far out
    if (App.cam.zoom < 18) {
      const k = (18 - App.cam.zoom) / 8;
      const sky = Render.palette.sky;
      const gr = ctx.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, 'rgba(' + sky[0] + ',' + sky[1] + ',' + sky[2] + ',' + (0.16 * k).toFixed(3) + ')'); gr.addColorStop(0.45, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H * 0.46);
    }
    // dust storm
    if (App.settings.weather && !App.settings.reducedFx) {
      Render.stormT += dt;
      if (Render.storm <= 0 && Render.stormT > Render.nextStorm) { Render.storm = 60; Render.stormT = 0; Render.nextStorm = 360 + Math.random() * 480; }
      if (Render.storm > 0) {
        Render.storm -= dt;
        const k = Math.min(1, Math.min(Render.storm, 60 - Render.storm) / 8);
        ctx.fillStyle = Col.rgba(Render.palette.particle, 0.12 * k);
        ctx.fillRect(0, 0, W, H);
        const n = Math.floor(70 * k * (App.quality === 'low' ? 0.4 : 1));
        ctx.strokeStyle = Col.rgba(Render.palette.particle, 0.35 * k);
        ctx.lineWidth = 1.5 * d;
        const tm = App.now / 1000;
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const sx = ((i * 137.5 + tm * (380 + (i % 7) * 40)) % (W + 200)) - 100;
          const sy = ((i * 89.3 + tm * 60 + i * i) % H);
          ctx.moveTo(sx, sy); ctx.lineTo(sx - 40 * d, sy - 6 * d);
        }
        ctx.stroke();
      }
    }
    return night;
  }
};

// ===== src/app/03a_decor.js =====
// =====================================================================
// DecorArt: cached terrain decoration sprites per planet (craters with
// depth, 12 rock variants, pebbles, dunes, planet props)
// =====================================================================
const DecorArt = {
  NOM: { crater: 3, rock: 1.2, pebbles: 1.2, dune: 3, pool: 1.5, shard: 1.2, floe: 1.5, frost: 1.5, lava: 1.6, ash: 1.5, plant: 1.2, shroom: 1.1, panel: 1.5, beamline: 1.6, crystal: 1.2, stars: 1.4, gring: 1.6, arc: 1.6 },
  sprite(kind, v, ppt) { return Art.cached('P|DEC|' + kind + '|' + v + '|' + ppt, () => DecorArt.make(kind, v, ppt)); },
  make(kind, v, ppt) {
    const nom = DecorArt.NOM[kind] || 1;
    // sprite box in tiles relative to the anchor
    const box = { crater: [3.6, 3.0], rock: [1.9, 1.7], pebbles: [1.6, 1.0], dune: [3.4, 1.6], pool: [2.2, 1.6], shard: [1.4, 1.6], floe: [2.0, 1.4], frost: [2.0, 1.4], lava: [2.4, 2.0], ash: [2.0, 1.4], plant: [1.4, 1.9], shroom: [1.4, 1.6], panel: [1.8, 1.8], beamline: [2.4, 0.8], crystal: [1.5, 2.0], stars: [1.8, 1.4], gring: [2.4, 1.6], arc: [2.4, 1.4] }[kind] || [1.5, 1.5];
    const [bw, bh] = box;
    const ay = kind === 'rock' || kind === 'shard' || kind === 'plant' || kind === 'shroom' || kind === 'crystal' ? 0.72 : 0.5;
    const c = Art.canvas(bw * ppt, bh * ppt), x = c.getContext('2d');
    x.scale(ppt, ppt); x.translate(bw / 2, bh * ay);
    const rnd = RNG.mulberry32(RNG.hash(RNG.hashString(kind), v, Render.palette.index));
    const P = Render.palette, L = Render.look;
    const gmid = P.ground[1], gdark = Col.shade(P.ground[0], -0.25), glight = Col.shade(P.ground[2], 0.2);
    const rockT = ItemArt.T(Col.mix(P.rock, L.rockTint, 0.5));
    const lw = 0.04;
    switch (kind) {
      case 'crater': {
        const R = 1.35, ry = 0.82;
        if (v >= 3) { // ejecta rays
          x.strokeStyle = Col.rgba(glight, 0.22); x.lineCap = 'round';

        // boulders on the rim

      case 'crystal': {

      case 'gring': {

        x.fillStyle = 'rgba(0,0,0,.5)'; x.beginPath(); x.ellipse(0, 0, 0.12, 0.07, 0, 0, Math.PI * 2); x.fill();

      }
      case 'arc': {
        x.strokeStyle = Col.rgba('#c8c0ff', 0.55); x.lineWidth = 0.05;

        x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 0.02; x.stroke();
        break;
      }
    }
    return { canvas: c, w: bw, h: bh, ax: 0.5, ay, nom };
  }
};

// ===== src/app/03b_deposits.js =====
// =====================================================================
// DepositArt: organic deposits anchored in the ground. Static part is a
// cached sprite per deposit; rarity spectacle is drawn per frame.
// =====================================================================
const DepositArt = {
  // static sprite (tile units: origin = bbox x0-M, y0-TOP)
  M: 1.6, TOP: 2.4,
  bbox(d) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const t of d.tiles) { if (t[0] < x0) x0 = t[0]; if (t[1] < y0) y0 = t[1]; if (t[0] > x1) x1 = t[0]; if (t[1] > y1) y1 = t[1]; }
    return { x0, y0, x1: x1 + 1, y1: y1 + 1 };
  },
  sprite(d, ppt) {
    return Art.cached('P|DEP|' + d.id + '|' + ppt, () => DepositArt.render(d, ppt));
  },
  render(d, ppt) {
    const bb = DepositArt.bbox(d);
    const M = DepositArt.M, TOP = DepositArt.TOP;
    const W = bb.x1 - bb.x0 + M * 2, H = bb.y1 - bb.y0 + M + TOP;
    const c = Art.canvas(W * ppt, H * ppt), x = c.getContext('2d');
    x.scale(ppt, ppt);
    x.translate(M - bb.x0, TOP - bb.y0); // now world tile coords relative
    const R = DATA.RESOURCES[d.res], sp = ItemArt.spec(d.res);
    const rnd = RNG.mulberry32(RNG.hash(d.id & 0x7fffffff, 17));
    const P = Render.palette;
    const groundDark = Col.shade(P.ground[1], -0.35);
    // 1) discoloured halo in the ground
    const haloCol = d.tier === 0 ? Col.mix(groundDark, R.color, 0.25) : d.tier >= 4 ? Col.mix(R.color, '#ffffff', 0.2) : Col.mix(groundDark, R.color, 0.45);
    for (const t of d.tiles) {
      const g = x.createRadialGradient(t[0] + 0.5, t[1] + 0.5, 0.2, t[0] + 0.5, t[1] + 0.5, 1.5);
      g.addColorStop(0, Col.rgba(haloCol, d.tier >= 4 ? 0.28 : 0.34)); g.addColorStop(1, Col.rgba(haloCol, 0));
      x.fillStyle = g; x.fillRect(t[0] - 1.2, t[1] - 1.2, 3.4, 3.4);
    }
    // 2) organic blob: union of jittered circles
    const circles = [];
    for (const t of d.tiles) {
      circles.push([t[0] + 0.5 + (rnd() - 0.5) * 0.2, t[1] + 0.5 + (rnd() - 0.5) * 0.2, 0.62 + rnd() * 0.12]);
      for (let k = 0; k < 2; k++) circles.push([t[0] + 0.5 + (rnd() - 0.5) * 1.0, t[1] + 0.5 + (rnd() - 0.5) * 1.0, 0.3 + rnd() * 0.18]);
    }
    const blob = () => { x.beginPath(); for (const [cx, cy, r] of circles) { x.moveTo(cx + r, cy); x.arc(cx, cy, r, 0, Math.PI * 2); } };
    // raised rim / dust ring
    x.save(); x.translate(0.06, 0.08); blob(); x.fillStyle = 'rgba(0,0,0,.28)'; x.fill(); x.restore();
    x.save(); x.translate(-0.04, -0.05); blob(); x.fillStyle = Col.rgba(Col.shade(P.ground[2], 0.25), 0.55); x.fill(); x.restore();
    blob();
    const bed = d.tier === 0 ? Col.mix(groundDark, R.color, 0.3) : Col.mix(Col.shade(groundDark, -0.2), R.color, 0.22);
    x.fillStyle = bed; x.fill();
    // cracks radiating out
    x.lineCap = 'round'; x.lineJoin = 'round';
    const crackCol = Col.shade(groundDark, -0.5);
    for (let i = 0; i < 3 + d.tiles.length; i++) {
      const t = d.tiles[i % d.tiles.length];
      let px = t[0] + 0.5 + (rnd() - 0.5) * 0.4, py = t[1] + 0.5 + (rnd() - 0.5) * 0.4, a = rnd() * Math.PI * 2;
      for (let k = 0; k < 4; k++) {
        const nx = px + Math.cos(a) * (0.22 - k * 0.03), ny = py + Math.sin(a) * (0.22 - k * 0.03);
        x.strokeStyle = Col.rgba(crackCol, 0.6 - k * 0.13); x.lineWidth = 0.04 - k * 0.007;
        x.beginPath(); x.moveTo(px, py); x.lineTo(nx, ny); x.stroke();
        // lit lower edge of the crack
        x.strokeStyle = Col.rgba('#ffffff', 0.1 - k * 0.02); x.lineWidth = 0.015; x.beginPath(); x.moveTo(px + 0.02, py + 0.025); x.lineTo(nx + 0.02, ny + 0.025); x.stroke();
        px = nx; py = ny; a += (rnd() - 0.5) * 1.3;
      }
    }
    // speckled bed texture
    x.save(); blob(); x.clip();
    for (let i = 0; i < d.tiles.length * 14; i++) { const t = d.tiles[i % d.tiles.length]; x.fillStyle = Col.rgba(i % 3 ? '#000000' : R.color, i % 3 ? 0.18 : 0.45); x.fillRect(t[0] + rnd() * 1.2 - 0.1, t[1] + rnd() * 1.2 - 0.1, 0.06, 0.06); }
    x.restore();
    // 3) content by tier (sorted back to front)
    const items = [];
    for (const t of d.tiles) {
      const n = d.tier >= 3 ? 1 : 2 + (rnd() < 0.4 ? 1 : 0);
      for (let k = 0; k < n; k++) items.push([t[0] + 0.2 + rnd() * 0.6, t[1] + 0.3 + rnd() * 0.55, rnd()]);
    }
    items.sort((a, b) => a[1] - b[1]);
    const T = ItemArt.T(R.color);
    for (const [px, py, r] of items) DepositArt.piece(x, d, sp, px, py, r, rnd, T);

    if (d.tier >= 3) {

      const order = []; for (let k = 0; k < n; k++) order.push(k);
      order.sort((a, b) => Math.abs(b - mid) - Math.abs(a - mid)); // outer spikes first, tallest in front-centre last
      for (const k of order) DepositArt.spike(x, cx + (k - mid) * 0.22 * s, cy + (k % 2) * 0.1, 0.16 * s + 0.05, (0.7 + (Math.abs(k - mid) < 0.6 ? 0.6 : k % 2 ? 0.2 : 0.4)) * s * 1.3, (k - mid) * 0.2, d.tier === 7 ? ItemArt.T('#e8f4ff') : T);
      if (d.tier >= 3) { x.globalCompositeOperation = 'lighter'; x.globalAlpha = 0.45; x.drawImage(Sprites.glow(d.tier === 7 ? '#ffffff' : DATA.TIERS[d.tier].color), cx - 0.9, cy - 1.4, 1.8, 1.8); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; }

      g.addColorStop(0, '#000000'); g.addColorStop(0.7, 'rgba(0,30,30,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');

  },
  spike(x, px, py, w, len, a, T) {

    x.fillStyle = T.hi; Art.poly(x, [[-w, 0], [-w * 0.85, -len], [0, -len - w * 1.3], [-w * 0.1, 0]]); x.fill();
    x.fillStyle = T.lo; Art.poly(x, [[w * 0.4, 0], [w * 0.4, -len], [0, -len - w * 1.3], [w * 0.85, -len], [w, 0]]); x.fill();

  },
  piece(x, d, sp, px, py, r, rnd, T) {
    const fam = sp.fam;
    if (d.tier >= 2 && d.tier <= 7 && sp.cat !== 'metal' && sp.cat !== 'powder') { DepositArt.spike(x, px, py, 0.1 + r * 0.06, 0.35 + r * 0.35 + d.tier * 0.05, (r - 0.5) * 0.6, T); return; }

      g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, sp.cat === 'metal' && fam === 'ore' ? sp.c3 : T.base); g.addColorStop(1, T.edge);

      Art.facets(x, Art.blobPts(rnd, px, py - 0.06, 0.2 + r * 0.08, 0.14 + r * 0.05, 6, 0.4), px - 0.05, py - 0.1, ItemArt.T(sp.fam === 'ore' ? sp.c2 : Col.shade(Render.palette.rock, 0.1)), { lw: 0.03 });

  },

  // ---------------- per-frame spectacle ----------------
  dynamic(ctx, d, tm, night, zoom) {
    const t = d.tier;
    const cx = d.x + 0.5 - Render.ox, cy = d.y + 0.6 - Render.oy;
    const col = t === 7 ? Col.prism(tm, 0) : DATA.TIERS[t].color;
    const fx = !App.settings.reducedFx;
    ctx.globalCompositeOperation = 'lighter';
    // night glow (all coloured tiers)
    if (t >= 1 && night > 0.05) { ctx.globalAlpha = night * (0.25 + t * 0.07); ctx.drawImage(Sprites.glow(col), cx - 1.6, cy - 1.8, 3.2, 3.2); }
    // far beacon for legendary and above: a soft vertical beam, stronger when zoomed out
    if (t >= 4) {
      const far = U.clamp((40 - zoom) / 28, 0.25, 1);
      const pulse = 0.75 + 0.25 * Math.sin(tm * 2 + d.id);
      ctx.globalAlpha = (0.32 + night * 0.3) * far * pulse;
      ctx.drawImage(FxLib.tinted('beam', 0, col), cx - 0.9, cy - 9, 1.8, 9.4);
    }
    if (fx) {
      // sparkle glints (frequency and size by rarity)
      if (t >= 1) {
        const n = Math.min(4, t);
        for (let i = 0; i < n; i++) {
          const ph = (tm * (0.35 + t * 0.08) + i / n + Art.phase(d.id + i)) % 1;
          if (ph > 0.35) continue;
          const k = Math.sin(ph / 0.35 * Math.PI);
          const tl = d.tiles[(i * 7 + d.id) % d.tiles.length];
          const s = (0.12 + t * 0.05) * k;
          ctx.globalAlpha = k;
          ctx.drawImage(FxLib.get('glint4'), tl[0] + 0.3 + ((i * 37) % 10) / 25 - Render.ox - s, tl[1] + ((i * 53) % 10) / 20 - Render.oy - s, s * 2, s * 2);
        }
      }
      // legendary: light shimmer rising
      if (t === 4) {
        for (let i = 0; i < 3; i++) { const ph = (tm * 0.4 + i / 3) % 1; ctx.globalAlpha = Math.sin(ph * Math.PI) * 0.7; ctx.drawImage(FxLib.tinted('soft', 0, '#ffe08a'), cx - 0.12 + Math.sin(tm + i) * 0.25, cy - 0.6 - ph * 1.6, 0.24, 0.24); }
      }
      // mythic: floating shards circling
      if (t === 5) {
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        const T = ItemArt.T(DATA.RESOURCES[d.res].color);
        for (let i = 0; i < 4; i++) {
          const a = tm * 0.8 + i * Math.PI / 2;
          const px = cx + Math.cos(a) * 0.75, py = cy - 0.9 + Math.sin(a) * 0.28 + Math.sin(tm * 2 + i) * 0.06;
          ctx.save(); ctx.translate(px, py); ctx.rotate(a);
          ctx.fillStyle = T.hi; ctx.beginPath(); ctx.moveTo(0, -0.16); ctx.lineTo(0.07, 0); ctx.lineTo(0, 0.1); ctx.lineTo(-0.07, 0); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = T.edge; ctx.lineWidth = 0.025; ctx.stroke();
          ctx.restore();
        }
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + 0.2 * Math.sin(tm * 3); ctx.drawImage(Sprites.glow(col), cx - 1, cy - 1.7, 2, 2);
      }
      // exotic: energy core, gravity rings and arcs
      if (t === 6) {
        ctx.globalAlpha = 0.8 + 0.2 * Math.sin(tm * 5); ctx.drawImage(Sprites.glow('#2ef2e0'), cx - 0.6, cy - 1.05, 1.2, 1.2);
        ctx.globalAlpha = 1; ctx.drawImage(FxLib.get('soft'), cx - 0.2, cy - 0.65, 0.4, 0.4);
        for (let i = 0; i < 2; i++) { const s = ((tm * 0.5 + i * 0.5) % 1); ctx.globalAlpha = (1 - s) * 0.7; ctx.drawImage(FxLib.tinted('ring', 0, '#2ef2e0'), cx - s * 1.4, cy - 0.45 - s * 0.55, s * 2.8, s * 1.1); }
        if ((Math.floor(tm * 6) + d.id) % 4 === 0) { ctx.globalAlpha = 0.9; ctx.save(); ctx.translate(cx, cy - 0.45); ctx.rotate(tm * 7 % 6.28); ctx.drawImage(FxLib.tinted('bolt', Math.floor(tm * 6) % 3, '#bffff8'), -0.6, -0.2, 1.2, 0.4); ctx.restore(); }
      }
      // exquisite: prismatic light pillar and shimmering splinters
      if (t === 7) {
        for (let i = 0; i < 3; i++) { ctx.globalAlpha = 0.45; ctx.drawImage(FxLib.tinted('beam', 0, Col.prism(tm, i * 120)), cx - 0.35 + (i - 1) * 0.12, cy - 5.5, 0.7, 5.6); }
        for (let i = 0; i < 5; i++) { const a = tm * 0.9 + i * 1.256; ctx.globalAlpha = 0.9; const s = 0.18; ctx.drawImage(FxLib.tinted('glint4', 0, Col.prism(tm, i * 72)), cx + Math.cos(a) * 0.8 - s, cy - 0.8 + Math.sin(a) * 0.3 - s, s * 2, s * 2); }
      }
    }

// ===== src/app/03t_terrain.js =====
// =====================================================================
// TerrainCore: deterministic height-field terrain (pure, DOM free, runs
// in a Web Worker built from this object's source). World-space noise
// only, so chunks are seamless. Own RNG streams (seed + purpose + cell);
// the world/deposit RNG is never touched.
//   relief (macro / meso / micro) -> craters stamped in age order ->
//   dunes -> materials -> hillshade + soft shadows + AO -> pixel detail
// =====================================================================
const TerrainCore = {
  GT: null,
  init() {
    if (TerrainCore.GT) return;
    const g = new Float32Array(512);
    for (let i = 0; i < 256; i++) { const a = i / 256 * Math.PI * 2 + 0.37; g[i * 2] = Math.cos(a); g[i * 2 + 1] = Math.sin(a); }
    TerrainCore.GT = g;
  },
  hi(x, y, s) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = Math.imul(h ^ (h >>> 16), 668265263);
    return (h ^ (h >>> 15)) >>> 0;
  },
  hf(x, y, s) { return TerrainCore.hi(x, y, s) / 4294967296; },
  rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
  gn(x, y, s) {
    const G = TerrainCore.GT, H = TerrainCore.hi;
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
    let k = (H(ix, iy, s) & 255) << 1; const n00 = G[k] * fx + G[k + 1] * fy;
    k = (H(ix + 1, iy, s) & 255) << 1; const n10 = G[k] * (fx - 1) + G[k + 1] * fy;
    k = (H(ix, iy + 1, s) & 255) << 1; const n01 = G[k] * fx + G[k + 1] * (fy - 1);
    k = (H(ix + 1, iy + 1, s) & 255) << 1; const n11 = G[k] * (fx - 1) + G[k + 1] * (fy - 1);
    const a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
    return (a + (b - a) * v) * 1.45;
  },
  fbm(x, y, s, o) {
    let sum = 0, amp = 0.5, f = 1, n = 0;
    for (let i = 0; i < o; i++) { sum += amp * TerrainCore.gn(x * f + i * 17.31, y * f - i * 9.17, s + i * 101); n += amp; amp *= 0.5; f *= 2.03; }
    return sum / n;
  },
  ridge(x, y, s, o) {
    let sum = 0, amp = 0.5, f = 1, n = 0, prev = 1;
    for (let i = 0; i < o; i++) { let r = 1 - Math.abs(TerrainCore.gn(x * f + i * 7.7, y * f + i * 3.3, s + i * 59)); r *= r; sum += r * amp * prev; prev = r; n += amp; amp *= 0.5; f *= 2.1; }
    return sum / n;
  },
  // cellular noise: returns F2-F1 (crack distance) and writes the cell hash into out[0]
  worley(x, y, s, out) {
    const ix = Math.floor(x), iy = Math.floor(y), H = TerrainCore.hi;
    let d1 = 9, d2 = 9, id = 0;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const cx = ix + i, cy = iy + j, h = H(cx, cy, s);
      const px = cx + (h & 1023) / 1024, py = cy + ((h >>> 10) & 1023) / 1024;
      const dx = px - x, dy = py - y, d = dx * dx + dy * dy;
      if (d < d1) { d2 = d1; d1 = d; id = h; } else if (d < d2) d2 = d;
    }
    if (out) out[0] = id;
    return Math.sqrt(d2) - Math.sqrt(d1);
  },
  ss(a, b, x) { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); },
  rgb(hex) { const n = parseInt(hex.slice(1), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; },

  // ---------------- planet parameters (plain data, sent to the worker) ----------------
  STYLES: {
    1: { name: 'ares', dust: '#b98a66', sand: '#c99a70', crust: '#9c5e42', gravel: '#8c6c58', bed: '#705854', salt: '#dccbb2', shadow: '#4a3048', zones: ['#b9874a', '#7a5058', '#857266', '#7e7a5e'], crater: 1, dune: 1, ridge: 0.8, mesa: 0.7, basin: 0.8, relief: 1, emis: '' },
    2: { name: 'cuprum', dust: '#b88c5e', sand: '#c6a06a', crust: '#8e5c38', gravel: '#7c6248', bed: '#5c4838', salt: '#4fb8a0', shadow: '#3a2a30', zones: ['#c07a3a', '#6a4a3a', '#8a7a5a', '#5a8a70'], crater: 0.7, dune: 0.6, ridge: 1.1, mesa: 0.5, basin: 1, relief: 1.1, emis: 'patina' },
    3: { name: 'glacia', dust: '#e6f0f8', sand: '#dbe9f4', crust: '#a6c8e2', gravel: '#90b0c8', bed: '#5e7ea0', salt: '#cdeafa', shadow: '#4a6a9a', zones: ['#c8dcf0', '#8ab0d0', '#e8f4ff', '#a0c0d8'], crater: 0.6, dune: 0.8, ridge: 1, mesa: 0.3, basin: 0.6, relief: 0.9, emis: 'ice' },
    4: { name: 'ignis', dust: '#4c4646', sand: '#3e3838', crust: '#322a26', gravel: '#3c2e28', bed: '#26201e', salt: '#8a7a3a', shadow: '#1a1218', zones: ['#40302a', '#2a2a30', '#4a3a30', '#382624'], crater: 0.9, dune: 0.7, ridge: 0.9, mesa: 0.6, basin: 0.4, relief: 1.1, emis: 'lava' },
    5: { name: 'viridia', dust: '#4e5e42', sand: '#6c5c7c', crust: '#42503a', gravel: '#5c4c68', bed: '#30293f', salt: '#4fd6a8', shadow: '#1e1830', zones: ['#5a7a48', '#5a4a72', '#3e5a4a', '#6a6a4a'], crater: 0.4, dune: 0.4, ridge: 0.8, mesa: 0.8, basin: 0.9, relief: 1, emis: 'bio' },
    6: { name: 'nebulon', dust: '#3c3262', sand: '#463a72', crust: '#2e2652', gravel: '#36365c', bed: '#221d42', salt: '#6058a4', shadow: '#140c2a', zones: ['#4a347e', '#2a3a6c', '#58326e', '#32325e'], crater: 0.6, dune: 0.3, ridge: 0.8, mesa: 1.0, basin: 0.7, relief: 1.0, emis: 'grid' },
    7: { name: 'crystallis', dust: '#e4dcf0', sand: '#d8d0e8', crust: '#c8bcd8', gravel: '#b8acd0', bed: '#9c8cba', salt: '#eaf6ff', shadow: '#7a6a9a', zones: ['#d0c4e8', '#c4e0f0', '#e8dcf0', '#b8b0d8'], crater: 0.6, dune: 0.5, ridge: 0.9, mesa: 0.6, basin: 0.8, relief: 1, emis: 'crystal' },
    8: { name: 'singularis', dust: '#26264e', sand: '#2c2c56', crust: '#1b1b38', gravel: '#22223f', bed: '#14142c', salt: '#3a3a74', shadow: '#08081a', zones: ['#2c2050', '#1c1c4e', '#241840', '#162238'], crater: 0.9, dune: 0.3, ridge: 0.8, mesa: 0.6, basin: 0.6, relief: 1.0, emis: 'void' }
  },
  params(planet, seed) {
    const k = planet.index || 1;
    let st = TerrainCore.STYLES[k <= 8 ? k : 1], base = k <= 8 ? k : 1;
    let pal = st;
    if (k > 8) {
      // procedural planets: a base style recoloured from the planet palette
      base = 1 + (TerrainCore.hi(k, 77, 5) % 8);
      st = TerrainCore.STYLES[base];
      const mix = (a, b, t) => { const A = TerrainCore.rgb(a), B = TerrainCore.rgb(b); const c = A.map((v, i) => Math.round((v + (B[i] - v) * t) * 255)); return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); };
      const g0 = planet.ground[0], g1 = planet.ground[1], g2 = planet.ground[2];
      pal = Object.assign({}, st, { dust: mix(g2, st.dust, 0.3), sand: mix(g2, g1, 0.4), crust: mix(g1, st.crust, 0.25), gravel: mix(g1, g0, 0.4), bed: mix(g0, st.bed, 0.3), salt: mix(planet.deco || g2, '#ffffff', 0.3), shadow: mix(g0, '#000000', 0.5), zones: [mix(g1, planet.accent, 0.25), g0, mix(g2, '#808080', 0.3), mix(g1, g2, 0.5)] });
    }
    const r = TerrainCore.rgb;
    return {
      seed: (seed ^ Math.imul(k, 2654435761)) >>> 0, k, style: base, name: st.name,
      col: [r(pal.dust), r(pal.sand), r(pal.crust), r(pal.gravel), r(pal.bed), r(pal.salt)],
      shadow: r(pal.shadow), zones: pal.zones.map(r),
      crater: st.crater, dune: st.dune, ridge: st.ridge, mesa: st.mesa, basin: st.basin, relief: st.relief, emis: st.emis,
      // dark grounds: multiplied shading is invisible on near-black albedo, so lit slopes get an additive light term
      dark: (() => { const d = r(pal.dust); const L = 0.2126 * d[0] + 0.7152 * d[1] + 0.0722 * d[2]; return Math.max(0, Math.min(1, (0.3 - L) / 0.2)); })(),
      wind: (TerrainCore.hf(k, 3, 9) - 0.5) * 1.4 + 0.3,
      landing: [16, 16]
    };
  },

  // ---------------- feature lists (craters, landmarks) ----------------
  CC: 40, // crater cell size (tiles)
  LC: 192, // landmark cell size (tiles)
  craterCell(ci, cj, P) {
    const T = TerrainCore, rnd = T.rng(T.hi(ci, cj, P.seed + 7001));
    const S = T.CC, out = [];
    const field = T.ss(-0.2, 0.45, T.fbm(ci * S / 300 + 4.1, cj * S / 300 - 2.7, P.seed + 31, 2));
    let n = Math.floor((1.2 + field * 13) * P.crater * (0.6 + rnd() * 0.8));
    const add = (x, y, R, age, prof) => {
      const kind = R > 7 ? 2 : R > 3 ? 1 : 0;
      out.push({ x, y, R, age, prof, kind, e: 0.82 + rnd() * 0.18, rot: rnd() * 3.1416, seed: (rnd() * 1e9) | 0, rays: rnd() < 0.5 });
    };
    for (let i = 0; i < n; i++) {
      const u = rnd();
      const R = Math.min(12, 0.9 * Math.pow(1 - u * 0.99, -0.72));
      add((ci + rnd()) * S, (cj + rnd()) * S, R, rnd(), Math.floor(rnd() * 8));
    }
    // crater chain
    if (rnd() < 0.12 * P.crater) {
      const a = rnd() * 3.1416, x0 = (ci + 0.2 + rnd() * 0.6) * S, y0 = (cj + 0.2 + rnd() * 0.6) * S, m = 5 + Math.floor(rnd() * 5), age = rnd();
      for (let i = 0; i < m; i++) add(x0 + Math.cos(a) * i * 2.3, y0 + Math.sin(a) * i * 2.3, 0.7 + rnd() * 0.9, age + rnd() * 0.02, 4);
    }
    // secondary field around big craters
    const big = out.filter(c => c.R > 5);
    for (const c of big) {
      const m = 5 + Math.floor(rnd() * 8);
      for (let i = 0; i < m; i++) { const a = rnd() * 6.283, d = c.R * (2 + rnd() * 2.2); add(c.x + Math.cos(a) * d, c.y + Math.sin(a) * d, 0.5 + rnd() * 0.7, c.age + 0.001, 4); }
    }
    return out;
  },
  landmarkCell(li, lj, P) {
    const T = TerrainCore, rnd = T.rng(T.hi(li, lj, P.seed + 9001));
    if (rnd() > 0.42) return null;
    const L = T.LC, x = (li + 0.2 + rnd() * 0.6) * L, y = (lj + 0.2 + rnd() * 0.6) * L;
    if (Math.hypot(x - P.landing[0], y - P.landing[1]) < 70) return null;
    const types = ['basin', 'riverbed', 'canyon', 'mesas', 'devils', 'wreck', 'basin', 'wreck'];
    const type = types[Math.floor(rnd() * types.length)];
    const lm = { type, x, y, seed: (rnd() * 1e9) | 0, a: rnd() * 6.283, R: 16 + rnd() * 14, wreck: Math.floor(rnd() * 6) };
    if (type === 'riverbed' || type === 'canyon') {

        let b = ALB[k00 * 3 + 2] * w00 + ALB[k10 * 3 + 2] * w10 + ALB[k01 * 3 + 2] * w01 + ALB[k11 * 3 + 2] * w11;
        let sh = SH[k00] * w00 + SH[k10] * w10 + SH[k01] * w01 + SH[k11] * w11;
        let em = hasEm ? EM[k00] * w00 + EM[k10] * w10 + EM[k01] * w01 + EM[k11] * w11 : 0;
        if (detail) {
          const wD = W[k00 * 6] * w00 + W[k10 * 6] * w10 + W[k01 * 6] * w01 + W[k11 * 6] * w11;
          const wS = W[k00 * 6 + 1] * w00 + W[k10 * 6 + 1] * w10 + W[k01 * 6 + 1] * w01 + W[k11 * 6 + 1] * w11;
          const wC = W[k00 * 6 + 2] * w00 + W[k10 * 6 + 2] * w10 + W[k01 * 6 + 2] * w01 + W[k11 * 6 + 2] * w11;
          const wG = W[k00 * 6 + 3] * w00 + W[k10 * 6 + 3] * w10 + W[k01 * 6 + 3] * w01 + W[k11 * 6 + 3] * w11;
          const wB = W[k00 * 6 + 4] * w00 + W[k10 * 6 + 4] * w10 + W[k01 * 6 + 4] * w01 + W[k11 * 6 + 4] * w11;
          const wL = W[k00 * 6 + 5] * w00 + W[k10 * 6 + 5] * w10 + W[k01 * 6 + 5] * w01 + W[k11 * 6 + 5] * w11;
          let lit = 0, val = 0;
          // sand ripples (crests lit on the sun side)
          if (wS > 0.06) { const ph = (wx * wcx + wy * wcy) * 19.6 + 2.4 * T.gn(wx / 1.6, wy / 1.6, P.seed + 60); lit += wS * 0.085 * Math.sin(ph + 0.8); val += wS * 0.03 * Math.cos(ph); }
          // dust: soft wind streaks
          if (wD > 0.08) { const sk = T.gn((wx * wcx + wy * wcy) / 6, (-wx * wcy + wy * wcx) * 1.6, P.seed + 61); val += wD * 0.05 * sk; }
          // crust: dried polygon cracks with a lit plate edge
          const cm = T.ss(0.02, 0.4, T.gn(wx / 17, wy / 17, P.seed + 69));
          if (wC > 0.15 && cm > 0.02) {
            const sc = 0.75 + 1.1 * T.ss(-0.5, 0.5, T.gn(wx / 40, wy / 40, P.seed + 77));
            const d = T.worley(wx / sc, wy / sc, P.seed + 62, cell);
            const crack = (1 - T.ss(0.012, 0.06, d)) * cm * (fine ? 1 : 0.45);
            val -= wC * crack * 0.15;
            val += wC * ((cell[0] & 255) / 255 - 0.5) * 0.07 * cm;
            if (st === 3) { val += wC * crack * 0.55; lit += wC * T.ss(0.06, 0.1, d) * 0.03; }
          }
          // gravel: many small stones in different colours with tiny shadows
          if (wG > 0.08 && fine) {
            const gx2 = wx / 0.17, gy2 = wy / 0.17, ix = Math.floor(gx2), iy = Math.floor(gy2);
            const hh = T.hi(ix, iy, P.seed + 63);
            if ((hh & 255) < 150 * Math.min(1, wG * 1.6)) {
              const cxp = ix + 0.25 + ((hh >>> 8) & 127) / 254, cyp = iy + 0.25 + ((hh >>> 15) & 127) / 254;
              const ddx = gx2 - cxp, ddy = gy2 - cyp, dd = ddx * ddx + ddy * ddy, rr = 0.08 + ((hh >>> 22) & 15) / 100;
              if (dd < rr) { const tone = ((hh >>> 26) & 3); val += [0.16, -0.12, 0.06, 0.24][tone] * wG; lit += (-ddx - ddy) * 0.25 * wG; }
              else if (dd < rr * 1.7 && ddx + ddy > 0) val -= 0.12 * wG;
            }
          } else if (wG > 0.08) val += (T.hf(Math.floor(wx * 5), Math.floor(wy * 5), P.seed + 63) - 0.5) * 0.18 * wG;
          // bedrock: strata bands and joint cracks
          if (wB > 0.1) {
            const strata = Math.sin((wx * 0.62 + wy * 0.78) * 5.5 + 3 * T.gn(wx / 7, wy / 7, P.seed + 64));
            val += wB * 0.07 * strata;
            const d = T.worley(wx / 3.2, wy / 3.2, P.seed + 65, null);
            val -= wB * (1 - T.ss(0.01, 0.05, d)) * 0.3;
          }
          // salt / mineral crust: bright polygons with darker rims and sparkle
          if (wL > 0.1) {
            const d = T.worley(wx / 2.3, wy / 2.3, P.seed + 66, cell);
            const crack = 1 - T.ss(0.02, 0.09, d);
            val -= wL * crack * 0.2; lit += wL * crack * 0.05;
            if (fine && T.hf(Math.floor(wx * 9), Math.floor(wy * 9), P.seed + 67) > 0.992) { val += 0.5 * wL; if (hasEm) em += 0.4 * wL; }
          }
          // grain everywhere, visible but calm (single pixels plus small clumps), micro pits and bumps
          val += (T.hf(px + x0 * res, py + y0 * res, P.seed + 68) - 0.5) * (fine ? 0.08 : 0.05);
          if (fine) {
            val += (T.hf((px + x0 * res) >> 1, (py + y0 * res) >> 1, P.seed + 78) - 0.5) * 0.07;
            const mb = T.gn(wx * 2.6, wy * 2.6, P.seed + 79);
            lit += mb * 0.09 * (1 - wS);
            // scattered small stones on every ground type except dunes
            const sx2 = wx / 0.45, sy2 = wy / 0.45, jx = Math.floor(sx2), jy = Math.floor(sy2);
            const h2 = T.hi(jx, jy, P.seed + 80);
            if ((h2 & 255) < 70 * (1 - wS) * (0.3 + wG + wB) * T.ss(-0.35, 0.45, T.gn(wx / 6, wy / 6, P.seed + 81))) {
              const cxp = jx + 0.3 + ((h2 >>> 8) & 63) / 160, cyp = jy + 0.3 + ((h2 >>> 14) & 63) / 160;
              const ddx = sx2 - cxp, ddy = sy2 - cyp, dd = ddx * ddx + ddy * ddy, rr = 0.02 + ((h2 >>> 20) & 15) / 400;
              if (dd < rr) { val += [0.14, -0.16, 0.05, 0.22][(h2 >>> 24) & 3]; lit += (-ddx - ddy) * 1.2; }
              else if (dd < rr * 2.2 && ddx + ddy > 0) val -= 0.16;
            }
          }
          // planet detail
          if (st === 6) {
            // platform plates (4 x 4 tiles) with individual tones, dark seams and a lit upper-left edge; neon lines glow at night
            const pm = T.gn(wx / 9, wy / 9, P.seed + 70), plat = T.ss(-0.35, -0.1, pm);
            const ux = ((wx + 2) % 4 + 4) % 4, uy = ((wy + 2) % 4 + 4) % 4, gl = Math.min(Math.abs(ux - 2), Math.abs(uy - 2));
            if (plat > 0) {
              const cid = T.hf(Math.floor((wx + 2) / 4), Math.floor((wy + 2) / 4), P.seed + 79);
              val += (cid - 0.5) * 0.16 * plat;
              if (gl > 1.93) { if (pm > -0.2) em += 0.85; val += 0.12; }
              else if (gl > 1.84) { val -= 0.14 * plat; }
              else if (ux < 0.2 || uy < 0.2) lit += 0.12 * plat;
            } else if (gl > 1.9) val -= 0.05;
          }
          if (st === 8) { const sp = T.hf(Math.floor(wx * 7), Math.floor(wy * 7), P.seed + 71); if (sp > 0.994) { em += 0.9; val += 0.6; } const rr2 = T.gn(wx / 40, wy / 40, P.seed + 72); lit += 0.05 * Math.sin(rr2 * 40); }
          if (st === 7 && wC > 0.2) { T.worley(wx / 1.1, wy / 1.1, P.seed + 73, cell); lit += ((cell[0] & 255) / 255 - 0.5) * 0.2 * wC; if (T.hf(Math.floor(wx * 8), Math.floor(wy * 8), P.seed + 74) > 0.993) em += 0.6; }
          if (st === 5) { const moss = T.fbm(wx / 6, wy / 6, P.seed + 75, 2); if (moss > 0.2) { const mk = T.ss(0.2, 0.45, moss) * (1 - wS); val += (T.hf(Math.floor(wx * 6), Math.floor(wy * 6), P.seed + 76) - 0.5) * 0.25 * mk; } }
          sh *= 1 + lit;
          r *= 1 + val; g *= 1 + val; b *= 1 + val;
        }
        // shading with cool violet-brown shadows (never black) and warm light
        let lr, lg, lb;
        if (sh < 1) { const t = 1 - sh; lr = r * sh + shR * t * 0.55; lg = g * sh + shG * t * 0.55; lb = b * sh + shB * t * 0.55; }
        else { const t = sh - 1; lr = r * (1 + t * 0.95) + t * dk * 0.34; lg = g * (1 + t * 0.85) + t * dk * 0.3; lb = b * (1 + t * 0.7) + t * dk * 0.38; }
        const o4 = (py * PW + px) * 4;
        rgba[o4] = lr * 255; rgba[o4 + 1] = lg * 255; rgba[o4 + 2] = lb * 255; rgba[o4 + 3] = 255;
        if (emis && em > 0.02) {
          const e = em > 1 ? 1 : em;
          let er, eg, eb;
          if (P.emis === 'lava') { er = 255; eg = 90 + e * 120; eb = 20; }
          else if (P.emis === 'grid') { er = 90; eg = 230; eb = 255; }
          else if (P.emis === 'bio') { er = 80; eg = 255; eb = 190; }
          else if (P.emis === 'void') { er = 210; eg = 210; eb = 255; }
          else if (P.emis === 'patina') { er = 90; eg = 255; eb = 220; }
          else { er = 230; eg = 245; eb = 255; }
          emis[o4] = er; emis[o4 + 1] = eg; emis[o4 + 2] = eb; emis[o4 + 3] = e * 255;
        }
      }
      if ((py & 31) === 31) yield;
    }
    return { w: PW, h: PW, rgba, emis, mats: GD.mats, props: GD.props, lms: GD.lms };
  },

  // ---------------- rock and prop instances (density-driven, clustered, never uniform) ----------------
  props(cx, cy, S, P, C, A, N, GS, PAD, W) {
    const T = TerrainCore, out = [];
    const x0 = cx * S, y0 = cy * S;
    const at = (x, y) => { const i = Math.max(0, Math.min(N - 1, Math.round((x - x0) * GS + PAD - 0.5))), j = Math.max(0, Math.min(N - 1, Math.round((y - y0) * GS + PAD - 0.5))); return j * N + i; };
    const nearDep = (x, y) => { for (const d of C.deps) if (Math.hypot(x - d.x, y - d.y) < d.r + 1.6) return true; return false; };
    const geo = k => { const wB = W[k * 6 + 4], wL = W[k * 6 + 5], wG = W[k * 6 + 3]; return wL > 0.35 ? 2 : wB > 0.35 ? 0 : wG > 0.3 ? 3 : 1; };
    // clusters
    for (let by = 0; by < S; by += 8) for (let bx = 0; bx < S; bx += 8) {
      const rnd = T.rng(T.hi(cx * 4 + bx / 8, cy * 4 + by / 8, P.seed + 8001));
      for (let t = 0; t < 3; t++) {
        const x = x0 + bx + rnd() * 8, y = y0 + by + rnd() * 8;
        const k = at(x, y), a = k * 13;
        const dens = A[a + 2] * 1.4 + A[a + 3] * 1.1 + A[a + 6] * 0.9 + A[a + 7] * 1.2 + W[k * 6 + 3] * 0.8 + W[k * 6 + 4] * 0.6 - W[k * 6 + 1] * 0.8 - W[k * 6] * 0.4 - A[a + 5] * 0.6;
        if (rnd() > dens * 0.55 || nearDep(x, y)) continue;
        const g = geo(k);
        const n = 3 + Math.floor(rnd() * 6);
        const bigCls = rnd() < 0.25 ? 3 : 2;
        out.push(['rock', Math.floor(rnd() * 6), x, y, bigCls, g, rnd() < 0.15 ? 1 : 0]);
        for (let m = 0; m < n; m++) {
          const aa = rnd() * 6.283, dd = 0.6 + rnd() * 1.8, xx = x + Math.cos(aa) * dd, yy = y + Math.sin(aa) * dd * 0.8;
          if (nearDep(xx, yy)) continue;
          out.push([rnd() < 0.45 ? 'pebbles' : 'rock', Math.floor(rnd() * 6), xx, yy, rnd() < 0.7 ? 0 : 1, g, 0]);
        }
      }
    }
    // scattered singles following density
    const rnd = T.rng(T.hi(cx, cy, P.seed + 8101));
    for (let i = 0; i < 46; i++) {
      const x = x0 + rnd() * S, y = y0 + rnd() * S;
      const k = at(x, y), a = k * 13;
      const dens = 0.35 + A[a + 2] + A[a + 3] * 0.8 + W[k * 6 + 4] * 0.7 + W[k * 6 + 3] * 0.6 - W[k * 6 + 1] * 0.9 - A[a + 5] * 0.5;
      if (rnd() > dens * 0.6 || nearDep(x, y)) continue;
      out.push([rnd() < 0.5 ? 'pebbles' : 'rock', Math.floor(rnd() * 6), x, y, rnd() < 0.85 ? 0 : 1, geo(k), 0]);
    }
    // floor scatter: every 8 x 8 block carries at least one small detail (no empty 400 px windows)
    for (let by = 0; by < S; by += 8) for (let bx = 0; bx < S; bx += 8) {
      const r2 = T.rng(T.hi(cx * 4 + bx / 8 + 911, cy * 4 + by / 8 - 377, P.seed + 8201));
      const m = 1 + (r2() < 0.5 ? 1 : 0);
      for (let i = 0; i < m; i++) {
        const x = x0 + bx + 0.5 + r2() * 7, y = y0 + by + 0.5 + r2() * 7;
        if (nearDep(x, y)) continue;
        const k = at(x, y), dune = W[k * 6 + 1];
        out.push([dune > 0.5 || r2() < 0.6 ? 'pebbles' : 'rock', Math.floor(r2() * 6), x, y, 0, geo(k), 0]);
      }
    }
    // planet props
    const pr = { 2: 'patina', 3: 'ice', 4: 'lavarock', 5: 'flora', 6: 'pylon', 7: 'crystal', 8: 'voidshard' }[P.style];
    if (pr) for (let i = 0; i < 10; i++) {
      const x = x0 + rnd() * S, y = y0 + rnd() * S, k = at(x, y);
      if (nearDep(x, y) || W[k * 6 + 1] > 0.5) continue;
      if (rnd() < 0.55) out.push([pr, Math.floor(rnd() * 4), x, y, rnd() < 0.3 ? 1 : 0, 0, 0]);
    }
    // landmarks inside this chunk
    for (const lm of C.lms) {
      if (lm.x < x0 || lm.x >= x0 + S || lm.y < y0 || lm.y >= y0 + S) continue;
      if (lm.type === 'wreck') {
        out.push(['wreck', lm.wreck, lm.x, lm.y, 2, 0, 0]);
        const r2 = T.rng(lm.seed);
        for (let i = 0; i < 9; i++) { const a = r2() * 6.283, d = 1 + r2() * 3; out.push(['debris', Math.floor(r2() * 4), lm.x + Math.cos(a) * d, lm.y + Math.sin(a) * d * 0.7, 0, 0, 0]); }
      } else if (lm.type === 'devils') {
        const r2 = T.rng(lm.seed);
        for (let i = 0; i < 6; i++) out.push(['devtrack', Math.floor(r2() * 4), lm.x + (r2() - 0.5) * 24, lm.y + (r2() - 0.5) * 24, 1, 0, 0]);
      }
    }
    out.sort((a, b) => a[3] - b[3]);
    return out;
  },

  // cheap single-point colour for overviews (no craters)
  sampleColor(x, y, P, out) {
    const T = TerrainCore; T.init();
    const o = new Float32Array(13);
    T.field(x, y, P, { craters: [], lms: [], deps: [] }, o);
    const c = P.col;
    const wS = o[1] * 1.6, wB = o[6] * 1.3, wL = o[5] * 1.6, wC = 0.6, sum = wS + wB + wL + wC;
    for (let i = 0; i < 3; i++) out[i] = ((c[1][i] * wS + c[4][i] * wB + c[5][i] * wL + c[2][i] * wC) / sum) * 255 * (1 + o[0] * 0.03);
  }
};

// ===== src/app/03u_terrainsys.js =====
// =====================================================================
// TerrainSys: main-thread manager for baked terrain chunks.
// Up to two Web Workers (built from TerrainCore's own source, so it all
// stays inside this single file), a main-thread fallback in 2 ms time
// slices, an LRU cache with a memory budget, four detail levels with
// cross-fades, look-ahead prefetching, and the rock/prop layer.
// =====================================================================
const TerrainSys = {
  LEVELS: [4, 10, 20, 34],
  workers: [], idle: [], queue: [], inflight: new Map(),
  cache: new Map(), bytes: 0,
  P: null, gen: 0, fallback: null, ok: true,
  budget() { return App.touch ? 110e6 : 190e6; },
  source() {
    const parts = [];
    for (const [k, v] of Object.entries(TerrainCore)) {
      if (typeof v === 'function') parts.push(v.toString());
      else parts.push(k + ': ' + JSON.stringify(k === 'GT' || k === '_gc' ? null : v));
    }
    return 'const TerrainCore = {\n' + parts.join(',\n') + '\n};\n' +
      'self.onmessage = e => { const j = e.data; let r;\n' +
      ' try { r = TerrainCore.bake(j); } catch (err) { self.postMessage({ key: j.key, gen: j.gen, error: String(err) }); return; }\n' +
      ' const msg = { key: j.key, gen: j.gen, w: r.w, h: r.h, mats: r.mats, props: r.props, lms: r.lms }; const tr = [];\n' +
      ' if (typeof OffscreenCanvas !== "undefined") {\n' +
      '  const oc = new OffscreenCanvas(r.w, r.h); oc.getContext("2d").putImageData(new ImageData(r.rgba, r.w, r.h), 0, 0); msg.bmp = oc.transferToImageBitmap(); tr.push(msg.bmp);\n' +
      '  if (r.emis) { const oe = new OffscreenCanvas(r.w, r.h); oe.getContext("2d").putImageData(new ImageData(r.emis, r.w, r.h), 0, 0); msg.ebmp = oe.transferToImageBitmap(); tr.push(msg.ebmp); }\n' +
      ' } else { msg.rgba = r.rgba; tr.push(r.rgba.buffer); if (r.emis) { msg.emis = r.emis; tr.push(r.emis.buffer); } }\n' +
      ' self.postMessage(msg, tr); };';
  },
  init() {
    TerrainCore.init();
    if (TerrainSys.workers.length || !window.Worker || !window.Blob) return;
    try {
      const url = URL.createObjectURL(new Blob([TerrainSys.source()], { type: 'text/javascript' }));
      const n = Math.max(1, Math.min(2, (navigator.hardwareConcurrency || 2) - 1));
      for (let i = 0; i < n; i++) {
        const w = new Worker(url);
        w.onmessage = e => TerrainSys.onResult(w, e.data);
        w.onerror = () => { TerrainSys.workers = TerrainSys.workers.filter(x => x !== w); TerrainSys.idle = TerrainSys.idle.filter(x => x !== w); };
        TerrainSys.workers.push(w); TerrainSys.idle.push(w);
      }
    } catch (e) { TerrainSys.workers = []; TerrainSys.idle = []; }
  },
  setPlanet(planet, seed) {
    TerrainSys.init();
    TerrainSys.P = TerrainCore.params(planet, seed);
    TerrainSys.P.landing = [CONFIG.landing.x, CONFIG.landing.y];
    TerrainSys.gen++;
    TerrainSys.cache.clear(); TerrainSys.bytes = 0; TerrainSys.queue.length = 0; TerrainSys.inflight.clear(); TerrainSys.fallback = null;
    if (TerrainCore._gc) TerrainCore._gc.clear();
    TerrainSys.idle = TerrainSys.workers.slice();
    TerrainSys.matCache = new Map();
  },
  key(cx, cy, L) { return cx + ',' + cy + ',' + L; },
  levelFor(ppt) {
    const L = TerrainSys.LEVELS, q = App.quality === 'low' ? 2 : 3;
    for (let i = 0; i <= q; i++) if (L[i] >= ppt * 0.8) return i;
    return q;
  },
  depsFor(g, cx, cy) {
    const S = CONFIG.chunkSize;
    const list = World.depositsInRect(g.world, cx * S - 5, cy * S - 5, (cx + 1) * S + 5, (cy + 1) * S + 5);
    return list.map(d => {
      let sx = 0, sy = 0; for (const t of d.tiles) { sx += t[0] + 0.5; sy += t[1] + 0.5; }
      return { x: sx / d.tiles.length, y: sy / d.tiles.length, r: 0.7 + Math.sqrt(d.tiles.length) * 0.55, tier: d.tier, col: DATA.RESOURCES[d.res].color };
    });
  },
  request(g, cx, cy, L, prio) {
    const key = TerrainSys.key(cx, cy, L);
    if (TerrainSys.cache.has(key) || TerrainSys.inflight.has(key)) return;
    const q = TerrainSys.queue.find(j => j.key === key);
    if (q) { q.prio = Math.min(q.prio, prio); return; }
    const deps = TerrainSys.depsFor(g, cx, cy);
    TerrainSys.queue.push({ key, cx, cy, L, prio, S: CONFIG.chunkSize, res: TerrainSys.LEVELS[L], P: TerrainSys.P, deps, depKey: deps.length + ':' + deps.map(d => d.x.toFixed(1)).join(','), gen: TerrainSys.gen });
  },
  pump() {
    const Q = TerrainSys.queue;
    if (!Q.length) return;
    Q.sort((a, b) => a.prio - b.prio);
    if (Q.length > 60) Q.length = 60;
    if (TerrainSys.workers.length) {
      while (TerrainSys.idle.length && Q.length) {
        const j = Q.shift(), w = TerrainSys.idle.pop();
        TerrainSys.inflight.set(j.key, j);
        w.postMessage(j);
      }
      return;
    }
    // fallback: bake on the main thread in time slices (max ~2 ms per frame)
    const t0 = performance.now();
    if (!TerrainSys.fallback) { const j = Q.shift(); TerrainSys.fallback = { job: j, it: TerrainCore.bakeIter(j) }; }
    const F = TerrainSys.fallback;
    let r;
    do { r = F.it.next(); } while (!r.done && performance.now() - t0 < 2);
    if (r.done) {
      TerrainSys.fallback = null;
      const v = r.value;
      TerrainSys.store(F.job, { w: v.w, h: v.h, rgba: v.rgba, emis: v.emis, mats: v.mats, props: v.props, lms: v.lms });
    }
  },
  onResult(w, m) {
    TerrainSys.idle.push(w);
    const job = TerrainSys.inflight.get(m.key);
    TerrainSys.inflight.delete(m.key);
    if (!job || m.gen !== TerrainSys.gen || m.error) return;
    TerrainSys.store(job, m);
  },
  store(job, m) {
    let img = m.bmp, em = m.ebmp || null;
    if (!img) {
      const c = Art.canvas(m.w, m.h); c.getContext('2d').putImageData(new ImageData(m.rgba, m.w, m.h), 0, 0); img = c;
      if (m.emis) { const e = Art.canvas(m.w, m.h); e.getContext('2d').putImageData(new ImageData(m.emis, m.w, m.h), 0, 0); em = e; }
    }
    const bytes = m.w * m.h * 4 * (em ? 2 : 1);
    const S = CONFIG.chunkSize;
    const e = { img, em, mats: m.mats, props: m.props, lms: m.lms, L: job.L, bytes, used: App.frame, born: App.now, comp: null, ox: job.cx * S, oy: job.cy * S };
    TerrainSys.cache.set(job.key, e);
    TerrainSys.bytes += bytes;
    TerrainSys.matCache.set(job.cx + ',' + job.cy, m.mats);
    if (m.lms) for (const l of m.lms) TerrainSys.landmarks.set(l.x.toFixed(1) + ',' + l.y.toFixed(1), l);
    TerrainSys.evict();
  },
  landmarks: new Map(),
  evict() {
    if (TerrainSys.bytes <= TerrainSys.budget()) return;
    const arr = [...TerrainSys.cache.entries()].sort((a, b) => a[1].used - b[1].used);
    const dead = [];
    for (const [k, e] of arr) {
      if (TerrainSys.bytes <= TerrainSys.budget() * 0.8 || e.used >= App.frame - 2) break;
      TerrainSys.cache.delete(k); TerrainSys.bytes -= e.bytes + (e.comp ? e.comp.width * e.comp.height * 4 : 0);
      e.dead = true; dead.push(e);
    }
    if (!dead.length) return;
    // drop every cross-fade that still points at an evicted image, then release the bitmaps
    for (const [k, st] of TerrainSys.shown) if (st.e.dead || (st.from && st.from.dead)) TerrainSys.shown.delete(k);
    if (TerrainSys.visible) TerrainSys.visible = TerrainSys.visible.filter(e => !e.dead);
    for (const e of dead) { if (e.img && e.img.close) e.img.close(); if (e.em && e.em.close) e.em.close(); e.comp = null; }
  },
  // best available image for a chunk: exact level, else the nearest other level
  best(cx, cy, L) {
    const C = TerrainSys.cache;
    let e = C.get(TerrainSys.key(cx, cy, L));
    if (e) return e;
    for (let d = 1; d < 4; d++) {
      e = C.get(TerrainSys.key(cx, cy, L - d)); if (e) return e;
      e = C.get(TerrainSys.key(cx, cy, L + d)); if (e) return e;

    return null;
  },
  matAt(x, y) {
    const S = CONFIG.chunkSize, cx = Math.floor(x / S), cy = Math.floor(y / S);
    const m = TerrainSys.matCache && TerrainSys.matCache.get(cx + ',' + cy);

  },

  // ---------------- drawing ----------------
  draw(ctx, g, vr) {
    if (!TerrainSys.P) return;
    const S = CONFIG.chunkSize, ppt = Render.ppt();
    const L = TerrainSys.levelFor(ppt);
    const bakeProps = ppt <= 24;
    TerrainSys.liveProps = !bakeProps;
    const cx0 = Math.floor(vr.x0 / S), cy0 = Math.floor(vr.y0 / S), cx1 = Math.floor(vr.x1 / S), cy1 = Math.floor(vr.y1 / S);
    const ccx = App.cam.x / S, ccy = App.cam.y / S;
    const P = Render.palette;
    ctx.imageSmoothingEnabled = true;
    let comps = 1;
    TerrainSys.visible = TerrainSys.visible || [];
    TerrainSys.visible.length = 0;
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const dist = Math.hypot(cx + 0.5 - ccx, cy + 0.5 - ccy);

      if (!TerrainSys.cache.has(TerrainSys.key(cx, cy, 0))) TerrainSys.request(g, cx, cy, 0, dist);
      TerrainSys.request(g, cx, cy, L, 2 + dist);
      const e = TerrainSys.best(cx, cy, L);
      const rx = cx * S - Render.ox, ry = cy * S - Render.oy;
      if (!e) { ctx.fillStyle = P.ground[1]; ctx.fillRect(rx, ry, S + 0.02, S + 0.02); continue; }
      e.used = App.frame;
      TerrainSys.visible.push(e);

      const ck = cx + ',' + cy, prev = TerrainSys.shown.get(ck);
      if (prev && prev.e !== e && prev.e.L !== e.L && !prev.fading) { prev.fading = true; prev.from = prev.e; prev.t0 = App.now; prev.e = e; }
      else if (!prev) TerrainSys.shown.set(ck, { e, fading: false });
      const st = TerrainSys.shown.get(ck);
      let img = e.img;
      if (bakeProps) {
        if ((!e.comp || e.compL !== L) && e.props && e.props.length && comps-- > 0) { e.comp = TerrainSys.composite(e); e.compL = L; }
        if (e.comp) img = e.comp;
      }
      if (st.fading && !App.settings.reducedFx) {
        const k = (App.now - st.t0) / 180;
        if (k >= 1) st.fading = false;
        else { ctx.drawImage(st.from.comp && bakeProps ? st.from.comp : st.from.img, rx, ry, S + 0.02, S + 0.02); ctx.globalAlpha = k; ctx.drawImage(img, rx, ry, S + 0.02, S + 0.02); ctx.globalAlpha = 1; continue; }
      }
      ctx.drawImage(img, rx, ry, S + 0.02, S + 0.02);
    }
    if (TerrainSys.shown.size > 300) TerrainSys.shown.clear();

    const p = g.run.player, vx = p.vx || 0, vy = p.vy || 0, sp = Math.hypot(vx, vy);
    if (sp > 0.5) {
      const ax = Math.round(vx / sp), ay = Math.round(vy / sp);
      for (let i = -1; i <= 1; i++) {
        const tx = Math.floor((ax ? (ax > 0 ? vr.x1 : vr.x0) : App.cam.x) / S) + ax + (ax ? 0 : i), ty = Math.floor((ay ? (ay > 0 ? vr.y1 : vr.y0) : App.cam.y) / S) + ay + (ay ? 0 : i);
        TerrainSys.request(g, tx, ty, Math.max(0, L - 1), 6);
      }
    }
    TerrainSys.pump();
  },
  shown: new Map(),
  composite(e) {
    const S = CONFIG.chunkSize, w = e.img.width, ppt = w / S;
    const c = Art.canvas(w, w), x = c.getContext('2d');
    x.drawImage(e.img, 0, 0);
    // chunk origin from any prop is not needed: props carry world coords; recover origin from the cache key
    x.setTransform(ppt, 0, 0, ppt, -e.ox * ppt, -e.oy * ppt);
    for (const pr of e.props) RockArt.draw(x, pr, 0, 0, ppt);
    return c;
  },
  // live props at close zoom (crisp, culled)
  drawProps(ctx, vr) {
    if (!TerrainSys.liveProps) return;
    const ppt = Render.ppt();
    for (const e of TerrainSys.visible) {
      if (!e.props) continue;
      for (const pr of e.props) {
        if (pr[2] < vr.x0 - 3 || pr[2] > vr.x1 + 3 || pr[3] < vr.y0 - 3 || pr[3] > vr.y1 + 3) continue;
        RockArt.draw(ctx, pr, Render.ox, Render.oy, ppt);
      }
    }
  },
  // night emission (lava, grid lines, bioluminescence, sparkles), additive after the grade
  drawEmission(ctx, night, tm) {
    if (!TerrainSys.P || !TerrainSys.P.emis || !TerrainSys.visible) return;
    const S = CONFIG.chunkSize;
    const pulse = TerrainSys.P.emis === 'lava' ? 0.8 + 0.2 * Math.sin(tm * 1.7) : 0.9 + 0.1 * Math.sin(tm * 0.9);
    const a = (0.25 + night * 0.75) * pulse;
    if (a < 0.02) return;
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
    for (const e of TerrainSys.visible) if (e.em) ctx.drawImage(e.em, e.ox * 1 - Render.ox, e.oy - Render.oy, S + 0.02, S + 0.02);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
};

// ===== src/app/03v_rocks.js =====
// =====================================================================
// RockArt: rock and prop sprites placed by the terrain (density driven).
// 4 size classes (pebble group, boulder, findling, slab) x 6 shapes x
// 4 geologies (basalt, sandstone, salt/gypsum, iron oxide) + mineral veins,
// planet props, wrecks and debris. Each sprite carries its own AO, a
// shadow towards the bottom right, a dust lip and a half-buried base.
// =====================================================================
const RockArt = {
  SIZE: [0.38, 0.72, 1.25, 2.1],
  hex(c) { return Col.hex(c[0] * 255, c[1] * 255, c[2] * 255); },
  geoColor(geo) {
    const P = TerrainSys.P, c = P.col;
    const base = [c[4], c[2], c[5], c[3]][geo] || c[2];
    const tint = ['#5e5862', '#a8694a', '#ddd3c2', '#8e5236'][geo];
    return Col.mix(RockArt.hex(base), tint, P.style <= 2 ? 0.45 : 0.2);
  },
  sprite(kind, v, cls, geo, flag, ppt) {
    return Art.cached('P|RK|' + kind + '|' + v + '|' + cls + '|' + geo + '|' + flag + '|' + ppt, () => RockArt.make(kind, v, cls, geo, flag, ppt));
  },
  draw(ctx, pr, ox, oy, ppt) {
    const [kind, v, x, y, cls, geo, flag] = pr;
    const bucket = Art.bucket(ppt, 96);
    const s = RockArt.sprite(kind, v, cls, geo, flag, bucket);
    ctx.drawImage(s.canvas, x - ox - s.ax, y - oy - s.ay, s.w, s.h);
  },
  make(kind, v, cls, geo, flag, ppt) {
    const P = TerrainSys.P;
    const sz = kind === 'rock' ? RockArt.SIZE[cls] : kind === 'pebbles' ? 0.9 : kind === 'wreck' ? 2.6 : kind === 'devtrack' ? 3 : kind === 'debris' ? 0.5 : 0.8 + cls * 0.5;
    const W = sz * 2.0 + 0.4, H = sz * 1.7 + 0.4;
    const c = Art.canvas(W * ppt, H * ppt), x = c.getContext('2d');
    x.scale(ppt, ppt); x.translate(W * 0.42, H * 0.62);
    x.lineJoin = 'round'; x.lineCap = 'round';
    const rnd = RNG.mulberry32(RNG.hash(RNG.hashString(kind), v * 31 + cls, geo * 7 + flag));

    const lip = (w, h) => {
      // dust lip and a sand tongue in the lee (wind direction)
      x.fillStyle = Col.rgba(Col.shade(dustCol, 0.18), 0.45); x.beginPath(); x.ellipse(0, h * 0.18, w * 1.15, h * 0.5, 0, 0, Math.PI * 2); x.fill();

      x.save();
      if (pts) { Art.poly(x, pts); x.clip(); }

    };

      const col = RockArt.geoColor(geo), t = Art.tones(col);

      shadow(w, d, hh); lip(w, d);

      } else {

        Art.facets(x, pts, -w * 0.28, -hh * 0.8, t, { lw: 0.025 + sz * 0.02 });

        x.strokeStyle = Col.rgba(t.rim, 0.7); x.lineWidth = 0.022;
        Art.polyline(x, pts.slice(Math.floor(n * 0.45), Math.floor(n * 0.85) + 1)); x.stroke();
        for (let i = 0; i < 4 + cls * 3; i++) { x.fillStyle = Col.rgba(i % 2 ? t.hi : t.lo, 0.5); x.fillRect((rnd() - 0.5) * w * 1.2, -hh * 0.55 + (rnd() - 0.5) * hh, 0.025, 0.025); }

        if (P.style === 5 && geo !== 2) { x.fillStyle = 'rgba(100,190,110,.55)'; x.beginPath(); x.ellipse(w * 0.2, -hh * 1.0, w * 0.5, hh * 0.22, 0, 0, Math.PI * 2); x.fill(); }
        bury(w, d, -hh * 0.2, pts);

    } else if (kind === 'pebbles') {
      const n = 4 + (v % 4);
      for (let i = 0; i < n; i++) {
        const px = (rnd() - 0.5) * sz * 1.1, py = (rnd() - 0.5) * sz * 0.5, r = 0.04 + rnd() * 0.06;
        const col = Col.shade(RockArt.geoColor((geo + i) % 4), (rnd() - 0.5) * 0.3), t = Art.tones(col);

    } else if (kind === 'devtrack') {

      x.beginPath(); let px = -sz, py = 0;

  },
  wreck(x, v, rnd, dustCol, shadowCol) {
    const steel = Art.pal('steel'), anth = Art.pal('anth'), white = Art.pal('white'), orange = Art.pal('orange');
    x.fillStyle = Col.rgba(Col.shade(dustCol, -0.3), 0.35); x.beginPath(); x.ellipse(0.2, 0.15, 1.6, 0.7, 0, 0, Math.PI * 2); x.fill();

      for (const wx of [-0.7, 0, 0.7]) { x.fillStyle = '#2a2a2e'; x.beginPath(); x.ellipse(wx, 0.3, 0.2, 0.12, 0, 0, Math.PI * 2); x.fill(); }

      x.strokeStyle = Col.rgba(Col.shade(dustCol, -0.3), 0.4); x.lineWidth = 0.08; x.beginPath(); x.moveTo(-1.0, 0.55); x.quadraticCurveTo(-2, 0.9, -3, 0.6); x.moveTo(-1.0, 0.1); x.quadraticCurveTo(-2, 0.4, -3, 0.15); x.stroke();

      x.strokeStyle = steel.base; x.lineWidth = 0.04; x.beginPath(); for (let i = 0; i < 8; i++) { x.moveTo(-1.3 + i * 0.32, -0.1); x.lineTo(-1.15 + i * 0.32, 0.06); } x.stroke();

    } else if (v === 4) { // weathered flag

      x.strokeStyle = anth.base; x.lineWidth = 0.07;
      x.beginPath(); x.moveTo(-0.6, -0.1); x.lineTo(-1.1, 0.35); x.moveTo(0.6, -0.1); x.lineTo(0.9, 0.2); x.lineTo(1.3, 0.25); x.stroke();
      x.fillStyle = orange.lo; x.fillRect(-0.6, -0.55, 1.2, 0.07);

    }
  },
  planetProp(x, kind, v, cls, rnd, dustCol, shadowCol) {
    const s = 0.8 + cls * 0.4;
    x.fillStyle = Col.rgba(shadowCol, 0.3); x.beginPath(); x.ellipse(0.15 * s, 0.08, 0.45 * s, 0.16 * s, 0, 0, Math.PI * 2); x.fill();

      const g = x.createLinearGradient(-0.5, -0.3, 0.5, 0.3); g.addColorStop(0, '#9af0d8'); g.addColorStop(1, '#1f8a76');
