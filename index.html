      case 'beamline': {
        x.strokeStyle = 'rgba(63,240,255,.35)'; x.lineWidth = 0.16; x.lineCap = 'round'; x.beginPath(); x.moveTo(-1.1, 0.1); x.quadraticCurveTo(0, -0.25, 1.1, 0.05); x.stroke();
        x.strokeStyle = '#d8ffff'; x.lineWidth = 0.04; x.stroke();
        break;
      }
      case 'crystal': {
        for (let i = 0; i < 4; i++) {
          const px = (i - 1.5) * 0.22, len = 0.45 + rnd() * 0.55, w = 0.08 + rnd() * 0.06, a = (i - 1.5) * 0.25;
          x.save(); x.translate(px, 0); x.rotate(a);
          const t = { hi: '#ffffff', base: Col.mix('#d8f0ff', Render.palette.accent, 0.25), lo: '#8aa8d0', edge: '#4a5a8a' };
          Art.facets(x, [[-w, 0], [-w * 0.8, -len], [0, -len - w * 1.3], [w * 0.8, -len], [w, 0]], -w * 0.2, -len * 0.5, t, { lw: 0.025 });
          x.restore();
        }
        break;
      }
      case 'stars': {
        for (let i = 0; i < 9; i++) { const px = (rnd() - 0.5) * 1.5, py = (rnd() - 0.5) * 1.0, s = 0.03 + rnd() * 0.05; x.fillStyle = rnd() < 0.3 ? '#c8b8ff' : '#ffffff'; x.beginPath(); x.arc(px, py, s, 0, Math.PI * 2); x.fill(); if (s > 0.06) Art.glint(x, px, py, s * 3); }
        break;
      }
      case 'gring': {
        x.strokeStyle = Col.rgba(Render.palette.accent, 0.45);
        for (let i = 1; i <= 3; i++) { x.lineWidth = 0.025; x.beginPath(); x.ellipse(0, 0, i * 0.35, i * 0.2, 0, 0, Math.PI * 2); x.stroke(); }
        x.fillStyle = 'rgba(0,0,0,.5)'; x.beginPath(); x.ellipse(0, 0, 0.12, 0.07, 0, 0, Math.PI * 2); x.fill();
        break;
      }
      case 'arc': {
        x.strokeStyle = Col.rgba('#c8c0ff', 0.55); x.lineWidth = 0.05;
        x.beginPath(); x.moveTo(-1.1, 0.4); x.bezierCurveTo(-0.6, -0.6, 0.6, -0.6, 1.1, 0.35); x.stroke();
        x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 0.02; x.stroke();
        break;
      }
    }
    return { canvas: c, w: bw, h: bh, ax: 0.5, ay, nom };
  }
};

// ===== src/app/03b_deposits.js =====
// =====================================================================
// DepositArt: organic deposits anchored in the ground. Static part is a
// cached sprite per deposit; rarity spectacle is drawn per frame.
// =====================================================================
const DepositArt = {
  // static sprite (tile units: origin = bbox x0-M, y0-TOP)
  M: 1.4, TOP: 2.2,
  bbox(d) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const t of d.tiles) { if (t[0] < x0) x0 = t[0]; if (t[1] < y0) y0 = t[1]; if (t[0] > x1) x1 = t[0]; if (t[1] > y1) y1 = t[1]; }
    return { x0, y0, x1: x1 + 1, y1: y1 + 1 };
  },
  sprite(d, ppt) {
    return Art.cached('P|DEP|' + d.id + '|' + ppt, () => DepositArt.render(d, ppt));
  },
  render(d, ppt) {
    const bb = DepositArt.bbox(d);
    const M = DepositArt.M, TOP = DepositArt.TOP;
    const W = bb.x1 - bb.x0 + M * 2, H = bb.y1 - bb.y0 + M + TOP;
    const c = Art.canvas(W * ppt, H * ppt), x = c.getContext('2d');
    x.scale(ppt, ppt);
    x.translate(M - bb.x0, TOP - bb.y0); // now world tile coords relative
    const R = DATA.RESOURCES[d.res], sp = ItemArt.spec(d.res);
    const rnd = RNG.mulberry32(RNG.hash(d.id & 0x7fffffff, 17));
    const P = Render.palette;
    const groundDark = Col.shade(P.ground[1], -0.35);
    // 1) discoloured halo in the ground
    const haloCol = d.tier === 0 ? Col.mix(groundDark, R.color, 0.25) : d.tier >= 4 ? Col.mix(R.color, '#ffffff', 0.2) : Col.mix(groundDark, R.color, 0.45);
    for (const t of d.tiles) {
      const g = x.createRadialGradient(t[0] + 0.5, t[1] + 0.5, 0.2, t[0] + 0.5, t[1] + 0.5, 1.5);
      g.addColorStop(0, Col.rgba(haloCol, d.tier >= 4 ? 0.28 : 0.34)); g.addColorStop(1, Col.rgba(haloCol, 0));
      x.fillStyle = g; x.fillRect(t[0] - 1.2, t[1] - 1.2, 3.4, 3.4);
    }
    // 2) organic blob: union of jittered circles
    const circles = [];
    for (const t of d.tiles) {
      circles.push([t[0] + 0.5 + (rnd() - 0.5) * 0.2, t[1] + 0.5 + (rnd() - 0.5) * 0.2, 0.62 + rnd() * 0.12]);
      for (let k = 0; k < 2; k++) circles.push([t[0] + 0.5 + (rnd() - 0.5) * 1.0, t[1] + 0.5 + (rnd() - 0.5) * 1.0, 0.3 + rnd() * 0.18]);
    }
    const blob = () => { x.beginPath(); for (const [cx, cy, r] of circles) { x.moveTo(cx + r, cy); x.arc(cx, cy, r, 0, Math.PI * 2); } };
    // raised rim / dust ring
    x.save(); x.translate(0.06, 0.08); blob(); x.fillStyle = 'rgba(0,0,0,.28)'; x.fill(); x.restore();
    x.save(); x.translate(-0.04, -0.05); blob(); x.fillStyle = Col.rgba(Col.shade(P.ground[2], 0.25), 0.55); x.fill(); x.restore();
    blob();
    const bed = d.tier === 0 ? Col.mix(groundDark, R.color, 0.3) : Col.mix(Col.shade(groundDark, -0.2), R.color, 0.22);
    x.fillStyle = bed; x.fill();
    // cracks radiating out
    x.strokeStyle = Col.rgba(Col.shade(groundDark, -0.45), 0.7); x.lineCap = 'round';
    for (let i = 0; i < 3 + d.tiles.length; i++) {
      const t = d.tiles[i % d.tiles.length];
      let px = t[0] + 0.5, py = t[1] + 0.5, a = rnd() * Math.PI * 2;
      x.lineWidth = 0.05; x.beginPath(); x.moveTo(px, py);
      for (let k = 0; k < 4; k++) { a += (rnd() - 0.5) * 0.9; px += Math.cos(a) * 0.3; py += Math.sin(a) * 0.3; x.lineTo(px, py); }
      x.stroke();
    }
    // speckled bed texture
    x.save(); blob(); x.clip();
    for (let i = 0; i < d.tiles.length * 14; i++) { const t = d.tiles[i % d.tiles.length]; x.fillStyle = Col.rgba(i % 3 ? '#000000' : R.color, i % 3 ? 0.18 : 0.45); x.fillRect(t[0] + rnd() * 1.2 - 0.1, t[1] + rnd() * 1.2 - 0.1, 0.06, 0.06); }
    x.restore();
    // 3) content by tier (sorted back to front)
    const items = [];
    for (const t of d.tiles) {
      const n = d.tier >= 3 ? 1 : 2 + (rnd() < 0.4 ? 1 : 0);
      for (let k = 0; k < n; k++) items.push([t[0] + 0.2 + rnd() * 0.6, t[1] + 0.3 + rnd() * 0.55, rnd()]);
    }
    items.sort((a, b) => a[1] - b[1]);
    const T = ItemArt.T(R.color);
    for (const [px, py, r] of items) DepositArt.piece(x, d, sp, px, py, r, rnd, T);
    // big centre cluster for rare deposits (silhouette grows with rarity)
    if (d.tier >= 3) {
      const cx = d.x + 0.5, cy = d.y + 0.7;
      const s = 0.55 + d.tier * 0.1;
      for (let k = 0; k < 3 + (d.tier >= 5 ? 2 : 0); k++) DepositArt.spike(x, cx + (k - 1.5) * 0.24 * s, cy + (k % 2) * 0.1, 0.16 * s + 0.05, (0.7 + (k % 2 ? 0.25 : 0.55)) * s * 1.4, (k - 1.5) * 0.22, d.tier === 7 ? ItemArt.T('#e8f4ff') : T);
      if (d.tier >= 3) { x.globalCompositeOperation = 'lighter'; x.globalAlpha = 0.45; x.drawImage(Sprites.glow(d.tier === 7 ? '#ffffff' : DATA.TIERS[d.tier].color), cx - 0.9, cy - 1.4, 1.8, 1.8); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; }
    }
    if (d.tier === 6) { // dark crater for the energy core
      const g = x.createRadialGradient(d.x + 0.5, d.y + 0.6, 0.05, d.x + 0.5, d.y + 0.6, 0.7);
      g.addColorStop(0, '#000000'); g.addColorStop(0.7, 'rgba(0,30,30,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.beginPath(); x.ellipse(d.x + 0.5, d.y + 0.6, 0.7, 0.45, 0, 0, Math.PI * 2); x.fill();
    }
    return { canvas: c, ox: bb.x0 - M, oy: bb.y0 - TOP, w: W, h: H };
  },
  spike(x, px, py, w, len, a, T) {
    x.save(); x.translate(px, py); x.rotate(a);
    const body = [[-w, 0], [-w * 0.85, -len], [0, -len - w * 1.3], [w * 0.85, -len], [w, 0]];
    x.fillStyle = T.base; Art.poly(x, body); x.fill();
    x.fillStyle = T.hi; Art.poly(x, [[-w, 0], [-w * 0.85, -len], [0, -len - w * 1.3], [-w * 0.1, 0]]); x.fill();
    x.fillStyle = T.lo; Art.poly(x, [[w * 0.4, 0], [w * 0.4, -len], [0, -len - w * 1.3], [w * 0.85, -len], [w, 0]]); x.fill();
    x.strokeStyle = T.edge; x.lineWidth = 0.045; Art.poly(x, body); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 0.025; x.beginPath(); x.moveTo(-w * 0.6, -len * 0.1); x.lineTo(-w * 0.55, -len * 0.85); x.stroke();
    x.restore();
  },
  piece(x, d, sp, px, py, r, rnd, T) {
    const fam = sp.fam;
    if (d.tier >= 2 && d.tier <= 7 && sp.cat !== 'metal' && sp.cat !== 'powder') { DepositArt.spike(x, px, py, 0.1 + r * 0.06, 0.35 + r * 0.35 + d.tier * 0.05, (r - 0.5) * 0.6, T); return; }
    if (sp.cat === 'powder') {
      const w = 0.28 + r * 0.12, h = 0.18 + r * 0.15;
      x.beginPath(); x.moveTo(px - w, py); x.bezierCurveTo(px - w * 0.6, py - h * 1.4, px + w * 0.6, py - h * 1.4, px + w, py); x.closePath();
      const g = x.createLinearGradient(px - w, py - h, px + w, py); g.addColorStop(0, T.hi); g.addColorStop(1, T.lo);
      x.fillStyle = g; x.fill(); x.strokeStyle = Col.rgba(T.edge, 0.6); x.lineWidth = 0.03; x.stroke();
      return;
    }
    if (fam === 'nugget' || fam === 'granules' || sp.cat === 'metal') {
      const rr = 0.1 + r * 0.08;
      const g = x.createRadialGradient(px - rr * 0.4, py - rr * 0.5, rr * 0.1, px, py - rr * 0.3, rr * 1.2);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, sp.cat === 'metal' && fam === 'ore' ? sp.c3 : T.base); g.addColorStop(1, T.edge);
      // host rock then shiny lump
      Art.facets(x, Art.blobPts(rnd, px, py - 0.06, 0.2 + r * 0.08, 0.14 + r * 0.05, 6, 0.4), px - 0.05, py - 0.1, ItemArt.T(sp.fam === 'ore' ? sp.c2 : Col.shade(Render.palette.rock, 0.1)), { lw: 0.03 });
      x.fillStyle = g; x.beginPath(); x.arc(px + 0.04, py - 0.12, rr, 0, Math.PI * 2); x.fill();
      return;
    }
    // stone chunks
    const tt = ItemArt.T(Col.shade(sp.c1, (r - 0.5) * 0.3));
    Art.facets(x, Art.blobPts(rnd, px, py - 0.1, 0.18 + r * 0.1, 0.13 + r * 0.08, 6, 0.35), px - 0.04, py - 0.14, tt, { lw: 0.035 });
  },

  // ---------------- per-frame spectacle ----------------
  dynamic(ctx, d, tm, night, zoom) {
    const t = d.tier;
    const cx = d.x + 0.5 - Render.ox, cy = d.y + 0.6 - Render.oy;
    const col = t === 7 ? Col.prism(tm, 0) : DATA.TIERS[t].color;
    const fx = !App.settings.reducedFx;
    ctx.globalCompositeOperation = 'lighter';
    // night glow (all coloured tiers)
    if (t >= 1 && night > 0.05) { ctx.globalAlpha = night * (0.25 + t * 0.07); ctx.drawImage(Sprites.glow(col), cx - 1.6, cy - 1.8, 3.2, 3.2); }
    // far beacon for legendary and above: a soft vertical beam, stronger when zoomed out
    if (t >= 4) {
      const far = U.clamp((40 - zoom) / 28, 0.25, 1);
      const pulse = 0.75 + 0.25 * Math.sin(tm * 2 + d.id);
      ctx.globalAlpha = (0.32 + night * 0.3) * far * pulse;
      ctx.drawImage(FxLib.tinted('beam', 0, col), cx - 0.9, cy - 9, 1.8, 9.4);
    }
    if (fx) {
      // sparkle glints (frequency and size by rarity)
      if (t >= 1) {
        const n = Math.min(4, t);
        for (let i = 0; i < n; i++) {
          const ph = (tm * (0.35 + t * 0.08) + i / n + Art.phase(d.id + i)) % 1;
          if (ph > 0.35) continue;
          const k = Math.sin(ph / 0.35 * Math.PI);
          const tl = d.tiles[(i * 7 + d.id) % d.tiles.length];
          const s = (0.12 + t * 0.05) * k;
          ctx.globalAlpha = k;
          ctx.drawImage(FxLib.get('glint4'), tl[0] + 0.3 + ((i * 37) % 10) / 25 - Render.ox - s, tl[1] + ((i * 53) % 10) / 20 - Render.oy - s, s * 2, s * 2);
        }
      }
      // legendary: light shimmer rising
      if (t === 4) {
        for (let i = 0; i < 3; i++) { const ph = (tm * 0.4 + i / 3) % 1; ctx.globalAlpha = Math.sin(ph * Math.PI) * 0.7; ctx.drawImage(FxLib.tinted('soft', 0, '#ffe08a'), cx - 0.12 + Math.sin(tm + i) * 0.25, cy - 0.6 - ph * 1.6, 0.24, 0.24); }
      }
      // mythic: floating shards circling
      if (t === 5) {
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        const T = ItemArt.T(DATA.RESOURCES[d.res].color);
        for (let i = 0; i < 4; i++) {
          const a = tm * 0.8 + i * Math.PI / 2;
          const px = cx + Math.cos(a) * 0.75, py = cy - 0.9 + Math.sin(a) * 0.28 + Math.sin(tm * 2 + i) * 0.06;
          ctx.save(); ctx.translate(px, py); ctx.rotate(a);
          ctx.fillStyle = T.hi; ctx.beginPath(); ctx.moveTo(0, -0.16); ctx.lineTo(0.07, 0); ctx.lineTo(0, 0.1); ctx.lineTo(-0.07, 0); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = T.edge; ctx.lineWidth = 0.025; ctx.stroke();
          ctx.restore();
        }
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + 0.2 * Math.sin(tm * 3); ctx.drawImage(Sprites.glow(col), cx - 1, cy - 1.7, 2, 2);
      }
      // exotic: energy core, gravity rings and arcs
      if (t === 6) {
        ctx.globalAlpha = 0.8 + 0.2 * Math.sin(tm * 5); ctx.drawImage(Sprites.glow('#2ef2e0'), cx - 0.6, cy - 1.05, 1.2, 1.2);
        ctx.globalAlpha = 1; ctx.drawImage(FxLib.get('soft'), cx - 0.2, cy - 0.65, 0.4, 0.4);
        for (let i = 0; i < 2; i++) { const s = ((tm * 0.5 + i * 0.5) % 1); ctx.globalAlpha = (1 - s) * 0.7; ctx.drawImage(FxLib.tinted('ring', 0, '#2ef2e0'), cx - s * 1.4, cy - 0.45 - s * 0.55, s * 2.8, s * 1.1); }
        if ((Math.floor(tm * 6) + d.id) % 4 === 0) { ctx.globalAlpha = 0.9; ctx.save(); ctx.translate(cx, cy - 0.45); ctx.rotate(tm * 7 % 6.28); ctx.drawImage(FxLib.tinted('bolt', Math.floor(tm * 6) % 3, '#bffff8'), -0.6, -0.2, 1.2, 0.4); ctx.restore(); }
      }
      // exquisite: prismatic light pillar and shimmering splinters
      if (t === 7) {
        for (let i = 0; i < 3; i++) { ctx.globalAlpha = 0.45; ctx.drawImage(FxLib.tinted('beam', 0, Col.prism(tm, i * 120)), cx - 0.35 + (i - 1) * 0.12, cy - 5.5, 0.7, 5.6); }
        for (let i = 0; i < 5; i++) { const a = tm * 0.9 + i * 1.256; ctx.globalAlpha = 0.9; const s = 0.18; ctx.drawImage(FxLib.tinted('glint4', 0, Col.prism(tm, i * 72)), cx + Math.cos(a) * 0.8 - s, cy - 0.8 + Math.sin(a) * 0.3 - s, s * 2, s * 2); }
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
};

// ===== src/app/04_draw.js =====
// =====================================================================
// Draw: facade used by the frame renderer and the UI. Static bodies come
// from BuildingArt sprites, belts from BeltArt, figures from CharArt;
// this file adds the per-frame animation (state machines, crossfades).
// =====================================================================
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
const GRADE_COLORS = ['#8b939c', '#f2c84b', '#4aa8ff', '#ff4fd8'];

const Draw = {
  tm: 0, dt: 0.016,
  arrow(ctx, cx, cy, dir, s, color) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(dir * Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.6, -s * 0.75); ctx.lineTo(-s * 0.25, 0); ctx.lineTo(-s * 0.6, s * 0.75); ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.save(); ctx.translate(s * 0.08, s * 0.1); ctx.fill(); ctx.restore();
    ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  },
  // level pill: UI overlay (not part of any texture)
  levelTag(ctx, b) {
    if (b.level <= 1 || App.cam.zoom < 20) return;
    const x = b.x - Render.ox, y = b.y - Render.oy;
    const fs = Math.max(0.24, 11 / App.cam.zoom), s = fs * 1.35;
    const txt = ROMAN[b.level];
    ctx.font = '800 ' + fs + 'px system-ui';
    const tw = ctx.measureText(txt).width + fs * 0.7;
    const vt = VT(b.level);
    ctx.fillStyle = ['rgba(20,22,28,.78)', 'rgba(30,40,56,.82)', 'rgba(40,32,16,.85)', 'rgba(60,46,10,.9)'][vt];
    Art.rrect(ctx, x + 0.08, y + b.h - s - 0.06, tw, s, s / 2); ctx.fill();
    ctx.strokeStyle = ['rgba(255,255,255,.25)', '#7fb0e0', '#c99d48', '#f2c14b'][vt]; ctx.lineWidth = fs * 0.08; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x + 0.08 + tw / 2, y + b.h - s / 2 - 0.05);
  },
  frontArrow(ctx, b, x, y) {
    const p = Grid.frontPort(b);
    const ax = p[0] - U.DX[b.rot] * 0.62 - Render.ox + 0.5 - (b.x - Render.ox - x);
    const ay = p[1] - U.DY[b.rot] * 0.62 - Render.oy + 0.5 - (b.y - Render.oy - y);
    Draw.arrow(ctx, ax, ay - 0.12, b.rot, 0.17, 'rgba(255,255,255,.92)');
  },

  // ---------------- belts ----------------
  beltShape(g, b) {
    if (b._sv === g.topoVersion) return b.shape;
    b._sv = g.topoVersion;
    const feeds = d => {
      const o = Grid.at(g, b.x - U.DX[d], b.y - U.DY[d]);
      if (!o) return false;
      if (o.type === 'belt' || o.type === 'merger') return o.x + U.DX[o.rot] === b.x && o.y + U.DY[o.rot] === b.y;
      if (o.type === 'splitter' || o.type === 'fsplitter' || o.type === 'osplitter') return true;
      return false;
    };
    const back = feeds(b.rot), left = feeds((b.rot + 1) & 3), right = feeds((b.rot + 3) & 3);
    b.shape = back || (left && right) || (!left && !right) ? 0 : left ? 1 : 2;
    return b.shape;
  },
  beltsBatch(ctx, g, list) { BeltArt.draw(ctx, g, list, Draw.tm); },
  belt(ctx, g, b, x, y) {
    const ppt = Art.bucket(Render.ppt(), 128);
    const shape = Draw.beltShape(g, b);
    const s = BeltArt.sprite(b.grade || 0, shape, b.rot, shape === 0 ? (b.id < 0 ? 3 : BeltArt.topo(g, b)) : 0, BeltArt.frameOf(b.grade || 0, CONFIG.belt.speed[b.grade || 0], Draw.tm), ppt);
    const M = BeltArt.M;
    ctx.drawImage(s, x - M, y - M, 1 + M * 2, 1 + M * 2);
  },
  itemPos(b, it, alpha) { const o = [0, 0, 0, 0]; BeltArt.itemPos(App.g, b, it, alpha, o); return o; },
  // item centred at x,y with half extent s (tiles)
  item(ctx, res, ref, x, y, s) {
    const m = ctx.getTransform();
    const scale = Math.hypot(m.a, m.b) || 1;
    const px = ItemArt.sizeFor(s * 2 * scale);
    const fr = DATA.RESOURCES[res].tier === 7 ? Math.floor(Draw.tm * 2) & 7 : 0;
    ctx.drawImage(ItemArt.sprite(res, ref, px, 0, fr), x - s, y - s, s * 2, s * 2);
  },

  // ---------------- buildings ----------------
  building(ctx, g, b, x, y) {
    if (b.type === 'belt') return Draw.belt(ctx, g, b, x, y);
    if (b.type === 'bridge') return;
    const now = App.now, fx = !App.settings.reducedFx;
    const vt = VT(b.level || 1);
    if (b.id >= 0) {
      if (b._lv === undefined) b._lv = b.level;
      else if (b._lv !== b.level) {
        const ov = VT(b._lv);
        if (ov !== vt) b._xf = { from: ov, at: now };
        if (b.level > b._lv) { b._up = now; Draw.upgradeFx(b); }
        b._lv = b.level;
      }
    }
    const extra = Draw.extraKey(g, b);
    let scaled = false;
    if (b._pop && fx) {
      const k = (now - b._pop) / 220;
      if (k >= 1) b._pop = 0;
      else {
        const s = k < 0.5 ? 0.9 + 0.16 * Art.ease.outCubic(k / 0.5) : 1.06 - 0.06 * Art.ease.inOutQuad((k - 0.5) / 0.5);
        ctx.save(); scaled = true;
        ctx.translate(x + b.w / 2, y + b.h); ctx.scale(s, s); ctx.translate(-x - b.w / 2, -y - b.h);
      }
    }
    // vibration of running extractors
    let jx = 0, jy = 0;
    if (b.type === 'extractor' && fx && b._spin > 0.5 && App.cam.zoom >= 16) { jx = Math.sin(now * 0.07 + b.id) * 0.01 * b._spin; jy = Math.cos(now * 0.09 + b.id * 3) * 0.006 * b._spin; }
    if (b._xf && fx) {
      const k = (now - b._xf.at) / 250;
      if (k >= 1) { b._xf = null; BuildingArt.drawBody(ctx, b, x + jx, y + jy, vt, extra); }
      else { BuildingArt.drawBody(ctx, b, x + jx, y + jy, b._xf.from, extra, 1 - k); BuildingArt.drawBody(ctx, b, x + jx, y + jy, vt, extra, k); }
    } else BuildingArt.drawBody(ctx, b, x + jx, y + jy, vt, extra);
    const D = Draw.D[b.type] || (REFINERY_LEVEL[b.type] ? Draw.D.refinery : null);
    if (D && (App.cam.zoom >= 10 || b.id < 0)) D(ctx, g, b, x + jx, y + jy, Draw.tm, vt);
    // upgrade glow pulse
    if (b._up && fx) {
      const k = (now - b._up) / 600;
      if (k >= 1) b._up = 0;
      else {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (1 - k) * 0.7;
        const r = Math.max(b.w, b.h) * (1.1 + k * 0.6);
        ctx.drawImage(FxLib.tinted('soft', 0, '#fff2c0'), x + b.w / 2 - r, y + b.h / 2 - r * 1.1, r * 2, r * 2);
        ctx.restore();
      }
    }
    if (scaled) ctx.restore();
  },
  extraKey(g, b) {
    if (b.type === 'path' || b.type === 'fence') {
      if (b.id < 0) return '0';
      if (b._mv !== g.topoVersion) {
        b._mv = g.topoVersion;
        let m = 0;
        for (let d = 0; d < 4; d++) { const o = Grid.at(g, b.x + U.DX[d], b.y + U.DY[d]); if (o && o.type === b.type) m |= 1 << d; }
        b._mask = m;
      }
      return String(b._mask);
    }
    if (b.type === 'lamp' || b.type === 'plant') return String(Math.min(3, b.level || 1));
    return '';
  },
  upgradeFx(b) {
    if (App.settings.reducedFx) return;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    Render.ring(cx, cy, Math.max(b.w, b.h) * 0.9, '#ffe9a0', 0.6);
    for (let i = 0; i < 18; i++) { const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 2.5; Render.spawn('spark', cx + Math.cos(a) * b.w * 0.3, cy + Math.sin(a) * b.h * 0.3, Math.cos(a) * v, Math.sin(a) * v - 1, 0.6 + Math.random() * 0.4, '#ffd27a', 0.12); }
  },
  approach(v, target, rate) { return v < target ? Math.min(target, v + rate) : Math.max(target, v - rate); },
  glowAt(ctx, x, y, r, color, a) {
    if (a <= 0.01) return;
    const ga = ctx.globalAlpha, op = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = ga * Math.min(1, a);
    ctx.drawImage(FxLib.tinted('soft', 0, color), x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = ga; ctx.globalCompositeOperation = op;
  },
  shelfItems(ctx, b, pts, s) {
    if (!b.shelf) return;
    let i = 0;
    for (const [k] of b.shelf) { if (i >= pts.length) break; Draw.item(ctx, k >> 2, k & 3, pts[i][0], pts[i][1], s); i++; }
  },

  // ---------------- per-type animation overlays ----------------
  D: {
    extractor(ctx, g, b, x, y, tm, vt) {
      const G = BuildingArt.GEO.extractor(vt);
      const working = b.id >= 0 && !(b.buf && b.buf.length >= CONFIG.maxItemsPerBuffer) && !(b.outs && !b.outs.length);
      // state machine: off -> spin-up (0.6 s) -> running -> blocked -> spin-down
      b._spin = Draw.approach(b._spin || 0, working ? 1 : 0, Draw.dt / 0.6);
      if (!App.settings.reducedFx) b._ang = ((b._ang || 0) + Draw.dt * b._spin * (5 + b.level * 0.5)) % (Math.PI * 2);
      const ppt = Art.bucket(Render.ppt(), 128);
      const [px, py] = G.pit;
      ctx.save(); ctx.translate(x + px, y + py); ctx.scale(1, 0.6); ctx.rotate(b._ang || 0);
      ctx.drawImage(BuildingArt.bitSprite(vt, ppt), -0.46, -0.46, 0.92, 0.92);
      ctx.restore();
      // kelly hub
      ctx.fillStyle = '#3a3f48'; ctx.beginPath(); ctx.ellipse(x + px, y + py - 0.02, 0.07, 0.045, 0, 0, Math.PI * 2); ctx.fill();
      // resource window
      const R = b.res !== undefined ? DATA.RESOURCES[b.res] : null;
      if (R) {
        const [wx, wy, ww, wh] = G.win;
        if (R.tier > 0) Draw.glowAt(ctx, x + wx + ww / 2, y + wy + wh / 2, 0.45, R.tier === 7 ? Col.prism(tm, 0) : DATA.TIERS[R.tier].color, 0.55);
        Draw.item(ctx, b.res, 0, x + wx + ww / 2, y + wy + wh / 2 + 0.01, Math.min(ww, wh) * 0.62);
        ctx.fillStyle = 'rgba(200,235,255,.16)'; ctx.fillRect(x + wx, y + wy, ww * 0.35, wh);
      }
      // status lamp
      const [lx, ly] = G.lamp;
      const red = b.warn === 'nocon', amber = b.warn === 'blocked' || (b.id >= 0 && !working);
      const blink = (red || amber) ? (Math.floor(tm * 3) & 1) : 1;
      const col = red ? '#ff4a3a' : amber ? '#ffc24d' : '#5aff7a';
      ctx.fillStyle = blink ? col : Col.shade(col, -0.6); ctx.beginPath(); ctx.arc(x + lx, y + ly - 0.04, 0.06, 0, Math.PI * 2); ctx.fill();
      if (blink) Draw.glowAt(ctx, x + lx, y + ly - 0.04, 0.22, col, 0.7);
      if (vt === 3 && (Math.floor(tm * 1.5) & 1)) Draw.glowAt(ctx, x + 1.75, y + G.ty - 0.45, 0.15, '#7fe8ff', 0.9);
      // dust from the drill
      if (working && b.made && !App.settings.reducedFx && App.quality !== 'low' && Math.random() < 0.14 * b._spin) Render.spawn('dust', b.x + px + (Math.random() - 0.5) * 0.7, b.y + py, (Math.random() - 0.5) * 0.8, -0.25 - Math.random() * 0.3, 0.9, Render.palette.particle, 0.09);
      // output indicators
      if (b.outs && App.cam.zoom >= 18) for (const o of b.outs) Draw.arrow(ctx, o[0] - U.DX[o[2]] * 0.62 + 0.5 - Render.ox, o[1] - U.DY[o[2]] * 0.62 + 0.5 - Render.oy, o[2], 0.12, 'rgba(255,255,255,.8)');
    },
    silo(ctx, g, b, x, y, tm, vt) {
      const G = BuildingArt.GEO.silo(vt);
      const cap = g.mods ? Economy.siloCap(g, b) : 1;
      const f = U.clamp((b.total || 0) / Math.max(1, cap), 0, 1);
      b._fv = b._fv === undefined ? f : b._fv + (f - b._fv) * Math.min(1, Draw.dt * 4);
      let best = -1, bc = 0;
      if (b.store) for (const [k, c] of b.store) if (c > bc) { bc = c; best = k; }
      const [wx, wy, ww, wh] = G.win;
      if (b._fv > 0.002 && best >= 0) {
        const col = DATA.RESOURCES[best >> 2].color;
        const top = y + wy + wh * (1 - b._fv);
        ctx.save(); Art.rrect(ctx, x + wx, y + wy, ww, wh, 0.05); ctx.clip();
        const gr = ctx.createLinearGradient(0, top, 0, y + wy + wh); gr.addColorStop(0, Col.shade(col, 0.25)); gr.addColorStop(1, Col.shade(col, -0.3));
        ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(x + wx, top);
        for (let i = 0; i <= 6; i++) ctx.lineTo(x + wx + ww * i / 6, top + Math.sin(tm * 3 + i * 1.3) * 0.02);
        ctx.lineTo(x + wx + ww, y + wy + wh); ctx.lineTo(x + wx, y + wy + wh); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(x + wx, top - 0.01, ww, 0.025);
        ctx.restore();
        Draw.item(ctx, best >> 2, best & 3, x + G.cx, y + wy - 0.2, 0.2);
      }
      ctx.fillStyle = 'rgba(200,235,255,.18)'; ctx.fillRect(x + wx + 0.02, y + wy, 0.05, wh);
      // inflow pulse at the top hatch
      if (b.id >= 0) {
        if (b._lt !== undefined && b.total > b._lt) b._pulse = 1;
        b._lt = b.total;
        if (b._pulse > 0) { Draw.glowAt(ctx, x + G.cx, y + G.top - 0.45, 0.45, '#bfe8ff', b._pulse * 0.6); b._pulse = Math.max(0, b._pulse - Draw.dt * 3); }
      }
      const lampCol = f >= 1 ? '#ff4a3a' : f > 0.9 ? '#ffc24d' : '#5aff7a';
      const on = f >= 1 ? (Math.floor(tm * 3) & 1) : 1;
      ctx.fillStyle = on ? lampCol : Col.shade(lampCol, -0.6); ctx.beginPath(); ctx.arc(x + G.cx, y + wy + wh + 0.14, 0.05, 0, Math.PI * 2); ctx.fill();
      if (on) Draw.glowAt(ctx, x + G.cx, y + wy + wh + 0.14, 0.18, lampCol, 0.6);
      if (b.outEnabled) Draw.frontArrow(ctx, b, x, y);
    },
    refinery(ctx, g, b, x, y, tm, vt) {
      const lvl = REFINERY_LEVEL[b.type];
      const G = BuildingArt.GEO.refinery(lvl, vt);
      const [sx, sy, sw, sh] = G.sky;
      const working = !!b.cur;
      b._heat = Draw.approach(b._heat || 0, working ? 1 : 0, Draw.dt / 0.8);
      if (b._heat > 0.01) {
        const col = b.cur ? DATA.RESOURCES[b.cur.res].color : (b._hc || '#ff9a4a');
        if (b.cur) b._hc = col;
        const pul = 0.75 + 0.25 * Math.sin(tm * 6 + b.id);
        ctx.save(); Art.rrect(ctx, x + sx, y + sy, sw, sh, 0.08); ctx.clip();
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = b._heat * pul * 0.85;
        ctx.drawImage(FxLib.tinted('soft', 0, Col.mix(col, '#ff8a3a', 0.35)), x + sx - 0.3, y + sy - 0.4, sw + 0.6, sh + 0.8);
        ctx.globalAlpha = b._heat * 0.9;
        ctx.fillStyle = Col.rgba(Col.shade(col, 0.4), 0.55); ctx.fillRect(x + sx, y + sy + sh - 0.1, sw * U.clamp(b.prog || 0, 0, 1), 0.1);
        ctx.restore();
        if (b.cur) Draw.item(ctx, b.cur.res, b.cur.ref, x + sx + sw / 2, y + sy + sh / 2 - 0.04, 0.26);
      }
      // steam synced with processing, output puff on completion
      if (!App.settings.reducedFx && b.id >= 0) {
        if (working && Math.random() < 0.12 * b._heat) for (const [cx, cy] of G.chim) Render.spawn('steam', b.x + cx + (Math.random() - 0.5) * 0.08, b.y + cy, (Math.random() - 0.5) * 0.2 + 0.15, -0.7 - Math.random() * 0.3, 2.2, '#e6eef0', 0.16);
        if (b._lm !== undefined && b.made > b._lm) {
          const p = Grid.frontPort(b);
          Render.spawn('ring', p[0] + 0.5 - U.DX[b.rot] * 0.5, p[1] + 0.5 - U.DY[b.rot] * 0.5, 0, 0, 0.35, DATA.BUILDINGS[b.type].color, 0.3);
          Render.spawn('steam', p[0] + 0.5 - U.DX[b.rot] * 0.5, p[1] + 0.3 - U.DY[b.rot] * 0.5, 0, -0.5, 0.8, '#f0f6f8', 0.14);
        }
        b._lm = b.made;
      }
      if (lvl === 3) Draw.glowAt(ctx, x + 1.35, y + 0.78 - BA_E - 0.7, 0.8, '#8a9aff', 0.25 + 0.2 * Math.sin(tm * 2.5));
      Draw.frontArrow(ctx, b, x, y);
    },
    cooler(ctx, g, b, x, y, tm, vt) {
      const G = BuildingArt.GEO.cooler(vt);
      if (!App.settings.reducedFx && b.id >= 0 && Math.random() < 0.18) Render.spawn('steam', b.x + G.cx + (Math.random() - 0.5) * 0.5, b.y + G.cy - G.hv, (Math.random() - 0.5) * 0.2, -0.8 - Math.random() * 0.4, 2.6, '#f0f8ff', 0.22);
      Draw.glowAt(ctx, x + G.cx, y + G.cy - G.hv, 0.45, '#bfe8ff', 0.15 + 0.1 * Math.sin(tm * 2));
    },
    servo(ctx, g, b, x, y, tm, vt) {
      const G = BuildingArt.GEO.servo(), ppt = Art.bucket(Render.ppt() * 1.5, 128);
      ctx.save(); ctx.translate(x + G.cx, y + G.cy); ctx.scale(1, 0.62); ctx.rotate(App.settings.reducedFx ? 0 : tm * 1.2 + b.id);
      ctx.drawImage(BuildingArt.gearSprite(vt, ppt), -0.75, -0.75, 1.5, 1.5);
      ctx.restore();
    },
    charger(ctx, g, b, x, y, tm, vt) {
      const G = BuildingArt.GEO.charger(vt);
      const pul = 0.5 + 0.5 * Math.sin(tm * 3 + b.id);
      Draw.glowAt(ctx, x + G.rod[0], y + G.rod[1], 0.5 + pul * 0.2, '#9bf06a', 0.4 + pul * 0.4);
      if (App.settings.reducedFx) return;
      const k = Math.floor(tm * 12 + b.id) % 6;
      if (k < 3) {
        const [cx, cy] = G.coils[k];
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const dx = G.rod[0] - cx, dy = G.rod[1] - cy, len = Math.hypot(dx, dy);
        ctx.translate(x + cx, y + cy); ctx.rotate(Math.atan2(dy, dx));
        ctx.drawImage(FxLib.tinted('bolt', Math.floor(tm * 20) % 3, '#c8ffb0'), 0, -0.15, len, 0.3);
        ctx.restore();
      }
    },
    lab(ctx, g, b, x, y, tm, vt) {
      const G = BuildingArt.GEO.lab(vt);
      const active = g.run && g.run.research && !!g.run.research.active;
      // turning dish on its mast
      const a = App.settings.reducedFx ? 0.6 : tm * 0.5 + b.id;
      const ppt = Art.bucket(Render.ppt() * 1.2, 96);
      ctx.save(); ctx.translate(x + G.dish[0], y + G.dish[1]); ctx.scale(0.35 + 0.65 * Math.abs(Math.cos(a)), 1);
      ctx.drawImage(BuildingArt.dishSprite(ppt), -0.6, -0.6, 1.2, 1.2);
      ctx.restore();
      if (active) {
        // holographic atom above the dome
        const [hx, hy] = G.holo;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(127,211,255,.75)'; ctx.lineWidth = 0.03;
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(x + hx, y + hy, 0.42, 0.14, tm * 0.8 + i * Math.PI / 3, 0, Math.PI * 2); ctx.stroke(); }
        ctx.restore();
        Draw.glowAt(ctx, x + hx, y + hy, 0.3, '#bfe8ff', 0.8 + 0.2 * Math.sin(tm * 5));
        for (let i = 0; i < 3; i++) { const e = tm * 2.4 + i * 2.1; Draw.glowAt(ctx, x + hx + Math.cos(e) * 0.42, y + hy + Math.sin(e) * 0.14, 0.08, '#ffffff', 0.9); }
        // lit windows
        const fy0 = G.by + 2.1 - G.bh * Art.V;
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,220,150,' + (0.35 + 0.1 * Math.sin(tm * 3)).toFixed(2) + ')';
        for (let i = 0; i < 6; i++) ctx.fillRect(x + 0.55 + i * 0.5, y + fy0 + 0.12, 0.3, 0.26);
        ctx.restore();
      }
    },
    bazaar(ctx, g, b, x, y, tm, vt) {
      const W = b.w, H = b.h;
      const cy = y + H - 0.72 - BA_E - 0.55 * Art.V + 0.18;
      const pts = []; for (let i = 0; i < 4; i++) pts.push([x + 0.45 + i * ((W - 0.9) / 3), cy]);
      Draw.shelfItems(ctx, b, pts, 0.2);
      const n = Math.max(5, Math.round(W * 2.5));
      const ayF = H * 0.52 - 0.6;
      const night = Render.night || 0;
      for (let i = 0; i < n; i++) {
        const u = (i + 0.5) / n, bx = x + 0.14 + (W - 0.28) * u, by = y + ayF + 0.15 + Math.sin(u * Math.PI) * 0.18;
        const on = 0.6 + 0.4 * Math.sin(tm * 3 + i * 1.7);
        ctx.fillStyle = ['#ffd27a', '#ff8ad8', '#8ae0ff'][i % 3]; ctx.beginPath(); ctx.arc(bx, by + 0.03, 0.035, 0, Math.PI * 2); ctx.fill();
        Draw.glowAt(ctx, bx, by + 0.03, 0.14, ['#ffd27a', '#ff8ad8', '#8ae0ff'][i % 3], (0.25 + night * 0.75) * on);
      }
    },
    caravan(ctx, g, b, x, y, tm, vt) {
      const W = b.w, H = b.h;
      for (const px of [0.2, W - 0.2]) {
        const w = Math.sin(tm * 5 + px) * 0.06;
        ctx.fillStyle = px < 1 ? '#e05a3a' : Render.palette.accent;
        ctx.beginPath(); ctx.moveTo(x + px, y + 0.2 - 1.25); ctx.quadraticCurveTo(x + px + 0.25, y + 0.2 - 1.2 + w, x + px + 0.5, y + 0.2 - 1.12 + w * 1.5); ctx.lineTo(x + px, y + 0.2 - 0.95); ctx.closePath(); ctx.fill();
      }
      const ty = y + H - 1.05 - 0.35 * Art.V + 0.22;
      const pts = []; for (let i = 0; i < 5; i++) pts.push([x + W / 2 - 0.55 + i * 0.275, ty - (i % 2) * 0.05]);
      Draw.shelfItems(ctx, b, pts, 0.17);
    },
    shuttlepad(ctx, g, b, x, y, tm, vt) {
      const W = b.w, H = b.h, ty = 0.01, y1 = H - 0.23;
      const pts = [[0.42, ty + 0.3], [W - 0.42, ty + 0.3], [W - 0.42, y1 - 0.3], [0.42, y1 - 0.3]];
      const k = Math.floor(tm * 4) % 4;
      pts.forEach(([lx, ly], i) => { const on = i === k; ctx.fillStyle = on ? '#ff8a7a' : '#7a2a24'; ctx.beginPath(); ctx.arc(x + lx, y + ly, 0.07, 0, Math.PI * 2); ctx.fill(); if (on) Draw.glowAt(ctx, x + lx, y + ly, 0.35, '#ff6a5a', 0.9); });
      Draw.shelfItems(ctx, b, [[x + 0.9, y + H - 0.75], [x + 1.35, y + H - 0.75], [x + 1.8, y + H - 0.75], [x + 0.9, y + H - 1.15], [x + 1.35, y + H - 1.15], [x + 1.8, y + H - 1.15]], 0.18);
    },
    port(ctx, g, b, x, y, tm, vt) {
      const W = b.w, H = b.h;
      for (const [i, cxm] of [[0, 0.55], [1, W - 0.55]]) {
        const a = Math.sin(tm * 0.4 + i * 2) * 0.9 + (i ? Math.PI : 0);
        const mx = x + cxm, my = y + H - 0.7 - BA_E - 2.1;
        const L = 2.0;
        ctx.strokeStyle = '#8a6a1a'; ctx.lineWidth = 0.14; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + Math.cos(a) * L, my + Math.sin(a) * L * 0.45); ctx.stroke();
        ctx.strokeStyle = '#f0b43a'; ctx.lineWidth = 0.09; ctx.stroke();
        const ex = mx + Math.cos(a) * L * 0.85, ey = my + Math.sin(a) * L * 0.45 * 0.85;
        ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 0.02; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex, ey + 1.0); ctx.stroke();
        Art.box(ctx, ex - 0.15, ey + 1.0, 0.3, 0.2, 0.2, Art.tones(i ? '#3a7ad8' : '#d8503a'), { r: 0.02, lw: 0.02 });
      }
      const tY = y + 1.05 - BA_E - (2.6 + vt * 0.25) * Art.V - 0.7;
      if (Math.floor(tm * 1.5) & 1) Draw.glowAt(ctx, x + W / 2, tY, 0.3, '#ff5a5a', 0.95);
      Draw.shelfItems(ctx, b, [[x + 2.8, y + 2.0], [x + 3.25, y + 2.05], [x + 3.7, y + 2.0], [x + 4.15, y + 2.05]], 0.18);
    },
    dock(ctx, g, b, x, y, tm, vt) {
      const W = b.w, H = b.h;
      const gh = 3.0 + vt * 0.2, beamY = y + 1.6 - BA_E - gh * Art.V;
      const tx = x + W / 2 + Math.sin(tm * 0.35 + b.id) * (W / 2 - 1.6);
      Art.box(ctx, tx - 0.35, beamY - 0.06, 0.7, 0.36, 0.25, Art.pal('anth'), { r: 0.03, lw: 0.02 });
      const hook = 1.6 + Math.sin(tm * 0.7) * 0.5;
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 0.025; ctx.beginPath(); ctx.moveTo(tx - 0.1, beamY + 0.2); ctx.lineTo(tx - 0.1, beamY + hook); ctx.moveTo(tx + 0.1, beamY + 0.2); ctx.lineTo(tx + 0.1, beamY + hook); ctx.stroke();
      Art.box(ctx, tx - 0.5, beamY + hook, 1.0, 0.45, 0.42, Art.tones('#3aa86a'), { r: 0.02, lw: 0.02 });
      const k = Math.floor(tm * 6) % 6, bx0 = x + 1.7, by0 = y + 2.2 - BA_E, bh = H - 3.2;
      for (let i = 0; i < 6; i++) for (const sx of [bx0 + 0.3, bx0 + W - 3.4 - 0.3]) { const on = i === k; const ly = by0 + 0.5 + i * (bh - 1) / 5; ctx.fillStyle = on ? '#ffe08a' : '#6a5a2a'; ctx.beginPath(); ctx.arc(sx, ly, 0.06, 0, Math.PI * 2); ctx.fill(); if (on) Draw.glowAt(ctx, sx, ly, 0.3, '#ffd27a', 0.9); }
      Draw.shelfItems(ctx, b, [[x + 2.4, y + H - 1.1], [x + 2.9, y + H - 1.1], [x + 3.4, y + H - 1.1], [x + 2.4, y + H - 1.6], [x + 2.9, y + H - 1.6], [x + 3.4, y + H - 1.6]], 0.2);
    },
    terminal(ctx, g, b, x, y, tm, vt) {
      const W = b.w, H = b.h;
      const hx = x + W / 2, hy = y + H - 2.2 - BA_E - 0.45 * Art.V - 1.0;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const R = 0.75;
      const gr = ctx.createRadialGradient(hx, hy, 0.05, hx, hy, R); gr.addColorStop(0, 'rgba(255,160,220,.35)'); gr.addColorStop(1, 'rgba(255,95,168,.05)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(hx, hy, R, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,170,220,.7)'; ctx.lineWidth = 0.025;
      for (let i = 0; i < 4; i++) { const k = Math.cos(tm * 0.8 + i * Math.PI / 4); ctx.beginPath(); ctx.ellipse(hx, hy, Math.abs(k) * R, R, 0, 0, Math.PI * 2); ctx.stroke(); }
      for (let i = -2; i <= 2; i++) { const yy = hy + i * R * 0.38; const rr = Math.sqrt(Math.max(0, R * R - (yy - hy) * (yy - hy))); ctx.beginPath(); ctx.ellipse(hx, yy, rr, rr * 0.18, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(140,230,255,.75)'; ctx.lineWidth = 0.035; ctx.beginPath(); ctx.ellipse(hx, hy, R * 1.35, R * 0.35, Math.sin(tm * 0.5) * 0.2, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      Draw.glowAt(ctx, hx, y + H - 2.2 - BA_E - 0.45 * Art.V, 0.8, '#ff9fd0', 0.5);
      if (Math.floor(tm * 1.2) & 1) Draw.glowAt(ctx, x + W - 1.6, y + 1.7 - BA_E - 0.5 - 1.8 * Art.V - 1.25, 0.25, '#ff9fd0', 0.9);
    },
    lamp(ctx, g, b, x, y, tm, vt) {
      const n = Render.night || 0;
      const heads = b.level >= 2 ? [0.72, 0.28] : [0.72];
      for (const hx of heads) Draw.glowAt(ctx, x + hx, y + 0.72 - 1.57 + 0.11, 0.22, b.level >= 2 ? '#d8f0ff' : '#ffe28a', 0.25 + n * 0.75);
    },
    flag(ctx, g, b, x, y, tm, vt) {
      const fx = x + 0.37, fy = y + 0.78 - 1.6;
      const col = b.level >= 2 ? Render.palette.accent : DATA.BUILDINGS.flag.color;
      const t = Art.tones(col);
      ctx.beginPath(); ctx.moveTo(fx, fy);
      const L = 0.75, Hh = 0.42, ph = tm * 5 + b.x;
      for (let i = 1; i <= 8; i++) { const u = i / 8; ctx.lineTo(fx + L * u, fy + Math.sin(ph - u * 3) * 0.06 * u); }
      for (let i = 8; i >= 0; i--) { const u = i / 8; ctx.lineTo(fx + L * u, fy + Hh + Math.sin(ph - u * 3) * 0.06 * u); }
      ctx.closePath();
      const gr = ctx.createLinearGradient(fx, 0, fx + L, 0); gr.addColorStop(0, t.hi); gr.addColorStop(0.5 + Math.sin(ph) * 0.2, t.base); gr.addColorStop(1, t.lo);
      ctx.fillStyle = gr; ctx.fill(); ctx.strokeStyle = t.edge; ctx.lineWidth = 0.02; ctx.stroke();
      // emblem: simple planet ring
      ctx.strokeStyle = Col.rgba('#ffffff', 0.85); ctx.lineWidth = 0.03; ctx.beginPath(); ctx.arc(fx + L * 0.42, fy + Hh / 2 + Math.sin(ph - 1.2) * 0.03, 0.09, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(fx + L * 0.42, fy + Hh / 2 + Math.sin(ph - 1.2) * 0.03, 0.16, 0.05, -0.3, 0, Math.PI * 2); ctx.stroke();
    },
    beacon(ctx, g, b, x, y, tm, vt) {
      const cx = x + 0.5, cy = y + 0.78 - 0.08 - 1.65 - 0.1;
      const p = 0.5 + 0.5 * Math.sin(tm * 3 + b.x);
      Draw.glowAt(ctx, cx, cy, 0.4 + p * 0.25, DATA.BUILDINGS.beacon.color, 0.6 + p * 0.4);
      if (App.settings.reducedFx) return;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35 + (Render.night || 0) * 0.4;
      ctx.translate(cx, cy); ctx.scale(1, 0.45); ctx.rotate(tm * 1.6 + b.id);
      ctx.drawImage(FxLib.tinted('beam', 0, '#7fe0ff'), 0, -0.5, 4.5, 1.0);
      ctx.restore();
    },
    plant(ctx, g, b, x, y, tm, vt) { if (Math.sin(tm * 0.7 + b.x) > 0.97) Draw.glowAt(ctx, x + 0.36, y + 0.2, 0.15, '#ffffff', 0.6); },
    fsplitter(ctx, g, b, x, y, tm) {
      if (!b.filter) return;
      const cx = x + 0.5, cy = y + 0.16 - 0.38 * Art.V + 0.36;
      if (b.filter.kind === 'res') Draw.item(ctx, b.filter.res, 0, cx, cy, 0.13);
      else { ctx.fillStyle = b.filter.kind === 'tier' ? DATA.TIERS[b.filter.tier].color : '#ffcf4a'; ctx.beginPath(); ctx.arc(cx, cy, 0.07, 0, Math.PI * 2); ctx.fill(); }
    }
  },

  // ---------------- bridge (steel truss arch) ----------------
  bridge(ctx, g, b, alpha) {
    const ex = b.x + U.DX[b.rot] * (b.len - 1), ey = b.y + U.DY[b.rot] * (b.len - 1);
    const ax = b.x + 0.5 - Render.ox, ay = b.y + 0.5 - Render.oy, bx = ex + 0.5 - Render.ox, by = ey + 0.5 - Render.oy;
    const lift = 0.7 + b.len * 0.12;
    const mx = (ax + bx) / 2, my = (ay + by) / 2 - lift * 2;
    const sun = Render.sun(g);
    const q = (t, p0, p1, p2) => (1 - t) * (1 - t) * p0 + 2 * (1 - t) * t * p1 + t * t * p2;
    // shadow of the arch on the ground
    ctx.strokeStyle = 'rgba(10,8,20,' + (sun.a * 0.9).toFixed(3) + ')'; ctx.lineWidth = 0.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2 + sun.dx * lift, (ay + by) / 2 + sun.dy * lift, bx, by); ctx.stroke();
    // ramps
    const t = Art.tones(DATA.BUILDINGS.bridge.color);
    for (const [px, py] of [[ax, ay], [bx, by]]) Art.box(ctx, px - 0.42, py - 0.38, 0.84, 0.8, 0.45, t, { r: 0.08 });
    // truss underside + deck
    ctx.strokeStyle = t.edge; ctx.lineWidth = 0.58; ctx.beginPath(); ctx.moveTo(ax, ay - 0.25); ctx.quadraticCurveTo(mx, my, bx, by - 0.25); ctx.stroke();
    ctx.strokeStyle = t.lo; ctx.lineWidth = 0.5; ctx.stroke();
    ctx.strokeStyle = '#25282d'; ctx.lineWidth = 0.34; ctx.stroke();
    ctx.strokeStyle = t.hi; ctx.lineWidth = 0.04;
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) { const u = i / 10; const px = q(u, ax, mx, bx), py = q(u, ay - 0.25, my, by - 0.25); ctx.moveTo(px - 0.2, py + 0.2); ctx.lineTo(px + 0.2, py + 0.2); }
    ctx.stroke();
    ctx.strokeStyle = Col.rgba(t.rim, 0.8); ctx.lineWidth = 0.035; ctx.beginPath(); ctx.moveTo(ax - 0.2, ay - 0.42); ctx.quadraticCurveTo(mx - 0.2, my - 0.17, bx - 0.2, by - 0.42); ctx.stroke();
    Draw.arrow(ctx, bx, by - 0.45, b.rot, 0.16, '#fff');
    for (const qq of b.queue) {
      const u = ((qq.pt !== undefined ? qq.pt + (qq.t - qq.pt) * alpha : qq.t)) / Math.max(1, b.len - 1);
      const px = q(u, ax, mx, bx), py = q(u, ay - 0.25, my, by - 0.25);
      Draw.item(ctx, qq.it.res, qq.it.ref, px, py - 0.08, 0.26);
    }
  },

  // ---------------- customers ----------------
  slotPos(b, slot, tier) {
    if (tier === 0) return [b.x + 0.6 + (slot % 3) * ((b.w - 1.2) / 2), b.y + b.h + 0.55];
    if (tier === 1) return [b.x + b.w / 2, b.y + b.h + 0.9];
    if (b.type === 'port') { const p = BuildingArt.GEO.pads('port', b.w)[slot % 2]; return [b.x + p[0], b.y + p[1]]; }
    return [b.x + b.w / 2, b.y + b.h / 2 + 0.2];
  },
  customers(ctx, g, b) {
    const tm = Draw.tm;
    for (const c of b.customers) {
      const [px, py] = Draw.slotPos(b, c.slot, c.tier);
      let x = px, y = py, k = 1;
      if (c.state === 'in') k = U.clamp(c.t / c.arrive, 0, 1);
      else if (c.state === 'out') k = 1 - U.clamp(c.t / 3, 0, 1);
      const e = Art.ease.inOutQuad(k);
      if (c.tier <= 1) { x = c.sx + (px - c.sx) * e; y = c.sy + (py - c.sy) * e; }
      c._wx = x; c._wy = y;
      const rx = x - Render.ox, ry = y - Render.oy;
      if (c.tier === 0) Draw.alien(ctx, rx, ry, c, tm, (px - c.sx) * (c.state === 'out' ? -1 : 1) >= 0 ? 1 : -1);
      else if (c.tier === 1) CharArt.caravan(ctx, rx, ry, c, tm, Math.atan2(py - c.sy, px - c.sx) + (c.state === 'out' ? Math.PI : 0), c.state !== 'wait');
      else CharArt.ship(ctx, rx, ry, c, tm, b);
      if (c.state === 'wait' && App.cam.zoom >= 14) CharArt.bubble(ctx, rx, ry - (c.tier === 0 ? 1.55 : c.tier === 1 ? 1.6 : [0, 0, 2.2, 3.4, 5.6][c.tier] * 0.55), c, tm);
      else c._bubAt = 0;
    }
  },
  skinCache: null,
  planetSkins() {
    const P = Render.palette;
    if (Draw.skinCache && Draw.skinCache.k === P.index) return Draw.skinCache.list;
    const base = ['#7be07a', '#b07aff', '#4ad0d8', '#ff9a5a', '#e0d050', '#ff7ab0'];
    const rot = P.index - 1;
    const list = base.map((c, i) => Col.mix(base[(i + rot) % base.length], P.accent, 0.2 + (P.index % 3) * 0.06));
    Draw.skinCache = { k: P.index, list };
    return list;
  },
  alien(ctx, x, y, c, tm, dirx) { CharArt.alien(ctx, x, y, c, tm, dirx); },
  astronaut(ctx, g, x, y, tm) { CharArt.astronaut(ctx, g, x, y, tm, Draw.dt); },

  // ---------------- UI thumbnails (built from the real sprites) ----------------
  thumbCache: new Map(),
  thumb(type, size = 56, opts = {}) {
    const key = type + '|' + size + '|' + (opts.grade || 0) + '|' + (opts.res === undefined ? '' : opts.res);
    const d = Math.min(2, window.devicePixelRatio || 1);
    let src = Draw.thumbCache.get(key);
    if (!src) {
      const S = Math.round(size * d);
      src = document.createElement('canvas'); src.width = src.height = S;
      const x = src.getContext('2d');
      const def = DATA.BUILDINGS[type];
      try {
        if (type === 'belt') {
          const ppt = Art.bucket(S / 1.4, 128);
          const sc = S / 1.5;
          x.setTransform(sc, 0, 0, sc, S / 2 - sc * 0.5, S / 2 - sc * 0.5);
          x.drawImage(BeltArt.sprite(opts.grade || 0, 0, 0, 0, 0, ppt), -BeltArt.M, -BeltArt.M, 1 + BeltArt.M * 2, 1 + BeltArt.M * 2);
        } else if (type === 'bridge') {
          const sc = S / 3.6;
          x.setTransform(sc, 0, 0, sc, S / 2 - sc * 1.5, S / 2 - sc * 0.2);
          const t = Art.tones(def.color);
          Art.box(x, 0.1, 0.1, 0.8, 0.8, 0.45, t, { r: 0.08 }); Art.box(x, 2.1, 0.1, 0.8, 0.8, 0.45, t, { r: 0.08 });
          x.lineCap = 'round'; x.strokeStyle = t.lo; x.lineWidth = 0.5; x.beginPath(); x.moveTo(0.5, 0.25); x.quadraticCurveTo(1.5, -1.3, 2.5, 0.25); x.stroke();
          x.strokeStyle = '#25282d'; x.lineWidth = 0.32; x.stroke();
        } else {
          const w = def.w, h = def.h;
          const ppt = Art.bucket(S / Math.max(w, h) * 1.1, 128);
          const spr = BuildingArt.sprite(type, 0, 0, w, h, ppt, type === 'path' ? '0' : type === 'fence' ? '5' : (type === 'lamp' || type === 'plant') ? '1' : '');
          // fit the sprite's painted extent: footprint plus the tall part
          const top = BuildingArt.TOP[type] || 1;
          const ext = Math.max(w + 0.3, h + top * 0.85);
          const sc = S / ext;
          const cx = w / 2, cy = (h - top * 0.85) / 2 + 0.05;
          x.setTransform(sc, 0, 0, sc, S / 2 - cx * sc, S / 2 - cy * sc);
          x.drawImage(spr.canvas, spr.ox, spr.oy, spr.w, spr.h);
          if (type === 'extractor' && opts.res !== undefined) { const G = BuildingArt.GEO.extractor(0); Draw.item(x, opts.res, 0, G.win[0] + G.win[2] / 2, G.win[1] + G.win[3] / 2, Math.min(G.win[2], G.win[3]) * 0.62); }
          if (type === 'flag') { Render.palette = Render.palette || { accent: '#ff9a3d' }; Draw.D.flag(x, null, { x: 0, level: 1 }, 0, 0, 0.6, 0); }
        }
      } catch (e) { x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = def ? def.color : '#888'; x.fillRect(S * 0.15, S * 0.15, S * 0.7, S * 0.7); }
      Draw.thumbCache.set(key, src);
    }
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src, 0, 0);
    return c;
  }
};

// ===== src/app/04a_buildings.js =====
// =====================================================================
// BuildingArt: 2.5D building bodies (cached sprites per type / visual
// tier / rotation / resolution) plus cheap animated overlays per frame.
// Visual tiers: L1-3 = 0 (raw, riveted), L4-6 = 1 (clean steel, hazard
// marks), L7-9 = 2 (anthracite + brass, extra modules), L10 = 3 (white +
// gold, glowing trims). Light from top left, cast shadows are batched.
// =====================================================================
const VT = lvl => lvl >= 10 ? 3 : lvl >= 7 ? 2 : lvl >= 4 ? 1 : 0;
const BA_E = 0.077; // height of the foundation plate on screen

const BuildingArt = {
  // tiles above the footprint that a sprite needs (tall parts)
  TOP: { extractor: 1.7, splitter: 0.6, merger: 0.6, crossing: 0.6, fsplitter: 0.7, osplitter: 0.7, silo: 2.6, refinery1: 1.9, refinery2: 2.2, refinery3: 2.4, cooler: 2.2, servo: 0.9, charger: 1.6, lab: 2.4, bazaar: 1.4, caravan: 1.5, shuttlepad: 1.0, port: 3.0, dock: 3.2, terminal: 3.4, lamp: 2.0, flag: 1.8, plant: 1.2, beacon: 2.4, fence: 0.7, path: 0.2 },
  PAD: 0.3,
  T(hex) { return Art.tones(hex); },
  mat(vt) {
    return BuildingArt._mat[vt] || (BuildingArt._mat[vt] = [
      { frame: Art.tones('#8a8580'), trim: Art.pal('rust'), plate: Art.pal('concrete'), glow: null, dirt: 0.55 },
      { frame: Art.pal('steel'), trim: Art.pal('steel'), plate: Art.pal('concrete'), glow: null, dirt: 0.18 },
      { frame: Art.pal('anth'), trim: Art.pal('brass'), plate: Art.tones('#8d929c'), glow: '#7fe8ff', dirt: 0 },
      { frame: Art.pal('white'), trim: Art.pal('gold'), plate: Art.tones('#c9cdd6'), glow: '#7fe8ff', dirt: 0 }
    ][vt]);
  },
  _mat: [],
  ppt(W) { return Art.bucket(Render.ppt(), W >= 7 ? 96 : 128); },
  sprite(type, vt, rot, W, H, ppt, extra = '') {
    return Art.cached('B|' + type + '|' + vt + '|' + rot + '|' + W + 'x' + H + '|' + ppt + '|' + extra, () => BuildingArt.render(type, vt, rot, W, H, ppt, extra));
  },
  render(type, vt, rot, W, H, ppt, extra) {
    const pad = BuildingArt.PAD, top = BuildingArt.TOP[type] || 1;
    const cw = W + pad * 2, ch = H + top + pad;
    const c = Art.canvas(cw * ppt, ch * ppt), x = c.getContext('2d');
    x.scale(ppt, ppt); x.translate(pad, top);
    x.lineJoin = 'round'; x.lineCap = 'round';
    const rnd = RNG.mulberry32(RNG.hash(RNG.hashString(type), vt * 7 + rot, W * 31 + H));
    const paint = BuildingArt.P[type] || BuildingArt.P.generic;
    paint(x, W, H, vt, rot, extra, rnd, type);
    return { canvas: c, ox: -pad, oy: -top, w: cw, h: ch };
  },
  // draws the static body of a building at x,y (relative tile coords)
  drawBody(ctx, b, x, y, vt, extra, alpha = 1) {
    const s = BuildingArt.sprite(b.type, vt, BuildingArt.rotKey(b), b.w, b.h, BuildingArt.ppt(b.w), extra);
    if (alpha < 1) { const a = ctx.globalAlpha; ctx.globalAlpha = a * alpha; ctx.drawImage(s.canvas, x + s.ox, y + s.oy, s.w, s.h); ctx.globalAlpha = a; }
    else ctx.drawImage(s.canvas, x + s.ox, y + s.oy, s.w, s.h);
  },
  ROT_FREE: { extractor: 1, cooler: 1, servo: 1, charger: 1, lab: 1, bazaar: 1, caravan: 1, shuttlepad: 1, port: 1, dock: 1, terminal: 1, lamp: 1, flag: 1, plant: 1, beacon: 1, path: 1, fence: 1 },
  rotKey(b) { return BuildingArt.ROT_FREE[b.type] ? 0 : b.rot; },

  // ---------------- shared painting helpers ----------------
  foundation(x, W, H, vt, rnd, inset = 0.05) {
    const m = BuildingArt.mat(vt);
    Art.contact(x, 0, 0, W, H, 0.42);
    Art.box(x, inset, inset, W - inset * 2, H - inset * 2, 0.14, m.plate, { r: 0.1 });
    const ty = inset - BA_E, x0 = inset, x1 = W - inset, y1 = H - inset - BA_E;
    if (vt === 0 && rnd) for (let i = 0; i < 3 + W; i++) { x.fillStyle = 'rgba(70,45,30,.16)'; x.beginPath(); x.ellipse(x0 + rnd() * (x1 - x0), ty + rnd() * (y1 - ty), 0.1 + rnd() * 0.25, 0.06 + rnd() * 0.12, rnd() * 3, 0, Math.PI * 2); x.fill(); }
    if (vt >= 2) { x.strokeStyle = 'rgba(0,0,0,.14)'; x.lineWidth = 0.02; x.beginPath(); for (let i = 1; i < W * 2; i++) { x.moveTo(x0 + i * 0.5, ty + 0.06); x.lineTo(x0 + i * 0.5, y1 - 0.06); } x.stroke(); }
    if (vt >= 1) Art.hazard(x, x0 + 0.1, y1 - 0.15, x1 - x0 - 0.2, 0.09);
    if (vt === 3) { x.strokeStyle = 'rgba(127,232,255,.9)'; x.lineWidth = 0.035; x.beginPath(); x.moveTo(x0 + 0.12, y1 + 0.03); x.lineTo(x1 - 0.12, y1 + 0.03); x.stroke(); }
    Art.rivets(x, [[x0 + 0.1, ty + 0.1], [x1 - 0.1, ty + 0.1], [x0 + 0.1, y1 - 0.06], [x1 - 0.1, y1 - 0.06]], 0.03, m.frame);
  },
  vent(x, x0, y0, w, h) {
    x.fillStyle = '#1c2026'; Art.rrect(x, x0, y0, w, h, 0.03); x.fill();
    x.strokeStyle = 'rgba(150,160,175,.55)'; x.lineWidth = 0.02; x.beginPath();
    for (let yy = y0 + 0.05; yy < y0 + h - 0.02; yy += 0.06) { x.moveTo(x0 + 0.03, yy); x.lineTo(x0 + w - 0.03, yy); }
    x.stroke();
  },
  glass(x, x0, y0, w, h, r = 0.05, tint = '#1a2a38') {
    x.fillStyle = tint; Art.rrect(x, x0, y0, w, h, r); x.fill();
    x.save(); Art.rrect(x, x0, y0, w, h, r); x.clip();
    x.fillStyle = 'rgba(200,235,255,.22)'; x.beginPath(); x.moveTo(x0, y0 + h * 0.6); x.lineTo(x0 + w * 0.45, y0); x.lineTo(x0 + w * 0.7, y0); x.lineTo(x0, y0 + h * 1.1); x.fill();
    x.restore();
    x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = 0.025; Art.rrect(x, x0, y0, w, h, r); x.stroke();
  },
  rust(x, rnd, x0, y0, w, h, n) {
    for (let i = 0; i < n; i++) { x.fillStyle = 'rgba(120,60,30,.28)'; x.beginPath(); x.ellipse(x0 + rnd() * w, y0 + rnd() * h, 0.04 + rnd() * 0.08, 0.03 + rnd() * 0.06, rnd() * 3, 0, Math.PI * 2); x.fill(); }
  },
  seams(x, x0, y0, w, h, n, a = 0.22) {
    x.strokeStyle = 'rgba(0,0,0,' + a + ')'; x.lineWidth = 0.018; x.beginPath();
    for (let i = 1; i < n; i++) { x.moveTo(x0 + w * i / n, y0 + 0.02); x.lineTo(x0 + w * i / n, y0 + h - 0.02); }
    x.stroke();
  },
  chute(x, W, H, rot, t, vt) {
    // output chute on the front side (rotation), standing on the plate
    const cx = W / 2, cy = H / 2;
    const dx = U.DX[rot], dy = U.DY[rot];
    const px = cx + dx * (W / 2 - 0.32), py = cy + dy * (H / 2 - 0.32);
    Art.box(x, px - 0.26, py - 0.2 - BA_E, 0.52, 0.42, 0.32, t, { r: 0.05 });
    x.fillStyle = '#15181d'; Art.rrect(x, px - 0.16, py - 0.2 - BA_E - 0.32 * Art.V + 0.07, 0.32, 0.26, 0.04); x.fill();
    if (vt >= 1) { x.fillStyle = '#f2c230'; x.fillRect(px - 0.26, py - 0.2 - BA_E + 0.42 - 0.05, 0.52, 0.04); }
  },
  sphere(x, cx, cy, r, t) {
    const g = x.createRadialGradient(cx - r * 0.4, cy - r * 0.45, r * 0.05, cx, cy, r);
    g.addColorStop(0, t.rim); g.addColorStop(0.45, t.base); g.addColorStop(1, t.lo);
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
    x.strokeStyle = t.edge; x.lineWidth = 0.04; x.stroke();
  },
  mast(x, x0, yb, h, w, t) {
    // thin vertical pole standing at ground point (x0, yb), h tiles tall (already projected)
    x.fillStyle = 'rgba(0,0,0,.25)'; x.beginPath(); x.ellipse(x0, yb, w * 1.4, w * 0.6, 0, 0, Math.PI * 2); x.fill();
    const g = x.createLinearGradient(x0 - w, 0, x0 + w, 0); g.addColorStop(0, t.hi); g.addColorStop(0.5, t.base); g.addColorStop(1, t.lo);
    x.fillStyle = g; x.fillRect(x0 - w / 2, yb - h, w, h);
    x.strokeStyle = t.edge; x.lineWidth = 0.02; x.strokeRect(x0 - w / 2, yb - h, w, h);
  },

  // ---------------- geometry shared with the animated overlays ----------------
  GEO: {
    extractor(vt) {
      const V = Art.V, hh = 0.85 + vt * 0.12, y0 = 0.18 - BA_E, d = 0.72;
      const ty = y0 - hh * V, fy0 = y0 + d - hh * V, fy1 = y0 + d;
      return { hh, y0, d, ty, fy0, fy1, win: [0.24, fy0 + 0.07, 0.46, fy1 - fy0 - 0.15], pit: [1.0, 1.36], lamp: [1.66, ty + 0.15], mast: 1.0 + vt * 0.12 };
    },
    silo(vt) {
      const V = Art.V, cx = 1.5, cy = 1.95 - BA_E, rx = 1.12, ry = 0.54, H = 2.3 + vt * 0.22, hv = H * V;
      return { cx, cy, rx, ry, H, hv, top: cy - hv, win: [cx - 0.13, cy - hv + ry + 0.14, 0.26, hv - 0.42] };
    },
    refinery(lvl, vt) {
      const V = Art.V, hallY = 0.95 - BA_E, hallD = 1.85, hallH = 0.85 + vt * 0.06;
      const ty = hallY - hallH * V;
      const chim = lvl === 1 ? [[2.35, 0.62, 2.2]] : lvl === 2 ? [[2.4, 0.6, 2.5]] : [[2.3, 0.42, 2.7], [2.62, 0.7, 2.4], [0.42, 0.55, 2.5]];
      return { hallY, hallD, hallH, ty, sky: [0.72, ty + 0.4, 1.56, 0.95], chim: chim.map(c => [c[0], c[1] - c[2] * V]) };
    },
    cooler(vt) { const V = Art.V, H = 2.1 + vt * 0.2; return { cx: 1.0, cy: 1.38 - BA_E, H, hv: H * V, rt: 0.6 }; },
    servo() { return { cx: 1.0, cy: 1.0 - BA_E - 0.45 * Art.V + 0.02 }; },
    charger(vt) { const V = Art.V, coils = [[0.5, 0.7], [1.5, 0.7], [1.0, 1.45]]; const ch = 1.0 + vt * 0.1; return { coils: coils.map(c => [c[0], c[1] - BA_E - 0.35 * V - ch * V]), rod: [1.0, 1.05 - BA_E - 0.35 * V - (1.5 + vt * 0.15) * V], ch }; },
    lab(vt) { const V = Art.V, by = 1.55 - BA_E, bh = 1.0 + vt * 0.08, ty = by - bh * V; return { by, bh, ty, dish: [3.05, ty + 0.25 - 0.9], holo: [1.4, ty + 0.2 - 1.3], win: [0.55, by + 2.1 - bh * V + 0.12] }; },
    pads(type, W) {
      if (type === 'port') return [[1.95, 3.9], [5.05, 3.9]];
      return [[W / 2, W / 2 + 0.2]];
    }
  },

  // ---------------- painters (tile coords, footprint at 0,0..W,H) ----------------
  P: {
    generic(x, W, H, vt, rot, extra, rnd, type) {
      BuildingArt.foundation(x, W, H, vt, rnd);
      const def = DATA.BUILDINGS[type] || { color: '#888888' };
      Art.box(x, 0.2, 0.2 - BA_E, W - 0.4, H - 0.4, 0.6, Art.tones(def.color), { r: 0.08 });
    },

    extractor(x, W, H, vt, rot, extra, rnd) {
      const G = BuildingArt.GEO.extractor(vt), m = BuildingArt.mat(vt), V = Art.V;
      BuildingArt.foundation(x, W, H, vt, rnd);
      const body = vt === 3 ? Art.pal('white') : vt === 0 ? Art.tones('#c86a2a') : Art.pal('orange');
      const acc = vt === 3 ? Art.pal('orange') : m.trim;
      // exhaust stack behind the housing (tier 2+)
      if (vt >= 2) { Art.cyl(x, 1.55, G.y0 + 0.2, 0.1, 0.05, G.hh + 0.55, m.frame, { bands: 2 }); x.fillStyle = '#111'; x.beginPath(); x.ellipse(1.55, G.y0 + 0.2 - (G.hh + 0.55) * V, 0.07, 0.035, 0, 0, Math.PI * 2); x.fill(); }
      // housing
      Art.box(x, 0.14, G.y0, 1.72, G.d, G.hh, body, { r: 0.06 });
      // roof: vent, hatch, panels
      BuildingArt.vent(x, 0.3, G.ty + 0.12, 0.46, 0.26);
      x.fillStyle = Col.rgba(body.lo, 0.5); Art.rrect(x, 0.9, G.ty + 0.1, 0.5, 0.36, 0.04); x.fill();
      Art.rivets(x, [[0.95, G.ty + 0.15], [1.35, G.ty + 0.15], [0.95, G.ty + 0.41], [1.35, G.ty + 0.41]], 0.022, acc);
      if (vt === 3) { x.fillStyle = '#2a3a5a'; Art.rrect(x, 0.9, G.ty + 0.1, 0.5, 0.36, 0.04); x.fill(); x.strokeStyle = '#7fb0ff'; x.lineWidth = 0.015; x.beginPath(); for (let i = 1; i < 4; i++) { x.moveTo(0.9 + i * 0.125, G.ty + 0.1); x.lineTo(0.9 + i * 0.125, G.ty + 0.46); } x.stroke(); }
      // front face: resource window (left), vents (right), stripe
      BuildingArt.glass(x, G.win[0] - 0.03, G.win[1] - 0.03, G.win[2] + 0.06, G.win[3] + 0.06, 0.05, Col.shade(body.edge, -0.2));
      BuildingArt.glass(x, G.win[0], G.win[1], G.win[2], G.win[3], 0.04, '#121c26');
      BuildingArt.vent(x, 1.3, G.fy0 + 0.1, 0.42, G.fy1 - G.fy0 - 0.2);
      x.fillStyle = Col.rgba(acc.base, 0.9); x.fillRect(0.14, G.fy0 + 0.02, 1.72, 0.045);
      if (vt === 0) BuildingArt.rust(x, rnd, 0.16, G.ty, 1.68, G.fy1 - G.ty, 9);
      // side pipe to the front (tier 1+)
      if (vt >= 1) Art.pipe(x, [[1.86, G.fy1 - 0.15], [1.86, 1.5], [1.6, 1.62]], 0.07, m.trim);
      // drill pit with collar
      const [px, py] = G.pit;
      x.fillStyle = '#0b0c0f'; x.beginPath(); x.ellipse(px, py, 0.46, 0.28, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = m.frame.lo; x.lineWidth = 0.09; x.beginPath(); x.ellipse(px, py, 0.5, 0.31, 0, 0, Math.PI * 2); x.stroke();
      x.strokeStyle = Col.rgba(m.frame.rim, 0.85); x.lineWidth = 0.03; x.beginPath(); x.ellipse(px, py - 0.015, 0.5, 0.31, 0, Math.PI * 0.95, Math.PI * 1.9); x.stroke();
      const rv = []; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; rv.push([px + Math.cos(a) * 0.5, py + Math.sin(a) * 0.31]); }
      Art.rivets(x, rv, 0.022, acc);
      // derrick (A-frame) over the pit
      const ay = py - G.mast, legs = m.frame;
      x.lineCap = 'round';
      for (const [lx, w] of [[0.74, 0.07], [1.26, 0.07]]) { x.strokeStyle = legs.edge; x.lineWidth = w + 0.04; x.beginPath(); x.moveTo(lx, py + 0.04); x.lineTo(px, ay); x.stroke(); x.strokeStyle = lx < 1 ? legs.hi : legs.lo; x.lineWidth = w; x.stroke(); }
      x.strokeStyle = legs.base; x.lineWidth = 0.03; x.beginPath();
      for (let k = 1; k < 4; k++) { const t0 = k / 4, t1 = (k + 1) / 4; const yA = py + (ay - py) * t0, yB = py + (ay - py) * Math.min(1, t1); const wA = 0.26 * (1 - t0), wB = 0.26 * (1 - Math.min(1, t1)); x.moveTo(px - wA, yA); x.lineTo(px + wB, yB); x.moveTo(px + wA, yA); x.lineTo(px - wB, yB); }
      x.stroke();
      Art.box(x, px - 0.12, ay - 0.06, 0.24, 0.12, 0.14, acc, { r: 0.02 });
      x.strokeStyle = '#2a2a2a'; x.lineWidth = 0.025; x.beginPath(); x.moveTo(px, ay); x.lineTo(px, py - 0.05); x.stroke();
      // antenna (tier 3)
      if (vt === 3) { x.strokeStyle = '#d8dde6'; x.lineWidth = 0.025; x.beginPath(); x.moveTo(1.75, G.ty + 0.2); x.lineTo(1.75, G.ty - 0.45); x.stroke(); }
      // status lamp socket
      Art.cyl(x, G.lamp[0], G.lamp[1] + 0.04, 0.07, 0.035, 0.1, m.frame);
    },

    splitter: (x, W, H, vt, rot, extra) => BuildingArt.node(x, 'splitter', vt, rot),
    merger: (x, W, H, vt, rot, extra) => BuildingArt.node(x, 'merger', vt, rot),
    crossing: (x, W, H, vt, rot, extra) => BuildingArt.node(x, 'crossing', vt, rot),
    fsplitter: (x, W, H, vt, rot, extra) => BuildingArt.node(x, 'fsplitter', vt, rot),
    osplitter: (x, W, H, vt, rot, extra) => BuildingArt.node(x, 'osplitter', vt, rot),

    silo(x, W, H, vt, rot, extra, rnd) {
      const G = BuildingArt.GEO.silo(vt), m = BuildingArt.mat(vt), V = Art.V;
      BuildingArt.foundation(x, W, H, vt, rnd);
      const tank = vt === 3 ? Art.pal('white') : vt === 2 ? Art.tones('#5d6b7c') : vt === 1 ? Art.pal('steel') : Art.tones('#8492a0');
      // back pump / secondary tank
      if (vt >= 2) Art.cyl(x, 0.45, 0.62 - BA_E, 0.26, 0.13, 1.4, m.frame, { bands: 1 });
      if (rot === 3) BuildingArt.chute(x, W, H, rot, m.trim, vt);
      // legs under the tank
      Art.cyl(x, G.cx, G.cy, G.rx, G.ry, G.H, tank, { bands: 3 });
      // top cone roof
      const ty = G.top;
      const cg = x.createLinearGradient(G.cx - G.rx, ty, G.cx + G.rx, ty);
      cg.addColorStop(0, tank.rim); cg.addColorStop(0.5, tank.base); cg.addColorStop(1, tank.lo);
      x.fillStyle = cg; x.beginPath(); x.ellipse(G.cx, ty, G.rx, G.ry, 0, 0, Math.PI); x.lineTo(G.cx, ty - 0.55); x.closePath(); x.fill();
      x.strokeStyle = tank.edge; x.lineWidth = 0.04; x.stroke();
      x.fillStyle = Col.rgba(tank.rim, 0.5); x.beginPath(); x.moveTo(G.cx, ty - 0.55); x.lineTo(G.cx - G.rx * 0.8, ty + 0.05); x.lineTo(G.cx - G.rx * 0.45, ty + 0.1); x.closePath(); x.fill();
      // top hatch
      Art.cyl(x, G.cx, ty - 0.42, 0.2, 0.1, 0.12, m.trim);
      // bands colour (tier 2+ brass, tier 3 gold)
      if (vt >= 2) { x.strokeStyle = m.trim.base; x.lineWidth = 0.06; for (const k of [0.25, 0.75]) { x.beginPath(); x.ellipse(G.cx, G.cy - G.hv * k, G.rx, G.ry, 0, 0.05, Math.PI - 0.05); x.stroke(); } }
      if (vt === 3) { x.strokeStyle = 'rgba(127,232,255,.95)'; x.lineWidth = 0.035; x.beginPath(); x.ellipse(G.cx, G.cy - G.hv * 0.5, G.rx, G.ry, 0, 0.05, Math.PI - 0.05); x.stroke(); }
      if (vt === 0) BuildingArt.rust(x, rnd, G.cx - G.rx, G.top, G.rx * 2, G.hv + G.ry, 12);
      // ladder (right)
      const lx = G.cx + G.rx * 0.72;
      x.strokeStyle = m.frame.edge; x.lineWidth = 0.03; x.beginPath();
      x.moveTo(lx - 0.07, G.cy + G.ry * 0.62); x.lineTo(lx - 0.07, G.top + G.ry * 0.7); x.moveTo(lx + 0.07, G.cy + G.ry * 0.62); x.lineTo(lx + 0.07, G.top + G.ry * 0.7);
      for (let yy = G.top + G.ry * 0.8; yy < G.cy + G.ry * 0.55; yy += 0.12) { x.moveTo(lx - 0.07, yy); x.lineTo(lx + 0.07, yy); }
      x.stroke();
      // level window frame
      const [wx, wy, ww, wh] = G.win;
      x.fillStyle = m.frame.edge; Art.rrect(x, wx - 0.05, wy - 0.05, ww + 0.1, wh + 0.1, 0.06); x.fill();
      x.fillStyle = '#0f151c'; Art.rrect(x, wx, wy, ww, wh, 0.05); x.fill();
      x.strokeStyle = 'rgba(255,255,255,.28)'; x.lineWidth = 0.015; x.beginPath(); for (let i = 1; i < 4; i++) { x.moveTo(wx, wy + wh * i / 4); x.lineTo(wx + 0.06, wy + wh * i / 4); } x.stroke();
      if (rot !== 3) BuildingArt.chute(x, W, H, rot, m.trim, vt);
      // inlet pipes on top (tier 1+)
      if (vt >= 1) Art.pipe(x, [[G.cx - 0.6, ty - 0.05], [G.cx - 0.6, ty - 0.32], [G.cx - 0.2, ty - 0.4]], 0.06, m.frame);
    },

    refinery1(x, W, H, vt, rot, extra, rnd) { BuildingArt.refinery(x, W, H, vt, rot, rnd, 1); },
    refinery2(x, W, H, vt, rot, extra, rnd) { BuildingArt.refinery(x, W, H, vt, rot, rnd, 2); },
    refinery3(x, W, H, vt, rot, extra, rnd) { BuildingArt.refinery(x, W, H, vt, rot, rnd, 3); },

    cooler(x, W, H, vt, rot, extra, rnd) {
      const G = BuildingArt.GEO.cooler(vt), m = BuildingArt.mat(vt);
      BuildingArt.foundation(x, W, H, vt, rnd);
      const t = vt === 3 ? Art.pal('white') : Art.tones(vt === 0 ? '#b8c4c8' : '#cfdde2');
      const { cx, cy, hv } = G;
      const rb = 0.78, rw = 0.5, rt = G.rt, ry = 0.3;
      // hyperboloid shell
      const g = x.createLinearGradient(cx - rb, 0, cx + rb, 0);
      g.addColorStop(0, t.rim); g.addColorStop(0.35, t.base); g.addColorStop(1, t.lo);
      x.fillStyle = g; x.beginPath();
      x.moveTo(cx - rb, cy); x.quadraticCurveTo(cx - rw * 0.9, cy - hv * 0.55, cx - rt, cy - hv);
      x.lineTo(cx + rt, cy - hv); x.quadraticCurveTo(cx + rw * 0.9, cy - hv * 0.55, cx + rb, cy);
      x.ellipse(cx, cy, rb, ry, 0, 0, Math.PI); x.closePath(); x.fill();
      x.strokeStyle = t.edge; x.lineWidth = 0.04; x.stroke();
      // warning band near the top (tier 1+) and vertical ribs
      x.save(); x.clip();
      x.strokeStyle = 'rgba(0,0,0,.12)'; x.lineWidth = 0.02; x.beginPath(); for (let i = -3; i <= 3; i++) { x.moveTo(cx + i * 0.22, cy + 0.3); x.lineTo(cx + i * 0.17, cy - hv); } x.stroke();
      if (vt >= 1) { for (let i = 0; i < 10; i++) { x.fillStyle = i % 2 ? '#f2f2f2' : '#e0473a'; x.fillRect(cx - 0.8 + i * 0.16, cy - hv + 0.05, 0.16, 0.12); } }
      if (vt === 0) BuildingArt.rust(x, rnd, cx - rb, cy - hv, rb * 2, hv, 8);
      x.restore();
      // opening
      x.fillStyle = t.lo; x.beginPath(); x.ellipse(cx, cy - hv, rt, ry * 0.8, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#0d1418'; x.beginPath(); x.ellipse(cx, cy - hv + 0.02, rt - 0.07, ry * 0.8 - 0.05, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = t.edge; x.lineWidth = 0.035; x.beginPath(); x.ellipse(cx, cy - hv, rt, ry * 0.8, 0, 0, Math.PI * 2); x.stroke();
      // pump house + pipe
      Art.box(x, 1.25, 1.42 - BA_E, 0.6, 0.42, 0.45, m.frame, { r: 0.04 });
      Art.pipe(x, [[1.55, 1.42 - BA_E - 0.2], [1.55, 1.1], [1.3, 1.0]], 0.07, m.trim);
      if (vt >= 2) Art.cyl(x, 0.35, 0.5 - BA_E, 0.18, 0.09, 0.8, m.trim, { bands: 1 });
    },

    servo(x, W, H, vt, rot, extra, rnd) {
      const m = BuildingArt.mat(vt);
      BuildingArt.foundation(x, W, H, vt, rnd);
      const t = vt === 3 ? Art.pal('white') : vt >= 2 ? Art.pal('anth') : Art.tones('#6a5c48');
      Art.box(x, 0.14, 0.16 - BA_E, 1.72, 1.66, 0.45, t, { r: 0.1 });
      const ty = 0.16 - BA_E - 0.45 * Art.V;
      // gear well
      x.fillStyle = '#121418'; x.beginPath(); x.ellipse(1.0, ty + 0.83, 0.72, 0.6, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = m.trim.base; x.lineWidth = 0.05; x.beginPath(); x.ellipse(1.0, ty + 0.83, 0.75, 0.63, 0, 0, Math.PI * 2); x.stroke();
      // pistons at the corners
      for (const [px, py] of [[0.32, 0.34], [1.68, 0.34], [0.32, 1.62], [1.68, 1.62]]) Art.cyl(x, px, py - BA_E, 0.1, 0.05, 0.75 + vt * 0.08, m.trim, { bands: 1 });
      if (vt === 0) BuildingArt.rust(x, rnd, 0.2, ty, 1.6, 1.8, 8);
    },

    charger(x, W, H, vt, rot, extra, rnd) {
      const G = BuildingArt.GEO.charger(vt), m = BuildingArt.mat(vt), V = Art.V;
      BuildingArt.foundation(x, W, H, vt, rnd);
      const base = vt === 3 ? Art.pal('white') : Art.tones(vt >= 2 ? '#2c3a30' : '#3c5034');
      Art.box(x, 0.16, 0.16 - BA_E, 1.68, 1.68, 0.35, base, { r: 0.1 });
      const top = 0.16 - BA_E - 0.35 * V;
      // central rod
      const rodTop = G.rod[1];
      BuildingArt.mast(x, 1.0, 1.05 - BA_E - 0.35 * V, (1.05 - BA_E - 0.35 * V) - rodTop, 0.07, m.frame);
      BuildingArt.sphere(x, 1.0, rodTop, 0.13, Art.tones('#c8f0b0'));
      // coils
      const copper = Art.tones('#c87a3a');
      for (let i = 0; i < 3; i++) {
        const [cxp, cyp] = [[0.5, 0.7], [1.5, 0.7], [1.0, 1.45]][i];
        Art.cyl(x, cxp, cyp - BA_E - 0.35 * V, 0.2, 0.1, G.ch, Art.tones('#5a6470'));
        x.strokeStyle = copper.base; x.lineWidth = 0.035;
        for (let k = 1; k < 7; k++) { const yy = cyp - BA_E - 0.35 * V - G.ch * V * k / 7; x.beginPath(); x.ellipse(cxp, yy, 0.2, 0.1, 0, 0, Math.PI); x.stroke(); }
        BuildingArt.sphere(x, G.coils[i][0], G.coils[i][1] - 0.05, 0.09, Art.tones('#d8dde6'));
      }
      x.fillStyle = Col.rgba('#9bf06a', 0.8); x.fillRect(0.3, top + 1.45, 1.4, 0.04);
    },

    lab(x, W, H, vt, rot, extra, rnd) {
      const G = BuildingArt.GEO.lab(vt), m = BuildingArt.mat(vt), V = Art.V;
      BuildingArt.foundation(x, W, H, vt, rnd);
      const wall = vt === 3 ? Art.pal('white') : Art.tones(vt === 0 ? '#8a94aa' : '#a8b4c8');
      // annex greenhouse (tier 2+)
      if (vt >= 2) { Art.box(x, 0.3, 0.3 - BA_E, 1.1, 0.9, 0.5, Art.tones('#6a8a7a'), { r: 0.05 }); x.fillStyle = 'rgba(160,230,200,.45)'; Art.rrect(x, 0.36, 0.3 - BA_E - 0.5 * V + 0.06, 0.98, 0.78, 0.05); x.fill(); }
      // main hall
      Art.box(x, 0.3, G.by, 3.4, 2.1, G.bh, wall, { r: 0.08 });
      const fy0 = G.by + 2.1 - G.bh * V;
      for (let i = 0; i < 6; i++) Art.window(x, 0.55 + i * 0.5, fy0 + 0.12, 0.3, 0.26, false);
      x.fillStyle = Col.rgba(m.trim.base, 0.9); x.fillRect(0.3, fy0 + 0.02, 3.4, 0.05);
      // door
      x.fillStyle = '#2a3140'; x.fillRect(3.2, fy0 + 0.1, 0.32, G.bh * V - 0.1);
      // observatory dome on the roof
      const dt = vt === 3 ? Art.pal('white') : Art.tones('#e6edf8');
      Art.cyl(x, 1.4, G.ty + 1.15, 0.85, 0.45, 0.25, Art.tones('#8a96b0'));
      Art.dome(x, 1.4, G.ty + 1.15 - 0.25 * V, 0.85, 0.45, 1.5, dt);
      x.fillStyle = '#1a2230'; x.beginPath(); x.moveTo(1.3, G.ty + 1.0 - 0.25 * V); x.lineTo(1.25, G.ty + 0.15); x.lineTo(1.45, G.ty + 0.12); x.lineTo(1.5, G.ty + 1.0 - 0.25 * V); x.closePath(); x.fill();
      // roof units
      BuildingArt.vent(x, 2.5, G.ty + 1.25, 0.6, 0.35);
      // dish mast
      BuildingArt.mast(x, G.dish[0], G.ty + 0.9, 0.95, 0.08, m.frame);
      if (vt >= 1) { x.strokeStyle = '#d8dde6'; x.lineWidth = 0.025; x.beginPath(); x.moveTo(2.4, G.ty + 0.5); x.lineTo(2.4, G.ty - 0.25); x.moveTo(2.3, G.ty - 0.05); x.lineTo(2.5, G.ty - 0.05); x.stroke(); }
      if (vt === 0) BuildingArt.rust(x, rnd, 0.3, G.ty, 3.4, 2.6, 10);
    },

    shuttlepad(x, W, H, vt, rot, extra, rnd) {

      Art.box(x, 0.85, beamY - 0.02, W - 1.7, 0.28, 0.3, gt, { r: 0.02 });
      x.strokeStyle = Col.rgba(gt.edge, 0.7); x.lineWidth = 0.025; x.beginPath(); for (let i = 0; i < 16; i++) { const xx = 1.0 + i * (W - 2) / 16; x.moveTo(xx, beamY - 0.16); x.lineTo(xx + (W - 2) / 32, beamY + 0.1); x.lineTo(xx + (W - 2) / 16, beamY - 0.16); } x.stroke();

    path(x, W, H, vt, rot, extra, rnd) {
      const mask = +extra || 0;
      const col = vt >= 1 ? '#c9b48a' : DATA.BUILDINGS.path.color;
      const bed = Col.shade(col, -0.35);
      x.fillStyle = Col.rgba(bed, 0.85);
