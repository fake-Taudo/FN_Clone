      for (let i = 0; i < 3; i++) Art.window(x, 0.45 + i * 0.5, 0.35 - BA_E + 1.0 - 1.0 * V + 0.12, 0.3, 0.25, false);
      // gantry: legs and beam across the bay (trolley animated)
      const gy = BuildingArt.GEO.dockGantryY, gh = 3.0 + vt * 0.2, beamY = gy - BA_E - gh * V;
      const gt = vt === 3 ? Art.pal('white') : Art.pal('cloth2');
      for (const lx of [1.05, W - 1.05]) BuildingArt.mast(x, lx, gy - BA_E, gh * V, 0.18, gt);
      Art.box(x, 0.85, beamY - 0.02, W - 1.7, 0.28, 0.3, gt, { r: 0.02 });
      x.strokeStyle = Col.rgba(gt.edge, 0.7); x.lineWidth = 0.025; x.beginPath(); for (let i = 0; i < 16; i++) { const xx = 1.0 + i * (W - 2) / 16; x.moveTo(xx, beamY - 0.16); x.lineTo(xx + (W - 2) / 32, beamY + 0.1); x.lineTo(xx + (W - 2) / 16, beamY - 0.16); } x.stroke();
    },

    terminal(x, W, H, vt, rot, extra, rnd) {
      const m = BuildingArt.mat(vt), V = Art.V;
      BuildingArt.foundation(x, W, H, vt, rnd, 0.08);
      const wall = vt === 3 ? Art.pal('white') : Art.tones(vt === 0 ? '#6a5a7a' : '#7a6a92');
      // admin block (back left) with window rows
      Art.box(x, 0.4, 0.5 - BA_E, 2.8, 1.6, 1.4, wall, { r: 0.08 });
      const fy0 = 0.5 - BA_E + 1.6 - 1.4 * V;
      for (let r = 0; r < 2; r++) for (let i = 0; i < 5; i++) Art.window(x, 0.6 + i * 0.52, fy0 + 0.1 + r * 0.34, 0.32, 0.22, false, '#ffb8e0');
      x.fillStyle = '#ff5fa8'; x.fillRect(0.4, fy0 + 0.02, 2.8, 0.05);
      // dish tower (back right)
      const dx = W - 1.6, dy = 1.7 - BA_E;
      Art.box(x, dx - 0.45, dy - 0.5, 0.9, 0.9, 1.8, m.frame, { r: 0.05 });
      const dtop = dy - 0.5 - 1.8 * V;
      BuildingArt.dish(x, dx, dtop - 0.35, 1.05, vt);
      // holo pedestal (front centre)
      const hx = W / 2, hy = H - 2.2;
      Art.cyl(x, hx, hy - BA_E, 1.1, 0.55, 0.25, Art.tones('#3e2850'));
      Art.cyl(x, hx, hy - BA_E - 0.25 * V, 0.75, 0.38, 0.2, Art.tones('#5a3a70'));
      x.fillStyle = '#ff9fd0'; x.beginPath(); x.ellipse(hx, hy - BA_E - 0.45 * V, 0.55, 0.27, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#2a1a34'; x.beginPath(); x.ellipse(hx, hy - BA_E - 0.45 * V, 0.45, 0.21, 0, 0, Math.PI * 2); x.fill();
      // pillars with lights
      for (const [px, py] of [[1.0, H - 0.8], [W - 1.0, H - 0.8], [0.6, 2.9], [W - 0.6, 2.9]]) { Art.cyl(x, px, py - BA_E, 0.14, 0.07, 0.9, wall); }
    },

    path(x, W, H, vt, rot, extra, rnd) {
      const mask = +extra || 0;
      const col = vt >= 1 ? '#c9b48a' : DATA.BUILDINGS.path.color;
      const bed = Col.shade(col, -0.35);
      x.fillStyle = Col.rgba(bed, 0.85);
      Art.rrect(x, 0.1, 0.1, 0.8, 0.8, 0.22); x.fill();
      if (mask & 1) x.fillRect(0.5, 0.1, 0.5, 0.8);
      if (mask & 4) x.fillRect(0, 0.1, 0.5, 0.8);
      if (mask & 2) x.fillRect(0.1, 0.5, 0.8, 0.5);
      if (mask & 8) x.fillRect(0.1, 0, 0.8, 0.5);
      const t = Art.tones(col);
      const stones = [];
      for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) stones.push([0.16 + i * 0.24 + (j % 2) * 0.06, 0.16 + j * 0.24]);
      const ext = []; if (mask & 1) ext.push([0.88, 0.28], [0.88, 0.52]); if (mask & 4) ext.push([-0.02, 0.4], [-0.02, 0.64]); if (mask & 2) ext.push([0.3, 0.88], [0.55, 0.88]); if (mask & 8) ext.push([0.42, -0.02], [0.2, -0.02]);
      for (const [sx, sy] of stones.concat(ext)) {
        const w = 0.18 + rnd() * 0.04, h = 0.17 + rnd() * 0.03, k = (rnd() - 0.5) * 0.18;
        x.fillStyle = 'rgba(0,0,0,.25)'; Art.rrect(x, sx + 0.015, sy + 0.025, w, h, 0.05); x.fill();
        const g = x.createLinearGradient(sx, sy, sx + w, sy + h); g.addColorStop(0, Col.shade(t.hi, k)); g.addColorStop(1, Col.shade(t.base, k));
        x.fillStyle = g; Art.rrect(x, sx, sy, w, h, 0.05); x.fill();
        if (vt >= 1 && rnd() < 0.3) { x.fillStyle = 'rgba(255,255,255,.18)'; Art.rrect(x, sx + 0.03, sy + 0.03, w * 0.4, h * 0.3, 0.02); x.fill(); }
      }
    },

    fence(x, W, H, vt, rot, extra, rnd) {
      const mask = +extra || 0, V = Art.V;
      const t = vt >= 1 ? Art.pal('white') : Art.tones(DATA.BUILDINGS.fence.color);
      const rail = (x0, y0, x1, y1) => {
        for (const hh of [0.42, 0.22]) {
          const o = hh * V;
          x.strokeStyle = t.edge; x.lineWidth = 0.07; x.beginPath(); x.moveTo(x0, y0 - o); x.lineTo(x1, y1 - o); x.stroke();
          x.strokeStyle = t.base; x.lineWidth = 0.04; x.stroke();
          x.strokeStyle = Col.rgba(t.rim, 0.8); x.lineWidth = 0.015; x.beginPath(); x.moveTo(x0, y0 - o - 0.012); x.lineTo(x1, y1 - o - 0.012); x.stroke();
        }
      };
      // shadow line on the ground
      x.strokeStyle = 'rgba(0,0,0,.22)'; x.lineWidth = 0.08; x.beginPath();
      if (mask & 1) { x.moveTo(0.55, 0.62); x.lineTo(1.05, 0.62); } if (mask & 4) { x.moveTo(-0.05, 0.62); x.lineTo(0.55, 0.62); }
      if (mask & 2) { x.moveTo(0.6, 0.6); x.lineTo(0.6, 1.05); } if (mask & 8) { x.moveTo(0.6, -0.05); x.lineTo(0.6, 0.6); }
      x.stroke();
      if (mask & 8) rail(0.5, 0, 0.5, 0.55);
      if (mask & 4) rail(0, 0.55, 0.5, 0.55);
      // post
      Art.box(x, 0.42, 0.48, 0.16, 0.12, 0.62, t, { r: 0.02, lw: 0.02 });
      if (mask & 1) rail(0.5, 0.55, 1, 0.55);
      if (mask & 2) rail(0.5, 0.55, 0.5, 1.05);
      if (!mask) { Art.box(x, 0.2, 0.5, 0.6, 0.06, 0.05, t); }
    },

    lamp(x, W, H, vt, rot, extra, rnd) {
      const V = Art.V, lv = +extra || 1;
      Art.cyl(x, 0.5, 0.72, 0.2, 0.1, 0.12, Art.pal('anth'));
      const pole = Art.pal('anth');
      BuildingArt.mast(x, 0.5, 0.72 - 0.07, 1.5, 0.07, pole);
      const hy = 0.72 - 1.57;
      // arm + lantern head
      x.strokeStyle = pole.base; x.lineWidth = 0.05; x.beginPath(); x.moveTo(0.5, hy + 0.12); x.quadraticCurveTo(0.5, hy - 0.02, 0.7, hy + 0.02); x.stroke();
      const heads = lv >= 2 ? [[0.72, hy + 0.08], [0.28, hy + 0.08]] : [[0.72, hy + 0.08]];
      if (lv >= 2) { x.beginPath(); x.moveTo(0.5, hy + 0.12); x.quadraticCurveTo(0.5, hy - 0.02, 0.3, hy + 0.02); x.stroke(); }
      for (const [lx, ly] of heads) {
        if (lv >= 3) { BuildingArt.sphere(x, lx, ly + 0.02, 0.13, Art.tones('#e8f6ff')); x.fillStyle = '#2a2f38'; x.fillRect(lx - 0.07, ly - 0.14, 0.14, 0.05); continue; }
        x.fillStyle = '#2a2f38'; x.beginPath(); x.moveTo(lx - 0.17, ly); x.lineTo(lx + 0.17, ly); x.lineTo(lx + 0.1, ly - 0.14); x.lineTo(lx - 0.1, ly - 0.14); x.closePath(); x.fill();
        x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(lx - 0.09, ly - 0.12, 0.05, 0.1);
        x.fillStyle = lv >= 2 ? '#d8f0ff' : '#ffe8a8'; x.beginPath(); x.ellipse(lx, ly + 0.035, 0.13, 0.06, 0, 0, Math.PI * 2); x.fill();
      }
    },

    flag(x, W, H, vt, rot, extra, rnd) {
      Art.cyl(x, 0.35, 0.78, 0.18, 0.09, 0.14, Art.pal('concrete'));
      BuildingArt.mast(x, 0.35, 0.78 - 0.08, 1.55, 0.05, Art.pal('white'));
      BuildingArt.sphere(x, 0.35, 0.78 - 1.65, 0.05, Art.pal('gold'));
    },

    plant(x, W, H, vt, rot, extra, rnd) {
      const lv = +extra || 1, V = Art.V;
      Art.cyl(x, 0.5, 0.62, 0.56, 0.3, 0.12, Art.pal('anth'));
      const cy = 0.62 - 0.12 * V;
      x.fillStyle = '#4a3a2a'; x.beginPath(); x.ellipse(0.5, cy, 0.5, 0.26, 0, 0, Math.PI * 2); x.fill();
      const col = DATA.BUILDINGS.plant.color;
      for (let i = 0; i < 3 + lv * 2; i++) {
        const a = rnd() * Math.PI * 2, r = rnd() * 0.3, px = 0.5 + Math.cos(a) * r, py = cy + Math.sin(a) * r * 0.5, h = 0.2 + rnd() * 0.3;
        x.strokeStyle = Col.shade(col, -0.3); x.lineWidth = 0.04; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + (rnd() - 0.5) * 0.2, py - h * 0.6, px + (rnd() - 0.5) * 0.15, py - h); x.stroke();
        x.fillStyle = i % 3 === 0 && lv >= 2 ? '#ff8ad8' : col; x.beginPath(); x.ellipse(px, py - h, 0.07, 0.05, rnd() * 3, 0, Math.PI * 2); x.fill();
      }
      // glass dome
      const g = x.createRadialGradient(0.36, cy - 0.45, 0.02, 0.5, cy - 0.2, 0.6);
      g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(0.4, 'rgba(190,240,255,.18)'); g.addColorStop(1, 'rgba(120,200,240,.3)');
      x.fillStyle = g; x.beginPath(); x.ellipse(0.5, cy, 0.52, 0.27, 0, 0, Math.PI); x.bezierCurveTo(0.5 - 0.52, cy - 0.9, 0.5 + 0.52, cy - 0.9, 0.5 + 0.52, cy); x.fill();
      x.strokeStyle = 'rgba(210,245,255,.85)'; x.lineWidth = 0.025; x.stroke();
      x.strokeStyle = 'rgba(210,245,255,.35)'; x.lineWidth = 0.015; x.beginPath(); x.moveTo(0.5, cy - 0.67); x.quadraticCurveTo(0.3, cy - 0.5, 0.18, cy + 0.15); x.moveTo(0.5, cy - 0.67); x.quadraticCurveTo(0.7, cy - 0.5, 0.82, cy + 0.15); x.stroke();
    },

    beacon(x, W, H, vt, rot, extra, rnd) {
      const V = Art.V, t = Art.pal('steel');
      Art.cyl(x, 0.5, 0.78, 0.3, 0.15, 0.15, Art.pal('anth'));
      // lattice tower
      const by = 0.78 - 0.08, ty = by - 1.65;
      x.strokeStyle = t.edge; x.lineWidth = 0.06; x.beginPath(); x.moveTo(0.32, by); x.lineTo(0.44, ty); x.moveTo(0.68, by); x.lineTo(0.56, ty); x.stroke();
      x.strokeStyle = t.base; x.lineWidth = 0.035; x.stroke();
      x.lineWidth = 0.02; x.beginPath(); for (let i = 0; i < 6; i++) { const y0 = by - i * 0.27, y1 = y0 - 0.27; const w0 = 0.18 - i * 0.02, w1 = w0 - 0.02; x.moveTo(0.5 - w0, y0); x.lineTo(0.5 + w1, y1); x.moveTo(0.5 + w0, y0); x.lineTo(0.5 - w1, y1); } x.stroke();
      // lamp housing
      Art.cyl(x, 0.5, ty + 0.05, 0.14, 0.07, 0.12, Art.pal('anth'));
      x.fillStyle = 'rgba(200,250,255,.7)'; x.beginPath(); x.ellipse(0.5, ty - 0.1, 0.11, 0.06, 0, 0, Math.PI * 2); x.fill();
      Art.cyl(x, 0.5, ty - 0.14, 0.13, 0.065, 0.06, Art.pal('anth'));
    }
  },

  node(x, type, vt, rot) {
    const V = Art.V;
    // belt plate under the node
    x.fillStyle = '#23262c'; Art.rrect(x, 0.04, 0.06, 0.92, 0.9, 0.08); x.fill();
    const col = DATA.BUILDINGS[type].color;
    const t = Art.tones(col);
    Art.box(x, 0.12, 0.16, 0.76, 0.72, 0.38, t, { r: 0.08 });
    const ty = 0.16 - 0.38 * V, cx = 0.5, cy = ty + 0.36;
    x.fillStyle = Col.rgba(t.edge, 0.55); Art.rrect(x, 0.2, ty + 0.07, 0.6, 0.58, 0.06); x.fill();
    const white = 'rgba(255,255,255,.92)';
    const arrow = (d, s, c) => { x.save(); x.translate(cx + U.DX[d] * 0.17, cy + U.DY[d] * 0.15); x.rotate(d * Math.PI / 2); x.beginPath(); x.moveTo(s, 0); x.lineTo(-s * 0.6, -s * 0.75); x.lineTo(-s * 0.25, 0); x.lineTo(-s * 0.6, s * 0.75); x.closePath(); x.fillStyle = c; x.fill(); x.restore(); };
    if (type === 'crossing') {
      x.fillStyle = white; x.fillRect(cx - 0.05, ty + 0.12, 0.1, 0.48); x.fillRect(0.26, cy - 0.05, 0.48, 0.1);
      x.fillStyle = Col.rgba(t.edge, 0.9); x.beginPath(); x.arc(cx, cy, 0.07, 0, Math.PI * 2); x.fill();
    } else if (type === 'merger') {
      arrow(rot, 0.13, white);
      for (const d of [(rot + 1) & 3, (rot + 2) & 3, (rot + 3) & 3]) { x.fillStyle = 'rgba(255,255,255,.45)'; x.beginPath(); x.arc(cx + U.DX[d] * 0.2, cy + U.DY[d] * 0.18, 0.04, 0, Math.PI * 2); x.fill(); }
    } else {
      arrow(rot, 0.12, white);
      const side = type === 'osplitter' ? 'rgba(255,255,255,.45)' : white;
      arrow((rot + 3) & 3, 0.1, side); arrow((rot + 1) & 3, 0.1, side);
      if (type === 'fsplitter') { x.fillStyle = '#10161c'; x.beginPath(); x.arc(cx, cy, 0.1, 0, Math.PI * 2); x.fill(); x.strokeStyle = '#bff4ff'; x.lineWidth = 0.02; x.stroke(); }
    }
    Art.rivets(x, [[0.17, ty + 0.05], [0.83, ty + 0.05]], 0.02, Art.pal('steel'));
  },

  refinery(x, W, H, vt, rot, rnd, lvl) {
    const G = BuildingArt.GEO.refinery(lvl, vt), m = BuildingArt.mat(vt), V = Art.V;
    BuildingArt.foundation(x, W, H, vt, rnd);
    const def = DATA.BUILDINGS['refinery' + lvl];
    const hall = vt === 3 ? Art.pal('white') : Art.tones(Col.mix(def.color, '#2a3a40', vt === 0 ? 0.45 : 0.25));
    const accent = Art.tones(def.color);
    if (rot === 3) BuildingArt.chute(x, W, H, rot, m.trim, vt);
    // back structures (drawn before the hall)
    if (lvl === 1) {
      Art.cyl(x, 0.95, 0.8 - BA_E, 0.55, 0.28, 1.5, vt === 3 ? Art.pal('gold') : Art.tones('#b8826a'), { bands: 2 });
      x.fillStyle = '#ff9a4a'; x.beginPath(); x.ellipse(0.95, 0.8 - BA_E - 1.5 * V, 0.3, 0.14, 0, 0, Math.PI * 2); x.fill();
    } else if (lvl === 2) {
      Art.cyl(x, 0.65, 0.62 - BA_E, 0.28, 0.14, 2.3, accent, { bands: 4 });
      Art.cyl(x, 1.35, 0.66 - BA_E, 0.24, 0.12, 1.9, m.frame, { bands: 3 });
      Art.pipe(x, [[0.65, 0.62 - BA_E - 2.0 * V], [1.0, 0.5 - BA_E - 2.0 * V], [1.35, 0.66 - BA_E - 1.6 * V]], 0.06, m.trim);
      Art.pipe(x, [[0.9, 0.62 - BA_E - 0.9 * V], [1.15, 0.66 - BA_E - 0.9 * V]], 0.06, m.trim);
    } else {
      const sy = 0.78 - BA_E - 0.6;
      Art.cyl(x, 1.35, 0.78 - BA_E, 0.5, 0.25, 0.4, m.frame);
      BuildingArt.sphere(x, 1.35, sy - 0.1, 0.62, vt === 3 ? Art.pal('white') : Art.tones('#5a6aa8'));
      x.strokeStyle = '#1a1f30'; x.lineWidth = 0.06; x.beginPath(); x.ellipse(1.35, sy - 0.1, 0.62, 0.2, 0, 0, Math.PI); x.stroke();
      x.strokeStyle = 'rgba(160,180,255,.9)'; x.lineWidth = 0.03; x.beginPath(); x.ellipse(1.35, sy - 0.1, 0.62, 0.2, 0, 0.1, Math.PI - 0.1); x.stroke();
    }
    for (const [cx, cyb, ch] of lvl === 1 ? [[2.35, 0.62, 2.2]] : lvl === 2 ? [[2.4, 0.6, 2.5]] : [[2.3, 0.42, 2.7], [2.62, 0.7, 2.4], [0.42, 0.55, 2.5]]) {
      Art.cyl(x, cx, cyb - BA_E, lvl === 3 ? 0.11 : 0.16, lvl === 3 ? 0.055 : 0.08, ch, vt >= 2 ? m.frame : Art.tones('#4a4f58'), { bands: lvl === 3 ? 3 : 2 });
      x.fillStyle = '#0b0c0f'; x.beginPath(); x.ellipse(cx, cyb - BA_E - ch * V, lvl === 3 ? 0.08 : 0.12, lvl === 3 ? 0.04 : 0.06, 0, 0, Math.PI * 2); x.fill();
      if (vt >= 1) { x.fillStyle = '#e0473a'; x.fillRect(cx - (lvl === 3 ? 0.11 : 0.16), cyb - BA_E - ch * V + 0.06, lvl === 3 ? 0.22 : 0.32, 0.05); }
    }
    // hall
    Art.box(x, 0.2, G.hallY, 2.6, G.hallD, G.hallH, hall, { r: 0.08 });
    const fy0 = G.hallY + G.hallD - G.hallH * V;
    // input hoppers on the sides
    for (const sx of [0.2, 2.8]) { x.fillStyle = m.frame.lo; x.beginPath(); x.moveTo(sx - 0.18, fy0 - 0.4); x.lineTo(sx + 0.18, fy0 - 0.4); x.lineTo(sx + 0.08, fy0 - 0.1); x.lineTo(sx - 0.08, fy0 - 0.1); x.closePath(); x.fill(); x.strokeStyle = m.frame.edge; x.lineWidth = 0.025; x.stroke(); }
    // skylight frame (glow animated)
    const [sx, sy, sw, sh] = G.sky;
    x.fillStyle = Col.shade(hall.lo, -0.2); Art.rrect(x, sx - 0.06, sy - 0.06, sw + 0.12, sh + 0.12, 0.1); x.fill();
    x.fillStyle = '#0c1416'; Art.rrect(x, sx, sy, sw, sh, 0.08); x.fill();
    x.strokeStyle = Col.rgba(m.frame.base, 0.9); x.lineWidth = 0.03; x.beginPath(); for (let i = 1; i < 4; i++) { x.moveTo(sx + sw * i / 4, sy); x.lineTo(sx + sw * i / 4, sy + sh); } x.stroke();
    // front face stripes and vents
    x.fillStyle = accent.base; x.fillRect(0.2, fy0 + 0.03, 2.6, 0.06);
    if (lvl >= 2) x.fillRect(0.2, fy0 + 0.12, 2.6, 0.03);
    if (lvl === 3) { x.fillStyle = '#a8b8ff'; x.fillRect(0.2, fy0 + 0.19, 2.6, 0.02); }
    BuildingArt.vent(x, 0.35, fy0 + 0.17, 0.5, G.hallH * V - 0.25);
    BuildingArt.vent(x, 2.15, fy0 + 0.17, 0.5, G.hallH * V - 0.25);
    // tier marks: roof vents / solar / gold trims
    if (vt >= 1) { BuildingArt.vent(x, 0.4, G.ty + 0.15, 0.24, 0.2); BuildingArt.vent(x, 2.36, G.ty + 0.15, 0.24, 0.2); }
    if (vt >= 2) Art.pipe(x, [[0.3, G.ty + 1.55], [2.7, G.ty + 1.55]], 0.06, m.trim);
    if (vt === 0) BuildingArt.rust(x, rnd, 0.2, G.ty, 2.6, G.hallD + G.hallH * V, 10);
    // stamp a small level badge plate: number of rings = refinery level
    for (let i = 0; i < lvl; i++) { x.fillStyle = accent.hi; x.beginPath(); x.arc(1.3 + i * 0.2, fy0 + G.hallH * V * 0.55, 0.05, 0, Math.PI * 2); x.fill(); x.strokeStyle = accent.edge; x.lineWidth = 0.02; x.stroke(); }
    if (rot !== 3) BuildingArt.chute(x, W, H, rot, m.trim, vt);
  },

  tent(x, tx, ty, tw, td, th, c1, c2) {
    // conical tent: striped segments lit by their facing, entrance flap at the front
    const V = Art.V, cx = tx + tw / 2, cy = ty + td * 0.62, rx = tw * 0.62, ry = td * 0.34, hv = th * V * 1.6;
    const t1 = Art.tones(c1), t2 = Art.tones(c2);
    x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.ellipse(cx + 0.2, cy + 0.08, rx * 1.1, ry * 1.1, 0, 0, Math.PI * 2); x.fill();
    const n = 12, ax = cx, ay = cy - hv;
    for (let i = 0; i < n; i++) {
      const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2;
      const am = (a0 + a1) / 2;
      if (Math.sin(am) < -0.05) continue; // back half hidden
      const lit = Math.cos(am) * Art.LX + Math.sin(am) * 0.3 * Art.LY;
      const t = i % 2 ? t2 : t1;
      x.fillStyle = lit > 0.25 ? t.hi : lit > -0.25 ? t.base : t.lo;
      x.beginPath(); x.moveTo(ax, ay); x.lineTo(cx + Math.cos(a0) * rx, cy + Math.sin(a0) * ry); x.lineTo(cx + Math.cos(a1) * rx, cy + Math.sin(a1) * ry); x.closePath(); x.fill();
    }
    // back silhouette for the upper part
    x.fillStyle = t1.lo; x.beginPath(); x.moveTo(ax, ay); x.lineTo(cx - rx, cy); x.ellipse(cx, cy, rx, ry, 0, Math.PI, Math.PI * 2); x.closePath();
    x.globalCompositeOperation = 'destination-over'; x.fill(); x.globalCompositeOperation = 'source-over';
    // entrance flap
    x.fillStyle = '#2a1a10'; x.beginPath(); x.moveTo(cx - 0.02, cy + ry * 0.98); x.lineTo(ax + 0.04, ay + hv * 0.45); x.lineTo(cx + 0.2, cy + ry * 0.92); x.closePath(); x.fill();
    x.fillStyle = t2.hi; x.beginPath(); x.moveTo(ax + 0.04, ay + hv * 0.45); x.lineTo(cx + 0.2, cy + ry * 0.92); x.lineTo(cx + 0.32, cy + ry * 0.85); x.closePath(); x.fill();
    x.strokeStyle = t1.edge; x.lineWidth = 0.03; x.beginPath(); x.moveTo(cx - rx, cy); x.lineTo(ax, ay); x.lineTo(cx + rx, cy); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI); x.stroke();
    // pole tip with a small pennant
    x.strokeStyle = '#5a3a1a'; x.lineWidth = 0.04; x.beginPath(); x.moveTo(ax, ay); x.lineTo(ax, ay - 0.25); x.stroke();
    x.fillStyle = t2.base; x.beginPath(); x.moveTo(ax, ay - 0.25); x.lineTo(ax + 0.22, ay - 0.2); x.lineTo(ax, ay - 0.14); x.closePath(); x.fill();
  },

  octPad(x, cx, cy, r, vt) {
    const pts = []; for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.9]); }
    x.fillStyle = 'rgba(0,0,0,.3)'; x.save(); x.translate(0.06, 0.1); Art.poly(x, pts); x.fill(); x.restore();
    const t = Art.tones(vt === 3 ? '#a8b0bc' : '#5a606a');
    const g = x.createLinearGradient(cx - r, cy - r, cx + r, cy + r); g.addColorStop(0, t.hi); g.addColorStop(1, t.lo);
    x.fillStyle = g; Art.poly(x, pts); x.fill(); x.strokeStyle = t.edge; x.lineWidth = 0.05; x.stroke();
    x.strokeStyle = '#f2c230'; x.lineWidth = 0.08; x.beginPath(); x.ellipse(cx, cy, r * 0.72, r * 0.65, 0, 0, Math.PI * 2); x.stroke();
    x.strokeStyle = 'rgba(245,245,240,.85)'; x.lineWidth = 0.05; x.beginPath(); x.moveTo(cx - r * 0.35, cy); x.lineTo(cx + r * 0.35, cy); x.moveTo(cx, cy - r * 0.32); x.lineTo(cx, cy + r * 0.32); x.stroke();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.fillStyle = '#1c1e22'; x.beginPath(); x.arc(cx + Math.cos(a) * r * 0.86, cy + Math.sin(a) * r * 0.77, 0.06, 0, Math.PI * 2); x.fill(); }
  },

  dish(x, cx, cy, r, vt) {
    x.save(); x.translate(cx, cy); x.rotate(-0.5);
    const g = x.createLinearGradient(-r, -r * 0.5, r, r * 0.5); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#9aa4b8');
    x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, r, r * 0.55, 0, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#5a6478'; x.lineWidth = 0.04; x.stroke();
    x.fillStyle = 'rgba(80,90,110,.35)'; x.beginPath(); x.ellipse(r * 0.12, r * 0.06, r * 0.7, r * 0.36, 0, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#6a7488'; x.lineWidth = 0.03; x.beginPath(); x.moveTo(-r * 0.6, -r * 0.3); x.lineTo(0, -r * 0.9); x.lineTo(r * 0.6, -r * 0.3); x.stroke();
    x.fillStyle = vt === 3 ? '#f2c14b' : '#ff5fa8'; x.beginPath(); x.arc(0, -r * 0.9, 0.07, 0, Math.PI * 2); x.fill();
    x.restore();
  },

  // ---------------- small animated part sprites ----------------
  bitSprite(vt, ppt) {
    return Art.cached('B|bit|' + vt + '|' + ppt, () => {
      const S = Math.ceil(ppt * 1.1), c = Art.canvas(S, S), x = c.getContext('2d');
      x.translate(S / 2, S / 2); x.scale(S / 1.1, S / 1.1);
      const steel = vt === 3 ? Art.pal('gold') : Art.pal('steel');
      x.fillStyle = '#2a2d33'; x.beginPath(); x.arc(0, 0, 0.44, 0, Math.PI * 2); x.fill();
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; x.fillStyle = vt >= 2 ? '#f2c14b' : '#c9ced6'; x.beginPath(); x.moveTo(Math.cos(a) * 0.38, Math.sin(a) * 0.38); x.lineTo(Math.cos(a + 0.18) * 0.5, Math.sin(a + 0.18) * 0.5); x.lineTo(Math.cos(a + 0.3) * 0.38, Math.sin(a + 0.3) * 0.38); x.fill(); }
      for (let i = 0; i < 3; i++) {
        x.rotate(Math.PI * 2 / 3);
        x.fillStyle = steel.hi; x.beginPath(); x.moveTo(0.06, 0); x.quadraticCurveTo(0.25, -0.2, 0.42, -0.1); x.lineTo(0.42, 0.06); x.quadraticCurveTo(0.22, -0.02, 0.06, 0.1); x.closePath(); x.fill();
        x.strokeStyle = steel.edge; x.lineWidth = 0.02; x.stroke();
      }
      x.fillStyle = steel.base; x.beginPath(); x.arc(0, 0, 0.12, 0, Math.PI * 2); x.fill(); x.strokeStyle = steel.edge; x.lineWidth = 0.025; x.stroke();
      return c;
    });
  },
  gearSprite(vt, ppt) {
    return Art.cached('B|gear|' + vt + '|' + ppt, () => {
      const S = Math.ceil(ppt * 1.5), c = Art.canvas(S, S), x = c.getContext('2d');
      x.translate(S / 2, S / 2); x.scale(S / 1.5, S / 1.5);
      const t = vt === 3 ? Art.pal('gold') : Art.pal('brass');
      x.beginPath();
      for (let i = 0; i < 20; i++) { const a0 = i * Math.PI / 10, a1 = a0 + Math.PI / 20; x.lineTo(Math.cos(a0) * 0.72, Math.sin(a0) * 0.72); x.lineTo(Math.cos(a0 + 0.04) * 0.6, Math.sin(a0 + 0.04) * 0.6); x.lineTo(Math.cos(a1 + 0.06) * 0.6, Math.sin(a1 + 0.06) * 0.6); x.lineTo(Math.cos(a1 + 0.1) * 0.72, Math.sin(a1 + 0.1) * 0.72); }
      x.closePath();
      const g = x.createLinearGradient(-0.7, -0.7, 0.7, 0.7); g.addColorStop(0, t.hi); g.addColorStop(1, t.lo);
      x.fillStyle = g; x.fill(); x.strokeStyle = t.edge; x.lineWidth = 0.03; x.stroke();
      x.fillStyle = Col.rgba(t.lo, 0.9);
      for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; x.beginPath(); x.ellipse(Math.cos(a) * 0.36, Math.sin(a) * 0.36, 0.11, 0.08, a, 0, Math.PI * 2); x.fill(); }
      x.fillStyle = '#2a2d33'; x.beginPath(); x.arc(0, 0, 0.14, 0, Math.PI * 2); x.fill();
      x.fillStyle = t.hi; x.beginPath(); x.arc(0, 0, 0.07, 0, Math.PI * 2); x.fill();
      return c;
    });
  },
  dishSprite(ppt) {
    return Art.cached('B|dish|' + ppt, () => {
      const S = Math.ceil(ppt * 1.2), c = Art.canvas(S, S), x = c.getContext('2d');
      x.translate(S / 2, S / 2); x.scale(S / 1.2, S / 1.2);
      const g = x.createLinearGradient(-0.5, -0.3, 0.5, 0.3); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#a0aabb');
      x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, 0.5, 0.3, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = '#5a6478'; x.lineWidth = 0.03; x.stroke();
      x.fillStyle = 'rgba(80,90,110,.3)'; x.beginPath(); x.ellipse(0.05, 0.04, 0.36, 0.2, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = '#6a7488'; x.lineWidth = 0.02; x.beginPath(); x.moveTo(-0.3, -0.15); x.lineTo(0, -0.45); x.lineTo(0.3, -0.15); x.stroke();
      x.fillStyle = '#ff6a6a'; x.beginPath(); x.arc(0, -0.45, 0.04, 0, Math.PI * 2); x.fill();
      return c;
    });
  },

  // ---------------- cast shadows ----------------
  SH: {},
  shadowBoxes(type, W, H, vt) {
    const k = type + W + 'x' + H + vt;
    let s = BuildingArt.SH[k];
    if (s) return s;
    const V = Art.V;
    switch (type) {
      case 'extractor': s = [[0.14, 0.18, 1.72, 0.72, 0.85 + vt * 0.12], [0.85, 1.2, 0.3, 0.2, 1.0 + vt * 0.12]]; break;
      case 'silo': s = [[0.45, 1.1, 2.1, 1.0, 2.6 + vt * 0.2]]; break;
      case 'refinery1': case 'refinery2': case 'refinery3': s = [[0.2, 0.95, 2.6, 1.85, 0.9], [0.5, 0.4, 1.2, 0.5, 2.0], [2.2, 0.5, 0.3, 0.2, 2.4]]; break;
      case 'cooler': s = [[0.35, 1.0, 1.3, 0.7, 2.2 + vt * 0.2]]; break;
      case 'servo': s = [[0.14, 0.16, 1.72, 1.66, 0.55]]; break;
      case 'charger': s = [[0.16, 0.16, 1.68, 1.68, 0.35], [0.4, 0.6, 1.2, 0.9, 1.3]]; break;
      case 'lab': s = [[0.3, 1.55, 3.4, 2.1, 1.0], [0.6, 0.9, 1.6, 0.9, 2.0]]; break;
      case 'bazaar': s = [[0.1, 0.1, W - 0.2, H * 0.6, 1.3]]; break;
      case 'caravan': s = [[0.1, 0.1, W - 0.2, 0.25, 0.4], [0.45, 1.35, 1.1, 1.4, 1.0], [W - 1.55, 1.35, 1.1, 1.4, 1.0]]; break;
      case 'shuttlepad': s = [[0.12, 0.12, W - 0.24, H - 0.24, 0.2], [W - 1.05, 0.15, 0.7, 0.5, 0.75]]; break;
      case 'port': s = [[W / 2 - 0.45, 0.25, 0.9, 0.8, 3.0], [0.45, 0.35, W - 0.9, 0.55, 0.55], [0.48, H - 0.8, 0.14, 0.14, 3.6], [W - 0.62, H - 0.8, 0.14, 0.14, 3.6]]; break;
      case 'dock': s = [[0.3, 0.35, 1.6, 1.0, 1.0], [0.9, 7.45, 0.3, 0.3, 3.2], [W - 1.2, 7.45, 0.3, 0.3, 3.2], [0.2, 2.4, 1.3, 5.4, 1.0], [W - 1.55, 2.4, 1.3, 5.4, 1.0]]; break;
      case 'terminal': s = [[0.4, 0.5, 2.8, 1.6, 1.4], [W - 2.05, 0.9, 0.9, 0.9, 2.6]]; break;
      case 'lamp': s = [[0.46, 0.66, 0.08, 0.08, 2.7]]; break;
      case 'flag': s = [[0.32, 0.68, 0.06, 0.06, 2.9]]; break;
      case 'beacon': s = [[0.4, 0.7, 0.2, 0.1, 3.0]]; break;
      case 'plant': s = [[0.1, 0.4, 0.8, 0.4, 0.9]]; break;
      case 'fence': s = [[0.42, 0.48, 0.16, 0.12, 0.6]]; break;
      case 'splitter': case 'merger': case 'crossing': case 'fsplitter': case 'osplitter': s = [[0.12, 0.16, 0.76, 0.72, 0.38]]; break;
      case 'path': case 'belt': case 'bridge': s = []; break;
      default: s = [[0.1, 0.1, W - 0.2, H - 0.2, 0.6]];
    }
    BuildingArt.SH[k] = s;
    return s;
  },
  // adds cast-shadow hexagons of all buildings to one path; filled once
  castShadows(ctx, g, vis) {
    const sun = Render.sun(g);
    if (sun.a < 0.02) return;
    const sx = sun.dx * Art.V * 1.5, sy = sun.dy * Art.V * 1.5;
    ctx.beginPath();
    let any = false;
    for (const b of vis) {
      if (b.type === 'belt' || b.type === 'path' || b.type === 'bridge') continue;
      const boxes = BuildingArt.shadowBoxes(b.type, b.w, b.h, VT(b.level));
      const bx = b.x - Render.ox, by = b.y - Render.oy;
      for (const [x0, y0, w, h, hh] of boxes) {
        const X = bx + x0, Y = by + y0, ox = sx * hh, oy = sy * hh;
        ctx.moveTo(X, Y); ctx.lineTo(X + w, Y); ctx.lineTo(X + w + ox, Y + oy); ctx.lineTo(X + w + ox, Y + h + oy); ctx.lineTo(X + ox, Y + h + oy); ctx.lineTo(X, Y + h); ctx.closePath();
        any = true;
      }
    }
    if (!any) return;
    ctx.fillStyle = 'rgba(10,8,20,' + sun.a.toFixed(3) + ')';
    ctx.fill('nonzero');
  },

  // ---------------- night lights (emissive points, relative to the footprint) ----------------
  LT: {},
  lights(b) {
    const vt = VT(b.level), k = b.type + vt + b.w + 'x' + b.h + (b.type === 'lamp' ? b.level : '');
    let L = BuildingArt.LT[k];
    if (L) return L;
    const V = Art.V;
    switch (b.type) {
      case 'extractor': { const G = BuildingArt.GEO.extractor(vt); L = [[G.win[0] + G.win[2] / 2, G.win[1] + G.win[3] / 2, 1.4, '#ffb070'], [1.0, 1.36, 1.6, '#ff9a4a']]; break; }
      case 'silo': { const G = BuildingArt.GEO.silo(vt); L = [[G.cx, G.win[1] + G.win[3] / 2, 1.6, '#9fd8ff'], [G.cx, G.top - 0.5, 1.0, '#ffffff']]; break; }
      case 'refinery1': case 'refinery2': case 'refinery3': { const G = BuildingArt.GEO.refinery(REFINERY_LEVEL[b.type], vt); L = [[G.sky[0] + G.sky[2] / 2, G.sky[1] + G.sky[3] / 2, 3.2, DATA.BUILDINGS[b.type].color]]; break; }
      case 'cooler': L = [[1.0, 1.38 - BA_E - (2.1 + vt * 0.2) * V, 1.4, '#bfe8ff']]; break;
      case 'servo': L = [[1.0, 0.8, 1.6, '#ffd27a']]; break;
      case 'charger': { const G = BuildingArt.GEO.charger(vt); L = [[G.rod[0], G.rod[1], 2.4, '#9bf06a']]; break; }
      case 'lab': { const G = BuildingArt.GEO.lab(vt); L = [[2.0, G.by + 2.1 - G.bh * V + 0.25, 4.2, '#ffe0a8'], [G.dish[0], G.dish[1], 1.2, '#ff6a6a']]; break; }
      case 'bazaar': L = [[b.w / 2, b.h * 0.52 - 0.3, 3.4, '#ffcf7a']]; break;
      case 'caravan': L = [[b.w / 2, 1.0, 2.6, '#ffb070'], [b.w / 2, b.h - 0.8, 3.2, '#ffcf7a']]; break;
      case 'shuttlepad': L = [[0.42, 0.31, 1.5, '#ff6a5a'], [b.w - 0.42, 0.31, 1.5, '#ff6a5a'], [0.42, b.h - 0.53, 1.5, '#ff6a5a'], [b.w - 0.42, b.h - 0.53, 1.5, '#ff6a5a'], [b.w / 2, b.h / 2, 4.5, '#9fd8ff']]; break;
      case 'port': L = [[1.95, 3.9, 4, '#9fd8ff'], [5.05, 3.9, 4, '#9fd8ff'], [3.5, 1.05 - BA_E - (2.6 + vt * 0.25) * V + 0.4, 2.4, '#bfe8ff']]; break;
      case 'dock': L = [[b.w / 2, b.h / 2 + 0.6, 7, '#ffd0a0'], [1.1, 1.0, 2, '#ffe0a8']]; break;
      case 'terminal': L = [[b.w / 2, b.h - 2.2 - 0.9, 4.5, '#ff9fd0'], [1.8, 1.3, 3.5, '#ffb8e0']]; break;
      case 'lamp': L = b.level >= 2 ? [[0.72, -0.8, 3.2, '#d8f0ff'], [0.28, -0.8, 3.2, '#d8f0ff']] : [[0.72, -0.8, 3.0 + b.level * 0.4, '#ffe28a']]; break;
      case 'beacon': L = [[0.5, -1.0, 2.6, '#7fe0ff']]; break;
      case 'plant': L = [[0.5, 0.3, 1.4, '#a0ffb0']]; break;
      default: L = [];
    }
    BuildingArt.LT[k] = L;
    return L;
  },

  // ---------------- status badges (instead of warning triangles) ----------------
  badge(ctx, b, tm) {
    const x = b.x + b.w - 0.15 - Render.ox, y0 = b.y - Render.oy - (BuildingArt.TOP[b.type] || 1) * 0.45;
    const s = Math.max(0.2, 9 / App.cam.zoom);
    const y = y0 + Math.sin(tm * 3 + b.id) * s * 0.12;
    const red = b.warn === 'full' || b.warn === 'empty' || b.warn === 'nocon';
    const col = red ? '#ff5a5a' : '#ffc24d';
    const pulse = 1 + Math.max(0, Math.sin(tm * 5 + b.id)) * 0.08;
    ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(s * 0.08, s * 0.12, s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a1214'; ctx.lineWidth = s * 0.14; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.35, s * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a1214'; ctx.fillStyle = '#1a1214'; ctx.lineWidth = s * 0.16; ctx.lineCap = 'round';
    const w = b.warn;
    ctx.beginPath();
    if (w === 'full' || w === 'nearfull') { const n = w === 'full' ? 3 : 2; for (let i = 0; i < n; i++) { const yy = s * 0.35 - i * s * 0.32; ctx.moveTo(-s * 0.42, yy); ctx.lineTo(s * 0.42, yy); } ctx.stroke(); }
    else if (w === 'empty') { ctx.lineWidth = s * 0.12; ctx.strokeRect(-s * 0.42, -s * 0.3, s * 0.84, s * 0.66); ctx.beginPath(); ctx.moveTo(-s * 0.42, -s * 0.3); ctx.lineTo(0, -s * 0.05); ctx.lineTo(s * 0.42, -s * 0.3); ctx.stroke(); }
    else if (w === 'nocon') { ctx.lineWidth = s * 0.13; ctx.beginPath(); ctx.arc(-s * 0.28, s * 0.08, s * 0.22, Math.PI * 0.3, Math.PI * 1.7); ctx.stroke(); ctx.beginPath(); ctx.arc(s * 0.28, -s * 0.08, s * 0.22, Math.PI * 1.3, Math.PI * 0.7); ctx.stroke(); }
    else if (w === 'blocked') { ctx.fillRect(-s * 0.36, -s * 0.42, s * 0.24, s * 0.84); ctx.fillRect(s * 0.12, -s * 0.42, s * 0.24, s * 0.84); }
    else if (w === 'wrong') { ctx.moveTo(-s * 0.35, -s * 0.35); ctx.lineTo(s * 0.35, s * 0.35); ctx.moveTo(s * 0.35, -s * 0.35); ctx.lineTo(-s * 0.35, s * 0.35); ctx.stroke(); }
    else { ctx.moveTo(0, -s * 0.45); ctx.lineTo(0, s * 0.1); ctx.stroke(); ctx.beginPath(); ctx.arc(0, s * 0.42, s * 0.1, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
};

// ===== src/app/04b_belts.js =====
// =====================================================================
// BeltArt: belt tiles as cached animation frames. Base plate, riveted
// rails, moving profile (scrolls at the real belt speed), true quarter
// curves, end caps and T-inlets. Grades differ in material and motion:
// rubber / yellow metal slats / steel-blue with glowing arrows / plasma.
// =====================================================================
const BELT_GRADES = [
  { rail: '#8b939c', surf: '#303237', slat: 'rgba(255,255,255,.09)', gap: 'rgba(0,0,0,.35)', chev: null, period: 0.25, frames: 8 },
  { rail: '#e8b830', surf: '#5a6068', slat: 'rgba(255,255,255,.22)', gap: 'rgba(0,0,0,.45)', chev: null, period: 0.25, frames: 8 },
  { rail: '#4a90d8', surf: '#2c3a4c', slat: 'rgba(170,210,255,.16)', gap: 'rgba(0,0,0,.45)', chev: '#7fe8ff', period: 0.5, frames: 12 },
  { rail: '#7a3aa8', surf: '#1e1426', slat: 'rgba(255,120,230,.1)', gap: 'rgba(0,0,0,.5)', chev: '#ff6ae0', period: 0.5, frames: 12, plasma: true }
];

const BeltArt = {
  M: 0.06,
  // topology bits: 1 back connected, 2 front connected, 4 left inlet, 8 right inlet
  topo(g, b) {
    if (b._tv === g.topoVersion && b._topo !== undefined) return b._topo;
    b._tv = g.topoVersion;
    const r = b.rot, DX = U.DX, DY = U.DY;
    const feeds = d => {
      const o = Grid.at(g, b.x - DX[d], b.y - DY[d]);
      if (!o) return false;
      if (o.type === 'belt' || o.type === 'merger') return o.x + DX[o.rot] === b.x && o.y + DY[o.rot] === b.y;
      return o.type === 'splitter' || o.type === 'fsplitter' || o.type === 'osplitter';
    };
    let m = 0;
    const back = Grid.at(g, b.x - DX[r], b.y - DY[r]);
    if (back && (back.type !== 'belt' || feeds(r))) m |= 1;
    const front = Grid.at(g, b.x + DX[r], b.y + DY[r]);
    if (front && !(front.type === 'belt' && front.rot === ((r + 2) & 3)) && front.type !== 'path' && !Grid.isDeco(front.type)) m |= 2;
    if (feeds((r + 1) & 3)) m |= 4;
    if (feeds((r + 3) & 3)) m |= 8;
    b._topo = m;
    return m;
  },
  frameOf(grade, speed, tm) {
    const G = BELT_GRADES[grade];
    if (App.settings.reducedFx) return 0;
    const ph = (tm * speed / G.period) % 1;
    return Math.floor(ph * G.frames) % G.frames;
  },
  sprite(grade, shape, rot, mask, frame, ppt) {
    const k = shape === 0 ? mask & 15 : 0;
    return Art.cached('BL|' + grade + '|' + shape + '|' + rot + '|' + k + '|' + frame + '|' + ppt, () => BeltArt.render(grade, shape, rot, k, frame, ppt));
  },
  // world-space vector expressed in the local (rotated / mirrored) frame
  toLocal(wx, wy, rot, mir) {
    let x = wx, y = wy;
    for (let i = 0; i < rot; i++) { const t = x; x = y; y = -t; }
    return [x, y * mir];
  },
  render(grade, shape, rot, mask, frame, ppt) {

  // ---------------- drawing ----------------
  draw(ctx, g, list, tm) {

      const fr = b.boost > 1 ? BeltArt.frameOf(b.grade, CONFIG.belt.speed[b.grade] * b.boost, tm) : frames[b.grade];

  renderChunk(g, cx, cy, ppt, belts, old) {

  // far zoom: flat batched rectangles

  // position of an item on a belt (true arcs on curves)

    const cx = b.x + 0.5, cy = b.y + 0.5;
    const shape = b.shape || 0;

  // items on belts: contact shadow is part of the sprite; lateral and angular jitter, spawn pop, jam shake

    const z = App.cam.zoom;
    if (z < 6) return;
    const ox = Render.ox, oy = Render.oy, now = App.now;
    const s = 0.34; // half extent in tiles
    const px = ItemArt.sizeFor(s * 2 * Render.ppt());
    const lod = z < 13;
    const out = BeltArt._o || (BeltArt._o = [0, 0, 0, 0]);
    const fx = !App.settings.reducedFx;
    // numeric memo of item sprites for this size (avoids building string keys per item)

    const tier7 = Math.floor(tm * 2) & 7;
    for (const b of list) {
      const its = b.items;
      for (let i = 0; i < its.length; i++) {
        const it = its[i];

  // small "plop" when an item leaves a belt into a building
  plops(g, list) {

// ===== src/app/04c_chars.js =====
// =====================================================================
// CharArt: astronaut (8-frame walk in front/back/side, idle breathing,
// waving, jetpack on sprint), rover, six alien species (6-frame walk,
// idle, joy, impatience, disappointment), caravan of rover-beetles,
// shuttle / trader / freighter with landing sequences, speech bubble.
// =====================================================================
const ALIEN_SPECIES = ['Glibber', 'Stelzer', 'Krabbler', 'Pilzling', 'Schweber', 'Steinling'];

const CharArt = {
  dir: 'front', walk: 0, idle: 0, lastStep: -1,
  limb(x, x0, y0, x1, y1, w, t) {
    x.lineCap = 'round';
    x.strokeStyle = t.edge; x.lineWidth = w + 0.04; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
    x.strokeStyle = t.base; x.lineWidth = w; x.stroke();
    x.strokeStyle = Col.rgba(t.rim, 0.6); x.lineWidth = w * 0.3; x.beginPath(); x.moveTo(x0 - w * 0.2, y0); x.lineTo(x1 - w * 0.2, y1); x.stroke();
  },
  boot(x, fx, fy, dirx, t) {
    x.fillStyle = t.edge; Art.rrect(x, fx - 0.07 + dirx * 0.02, fy - 0.07, 0.15, 0.09, 0.035); x.fill();
    x.fillStyle = t.base; Art.rrect(x, fx - 0.06 + dirx * 0.02, fy - 0.065, 0.13, 0.065, 0.03); x.fill();
  },

  // ---------------- astronaut ----------------
  astronaut(ctx, g, x, y, tm, dt) {
    const p = g.run.player;
    const moving = p.moving;
    const rover = g.run.research.done.has('rover') && moving;
    const sprint = moving && g.input && g.input.sprint;
    if (moving) {
      CharArt.dir = Math.abs(p.vy) > Math.abs(p.vx) * 1.2 ? (p.vy > 0 ? 'front' : 'back') : 'side';
      CharArt.walk += dt * (sprint ? 2.5 : 1.7);
      CharArt.idle = 0;
    } else { CharArt.idle += dt; CharArt.walk = 0; }
    if (rover) { CharArt.rover(ctx, g, x, y, tm, p); return; }
    const frame = moving ? Math.floor((CharArt.walk % 1) * 8) : 0;
    const ph = frame / 8 * Math.PI * 2;
    // foot dust on contact frames
    if (moving && (frame === 0 || frame === 4) && CharArt.lastStep !== frame && !App.settings.reducedFx && App.quality !== 'low') {
      for (let i = 0; i < 2; i++) Render.spawn('dust', p.x + (Math.random() - 0.5) * 0.2, p.y, (Math.random() - 0.5) * 0.5 - p.vx * 0.05, -0.15 - Math.random() * 0.2, 0.6, Render.palette.particle, 0.07);
    }
    CharArt.lastStep = moving ? frame : -1;
    const breath = moving ? 0 : Math.sin(tm * 2.2) * 0.012;
    const bob = moving ? Math.abs(Math.sin(ph)) * 0.045 : 0;
    const waving = !moving && CharArt.idle > 3 && (CharArt.idle % 9) < 2.2;
    const face = p.face || 1;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(x, y + 0.02, 0.3, 0.11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(x, y - bob);
    const suit = Art.pal('white'), dark = Art.tones('#8a909c'), acc = Art.tones(Render.palette.accent);
    const bootT = Art.tones('#5a6070');
    if (sprint && !App.settings.reducedFx) CharArt.jet(ctx, tm, face);
    if (CharArt.dir === 'side') {
      ctx.scale(face, 1);
      const sw = Math.sin(ph) * 0.42, sw2 = -sw;
      const leg = (a, near) => { const hx = 0.02, hy = -0.34, kx = hx + Math.sin(a) * 0.17, ky = hy + Math.cos(a) * 0.17, bend = Math.max(0, -Math.sin(a)) * 0.08; const fx = kx + Math.sin(a * 0.6) * 0.15 - bend, fy = -0.02 - (near ? 0 : 0.01) - Math.max(0, Math.cos(ph + (near ? 0 : Math.PI))) * 0.03 * (moving ? 1 : 0); CharArt.limb(ctx, hx, hy, kx, ky, 0.11, near ? suit : dark); CharArt.limb(ctx, kx, ky, fx, fy, 0.1, near ? suit : dark); CharArt.boot(ctx, fx, fy + 0.02, 1, bootT); };
      // far arm and leg
      CharArt.limb(ctx, 0.0, -0.7, 0.03 + Math.sin(sw2) * 0.16, -0.46, 0.08, dark);
      leg(sw2, false);
      // backpack
      Art.box(ctx, -0.27, -0.42, 0.16, 0.1, 0.62, Art.tones('#aab0bc'), { r: 0.04, lw: 0.02 });
      ctx.fillStyle = acc.base; ctx.fillRect(-0.25, -0.68, 0.03, 0.12);
      // torso
      ctx.save(); ctx.translate(0, -0.34); ctx.scale(1, 1 + breath * 2); ctx.translate(0, 0.34);
      const tg = ctx.createLinearGradient(-0.17, 0, 0.17, 0); tg.addColorStop(0, suit.hi); tg.addColorStop(1, suit.lo);
      ctx.fillStyle = tg; Art.rrect(ctx, -0.15, -0.76, 0.32, 0.44, 0.12); ctx.fill();
      ctx.strokeStyle = suit.edge; ctx.lineWidth = 0.025; ctx.stroke();
      ctx.fillStyle = acc.base; ctx.fillRect(-0.15, -0.5, 0.32, 0.04);

    } else {
      const front = CharArt.dir === 'front';
      const lift = i => moving ? Math.max(0, Math.sin(ph + i * Math.PI)) * 0.07 : 0;
      // legs
      for (const [i, lx] of [[0, -0.08], [1, 0.08]]) { const l = lift(i); CharArt.limb(ctx, lx, -0.34, lx, -0.06 - l, 0.11, suit); CharArt.boot(ctx, lx - 0.02, -0.02 - l * 0.6, 0, bootT); }

      const tg = ctx.createLinearGradient(-0.2, 0, 0.2, 0); tg.addColorStop(0, suit.hi); tg.addColorStop(1, suit.lo);
      ctx.fillStyle = tg; Art.rrect(ctx, -0.19, -0.76, 0.38, 0.44, 0.13); ctx.fill();

      } else { Art.box(ctx, -0.17, -0.4, 0.34, 0.1, 0.6, Art.tones('#b4bac6'), { r: 0.05, lw: 0.02 }); ctx.fillStyle = acc.base; ctx.fillRect(-0.15, -0.6, 0.3, 0.035); }
      ctx.fillStyle = acc.base; ctx.fillRect(-0.19, -0.46, 0.38, 0.035);
      ctx.restore();

      else CharArt.limb(ctx, 0.2, -0.7, 0.25, -0.44 - as, 0.085, suit);

    if (sprint && !App.settings.reducedFx && Math.random() < 0.8) Render.spawn('jet', p.x - face * 0.2, p.y - 0.4, -p.vx * 0.08 + (Math.random() - 0.5) * 0.3, 0.7 + Math.random() * 0.5, 0.35, '#ffb04a', 0.07);
  },
  helmet(ctx, cx, cy, view, acc, tm) {
    const r = 0.21;
    const g = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.45, r * 0.1, cx, cy, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#e4e8ef'); g.addColorStop(1, '#a8afbc');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6a7080'; ctx.lineWidth = 0.025; ctx.stroke();
    if (view !== 'back') {
      const vx = view === 'side' ? cx + 0.07 : cx, vw = view === 'side' ? 0.13 : 0.15;
      const vg = ctx.createLinearGradient(vx - vw, cy - 0.12, vx + vw, cy + 0.1);
      vg.addColorStop(0, '#ffe0a0'); vg.addColorStop(0.5, '#ff9a3a'); vg.addColorStop(1, '#8a3a1a');
      ctx.fillStyle = vg; ctx.beginPath(); ctx.ellipse(vx, cy + 0.01, vw, 0.11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 0.02; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(vx - vw * 0.4, cy - 0.04, vw * 0.25, 0.03, -0.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = '#8a909c'; ctx.lineWidth = 0.02; ctx.beginPath(); ctx.moveTo(cx + 0.1, cy - 0.12); ctx.lineTo(cx + 0.14, cy - 0.32); ctx.stroke();
      ctx.fillStyle = (Math.floor(tm * 2) & 1) ? '#ff5a5a' : '#7a2a2a'; ctx.beginPath(); ctx.arc(cx + 0.14, cy - 0.33, 0.025, 0, Math.PI * 2); ctx.fill();
    }
  },
  jet(ctx, tm, face) {
    const f = Math.floor(tm * 18) & 3;
    const spr = FxLib.tinted('flame', f, '#ffb04a');
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const fx = CharArt.dir === 'side' ? -0.19 * face : 0, fy = -0.36;
    ctx.drawImage(spr, fx - 0.09, fy, 0.18, 0.34);

  },
  rover(ctx, g, x, y, tm, p) {
    const face = p.face || 1;
    ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(x, y + 0.04, 0.85, 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);

    ctx.translate(0, shake);

    for (const wx of [-0.55, 0, 0.55]) { ctx.fillStyle = '#1c1e22'; ctx.beginPath(); ctx.ellipse(wx + 0.06, -0.14, 0.15, 0.15, 0, 0, Math.PI * 2); ctx.fill(); }

    ctx.fillStyle = acc.base; ctx.fillRect(-0.75, -0.2, 1.5, 0.045);

    ctx.strokeStyle = '#7fb0ff'; ctx.lineWidth = 0.012; ctx.beginPath(); for (let i = 1; i < 5; i++) { ctx.moveTo(-0.7 + i * 0.12, -0.55); ctx.lineTo(-0.71 + i * 0.12, -0.42); } ctx.stroke();
    ctx.strokeStyle = '#d8dde6'; ctx.lineWidth = 0.02; ctx.beginPath(); ctx.moveTo(0.6, -0.45); ctx.lineTo(0.62, -0.85); ctx.stroke();
    ctx.fillStyle = (Math.floor(tm * 3) & 1) ? '#7fe8ff' : '#2a5a6a'; ctx.beginPath(); ctx.arc(0.62, -0.86, 0.03, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = '#5a606a'; ctx.lineWidth = 0.03; ctx.beginPath();
      for (let k = 0; k < 3; k++) { const a = spin + k * Math.PI / 3; ctx.moveTo(wx + Math.cos(a) * 0.12, -0.06 + Math.sin(a) * 0.12); ctx.lineTo(wx - Math.cos(a) * 0.12, -0.06 - Math.sin(a) * 0.12); }

  },

  // ---------------- aliens ----------------
  // pose: 0 walk, 1 idle, 2 joy, 3 impatient, 4 sad
  alienSprite(sp, col, pose, frame, ppt) {
    return Art.cached('P|AL|' + sp + '|' + col + '|' + pose + '|' + frame + '|' + ppt, () => {
      const W = 1.4, H = 1.7, c = Art.canvas(W * ppt, H * ppt), x = c.getContext('2d');
      x.scale(ppt, ppt); x.translate(W / 2, H - 0.2);

    });
  },
  alienBody(x, sp, col, pose, frame) {
    const t = Art.tones(col), ph = frame / 6 * Math.PI * 2;
    const walk = pose === 0, joy = pose === 2, sad = pose === 4, imp = pose === 3;
    const hop = joy ? Math.abs(Math.sin(frame / 4 * Math.PI)) * 0.18 : 0;
    const breathe = pose === 1 ? Math.sin(frame / 4 * Math.PI * 2) * 0.02 : 0;
    const droop = sad ? 0.08 : 0;
    const eye = (ex, ey, r, look = 0.3) => {
      x.fillStyle = '#ffffff'; x.beginPath(); x.arc(ex, ey, r, 0, Math.PI * 2); x.fill();
      x.strokeStyle = t.edge; x.lineWidth = 0.015; x.stroke();
      x.fillStyle = '#121418'; x.beginPath(); x.arc(ex + r * look, ey + (sad ? r * 0.3 : 0), r * 0.5, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#ffffff'; x.beginPath(); x.arc(ex + r * look - r * 0.15, ey - r * 0.2, r * 0.15, 0, Math.PI * 2); x.fill();
      if (imp) { x.strokeStyle = '#121418'; x.lineWidth = 0.02; x.beginPath(); x.moveTo(ex - r, ey - r * 1.1); x.lineTo(ex + r, ey - r * 0.6); x.stroke(); }

    };

      x.strokeStyle = '#2a1418'; x.lineWidth = 0.022; x.beginPath();
      if (joy) { x.arc(mx, my - w * 0.2, w, 0.15 * Math.PI, 0.85 * Math.PI); }
      else if (sad) { x.arc(mx, my + w * 0.7, w * 0.8, 1.2 * Math.PI, 1.8 * Math.PI); }
      else if (imp) { x.moveTo(mx - w, my); x.lineTo(mx - w * 0.3, my + 0.02); x.lineTo(mx + w * 0.3, my - 0.02); x.lineTo(mx + w, my); }
      else { x.moveTo(mx - w * 0.6, my); x.quadraticCurveTo(mx, my + w * 0.3, mx + w * 0.6, my); }
      x.stroke();
    };
    const shade = (cx, cy, rx, ry) => { const g = x.createRadialGradient(cx - rx * 0.35, cy - ry * 0.4, rx * 0.1, cx, cy, Math.max(rx, ry)); g.addColorStop(0, t.rim); g.addColorStop(0.5, t.base); g.addColorStop(1, t.lo); return g; };
    // ground shadow
    x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.ellipse(0, 0.02, 0.28 - hop * 0.4, 0.09, 0, 0, Math.PI * 2); x.fill();

      x.strokeStyle = t.edge; x.lineWidth = 0.03; x.stroke();
      x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.ellipse(-rx * 0.4, -ry * 1.5, rx * 0.25, ry * 0.15, -0.5, 0, Math.PI * 2); x.fill();

    } else if (sp === 1) { // Stelzer: tall, thin, three eyes, bird legs
      const a = walk ? Math.sin(ph) * 0.35 : 0;
      for (const [s, k] of [[-1, 1], [1, -1]]) { const fx = Math.sin(a * k) * 0.2; x.strokeStyle = t.edge; x.lineWidth = 0.06; x.beginPath(); x.moveTo(s * 0.06, -0.5); x.lineTo(s * 0.1 + fx * 0.5, -0.25); x.lineTo(fx + s * 0.04, -0.02); x.stroke(); x.strokeStyle = t.lo; x.lineWidth = 0.035; x.stroke(); }
      x.fillStyle = shade(0, -0.65, 0.18, 0.24); x.beginPath(); x.ellipse(0, -0.66 + breathe, 0.17, 0.22, 0, 0, Math.PI * 2); x.fill(); x.strokeStyle = t.edge; x.lineWidth = 0.025; x.stroke();
      x.strokeStyle = t.base; x.lineWidth = 0.07; x.beginPath(); x.moveTo(0, -0.82); x.quadraticCurveTo(0.08, -0.98 + droop, 0.04, -1.08 + droop); x.stroke();
      x.fillStyle = shade(0.04, -1.16, 0.18, 0.13); x.beginPath(); x.ellipse(0.04, -1.16 + droop, 0.19, 0.13, sad ? 0.3 : 0, 0, Math.PI * 2); x.fill(); x.strokeStyle = t.edge; x.lineWidth = 0.025; x.stroke();
      eye(-0.06, -1.19 + droop, 0.045); eye(0.04, -1.22 + droop, 0.045); eye(0.14, -1.19 + droop, 0.045);

    } else if (sp === 2) { // Krabbler: crab with claws and eye stalks
      const a = walk ? Math.sin(ph) : 0;

  // landing / takeoff choreography. k: 0..1 progress; returns {alt, legs, thr}
  shipPhase(c) {
    if (c.state === 'wait') return { alt: 0, legs: 1, thr: 0.05, squash: 0 };
    if (c.state === 'in') {
      const k = U.clamp(c.t / c.arrive, 0, 1);
      if (k < 0.6) { const e = Art.ease.outCubic(k / 0.6); return { alt: 1 - e * 0.78, legs: 0, thr: 0.4, side: 1 - e, squash: 0 }; }
      if (k < 0.85) { const e = Art.ease.inOutQuad((k - 0.6) / 0.25); return { alt: 0.22 * (1 - e) + 0.02, legs: e, thr: 1, squash: 0 }; }
      const e = (k - 0.85) / 0.15;
      return { alt: 0.02 * (1 - e), legs: 1, thr: 0.5 * (1 - e), squash: Math.sin(e * Math.PI) * 0.06 };
    }
    const k = U.clamp(c.t / 3, 0, 1);
    if (k < 0.2) { const e = k / 0.2; return { alt: 0, legs: 1, thr: e, squash: -Math.sin(e * Math.PI) * 0.03 }; }
    const e = Art.ease.inCubic((k - 0.2) / 0.8);
    return { alt: e, legs: 1 - Math.min(1, e * 3), thr: 1, side: -e, squash: 0 };
  },
  ship(ctx, x, y, c, tm, b) {
    const tier = c.tier;
    const S = [0, 0, 2.2, 3.4, 5.6][tier];
    const ph = CharArt.shipPhase(c);
    const sun = Render.sun(App.g);
    const H = 7; // tiles of screen height at full altitude
    const alt = ph.alt;
    const sc = 1 + alt * 0.55;
    const drift = (ph.side || 0) * 4;
    // soft shadow on the ground (shrinks and fades with altitude)
    const sa = 0.4 * (1 - alt * 0.75);
    ctx.save(); ctx.globalAlpha = sa;
    const shx = x + drift * 0.3 + alt * sun.dx * 4, shy = y + alt * sun.dy * 4;
    ctx.drawImage(FxLib.tinted('soft', 0, '#000000'), shx - S * 0.5 * (1 - alt * 0.3), shy - S * 0.32 * (1 - alt * 0.3), S * (1 - alt * 0.3), S * 0.64 * (1 - alt * 0.3));
    ctx.restore();
    const px = x + drift, py = y - alt * H;
    ctx.save(); ctx.translate(px, py); ctx.scale(sc * (1 + ph.squash), sc * (1 - ph.squash));
    // landing legs
    if (ph.legs > 0) {
      ctx.strokeStyle = '#3a3f48'; ctx.lineWidth = 0.08; ctx.lineCap = 'round';
      const L = S * 0.32 * ph.legs;
      ctx.beginPath();
      for (const [lx, ly] of [[-0.6, -0.3], [0.6, -0.3], [-0.6, 0.35], [0.6, 0.35]]) { ctx.moveTo(lx * S * 0.5, ly * S * 0.5); ctx.lineTo(lx * S * 0.5 * 1.25, ly * S * 0.5 + L * 0.5); }
      ctx.stroke();
      ctx.fillStyle = '#22252b'; for (const [lx, ly] of [[-0.6, -0.3], [0.6, -0.3], [-0.6, 0.35], [0.6, 0.35]]) { ctx.beginPath(); ctx.ellipse(lx * S * 0.5 * 1.25, ly * S * 0.5 + L * 0.5, 0.1, 0.05, 0, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.drawImage(CharArt.shipSprite(tier, Art.bucket(Render.ppt() * sc, tier === 4 ? 64 : 96)), -S / 2, -S / 2, S, S);
    // cargo hatch / unloading while waiting
    if (c.state === 'wait') {
      const open = 0.5 + 0.5 * Math.min(1, c.t * 2);
      ctx.fillStyle = 'rgba(255,220,150,' + (0.5 * open).toFixed(2) + ')'; ctx.fillRect(-S * 0.12, S * 0.3, S * 0.24, S * 0.12 * open);
      if (c.buying > 0) { const k = 1 - c.buying / 0.4; Art.box(ctx, -0.12, S * 0.45 - k * S * 0.15, 0.24, 0.18, 0.18, Art.tones('#b0824a'), { r: 0.02, lw: 0.02 }); }
    }
    // engine glow
    if (ph.thr > 0.02 && !App.settings.reducedFx) {
      ctx.globalCompositeOperation = 'lighter';
      const fl = 0.7 + 0.3 * Math.sin(tm * 40);
      const col = tier === 4 ? '#ffb070' : '#7fd3ff';
      ctx.globalAlpha = Math.min(1, ph.thr) * fl;
      const eng = tier === 2 ? [[-0.21, 0.55], [0.21, 0.55]] : tier === 3 ? [[-0.2, 1.3], [0, 1.3], [0.2, 1.3]] : [[-0.7, 2.55], [-0.25, 2.55], [0.25, 2.55], [0.7, 2.55]];
      const fs = 0.35 + ph.thr * 0.6;
      for (const [ex, ey] of eng) {
        ctx.drawImage(FxLib.tinted('soft', 0, col), ex - fs * 0.5, ey - fs * 0.2, fs, fs);
        if (alt > 0.01) ctx.drawImage(FxLib.tinted('flame', Math.floor(tm * 20) & 3, col), ex - 0.1, ey, 0.2, 0.4 + ph.thr * 0.6);
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    // retro-thruster dust on the ground during braking
    if (ph.thr > 0.6 && alt < 0.3 && !App.settings.reducedFx && Math.random() < 0.6) {
      const a = Math.random() * Math.PI * 2;
      Render.spawn('dust', c._wx + Math.cos(a) * S * 0.3, c._wy + Math.sin(a) * S * 0.2, Math.cos(a) * 2, Math.sin(a) * 1.2 - 0.2, 0.9, Render.palette.particle, 0.25);
    }
  },

  // ---------------- speech bubble (UI element in the world) ----------------
  bubble(ctx, x, y, c, tm) {
    const w = c.wishes.find(w2 => w2.got < w2.qty) || c.wishes[0];
    if (!w) return;
    if (!c._bubAt) c._bubAt = App.now;
    const age = (App.now - c._bubAt) / 260;
    const pop = age < 1 ? Art.ease.outBack(Math.max(0, age)) : 1;
    const s = Math.max(0.6, 27 / App.cam.zoom);
    ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop);
    const bw = s * 2.3, bh = s * 1.15;
    // body
    ctx.fillStyle = 'rgba(0,0,0,.25)'; Art.rrect(ctx, -bw / 2 + s * 0.06, -bh / 2 + s * 0.08, bw, bh, s * 0.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.97)'; Art.rrect(ctx, -bw / 2, -bh / 2, bw, bh, s * 0.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.12, bh / 2 - 0.01); ctx.lineTo(0, bh / 2 + s * 0.22); ctx.lineTo(s * 0.14, bh / 2 - 0.01); ctx.fill();
    ctx.strokeStyle = 'rgba(40,40,60,.35)'; ctx.lineWidth = s * 0.04; Art.rrect(ctx, -bw / 2, -bh / 2, bw, bh, s * 0.3); ctx.stroke();
    // patience ring around the item
    const ix = -bw / 2 + s * 0.62;
    const pf = U.clamp(1 - c.t / c.patience, 0, 1);
    ctx.lineWidth = s * 0.09; ctx.strokeStyle = '#e4e6ec'; ctx.beginPath(); ctx.arc(ix, 0, s * 0.43, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = pf > 0.5 ? '#3ab54a' : pf > 0.25 ? '#f0a030' : '#e04a3a';
    ctx.beginPath(); ctx.arc(ix, 0, s * 0.43, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pf); ctx.stroke();
    if (w.res >= 0) Draw.item(ctx, w.res, w.ref, ix, 0, s * 0.36);
    else { ctx.fillStyle = DATA.TIERS[w.tier].color; ctx.beginPath(); ctx.arc(ix, 0, s * 0.24, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = s * 0.04; ctx.stroke(); }
    // remaining number (counts down live)
    const fs = s * 0.48;
    ctx.fillStyle = '#20222a'; ctx.font = '800 ' + fs + 'px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(Fmt.num(Math.max(0, w.qty - w.got)), ix + s * 0.55, -s * 0.02);
    // mood glyph
    const mx = bw / 2 - s * 0.32, my = -bh / 2 + s * 0.32, mr = s * 0.2;
    const mood = c.buying > 0 ? 2 : pf < 0.3 ? 0 : 1;
    ctx.fillStyle = mood === 2 ? '#ffd24a' : mood === 0 ? '#ff7a5a' : '#c8ccd6'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = s * 0.035; ctx.beginPath();
    ctx.moveTo(mx - mr * 0.4, my - mr * 0.25); ctx.lineTo(mx - mr * 0.4, my - mr * 0.05); ctx.moveTo(mx + mr * 0.4, my - mr * 0.25); ctx.lineTo(mx + mr * 0.4, my - mr * 0.05);
    if (mood === 2) { ctx.moveTo(mx - mr * 0.5, my + mr * 0.2); ctx.quadraticCurveTo(mx, my + mr * 0.75, mx + mr * 0.5, my + mr * 0.2); }
    else if (mood === 0) { ctx.moveTo(mx - mr * 0.45, my + mr * 0.5); ctx.quadraticCurveTo(mx, my + mr * 0.05, mx + mr * 0.45, my + mr * 0.5); }
    else { ctx.moveTo(mx - mr * 0.4, my + mr * 0.35); ctx.lineTo(mx + mr * 0.4, my + mr * 0.35); }
    ctx.stroke();
    ctx.restore();
  }
};

// ===== src/app/04d_sort.js =====
// =====================================================================
// Depth sorting (y-sort by foot line), x-ray for the player behind tall
// buildings, and customer walking paths around hitboxes (A* on tiles,
// alien paths preferred). Purely visual: customer timing and income are
// untouched; if no path exists the customer simply appears at the stall.
// =====================================================================
const Sorter = {
  // custom buildings: flat base drawn in the ground pass, tall parts sorted separately
  TALL: {
    caravan: (W, H) => [[0, 0, W, 0.34, 0.34], [0, 0.3, 0.32, H - 0.2, H - 0.2], [W - 0.32, 0.3, W, H - 0.2, H - 0.2], [0.4, 0.4, 1.6, 2.6, 2.6], [W - 1.6, 0.4, W - 0.4, 2.6, 2.6], [W / 2 - 0.45, 0, W / 2 + 0.45, 1.2, 1.2]],
    shuttlepad: (W, H) => [[W - 1.1, 0, W - 0.3, 0.7, 0.7], [0.4, 0, 1.1, 0.7, 0.7]],
    port: (W, H) => [[W / 2 - 0.7, 0, W / 2 + 0.7, 1.08, 1.08], [0.4, 0, 2.9, 0.92, 0.92], [W - 2.9, 0, W - 0.4, 0.92, 0.92], [0.3, H - 3.5, 0.8, H - 0.6, H - 0.6], [W - 0.8, H - 3.5, W - 0.3, H - 0.6, H - 0.6]],
    dock: (W, H) => [[0.25, 0, 1.95, 1.35, 1.35], [W - 1.5, 0, W - 0.5, 1.48, 1.48], [0.15, 1.8, 1.55, 7.82, 7.82], [W - 1.6, 1.8, W - 0.2, 7.82, 7.82], [0.6, 4.5, W - 0.6, 7.9, 7.9]]
  },
  isSplit(b) { return !!Sorter.TALL[b.type]; },
  footY(b) {
    if (b.type === 'bazaar') return b.y + b.h - 0.45;
    return b.y + b.h;
  },
  // draws a clipped column of the building sprite (one tall part) for sorting
  drawPart(ctx, g, b, part) {
    const x = b.x - Render.ox, y = b.y - Render.oy;
    const top = (BuildingArt.TOP[b.type] || 1) + 0.5;
    ctx.save();
    ctx.beginPath(); ctx.rect(x + part[0] - 0.05, y - top, part[2] - part[0] + 0.1, part[3] + top + 0.05); ctx.clip();
    Draw.building(ctx, g, b, x, y, true);
    ctx.restore();
  },
  // x-ray state
  xr: 0,
  xrCanvas: null,
  begin(ctx) {
    const c = Render.canvas;
    let o = Sorter.xrCanvas;
    if (!o || o.width !== c.width || o.height !== c.height) { o = Sorter.xrCanvas = document.createElement('canvas'); o.width = c.width; o.height = c.height; }
    const x = o.getContext('2d');
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, o.width, o.height);
    x.setTransform(ctx.getTransform());
    return x;
  },
  // soft hole (40-55 % opacity) around the player in the occluder layer, then composite
  end(ctx, x, px, py) {
    const S = Render.S;
    const m = ctx.getTransform();
    const sx = px * m.a + m.e, sy = (py - 0.55) * m.d + m.f, R = 1.5 * S;
    x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalCompositeOperation = 'destination-out';
    const k = Sorter.xr;
    const gr = x.createRadialGradient(sx, sy, R * 0.25, sx, sy, R);
    gr.addColorStop(0, 'rgba(0,0,0,' + (0.55 * k).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(sx - R, sy - R, R * 2, R * 2);
    x.restore();
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(Sorter.xrCanvas, 0, 0); ctx.restore();
  },
  // does a later-drawn sprite cover the player's body?
  covers(item, px, py) {
    if (item.kind === 'lander') return px > item.x - 1.3 && px < item.x + 1.3 && py < item.key && py > item.y - 2.6;
    if (item.kind !== 'b' && item.kind !== 'part') return false;
    const b = item.b;
    if (item.kind === 'part') { const p = item.part; return px > b.x + p[0] - 0.2 && px < b.x + p[2] + 0.2 && py < b.y + p[4] && py > b.y - 3; }
    const top = (BuildingArt.TOP[b.type] || 1) * 0.9;
    return px > b.x - 0.1 && px < b.x + b.w + 0.1 && py < Sorter.footY(b) && py > b.y - top;
  }
};

const Paths = {
  blocked(g, tx, ty) {
    const id = g.occ.get(U.tileKey(tx, ty));
    if (id === undefined) return false;
    const b = g.buildings.get(id);
    if (!b || Collide.mode(b.type) === 'none') return false;
    const cx = tx + 0.5, cy = ty + 0.5;
    for (const r of Collide.boxes(b)) if (cx > r[0] && cx < r[2] && cy > r[1] && cy < r[3]) return true;
    return false;
  },
  // A* on tiles; alien paths cost less. Returns a list of points or null.
  find(g, sx, sy, ex, ey) {
    const x0 = Math.floor(Math.min(sx, ex)) - 6, y0 = Math.floor(Math.min(sy, ey)) - 6;
    const W = Math.floor(Math.max(sx, ex)) + 7 - x0, H = Math.floor(Math.max(sy, ey)) + 7 - y0;
    if (W * H > 9000) return null;
    const idx = (x, y) => (y - y0) * W + (x - x0);
    const gS = new Float32Array(W * H).fill(1e9), from = new Int32Array(W * H).fill(-1), closed = new Uint8Array(W * H);
    const stx = Math.floor(sx), sty = Math.floor(sy), etx = Math.floor(ex), ety = Math.floor(ey);
    const open = [[stx, sty, 0]];
    gS[idx(stx, sty)] = 0;
    let found = false, iter = 0;
    while (open.length && iter++ < 4000) {
      let bi = 0; for (let i = 1; i < open.length; i++) if (open[i][2] < open[bi][2]) bi = i;
      const [cx, cy] = open[bi]; open.splice(bi, 1);
      const ci = idx(cx, cy);
      if (closed[ci]) continue;
      closed[ci] = 1;
      if (cx === etx && cy === ety) { found = true; break; }
      for (let d = 0; d < 4; d++) {
        const nx = cx + U.DX[d], ny = cy + U.DY[d];
        if (nx < x0 || ny < y0 || nx >= x0 + W || ny >= y0 + H) continue;
        const ni = idx(nx, ny);
        if (closed[ni]) continue;
        if (!(nx === etx && ny === ety) && Paths.blocked(g, nx, ny)) continue;
        const o = Grid.at(g, nx, ny);
        const cost = o && o.type === 'path' ? 0.45 : 1;
        const ng = gS[ci] + cost;
        if (ng < gS[ni]) { gS[ni] = ng; from[ni] = ci; open.push([nx, ny, ng + (Math.abs(nx - etx) + Math.abs(ny - ety)) * 0.45]); }
      }
    }
    if (!found) return null;
    const pts = [];
    for (let i = idx(etx, ety); i >= 0; i = from[i]) pts.push([x0 + (i % W) + 0.5, y0 + Math.floor(i / W) + 0.5]);
    pts.reverse();
    pts[0] = [sx, sy]; pts.push([ex, ey]);
    // smooth corners a little
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) out.push([(pts[i - 1][0] + pts[i][0] * 2 + pts[i + 1][0]) / 4, (pts[i - 1][1] + pts[i][1] * 2 + pts[i + 1][1]) / 4]);
    out.push(pts[pts.length - 1]);
    let L = 0; const cum = [0];
    for (let i = 1; i < out.length; i++) { L += Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]); cum.push(L); }
    return { pts: out, cum, L };
  },
  at(path, k, out) {
    const d = k * path.L, c = path.cum, p = path.pts;
    let i = 1; while (i < c.length - 1 && c[i] < d) i++;
    const t = (d - c[i - 1]) / Math.max(1e-6, c[i] - c[i - 1]);
    out[0] = p[i - 1][0] + (p[i][0] - p[i - 1][0]) * t; out[1] = p[i - 1][1] + (p[i][1] - p[i - 1][1]) * t;
    out[2] = p[i][0] - p[i - 1][0];
    return out;
  }
};

// ===== src/app/05_frame.js =====
// =====================================================================
// Frame: draws one complete frame of the world
// =====================================================================
const LIGHT_TYPES = { lamp: ['#ffe28a', 2.6], beacon: ['#7fe0ff', 3], bazaar: ['#ffd28a', 3.5], caravan: ['#ffb070', 4], shuttlepad: ['#9fd8ff', 6], port: ['#9fd8ff', 8], dock: ['#ffd0a0', 10], terminal: ['#ff9fd0', 8], lab: ['#bfe8ff', 5], refinery1: ['#7ff0e0', 3.5], refinery2: ['#7fd8ff', 3.5], refinery3: ['#9fb0ff', 3.5], extractor: ['#ffb070', 2.2], silo: ['#c8e0ff', 3] };
const BONUS_REL = {
  cooler: t => REFINERY_LEVEL[t] ? '+10 %' : null,
  servo: t => t === 'extractor' || REFINERY_LEVEL[t] ? '+15 %' : null,
  silo: t => REFINERY_LEVEL[t] ? '+15 %' : SELLER_TIER[t] !== undefined ? 'Rampe +20 %' : null,
  charger: t => t === 'belt' ? '+25 %' : null,
  refinery: t => t === 'cooler' ? '+10 %' : t === 'servo' ? '+15 %' : t === 'silo' ? '+15 %' : null,
  extractor: (t, o, spec) => t === 'servo' ? '+15 %' : (t === 'extractor' && spec.res !== undefined && o.res === spec.res ? '+5 %' : null),
  seller: t => t === 'silo' ? 'Rampe +20 %' : null
};

const Frame = {
  seen: 0,
  draw(g, alpha, dt) {
    const ctx = Render.ctx;
    Draw.tm = App.now / 1000;
    Draw.dt = Math.min(0.1, dt || 0.016);
    Art.tick++;
    App.frame++;
    Render.night = Render.dayNight(g);
    Render.updateParticles(dt);
    Render.updateDevils(g, dt);
    Render.setWorldTransform(ctx);
    const vr = Render.visibleRect(3);
    const P = App.debug.prof;
    let pt = P ? performance.now() : 0;
    const mark = k => { if (!P) return; const n = performance.now(); P[k] = (P[k] || 0) * 0.95 + (n - pt) * 0.05; pt = n; };
    Render.drawTerrain(ctx, g, vr); mark('terrain');
    Render.drawDecor(ctx, g, vr);
    // collect visible buildings
    const S = CONFIG.chunkSize;
    const vis = Frame.vis || (Frame.vis = []);
    vis.length = 0;
    const stamp = ++Frame.seen;
    for (let cy = Math.floor(vr.y0 / S) - 1; cy <= Math.floor(vr.y1 / S); cy++) for (let cx = Math.floor(vr.x0 / S) - 1; cx <= Math.floor(vr.x1 / S); cx++) {
      const set = g.bchunk.get(U.chunkKey(cx, cy));
      if (!set) continue;
      for (const id of set) {
        const b = g.buildings.get(id);
        if (!b || b._seen === stamp) continue;
        b._seen = stamp;
        const r = b.type === 'bridge' ? Grid.rect(b) : b;
        if (r.x + r.w < vr.x0 || r.x > vr.x1 || r.y + r.h < vr.y0 || r.y > vr.y1) continue;
        vis.push(b);
      }
    }
    mark('collect');
    // ground stories: trampled paths, foundation zones, prints
    Ground.drawWear(ctx, vr);
    Ground.drawFoundations(ctx, vis);
    if (typeof Intro !== 'undefined' && Intro.groundDecals) Intro.groundDecals(ctx, g);
    Render.drawPrints(ctx); mark('decor');
    const deps = Frame.deps || (Frame.deps = []);
    deps.length = 0;
    World.depositsInRect(g.world, vr.x0 - 2, vr.y0 - 2, vr.x1 + 2, vr.y1 + 2, deps);
    const dppt = Art.bucket(Render.ppt(), 96);
    for (const d of deps) { const r = Ground.depositRing(d, Math.min(64, dppt)); ctx.drawImage(r.canvas, r.ox - Render.ox, r.oy - Render.oy, r.w, r.h); }
    for (const d of deps) { const s = DepositArt.sprite(d, dppt); ctx.drawImage(s.canvas, s.ox - Render.ox, s.oy - Render.oy, s.w, s.h); }
    mark('deposits');
    if (App.debug.chunkBorders) Frame.chunkBorders(ctx, vr);
    // layer 1: flat things (paths, belts, belt items)
    for (const b of vis) if (b.type === 'path') Draw.building(ctx, g, b, b.x - Render.ox, b.y - Render.oy);
    const belts = Frame.belts || (Frame.belts = []);
    belts.length = 0;
    for (const b of vis) if (b.type === 'belt') belts.push(b);
    BeltArt.draw(ctx, g, belts, Draw.tm);
    BeltArt.drawItems(ctx, g, belts, alpha, Draw.tm);
    BeltArt.plops(g, belts);
    mark('belts+items');
    // ground pass: flat transport nodes, bridges and the flat bases of large stations (always under figures)
    const solid = Frame.solid || (Frame.solid = []);
    solid.length = 0;
    const isz = 0.2;
    for (const b of vis) {
      if (b.type === 'path' || b.type === 'belt' || b.type === 'bridge') continue;
      if (Grid.isTransport(b.type)) {
        Draw.building(ctx, g, b, b.x - Render.ox, b.y - Render.oy);
        if (b.buf && b.buf.length) Draw.item(ctx, b.buf[0].res, b.buf[0].ref, b.x + 0.5 - Render.ox, b.y + 0.1 - Render.oy, isz);
        if (b.lanes) for (let d = 0; d < 4; d++) if (b.lanes[d] && b.lanes[d].length) Draw.item(ctx, b.lanes[d][0].res, b.lanes[d][0].ref, b.x + 0.5 - Render.ox, b.y + 0.1 - Render.oy, isz);
        continue;
      }
      solid.push(b);
    }
    for (const b of solid) if (Sorter.isSplit(b)) Draw.building(ctx, g, b, b.x - Render.ox, b.y - Render.oy);
    for (const b of vis) if (b.type === 'bridge') Draw.bridge(ctx, g, b, alpha);
    BuildingArt.castShadows(ctx, g, solid);
    // tips: spinning coins with a glow (on the ground)
    const tm = Draw.tm;
    for (const tp of g.run.tips) {
      const bob = Math.abs(Math.sin(tm * 3 + tp.x)) * 0.18;
      const x = tp.x - Render.ox, y = tp.y - Render.oy;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y + 0.2, 0.18 - bob * 0.3, 0.06, 0, 0, Math.PI * 2); ctx.fill();
      Draw.glowAt(ctx, x, y - bob, 0.55, '#ffd24a', 0.55);
      ctx.drawImage(FxLib.get('coin', Math.floor(tm * 10 + tp.x) & 7), x - 0.22, y - bob - 0.22, 0.44, 0.44);
    }
    // sorted layer: buildings, tall parts of stations, customers, astronaut, lander (by foot line)
    const items = Frame.items || (Frame.items = []);
    items.length = 0;
    const ships = Frame.ships || (Frame.ships = []);
    ships.length = 0;
    for (const b of solid) {
      if (Sorter.isSplit(b)) { for (const part of Sorter.TALL[b.type](b.w, b.h)) items.push({ kind: 'part', key: b.y + part[4], b, part }); }
      else items.push({ kind: 'b', key: Sorter.footY(b), b });
      if (b.customers && b.customers.length) Draw.prepareCustomers(g, b, items, ships);
    }
    const p = g.run.player;
    const ax = (p.px !== undefined ? p.px + (p.x - p.px) * alpha : p.x), ay = (p.py !== undefined ? p.py + (p.y - p.py) * alpha : p.y);
    const playerItem = { kind: 'p', key: ay };
    if (!(typeof Intro !== 'undefined' && Intro.hidePlayer)) items.push(playerItem);
    if (typeof Intro !== 'undefined' && Intro.sortItems) Intro.sortItems(items, g);
    items.sort((a, b) => a.key - b.key);
    let target = ctx, xctx = null, occluded = false;
    const pi = items.indexOf(playerItem);
    if (pi >= 0) for (let i = pi + 1; i < items.length; i++) if (Sorter.covers(items[i], ax, ay)) { occluded = true; break; }
    Sorter.xr = Draw.approach(Sorter.xr, occluded ? 1 : 0, Draw.dt / 0.15);
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.kind === 'b') {
        Draw.building(target, g, it.b, it.b.x - Render.ox, it.b.y - Render.oy);
      } else if (it.kind === 'part') Sorter.drawPart(target, g, it.b, it.part);
      else if (it.kind === 'c') Draw.drawCustomer(target, g, it.b, it.c);
      else if (it.kind === 'p') {
        Draw.astronaut(target, g, ax - Render.ox, ay - Render.oy, Draw.tm);
        if (Sorter.xr > 0.01 && !App.settings.reducedFx) { xctx = Sorter.begin(ctx); target = xctx; }
      } else if (it.draw) it.draw(target);
    }
    if (xctx) Sorter.end(ctx, xctx, ax - Render.ox, ay - Render.oy);
    // ships fly above everything
    for (let i = 0; i < ships.length; i += 2) { const b = ships[i], c = ships[i + 1]; CharArt.ship(ctx, c._wx - Render.ox, c._wy - Render.oy, c, tm, b); }
    mark('buildings');
    Render.drawParticles(ctx);
    if (typeof Intro !== 'undefined') Intro.worldFx(ctx, g);
    Ground.clouds(ctx, Draw.tm);
    mark('chars+particles');
    // overlays
    Frame.overlays(ctx, g, vis, ax, ay);
    // atmosphere and lights
    const night = Render.drawAtmosphere(ctx, g, dt);
    Render.setWorldTransform(ctx);
    TerrainSys.drawEmission(ctx, night, tm);
    for (const d of deps) DepositArt.dynamic(ctx, d, tm, night, App.cam.zoom);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (night > 0.05) Frame.nightLights(ctx, g, solid, night, ax, ay);
    // UI overlays on top of the night grade: badges, level pills, floating texts
    if (App.cam.zoom >= 10) for (const b of solid) if (b.warn) BuildingArt.badge(ctx, b, tm);
    for (const b of solid) { Draw.levelTag(ctx, b); if (b.type === 'terminal' && App.cam.zoom >= 12) Frame.contractBadge(ctx, g, b); }
    Draw.flushBubbles(ctx);
    Render.drawFloating(ctx, dt);
    document.body.classList.toggle('lowq', App.quality === 'low');
    Frame.edgeMarkers(ctx, g);
    if (typeof Intro !== 'undefined') Intro.overlay(ctx, g);
    mark('overlays+atmo');
  },

  nightLights(ctx, g, solid, night, ax, ay) {
    ctx.globalCompositeOperation = 'lighter';
    const tm = Draw.tm;
    for (const b of solid) {
      const L = BuildingArt.lights(b);
      if (!L.length) continue;
      const bx = b.x - Render.ox, by = b.y - Render.oy;
      for (const [lx, ly, r, col] of L) {
        const fl = b.type === 'lamp' || b.type === 'bazaar' ? 0.92 + 0.08 * Math.sin(tm * 9 + b.id) : 1;
        ctx.globalAlpha = night * 0.62 * fl;
        ctx.drawImage(FxLib.tinted('soft', 0, col), bx + lx - r / 2, by + ly - r / 2, r, r);
      }
      // light pool on the ground under lamps
      if (b.type === 'lamp') { ctx.globalAlpha = night * 0.35; ctx.drawImage(FxLib.tinted('soft', 0, b.level >= 2 ? '#d8f0ff' : '#ffe28a'), bx - 1.3, by - 0.6, 3.6, 2.6); }
    }
    // helmet lamp of the astronaut
    ctx.globalAlpha = night * 0.5;
    ctx.drawImage(FxLib.tinted('soft', 0, '#ffe8c0'), ax - Render.ox - 2.5, ay - Render.oy - 3, 5, 5);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },

  contractBadge(ctx, g, b) {
    const n = g.run.contracts.length;
    const x = b.x + b.w / 2 - Render.ox, y = b.y - Render.oy - 0.6;
    const fs = Math.max(0.3, 12 / App.cam.zoom);
    ctx.font = '800 ' + fs + 'px system-ui';
    const txt = String(n), tw = ctx.measureText(txt).width + fs * 1.9;
    ctx.fillStyle = 'rgba(42,26,52,.88)'; Art.rrect(ctx, x - tw / 2, y - fs * 0.75, tw, fs * 1.5, fs * 0.75); ctx.fill();
    ctx.strokeStyle = '#ff9fd0'; ctx.lineWidth = fs * 0.08; ctx.stroke();
    // document glyph
    const gx = x - tw / 2 + fs * 0.55, gy = y;
    ctx.fillStyle = '#ffd0ea'; ctx.fillRect(gx - fs * 0.25, gy - fs * 0.35, fs * 0.5, fs * 0.7);
    ctx.fillStyle = '#7a4a8a'; for (let i = 0; i < 3; i++) ctx.fillRect(gx - fs * 0.16, gy - fs * 0.2 + i * fs * 0.17, fs * 0.32, fs * 0.06);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, gx + fs * 0.45, y + fs * 0.03);
  },

  chunkBorders(ctx, vr) {
    const S = CONFIG.chunkSize;
    ctx.strokeStyle = 'rgba(0,255,255,.5)'; ctx.lineWidth = 2 / Render.S;
    ctx.beginPath();
    for (let x = Math.floor(vr.x0 / S) * S; x <= vr.x1; x += S) { ctx.moveTo(x - Render.ox, vr.y0 - Render.oy); ctx.lineTo(x - Render.ox, vr.y1 - Render.oy); }
    for (let y = Math.floor(vr.y0 / S) * S; y <= vr.y1; y += S) { ctx.moveTo(vr.x0 - Render.ox, y - Render.oy); ctx.lineTo(vr.x1 - Render.ox, y - Render.oy); }
    ctx.stroke();
  },

  footprint(ctx, x, y, w, hh, ok, alpha = 0.35) {
    ctx.fillStyle = ok ? 'rgba(99,223,116,' + alpha + ')' : 'rgba(255,90,90,' + alpha + ')';
    ctx.fillRect(x - Render.ox, y - Render.oy, w, hh);
    ctx.strokeStyle = ok ? '#63df74' : '#ff5a5a'; ctx.lineWidth = 2 / Render.S;
    ctx.strokeRect(x - Render.ox, y - Render.oy, w, hh);
  },

  overlays(ctx, g, vis, ax, ay) {
    const P = g.run.player;
    const lw = 1 / Render.S;
    // build radius
    if (App.mode === 'build') {
      ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2 * lw; ctx.setLineDash([8 * lw, 8 * lw]);
      ctx.beginPath(); ctx.arc(ax - Render.ox, ay - Render.oy, g.mods.buildRadius, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      if (App.cam.zoom >= 18) {
        // faint grid around the cursor
        const hv = App.hover;
        if (hv) {
          ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = lw;
          ctx.beginPath();
          for (let i = -8; i <= 8; i++) {
            ctx.moveTo(hv.x + i - Render.ox, hv.y - 8 - Render.oy); ctx.lineTo(hv.x + i - Render.ox, hv.y + 9 - Render.oy);
            ctx.moveTo(hv.x - 8 - Render.ox, hv.y + i - Render.oy); ctx.lineTo(hv.x + 9 - Render.ox, hv.y + i - Render.oy);
          }
          ctx.stroke();
        }
      }
    }
    // selected building
    const sel = App.selected;
    if (sel && g.buildings.has(sel.id)) {
      const r = Grid.rect(sel);
      ctx.strokeStyle = Render.palette.accent; ctx.lineWidth = 3 * lw;
      ctx.strokeRect(r.x - Render.ox - 0.05, r.y - Render.oy - 0.05, r.w + 0.1, r.h + 0.1);
      if (sel.type === 'bazaar') {
        ctx.strokeStyle = 'rgba(185,162,122,.6)'; ctx.setLineDash([6 * lw, 6 * lw]);
        ctx.beginPath(); ctx.arc(sel.x + sel.w / 2 - Render.ox, sel.y + sel.h / 2 - Render.oy, CONFIG.pathRadius, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
      if (sel.type === 'extractor' && sel.dep !== undefined) {
        const d = World.depositById(g.world, sel.dep);
        if (d) for (const t of d.tiles) { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2 * lw; ctx.strokeRect(t[0] - Render.ox + 0.06, t[1] - Render.oy + 0.06, 0.88, 0.88); }
      }
    }
    // mass selection
    if (App.selection.length) {
      ctx.strokeStyle = '#7fd3ff'; ctx.lineWidth = 2 * lw;
      for (const b of App.selection) { const r = Grid.rect(b); ctx.strokeRect(r.x - Render.ox, r.y - Render.oy, r.w, r.h); }
    }
    if (App.selRect) {
      const s = App.selRect;
      ctx.fillStyle = 'rgba(127,211,255,.12)'; ctx.strokeStyle = '#7fd3ff'; ctx.lineWidth = 2 * lw;
      const x0 = Math.min(s.x0, s.x1), y0 = Math.min(s.y0, s.y1), x1 = Math.max(s.x0, s.x1) + 1, y1 = Math.max(s.y0, s.y1) + 1;
      ctx.fillRect(x0 - Render.ox, y0 - Render.oy, x1 - x0, y1 - y0); ctx.strokeRect(x0 - Render.ox, y0 - Render.oy, x1 - x0, y1 - y0);
    }
    // ghost
    const gh = App.ghost;
    if (gh && App.mode === 'build') {
      if (gh.list) {
        for (const it of gh.list) {
          const s = it.spec;
          if (s.type === 'bridge') { const r = { x: Math.min(s.x, s.x + U.DX[s.rot] * (s.len - 1)), y: Math.min(s.y, s.y + U.DY[s.rot] * (s.len - 1)) }; Frame.footprint(ctx, r.x, r.y, Math.abs(U.DX[s.rot]) * (s.len - 1) + 1, Math.abs(U.DY[s.rot]) * (s.len - 1) + 1, it.ok); continue; }
          const sz = Grid.size(s.type, s.rot, s.len);
          Frame.footprint(ctx, s.x, s.y, sz.w, sz.h, it.ok);
          if (s.type === 'belt' || DATA.BUILDINGS[s.type].w === 1) Draw.arrow(ctx, s.x + 0.5 - Render.ox, s.y + 0.5 - Render.oy, s.rot, 0.25, 'rgba(255,255,255,.9)');
        }
      } else if (gh.spec) {
        const s = gh.spec;
        const sz = Grid.size(s.type, s.rot, s.len);
        ctx.globalAlpha = 0.55 + 0.15 * Math.sin(Draw.tm * 5);
        const fake = Grid.make({ nextId: 0 }, Object.assign({}, s, { id: -1, res: gh.dep ? gh.dep.res : undefined, tier: gh.dep ? gh.dep.tier : 0 }));
        fake.w = sz.w; fake.h = sz.h; fake._sv = -5; fake.shape = 0;
        try { if (s.type !== 'bridge') Draw.building(ctx, Object.assign({}, g, { topoVersion: -5 }), fake, s.x - Render.ox, s.y - Render.oy); } catch (e) { /* preview only */ }
        ctx.globalAlpha = 1;
        Frame.footprint(ctx, s.x, s.y, sz.w, sz.h, gh.ok, 0.18 + 0.08 * Math.sin(Draw.tm * 5));
        if (s.type !== 'belt' && (DATA.BUILDINGS[s.type].w > 1 || DATA.BUILDINGS[s.type].h > 1) && !Grid.isDeco(s.type) && s.type !== 'extractor') {
          const pb = { x: s.x, y: s.y, w: sz.w, h: sz.h, rot: s.rot };
          const fp = Grid.frontPort(pb);
          Draw.arrow(ctx, fp[0] + 0.5 - Render.ox, fp[1] + 0.5 - Render.oy, s.rot, 0.3, '#ffffff');
        } else if (DATA.BUILDINGS[s.type].w === 1 && !Grid.isDeco(s.type)) Draw.arrow(ctx, s.x + 0.5 - Render.ox, s.y + 0.5 - Render.oy, s.rot, 0.25, '#ffffff');
        if (gh.dep) for (const t of gh.dep.tiles) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 * lw; ctx.strokeRect(t[0] - Render.ox + 0.08, t[1] - Render.oy + 0.08, 0.84, 0.84); }
        // neighbourhood bonuses
        Frame.bonusPreview(ctx, g, s, sz, gh);
      }
    }
    // scanner: thick ring wave, trailing thin ring and a radar sweep
    const ping = g.run.scanPing;
    if (ping) {
      const k = U.clamp(ping.t / 1.6, 0, 1);
      const cx = ping.x - Render.ox, cy = ping.y - Render.oy;
      const acc = Render.palette.accent;
      const r = ping.r * Art.ease.outCubic(k), r2 = ping.r * Art.ease.outCubic(U.clamp((ping.t - 0.18) / 1.6, 0, 1));
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.85;
      ctx.drawImage(FxLib.tinted('ringThick', 0, acc), cx - r, cy - r, r * 2, r * 2);
      ctx.globalAlpha = (1 - k) * 0.6;
      if (r2 > 0.1) ctx.drawImage(FxLib.tinted('ring', 0, '#ffffff'), cx - r2, cy - r2, r2 * 2, r2 * 2);
      const sw = Math.min(ping.r, 3 + ping.t * ping.r);
      ctx.globalAlpha = Math.max(0, 1 - ping.t / 2.5) * 0.55;
      ctx.translate(cx, cy); ctx.rotate(ping.t * 5);
      ctx.drawImage(FxLib.tinted('radar', 0, acc), -sw, -sw, sw * 2, sw * 2);
      ctx.restore();
    }
    // freshly scanned deposits pop up in the world (staggered, with overshoot)
    for (const m of Render.edgeMarks) {
      if (!m.scan) continue;
      const age = App.now - m.at;
      if (age < 0 || age > 4500) continue;
      const sc = age < 260 ? Art.ease.outBack(age / 260) : 1;
      const fade = age > 3800 ? 1 - (age - 3800) / 700 : 1;
      const x = m.x - Render.ox, y = m.y - Render.oy;
      const s = Math.max(0.5, 16 / App.cam.zoom) * sc;
      ctx.save(); ctx.globalAlpha = fade;
      ctx.strokeStyle = m.color; ctx.lineWidth = s * 0.12;
      ctx.beginPath(); ctx.arc(x, y, s * (1 + 0.15 * Math.sin(Draw.tm * 6)), 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = m.color; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = s * 0.08;
      ctx.beginPath(); ctx.moveTo(x, y - s * 0.5); ctx.lineTo(x - s * 0.35, y - s * 1.2); ctx.arc(x, y - s * 1.3, s * 0.38, Math.PI * 0.8, Math.PI * 0.2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // soft landing zones: pulsing hazard frame while a ship touches down
    for (const z of Collide.zones) {
      const a = 0.45 + 0.35 * Math.sin(Draw.tm * 8);
      ctx.strokeStyle = 'rgba(255,194,77,' + a.toFixed(2) + ')'; ctx.lineWidth = 0.12; ctx.setLineDash([0.4, 0.25]); ctx.lineDashOffset = -Draw.tm * 1.5;
      ctx.strokeRect(z[0] - Render.ox, z[1] - Render.oy, z[2] - z[0], z[3] - z[1]); ctx.setLineDash([]);
    }
    // debug: hitboxes, foot lines and sort keys
    if (App.debug.hitboxes) {
      ctx.lineWidth = 2 / Render.S; ctx.font = (11 / Render.S) + 'px system-ui'; ctx.textAlign = 'left';
      for (const b of vis) {
