// ===== src/app/09_info.js =====
// =====================================================================
// InfoPanel: details and actions for the selected building
// =====================================================================
const IconCache = new Map();
const itemImg = (res, ref, size = 20) => {
  const key = res * 4 + ref + '|' + size;
  let url = IconCache.get(key);
  if (!url) { url = Sprites.itemCanvas(res, ref, size).toDataURL(); IconCache.set(key, url); }
  return '<img src="' + url + '" width="' + size + '" height="' + size + '" alt="">';
};
const STATUS_TEXT = { blocked: ['Blockiert: Ausgang voll', 'bad'], nocon: ['Kein Ausgang angeschlossen', 'bad'], full: ['Lager voll', 'bad'], nearfull: ['Lager fast voll', 'warn'], wrong: ['Falsche Veredelungsstufe am Eingang', 'warn'], empty: ['Kunden warten, Regal leer', 'warn'] };
const DIR_NAMES = ['Osten', 'Süden', 'Westen', 'Norden'];

const InfoPanel = {
  b: null, lastRefresh: 0,

  open(b) {
    InfoPanel.b = b;
    const el = $('#info-panel');
    el.classList.remove('hidden');
    InfoPanel.build();
  },
  close() {
    InfoPanel.b = null;
    $('#info-panel').classList.add('hidden');
  },
  name(b) { return b.type === 'belt' ? DATA.BELT_GRADES[b.grade].name : DATA.BUILDINGS[b.type].name; },

  build() {
    const b = InfoPanel.b, g = App.g;
    if (!b || !g.buildings.has(b.id)) { UI.select(null); return; }
    const el = $('#info-panel');
    el.innerHTML = '';
    const head = h('div', { class: 'ip-head' });
    head.append(Draw.thumb(b.type, 48, { grade: b.grade, res: b.res }));
    head.append(h('div', null, h('div', { class: 'ip-title', text: InfoPanel.name(b) }), h('div', { class: 'ip-sub', id: 'ip-sub' })));
    head.append(h('button', { class: 'icon-btn small ip-close', 'aria-label': 'Schließen', onclick: () => UI.select(null) }, '✕'));
    el.append(head);
    el.append(h('div', { id: 'ip-dyn' }));
    el.append(InfoPanel.controls(b));
    el.append(InfoPanel.actions(b));
    InfoPanel.refresh(true);
  },

  refresh(force) {
    const b = InfoPanel.b, g = App.g;
    if (!b) return;
    if (!g.buildings.has(b.id)) { UI.select(null); return; }
    const now = performance.now();
    if (!force && now - InfoPanel.lastRefresh < 400) return;
    InfoPanel.lastRefresh = now;
    const dyn = $('#ip-dyn');
    if (!dyn) return;
    const lvl = b.type === 'belt' ? 'Güteklasse ' + (b.grade + 1) + '/4' : 'Stufe ' + ROMAN[b.level] + ' / ' + ROMAN[Grid.maxLevel(g, b)];
    const st = b.warn ? STATUS_TEXT[b.warn] : null;
    $('#ip-sub').innerHTML = lvl + ' · ' + (st ? '<span class="tag ' + st[1] + '">' + st[0] + '</span>' : '<span class="tag good">OK</span>');
    dyn.innerHTML = InfoPanel.details(b, g);
    const sp = dyn.querySelector('canvas.spark');
    if (sp) InfoPanel.sparkline(sp, +sp.dataset.res);
    const key = b.level + '|' + (b.grade || 0) + '|' + (Grid.upgradeCost(g, b) <= g.run.money) + '|' + Grid.upgradeBlock(g, b) + '|' + Math.floor(b.paid);
    if (force || key !== InfoPanel.actKey) { InfoPanel.actKey = key; InfoPanel.updateActions(b); }
  },

  row: (k, v) => '<div class="ip-row"><span>' + k + '</span><b>' + v + '</b></div>',
  bonusList(b) {
    if (!b.bonusSrc || !b.bonusSrc.length) return '<div class="muted" style="font-size:13px">Keine Nachbarschaftsboni. Tipp: passende Gebäude angrenzend platzieren.</div>';
    return '<ul class="bonus-list">' + b.bonusSrc.map(s => '<li><span>' + esc(s.name) + '</span><b>+' + Math.round(s.v * 100) + ' %</b></li>').join('') + '</ul>';
  },
  stockList(map, limit = 12) {
    const arr = [...map.entries()].filter(e => e[1] > 0).sort((a, c) => c[1] - a[1]).slice(0, limit);
    if (!arr.length) return '<div class="muted" style="font-size:13px">Leer</div>';
    return '<div class="stock-list">' + arr.map(([k, c]) => '<div class="stock-item">' + itemImg(k >> 2, k & 3) + '<span>' + esc(DATA.itemName(k >> 2, k & 3)) + '</span><b>' + Fmt.int(c) + '</b></div>').join('') + '</div>';
  },
  trend(g, res) {
    const t = Economy.demandTrend(g, res);
    const col = t.cls === 'up' ? 'var(--good)' : t.cls === 'down' ? 'var(--bad)' : 'var(--text)';
    return '<b style="color:' + col + '">' + t.arrow + ' ×' + Fmt.dec(t.now, 2) + '</b>';
  },

  details(b, g) {
    const R = InfoPanel.row;
    let s = '';
    switch (b.type) {
      case 'extractor': {
        const res = DATA.RESOURCES[b.res];
        const d = World.depositById(g.world, b.dep);
        const value = b.rate * res.value * g.mods.sales;
        s += '<div class="ip-section">' + R('Rohstoff', itemImg(b.res, 0) + ' <span style="color:' + DATA.TIERS[res.tier].color + '">' + esc(res.name) + '</span>');
        s += R('Seltenheit', DATA.TIERS[res.tier].name) + R('Abbau', Fmt.num(b.rate) + ' /s') + R('Rohwert', '≈ ' + Fmt.num(value) + ' ' + CURRENCY_SHORT + '/s');
        if (d) s += R('Vorkommen', ['klein', 'mittel', 'groß'][d.sizeClass] + ' · ' + (g.depUse.get(d.id) || 0) + '/' + d.slots + ' Plätze');
        s += R('Puffer', b.buf.length + '/' + CONFIG.maxItemsPerBuffer) + R('Abgebaut', Fmt.int(b.made)) + R('Marktpreis', InfoPanel.trend(g, b.res)) + '</div>';
        s += '<div class="ip-section"><b>Bonus-Quellen</b>' + InfoPanel.bonusList(b) + '</div>';
        s += '<div class="ip-section"><canvas class="spark" data-res="' + b.res + '"></canvas><div class="muted" style="font-size:12px">Preisverlauf der letzten 10 Minuten</div></div>';
        break;
      }
      case 'belt': {
        const tp = CONFIG.belt.throughput[b.grade] * g.mods.beltSpeed * b.boost;
        s += '<div class="ip-section">' + R('Durchsatz', Fmt.num(tp) + ' Items/s') + R('Items auf dem Feld', b.items.length) + R('Richtung', DIR_NAMES[b.rot]);
        if (b.boost > 1) s += R('Ladestation', '+' + Math.round((b.boost - 1) * 100) + ' %');
        s += R('Bänder gesamt', Fmt.int(g.run.counts.belt || 0)) + '</div>';
        break;
      }
      case 'splitter': case 'merger': case 'crossing': case 'osplitter': case 'fsplitter':
        s += '<div class="ip-section"><div class="muted" style="font-size:13px">' + esc(DATA.BUILDINGS[b.type].desc) + '</div>' + R('Richtung', DIR_NAMES[b.rot]) + '</div>';
        break;
      case 'bridge':
        s += '<div class="ip-section">' + R('Länge', (b.len - 2) + ' übersprungene Felder') + R('Items unterwegs', b.queue.length) + '</div>';
        break;
      case 'silo': {
        const cap = Economy.siloCap(g, b);
        s += '<div class="ip-section">' + R('Füllstand', Fmt.int(b.total) + ' / ' + Fmt.int(cap)) + '<div class="progress"><i style="width:' + U.clamp(b.total / cap * 100, 0, 100) + '%"></i></div></div>';
        s += '<div class="ip-section"><b>Inhalt</b>' + InfoPanel.stockList(b.store) + '</div>';
        break;
      }
      case 'lab': {
        const a = g.run.research.active;
        s += '<div class="ip-section">' + R('Forschungstempo', '×' + Fmt.dec(Math.pow(1.3, b.level - 1), 2)) + R('Labore gesamt', g.lists.lab.length);
        if (a) { const r = DATA.RESEARCH_BY_ID[a.id]; s += R('Aktiv', esc(r.name)) + '<div class="progress"><i style="width:' + (a.prog * 100).toFixed(1) + '%"></i></div>'; }
        else s += '<div class="muted" style="font-size:13px">Keine Forschung aktiv.</div>';
        s += R('Erforscht', g.run.research.done.size + ' / ' + DATA.RESEARCH.length) + '</div>';
        break;
      }
      case 'cooler': case 'servo': case 'charger': {
        const n = [...Grid.neighbors(g, b)].filter(o => b.type === 'cooler' ? REFINERY_LEVEL[o.type] : b.type === 'servo' ? (o.type === 'extractor' || REFINERY_LEVEL[o.type]) : o.type === 'belt');
        s += '<div class="ip-section">' + R('Wirkt auf', n.length + ' angrenzende Objekte') + R('Bonus', '+' + Math.round((b.type === 'cooler' ? CONFIG.coolerBonus : b.type === 'servo' ? CONFIG.servoBonus : CONFIG.chargerBonus) * (1 + 0.2 * (b.level - 1)) * 100) + ' %') + '</div>';
        break;
      }
      default:
        if (REFINERY_LEVEL[b.type]) {
          const lv = REFINERY_LEVEL[b.type];
          s += '<div class="ip-section">' + R('Nimmt an', DATA.REFINE_NAMES[lv - 1] + 'e Items') + R('Erzeugt', DATA.REFINE_NAMES[lv] + ' (×' + CONFIG.refineFactor[lv] + ' Wert)') + R('Tempo', Fmt.num(b.rate) + ' Items/s') + R('Eingang', b.inBuf.length + '/' + CONFIG.refineBuffer) + R('Veredelt', Fmt.int(b.made));
          if (b.cur) s += R('In Arbeit', itemImg(b.cur.res, b.cur.ref) + ' ' + esc(DATA.RESOURCES[b.cur.res].name));
          s += '</div><div class="ip-section"><b>Bonus-Quellen</b>' + InfoPanel.bonusList(b) + '</div>';
        } else if (SELLER_TIER[b.type] !== undefined) {
          s += InfoPanel.sellerDetails(b, g);
        } else {
          s += '<div class="ip-section muted" style="font-size:13px">' + esc(DATA.BUILDINGS[b.type].desc) + '</div>';
        }
    }
    return s;
  },

  sellerDetails(b, g) {
    const R = InfoPanel.row;
    const t = SELLER_TIER[b.type];
    let s = '<div class="ip-section">';
    if (t < 5) {
      const iv = CONFIG.customers[t].interval;
      const am = Economy.arrivalMult(g, b);
      s += R('Kunden', esc(DATA.CUSTOMERS[t].plural)) + R('Ankunft', 'alle ' + Fmt.dec(iv[0] / am, 0) + '–' + Fmt.dec(iv[1] / am, 0) + ' s') + R('Erlösfaktor', '×' + Fmt.dec(CONFIG.customers[t].factor, 1));
    } else s += R('Erlösfaktor', '×20 (stabile Preise)');
    s += R('Abfertigung', Fmt.num(Economy.serviceRate(g, b)) + ' Items/s') + R('Regal', Fmt.int(b.shelfTotal) + ' / ' + Fmt.int(Economy.shelfCap(g, b))) + R('Verkauft', Fmt.int(b.sold)) + '</div>';
    if (t < 5) {
      s += '<div class="ip-section"><b>Kunden vor Ort</b><div class="cust-list">';
      const active = b.customers.filter(c => c.state !== 'out');
      if (!active.length) s += '<div class="muted" style="font-size:13px">Gerade niemand da. Nächster Kunde in ca. ' + Math.max(0, Math.ceil(b.timer / Economy.arrivalMult(g, b))) + ' s.</div>';
      for (const c of active) {
        s += '<div class="cust"><div>' + esc(DATA.CUSTOMERS[c.tier].name) + (c.state === 'in' ? ' (kommt an)' : '') + '</div>';
        for (const w of c.wishes) {
          const label = w.res >= 0 ? DATA.itemName(w.res, w.ref) : (w.explore ? 'Ich suche etwas ' + DATA.TIERS[w.tier].name + 'es…' : 'Beliebig ' + DATA.TIERS[w.tier].name + (w.ref ? ' (' + DATA.REFINE_NAMES[w.ref] + ')' : ''));
          s += '<div class="wish">' + (w.res >= 0 ? itemImg(w.res, w.ref, 18) : '<span class="tag" style="color:' + DATA.TIERS[w.tier].color + '">?</span>') + '<span>' + esc(label) + '</span><b style="margin-left:auto">' + Fmt.int(w.got) + '/' + Fmt.int(w.qty) + '</b></div>';
        }
        if (c.state === 'wait') s += '<div class="pbar"><i style="width:' + (U.clamp(1 - c.t / c.patience, 0, 1) * 100).toFixed(0) + '%"></i></div>';
        s += '</div>';
      }
      s += '</div></div>';
    } else {
      s += '<div class="ip-section"><b>Planeten-Verträge</b><div class="cust-list">';
      if (!g.run.contracts.length) s += '<div class="muted" style="font-size:13px">Neue Aufträge folgen in ca. ' + Fmt.time(g.run.contractTimer) + '.</div>';
      for (const c of g.run.contracts) {
        s += '<div class="cust"><div><b>' + esc(c.planet) + '</b> · noch ' + Fmt.time(c.end - g.run.time) + '</div>';
        for (const r of c.req) s += '<div class="wish">' + itemImg(r.res, r.ref, 18) + '<span>' + esc(DATA.itemName(r.res, r.ref)) + '</span><b style="margin-left:auto">' + Fmt.int(r.got) + '/' + Fmt.int(r.qty) + '</b></div>';
        const tot = c.req.reduce((a, r) => a + r.qty, 0), got = c.req.reduce((a, r) => a + r.got, 0);
        s += '<div class="pbar"><i style="width:' + (got / tot * 100).toFixed(1) + '%"></i></div></div>';
      }
      s += '</div></div>';
    }
    s += '<div class="ip-section"><b>Regal</b>' + InfoPanel.stockList(b.shelf, 8) + '</div>';
    if (b.shelf.size) {
      s += '<div class="ip-section"><b>Nachfrage</b>';
      for (const k of [...b.shelf.keys()].slice(0, 4)) s += R(itemImg(k >> 2, 0, 16) + ' ' + esc(DATA.RESOURCES[k >> 2].name), InfoPanel.trend(g, k >> 2));
      s += '<canvas class="spark" data-res="' + ([...b.shelf.keys()][0] >> 2) + '"></canvas></div>';
    }
    s += '<div class="ip-section"><b>Bonus-Quellen</b>' + InfoPanel.bonusList(b) + '</div>';
    return s;
  },

  sparkline(cv, res) {
    const g = App.g;
    const d = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth || 300, hh = 48;
    cv.width = w * d; cv.height = hh * d;
    const x = cv.getContext('2d');
    x.scale(d, d);
    const hist = Economy.history(g, res);
    const now = Economy.demandTrend(g, res).now;
    hist.push(now);
    x.strokeStyle = 'rgba(255,255,255,.15)'; x.lineWidth = 1;
    const yOf = v => hh - 4 - (U.clamp(v, 0, 2.6) / 2.6) * (hh - 8);
    x.beginPath(); x.moveTo(0, yOf(1)); x.lineTo(w, yOf(1)); x.stroke();
    if (hist.length < 2) return;
    x.strokeStyle = now > 1.15 ? '#63df74' : now < 0.85 ? '#ff6464' : '#ffc24d'; x.lineWidth = 2;
    x.beginPath();
    hist.forEach((v, i) => { const px = i / (hist.length - 1) * (w - 2) + 1; i ? x.lineTo(px, yOf(v)) : x.moveTo(px, yOf(v)); });
    x.stroke();
  },

  // Static controls (filters, outputs)
  controls(b) {
    const g = App.g;
    const wrap = h('div');
    if (b.type === 'extractor') {
      const sec = h('div', { class: 'ip-section' }, h('b', { text: 'Ausgänge' }));
      const seg = h('div', { class: 'seg' });
      ['Osten', 'Süden', 'Westen', 'Norden'].forEach((n, d) => {
        const btn = h('button', { class: (b.outMask & (1 << d)) ? 'on' : '' }, n);
        btn.addEventListener('click', () => { b.outMask ^= (1 << d); if (!b.outMask) b.outMask = 1 << d; g.topologyDirty = true; btn.classList.toggle('on', !!(b.outMask & (1 << d))); Audio2.play('click'); });
        seg.append(btn);
      });
      sec.append(seg);
      wrap.append(sec);
    }
    if (b.type === 'fsplitter') wrap.append(InfoPanel.filterControl(b, 'filter', 'Filter (geradeaus)'));
    if (b.type === 'silo') {
      const sec = h('div', { class: 'ip-section' });
      const sw = h('div', { class: 'switch' + (b.outEnabled ? ' on' : ''), role: 'switch', tabindex: 0 });
      sw.addEventListener('click', () => { b.outEnabled = !b.outEnabled; sw.classList.toggle('on', b.outEnabled); g.topologyDirty = true; Audio2.play('click'); });
      sec.append(h('div', { class: 'set-row' }, h('label', null, 'Ausgang aktiv', h('small', { text: 'Gibt gelagerte Items vorne (Pfeil) aufs Band.' })), sw));
      wrap.append(sec);
      wrap.append(InfoPanel.filterControl(b, 'outFilter', 'Ausgangsfilter'));
    }
    return wrap;
  },
  filterControl(b, prop, label) {
    const g = App.g;
    const sec = h('div', { class: 'ip-section' }, h('b', { text: label }));
    const sel = h('select', { class: 'sel' });
    sel.append(h('option', { value: '' }, 'Alles'));
    for (let t = 0; t < 8; t++) sel.append(h('option', { value: 'tier:' + t }, 'Stufe: ' + DATA.TIERS[t].name));
    for (let r = 0; r < 4; r++) sel.append(h('option', { value: 'ref:' + r }, 'Veredelung: ' + DATA.REFINE_NAMES[r]));
    const known = [...new Set([...g.run.produced].map(k => k >> 2))].sort((a, c) => a - c);
    for (const r of known) sel.append(h('option', { value: 'res:' + r }, 'Rohstoff: ' + DATA.RESOURCES[r].name));
    const f = b[prop];
    sel.value = f ? f.kind + ':' + (f.kind === 'res' ? f.res : f.kind === 'tier' ? f.tier : f.ref) : '';
    sel.addEventListener('change', () => {
      const v = sel.value;
      if (!v) b[prop] = null;
      else { const [kind, n] = v.split(':'); b[prop] = kind === 'res' ? { kind, res: +n } : kind === 'tier' ? { kind, tier: +n } : { kind, ref: +n }; }
      Audio2.play('click');
    });
    sec.append(sel);
    return sec;
  },

  actions(b) {
    const wrap = h('div', { class: 'ip-section ip-actions', id: 'ip-actions' });
    return wrap;
  },
  upgradeEffect(b, g) {
    if (b.type === 'extractor') return Fmt.num(b.rate) + ' → ' + Fmt.num(b.rate * CONFIG.extractorLevelSpeed) + ' /s';
    if (b.type === 'belt') return CONFIG.belt.throughput[b.grade] + ' → ' + CONFIG.belt.throughput[Math.min(3, b.grade + 1)] + ' Items/s';
    if (b.type === 'silo') return Fmt.int(Economy.siloCap(g, b)) + ' → ' + Fmt.int(Economy.siloCap(g, b) * CONFIG.siloLevelCapacity) + ' Plätze';
    if (REFINERY_LEVEL[b.type]) return Fmt.num(b.rate) + ' → ' + Fmt.num(b.rate * 1.25) + ' /s';
    if (SELLER_TIER[b.type] !== undefined) return 'Regal ×1,5 · Abfertigung ×1,3 · Kunden +' + Math.round((CONFIG.sellerLevelArrival - 1) * 100) + ' %';
    if (b.type === 'lab') return 'Forschung ×1,3';
    if (BOOSTER[b.type]) return 'Bonus +20 %';
    return 'Neue Optik';
  },
  updateActions(b) {
    const g = App.g;
    const wrap = $('#ip-actions');
    if (!wrap) return;
    wrap.innerHTML = '';
    const block = Grid.upgradeBlock(g, b);
    const cost = Grid.upgradeCost(g, b);
    const up = h('button', { class: 'btn accent' }, block ? block : 'Upgrade · ' + Fmt.money(cost));
    if (block || cost > g.run.money) up.disabled = true;
    up.title = block || InfoPanel.upgradeEffect(b, g);
    up.addEventListener('click', () => {
      const c = Grid.upgradeCost(g, b);
      if (Grid.upgrade(g, b)) {
        Actions.record(g, { kind: 'upgrade', id: b.id, cost: c });
        Audio2.play('upgrade');
        Render.float('Stufe ' + (b.type === 'belt' ? b.grade + 1 : ROMAN[b.level]), b.x + b.w / 2, b.y, '#ffd24a');
        if (!App.settings.reducedFx) for (let i = 0; i < 16; i++) Render.spawn('spark', b.x + Math.random() * b.w, b.y + Math.random() * b.h, (Math.random() - 0.5) * 2, -Math.random() * 2, 0.8, '#ffd24a', 0.07);
        if (b.type === 'extractor' && b.level >= 10) Progression.unlock(g, 'maxLevel');
        InfoPanel.refresh(true);
      } else { Audio2.play('error'); UI.toast(Grid.upgradeBlock(g, b) || 'Zu teuer', 'bad'); }
    });
    wrap.append(up);
    if (!block) wrap.append(h('div', { class: 'muted', style: { width: '100%', fontSize: '12px' }, text: 'Upgrade: ' + InfoPanel.upgradeEffect(b, g) }));
    if (b.type !== 'bridge') wrap.append(h('button', { class: 'btn', onclick: () => Build.rotate() }, '⟳ Drehen'));
    wrap.append(h('button', { class: 'btn', onclick: () => { Build.enter(); App.selection = [b]; Build.startMoveGroup(); } }, '✥ Verschieben (' + Fmt.money(Grid.moveFee(g, b)) + ')'));
    const refund = b.paid * CONFIG.refundRate;
    wrap.append(h('button', { class: 'btn danger', onclick: () => {
      const doIt = () => { const r = Actions.removeMany(g, [b]); Build.afterRemove([b], r); };
      if (b.paid > 1000 || SELLER_TIER[b.type] !== undefined) UI.confirm('Abreißen?', esc(InfoPanel.name(b)) + ' abreißen und ' + Fmt.money(refund) + ' (70 %) zurückerhalten? Gelagerte Items gehen verloren.', 'Abreißen', doIt, true);
      else doIt();
    } }, '⌫ Abreißen (+' + Fmt.money(refund) + ')'));
    if (b.type === 'lab') wrap.append(h('button', { class: 'btn', onclick: () => Menus.open('research') }, '⚗ Forschung öffnen'));
    if (g.run.research.done.has('fasttravel')) wrap.append(h('button', { class: 'btn', onclick: () => MainLoop.teleport(b.x + b.w / 2, b.y + b.h + 1) }, '⇢ Hierher teleportieren'));
  }
};

// ===== src/app/10_menus.js =====
// =====================================================================
// Menus: Kodex, Forschung, Rebirth & Shop, Statistiken, Erfolge, Einstellungen
// =====================================================================
const Menus = {
  tab: 'codex',
  codexSel: -1,
  treeSel: null,
  treeView: { x: 0, y: 0, s: 0.8 },
  rbPlanet: null,
  TABS: [['codex', '📖 Kodex'], ['research', '⚗ Forschung'], ['rebirth', '♻ Rebirth'], ['stats', '📈 Statistik'], ['ach', '🏆 Erfolge'], ['settings', '⚙ Einstellungen']],

  open(tab) {
    Menus.tab = tab || Menus.tab;
    const m = h('div', { class: 'modal' });
    const head = h('div', { class: 'modal-head' }, h('h2', { text: GAME_TITLE }), h('button', { class: 'icon-btn small', 'aria-label': 'Schließen', onclick: () => UI.closeModal() }, '✕'));
    const tabs = h('div', { class: 'modal-tabs', role: 'tablist' });
    for (const [id, label] of Menus.TABS) {
      tabs.append(h('button', { class: 'modal-tab' + (id === Menus.tab ? ' on' : ''), role: 'tab', onclick: () => { Menus.tab = id; Audio2.play('click'); Menus.render(); [...tabs.children].forEach(c => c.classList.toggle('on', c.textContent === label)); } }, label));
    }
    const body = h('div', { class: 'modal-body', id: 'menu-body' });
    m.append(head, tabs, body);
    UI.openModal(m, { onClose: () => { clearInterval(Menus.timer); } });
    Menus.render();
    clearInterval(Menus.timer);
    Menus.timer = setInterval(() => { if (!UI.modalOpen()) { clearInterval(Menus.timer); return; } if (Menus.tab === 'research' || Menus.tab === 'rebirth') Menus.liveUpdate(); }, 500);
    Tutorial.onEvent('menu', tab);
  },
  render() {
    const body = $('#menu-body');
    if (!body) return;
    body.innerHTML = '';
    const f = { codex: Menus.codex, research: Menus.research, rebirth: Menus.rebirth, stats: Menus.stats, ach: Menus.achievements, settings: Menus.settings }[Menus.tab];
    f(body);
  },
  liveUpdate() {
    if (Menus.tab === 'research') {
      $$('.tree-node').forEach(el => {
        const r = DATA.RESEARCH_BY_ID[el.dataset.id];
        const st = Progression.researchState(App.g, r);
        el.className = 'tree-node ' + st;
        const c = el.querySelector('.cost');
        if (c && st !== 'done') c.classList.toggle('no', Progression.researchCost(App.g, r) > App.g.run.money);
        const pr = el.querySelector('.progress i');
        if (pr && App.g.run.research.active && App.g.run.research.active.id === r.id) pr.style.width = (App.g.run.research.active.prog * 100) + '%';
      });
      const det = $('#tree-detail');
      if (det && Menus.treeSel) Menus.treeDetail(det);
    }
    if (Menus.tab === 'rebirth') { const el = $('#rb-live'); if (el) Menus.rebirthLive(el); }
  },

  // ---------------- Kodex ----------------
  codex(body) {
    const g = App.g, cx = g.meta.codex;
    const n = Progression.codexCount(g);
    body.append(h('div', { class: 'big-num', text: n + ' / 91 Rohstoffe entdeckt' }));
    body.append(h('p', { class: 'muted', text: 'Jede vollständig entdeckte Stufe gibt dauerhaft +2 % Verkaufserlös (bleibt über Rebirth erhalten). Entdeckt heißt: mindestens eine Einheit abgebaut.' }));
    const tiers = h('div', { class: 'codex-tiers' });
    for (let t = 0; t < 8; t++) {
      const ids = DATA.BY_TIER[t];
      const got = ids.filter(r => cx.state[r] >= 2).length;
      tiers.append(h('span', { class: 'codex-tier', style: { borderColor: DATA.TIERS[t].color, color: DATA.TIERS[t].color } }, DATA.TIERS[t].name + ' ' + got + '/' + ids.length + (got === ids.length ? ' ✓ +2 %' : '')));
    }
    body.append(tiers);
    const detail = h('div', { id: 'codex-detail' });
    body.append(detail);
    const grid = h('div', { class: 'codex-grid' });
    for (const R of DATA.RESOURCES) {
      const st = cx.state[R.id];
      const cell = h('button', { class: 'codex-cell' + (st < 2 ? ' unknown' : ''), style: { borderColor: st >= 1 ? Col.rgba(DATA.TIERS[R.tier].color, 0.5) : '' } });
      cell.append(Sprites.itemCanvas(R.id, 0, 44, st < 1));
      cell.append(h('div', { class: 'n', text: st >= 1 ? R.name : '???' }));
      cell.addEventListener('click', () => { Menus.codexSel = R.id; Menus.codexDetail(detail); Audio2.play('click'); detail.scrollIntoView({ block: 'nearest' }); });
      grid.append(cell);
    }
    body.append(grid);
    if (Menus.codexSel >= 0) Menus.codexDetail(detail);
  },
  codexDetail(el) {
    const g = App.g, cx = g.meta.codex;
    const R = DATA.RESOURCES[Menus.codexSel];
    const st = cx.state[R.id];
    el.innerHTML = '';
    const box = h('div', { class: 'codex-detail' });
    box.append(Sprites.itemCanvas(R.id, 0, 72, st < 1));
    const info = h('div');
    if (st < 1) {
      info.innerHTML = '<h3 style="margin:0">???</h3><p class="muted">' + DATA.TIERS[R.tier].name + '. Noch nicht gesichtet. Erkunde und scanne, um es zu finden.</p>';
    } else {
      info.innerHTML = '<h3 style="margin:0;color:' + DATA.TIERS[R.tier].color + '">' + esc(R.name) + '</h3><p class="muted" style="margin:4px 0 8px">' + esc(R.desc) + '</p>' +
        '<div class="kv"><span>Seltenheit</span><b>' + DATA.TIERS[R.tier].name + '</b><span>Basiswert</span><b>' + Fmt.num(R.value) + ' ' + CURRENCY_SHORT + '</b>' +
        '<span>Status</span><b>' + (st >= 2 ? 'Entdeckt' : 'Gesichtet (noch nicht abgebaut)') + '</b><span>Gesamt abgebaut</span><b>' + Fmt.int(cx.mined[R.id]) + '</b>' +
        '<span>Rekord-Verkaufspreis</span><b>' + (cx.best[R.id] > 0 ? Fmt.num(cx.best[R.id]) + ' ' + CURRENCY_SHORT + '/Stück' : '–') + '</b>' +
        '<span>Aktuelle Nachfrage</span><b>' + InfoPanel.trend(g, R.id) + '</b></div>';
    }
    box.append(info);
    el.append(box);
  },

  // ---------------- Forschung ----------------
  research(body) {
    const g = App.g;
    const hasLab = g.lists.lab && g.lists.lab.length;

    for (const c in cats) inner.append(h('div', { class: 'tree-cat', style: { left: '8px', top: (OY + cats[c] * H + 24) + 'px' } }, c));
    for (const r of DATA.RESEARCH) {
      const st = Progression.researchState(g, r);

      node.innerHTML = '<b>' + esc(r.name) + '</b>' + (st === 'done' ? '<span style="color:var(--good)">✓ Erforscht</span>' : '<span class="cost' + (Progression.researchCost(g, r) > g.run.money ? ' no' : '') + '">' + Fmt.money(Progression.researchCost(g, r)) + '</span> · ' + Fmt.time(Progression.researchTime(g, r))) +
        (st === 'active' ? '<div class="progress" style="margin-top:4px"><i style="width:' + (g.run.research.active.prog * 100) + '%"></i></div>' : '');
      node.addEventListener('click', () => { if (Menus.treeDrag && Menus.treeDrag.moved) return; Menus.treeSel = r.id; Menus.treeDetail(det); Audio2.play('click'); });
      inner.append(node);
    }
    wrap.append(inner);
    const zoom = h('div', { class: 'tree-zoom' },
      h('button', { class: 'icon-btn small', 'aria-label': 'Hineinzoomen', onclick: () => { Menus.treeView.s = Math.min(1.6, Menus.treeView.s * 1.2); apply(); } }, '+'),
      h('button', { class: 'icon-btn small', 'aria-label': 'Herauszoomen', onclick: () => { Menus.treeView.s = Math.max(0.4, Menus.treeView.s / 1.2); apply(); } }, '−'));
    wrap.append(zoom);
    body.append(wrap);
    const v = Menus.treeView;
    const apply = () => { inner.style.transform = 'translate(' + v.x + 'px,' + v.y + 'px) scale(' + v.s + ')'; };
    apply();
    const pts = new Map();
    wrap.addEventListener('pointerdown', e => {
      if (e.target.closest('.tree-zoom')) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      Menus.treeDrag = { moved: false, sx: e.clientX, sy: e.clientY };
      if (pts.size === 2) { const p = [...pts.values()]; Menus.treePinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), s: v.s }; }
    });
    wrap.addEventListener('pointermove', e => {
      const p0 = pts.get(e.pointerId);
      if (!p0) return;
      if (pts.size === 2 && Menus.treePinch) {
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const p = [...pts.values()];
        v.s = U.clamp(Menus.treePinch.s * Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) / Menus.treePinch.d, 0.4, 1.6);
        Menus.treeDrag.moved = true; apply(); return;
      }
      v.x += e.clientX - p0.x; v.y += e.clientY - p0.y;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (Math.hypot(e.clientX - Menus.treeDrag.sx, e.clientY - Menus.treeDrag.sy) > 6) Menus.treeDrag.moved = true;
      apply();
    });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) Menus.treePinch = null; setTimeout(() => { if (!pts.size && Menus.treeDrag) Menus.treeDrag.moved = false; }, 0); };
    wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
    wrap.addEventListener('wheel', e => { e.preventDefault(); v.s = U.clamp(v.s * Math.exp(-e.deltaY * 0.0015), 0.4, 1.6); apply(); }, { passive: false });
  },

  chart(cv) {
    const g = App.g;
    const d = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth || 600, hh = 180;
    cv.width = w * d; cv.height = hh * d;
    const x = cv.getContext('2d'); x.scale(d, d);
    const data = g.meta.earnHistory.concat([[Math.round(g.stats.playTime), g.meta.totalEarned]]);
    x.fillStyle = 'rgba(255,255,255,.04)'; x.fillRect(0, 0, w, hh);
    if (data.length < 2) { x.fillStyle = '#bdb1a8'; x.font = '13px system-ui'; x.fillText('Daten werden minütlich gesammelt.', 12, 24); return; }
    const t0 = data[0][0], t1 = data[data.length - 1][0];
    const maxV = Math.max(1, ...data.map(p => p[1]));
    const logMax = Math.log10(maxV + 1);
    const px = t => 40 + (t - t0) / Math.max(1, t1 - t0) * (w - 50);
    const py = v => hh - 20 - Math.log10(v + 1) / logMax * (hh - 34);
    x.strokeStyle = 'rgba(255,255,255,.12)'; x.fillStyle = '#bdb1a8'; x.font = '12px system-ui'; x.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { const v = Math.pow(10, logMax * i / 4) - 1; const y = py(v); x.beginPath(); x.moveTo(40, y); x.lineTo(w - 10, y); x.stroke(); x.fillText(Fmt.num(v), 2, y + 4); }
    x.fillText(Fmt.duration(t1 - t0), w - 90, hh - 4);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff8a3d';
    x.strokeStyle = accent; x.lineWidth = 2;
    x.beginPath(); data.forEach((p, i) => { i ? x.lineTo(px(p[0]), py(p[1])) : x.moveTo(px(p[0]), py(p[1])); }); x.stroke();
  },

// =====================================================================
// MapView: minimap + full-screen map with fog of war, markers and pins
// =====================================================================
const PIN_COLORS = ['#ff5a5a', '#ffc24d', '#63df74', '#4aa8ff', '#d86bff'];

const MapView = {
  cellCache: new Map(),
  view: { x: 0, y: 0, s: 2 },
  pinMode: false,
  lastMini: 0,

  cellColor(g, cx, cy, i) {
    const key = U.chunkKey(cx, cy);
    let arr = MapView.cellCache.get(key);
    if (!arr) {
      arr = [];
      const S = CONFIG.chunkSize, C = CONFIG.fogCell, per = S / C, col = [0, 0, 0];
      for (let k = 0; k < per * per; k++) {
        Render.terrainColor(g.world, cx * S + (k % per) * C + C / 2, cy * S + Math.floor(k / per) * C + C / 2, col);
        arr.push('rgb(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ')');
      }
      if (MapView.cellCache.size > 4000) MapView.cellCache.clear();
      MapView.cellCache.set(key, arr);
    }
    return arr[i];
  },

  // Generic map painter. (cx, cy) = world centre, s = px per tile.
  paint(ctx, g, W, H, cx, cy, s, opts = {}) {
    ctx.fillStyle = '#07060a'; ctx.fillRect(0, 0, W, H);
    const S = CONFIG.chunkSize, C = CONFIG.fogCell, per = S / C;
    const x0 = cx - W / 2 / s, y0 = cy - H / 2 / s, x1 = cx + W / 2 / s, y1 = cy + H / 2 / s;
    const tx = x => (x - cx) * s + W / 2, ty = y => (y - cy) * s + H / 2;
    const cs = C * s + 0.6;
    for (let ccy = Math.floor(y0 / S); ccy <= Math.floor(y1 / S); ccy++) for (let ccx = Math.floor(x0 / S); ccx <= Math.floor(x1 / S); ccx++) {
      const m = g.world.discovered.get(U.chunkKey(ccx, ccy));
      if (!m) continue;
      for (let i = 0; i < per * per; i++) {
        if (!(m & (1 << i))) continue;
        ctx.fillStyle = MapView.cellColor(g, ccx, ccy, i);
        ctx.fillRect(tx(ccx * S + (i % per) * C), ty(ccy * S + Math.floor(i / per) * C), cs, cs);
      }
    }
    // buildings
    for (const b of g.buildings.values()) {
      const r = b.type === 'bridge' ? Grid.rect(b) : b;
      if (r.x + r.w < x0 || r.x > x1 || r.y + r.h < y0 || r.y > y1) continue;
      ctx.fillStyle = b.type === 'belt' ? '#9aa3ad' : DATA.BUILDINGS[b.type].color;
      ctx.fillRect(tx(r.x), ty(r.y), Math.max(1, r.w * s), Math.max(1, r.h * s));
      if (opts.warn && b.warn && g.run.research.done.has('alerts')) { ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(tx(r.x + r.w / 2), ty(r.y), 4, 0, Math.PI * 2); ctx.fill(); }
    }
    // known deposits
    const dotR = Math.max(2.5, Math.min(6, s * 1.5));
    for (const id of g.world.known) {
      const d = World.depositById(g.world, id);
      if (!d || d.x < x0 - 2 || d.x > x1 + 2 || d.y < y0 - 2 || d.y > y1 + 2) continue;
      const col = d.tier === 7 ? Col.prism(App.now / 1000, 0) : DATA.TIERS[d.tier].color;
      ctx.fillStyle = col; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tx(d.x + 0.5), ty(d.y + 0.5), dotR * (1 + d.tier * 0.08), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (opts.labels && s >= 3 && d.tier >= 2) { ctx.fillStyle = '#fff'; ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillText(DATA.RESOURCES[d.res].name, tx(d.x + 0.5), ty(d.y) - dotR - 3); }
    }
    if (App.debug.wallhack) {
      for (const d of World.depositsInRect(g.world, x0, y0, x1, y1)) { ctx.strokeStyle = DATA.TIERS[d.tier].color; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(tx(d.x + 0.5), ty(d.y + 0.5), dotR + 2, 0, Math.PI * 2); ctx.stroke(); }
    }
    // home
    const hm = g.run.home;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    const hx = tx(hm.x), hy = ty(hm.y);
    ctx.beginPath(); ctx.moveTo(hx, hy - 7); ctx.lineTo(hx + 6, hy); ctx.lineTo(hx + 4, hy); ctx.lineTo(hx + 4, hy + 6); ctx.lineTo(hx - 4, hy + 6); ctx.lineTo(hx - 4, hy); ctx.lineTo(hx - 6, hy); ctx.closePath(); ctx.fill(); ctx.stroke();
    // pins
    for (const p of g.run.pins) {
      const px = tx(p.x + 0.5), py = ty(p.y + 0.5);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 6, py - 10); ctx.arc(px, py - 11, 6, Math.PI * 0.85, Math.PI * 0.15); ctx.closePath(); ctx.fill(); ctx.stroke();
      if (opts.labels) { ctx.fillStyle = '#fff'; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(p.name, px, py - 20); }
    }
    if (g.run.probeTarget) { const p = g.run.probeTarget; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(tx(p.x + 0.5), ty(p.y + 0.5), 9 + Math.sin(App.now / 200) * 2, 0, Math.PI * 2); ctx.stroke(); }
    // player
    const pl = g.run.player;
    ctx.fillStyle = Render.palette.accent; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(tx(pl.x), ty(pl.y), 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (opts.viewRect) {
      const vr = Render.visibleRect(0);
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1;
      ctx.strokeRect(tx(vr.x0), ty(vr.y0), (vr.x1 - vr.x0) * s, (vr.y1 - vr.y0) * s);
    }
  },

  drawMini(g) {
    if (!App.settings.minimap) return;
    const now = performance.now();
    if (now - MapView.lastMini < 180) return;
    MapView.lastMini = now;
    const cv = $('#minimap');
    const d = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth || 160;
    if (cv.width !== Math.round(w * d)) { cv.width = Math.round(w * d); cv.height = Math.round(w * d); }
    const ctx = cv.getContext('2d');
    ctx.setTransform(d, 0, 0, d, 0, 0);
    MapView.paint(ctx, g, w, w, g.run.player.x, g.run.player.y, w / 120, { viewRect: true, warn: true });
  },

  open() {
    const g = App.g;
    MapView.view = { x: g.run.player.x, y: g.run.player.y, s: 3 };
    MapView.pinMode = false;
    const m = h('div', { class: 'modal' });
    const head = h('div', { class: 'modal-head' }, h('h2', { text: 'Karte · ' + g.world.planet.name }), h('button', { class: 'icon-btn small', 'aria-label': 'Schließen', onclick: () => UI.closeModal() }, '✕'));
    const wrap = h('div', { class: 'map-wrap' });
    const cv = h('canvas', { 'aria-label': 'Karte' });
    wrap.append(cv);
    const tools = h('div', { class: 'map-tools' },
      h('button', { class: 'icon-btn small', 'aria-label': 'Hineinzoomen', onclick: () => { MapView.view.s = Math.min(16, MapView.view.s * 1.4); } }, '+'),
      h('button', { class: 'icon-btn small', 'aria-label': 'Herauszoomen', onclick: () => { MapView.view.s = Math.max(0.15, MapView.view.s / 1.4); } }, '−'),
      h('button', { class: 'icon-btn small', 'aria-label': 'Zum Astronauten', title: 'Zum Astronauten', onclick: () => { MapView.view.x = g.run.player.x; MapView.view.y = g.run.player.y; } }, '◎'));
    wrap.append(tools);
    const legend = h('div', { class: 'map-legend' });
    for (let t = 0; t < 8; t++) legend.append(h('span', { style: { color: DATA.TIERS[t].color }, text: '● ' + DATA.TIERS[t].name }));
    wrap.append(legend);
    const pinBtn = h('button', { class: 'pill' }, '📍 Markierung setzen');
    pinBtn.addEventListener('click', () => { MapView.pinMode = !MapView.pinMode; pinBtn.classList.toggle('on', MapView.pinMode); if (MapView.pinMode) UI.toast('Tippe auf die Karte, um eine Markierung zu setzen (max. 5).'); });
    const body = h('div', { class: 'modal-body' });
    body.append(wrap);
    const pins = h('div', { class: 'pin-list', id: 'pin-list', style: { marginTop: '10px' } });
    body.append(pins);
    const foot = h('div', { class: 'modal-foot' },
      pinBtn,
      h('button', { class: 'pill', onclick: () => { UI.closeModal(); MainLoop.teleport(g.run.home.x, g.run.home.y, 'Schnellreise zum Landeplatz'); } }, '⌂ Schnellreise zum Landeplatz'));
    m.append(head, body, foot);
    UI.openModal(m, { onClose: () => cancelAnimationFrame(MapView.raf) });
    MapView.renderPins();
    // interaction
    const ptrs = new Map();
    let pinch = null, moved = false;
    cv.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY }); moved = false; if (ptrs.size === 2) { const p = [...ptrs.values()]; pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), s: MapView.view.s }; } cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      if (ptrs.size === 2 && pinch) { p.x = e.clientX; p.y = e.clientY; const q = [...ptrs.values()]; MapView.view.s = U.clamp(pinch.s * Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y) / pinch.d, 0.15, 16); moved = true; return; }
      MapView.view.x -= (e.clientX - p.x) / MapView.view.s; MapView.view.y -= (e.clientY - p.y) / MapView.view.s;
      p.x = e.clientX; p.y = e.clientY;
      if (Math.hypot(p.x - p.sx, p.y - p.sy) > 6) moved = true;
    });
    const up = e => {
      const p = ptrs.get(e.pointerId);
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinch = null;
      if (p && !moved && MapView.pinMode) {
        const r = cv.getBoundingClientRect();
        const wx = MapView.view.x + (e.clientX - r.left - r.width / 2) / MapView.view.s;
        const wy = MapView.view.y + (e.clientY - r.top - r.height / 2) / MapView.view.s;
        MapView.addPin(Math.floor(wx), Math.floor(wy));
      }
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', e => { e.preventDefault(); MapView.view.s = U.clamp(MapView.view.s * Math.exp(-e.deltaY * 0.0015), 0.15, 16); }, { passive: false });
    const loop = () => {
      if (!cv.isConnected) return;
      const d = Math.min(2, window.devicePixelRatio || 1);
      const w = cv.clientWidth, hh = cv.clientHeight;
      if (cv.width !== Math.round(w * d) || cv.height !== Math.round(hh * d)) { cv.width = Math.round(w * d); cv.height = Math.round(hh * d); }
      const ctx = cv.getContext('2d');
      ctx.setTransform(d, 0, 0, d, 0, 0);
      MapView.paint(ctx, g, w, hh, MapView.view.x, MapView.view.y, MapView.view.s, { labels: true, warn: true, viewRect: true });
      MapView.raf = requestAnimationFrame(loop);
    };
    MapView.raf = requestAnimationFrame(loop);
  },
  addPin(x, y) {
    const g = App.g;
    if (g.run.pins.length >= 5) { UI.toast('Maximal 5 Markierungen. Lösche zuerst eine.', 'bad'); return; }
    const n = g.run.pins.length;
    g.run.pins.push({ x, y, color: PIN_COLORS[n % PIN_COLORS.length], name: 'Markierung ' + (n + 1) });
    Audio2.play('click');
    MapView.renderPins();
  },
  renderPins() {
    const g = App.g, el = $('#pin-list');
    if (!el) return;
    el.innerHTML = '';
    if (!g.run.pins.length) { el.append(h('div', { class: 'muted', text: 'Noch keine Markierungen. Markierungen erscheinen auch als Pfeile am Bildschirmrand.' })); return; }
    g.run.pins.forEach((p, i) => {
      const name = h('input', { value: p.name, maxlength: 24, 'aria-label': 'Name der Markierung', style: { flex: '1', minHeight: '40px', borderRadius: '10px', background: '#241c2a', color: 'var(--text)', border: '1px solid var(--line-strong)', padding: '6px 10px' } });
      name.addEventListener('input', () => { p.name = name.value || 'Markierung'; });
      const colors = h('div', { class: 'seg' });
      for (const c of PIN_COLORS) { const b = h('button', { class: p.color === c ? 'on' : '', style: { background: c, width: '40px' }, 'aria-label': 'Farbe' }, ' '); b.addEventListener('click', () => { p.color = c; MapView.renderPins(); }); colors.append(b); }
      el.append(h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } }, name, colors,
        h('button', { class: 'pill', onclick: () => { MapView.view.x = p.x; MapView.view.y = p.y; } }, 'Zeigen'),
        h('button', { class: 'pill', onclick: () => { g.run.pins.splice(i, 1); MapView.renderPins(); } }, 'Löschen')));
    });
  }
};

// =====================================================================
// Tutorial: short contextual steps in the first run (skippable)
// =====================================================================
const Tutorial = {
  STEPS: [
    { text: 'Willkommen auf dem Planeten! <b>Laufe</b> ein paar Schritte: WASD/Pfeiltasten oder den Joystick unten links (Daumen aufsetzen und ziehen).', target: null },
    { text: 'Rohstoffe liegen als leuchtende Vorkommen auf dem Boden. Drücke den <b>Scanner</b> (◉ bzw. F), um alle Vorkommen in der Nähe zu markieren.', target: '#btn-scan' },
    { text: 'Öffne <b>Bauen</b> (⚒ bzw. B), wähle den <b>Extraktor</b> und setze ihn <b>direkt neben oder auf ein Vorkommen</b>. Am besten auf ein graues, gewöhnliches.', target: '#btn-build' },
    { text: 'Wähle in „Transport“ das <b>Förderband</b> und <b>ziehe eine Linie</b> vom Extraktor weg. Die Pfeile zeigen die Laufrichtung.', target: '#bb-cats' },
    { text: 'Setze am Ende des Bandes einen <b>Basarstand</b> (Kategorie „Verkauf“). Das Band muss in den Stand hineinführen.', target: '#bb-cats' },
    { text: 'Gleich kommen <b>Alien-Wanderer</b> vorbei und kaufen, was sie sich wünschen (Sprechblase). Warte auf deinen <b>ersten Verkauf</b>.', target: null },
    { text: 'Sehr gut! Tipp: <b>Lager</b> puffern Items, wenn gerade niemand kauft, und neben einem Verkaufsgebäude wirken sie als Verladerampe. <b>Raffinerien</b> verdoppeln den Wert deiner Rohstoffe.', target: null, next: true },
    { text: 'Auf der <b>Karte</b> (M) siehst du entdeckte Gebiete und Vorkommen. Mit einem <b>Forschungslabor</b> schaltest du bessere Bänder, Raffinerien und mehr frei. Viel Erfolg!', target: '#btn-map', next: true, last: true }
  ],
  active: false,
  step: 0,
  moved: 0,
  belts: 0,

  start() {
    const t = App.g.meta.tutorial;
    if (t.done) return;
    Tutorial.active = true;
    Tutorial.step = t.step || 0;
    Tutorial.show();
    $('#tutorial .tut-skip').onclick = () => Tutorial.finish(true);
    $('#tutorial .tut-next').onclick = () => Tutorial.advance();
  },
  restart() {
    App.g.meta.tutorial = { done: false, step: 0 };
    Tutorial.start();
  },
  show() {
    const el = $('#tutorial');
    $$('.pulse-target').forEach(e => e.classList.remove('pulse-target'));
    if (!Tutorial.active) { el.classList.add('hidden'); return; }
    const s = Tutorial.STEPS[Tutorial.step];
    el.classList.remove('hidden');
    el.querySelector('.tut-text').innerHTML = '<div class="tut-step">Schritt ' + (Tutorial.step + 1) + ' von ' + Tutorial.STEPS.length + '</div>' + s.text;
    const nx = el.querySelector('.tut-next');
    nx.classList.toggle('hidden', !s.next);
    nx.textContent = s.last ? 'Fertig' : 'Weiter';
    if (s.target) { const t = $(s.target); if (t) t.classList.add('pulse-target'); }
  },
  advance() {
    Tutorial.step++;
    App.g.meta.tutorial.step = Tutorial.step;
    if (Tutorial.step >= Tutorial.STEPS.length) { Tutorial.finish(false); return; }
    Audio2.play('click');
    Tutorial.show();
  },
  finish(skipped) {
    Tutorial.active = false;
    App.g.meta.tutorial = { done: true, step: Tutorial.STEPS.length };
    Tutorial.show();
    if (!skipped) UI.toast('Tutorial abgeschlossen. Viel Spaß beim Aufbau!', 'good');
  },
  tick(g) {
    if (!Tutorial.active) return;
    if (Tutorial.step === 0) {
      const p = g.run.player;
      if (Math.hypot(p.x - g.run.home.x, p.y - g.run.home.y) > 3) Tutorial.advance();
    }
    if (Tutorial.step === 5 && g.run.earned > 0) Tutorial.advance();
    // skip ahead if the player is faster than the tutorial
    if (Tutorial.step === 2 && (g.lists.extractor || []).length) Tutorial.advance();
    if (Tutorial.step === 4 && (g.lists.seller || []).length) Tutorial.advance();
  },
  onEvent(type, data) {
    if (!Tutorial.active) return;
    const s = Tutorial.step;
    if (s === 1 && type === 'scan') Tutorial.advance();
    else if (s === 2 && type === 'place' && data.type === 'extractor') Tutorial.advance();
    else if (s === 3 && type === 'place' && data.type === 'belt') Tutorial.advance();
    else if (s === 4 && type === 'place' && SELLER_TIER[data.type] !== undefined) Tutorial.advance();
    else if (s === 7 && type === 'map') Tutorial.advance();
  }
};

    panel.append(row(tierSel, btn('Alles erforschen', () => { for (const r of DATA.RESEARCH) g.run.research.done.add(r.id); Progression.computeMods(g); g.topologyDirty = true; UI.refreshBuildBar(true); })));
    panel.append(h('b', { text: 'Welt' }));
    panel.append(row(btn('Seed neu würfeln', () => { g.meta.baseSeed = RNG.newSeed(); const g2 = Game.create(g.meta, g.run.planet); MainLoop.start(g2, { fresh: true }); Debug.show(); }),
      btn((App.debug.chunkBorders ? '☑' : '☐') + ' Chunk-Grenzen', () => { App.debug.chunkBorders = !App.debug.chunkBorders; Debug.show(); }),
      btn((App.debug.wallhack ? '☑' : '☐') + ' Alle Vorkommen', () => { App.debug.wallhack = !App.debug.wallhack; if (App.debug.wallhack) { const p = g.run.player; for (const d of World.depositsInRadius(g.world, p.x, p.y, 200)) g.world.known.add(d.id); World.discover(g.world, p.x, p.y, 200); } Debug.show(); })));
    panel.append(h('b', { text: 'Ereignisse' }));
    panel.append(row(btn('Positives Event', () => { if (!Economy.spawnEvent(g, true)) UI.toast('Erst etwas produzieren'); }), btn('Negatives Event', () => { if (!Economy.spawnEvent(g, false)) UI.toast('Erst etwas produzieren'); }), btn('Vertrag', () => { const c = Customers.makeContract(g); if (c) { g.run.contracts.push(c); g.events.push({ type: 'contractNew', c }); } })));
    const hrs = h('input', { type: 'number', min: 0.02, max: 24, step: 0.5, value: 2, style: { width: '80px', minHeight: '40px', borderRadius: '10px', background: '#241c2a', color: 'var(--text)', border: '1px solid var(--line-strong)', padding: '4px 8px' }, 'aria-label': 'Stunden' });
    panel.append(h('b', { text: 'Offline-Test' }));
    panel.append(row(hrs, btn('Offline simulieren', () => { MainLoop.offlineFor(Math.max(0, +hrs.value) * 3600); })));
    panel.append(h('b', { text: 'Balancing & Tests' }));
    const out = h('pre', { style: { whiteSpace: 'pre-wrap', fontSize: '12px', background: '#0f0b12', padding: '8px', borderRadius: '10px', maxHeight: '260px', overflow: 'auto', userSelect: 'text' } }, 'Bereit.');
    panel.append(row(btn('Balancing-Report', () => Debug.balance(out)), btn('Selbsttests', () => Debug.selftest(out))));
    panel.append(out);
    document.body.append(panel);
    Debug.updateStats();
  },
  updateStats() {
    const el = $('#dbg-stats');
    if (!el || !App.g) return;
    const g = App.g;
    let items = 0;
    for (const b of g.buildings.values()) { if (b.items) items += b.items.length; if (b.queue) items += b.queue.length; }
    el.textContent = 'FPS ' + App.debug.fps.toFixed(0) + ' · Frame ' + App.debug.frameMs.toFixed(1) + ' ms · Sim ' + (App.debug.simMs || 0).toFixed(2) + ' ms · Gebäude ' + g.buildings.size + ' · Items ' + items + ' · Partikel ' + Render.particles.length + ' · Chunks ' + Render.chunks.size + ' · Qualität ' + App.quality + ' · Tick ' + g.tick;
  },
  balance(out) {
    out.textContent = 'Simulation läuft … (greedy Bot, Planet 1). Das Spiel pausiert währenddessen.';
    // the report runs at 10 ticks/s for speed; the live game is paused meanwhile
    const prevRate = CONFIG.tickRate;
    App.running = false;
    CONFIG.tickRate = 10;
    const it = Bot.runIter({ maxHours: 6, seed: RNG.newSeed() % 100000 });
    const finish = () => { CONFIG.tickRate = prevRate; App.running = true; MainLoop.last = 0; };
    const step = () => {
      const t0 = performance.now();
      let r;
      while (performance.now() - t0 < 40) { r = it.next(); if (r.done) break; }
      if (r && r.done) { finish(); out.textContent = Bot.format(r.value); return; }
      if (!Debug.el) { finish(); return; }
      if (r && r.value) out.textContent = 'Simulation läuft … ' + Fmt.duration(r.value.time) + ' Spielzeit, ' + Fmt.money(r.value.earned);
      setTimeout(step, 0);
    };
    step();
  },
  selftest(out) {
    out.textContent = 'Tests laufen …';
    setTimeout(() => {
      const res = SelfTest.run();
      out.textContent = res.map(r => (r.ok ? '✔ ' : '✘ ') + r.name + (r.info ? ' – ' + r.info : '')).join('\n');
    }, 20);
  }
};

// ===== src/app/14_fx.js =====
// =====================================================================
// FX: title background, landing intro, rebirth sequence, dialogs
// =====================================================================
const FX = {
  stars: null,
  makeStars(n = 220) {
    const rnd = RNG.mulberry32(77);
    FX.stars = Array.from({ length: n }, () => ({ x: rnd(), y: rnd(), z: 0.2 + rnd() * 0.8, tw: rnd() * 6 }));
  },
  drawStars(ctx, W, H, t, speed = 0, streak = 0) {
    if (!FX.stars) FX.makeStars();
    for (const s of FX.stars) {
      let x = s.x, y = s.y;
      if (speed) { x = ((s.x - 0.5) * (1 + ((t * speed * s.z) % 1) * 3)) + 0.5; y = ((s.y - 0.5) * (1 + ((t * speed * s.z) % 1) * 3)) + 0.5; }
      const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + s.tw));
      if (streak > 0) {
        const cx = W / 2, cy = H / 2;
        const px = x * W, py = y * H;
        const dx = px - cx, dy = py - cy;
        ctx.strokeStyle = 'rgba(200,220,255,' + (a * s.z) + ')'; ctx.lineWidth = s.z * 2;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - dx * streak * s.z, py - dy * streak * s.z); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,' + (a * s.z) + ')';
        ctx.fillRect(x * W, y * H, s.z * 2, s.z * 2);
      }
    }
  },
  drawPlanet(ctx, cx, cy, r, planet, t) {
    const gr = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
    gr.addColorStop(0, planet.ground[2]); gr.addColorStop(0.55, planet.ground[1]); gr.addColorStop(1, planet.ground[0]);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = Col.rgba(planet.rock, 0.35);
    for (let i = 0; i < 9; i++) { const a = i * 2.4 + t * 0.03, d = (i * 0.37 % 1) * r * 0.8; ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.6, r * (0.08 + (i % 3) * 0.04), r * 0.05, a, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(cx + r * 0.45, cy + r * 0.3, r * 1.05, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = Col.rgba(planet.accent, 0.5); ctx.lineWidth = r * 0.04;
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.02, 0, Math.PI * 2); ctx.stroke();
  },

  // ---------------- title screen ----------------
  titleLoop: null,
  startTitle() {
    const cv = $('#title-bg');
    const ctx = cv.getContext('2d');
    const planet = DATA.planet(1);
    const loop = t => {
      if ($('#screen-title').classList.contains('hidden')) return;
      const d = Math.min(2, window.devicePixelRatio || 1);
      const W = window.innerWidth, H = window.innerHeight;
      if (cv.width !== W * d) { cv.width = W * d; cv.height = H * d; }
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.fillStyle = '#0b0710'; ctx.fillRect(0, 0, W, H);
      FX.drawStars(ctx, W, H, t / 1000);
      const r = Math.max(W, H) * 0.55;
      FX.drawPlanet(ctx, W * 0.5, H + r * 0.55, r, planet, t / 1000);
      FX.titleLoop = requestAnimationFrame(loop);
    };
    FX.titleLoop = requestAnimationFrame(loop);
  },

  // ---------------- cinematic sequences ----------------
  sequence(kind, planet, onDone) {
    const scr = $('#screen-fx');
    scr.classList.remove('hidden');
    const cv = $('#fx-canvas');
    const ctx = cv.getContext('2d');
    const text = scr.querySelector('.fx-text');
    const dur = App.settings.reducedFx ? 1800 : kind === 'rebirth' ? 6500 : 4800;
    let start = null, done = false, raf;
    const finish = () => { if (done) return; done = true; cancelAnimationFrame(raf); scr.classList.add('hidden'); onDone(); };
    scr.querySelector('.fx-skip').onclick = finish;
    if (kind === 'rebirth') Audio2.play('rebirth'); else Audio2.play('land');
    const frame = ts => {
      if (start === null) start = ts;
      const t = (ts - start) / dur;
      const d = Math.min(2, window.devicePixelRatio || 1);
      const W = window.innerWidth, H = window.innerHeight;
      if (cv.width !== Math.round(W * d)) { cv.width = Math.round(W * d); cv.height = Math.round(H * d); }
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.fillStyle = '#05030a'; ctx.fillRect(0, 0, W, H);
      if (kind === 'rebirth') FX.drawRebirth(ctx, W, H, t, planet, text);
      else FX.drawLanding(ctx, W, H, t, planet, text);
      if (t >= 1) { finish(); return; }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  },
  drawLanding(ctx, W, H, t, planet, text) {
    FX.drawStars(ctx, W, H, t * 5);
    const r = Math.max(W, H) * (0.6 + t * 1.6);
    FX.drawPlanet(ctx, W / 2, H + r * (0.75 - t * 0.25), r, planet, t * 5);
    // lander
    const y = H * (0.05 + Math.min(1, t * 1.15) * 0.62);
    const x = W / 2;
    ctx.save(); ctx.translate(x, y);
    const s = Math.min(W, H) * 0.08;
    if (t < 0.85) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(Sprites.glow('#ffb04a'), -s * 0.6, s * 0.3, s * 1.2, s * (1.6 + Math.random() * 0.4));
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.fillStyle = '#e8ebf0'; ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.6, s * 0.2); ctx.lineTo(s * 0.4, s * 0.5); ctx.lineTo(-s * 0.4, s * 0.5); ctx.lineTo(-s * 0.6, s * 0.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = planet.accent; ctx.fillRect(-s * 0.3, -s * 0.05, s * 0.6, s * 0.15);
    ctx.strokeStyle = '#9aa0aa'; ctx.lineWidth = s * 0.08; ctx.beginPath(); ctx.moveTo(-s * 0.4, s * 0.5); ctx.lineTo(-s * 0.7, s * 0.85); ctx.moveTo(s * 0.4, s * 0.5); ctx.lineTo(s * 0.7, s * 0.85); ctx.stroke();
    ctx.restore();
    if (t > 0.72) { ctx.fillStyle = Col.rgba(planet.particle, Math.min(0.5, (t - 0.72) * 2)); ctx.beginPath(); ctx.ellipse(x, y + s, s * (2 + (t - 0.72) * 14), s * 0.6, 0, 0, Math.PI * 2); ctx.fill(); }
    text.innerHTML = 'Landung auf ' + esc(planet.name) + '<small>' + esc(planet.desc) + '</small>';
    text.style.opacity = String(U.clamp(t * 3 - 0.3, 0, 1));
  },
  drawRebirth(ctx, W, H, t, planet, text) {
    const old = DATA.planet(App.g ? App.g.run.planet : 1);
    if (t < 0.3) {
      const k = t / 0.3;
      FX.drawStars(ctx, W, H, t * 5);
      const r = Math.max(W, H) * (1.2 - k * 1.05);
      FX.drawPlanet(ctx, W / 2, H * 0.5 + r * 0.6 * (1 - k) + k * H * 0.2, Math.max(20, r), old, t * 5);
      const sy = H * (0.6 - k * 0.7);
      ctx.fillStyle = '#e8ebf0'; ctx.beginPath(); ctx.moveTo(W / 2, sy - 30); ctx.lineTo(W / 2 + 16, sy + 12); ctx.lineTo(W / 2 - 16, sy + 12); ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(Sprites.glow('#7fd3ff'), W / 2 - 20, sy + 8, 40, 60); ctx.globalCompositeOperation = 'source-over';
      text.innerHTML = 'Start von ' + esc(old.name);
    } else if (t < 0.7) {
      const k = (t - 0.3) / 0.4;
      FX.drawStars(ctx, W, H, t * 10, 0, 0.15 + Math.sin(k * Math.PI) * 0.9);
      ctx.fillStyle = 'rgba(120,160,255,' + (Math.sin(k * Math.PI) * 0.18) + ')'; ctx.fillRect(0, 0, W, H);
      text.innerHTML = 'Hyperraum<small>Rebirth-Punkte werden gutgeschrieben</small>';
    } else {
      const k = (t - 0.7) / 0.3;
      FX.drawStars(ctx, W, H, t * 5);
      const r = Math.max(W, H) * (0.1 + k * 0.9);
      FX.drawPlanet(ctx, W / 2, H / 2 + r * 0.6 * k, r, planet, t * 5);
      text.innerHTML = 'Ankunft: ' + esc(planet.name) + '<small>' + esc(planet.desc) + (planet.special ? ' · ' + esc(DATA.PLANET_SPECIALS[planet.special].desc) : '') + '</small>';
    }
    text.style.opacity = '1';
  },

  // ---------------- dialogs ----------------
  luckyStart(g) {
    const luck = g.world.start.luck;
    const best = g.world.start.deposits.reduce((a, d) => d.tier > a.tier ? d : a, g.world.start.deposits[0]);
    const tier = luck === 0 ? 0 : best.tier;
    const col = DATA.TIERS[tier].color;
    const names = ['Normalstart', 'Guter Start!', 'Jackpot!', 'Wunder-Start!!'];
    const subs = ['Ein solider Anfang: In der Nähe liegen gewöhnliche Vorkommen.', 'In der Nähe liegt ein seltenes oder episches Vorkommen.', 'Ein legendäres oder mythisches Vorkommen liegt ganz in der Nähe!', 'Unfassbar: Ein exotisches oder exquisites Vorkommen wartet auf dich!'];
    const m = h('div', { class: 'modal small' },
      h('div', { class: 'modal-body lucky' },
        h('div', { class: 'muted', text: 'Glücksstart' }),
        h('div', { class: 'tierword', style: { color: col, textShadow: '0 0 24px ' + col }, text: names[luck] }),
        h('p', { text: subs[luck] }),
        luck > 0 ? h('p', { html: 'Fund: <b style="color:' + col + '">' + esc(DATA.RESOURCES[best.res].name) + '</b> (' + DATA.TIERS[best.tier].name + ')' }) : null),
      h('div', { class: 'modal-foot' }, h('button', { class: 'btn accent', onclick: () => UI.closeModal() }, 'Los geht\'s')));
    UI.openModal(m);
    if (luck >= 2) { Audio2.play('unlock'); Progression.unlock(g, 'jackpot'); } else Audio2.play('found');
    if (luck > 0) Render.edgeMarks.push({ x: best.x + 0.5, y: best.y + 0.5, color: col, label: DATA.RESOURCES[best.res].name, at: App.now + 20000 });
  },
  welcomeBack(rep, onCollect) {
    const capped = rep.seconds >= CONFIG.offlineMax - 1;
    const num = h('div', { class: 'welcome-num', text: '+0 ' + CURRENCY_SHORT });
    const mined = rep.mined.map((v, t) => v >= 1 ? '<span style="color:' + DATA.TIERS[t].color + '">' + DATA.TIERS[t].name + '</span><b>' + Fmt.int(v) + '</b>' : '').join('');
    const m = h('div', { class: 'modal small' },
      h('div', { class: 'modal-head' }, h('h2', { text: 'Willkommen zurück!' })),
      h('div', { class: 'modal-body' },
        h('p', { html: 'Du warst <b' + (capped ? ' style="color:var(--warn)"' : '') + '>' + Fmt.time(rep.seconds) + '</b> offline' + (capped ? ' (Maximum von 8:00:00 erreicht)' : '') + '. Dein Außenposten hat weitergearbeitet:' }),
        num,
        mined ? h('div', { class: 'kv', html: mined }) : h('p', { class: 'muted', text: 'Es wurde nichts abgebaut. Tipp: Extraktoren brauchen eine vollständige Kette bis zu Lager oder Verkauf.' }),
        rep.storageLimited ? h('p', { html: '<span class="tag warn">Lager voll</span> Ein Teil der Produktion stand still, weil Lager voll waren. Lager-Upgrades helfen.' }) : null,
        h('p', { class: 'muted', text: 'Offline gilt der Durchschnittspreis, Events und Verträge pausieren.' })),
      h('div', { class: 'modal-foot' }, h('button', { class: 'btn accent big', onclick: () => { UI.closeModal(); } }, 'Einsammeln')));
    UI.openModal(m, { sticky: true, onClose: onCollect });
    const t0 = performance.now();
    const anim = () => {
      const k = U.clamp((performance.now() - t0) / 1400, 0, 1);
      const e = 1 - Math.pow(1 - k, 3);
      num.textContent = '+' + Fmt.num(rep.earned * e) + ' ' + CURRENCY_SHORT;
      if (k < 1 && num.isConnected) requestAnimationFrame(anim);
    };
    requestAnimationFrame(anim);
  }
};

// ===== src/app/99_main.js =====
// =====================================================================
// MainLoop: boot, title, game start, fixed-step loop, saving, offline, events
// =====================================================================
const MainLoop = {
  acc: 0, last: 0, catchup: 0, fpsT: 0, fpsN: 0, lowFor: 0, saveTimer: 0, hiddenAt: 0,
  step: 1 / CONFIG.tickRate,

  boot() {
    App.loadSettings();
    App.touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    document.body.classList.toggle('touch', App.touch);
    Render.init($('#game'));
    Input.init();
    UI.init();
    window.addEventListener('resize', () => { Render.resize(); });
    window.addEventListener('orientationchange', () => setTimeout(Render.resize, 200));
    document.addEventListener('visibilitychange', MainLoop.onVisibility);
    window.addEventListener('pagehide', () => MainLoop.save(false));
    window.addEventListener('beforeunload', () => MainLoop.save(false));
    $('#title-name').textContent = GAME_TITLE;
    document.title = GAME_TITLE;
    $('#title-version').textContent = 'Version ' + GAME_VERSION + ' · ' + CURRENCY_NAME;
    if (!Save.storage()) UI.toast('Hinweis: Speichern ist in diesem Browser nicht möglich. Du kannst trotzdem spielen.', 'bad', 6000);
    const hasSave = !!(Save.read(Save.KEY) || Save.read(Save.BACKUP));
    $('#btn-continue').classList.toggle('hidden', !hasSave);
    $('#btn-continue').onclick = () => { Audio2.start(); MainLoop.continueGame(); };
    $('#btn-new').onclick = () => {
      Audio2.start();
      if (hasSave) UI.confirm('Neues Spiel?', 'Dein bisheriger Spielstand wird überschrieben (ein Backup bleibt erhalten, bis du erneut speicherst).', 'Neues Spiel', MainLoop.newGame, true);
      else MainLoop.newGame();
    };
    $('#btn-title-settings').onclick = () => MainLoop.titleSettings();
    FX.startTitle();
    requestAnimationFrame(MainLoop.frame);
  },

  titleSettings() {
    const m = h('div', { class: 'modal small' }, h('div', { class: 'modal-head' }, h('h2', { text: 'Einstellungen' }), h('button', { class: 'icon-btn small', onclick: () => UI.closeModal() }, '✕')));
    const body = h('div', { class: 'modal-body' });
    m.append(body);
    UI.openModal(m);
    const fakeBody = body;
    const prevG = App.g;
    if (!prevG) {
      // settings that do not need a running game
      const s = App.settings;
      const mk = (label, key) => { const el = h('div', { class: 'switch' + (s[key] ? ' on' : '') }); el.onclick = () => { s[key] = !s[key]; el.classList.toggle('on', s[key]); App.saveSettings(); }; fakeBody.append(h('div', { class: 'set-row' }, h('label', { text: label }), el)); };
      mk('Ton an', 'sound'); mk('Reduzierte Effekte', 'reducedFx'); mk('Tag/Nacht-Zyklus', 'dayNight'); mk('Wetter', 'weather');
      const io = h('textarea', { class: 'io', placeholder: 'Exportierten Spielstand hier einfügen …' });
      fakeBody.append(h('h3', { text: 'Spielstand importieren' }), io, h('div', { class: 'ip-actions' }, h('button', { class: 'btn accent', onclick: () => MainLoop.importSave(io.value) }, 'Importieren')));
    }
  },

  newGame() {
    UI.closeModal();
    const meta = Game.createMeta();
    const g = Game.create(meta, 1);
    MainLoop.hideTitle();
    const go = () => { MainLoop.start(g, { fresh: true }); MainLoop.save(true); };
    if (!App.settings.reducedFx) FX.sequence('land', g.world.planet, go); else go();
    meta.introSeen = true;
  },
  continueGame() {
    const loaded = Save.load();
    if (!loaded) { UI.toast('Spielstand konnte nicht geladen werden. Starte ein neues Spiel.', 'bad', 5000); MainLoop.newGame(); return; }
    MainLoop.hideTitle();
    if (loaded.fromBackup) UI.toast('Hauptspeicher beschädigt, Backup geladen.', 'bad', 5000);
    MainLoop.start(loaded.game, { camera: loaded.camera });
    const now = Date.now();
    const gap = (now - loaded.lastSeen) / 1000;
    if (gap > CONFIG.offlineMin) MainLoop.offlineFor(gap);
    else if (gap > 0) MainLoop.catchup += gap;
  },
  hideTitle() { $('#screen-title').classList.add('hidden'); cancelAnimationFrame(FX.titleLoop); },

  start(g, opts = {}) {
    App.g = g;
    Items.live = 0;
    UI.select(null);
    Build.exit();
    App.blueprint = null;
    Render.setPlanet(g.world.planet);
    MapView.cellCache.clear();
    Render.particles.length = 0; Render.floating.length = 0; Render.edgeMarks.length = 0;
    App.cam.x = g.run.player.x; App.cam.y = g.run.player.y; App.cam.follow = true;
    App.cam.zoom = opts.camera && opts.camera.zoom ? U.clamp(opts.camera.zoom, CONFIG.zoomMin, CONFIG.zoomMax) : CONFIG.zoomDefault;
    UI.moneyShown = g.run.money;
    UI.updateCenterBtn();
    App.running = true;
    MainLoop.acc = 0; MainLoop.last = 0;
    Audio2.setPlanet(g.run.planet);
    $('#planet-name').textContent = g.world.planet.name;
    if (!g.run.startShown) { g.run.startShown = true; setTimeout(() => FX.luckyStart(g), 400); }
    if (!g.meta.tutorial.done) setTimeout(() => Tutorial.start(), opts.fresh ? 1200 : 300);
    else Tutorial.active = false;
    if (App.debug.open) Debug.show();
  },

  // ---------------- main loop ----------------
  frame(ts) {
    requestAnimationFrame(MainLoop.frame);
    App.now = ts;
    const g = App.g;
    if (!g || !App.running) { MainLoop.last = ts; return; }
    let dt = MainLoop.last ? (ts - MainLoop.last) / 1000 : 0;
    MainLoop.last = ts;
    if (dt > 0.25) { MainLoop.catchup += dt - 0.25; dt = 0.25; }
    const t0 = performance.now();
    Input.updateMovement(g);
    // fixed-step simulation (paused while a modal is open only for the first-run dialogs, never otherwise)
    MainLoop.acc += dt * App.timeScale;
    // spread online catch-up over several frames
    if (MainLoop.catchup > 0) { const take = Math.min(MainLoop.catchup, 5); MainLoop.catchup -= take; MainLoop.acc += take; }
    const maxTicks = App.timeScale > 1 ? 400 : 120;
    let n = 0;
    const s0 = performance.now();
    while (MainLoop.acc >= MainLoop.step && n < maxTicks) { Game.tick(g); MainLoop.acc -= MainLoop.step; n++; }
    if (n >= maxTicks && MainLoop.acc >= MainLoop.step) {
      // too far behind for one frame: real-time backlog is caught up over the next frames, time-lapse excess is dropped
      if (App.timeScale === 1) MainLoop.catchup += MainLoop.acc - MainLoop.step;
      MainLoop.acc = MainLoop.step * 0.5;
    }
    App.debug.simMs = (performance.now() - s0) / Math.max(1, n);
    const alpha = U.clamp(MainLoop.acc / MainLoop.step, 0, 1);
    App.alpha = alpha;
    MainLoop.handleEvents(g);
    Tutorial.tick(g);
    Input.updateCamera(g, dt, alpha);
    Frame.draw(g, alpha, dt);
    UI.updateHud(dt);
    if (App.mode === 'build' && App.ghost) UI.updateGhostInfo();
    MapView.drawMini(g);
    // autosave
    MainLoop.saveTimer += dt;
    if (MainLoop.saveTimer >= CONFIG.autosaveInterval) { MainLoop.saveTimer = 0; MainLoop.save(false); }
    // performance monitor
    MainLoop.perf(dt, performance.now() - t0);
  },
  perf(dt, ms) {
    MainLoop.fpsN++; MainLoop.fpsT += dt;
    if (MainLoop.fpsT >= 1) {
      App.debug.fps = MainLoop.fpsN / MainLoop.fpsT;
      App.debug.frameMs = ms;
      MainLoop.fpsN = 0; MainLoop.fpsT = 0;
      if (App.debug.open) Debug.updateStats();
      if (App.settings.quality === 'auto' && !document.hidden) {
        if (App.debug.fps < 40) MainLoop.lowFor++; else MainLoop.lowFor = Math.max(0, MainLoop.lowFor - 1);
        if (MainLoop.lowFor >= 5 && App.quality !== 'low') {
          App.quality = App.quality === 'high' ? 'medium' : 'low';
          MainLoop.lowFor = 0;
          Render.chunks.clear();
          UI.toast('Grafikqualität automatisch auf „' + (App.quality === 'medium' ? 'Mittel' : 'Niedrig') + '“ gesenkt, um flüssig zu bleiben.');
        }
      }
    }
  },

  // ---------------- simulation events -> UI feedback ----------------
  handleEvents(g) {
    const evs = g.events;
    if (!evs.length) return;
    for (const e of evs) {
      switch (e.type) {
        case 'sale': {
          const b = e.b;
          Audio2.play('sell', e.entry.tier);
          Render.float('+' + Fmt.num(e.entry.rev) + ' ' + CURRENCY_SHORT, b.x + b.w / 2, b.y - 0.2, e.entry.ok ? '#7dff8a' : '#d8ffd8');
          if (!App.settings.reducedFx) for (let i = 0; i < 6 + e.entry.tier * 2; i++) Render.spawn('coin', b.x + b.w / 2, b.y + b.h / 2, (Math.random() - 0.5) * 3, -2 - Math.random() * 2, 0.9, '#ffd24a', 0.12);
          break;
        }
        case 'tip': Audio2.play('coin'); Render.float('+' + Fmt.num(e.tp.value) + ' Trinkgeld', e.tp.x, e.tp.y, '#ffd24a'); break;
        case 'codex': {
          const R = DATA.RESOURCES[e.res];
          UI.toast('Neu im Kodex: <b style="color:' + DATA.TIERS[R.tier].color + '">' + esc(R.name) + '</b> (' + DATA.TIERS[R.tier].name + ')', R.tier >= 2 ? 'gold' : 'good');
          if (R.tier >= 2) Audio2.play('found');
          break;
        }
        case 'tier':
          UI.toast('Kundenstufe ' + (e.tier + 1) + ' freigeschaltet: <b>' + esc(DATA.CUSTOMERS[e.tier].plural) + '</b>! Baue ' + esc(DATA.BUILDINGS[DATA.CUSTOMERS[e.tier].building].name) + '.', 'gold', 6000);
          Audio2.play('unlock');
          UI.refreshBuildBar(true);
          break;
        case 'research': UI.toast('Forschung abgeschlossen: <b>' + esc(DATA.RESEARCH_BY_ID[e.id].name) + '</b>', 'good', 4500); Audio2.play('unlock'); UI.refreshBuildBar(true); break;
        case 'eventStart': {
          const R = DATA.RESOURCES[e.ev.res];
          UI.toast(e.ev.pos ? e.ev.who + ' sucht <b>' + esc(R.name) + '</b>: ×' + Fmt.dec(e.ev.mult, 1) + ' für ' + Fmt.time(e.ev.end - e.ev.start) : 'Überangebot an <b>' + esc(R.name) + '</b>: ×' + Fmt.dec(e.ev.mult, 1) + ' für ' + Fmt.time(e.ev.end - e.ev.start), e.ev.pos ? 'gold' : 'bad', 5000);
          Audio2.play('event');
          break;
        }
        case 'contractNew': UI.toast('Neuer Planeten-Vertrag von <b>' + esc(e.c.planet) + '</b>', 'gold'); Audio2.play('event'); break;
        case 'contractDone': UI.toast('Vertrag mit ' + esc(e.c.planet) + ' erfüllt! Bonus ' + Fmt.money(e.bonus) + (e.rp ? ' und +1 Rebirth-Punkt beim nächsten Rebirth' : ''), 'gold', 5000); Audio2.play('unlock'); break;
        case 'contractFail': UI.toast('Vertrag mit ' + esc(e.c.planet) + ' ist abgelaufen.', 'bad'); break;
        case 'achievement': { const a = DATA.ACH_BY_ID[e.id]; UI.toast('🏆 Erfolg: <b>' + esc(a.name) + '</b> (+' + Fmt.dec(a.bonus * 100, 1) + ' % Erlös)', 'gold', 4500); Audio2.play('unlock'); break; }
        case 'warn': {
          const b = e.b;
          const name = DATA.BUILDINGS[b.type].name;
          if (e.kind === 'blocked') UI.toast(name + ' blockiert bei ' + b.x + ', ' + b.y + ': Ausgang voll.', 'bad');
          else if (e.kind === 'full') UI.toast('Lager voll bei ' + b.x + ', ' + b.y + '.', 'bad');
          else if (e.kind === 'nearfull') UI.toast('Lager bei ' + b.x + ', ' + b.y + ' zu 90 % gefüllt.', '');
          Audio2.play('warn');
          break;
        }
        case 'depositSeen':
          if (e.d.tier >= 3) { UI.toast('Seltenes Vorkommen gesichtet: <b style="color:' + DATA.TIERS[e.d.tier].color + '">' + esc(DATA.RESOURCES[e.d.res].name) + '</b>', 'gold'); Audio2.play('found'); }
          break;
      }
    }
    evs.length = 0;
  },

  // ---------------- saving ----------------
  save(manual) {
    const g = App.g;
    if (!g || !App.running) return;
    const dot = $('#save-dot');
    dot.className = 'save-dot saving';
    const res = Save.write(g, { lastSeen: Date.now(), camera: { zoom: App.cam.zoom } });
    setTimeout(() => { dot.className = 'save-dot ' + (res.ok ? 'saved' : 'error'); }, 150);
    dot.title = res.ok ? 'Gespeichert ' + new Date().toLocaleTimeString('de-DE') : res.err;
    if (!res.ok && !MainLoop.saveWarned) { MainLoop.saveWarned = true; UI.toast('Speichern fehlgeschlagen: ' + res.err + '. Du kannst weiterspielen, nutze den Export als Sicherung.', 'bad', 6000); }
    if (res.ok && (manual || App.settings.autosaveToast)) UI.toast('Spiel gespeichert', 'good', 1500);
  },
  onVisibility() {
    if (!App.g || !App.running) return;
    if (document.hidden) { MainLoop.hiddenAt = Date.now(); MainLoop.save(false); return; }
    if (!MainLoop.hiddenAt) return;
    const gap = (Date.now() - MainLoop.hiddenAt) / 1000;
    MainLoop.hiddenAt = 0;
    MainLoop.last = 0;
    if (gap <= 0) return; // clock went backwards: ignore
    if (gap <= CONFIG.onlineCatchup) MainLoop.catchup += gap;
    else MainLoop.offlineFor(gap);
  },
  offlineFor(seconds) {
    const g = App.g;
    seconds = Math.min(seconds, CONFIG.offlineMax);
    if (seconds <= 0) return;
    const t0 = performance.now();
    const rep = Offline.simulate(g, seconds);
    const ms = performance.now() - t0;
    if (App.debug.open) UI.toast('Offline-Berechnung: ' + ms.toFixed(0) + ' ms');
    MainLoop.catchup = 0; MainLoop.acc = 0;
    FX.welcomeBack(rep, () => {
      Offline.apply(g, rep);
      UI.moneyShown = g.run.money - rep.earned;
      Audio2.play('sell', 3);
      MainLoop.save(false);
    });
  },
  importSave(text) {
    let parsed;
    try { parsed = Save.parseImport(text); }
    catch (e) { UI.toast('Import fehlgeschlagen: ' + esc(e.message || 'ungültiger Text') + '. Dein Spielstand bleibt unverändert.', 'bad', 6000); Audio2.play('error'); return; }
    if (!Save.writeRaw(parsed.obj)) { UI.toast('Import geprüft, aber Speichern nicht möglich. Spiel wird trotzdem geladen.', 'bad'); }
    UI.closeModal();
    MainLoop.hideTitle();
    MainLoop.start(parsed.loaded.game, { camera: parsed.loaded.camera });
    UI.toast('Spielstand importiert', 'good');
  },
  restoreBackup() {
    const o = Save.read(Save.BACKUP);
    if (!o) { UI.toast('Kein Backup vorhanden', 'bad'); return; }
    UI.confirm('Backup laden?', 'Der vorherige automatische Spielstand wird geladen. Der aktuelle Stand wird zum neuen Backup.', 'Backup laden', () => {
      try { const l = Save.fromObject(o); Save.writeRaw(o); MainLoop.start(l.game, { camera: l.camera }); UI.toast('Backup geladen', 'good'); }
      catch (e) { UI.toast('Backup beschädigt', 'bad'); }
    });
  },
  wipeSave() {
    UI.confirm('Spielstand löschen?', 'Alles geht verloren: Planeten, Rebirth-Punkte, Kodex und Statistiken.', 'Weiter', () => {
      UI.confirm('Wirklich endgültig löschen?', 'Dieser Schritt kann nicht rückgängig gemacht werden.', 'Endgültig löschen', () => {
        App.running = false;
        Save.wipe();
        location.reload();
      }, true);
    }, true);
  },
  doRebirth(target) {
    const g = App.g;
    MainLoop.save(false);
    const res = Game.rebirth(g, target);
    if (!res) { UI.toast('Rebirth nicht möglich', 'bad'); return; }
    UI.closeModal();
    App.running = false;
    FX.sequence('rebirth', res.game.world.planet, () => {
      MainLoop.start(res.game, { fresh: true });
      UI.toast('Rebirth abgeschlossen: +' + res.gained + ' Rebirth-Punkte. Multiplikator ×' + Fmt.dec(res.game.mods.rebirthMult, 2), 'gold', 6000);
      MainLoop.save(true);
    });
  },
  teleport(x, y, label) {
    const g = App.g;
    const scr = $('#screen-fx');
    const cv = $('#fx-canvas');
    scr.classList.remove('hidden');
    scr.querySelector('.fx-text').innerHTML = label || 'Teleport';
    scr.querySelector('.fx-skip').classList.add('hidden');
    const ctx = cv.getContext('2d');
    const d = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    let t0 = null;
    const loop = ts => {
      if (t0 === null) t0 = ts;
      const k = (ts - t0) / 900;
      ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.fillStyle = '#05030a'; ctx.fillRect(0, 0, innerWidth, innerHeight);
      FX.drawStars(ctx, innerWidth, innerHeight, k, 0, Math.sin(Math.min(1, k) * Math.PI) * 0.8);
      if (k < 1) { requestAnimationFrame(loop); return; }
      g.run.player.x = x; g.run.player.y = y; g.run.player.px = x; g.run.player.py = y;
      App.cam.x = x; App.cam.y = y; App.cam.follow = true; UI.updateCenterBtn();
      g.lastCell = null;
      scr.classList.add('hidden');
      scr.querySelector('.fx-skip').classList.remove('hidden');
    };
    requestAnimationFrame(loop);
  }
};

// Small handle for automated tests and power users (read-only use recommended).
window.__AO__ = { App, Game, Grid, World, Build, UI, Render, Economy, Save, Offline, Progression, MainLoop, Menus, MapView, Bot, SelfTest, Actions, DATA, CONFIG };
MainLoop.boot();

})();

</script>
