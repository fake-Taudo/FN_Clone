    const has = d => { const o = Grid.at(g, b.x + U.DX[d], b.y + U.DY[d]); return o && o.type === 'path'; };
    ctx.fillRect(x + 0.15, y + 0.15, 0.7, 0.7);
    if (has(0)) ctx.fillRect(x + 0.5, y + 0.15, 0.5, 0.7);
    if (has(2)) ctx.fillRect(x, y + 0.15, 0.5, 0.7);
    if (has(1)) ctx.fillRect(x + 0.15, y + 0.5, 0.7, 0.5);
    if (has(3)) ctx.fillRect(x + 0.15, y, 0.7, 0.5);
    ctx.fillStyle = col;
    for (let i = 0; i < 4; i++) { const px = x + 0.22 + (i % 2) * 0.32, py = y + 0.22 + (i >> 1) * 0.32; Render.roundRect(ctx, px, py, 0.26, 0.26, 0.06); ctx.fill(); }
  },
  fence(ctx, g, b, x, y) {
    const col = b.level >= 2 ? '#d0d6de' : DATA.BUILDINGS.fence.color;
    const has = d => { const o = Grid.at(g, b.x + U.DX[d], b.y + U.DY[d]); return o && o.type === 'fence'; };
    ctx.strokeStyle = col; ctx.lineWidth = 0.08; ctx.lineCap = 'round';
    ctx.beginPath();
    if (has(0)) { ctx.moveTo(x + 0.5, y + 0.45); ctx.lineTo(x + 1, y + 0.45); }
    if (has(2)) { ctx.moveTo(x, y + 0.45); ctx.lineTo(x + 0.5, y + 0.45); }
    if (has(1)) { ctx.moveTo(x + 0.5, y + 0.45); ctx.lineTo(x + 0.5, y + 1); }
    if (has(3)) { ctx.moveTo(x + 0.5, y); ctx.lineTo(x + 0.5, y + 0.45); }
    ctx.stroke();
    ctx.fillStyle = Col.shade(col, -0.3); ctx.fillRect(x + 0.42, y + 0.3, 0.16, 0.3);
  },

  // ---------------- sellers ----------------
  seller(ctx, g, b, x, y) {
    const t = SELLER_TIER[b.type];
    const def = DATA.BUILDINGS[b.type];
    const tm = Draw.tm;
    if (t === 0) {
      Draw.shadow(ctx, x + 0.1, y + 0.1, b.w - 0.2, b.h - 0.2);
      Draw.body(ctx, x + 0.1, y + 0.4, b.w - 0.2, b.h - 0.5, '#6a4a2a', 0.15);
      // awning stripes
      const horiz = b.w >= b.h;
      ctx.save(); Render.roundRect(ctx, x + 0.05, y + 0.05, b.w - 0.1, horiz ? 0.75 : b.h - 0.1, 0.15); ctx.clip();
      const n = Math.ceil((horiz ? b.w : b.h) / 0.5);
      for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? '#fff3d6' : (b.level >= 3 ? '#d84fc0' : def.color); if (horiz) ctx.fillRect(x + i * 0.5, y, 0.5, 0.8); else ctx.fillRect(x, y + i * 0.5, b.w, 0.5); }
      ctx.restore();
      // goods on the counter
      let i = 0;
      for (const [k] of b.shelf) { if (i >= 4) break; Draw.item(ctx, k >> 2, k & 3, x + 0.55 + i * 0.6, y + b.h - 0.45, 0.18); i++; }
    } else if (t === 1) {
      Draw.shadow(ctx, x + 0.1, y + 0.1, b.w - 0.2, b.h - 0.2);
      Draw.body(ctx, x + 0.1, y + 0.1, b.w - 0.2, b.h - 0.2, '#b08a5a', 0.3);
      ctx.fillStyle = '#d8b880'; Render.roundRect(ctx, x + 0.5, y + 0.5, b.w - 1, b.h - 1, 0.2); ctx.fill();
      // tents
      for (let i = 0; i < 2; i++) {
        const tx = x + 0.9 + i * 1.6, ty = y + 0.9;
        ctx.fillStyle = i ? def.color : '#e05a3a';
        ctx.beginPath(); ctx.moveTo(tx, ty + 0.9); ctx.lineTo(tx + 0.6, ty); ctx.lineTo(tx + 1.2, ty + 0.9); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.moveTo(tx + 0.6, ty); ctx.lineTo(tx + 1.2, ty + 0.9); ctx.lineTo(tx + 0.6, ty + 0.9); ctx.closePath(); ctx.fill();
      }
      let i = 0;
      for (const [k] of b.shelf) { if (i >= 5) break; Draw.item(ctx, k >> 2, k & 3, x + 0.8 + i * 0.6, y + b.h - 0.75, 0.2); i++; }
    } else if (t === 5) {
      Draw.shadow(ctx, x + 0.2, y + 0.2, b.w - 0.4, b.h - 0.4, 0.6);
      Draw.body(ctx, x + 0.2, y + 0.2, b.w - 0.4, b.h - 0.4, '#2a1a34', 0.6);
      Draw.body(ctx, x + 1, y + 1, b.w - 2, b.h - 2, '#3e2850', 0.5);
      // holo screen
      const p = 0.6 + 0.2 * Math.sin(tm * 2);
      ctx.fillStyle = Col.rgba('#ff5fa8', 0.25 * p); Render.roundRect(ctx, x + 1.5, y + 1.5, b.w - 3, 2.2, 0.2); ctx.fill();
      ctx.strokeStyle = Col.rgba('#ff9fd0', 0.8); ctx.lineWidth = 0.06; ctx.stroke();
      ctx.fillStyle = '#ffd0ea'; ctx.font = '700 ' + Math.max(0.55, 12 / App.cam.zoom) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(g.run.contracts.length + ' Verträge', x + b.w / 2, y + 2.6);
      for (let i = 0; i < 3; i++) { ctx.fillStyle = '#8a6aa8'; ctx.beginPath(); ctx.arc(x + 1.8 + i * 1.7, y + b.h - 1.4, 0.45, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = Col.rgba('#ff5fa8', 0.5 + 0.5 * Math.sin(tm * 3 + i)); ctx.beginPath(); ctx.arc(x + 1.8 + i * 1.7, y + b.h - 1.4, 0.15, 0, Math.PI * 2); ctx.fill(); }
    } else {
      // landing pads (shuttle / port / dock)
      const cx = x + b.w / 2, cy = y + b.h / 2, r = b.w / 2 - 0.3;
      Draw.shadow(ctx, x + 0.2, y + 0.2, b.w - 0.4, b.h - 0.4, 0.8);
      Draw.body(ctx, x + 0.15, y + 0.15, b.w - 0.3, b.h - 0.3, '#3a3f48', 0.8);
      ctx.fillStyle = '#545a66'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = def.color; ctx.lineWidth = 0.14; ctx.beginPath(); ctx.arc(cx, cy, r - 0.3, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 0.22;
      const s = r * 0.35;
      ctx.beginPath(); ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx - s, cy + s); ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx + s, cy + s); ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy); ctx.stroke();
      const nl = 8 + t * 2;
      for (let i = 0; i < nl; i++) {
        const a = i / nl * Math.PI * 2;
        const on = Math.floor(tm * 4) % nl === i;
        ctx.fillStyle = on ? '#fff6a0' : Col.shade(def.color, -0.2);
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (r - 0.05), cy + Math.sin(a) * (r - 0.05), 0.1 + (on ? 0.04 : 0), 0, Math.PI * 2); ctx.fill();
      }
      if (t >= 3) { // control tower and cranes
        Draw.body(ctx, x + 0.3, y + 0.3, 1.2, 1.2, '#6a6f7a', 0.2);
        ctx.fillStyle = '#9fe0ff'; ctx.fillRect(x + 0.5, y + 0.5, 0.8, 0.35);
      }
      if (t >= 4) {
        ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 0.25;
        ctx.beginPath(); ctx.moveTo(x + b.w - 0.6, y + 0.6); ctx.lineTo(x + b.w - 0.6, y + b.h - 0.6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + b.w - 0.6, y + 1.5 + Math.sin(tm * 0.6) * 2); ctx.lineTo(x + b.w - 3, y + 1.5 + Math.sin(tm * 0.6) * 2); ctx.stroke();
      }
      // shelf crates
      let i = 0;
      for (const [k] of b.shelf) { if (i >= 6) break; Draw.item(ctx, k >> 2, k & 3, x + 0.6 + (i % 3) * 0.55, y + b.h - 0.6 - Math.floor(i / 3) * 0.55, 0.2); i++; }
    }
    Draw.levelTag(ctx, b, x, y);
  },

  // Customers: aliens, caravans, shuttles, ships, freighters.
  slotPos(b, slot) {
    const tier = SELLER_TIER[b.type];
    if (tier === 0) return [b.x + 0.6 + slot * ((b.w - 1.2) / 2), b.y + b.h + 0.55];
    if (tier === 1) return [b.x + b.w / 2, b.y + b.h + 0.8];
    return [b.x + b.w / 2, b.y + b.h / 2];
  },
  customers(ctx, g, b) {
    const tm = Draw.tm;
    for (const c of b.customers) {
      const [px, py] = Draw.slotPos(b, c.slot % 3);
      let x, y, k = 1;
      if (c.state === 'in') { k = U.clamp(c.t / c.arrive, 0, 1); }
      else if (c.state === 'out') { k = 1 - U.clamp(c.t / 3, 0, 1); }
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      if (c.tier <= 1) { x = c.sx + (px - c.sx) * e; y = c.sy + (py - c.sy) * e; }
      else { x = px; y = py; }
      const rx = x - Render.ox, ry = y - Render.oy;
      if (c.tier === 0) Draw.alien(ctx, rx, ry, c, tm, c.state !== 'wait');
      else if (c.tier === 1) Draw.caravan(ctx, rx, ry, c, tm, Math.atan2(py - c.sy, px - c.sx) + (c.state === 'out' ? Math.PI : 0));
      else Draw.ship(ctx, rx, ry, c.tier, 1 - e, tm);
      if (c.state === 'wait' && App.cam.zoom >= 16) Draw.bubble(ctx, rx, ry - (c.tier === 0 ? 1.1 : c.tier === 1 ? 1.2 : b.h / 2 + 0.6), c);
    }
  },
  skinCache: null,
  planetSkins() {
    const P = Render.palette;
    if (Draw.skinCache && Draw.skinCache.k === P.index) return Draw.skinCache.list;
    const base = ['#7be07a', '#b07aff', '#4ad0d8', '#ff9a5a', '#e0d050', '#ff7ab0'];
    const rot = P.index - 1;
    const list = base.map((c, i) => Col.mix(base[(i + rot) % base.length], P.accent, 0.25 + (P.index % 3) * 0.08));
    Draw.skinCache = { k: P.index, list };
    return list;
  },
  alien(ctx, x, y, c, tm, walking) {
    const skins = Draw.planetSkins();
    const col = skins[c.skin % skins.length];
    const bob = walking ? Math.abs(Math.sin(tm * 9 + c.skin)) * 0.08 : Math.sin(tm * 2 + c.skin) * 0.02;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y + 0.05, 0.28, 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(x, y - bob);
    // legs
    ctx.strokeStyle = Col.shade(col, -0.35); ctx.lineWidth = 0.08; ctx.lineCap = 'round';
    const sw = walking ? Math.sin(tm * 9 + c.skin) * 0.12 : 0;
    ctx.beginPath(); ctx.moveTo(-0.1, -0.2); ctx.lineTo(-0.1 + sw, 0); ctx.moveTo(0.1, -0.2); ctx.lineTo(0.1 - sw, 0); ctx.stroke();
    // body
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -0.42, 0.24, 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = Col.shade(col, -0.45); ctx.lineWidth = 0.04; ctx.stroke();
    // eyes
    const eyes = 1 + (c.skin % 3);
    for (let i = 0; i < eyes; i++) {
      const ex = (i - (eyes - 1) / 2) * 0.13;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, -0.5, 0.065, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex, -0.49, 0.032, 0, Math.PI * 2); ctx.fill();
    }
    // antennae
    ctx.strokeStyle = Col.shade(col, -0.3); ctx.lineWidth = 0.035;
    ctx.beginPath(); ctx.moveTo(-0.08, -0.7); ctx.lineTo(-0.15, -0.88); ctx.moveTo(0.08, -0.7); ctx.lineTo(0.15, -0.88); ctx.stroke();
    ctx.fillStyle = Col.shade(col, 0.3); ctx.beginPath(); ctx.arc(-0.15, -0.88, 0.04, 0, Math.PI * 2); ctx.arc(0.15, -0.88, 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  },
  caravan(ctx, x, y, c, tm, ang) {
    for (let i = 0; i < 3; i++) {
      const ox = x - Math.cos(ang) * i * 0.8, oy = y - Math.sin(ang) * i * 0.8;
      ctx.save(); ctx.translate(ox, oy); ctx.rotate(ang);
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0.05, 0.1, 0.38, 0.24, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = i === 0 ? '#c86a3a' : '#a8884a';
      ctx.beginPath(); ctx.ellipse(0, 0, 0.36, 0.22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 0.04; ctx.stroke();
      ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 0.05;
      const leg = Math.sin(tm * 12 + i) * 0.06;
      for (let s = -1; s <= 1; s += 2) for (let j = -1; j <= 1; j++) { ctx.beginPath(); ctx.moveTo(j * 0.15, s * 0.18); ctx.lineTo(j * 0.15 + leg * s, s * 0.32); ctx.stroke(); }
      if (i > 0) { ctx.fillStyle = '#e8d8a8'; ctx.fillRect(-0.18, -0.12, 0.3, 0.24); }
      ctx.restore();
    }
  },
  ship(ctx, x, y, tier, alt, tm) {
    const size = [0, 0, 1.6, 2.6, 4.0][tier] || 2;
    const sc = 1 + alt * 0.8;
    // shadow shrinks while landed
    ctx.fillStyle = 'rgba(0,0,0,' + (0.35 * (1 - alt * 0.6)).toFixed(2) + ')';
    ctx.beginPath(); ctx.ellipse(x + alt * 1.5, y + alt * 2, size * 0.7, size * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(x, y - alt * 3); ctx.scale(sc, sc);
    const body = tier === 2 ? '#e8e8f0' : tier === 3 ? '#c8d0e0' : '#9aa4b8';
    // engines glow
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(tm * 20);
    const gl = Sprites.glow('#7fd3ff');
    ctx.drawImage(gl, -size * 0.5, size * 0.25, size * 0.4, size * 0.6);
    ctx.drawImage(gl, size * 0.1, size * 0.25, size * 0.4, size * 0.6);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.6); ctx.lineTo(size * 0.32, -size * 0.1); ctx.lineTo(size * 0.6, size * 0.3); ctx.lineTo(size * 0.3, size * 0.4);
    ctx.lineTo(-size * 0.3, size * 0.4); ctx.lineTo(-size * 0.6, size * 0.3); ctx.lineTo(-size * 0.32, -size * 0.1); ctx.closePath();
    ctx.fill(); ctx.strokeStyle = '#3a4050'; ctx.lineWidth = 0.06; ctx.stroke();
    ctx.fillStyle = tier === 4 ? '#ff9a3d' : Render.palette.accent; ctx.fillRect(-size * 0.25, size * 0.05, size * 0.5, size * 0.12);
    ctx.fillStyle = '#5ac8ff'; ctx.beginPath(); ctx.ellipse(0, -size * 0.22, size * 0.12, size * 0.18, 0, 0, Math.PI * 2); ctx.fill();
    if (tier >= 4) { ctx.fillStyle = '#6a7488'; for (let i = 0; i < 3; i++) ctx.fillRect(-size * 0.2 + i * size * 0.14, size * 0.18, size * 0.1, size * 0.18); }
    ctx.restore();
  },
  bubble(ctx, x, y, c) {
    const w = c.wishes.find(w2 => w2.got < w2.qty) || c.wishes[0];
    if (!w) return;
    const s = Math.max(0.62, 26 / App.cam.zoom);
    const fs = Math.max(0.24, 12 / App.cam.zoom);
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    Render.roundRect(ctx, x - s, y - s * 0.6, s * 2, s * 1.2, 0.18); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 0.1, y + s * 0.6); ctx.lineTo(x, y + s * 0.6 + 0.18); ctx.lineTo(x + 0.1, y + s * 0.6); ctx.fill();
    if (w.res >= 0) Draw.item(ctx, w.res, w.ref, x - s * 0.45, y, s * 0.32);
    else { ctx.fillStyle = DATA.TIERS[w.tier].color; ctx.beginPath(); ctx.arc(x - s * 0.45, y, s * 0.26, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#222'; ctx.font = '700 ' + fs + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', x - s * 0.45, y + 0.01); }
    ctx.fillStyle = '#222'; ctx.font = '700 ' + fs + 'px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(Fmt.num(w.qty - w.got), x - s * 0.15, y - s * 0.13);
    // patience bar
    const pf = U.clamp(1 - c.t / c.patience, 0, 1);
    ctx.fillStyle = '#ddd'; ctx.fillRect(x - s * 0.15, y + s * 0.2, s * 1.0, s * 0.13);
    ctx.fillStyle = pf > 0.35 ? '#3ab54a' : '#e04a3a'; ctx.fillRect(x - s * 0.15, y + s * 0.2, s * 1.0 * pf, s * 0.13);
    if (c.buying > 0) { ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(x + s * 0.8, y - s * 0.45, 0.1, 0, Math.PI * 2); ctx.fill(); }
  },

  // ---------------- astronaut ----------------
  astronaut(ctx, g, x, y, tm) {
    const p = g.run.player;
    const moving = p.moving;
    const rover = g.run.research.done.has('rover') && moving;
    const face = p.face;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y + 0.05, rover ? 0.7 : 0.35, rover ? 0.25 : 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(x, y);
    if (rover) {
      ctx.save(); ctx.scale(face, 1);
      ctx.fillStyle = '#d8dde6'; Render.roundRect(ctx, -0.65, -0.45, 1.3, 0.4, 0.12); ctx.fill();
      ctx.strokeStyle = '#4a5060'; ctx.lineWidth = 0.05; ctx.stroke();
      ctx.fillStyle = Render.palette.accent; ctx.fillRect(-0.6, -0.32, 1.2, 0.08);
      ctx.fillStyle = '#2a2d33';
      for (const wx of [-0.42, 0.42]) { ctx.beginPath(); ctx.arc(wx, -0.05, 0.17, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      ctx.translate(0, -0.35);
    }
    const bob = moving && !rover ? Math.abs(Math.sin(tm * 10)) * 0.06 : Math.sin(tm * 2) * 0.015;
    ctx.translate(0, -bob);
    ctx.scale(face, 1);
    const sw = moving && !rover ? Math.sin(tm * 10) * 0.14 : 0;
    // legs
    ctx.strokeStyle = '#c8ccd4'; ctx.lineWidth = 0.13; ctx.lineCap = 'round';
    if (!rover) { ctx.beginPath(); ctx.moveTo(-0.08, -0.3); ctx.lineTo(-0.08 + sw, -0.03); ctx.moveTo(0.1, -0.3); ctx.lineTo(0.1 - sw, -0.03); ctx.stroke(); }
    // backpack
    ctx.fillStyle = '#9aa0aa'; Render.roundRect(ctx, -0.3, -0.72, 0.18, 0.42, 0.06); ctx.fill();
    // body
    ctx.fillStyle = '#f2f4f7'; Render.roundRect(ctx, -0.2, -0.7, 0.4, 0.46, 0.14); ctx.fill();
    ctx.strokeStyle = '#8a909a'; ctx.lineWidth = 0.035; ctx.stroke();
    ctx.fillStyle = Render.palette.accent; ctx.fillRect(-0.14, -0.55, 0.12, 0.08);
    // arm
    ctx.strokeStyle = '#e4e7ec'; ctx.lineWidth = 0.1;
    ctx.beginPath(); ctx.moveTo(0.05, -0.6); ctx.lineTo(0.12 - sw * 0.6, -0.38); ctx.stroke();
    // helmet
    ctx.fillStyle = '#f7f8fa'; ctx.beginPath(); ctx.arc(0.02, -0.88, 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8a909a'; ctx.lineWidth = 0.035; ctx.stroke();
    const vg = ctx.createLinearGradient(0, -1, 0.2, -0.75);
    vg.addColorStop(0, '#ffd08a'); vg.addColorStop(1, '#ff7a2a');
    ctx.fillStyle = vg; ctx.beginPath(); ctx.ellipse(0.08, -0.88, 0.13, 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(0.04, -0.92, 0.03, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // jetpack particles
    if (moving && !rover && !App.settings.reducedFx && Math.random() < 0.6) {
      Render.spawn('jet', g.run.player.x - face * 0.22, g.run.player.y - 0.35, -p.vx * 0.05 + (Math.random() - 0.5) * 0.3, 0.6 + Math.random() * 0.4, 0.35, '#ffb04a', 0.06);
    }
  },

  // Thumbnail for UI (build cards, info panel).
  thumbCache: new Map(),
  thumb(type, size = 56, opts = {}) {
    const key = type + '|' + size + '|' + (opts.grade || 0) + '|' + (opts.res === undefined ? '' : opts.res);
    const d = Math.min(2, window.devicePixelRatio || 1);
    let src = Draw.thumbCache.get(key);
    if (!src) {
      src = document.createElement('canvas');
      src.width = src.height = Math.round(size * d);
      const ctx = src.getContext('2d');
      const def = DATA.BUILDINGS[type];
      const w = type === 'bridge' ? 3 : def.w, hh = def.h;
      const scale = size * d / (Math.max(w, hh) + 0.6);
      ctx.setTransform(scale, 0, 0, scale, (size * d - w * scale) / 2, (size * d - hh * scale) / 2);
      const fake = { _thumb: true, type, x: 0, y: 0, rot: 0, w, h: hh, level: 1, grade: opts.grade || 0, items: [], buf: [], inBuf: [], outBuf: [], shelf: new Map(), store: new Map(), total: 0, customers: [], res: opts.res !== undefined ? opts.res : 0, tier: opts.res !== undefined ? DATA.RESOURCES[opts.res].tier : 0, outMask: 15, boost: 1, len: 3, queue: [], outEnabled: true, _sv: -1, shape: 0 };
      const saveOx = Render.ox, saveOy = Render.oy, saveZoom = App.cam.zoom;
      Render.ox = 0; Render.oy = 0; App.cam.zoom = 40;
      const fakeG = { topoVersion: -2, run: { research: { active: null }, contracts: [] }, mods: { siloCap: 1 } };
      try {
        if (type === 'bridge') { fake.rot = 0; Draw.bridge(ctx, { topoVersion: 0 }, fake, 0); }
        else if (type === 'belt') { fake._sv = -2; Draw.belt(ctx, fakeG, fake, 0, 0); }
        else Draw.building(ctx, fakeG, fake, 0, 0);
      } catch (e) { ctx.fillStyle = def.color; ctx.fillRect(0, 0, w, hh); }
      Render.ox = saveOx; Render.oy = saveOy; App.cam.zoom = saveZoom;
      Draw.thumbCache.set(key, src);
    }
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src, 0, 0);
    return c;
  }
};

// ===== src/app/05_frame.js =====
// =====================================================================
// Frame: draws one complete frame of the world
// =====================================================================
const LIGHT_TYPES = { lamp: ['#ffe28a', 2.6], beacon: ['#7fe0ff', 3], bazaar: ['#ffd28a', 3.5], caravan: ['#ffb070', 4], shuttlepad: ['#9fd8ff', 6], port: ['#9fd8ff', 8], dock: ['#ffd0a0', 10], terminal: ['#ff9fd0', 8], lab: ['#bfe8ff', 5], refinery1: ['#7ff0e0', 3.5], refinery2: ['#7fd8ff', 3.5], refinery3: ['#9fb0ff', 3.5], extractor: ['#ffb070', 2.2], silo: ['#c8e0ff', 3] };
const BONUS_REL = {
  cooler: t => REFINERY_LEVEL[t] ? '+10 %' : null,
  servo: t => t === 'extractor' || REFINERY_LEVEL[t] ? '+15 %' : null,
  silo: t => REFINERY_LEVEL[t] ? '+15 %' : SELLER_TIER[t] !== undefined ? 'Rampe +20 %' : null,
  charger: t => t === 'belt' ? '+25 %' : null,
  refinery: t => t === 'cooler' ? '+10 %' : t === 'servo' ? '+15 %' : t === 'silo' ? '+15 %' : null,
  extractor: (t, o, spec) => t === 'servo' ? '+15 %' : (t === 'extractor' && spec.res !== undefined && o.res === spec.res ? '+5 %' : null),
  seller: t => t === 'silo' ? 'Rampe +20 %' : null
};

const Frame = {
  seen: 0,
  draw(g, alpha, dt) {
    const ctx = Render.ctx;
    Draw.tm = App.now / 1000;
    App.frame++;
    Render.updateParticles(dt);
    Render.updateDevils(g, dt);
    Render.setWorldTransform(ctx);
    const vr = Render.visibleRect(2);
    const P = App.debug.prof;
    let pt = P ? performance.now() : 0;
    const mark = k => { if (!P) return; const n = performance.now(); P[k] = (P[k] || 0) * 0.95 + (n - pt) * 0.05; pt = n; };
    Render.drawTerrain(ctx, g, vr); mark('terrain');
    Render.drawDecor(ctx, g, vr); mark('decor');
    Render.drawDeposits(ctx, g, vr); mark('deposits');
    if (App.debug.chunkBorders) Frame.chunkBorders(ctx, vr);
    // collect visible buildings
    const S = CONFIG.chunkSize;
    const vis = Frame.vis || (Frame.vis = []);
    vis.length = 0;
    const stamp = ++Frame.seen;
    for (let cy = Math.floor(vr.y0 / S) - 1; cy <= Math.floor(vr.y1 / S); cy++) for (let cx = Math.floor(vr.x0 / S) - 1; cx <= Math.floor(vr.x1 / S); cx++) {
      const set = g.bchunk.get(U.chunkKey(cx, cy));
      if (!set) continue;
      for (const id of set) {
        const b = g.buildings.get(id);
        if (!b || b._seen === stamp) continue;
        b._seen = stamp;
        const r = b.type === 'bridge' ? Grid.rect(b) : b;
        if (r.x + r.w < vr.x0 || r.x > vr.x1 || r.y + r.h < vr.y0 || r.y > vr.y1) continue;
        vis.push(b);
      }
    }
    mark('collect');
    // layer 1: flat things (paths, belts)
    for (const b of vis) if (b.type === 'path') Draw.building(ctx, g, b, b.x - Render.ox, b.y - Render.oy);
    const belts = Frame.belts || (Frame.belts = []);
    belts.length = 0;
    for (const b of vis) if (b.type === 'belt') belts.push(b);
    Draw.beltsBatch(ctx, g, belts);
    // items on belts and nodes
    const zoomS = App.cam.zoom;
    const isz = 0.21;
    if (zoomS >= 6) for (const b of vis) {
      if (b.type === 'belt') { for (const it of b.items) { const p = Draw.itemPos(b, it, alpha); Draw.item(ctx, it.res, it.ref, p[0] - Render.ox, p[1] - Render.oy, isz); } }
    }
    mark('belts+items');
    // layer 2: buildings
    for (const b of vis) if (b.type !== 'path' && b.type !== 'belt' && b.type !== 'bridge') Draw.building(ctx, g, b, b.x - Render.ox, b.y - Render.oy);
    for (const b of vis) {
      if (b.buf && b.type !== 'extractor' && b.buf.length) Draw.item(ctx, b.buf[0].res, b.buf[0].ref, b.x + 0.5 - Render.ox, b.y + 0.5 - Render.oy, isz * 0.9);
      if (b.lanes) for (let d = 0; d < 4; d++) if (b.lanes[d] && b.lanes[d].length) Draw.item(ctx, b.lanes[d][0].res, b.lanes[d][0].ref, b.x + 0.5 - Render.ox, b.y + 0.5 - Render.oy, isz * 0.9);
    }
    for (const b of vis) if (b.type === 'bridge') Draw.bridge(ctx, g, b, alpha);
    mark('buildings');
    // tips
    for (const tp of g.run.tips) {
      const bob = Math.sin(Draw.tm * 4 + tp.x) * 0.1;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6;
      ctx.drawImage(Sprites.glow('#ffd24a'), tp.x - Render.ox - 0.6, tp.y - Render.oy - 0.6 + bob, 1.2, 1.2);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffd24a'; ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 0.05;
      ctx.beginPath(); ctx.arc(tp.x - Render.ox, tp.y - Render.oy + bob, 0.24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8a5a00'; ctx.font = '800 0.24px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(CURRENCY_SHORT, tp.x - Render.ox, tp.y - Render.oy + bob + 0.01);
    }
    // customers
    for (const b of vis) if (b.customers && b.customers.length) Draw.customers(ctx, g, b);
    // astronaut
    const p = g.run.player;
    const ax = (p.px !== undefined ? p.px + (p.x - p.px) * alpha : p.x), ay = (p.py !== undefined ? p.py + (p.y - p.py) * alpha : p.y);
    Draw.astronaut(ctx, g, ax - Render.ox, ay - Render.oy, Draw.tm);
    Render.drawParticles(ctx);
    mark('chars+particles');
    // overlays
    Frame.overlays(ctx, g, vis, ax, ay);
    // atmosphere and lights
    const night = Render.drawAtmosphere(ctx, g, dt);
    if (night > 0.05) {
      Render.setWorldTransform(ctx);
      ctx.globalCompositeOperation = 'lighter';
      for (const b of vis) {
        const L = LIGHT_TYPES[b.type];
        if (!L) continue;
        const r = L[1] * (b.type === 'lamp' ? 1 + b.level * 0.3 : 1);
        ctx.globalAlpha = night * 0.55;
        ctx.drawImage(Sprites.glow(L[0]), b.x + b.w / 2 - Render.ox - r / 2, b.y + b.h / 2 - Render.oy - r / 2, r, r);
      }
      ctx.globalAlpha = night * 0.5;
      ctx.drawImage(Sprites.glow('#ffe8c0'), ax - Render.ox - 2.5, ay - Render.oy - 3, 5, 5);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    // readable on top of the night tint: warnings and floating texts
    Render.setWorldTransform(ctx);
    if (zoomS >= 10) for (const b of vis) if (b.warn) Frame.warnIcon(ctx, b);
    Render.drawFloating(ctx, dt);
    document.body.classList.toggle('lowq', App.quality === 'low');
    Frame.edgeMarkers(ctx, g);
    mark('overlays+atmo');
  },

  warnIcon(ctx, b) {
    const x = b.x + b.w / 2 - Render.ox, y = b.y - 0.35 - Render.oy + Math.sin(Draw.tm * 4) * 0.06;
    const s = Math.max(0.35, 12 / App.cam.zoom);
    const red = b.warn === 'full' || b.warn === 'empty' || b.warn === 'nocon';
    ctx.fillStyle = red ? '#ff5a5a' : '#ffc24d'; ctx.strokeStyle = '#1a1010'; ctx.lineWidth = s * 0.1;
    ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.95, y + s * 0.65); ctx.lineTo(x - s * 0.95, y + s * 0.65); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1a1010'; ctx.font = '900 ' + (s * 1.05) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', x, y + s * 0.12);
  },

  chunkBorders(ctx, vr) {
    const S = CONFIG.chunkSize;
    ctx.strokeStyle = 'rgba(0,255,255,.5)'; ctx.lineWidth = 2 / Render.S;
    ctx.beginPath();
    for (let x = Math.floor(vr.x0 / S) * S; x <= vr.x1; x += S) { ctx.moveTo(x - Render.ox, vr.y0 - Render.oy); ctx.lineTo(x - Render.ox, vr.y1 - Render.oy); }
    for (let y = Math.floor(vr.y0 / S) * S; y <= vr.y1; y += S) { ctx.moveTo(vr.x0 - Render.ox, y - Render.oy); ctx.lineTo(vr.x1 - Render.ox, y - Render.oy); }
    ctx.stroke();
  },

  footprint(ctx, x, y, w, hh, ok, alpha = 0.35) {
    ctx.fillStyle = ok ? 'rgba(99,223,116,' + alpha + ')' : 'rgba(255,90,90,' + alpha + ')';
    ctx.fillRect(x - Render.ox, y - Render.oy, w, hh);
    ctx.strokeStyle = ok ? '#63df74' : '#ff5a5a'; ctx.lineWidth = 2 / Render.S;
    ctx.strokeRect(x - Render.ox, y - Render.oy, w, hh);
  },

  overlays(ctx, g, vis, ax, ay) {
    const P = g.run.player;
    const lw = 1 / Render.S;
    // build radius
    if (App.mode === 'build') {
      ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2 * lw; ctx.setLineDash([8 * lw, 8 * lw]);
      ctx.beginPath(); ctx.arc(ax - Render.ox, ay - Render.oy, g.mods.buildRadius, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      if (App.cam.zoom >= 18) {
        // faint grid around the cursor
        const hv = App.hover;
        if (hv) {
          ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = lw;
          ctx.beginPath();
          for (let i = -8; i <= 8; i++) {
            ctx.moveTo(hv.x + i - Render.ox, hv.y - 8 - Render.oy); ctx.lineTo(hv.x + i - Render.ox, hv.y + 9 - Render.oy);
            ctx.moveTo(hv.x - 8 - Render.ox, hv.y + i - Render.oy); ctx.lineTo(hv.x + 9 - Render.ox, hv.y + i - Render.oy);
          }
          ctx.stroke();
        }
      }
    }
    // selected building
    const sel = App.selected;
    if (sel && g.buildings.has(sel.id)) {
      const r = Grid.rect(sel);
      ctx.strokeStyle = Render.palette.accent; ctx.lineWidth = 3 * lw;
      ctx.strokeRect(r.x - Render.ox - 0.05, r.y - Render.oy - 0.05, r.w + 0.1, r.h + 0.1);
      if (sel.type === 'bazaar') {
        ctx.strokeStyle = 'rgba(185,162,122,.6)'; ctx.setLineDash([6 * lw, 6 * lw]);
        ctx.beginPath(); ctx.arc(sel.x + sel.w / 2 - Render.ox, sel.y + sel.h / 2 - Render.oy, CONFIG.pathRadius, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
      if (sel.type === 'extractor' && sel.dep !== undefined) {
        const d = World.depositById(g.world, sel.dep);
        if (d) for (const t of d.tiles) { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2 * lw; ctx.strokeRect(t[0] - Render.ox + 0.06, t[1] - Render.oy + 0.06, 0.88, 0.88); }
      }
    }
    // mass selection
    if (App.selection.length) {
      ctx.strokeStyle = '#7fd3ff'; ctx.lineWidth = 2 * lw;
      for (const b of App.selection) { const r = Grid.rect(b); ctx.strokeRect(r.x - Render.ox, r.y - Render.oy, r.w, r.h); }
    }
    if (App.selRect) {
      const s = App.selRect;
      ctx.fillStyle = 'rgba(127,211,255,.12)'; ctx.strokeStyle = '#7fd3ff'; ctx.lineWidth = 2 * lw;
      const x0 = Math.min(s.x0, s.x1), y0 = Math.min(s.y0, s.y1), x1 = Math.max(s.x0, s.x1) + 1, y1 = Math.max(s.y0, s.y1) + 1;
      ctx.fillRect(x0 - Render.ox, y0 - Render.oy, x1 - x0, y1 - y0); ctx.strokeRect(x0 - Render.ox, y0 - Render.oy, x1 - x0, y1 - y0);
    }
    // ghost
    const gh = App.ghost;
    if (gh && App.mode === 'build') {
      if (gh.list) {
        for (const it of gh.list) {
          const s = it.spec;
          if (s.type === 'bridge') { const r = { x: Math.min(s.x, s.x + U.DX[s.rot] * (s.len - 1)), y: Math.min(s.y, s.y + U.DY[s.rot] * (s.len - 1)) }; Frame.footprint(ctx, r.x, r.y, Math.abs(U.DX[s.rot]) * (s.len - 1) + 1, Math.abs(U.DY[s.rot]) * (s.len - 1) + 1, it.ok); continue; }
          const sz = Grid.size(s.type, s.rot, s.len);
          Frame.footprint(ctx, s.x, s.y, sz.w, sz.h, it.ok);
          if (s.type === 'belt' || DATA.BUILDINGS[s.type].w === 1) Draw.arrow(ctx, s.x + 0.5 - Render.ox, s.y + 0.5 - Render.oy, s.rot, 0.25, 'rgba(255,255,255,.9)');
        }
      } else if (gh.spec) {
        const s = gh.spec;
        const sz = Grid.size(s.type, s.rot, s.len);
        ctx.globalAlpha = 0.6;
        const fake = Grid.make({ nextId: 0 }, Object.assign({}, s, { id: -1, res: gh.dep ? gh.dep.res : undefined, tier: gh.dep ? gh.dep.tier : 0 }));
        fake.w = sz.w; fake.h = sz.h; fake._sv = -5; fake.shape = 0;
        try { if (s.type !== 'bridge') Draw.building(ctx, Object.assign({}, g, { topoVersion: -5 }), fake, s.x - Render.ox, s.y - Render.oy); } catch (e) { /* preview only */ }
        ctx.globalAlpha = 1;
        Frame.footprint(ctx, s.x, s.y, sz.w, sz.h, gh.ok, 0.25);
        if (s.type !== 'belt' && (DATA.BUILDINGS[s.type].w > 1 || DATA.BUILDINGS[s.type].h > 1) && !Grid.isDeco(s.type) && s.type !== 'extractor') {
          const pb = { x: s.x, y: s.y, w: sz.w, h: sz.h, rot: s.rot };
          const fp = Grid.frontPort(pb);
          Draw.arrow(ctx, fp[0] + 0.5 - Render.ox, fp[1] + 0.5 - Render.oy, s.rot, 0.3, '#ffffff');
        } else if (DATA.BUILDINGS[s.type].w === 1 && !Grid.isDeco(s.type)) Draw.arrow(ctx, s.x + 0.5 - Render.ox, s.y + 0.5 - Render.oy, s.rot, 0.25, '#ffffff');
        if (gh.dep) for (const t of gh.dep.tiles) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 * lw; ctx.strokeRect(t[0] - Render.ox + 0.08, t[1] - Render.oy + 0.08, 0.84, 0.84); }
        // neighbourhood bonuses
        Frame.bonusPreview(ctx, g, s, sz, gh);
      }
    }
    // scanner ping
    const ping = g.run.scanPing;
    if (ping) {
      const k = U.clamp(ping.t / 1.6, 0, 1);
      ctx.strokeStyle = Col.rgba(Render.palette.accent, 1 - k); ctx.lineWidth = 4 * lw;
      ctx.beginPath(); ctx.arc(ping.x - Render.ox, ping.y - Render.oy, ping.r * k, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 2 * lw;
      ctx.beginPath(); ctx.arc(ping.x - Render.ox, ping.y - Render.oy, ping.r * k * 0.7, 0, Math.PI * 2); ctx.stroke();
    }
    // pins in world
    for (const pin of g.run.pins) {
      const x = pin.x + 0.5 - Render.ox, y = pin.y + 0.5 - Render.oy, s = Math.max(0.4, 14 / App.cam.zoom);
      ctx.fillStyle = pin.color; ctx.strokeStyle = '#111'; ctx.lineWidth = s * 0.12;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s * 0.6, y - s); ctx.arc(x, y - s * 1.1, s * 0.6, Math.PI * 0.85, Math.PI * 0.15); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  },

  bonusPreview(ctx, g, s, sz, gh) {
    let relKey = s.type;
    if (REFINERY_LEVEL[s.type]) relKey = 'refinery';
    else if (SELLER_TIER[s.type] !== undefined) relKey = 'seller';
    const rel = BONUS_REL[relKey];
    if (!rel) return;
    const pb = { x: s.x, y: s.y, w: sz.w, h: sz.h };
    const seen = new Set();
    const spec = Object.assign({}, s, { res: gh.dep ? gh.dep.res : undefined });
    const cx = s.x + sz.w / 2 - Render.ox, cy = s.y + sz.h / 2 - Render.oy;
    ctx.font = '700 ' + Math.max(0.3, 12 / App.cam.zoom) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of Grid.perimeter(pb)) {
      const o = Grid.at(g, p[0], p[1]);
      if (!o || seen.has(o.id)) continue;
      seen.add(o.id);
      const label = rel(o.type, o, spec);
      if (!label) continue;
      const r = Grid.rect(o);
      const ox = r.x + r.w / 2 - Render.ox, oy = r.y + r.h / 2 - Render.oy;
      ctx.strokeStyle = 'rgba(155,255,140,.9)'; ctx.lineWidth = 3 / Render.S;
      ctx.strokeRect(r.x - Render.ox, r.y - Render.oy, r.w, r.h);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ox, oy); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      const tw = ctx.measureText(label).width + 0.2;
      ctx.fillRect((cx + ox) / 2 - tw / 2, (cy + oy) / 2 - 0.22, tw, 0.44);
      ctx.fillStyle = '#9bff8c'; ctx.fillText(label, (cx + ox) / 2, (cy + oy) / 2);
    }
  },

  // Off-screen arrows for scan results, probe target and pins.
  edgeMarkers(ctx, g) {
    const d = App.view.dpr;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const W = App.view.w, H = App.view.h;
    const marks = [];
    const now = App.now;
    Render.edgeMarks = Render.edgeMarks.filter(m => now - m.at < 12000);
    for (const m of Render.edgeMarks) marks.push(m);
    if (g.run.probeTarget) marks.push({ x: g.run.probeTarget.x + 0.5, y: g.run.probeTarget.y + 0.5, color: '#ffffff', label: 'Sonde' });
    for (const pin of g.run.pins) marks.push({ x: pin.x + 0.5, y: pin.y + 0.5, color: pin.color, label: pin.name });
    if (App.compassTarget) marks.push({ x: App.compassTarget.x + 0.5, y: App.compassTarget.y + 0.5, color: Render.palette.accent, label: '' });
    const pad = 46;
    for (const m of marks) {
      const [sx, sy] = Render.worldToScreen(m.x, m.y);
      if (sx > pad && sx < W - pad && sy > pad && sy < H - pad) continue;
      const cx = W / 2, cy = H / 2;
      const ang = Math.atan2(sy - cy, sx - cx);
      const k = Math.min((W / 2 - pad) / Math.abs(Math.cos(ang) || 1e-6), (H / 2 - pad) / Math.abs(Math.sin(ang) || 1e-6));
      const ex = cx + Math.cos(ang) * k, ey = cy + Math.sin(ang) * k;
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
      ctx.fillStyle = m.color; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -10); ctx.lineTo(-3, 0); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      const dist = Math.round(Math.hypot(m.x - g.run.player.x, m.y - g.run.player.y));
      ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tx = ex - Math.cos(ang) * 26, ty = ey - Math.sin(ang) * 26;
      const txt = (m.label ? m.label + ' ' : '') + dist + ' m';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.strokeText(txt, tx, ty);
      ctx.fillStyle = '#fff'; ctx.fillText(txt, tx, ty);
    }
  }
};

// Input: keyboard, mouse, touch (joystick, pinch, swipe), camera control

const Input = {
  keys: new Set(),
  pointers: new Map(),
  joy: null,          // { id, ox, oy, x, y }
  drag: null,         // primary pointer drag state
  pinch: null,
  lastTap: 0,
  mouse: { x: 0, y: 0, inside: false },

  init() {
    const cv = Render.canvas;
    window.addEventListener('keydown', Input.onKeyDown);
    window.addEventListener('keyup', e => { Input.keys.delete(e.code); });
    window.addEventListener('blur', () => { Input.keys.clear(); Input.joyEnd(); });
    cv.addEventListener('pointerdown', Input.onDown);
    window.addEventListener('pointermove', Input.onMove, { passive: false });
    window.addEventListener('pointerup', Input.onUp);
    window.addEventListener('pointercancel', Input.onUp);
    cv.addEventListener('wheel', Input.onWheel, { passive: false });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('pointerleave', () => { Input.mouse.inside = false; });
    document.addEventListener('gesturestart', e => e.preventDefault());
    // double-tap zoom guard on iOS
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  },

  typing() { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'); },

  onKeyDown(e) {
    Audio2.start();
    if (Input.typing()) return;
    const code = e.code;
    if (e.ctrlKey && e.shiftKey && code === 'KeyD') { e.preventDefault(); Debug.toggle(); return; }
    if (UI.modalOpen()) { if (code === 'Escape') UI.closeModal(); return; }
    if (!App.g || !App.running) return;
    Input.keys.add(code);
    const ctrl = e.ctrlKey || e.metaKey;
    switch (code) {
      case 'KeyR': Build.rotate(); break;
      case 'KeyQ': Build.pipette(); break;
      case 'KeyM': UI.openMap(); break;
      case 'KeyF': UI.scan(); break;
      case 'KeyB': UI.toggleBuild(); break;
      case 'KeyZ': if (ctrl && e.shiftKey) Build.redo(); else Build.undo(); e.preventDefault(); break;
      case 'KeyY': Build.redo(); e.preventDefault(); break;
      case 'KeyC': if (ctrl || App.selection.length) Build.copySelection(); break;
      case 'KeyV': Build.startPaste(); break;
      case 'KeyX': Build.setTool('demolish'); break;
      case 'Delete': case 'Backspace': Build.deleteSelected(); e.preventDefault(); break;
      case 'Escape': Build.cancel(); break;
      case 'KeyH': UI.centerCamera(); break;
      default:
        if (/^Digit[1-9]$/.test(code)) { Build.favorite(+code.slice(5) - 1); }
    }
    if (code.startsWith('Arrow') || code === 'Space') e.preventDefault();
  },

  // movement vector from keys + joystick
  updateMovement(g) {
    let x = 0, y = 0;
    if (!Input.typing() && !UI.modalOpen()) {
      const k = Input.keys;
      if (k.has('KeyA') || k.has('ArrowLeft')) x -= 1;
      if (k.has('KeyD') || k.has('ArrowRight')) x += 1;
      if (k.has('KeyW') || k.has('ArrowUp')) y -= 1;
      if (k.has('KeyS') || k.has('ArrowDown')) y += 1;
    }
    if (Input.joy) {
      const j = Input.joy;
      const R = 54 * App.settings.joySize;
      let dx = (j.x - j.ox) / R, dy = (j.y - j.oy) / R;
      const len = Math.hypot(dx, dy);
      const dead = 0.12;
      if (len < dead) { dx = 0; dy = 0; }
      else { const k2 = Math.min(1, (len - dead) / (1 - dead)) / len; dx *= k2; dy *= k2; }
      x += dx; y += dy;
    }
    g.input.x = x; g.input.y = y;
    g.input.sprint = Input.keys.has('ShiftLeft') && !Input.drag;
    if ((x || y) && !App.cam.follow) { App.cam.follow = true; UI.updateCenterBtn(); }
  },

  // ---------------- pointers ----------------
  tileAt(sx, sy) { const w = Render.screenToWorld(sx, sy); return { x: Math.floor(w[0]), y: Math.floor(w[1]), wx: w[0], wy: w[1] }; },
  inJoyZone(x, y) {
    if (!App.touch) return false;
    const W = App.view.w, H = App.view.h;
    const left = App.settings.joySide !== 'right';
    if (App.mode === 'build') {
      const jx = left ? 90 : W - 90, jy = H - 110;
      return Math.hypot(x - jx, y - jy) < 95;
    }
    const inX = left ? x < W * 0.45 : x > W * 0.55;
    return inX && y > H * 0.35;
  },
  onDown(e) {
    Audio2.start();
    if (!App.g || !App.running) return;
    if (e.pointerType === 'touch') { App.touch = true; document.body.classList.add('touch'); }
    else if (e.pointerType === 'mouse' && App.touch) { App.touch = false; document.body.classList.remove('touch'); }
    Render.canvas.setPointerCapture && Render.canvas.setPointerCapture(e.pointerId);
    const p = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, type: e.pointerType, button: e.button, t: performance.now(), moved: false };
    Input.pointers.set(e.pointerId, p);
    UI.hideTooltip();
    if (e.pointerType === 'touch') {
      if (Input.pointers.size === 2) {
        // second finger: start pinch, cancel single-finger actions
        if (Input.drag) Input.cancelDrag();
        if (Input.joy) {
          const jp = Input.pointers.get(Input.joy.id);
          // a joystick touch that just started and has not moved is really the first finger of a pinch
          if (jp && performance.now() - jp.t < 350 && !jp.moved) Input.joyEnd();
        }
        const ps = [...Input.pointers.values()].filter(q => !Input.joy || q.id !== Input.joy.id);
        if (ps.length === 2) Input.pinch = { d: Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y), zoom: App.cam.zoom, mx: (ps[0].x + ps[1].x) / 2, my: (ps[0].y + ps[1].y) / 2 };
        return;
      }
      if (!Input.joy && Input.inJoyZone(e.clientX, e.clientY) && !(App.mode === 'build' && Build.isLineTool() && Input.drag)) {
        Input.joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
        Input.showJoy();
        return;
      }
    }
    if (e.button === 2) { Build.cancel(); return; }
    if (e.button === 1) { Input.drag = { kind: 'pan', id: e.pointerId, lx: e.clientX, ly: e.clientY }; return; }
    const t = Input.tileAt(e.clientX, e.clientY);
    // start a drag-type action
    if (App.mode === 'build') {
      if ((e.shiftKey || App.tool === 'select') && App.g.run.research.done.has('massSelect')) { Input.drag = { kind: 'rect', id: e.pointerId }; App.selRect = { x0: t.x, y0: t.y, x1: t.x, y1: t.y }; return; }
      if (Build.isLineTool()) { Input.drag = { kind: 'line', id: e.pointerId, started: false, t0: t }; return; }
      if (App.tool === 'demolish') { Input.drag = { kind: 'erase', id: e.pointerId, removed: [], t0: t }; return; }
    }
    Input.drag = { kind: 'maybe', id: e.pointerId, lx: e.clientX, ly: e.clientY };
  },
  onMove(e) {
    const p = Input.pointers.get(e.pointerId);
    if (e.pointerType === 'mouse') {
      Input.mouse.x = e.clientX; Input.mouse.y = e.clientY;
      Input.mouse.inside = e.target === Render.canvas;
      if (App.g && App.running && e.target === Render.canvas && (!Input.drag || Input.drag.kind !== 'pan')) {
        const t = Input.tileAt(e.clientX, e.clientY);
        Build.hover(t.x, t.y);
        UI.hoverTooltip(e.clientX, e.clientY, t);
      }
    }
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if (Math.hypot(p.x - p.sx, p.y - p.sy) > (p.type === 'touch' ? 10 : 5)) p.moved = true;
    if (Input.joy && Input.joy.id === e.pointerId) {
      Input.joy.x = e.clientX; Input.joy.y = e.clientY;
      Input.showJoy();
      e.preventDefault();
      return;
    }
    if (Input.pinch) {
      const ps = [...Input.pointers.values()].filter(q => !Input.joy || q.id !== Input.joy.id);
      if (ps.length >= 2) {
        const d = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
        const mx = (ps[0].x + ps[1].x) / 2, my = (ps[0].y + ps[1].y) / 2;
        Input.zoomAt(mx, my, U.clamp(Input.pinch.zoom * d / Math.max(10, Input.pinch.d), CONFIG.zoomMin, CONFIG.zoomMax));
        // two-finger pan
        App.cam.x -= (mx - Input.pinch.mx) / App.cam.zoom; App.cam.y -= (my - Input.pinch.my) / App.cam.zoom;
        if (Math.hypot(mx - Input.pinch.mx, my - Input.pinch.my) > 0.5) { App.cam.follow = false; UI.updateCenterBtn(); }
        Input.pinch.mx = mx; Input.pinch.my = my;
      }
      e.preventDefault();
      return;
    }
    const d = Input.drag;
    if (!d || d.id !== e.pointerId) return;
    const t = Input.tileAt(e.clientX, e.clientY);
    if (d.kind === 'line') {
      if (!d.started) { d.started = true; Build.lineStart(d.t0.x, d.t0.y); }
      Build.lineMove(t.x, t.y);
      e.preventDefault();
      return;
    }
    if (d.kind === 'rect') { App.selRect.x1 = t.x; App.selRect.y1 = t.y; return; }
    if (d.kind === 'erase') { Build.eraseAt(t.x, t.y, d.removed); return; }
    if (d.kind === 'maybe' && p.moved) { d.kind = 'pan'; }
    if (d.kind === 'pan') {
      App.cam.x -= (e.clientX - d.lx) / App.cam.zoom;
      App.cam.y -= (e.clientY - d.ly) / App.cam.zoom;
      d.lx = e.clientX; d.ly = e.clientY;
      if (App.cam.follow) { App.cam.follow = false; UI.updateCenterBtn(); }
    }
  },
  onUp(e) {
    const p = Input.pointers.get(e.pointerId);
    Input.pointers.delete(e.pointerId);
    if (Input.joy && Input.joy.id === e.pointerId) {
      // a quick tap inside the joystick zone without moving counts as a normal tap
      if (p && !p.moved && performance.now() - p.t < 250) Input.tap(p.x, p.y, p);
      Input.joyEnd();
      return;
    }
    if (Input.pinch) { if (Input.pointers.size < 2) Input.pinch = null; Input.drag = null; return; }
    const d = Input.drag;
    if (!d || d.id !== e.pointerId) return;
    Input.drag = null;
    if (d.kind === 'line') {
      if (d.started) Build.lineEnd(); else Input.tap(e.clientX, e.clientY, p);
      return;
    }
    if (d.kind === 'rect') { Build.rectDone(); return; }
    if (d.kind === 'erase') { if (d.removed.length) Build.eraseDone(d.removed); else Input.tap(e.clientX, e.clientY, p); return; }
    if (d.kind === 'maybe' && p && !p.moved && e.button !== 2) Input.tap(e.clientX, e.clientY, p);
  },
  cancelDrag() {
    const d = Input.drag;
    Input.drag = null;
    if (!d) return;
    if (d.kind === 'line') Build.lineCancel();
    if (d.kind === 'rect') App.selRect = null;
    if (d.kind === 'erase' && d.removed.length) Build.eraseDone(d.removed);
  },
  tap(sx, sy, p) {
    const t = Input.tileAt(sx, sy);
    // tips can be collected by tapping
    const g = App.g;
    for (let i = 0; i < g.run.tips.length; i++) {
      const tp = g.run.tips[i];
      if (U.dist2(tp.x, tp.y, t.wx, t.wy) < 0.5) { const v = Game.collectTip(g, i); Audio2.play('coin'); Render.float('+' + Fmt.num(v), tp.x, tp.y, '#ffd24a'); return; }
    }
    if (App.mode === 'build') { Build.tap(t.x, t.y, p && p.type === 'touch'); return; }
    const b = Grid.at(g, t.x, t.y);
    UI.select(b);
  },
  onWheel(e) {
    e.preventDefault();
    if (!App.g) return;
    const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016));
    Input.zoomAt(e.clientX, e.clientY, U.clamp(App.cam.zoom * f, CONFIG.zoomMin, CONFIG.zoomMax));
  },
  zoomAt(sx, sy, z) {
    const before = Render.screenToWorld(sx, sy);
    App.cam.zoom = z;
    const after = Render.screenToWorld(sx, sy);
    if (!App.cam.follow) { App.cam.x += before[0] - after[0]; App.cam.y += before[1] - after[1]; }
  },
  showJoy() {
    const el = $('#joystick');
    const j = Input.joy;
    if (!j) { el.classList.add('hidden'); return; }
    el.classList.remove('hidden');
    const s = App.settings.joySize;
    el.style.transform = 'scale(' + s + ')';
    el.style.left = j.ox + 'px'; el.style.top = j.oy + 'px';
    const R = 54 * s;
    let dx = j.x - j.ox, dy = j.y - j.oy;
    const len = Math.hypot(dx, dy);
    if (len > R) { dx = dx / len * R; dy = dy / len * R; }
    el.firstElementChild.style.transform = 'translate(' + (dx / s) + 'px,' + (dy / s) + 'px)';
  },
  joyEnd() { Input.joy = null; Input.showJoy(); },

  // camera follow each frame
  updateCamera(g, dt, alpha) {
    const p = g.run.player;
    if (App.cam.follow) {
      const tx = p.px !== undefined ? p.px + (p.x - p.px) * alpha : p.x;
      const ty = (p.py !== undefined ? p.py + (p.y - p.py) * alpha : p.y) - 0.5;
      const k = 1 - Math.exp(-dt * 8);
      App.cam.x += (tx - App.cam.x) * k;
      App.cam.y += (ty - App.cam.y) * k;
      if (Math.abs(tx - App.cam.x) > 60 || Math.abs(ty - App.cam.y) > 60) { App.cam.x = tx; App.cam.y = ty; }
    }
  }
};

// ===== src/app/07_build.js =====
// =====================================================================
// Build: build-mode controller (tools, ghost preview, placing, lines, demolish, selection)
// =====================================================================
const LINE_TYPES = { belt: 1, path: 1, fence: 1 };

const Build = {
  bridgeStart: null,

  isSpecTool() { return App.tool && typeof App.tool === 'object' && App.tool.type; },
  isLineTool() { return Build.isSpecTool() && LINE_TYPES[App.tool.type] === 1; },

  enter() {
    if (App.mode === 'build') return;
    App.mode = 'build';
    UI.onModeChange();
  },
  exit() {
    App.mode = 'play'; App.tool = null; App.ghost = null; App.linePath = null; Build.bridgeStart = null;
    App.selection = []; App.selRect = null;
    UI.onModeChange();
  },
  setTool(tool) {
    Build.enter();
    if (tool === 'demolish' || tool === 'select') App.tool = App.tool === tool ? null : tool;
    else if (tool && tool.type) {
      const prevRot = Build.isSpecTool() ? App.tool.rot : 0;
      App.tool = { type: tool.type, rot: tool.rot !== undefined ? tool.rot : prevRot, grade: tool.grade || 0 };
    } else App.tool = tool;
    Build.bridgeStart = null;
    App.ghost = null; App.linePath = null;
    if (App.hover) Build.hover(App.hover.x, App.hover.y);
    UI.onToolChange();
  },
  cancel() {
    if (UI.closeTopPanel()) return;
    if (App.selection.length) { App.selection = []; UI.updateSelectionBar(); return; }
    if (Build.bridgeStart) { Build.bridgeStart = null; App.ghost = null; return; }
    if (App.mode === 'build' && App.tool) { App.tool = null; App.ghost = null; UI.onToolChange(); return; }
    if (App.mode === 'build') { Build.exit(); return; }
    if (App.selected) UI.select(null);
  },
  rotate() {
    if (Build.isSpecTool()) {
      App.tool.rot = (App.tool.rot + 1) & 3;
      if (App.hover) Build.hover(App.hover.x, App.hover.y);
      Audio2.play('click');
      return;
    }
    if (App.tool && App.tool.paste) { App.tool.rot = (App.tool.rot + 1) & 3; if (App.hover) Build.hover(App.hover.x, App.hover.y); return; }
    const b = App.selected;
    if (b && App.g.buildings.has(b.id)) {
      const from = { x: b.x, y: b.y, rot: b.rot };
      const fee = b.w === 1 && b.h === 1 ? 0 : Grid.moveFee(App.g, b);
      const err = Grid.rotate(App.g, b);
      if (err) { UI.toast(err, 'bad'); Audio2.play('error'); }
      else { Actions.record(App.g, { kind: 'move', id: b.id, from, to: { x: b.x, y: b.y, rot: b.rot }, fee }); Audio2.play('click'); UI.refreshInfo(true); }
    }
  },

  // anchored top-left for a footprint so that the hovered tile is roughly centred
  anchor(type, rot, x, y) {
    const sz = Grid.size(type, rot);
    return { x: x - ((sz.w - 1) >> 1), y: y - ((sz.h - 1) >> 1) };
  },

  hover(x, y) {
    App.hover = { x, y };
    if (App.mode !== 'build') return;
    const g = App.g;
    if (Input.drag && Input.drag.kind === 'line' && Input.drag.started) return;
    if (Build.isSpecTool() && !(App.touch && App.ghost && App.ghost.locked)) {
      const t = App.tool;
      if (t.type === 'bridge') {
        if (!Build.bridgeStart) { const spec = { type: 'bridge', x, y, rot: t.rot, len: 2 }; App.ghost = { spec, ok: true, reason: 'Start der Brücke wählen', cost: Grid.cost(g, 'bridge') }; }
        else {
          const s = Build.bridgeStart;
          const dx = x - s.x, dy = y - s.y;
          let ok = (dx === 0) !== (dy === 0);
          const len = Math.abs(dx) + Math.abs(dy) + 1;
          const rot = dx > 0 ? 0 : dx < 0 ? 2 : dy > 0 ? 1 : 3;
          const spec = { type: 'bridge', x: s.x, y: s.y, rot, len: Math.max(2, len) };
          let reason = null;
          if (!ok) reason = 'Ziel muss in einer Linie liegen';
          else if (len > 6) { ok = false; reason = 'Höchstens 4 Felder überspringen'; }
          else { const chk = Grid.canPlace(g, spec); ok = chk.ok; reason = chk.reason; }
          App.ghost = { list: [{ spec, ok }], ok, reason, cost: Grid.cost(g, 'bridge') };
        }
      } else {
        const a = Build.anchor(t.type, t.rot, x, y);
        const spec = { type: t.type, x: a.x, y: a.y, rot: t.rot, grade: t.grade };
        const chk = Grid.canPlace(g, spec);
        App.ghost = { spec, ok: chk.ok, reason: chk.reason, cost: chk.cost !== undefined ? chk.cost : Grid.cost(g, t.type, { grade: t.grade, tier: chk.dep ? chk.dep.tier : 0 }), dep: chk.dep };
        if (t.type === 'extractor' && !chk.dep) {
          const any = Grid.touchingDeposits(g, a.x, a.y, 2, 2);
          if (any.length) App.ghost.dep = any[0];
        }
      }
    } else if (App.tool && App.tool.paste) {
      Build.pasteGhost(x, y);
    } else if (App.tool && App.tool.moveGroup) {
      Build.moveGhost(x, y);
    } else if (!Build.isSpecTool()) {
      App.ghost = null;
    }
    UI.updateGhostInfo();
  },

  tap(x, y, isTouch) {
    const g = App.g;
    if (App.tool === 'demolish') {
      const b = Grid.at(g, x, y);
      if (b) { const r = Actions.removeMany(g, [b]); Build.afterRemove([b], r); }
      return;
    }
    if (App.tool === 'select' || !App.tool) {
      UI.select(Grid.at(g, x, y));
      return;
    }
    if (App.tool.paste) {
      if (isTouch && !(App.ghost && App.ghost.at && App.ghost.at.x === x && App.ghost.at.y === y)) { Build.hover(x, y); return; }
      Build.pasteAt(x, y); return;
    }
    if (App.tool.moveGroup) {
      if (isTouch && !(App.ghost && App.ghost.at && App.ghost.at.x === x && App.ghost.at.y === y)) { Build.hover(x, y); return; }
      Build.moveGroupAt(x, y); return;
    }
    if (!Build.isSpecTool()) return;
    const t = App.tool;
    if (t.type === 'bridge') {
      if (!Build.bridgeStart) {
        const chk = Grid.at(g, x, y);
        if (chk) { UI.toast('Feld ist belegt', 'bad'); Audio2.play('error'); return; }
        Build.bridgeStart = { x, y }; Build.hover(x, y); Audio2.play('click');
        UI.toast('Jetzt das Ziel der Brücke wählen (bis zu 4 Felder Abstand).');
        return;
      }
      Build.hover(x, y);
      const gh = App.ghost;
      if (gh && gh.list && gh.ok) {
        const res = Actions.placeMany(g, [gh.list[0].spec]);
        if (res.placed.length) { Build.afterPlace(res.placed, res.spent); Build.bridgeStart = null; App.ghost = null; }
      } else { UI.toast(gh && gh.reason ? gh.reason : 'Ungültig', 'bad'); Audio2.play('error'); }
      return;
    }
    const a = Build.anchor(t.type, t.rot, x, y);
    if (isTouch) {
      // first tap positions the ghost, a second tap on the same spot (or the ✓ button) places it
      const gh = App.ghost;
      if (!gh || !gh.spec || gh.spec.x !== a.x || gh.spec.y !== a.y || !gh.touchArmed) {
        Build.hover(x, y);
        if (App.ghost) App.ghost.touchArmed = true;
        return;
      }
    }
    Build.placeSpec({ type: t.type, x: a.x, y: a.y, rot: t.rot, grade: t.grade });
  },
  confirm() {
    const gh = App.ghost;
    if (!gh) return;
    if (App.tool && App.tool.paste && gh.at) { Build.pasteAt(gh.at.x, gh.at.y); return; }
    if (App.tool && App.tool.moveGroup && gh.at) { Build.moveGroupAt(gh.at.x, gh.at.y); return; }
    if (gh.spec && Build.isSpecTool()) {
      if (App.tool.type === 'bridge') { if (App.hover) Build.tap(App.hover.x, App.hover.y, false); return; }
      Build.placeSpec(Object.assign({}, gh.spec));
    }
  },
  placeSpec(spec) {
    const g = App.g;
    const chk = Grid.canPlace(g, spec);
    if (!chk.ok) { UI.toast(chk.reason, 'bad'); Audio2.play('error'); return false; }
    const res = Actions.placeMany(g, [spec]);
    if (!res.placed.length) { UI.toast(res.fail || 'Nicht möglich', 'bad'); Audio2.play('error'); return false; }
    Build.afterPlace(res.placed, res.spent);
    if (App.hover) Build.hover(App.hover.x, App.hover.y);
    return true;
  },
  afterPlace(list, spent) {
    const b = list[list.length - 1];
    Audio2.play(b.type === 'belt' ? 'belt' : 'build');
    const r = Grid.rect(b);
    if (spent > 0) Render.float('-' + Fmt.num(spent) + ' ' + CURRENCY_SHORT, r.x + r.w / 2, r.y, '#ff9a8a');
    if (!App.settings.reducedFx) for (let i = 0; i < 10; i++) Render.spawn('dust', r.x + Math.random() * r.w, r.y + r.h - Math.random() * 0.5, (Math.random() - 0.5) * 2, -Math.random(), 0.8, Render.palette.particle, 0.1);
    Tutorial.onEvent('place', b);
    UI.refreshBuildBar();
  },
  afterRemove(list, refund) {
    Audio2.play('remove');
    const b = list[0];
    if (b) Render.float('+' + Fmt.num(refund) + ' ' + CURRENCY_SHORT, b.x + b.w / 2, b.y, '#9bff8c');
    if (App.selected && list.includes(App.selected)) UI.select(null);
    UI.refreshBuildBar();
  },

  // ---------------- lines (belts, paths, fences) ----------------
  lineStart(x, y) { App.linePath = [[x, y]]; Build.lineGhost(); },
  lineMove(x, y) {
    const path = App.linePath;
    if (!path) return;
    let last = path[path.length - 1];
    let guard = 0;
    while ((last[0] !== x || last[1] !== y) && guard++ < 400) {
      const dx = x - last[0], dy = y - last[1];
      let nx = last[0], ny = last[1];
      if (Math.abs(dx) >= Math.abs(dy)) nx += Math.sign(dx); else ny += Math.sign(dy);
      if (path.length >= 2 && path[path.length - 2][0] === nx && path[path.length - 2][1] === ny) path.pop();
      else if (!path.some(p => p[0] === nx && p[1] === ny)) path.push([nx, ny]);
      else break;
      last = path[path.length - 1];
      if (path.length > 600) break;
    }
    Build.lineGhost();
  },
  lineSpecs() {
    const path = App.linePath, t = App.tool;
    const out = [];
    for (let i = 0; i < path.length; i++) {
      let rot = t.rot;
      if (i < path.length - 1) { const dx = path[i + 1][0] - path[i][0], dy = path[i + 1][1] - path[i][1]; rot = dx > 0 ? 0 : dx < 0 ? 2 : dy > 0 ? 1 : 3; }
      else if (i > 0) { const dx = path[i][0] - path[i - 1][0], dy = path[i][1] - path[i - 1][1]; rot = dx > 0 ? 0 : dx < 0 ? 2 : dy > 0 ? 1 : 3; }
      out.push({ type: t.type, x: path[i][0], y: path[i][1], rot, grade: t.grade });
    }
    return out;
  },
  lineGhost() {
    const g = App.g;
    const specs = Build.lineSpecs();
    let money = g.run.money, total = 0, okCount = 0;
    const kits = Object.assign({}, g.run.kits);
    const counts = g.run.counts.belt || 0;
    const list = specs.map((s, i) => {
      const chk = Grid.canPlace(g, s, { ignoreMoney: true });
      let cost = 0;
      if (chk.ok) {
        if (kits[s.type] > 0) { kits[s.type]--; cost = 0; }
        else cost = s.type === 'belt' ? Grid.baseCost('belt', { grade: s.grade }) * Math.pow(CONFIG.beltCostGrowth, counts + okCount) : Grid.cost(g, s.type);
      }
      const ok = chk.ok && cost <= money + 1e-9;
      if (ok) { money -= cost; total += cost; okCount++; }
      return { spec: s, ok, reason: chk.ok ? (ok ? null : 'Zu teuer') : chk.reason };
    });
    if (specs.length) App.tool.rot = specs[specs.length - 1].rot;
    const firstBad = list.find(l => !l.ok);
    App.ghost = { list, ok: okCount > 0, cost: total, count: okCount, reason: firstBad ? firstBad.reason : null, line: true };
    UI.updateGhostInfo();
  },
  lineEnd() {
    const g = App.g;
    const gh = App.ghost;
    App.linePath = null;
    if (!gh || !gh.list) return;
    const specs = gh.list.filter(l => l.ok).map(l => l.spec);
    if (!specs.length) { UI.toast(gh.reason || 'Nichts platzierbar', 'bad'); Audio2.play('error'); App.ghost = null; return; }
    const res = Actions.placeMany(g, specs);
    App.ghost = null;
    if (res.placed.length) {
      Build.afterPlace(res.placed, res.spent);
      if (res.placed.length < gh.list.length) UI.toast(res.placed.length + ' von ' + gh.list.length + ' Feldern gebaut' + (gh.reason ? ' (' + gh.reason + ')' : ''));
    }
    if (App.hover) Build.hover(App.hover.x, App.hover.y);
  },
  lineCancel() { App.linePath = null; App.ghost = null; UI.updateGhostInfo(); },

  // ---------------- demolish ----------------
  eraseAt(x, y, removed) {
    const g = App.g;
    const b = Grid.at(g, x, y);
    if (!b) return;
    const spec = Object.assign(Grid.toSpec(b), { id: b.id });
    spec.refund = Grid.remove(g, b);
    removed.push(spec);
    Audio2.play('remove');
    Render.float('+' + Fmt.num(spec.refund), b.x + b.w / 2, b.y, '#9bff8c');
    if (App.selected === b) UI.select(null);
  },
  eraseDone(removed) { Actions.record(App.g, { kind: 'remove', specs: removed }); UI.refreshBuildBar(); },
  deleteSelected() {
    const g = App.g;
    if (App.selection.length) {
      const list = App.selection.filter(b => g.buildings.has(b.id));
      const r = Actions.removeMany(g, list);
      Build.afterRemove(list, r);
      App.selection = []; UI.updateSelectionBar();
      UI.toast(list.length + ' Objekte abgerissen (+' + Fmt.money(r) + ')');
      return;
    }
    if (App.selected && g.buildings.has(App.selected.id)) {
      const b = App.selected;
      const r = Actions.removeMany(g, [b]);
      Build.afterRemove([b], r);
    }
  },

  // ---------------- selection, move, blueprints ----------------
  rectDone() {
    const g = App.g, s = App.selRect;
    App.selRect = null;
    if (!s) return;
    const x0 = Math.min(s.x0, s.x1), y0 = Math.min(s.y0, s.y1), x1 = Math.max(s.x0, s.x1), y1 = Math.max(s.y0, s.y1);
    const set = new Set();
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const b = Grid.at(g, x, y); if (b) set.add(b); }
    App.selection = [...set];
    UI.updateSelectionBar();
  },
  startMoveGroup() {
    if (!App.selection.length) return;
    const xs = App.selection.map(b => Grid.rect(b));
    const minX = Math.min(...xs.map(r => r.x)), minY = Math.min(...xs.map(r => r.y));
    App.tool = { moveGroup: App.selection.slice(), ox: minX, oy: minY, rot: 0 };
    UI.onToolChange();
    UI.toast('Ziel wählen: Die Auswahl wird mit der linken oberen Ecke dort platziert.');
  },
  moveGhost(x, y) {
    const g = App.g, t = App.tool;
    const dx = x - t.ox, dy = y - t.oy;
    const ids = new Set(t.moveGroup.map(b => b.id));
    const list = t.moveGroup.map(b => {
      const spec = { type: b.type, x: b.x + dx, y: b.y + dy, rot: b.rot, len: b.len, grade: b.grade };
      const ok = Grid.occTiles(spec.type, spec.x, spec.y, spec.rot, spec.len).every(tt => { const id = g.occ.get(U.tileKey(tt[0], tt[1])); return id === undefined || ids.has(id); });
      return { spec, ok };
    });
    const fee = t.moveGroup.reduce((a, b) => a + Grid.moveFee(g, b), 0);
    App.ghost = { list, ok: list.every(l => l.ok), cost: fee, at: { x, y }, reason: list.every(l => l.ok) ? null : 'Blockiert' };
  },
  moveGroupAt(x, y) {
    const g = App.g, t = App.tool;
    Build.moveGhost(x, y);
    const gh = App.ghost;
    if (!gh.ok) { UI.toast(gh.reason || 'Blockiert', 'bad'); Audio2.play('error'); return; }
    if (gh.cost > g.run.money) { UI.toast('Zu teuer', 'bad'); Audio2.play('error'); return; }
    const dx = x - t.ox, dy = y - t.oy;
    const group = t.moveGroup.filter(b => g.buildings.has(b.id));
    // extractors must stay at a deposit
    for (const b of group) if (b.type === 'extractor') {
      const deps = Grid.touchingDeposits(g, b.x + dx, b.y + dy, b.w, b.h);
      if (!deps.some(d => d.id === b.dep || Grid.depositFree(g, d) > 0)) { UI.toast('Extraktoren müssen an einem Vorkommen bleiben', 'bad'); Audio2.play('error'); return; }
    }
    for (const b of group) Grid.unregister(g, b);
    for (const b of group) {
      b.x += dx; b.y += dy;
      if (b.type === 'extractor') {
        const deps = Grid.touchingDeposits(g, b.x, b.y, b.w, b.h).filter(d => d.id === b.dep || Grid.depositFree(g, d) > 0);
        if (deps.length && !deps.some(d => d.id === b.dep)) { const d = deps.sort((a, c) => c.tier - a.tier)[0]; b.dep = d.id; b.res = d.res; b.tier = d.tier; }
      }
      Grid.register(g, b);
    }
    g.run.money -= gh.cost;
    g.undo.length = 0; g.redo.length = 0; // group moves are not undoable (documented)
    Audio2.play('build');
    App.selection = []; App.tool = null; App.ghost = null;
    UI.onToolChange(); UI.updateSelectionBar();
    UI.toast(group.length + ' Objekte verschoben (−' + Fmt.money(gh.cost) + ')');
  },
  copySelection() {
    const g = App.g;
    if (!g.run.research.done.has('blueprints')) { UI.toast('Forschung nötig: Blaupausen', 'bad'); return; }
    if (!App.selection.length) { UI.toast('Erst eine Auswahl treffen (Shift+Ziehen bzw. Auswahl-Werkzeug)'); return; }
    const rects = App.selection.map(b => Grid.rect(b));
    const minX = Math.min(...rects.map(r => r.x)), minY = Math.min(...rects.map(r => r.y));
    const items = App.selection.filter(b => b.type !== 'extractor').map(b => ({ type: b.type, dx: b.x - minX, dy: b.y - minY, rot: b.rot, len: b.len, grade: b.grade, filter: b.filter || null }));
    if (!items.length) { UI.toast('Extraktoren lassen sich nicht kopieren', 'bad'); return; }
    App.blueprint = { items };
    UI.toast('Blaupause mit ' + items.length + ' Objekten kopiert. V oder Einfügen zum Platzieren.', 'good');
    Build.startPaste();
  },
  startPaste() {
    if (!App.blueprint) { UI.toast('Keine Blaupause vorhanden'); return; }
    Build.enter();
    App.selection = []; UI.updateSelectionBar();
    App.tool = { paste: App.blueprint, rot: 0 };
    UI.onToolChange();
    if (App.hover) Build.hover(App.hover.x, App.hover.y);
  },
  bpTransform(it, rot) {
    // rotate blueprint offsets around origin
    let dx = it.dx, dy = it.dy;
    for (let i = 0; i < rot; i++) { const t = dx; dx = -dy; dy = t; }
    return { dx, dy, rot: (it.rot + rot) & 3 };
  },
  pasteGhost(x, y) {
    const g = App.g, t = App.tool;
    let money = g.run.money, total = 0;
    const list = t.paste.items.map(it => {
      const tr = Build.bpTransform(it, t.rot);
      let sx = x + tr.dx, sy = y + tr.dy;
      if (t.rot) { const sz = Grid.size(it.type, tr.rot, it.len); if (t.rot === 1) sx -= sz.w - 1; else if (t.rot === 2) { sx -= sz.w - 1; sy -= sz.h - 1; } else if (t.rot === 3) sy -= sz.h - 1; }
      const spec = { type: it.type, x: sx, y: sy, rot: tr.rot, len: it.len, grade: it.grade, filter: it.filter };
      const chk = Grid.canPlace(g, spec, { ignoreMoney: true });
      const ok = chk.ok && chk.cost <= money;
      if (ok) { money -= chk.cost; total += chk.cost; }
      return { spec, ok };
    });
    App.ghost = { list, ok: list.some(l => l.ok), cost: total, at: { x, y }, count: list.filter(l => l.ok).length, reason: list.every(l => l.ok) ? null : 'Teilweise blockiert' };
  },
  pasteAt(x, y) {
    Build.pasteGhost(x, y);
    const gh = App.ghost;
    const specs = gh.list.filter(l => l.ok).map(l => l.spec);
    if (!specs.length) { UI.toast('Blaupause passt hier nicht', 'bad'); Audio2.play('error'); return; }
    const res = Actions.placeMany(App.g, specs);
    if (res.placed.length) { Build.afterPlace(res.placed, res.spent); UI.toast(res.placed.length + ' Objekte aus Blaupause gebaut'); }
  },

  pipette() {
    const g = App.g;
    const hv = App.hover;
    const b = hv ? Grid.at(g, hv.x, hv.y) : App.selected;
    if (!b) return;
    if (b.type === 'bridge') { Build.setTool({ type: 'bridge', rot: b.rot }); return; }
    Build.setTool({ type: b.type, rot: b.rot, grade: b.grade || 0 });
    UI.toast('Pipette: ' + (b.type === 'belt' ? DATA.BELT_GRADES[b.grade].name : DATA.BUILDINGS[b.type].name));
  },
  favorite(i) {
    const f = App.settings.favorites[i];
    if (!f) return;
    const [type, grade] = f.split(':');
    if (!DATA.BUILDINGS[type]) return;
    Build.setTool({ type, grade: +grade || 0 });
    UI.toggleBuild(true);
  },
  undo() {
    const err = Actions.undo(App.g);
    if (err) { UI.toast(err, 'bad'); Audio2.play('error'); } else { Audio2.play('click'); UI.toast('Rückgängig gemacht'); }
    if (App.selected && !App.g.buildings.has(App.selected.id)) UI.select(null);
    UI.refreshBuildBar();
  },
  redo() {
    const err = Actions.redo(App.g);
    if (err) { UI.toast(err, 'bad'); Audio2.play('error'); } else { Audio2.play('click'); UI.toast('Wiederholt'); }
    UI.refreshBuildBar();
  }
};

// ===== src/app/08_ui.js =====
// =====================================================================
// UI: HUD, toasts, banners, build bar, ghost info, tooltips, selection bar
// =====================================================================
const UI = {
  cat: 'mine',
  modal: null,
  moneyShown: 0,
  toastQ: [],
  lastHud: 0,

  init() {
    $('#btn-build').addEventListener('click', () => { Audio2.start(); UI.toggleBuild(); });
    $('#btn-scan').addEventListener('click', () => { Audio2.start(); UI.scan(); });
    $('#btn-probe').addEventListener('click', () => UI.probe());
    $('#btn-map').addEventListener('click', () => UI.openMap());
    $('#btn-menu').addEventListener('click', () => Menus.open('codex'));
    $('#btn-minimap').addEventListener('click', () => { App.settings.minimap = !App.settings.minimap; App.saveSettings(); });
    $('#btn-fullscreen').addEventListener('click', UI.fullscreen);
    $('#btn-rotate').addEventListener('click', () => Build.rotate());
    $('#btn-cancel').addEventListener('click', () => Build.cancel());
    $('#btn-place').addEventListener('click', () => Build.confirm());
    $('#btn-undo').addEventListener('click', () => Build.undo());
    $('#btn-redo').addEventListener('click', () => Build.redo());
    $('#btn-center').addEventListener('click', UI.centerCamera);
    $('#tier-badge').addEventListener('click', () => Menus.open('stats'));
    $('#income').addEventListener('click', () => UI.salesPopover());
    $('#income').title = 'Letzte Verkäufe anzeigen';
    $('#minimap').addEventListener('click', () => UI.openMap());
    $('#tool-demolish').addEventListener('click', () => { Build.setTool('demolish'); if (App.touch && window.innerWidth < 900 && App.tool === 'demolish') UI.collapseBuild(true); });
    $('#tool-select').addEventListener('click', () => Build.setTool('select'));
    $('#bb-mini').addEventListener('click', () => { UI.collapseBuild(false); UI.refreshBuildBar(true); });
    $('#tool-pipette').addEventListener('click', () => { if (App.selected) { const b = App.selected; Build.setTool({ type: b.type, rot: b.rot, grade: b.grade || 0 }); } else UI.toast('Pipette: Gebäude antippen und dann Pipette, oder Q über einem Gebäude drücken'); });
    $('#research-chip').addEventListener('click', () => Menus.open('research'));
    $('#contracts-chip').addEventListener('click', () => { const t = App.g.lists.terminal && App.g.lists.terminal[0]; if (t) UI.select(t); });
    let logoTaps = 0, logoTimer = 0;
    $('#logo').addEventListener('click', () => {
      const now = performance.now();
      if (now - logoTimer > 1500) logoTaps = 0;
      logoTimer = now; logoTaps++;
      if (logoTaps >= 5) { logoTaps = 0; Debug.toggle(); }
    });
    // tooltips on HUD buttons (hover only)
    $$('#ui [title]').forEach(el => {
      el.addEventListener('mouseenter', () => { if (!App.touch) UI.showTooltip(el, el.getAttribute('title')); });
      el.addEventListener('mouseleave', UI.hideTooltip);
    });
    UI.buildCats();
  },

  // ---------------- HUD ----------------
  updateHud(dt) {
    const g = App.g;
    const target = g.run.money;
    const diff = target - UI.moneyShown;
    UI.moneyShown = Math.abs(diff) < 0.01 || !isFinite(UI.moneyShown) ? target : UI.moneyShown + diff * Math.min(1, dt * 8);
    const now = performance.now();
    $('#money').textContent = Fmt.num(UI.moneyShown) + ' ' + CURRENCY_SHORT;
    if (now - UI.lastHud < 200) return;
    UI.lastHud = now;
    $('#income').textContent = '+' + Fmt.num(g.income) + ' ' + CURRENCY_SHORT + '/s';
    const ct = g.run.custTier;
    const next = ct < 5 ? CONFIG.customers[ct + 1].unlock : null;
    const prev = CONFIG.customers[ct].unlock;
    const pct = next ? U.clamp((g.run.earned - prev) / (next - prev), 0, 1) : 1;
    $('#tier-badge').innerHTML = 'Kundenstufe<b>' + (ct + 1) + '<span class="long"> · ' + esc(DATA.CUSTOMERS[ct].plural) + '</span></b><div class="bar"><i style="width:' + (pct * 100).toFixed(1) + '%"></i></div>';
    $('#tier-badge').title = next ? 'Nächste Stufe bei ' + Fmt.money(next) + ' Gesamtverkauf (' + Fmt.money(g.run.earned) + ')' : 'Höchste Kundenstufe erreicht';
    const p = g.run.player;
    $('#coords').textContent = Math.floor(p.x) + ', ' + Math.floor(p.y);
    $('#planet-name').textContent = g.world.planet.name;
    // scanner cooldown ring
    const cd = g.run.scanCd / g.mods.scanCd;
    UI.setRing($('#btn-scan svg circle'), 26, cd);
    $('#btn-scan').classList.toggle('active', cd <= 0);
    const probe = g.run.research.done.has('probe');
    $('#btn-probe').classList.toggle('hidden', !probe);
    if (probe) UI.setRing($('#btn-probe svg circle'), 20, g.run.probeCd / 300);
    // research chip
    const a = g.run.research.active;
    const rc = $('#research-chip');
    if (a) {
      const r = DATA.RESEARCH_BY_ID[a.id];
      const left = Progression.researchTime(g, r) * (1 - a.prog);
      rc.classList.remove('hidden');
      rc.innerHTML = '⚗ ' + esc(r.name) + ' · ' + Fmt.time(left) + '<div class="bar"><i style="width:' + (a.prog * 100).toFixed(1) + '%"></i></div>';
    } else rc.classList.add('hidden');
    const cc = $('#contracts-chip');
    if (g.run.contracts.length) {
      cc.classList.remove('hidden');
      const c = g.run.contracts[0];
      const tot = c.req.reduce((s, r) => s + r.qty, 0), got = c.req.reduce((s, r) => s + r.got, 0);
      cc.innerHTML = '📜 ' + g.run.contracts.length + ' Verträge · ' + esc(c.planet) + ' ' + Fmt.time(c.end - g.run.time) + '<div class="bar"><i style="width:' + (got / tot * 100).toFixed(1) + '%"></i></div>';
    } else cc.classList.add('hidden');
    UI.updateBanners();
    UI.updateCompass();
    if (App.selected) UI.refreshInfo();
  },
  setRing(circle, r, frac) {
    const len = 2 * Math.PI * r;
    circle.style.strokeDasharray = len;
    circle.style.strokeDashoffset = len * (1 - U.clamp(frac, 0, 1));
    circle.style.opacity = frac > 0 ? 1 : 0;
  },
  updateBanners() {
    const g = App.g;
    const wrap = $('#banners');
    const evs = g.run.events;
    const key = evs.map(e => e.res + ':' + e.mult).join('|');
    if (wrap.dataset.key !== key) {
      wrap.dataset.key = key;
      wrap.innerHTML = '';
      for (const ev of evs) {
        const R = DATA.RESOURCES[ev.res];
        const el = h('div', { class: 'banner ' + (ev.pos ? 'pos' : 'neg') });
        el.append(Sprites.itemCanvas(ev.res, 0, 22));
        el.append(h('span', { text: ev.pos ? ev.who + ' sucht ' + R.name + ':' : 'Überangebot ' + R.name + ':' }));
        el.append(h('span', { class: 'mult', text: '×' + Fmt.dec(ev.mult, 1) }));
        el.append(h('span', { class: 'time' }));
        wrap.append(el);
      }
    }
    [...wrap.children].forEach((el, i) => { const ev = evs[i]; if (ev) el.lastChild.textContent = 'für ' + Fmt.time(ev.end - g.run.time); });
    // keep toasts below the event banners
    const bb = wrap.getBoundingClientRect();
    const base = window.innerWidth < 760 ? 78 : 70;
    $('#toasts').style.top = Math.max(base, evs.length ? bb.bottom + 8 : 0) + 'px';
  },
  updateCompass() {
    const g = App.g;
    const el = $('#compass');
    if (!g.run.research.done.has('compass')) { el.classList.add('hidden'); App.compassTarget = null; return; }
    if (!UI._compassT || performance.now() - UI._compassT > 2000) {
      UI._compassT = performance.now();
      let best = null, bestScore = -1;
      const p = g.run.player;
      for (const id of g.world.known) {
        const d = World.depositById(g.world, id);
        if (!d || Grid.depositFree(g, d) <= 0) continue;
        const dist = Math.hypot(d.x - p.x, d.y - p.y);
        const score = Math.pow(3, d.tier) * d.slots / (20 + dist);
        if (score > bestScore) { bestScore = score; best = d; }
      }
      App.compassTarget = best;
    }
    const t = App.compassTarget;
    if (!t) { el.classList.add('hidden'); return; }
    el.classList.remove('hidden');
    const p = g.run.player;
    const ang = Math.atan2(t.y - p.y, t.x - p.x);
    el.firstElementChild.style.transform = 'rotate(' + (ang + Math.PI / 2) + 'rad)';
    el.lastElementChild.textContent = DATA.RESOURCES[t.res].name + ' · ' + Math.round(Math.hypot(t.x - p.x, t.y - p.y)) + ' m';
  },
  salesPopover() {
    const g = App.g;
    const log = h('div', { class: 'sales-log' });
    if (!g.run.salesLog.length) log.append(h('div', { class: 'muted', text: 'Noch keine Verkäufe in diesem Durchlauf.' }));
    for (const e of g.run.salesLog) {
      const row = h('div');
      if (e.key >= 0) row.append(Sprites.itemCanvas(e.key >> 2, e.key & 3, 18));
      row.append(h('span', { text: DATA.CUSTOMERS[e.tier].name + ' · ' + Fmt.int(e.units) + ' Items · vor ' + Fmt.time(g.run.time - e.t) + (e.ok ? ' · zufrieden' : '') }));
      row.append(h('b', { text: '+' + Fmt.money(e.rev) }));
      log.append(row);
    }
    UI.openModal(h('div', { class: 'modal small' },
      h('div', { class: 'modal-head' }, h('h2', { text: 'Letzte Verkäufe · Ø ' + Fmt.money(g.income) + '/s' }), h('button', { class: 'icon-btn small', 'aria-label': 'Schließen', onclick: () => UI.closeModal() }, '✕')),
      h('div', { class: 'modal-body' }, log)));
  },

      else if (it.type === 'extractor') { const t0 = Grid.cost(g, 'extractor', { tier: 0 }); ctext = 'ab ' + Fmt.money(t0); if (t0 > g.run.money && !kit) ccls += ' no'; }

      let lp = null;

    if (found.length) {

      UI.toast('Scanner: ' + found.length + ' neue Vorkommen. Bestes: <b style="color:' + DATA.TIERS[best.tier].color + '">' + esc(DATA.RESOURCES[best.res].name) + '</b> (' + DATA.TIERS[best.tier].name + ')', best.tier >= 3 ? 'gold' : 'good');

    else UI.toast('Sonde: kein unbekanntes episches Vorkommen in Reichweite.');

  fullscreen() {

        const el = d.documentElement;
