    for (const t of d.tiles) for (let dy = -2; dy <= 1; dy++) for (let dx = -2; dx <= 1; dx++) cands.push([t[0] + dx, t[1] + dy]);
    cands.sort((a, b) => U.dist2(a[0], a[1], target.x, target.y) - U.dist2(b[0], b[1], target.x, target.y));
    const tried = new Set();
    let attempts = 0;
    for (const c of cands) {
      const key = c[0] + ',' + c[1];
      if (tried.has(key)) continue; tried.add(key);
      const spec = { type: 'extractor', x: c[0], y: c[1], rot: 0 };
      const chk = Grid.canPlace(g, spec, { ignoreRadius: true, ignoreMoney: true });
      if (!chk.ok || chk.dep.id !== d.id) continue;
      if (++attempts > 6) break;
      const ghosts = [];
      const occupy = (type, x, y, rot) => { const b = Grid.make(g, { type, x, y, rot, id: -100 - ghosts.length }); Grid.register(g, b); ghosts.push(b); return b; };
      const cleanup = () => { for (const gb of ghosts) Grid.unregister(g, gb); g.nextId = 1; for (const id of g.buildings.keys()) if (id >= g.nextId) g.nextId = id + 1; };
      const exG = occupy('extractor', c[0], c[1], 0);
      // refinery chain
      const chain = [];
      let prevRect = { x: c[0], y: c[1], w: 2, h: 2 }, prevPort = null, ok = true;
      for (let j = 0; j < k && ok; j++) {
        let found = null;
        const positions = [];
        if (j === 0) { for (let oy = -3; oy <= 2; oy++) for (let ox = -3; ox <= 2; ox++) positions.push([c[0] + ox, c[1] + oy]); }
        else { for (let oy = -2; oy <= 0; oy++) for (let ox = -2; ox <= 0; ox++) positions.push([prevPort[0] + ox, prevPort[1] + oy]); }
        positions.sort((a, b) => U.dist2(a[0], a[1], target.x, target.y) - U.dist2(b[0], b[1], target.x, target.y));
        for (const p of positions) {
          for (let rot = 0; rot < 4 && !found; rot++) {
            if (!Bot.fits(g, 'refinery1', p[0], p[1], rot)) continue;
            const rect = { x: p[0], y: p[1], w: 3, h: 3 };
            if (j === 0 && !Bot.touches(exG, p[0], p[1], 3, 3)) continue;
            if (j > 0 && !Bot.inRect(prevPort[0], prevPort[1], rect)) continue;
            const port = Grid.frontPort({ x: p[0], y: p[1], w: 3, h: 3, rot });
            if (!Bot.free(g, port[0], port[1]) || Bot.inRect(port[0], port[1], prevRect)) continue;
            found = { x: p[0], y: p[1], rot, port, rect };
          }
          if (found) break;
        }
        if (!found) { ok = false; break; }
        occupy('refinery1', found.x, found.y, found.rot);
        chain.push(found); prevRect = found.rect; prevPort = found.port;
      }
      if (!ok) { cleanup(); continue; }
      const starts = chain.length ? [prevPort] : Grid.perimeter(exG).map(p => [p[0], p[1]]);
      const r = Bot.route(g, starts, target);
      cleanup();
      if (!r) continue;
      const belts = Bot.beltSpecs(r.path, r.lastDir, 0);
      const total = Grid.cost(g, 'extractor', { tier: d.tier }) + Bot.beltCost(g, belts.length, 0) + chain.reduce((a, ch, j) => a + Grid.cost(g, Bot.REF_TYPES[j]), 0);
      if (total > g.run.money) return { wait: total };
      const ex = Grid.place(g, spec, { ignoreRadius: true });
      if (!ex) return null;
      const refs = chain.map((ch, j) => Grid.place(g, { type: Bot.REF_TYPES[j], x: ch.x, y: ch.y, rot: ch.rot }, { ignoreRadius: true, ignoreMoney: true }));
      if (refs.length) {
        let mask = 0;
        for (const p of Grid.perimeter(ex)) if (Bot.inRect(p[0], p[1], chain[0].rect)) mask |= 1 << p[2];
        ex.outMask = mask || 15;
        Bot.mark(B, 'firstRefinery');
      }
      const res = Actions.placeMany(g, belts, { ignoreRadius: true });
      g.topologyDirty = true; Game.recompute(g);
      const L = { ex, refs, beltIds: res.placed.map(b => b.id), rate: 0, val: DATA.RESOURCES[d.res].value * CONFIG.refineFactor[refs.length], res: d.res };
      L.rate = Bot.lineRate(g, L);
      B.lines.push(L);
      Bot.mark(B, 'firstExtractor');
      B.busyUntil = g.run.time + Bot.HUMAN_DELAY * 2 + Math.hypot(d.x - B.hub.x, d.y - B.hub.y) * 2 / g.mods.walk + belts.length * 0.3;
      return { ok: true };
    }
    B.badDeps.add(d.id);
    return null;
  },
  rebuildLine(B, L, k) {
    const g = B.g;
    const d = World.depositById(g.world, L.ex.dep);
    if (!d) return null;
    const parts = [L.ex].concat(L.refs, L.beltIds.map(id => g.buildings.get(id)).filter(Boolean));
    for (const b of parts) if (g.buildings.has(b.id)) Grid.remove(g, b);
    B.lines.splice(B.lines.indexOf(L), 1);
    g.topologyDirty = true; Game.recompute(g);
    let r = Bot.buildLine(B, d, k);
    if (!(r && r.ok)) r = Bot.buildLine(B, d, 0);
    B.badDeps.delete(d.id);
    return r;
  },
  upgradeBelts(B, L) {
    const g = B.g;
    for (const id of L.beltIds) { const b = g.buildings.get(id); if (b) Grid.upgrade(g, b); }
    g.topologyDirty = true;
  },
  addSeller(B, type) {
    const g = B.g;
    const sz = Grid.size(type, 0);
    for (const s of B.silos) {
      const spot = Bot.spiralSpot(g, s.x - sz.w, s.y - sz.h, type, 0, (x, y) => Bot.touches(s, x, y, sz.w, sz.h), 12);
      if (spot) {
        const b = Grid.place(g, { type, x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true });
        if (b) {
          B.sellers.push(b);
          if (type === 'bazaar') Bot.layPath(B, b);
          return true;
        }
      }
    }
    // no room left: open a new hub silo next to the existing hub
    const last = B.silos[B.silos.length - 1];
    if (g.run.money >= Grid.cost(g, 'silo')) {
      const spot = Bot.spiralSpot(g, last.x + 14, last.y, 'silo', 0, null, 30);
      if (spot) { const b = Grid.place(g, { type: 'silo', x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true }); if (b) { b.outEnabled = false; B.silos.push(b); } }
    }
    return false;
  },
  layPath(B, b) {
    const g = B.g;
    const specs = [];
    for (let d = 0; d < 4 && specs.length < 8; d++) {
      let x = b.x + (d === 0 ? b.w : d === 2 ? -1 : 1), y = b.y + (d === 1 ? b.h : d === 3 ? -1 : 0);
      for (let i = 0; i < 8 && specs.length < 8; i++) {
        if (!Bot.free(g, x, y)) break;
        specs.push({ type: 'path', x, y, rot: 0 });
        x += U.DX[d]; y += U.DY[d];
      }
    }
    if (specs.length) Actions.placeMany(g, specs, { ignoreRadius: true });
  },
  terminal(B) {
    const g = B.g;
    if (g.run.custTier < 5 || (g.lists.terminal || []).length) return false;
    const cost = Grid.cost(g, 'terminal');
    if (cost > g.run.money * 0.7) return false;
    for (const s of B.silos) {
      const spot = Bot.spiralSpot(g, s.x - 7, s.y - 7, 'terminal', 0, (x, y) => Bot.touches(s, x, y, 7, 7), 16);
      if (spot) { const b = Grid.place(g, { type: 'terminal', x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true }); if (b) { B.sellers.push(b); return true; } }
    }
    return false;
  },
  research(B) {
    const g = B.g;
    if (!B.lab) {
      if (g.run.earned < 3000 || g.run.money < Grid.cost(g, 'lab') + 300) return false;
      const spot = Bot.spiralSpot(g, B.hub.x - 12, B.hub.y - 10, 'lab', 0, null, 30);
      if (!spot) return false;
      B.lab = Grid.place(g, { type: 'lab', x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true });
      return !!B.lab;
    }
    if (g.run.research.active) return false;
    // cheap research is always taken right away; expensive research competes in the candidate list
    for (const id of Bot.RESEARCH_PLAN) {
      const r = DATA.RESEARCH_BY_ID[id];
      if (Progression.researchState(g, r) !== 'available') continue;
      if (Progression.researchCost(g, r) > g.run.money * 0.25) return false;
      return !Progression.startResearch(g, id);
    }
    return false;
  },
  explore(B) {
    const g = B.g;
    if (g.run.time - B.lastScan < 30) return;
    B.lastScan = g.run.time;
    B.exploreA += 1.1;
    B.exploreR = Math.min(400, B.exploreR + 4);
    const x = B.hub.x + Math.cos(B.exploreA) * B.exploreR, y = B.hub.y + Math.sin(B.exploreA) * B.exploreR;
    World.discover(g.world, x, y, g.mods.scanRadius);
    World.reveal(g.world, x, y, g.mods.scanRadius);
  },

  decide(B) {
    const g = B.g;
    if (g.run.time < B.busyUntil || g.run.time < 8) return;
    for (const L of B.lines) { L.rate = Bot.lineRate(g, L); }
    if (Bot.ensureHub(B)) return;
    Bot.explore(B);
    if (Bot.research(B)) { B.busyUntil = g.run.time + 4; return; }
    if (Bot.terminal(B)) return;
    if (!B.lines.length) {
      const dep = Bot.bestDeposit(B, g.run.money);
      if (dep) Bot.buildLine(B, dep.d, 0);
      return;
    }
    if (!B.silos.length) return;
    const { out, R0 } = Bot.candidates(B);
    if (!out.length) return;
    out.sort((a, b) => b.ratio - a.ratio);
    const best = out[0];
    const income = Math.max(0.1, R0 * g.mods.sales);
    let pick = null;
    if (best.cost <= g.run.money) pick = best;
    else if ((best.cost - g.run.money) / income > 1800) pick = out.find(o => o.cost <= g.run.money && o.ratio >= best.ratio * 0.3);
    if (!pick) return;
    const r = pick.act();
    if (pick.label.startsWith('line') && !(r && r.ok)) return;
    B.busyUntil = Math.max(B.busyUntil, g.run.time + Bot.HUMAN_DELAY);
  },

  *runIter(opts = {}) {
    const B = Bot.create(opts);
    const g = B.g;
    const maxT = (opts.maxHours || 6) * 3600;
    const th = Progression.threshold(g.run.planet);
    let lastHour = 0, lastEarned = 0;
    const hourly = [];
    while (g.run.time < maxT) {
      for (let i = 0; i < CONFIG.tickRate; i++) Game.tick(g);
      g.events.length = 0;
      if ((g.tick / CONFIG.tickRate) % 2 === 0) Bot.decide(B);
      if (g.run.earned > 0) Bot.mark(B, 'firstSale');
      for (let t = 1; t <= g.run.custTier; t++) Bot.mark(B, 'tier' + (t + 1));
      if (g.run.earned >= th) { Bot.mark(B, 'rebirth'); if (!opts.continueAfterRebirth) break; }
      if (g.run.time - lastHour >= 3600) { lastHour += 3600; hourly.push(g.run.earned - lastEarned); lastEarned = g.run.earned; }
      if (g.tick % (CONFIG.tickRate * 60) === 0) {
        if (opts.trace && g.tick % (CONFIG.tickRate * 600) === 0) {
          const sellers = {}; for (const b of g.lists.seller) sellers[b.type] = (sellers[b.type] || 0) + 1;
          const m = Bot.model(B);
          const P = m.lines.reduce((a, l) => a + l.r, 0), C = m.caps.reduce((a, c) => a + c, 0);
          opts.trace(Fmt.time(g.run.time) + ' earned ' + Fmt.num(g.run.earned) + ' inc ' + Fmt.num(g.income) + '/s money ' + Fmt.num(g.run.money) + ' lines ' + B.lines.length + ' P ' + Fmt.num(P) + ' C ' + Fmt.num(C) + ' est ' + Fmt.num(Bot.revenue(m) * g.mods.sales) + ' tier ' + (g.run.custTier + 1) + ' ' + JSON.stringify(sellers) + ' ref ' + (g.lists.refinery || []).length + ' res ' + g.run.research.done.size + ' b ' + g.buildings.size);
        }
        yield { time: g.run.time, earned: g.run.earned };
      }
    }
    return { marks: B.marks, log: B.log, hourly, time: g.run.time, earned: g.run.earned, buildings: g.buildings.size, lines: B.lines.length, sellers: B.sellers.length, planet: g.run.planet, game: g, bot: B };
  },
  run(opts) { const it = Bot.runIter(opts); let r = it.next(); while (!r.done) r = it.next(); return r.value; },
  format(rep) {
    const m = rep.marks;
    const f = k => m[k] !== undefined ? Fmt.time(m[k]) : '–';
    return [
      'Balancing-Report (Planet ' + rep.planet + ', greedy Bot)',
      'Erster Extraktor:      ' + f('firstExtractor'),
      'Erster Verkauf:        ' + f('firstSale'),
      'Erste Raffinerie:      ' + f('firstRefinery'),
      'Kundenstufe 2:         ' + f('tier2'),
      'Kundenstufe 3:         ' + f('tier3'),
      'Kundenstufe 4:         ' + f('tier4'),
      'Kundenstufe 5:         ' + f('tier5'),
      'Kundenstufe 6:         ' + f('tier6'),
      'Rebirth möglich:       ' + f('rebirth'),
      'Erlös gesamt:          ' + Fmt.money(rep.earned) + ' in ' + Fmt.time(rep.time),
      'Erlös pro Stunde:      ' + rep.hourly.map(v => Fmt.num(v)).join(' / '),
      'Gebäude ' + rep.buildings + ', Linien ' + rep.lines + ', Verkaufsgebäude ' + rep.sellers
    ].join('\n');
  }
};

// SelfTest: determinism, distribution, save roundtrip, offline bounds, NaN guard
// =====================================================================
const SelfTest = {
  run() {
    const out = [];
    const test = (name, f) => {
      try { const r = f(); out.push({ name, ok: r === true || (r && r.ok), info: r && r.info }); }
      catch (e) { out.push({ name, ok: false, info: 'Ausnahme: ' + e.message }); }
    };
    test('Chunk-Generierung deterministisch', () => {
      const a = World.create(987654, 1), b = World.create(987654, 1);
      for (let i = 0; i < 200; i++) {
        const cx = (i * 37) % 61 - 30, cy = (i * 91) % 53 - 26;
        const da = JSON.stringify(World.genChunkDeposits(a, cx, cy).map(d => [d.x, d.y, d.res, d.tiles]));
        const db = JSON.stringify(World.genChunkDeposits(b, cx, cy).map(d => [d.x, d.y, d.res, d.tiles]));
        if (da !== db) return { ok: false, info: 'Chunk ' + cx + '/' + cy + ' unterschiedlich' };
      }
      const t1 = World.terrain(a, 1234.5, -987.25), t2 = World.terrain(b, 1234.5, -987.25);
      return { ok: t1.e === t2.e && JSON.stringify(a.start) === JSON.stringify(b.start), info: '200 Chunks + Terrain + Glücksstart identisch' };
    });
    test('Weit entfernte Koordinaten (±1.000.000) stabil', () => {
      const w = World.create(42, 1);
      const d = World.genChunkDeposits(w, 31000, -31000);
      const t = World.terrain(w, 999999.5, -999999.5);
      return { ok: isFinite(t.e) && Array.isArray(d), info: 'Terrain ' + t.e.toFixed(3) };
    });
    test('Seltenheitsverteilung (100.000 Vorkommen, ±10 %)', () => {
      const w = World.create(13579, 1);
      const counts = new Array(8).fill(0);
      let n = 0;
      for (let cx = 2000; n < 100000; cx++) for (let cy = -150; cy < 150 && n < 100000; cy++) for (const d of World.genChunkDeposits(w, cx, cy)) { counts[d.tier]++; n++; }
      const tot = CONFIG.tierWeights.reduce((a, b) => a + b, 0);
      const dev = counts.map((c, t) => Math.abs(c / n / (CONFIG.tierWeights[t] / tot) - 1));
      const worst = Math.max(...dev);
      return { ok: worst <= 0.10, info: 'max. Abweichung ' + (worst * 100).toFixed(1) + ' % · ' + counts.map(c => (c / n * 100).toFixed(1)).join('/') };
    });
    test('91 Rohstoffe, Verteilung 25/20/16/12/8/5/3/2, Namen eindeutig', () => {
      const per = DATA.BY_TIER.map(a => a.length).join('/');
      const uniq = new Set(DATA.RESOURCES.map(r => r.name)).size;
      return { ok: DATA.RESOURCES.length === 91 && per === '25/20/16/12/8/5/3/2' && uniq === 91, info: per + ' · ' + uniq + ' eindeutige Namen' };
    });
    test('Glücksstart immer spielbar', () => {
      const luck = [0, 0, 0, 0];
      for (let s = 1; s <= 2000; s++) {
        const w = World.create(s * 7919, 1);
        luck[w.start.luck]++;
        if (!w.start.deposits.some(d => d.tier === 0)) return { ok: false, info: 'Seed ' + s + ' ohne gewöhnliches Vorkommen' };
        const L = CONFIG.landing;
        if (!w.start.deposits.every(d => Math.hypot(d.x - L.x, d.y - L.y) <= CONFIG.startRadius)) return { ok: false, info: 'Vorkommen außerhalb des Startradius' };
      }
      return { ok: true, info: 'Normal/Gut/Jackpot/Wunder: ' + luck.map(c => (c / 20).toFixed(1) + ' %').join(' / ') + ' (Ziel 70/20/8/2)' };
    });
    let g;
    test('Bauen, Logistik und Verkauf', () => {
      g = SelfTest.sampleGame();
      for (let i = 0; i < 20 * 180; i++) Game.tick(g);
      return { ok: g.run.earned > 0, info: Fmt.money(g.run.earned) + ' nach 3 Minuten' };
    });
    test('Speichern/Laden verlustfrei', () => {
      const s1 = Save.serialize(g);
      const back = Save.fromObject(JSON.parse(s1)).game;
      const s2 = Save.serialize(back);
      const a = JSON.parse(s1), b = JSON.parse(s2);
      delete a.savedAt; delete b.savedAt; delete a.lastSeen; delete b.lastSeen;
      const same = JSON.stringify(a) === JSON.stringify(b);
      const exp = Save.parseImport(Save.exportString(g));
      return { ok: same && exp.loaded.game.buildings.size === g.buildings.size, info: g.buildings.size + ' Gebäude, ' + (s1.length / 1024).toFixed(1) + ' KB' };
    });
    test('Offline monoton und auf 8 h begrenzt', () => {
      const s = Save.serialize(g);
      const res = [600, 3600, 4 * 3600, 8 * 3600, 20 * 3600].map(sec => Offline.simulate(Save.fromObject(JSON.parse(s)).game, sec));
      let mono = true;
      for (let i = 1; i < res.length; i++) if (res[i].earned + 1e-6 < res[i - 1].earned) mono = false;
      const capped = res[4].seconds === CONFIG.offlineMax && Math.abs(res[4].earned - res[3].earned) < 1e-6;
      return { ok: mono && capped && res.every(r => isFinite(r.earned)), info: res.map(r => Fmt.num(r.earned)).join(' ≤ ') };
    });
    test('Offline-Berechnung schnell (2.000 Gebäude)', () => {
      const big = SelfTest.bigGame(2000);
      const t0 = Date.now();
      const r = Offline.simulate(big, 8 * 3600);
      const ms = Date.now() - t0;
      return { ok: ms < 300 && isFinite(r.earned), info: ms + ' ms für ' + big.buildings.size + ' Gebäude' };
    });
    test('Keine NaN/Infinity in der Wirtschaft', () => {
      const vals = [g.run.money, g.run.earned, g.meta.totalEarned, g.income, ...g.run.demand.d, ...g.run.demand.s, g.mods.sales];
      const huge = Fmt.num(1e308) + Fmt.num(Infinity) + Fmt.num(NaN);
      return { ok: vals.every(v => isFinite(v)) && !/NaN|Infinity/.test(huge), info: 'Formatierung: ' + Fmt.num(1e45) + ', ' + Fmt.num(NaN) };
    });
    test('Undo/Redo', () => {
      const g2 = SelfTest.sampleGame();
      const n0 = g2.buildings.size, m0 = g2.run.money;
      Actions.placeMany(g2, [{ type: 'belt', x: 40, y: 40, rot: 0 }, { type: 'belt', x: 41, y: 40, rot: 0 }], { ignoreRadius: true });
      const n1 = g2.buildings.size;
      Actions.undo(g2);
      const n2 = g2.buildings.size, m2 = g2.run.money;
      Actions.redo(g2);
      return { ok: n1 === n0 + 2 && n2 === n0 && Math.abs(m2 - m0) < 1e-6 && g2.buildings.size === n1, info: n0 + ' → ' + n1 + ' → ' + n2 + ' → ' + g2.buildings.size };
    });
    return out;
  },

  // Small working setup next to the first common start deposit.
  sampleGame(seed = 4242) {
    const meta = Game.createMeta(seed);
    const g = Game.create(meta, 1);
    g.run.money = 5000;
    const d = g.world.start.deposits.find(x => x.tier === 0);
    let ex = null;
    for (let dy = -2; dy <= 1 && !ex; dy++) for (let dx = -2; dx <= 1 && !ex; dx++) ex = Grid.place(g, { type: 'extractor', x: d.x + dx, y: d.y + dy, rot: 0 }, { ignoreRadius: true });
    if (!ex) return g;
    const bx = ex.x + 2;
    let len = 0;
    for (let i = 0; i < 12; i++) { if (Grid.place(g, { type: 'belt', x: bx + i, y: ex.y, rot: 0 }, { ignoreRadius: true })) len++; else break; }
    Grid.place(g, { type: 'bazaar', x: bx + len, y: ex.y - 1, rot: 0 }, { ignoreRadius: true });
    Grid.place(g, { type: 'silo', x: bx + len, y: ex.y + 1, rot: 0 }, { ignoreRadius: true });
    return g;
  },
  // Synthetic large factory for performance tests.
  bigGame(n) {
    const meta = Game.createMeta(99);
    const g = Game.create(meta, 1);
    g.run.money = 1e15;
    let placed = 0, row = 0;
    const deps = [];
    for (let cx = 3; deps.length < 300 && cx < 40; cx++) for (let cy = -10; cy < 10; cy++) for (const d of World.chunkDeposits(g.world, cx, cy)) deps.push(d);
    for (const d of deps) {
      if (placed >= n) break;
      const ex = Grid.place(g, { type: 'extractor', x: d.x, y: d.y, rot: 0 }, { ignoreRadius: true });
      if (!ex) continue;
      placed++;
      for (let i = 0; i < 4; i++) if (Grid.place(g, { type: 'belt', x: ex.x + 2 + i, y: ex.y, rot: 0 }, { ignoreRadius: true })) placed++;
      if (Grid.place(g, { type: 'silo', x: ex.x + 6, y: ex.y - 1, rot: 0 }, { ignoreRadius: true })) placed++;
      row++;
    }
    let y = -400;
    while (placed < n) { for (let x = 0; x < 40 && placed < n; x++) if (Grid.place(g, { type: 'belt', x: -300 + x, y, rot: 0 }, { ignoreRadius: true })) placed++; y++; }
    Game.recompute(g);
    return g;
  }
};

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};

// =====================================================================
// Audio: synthesised with Web Audio, started after first user gesture
// =====================================================================
const Audio2 = {
  ctx: null, master: null, sfx: null, music: null, drone: null, started: false, lastPlay: {},

  start() {
    if (Audio2.started) { if (Audio2.ctx && Audio2.ctx.state === 'suspended') Audio2.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const ctx = new AC();
      Audio2.ctx = ctx;
      Audio2.master = ctx.createGain(); Audio2.master.connect(ctx.destination);
      Audio2.sfx = ctx.createGain(); Audio2.sfx.connect(Audio2.master);
      Audio2.music = ctx.createGain(); Audio2.music.connect(Audio2.master);
      Audio2.started = true;
      Audio2.applyVolume();
      if (App.g) Audio2.setPlanet(App.g.run.planet);
    } catch (e) { Audio2.ctx = null; }
  },
  applyVolume() {
    if (!Audio2.ctx) return;
    const s = App.settings;
    const t = Audio2.ctx.currentTime;
    Audio2.master.gain.setTargetAtTime(s.sound ? 1 : 0, t, 0.05);
    Audio2.sfx.gain.setTargetAtTime(s.volume, t, 0.05);
    Audio2.music.gain.setTargetAtTime(s.music * 0.5, t, 0.3);
  },
  ok(name, gap = 0.04) {
    if (!Audio2.ctx || !App.settings.sound) return false;
    const now = Audio2.ctx.currentTime;
    if (Audio2.lastPlay[name] && now - Audio2.lastPlay[name] < gap) return false;
    Audio2.lastPlay[name] = now;
    return true;
  },
  tone(freq, dur, type = 'sine', vol = 0.2, opts = {}) {
    const ctx = Audio2.ctx;
    const t = ctx.currentTime + (opts.delay || 0);
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slide), t + dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + (opts.attack || 0.005));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(opts.dest || Audio2.sfx);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, opts = {}) {
    const ctx = Audio2.ctx;
    const t = ctx.currentTime + (opts.delay || 0);
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = opts.filter || 'lowpass';
    f.frequency.setValueAtTime(opts.f0 || 1200, t);
    if (opts.f1) f.frequency.exponentialRampToValueAtTime(opts.f1, t + dur);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + (opts.attack || 0.01));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(gn); gn.connect(Audio2.sfx);
    src.start(t); src.stop(t + dur + 0.02);
  },
  play(name, arg) {
    if (!Audio2.ok(name, name === 'sell' ? 0.08 : 0.04)) return;
    switch (name) {
      case 'click': Audio2.tone(880, 0.05, 'triangle', 0.08); break;
      case 'open': Audio2.tone(520, 0.08, 'sine', 0.08); Audio2.tone(780, 0.1, 'sine', 0.06, { delay: 0.05 }); break;
      case 'build': Audio2.tone(140, 0.16, 'square', 0.12, { slide: 70 }); Audio2.noise(0.12, 0.12, { f0: 900, f1: 200 }); break;
      case 'belt': Audio2.tone(320, 0.05, 'triangle', 0.06); break;
      case 'remove': Audio2.tone(300, 0.18, 'sawtooth', 0.08, { slide: 90 }); break;
      case 'error': Audio2.tone(180, 0.14, 'square', 0.08); Audio2.tone(140, 0.16, 'square', 0.07, { delay: 0.08 }); break;
      case 'sell': {
        const base = 1046 * Math.pow(1.12, arg || 0);
        Audio2.tone(base, 0.12, 'triangle', 0.09); Audio2.tone(base * 1.5, 0.18, 'sine', 0.07, { delay: 0.06 });
        break;
      }
      case 'coin': Audio2.tone(1568, 0.08, 'square', 0.05); Audio2.tone(2093, 0.12, 'square', 0.04, { delay: 0.05 }); break;
      case 'scan': Audio2.tone(300, 0.9, 'sine', 0.12, { slide: 1400, attack: 0.02 }); Audio2.tone(1400, 0.25, 'sine', 0.05, { delay: 0.6 }); break;
      case 'found': [660, 880, 1320].forEach((f, i) => Audio2.tone(f, 0.18, 'triangle', 0.08, { delay: i * 0.08 })); break;
      case 'event': [523, 659, 784, 1046].forEach((f, i) => Audio2.tone(f, 0.22, 'triangle', 0.08, { delay: i * 0.09 })); break;
      case 'unlock': [392, 523, 659, 784, 1046].forEach((f, i) => Audio2.tone(f, 0.3, 'sine', 0.09, { delay: i * 0.07 })); break;
      case 'upgrade': Audio2.tone(440, 0.1, 'triangle', 0.08); Audio2.tone(660, 0.14, 'triangle', 0.08, { delay: 0.07 }); Audio2.tone(990, 0.16, 'triangle', 0.07, { delay: 0.14 }); break;
      case 'rebirth': Audio2.noise(2.4, 0.25, { f0: 200, f1: 6000, attack: 0.8 }); Audio2.tone(60, 2.5, 'sawtooth', 0.12, { slide: 600, attack: 0.5 }); break;
      case 'land': Audio2.noise(1.2, 0.2, { f0: 3000, f1: 150 }); break;
      case 'warn': Audio2.tone(620, 0.1, 'square', 0.05); Audio2.tone(620, 0.1, 'square', 0.05, { delay: 0.16 }); break;
    }
  },
  // Ambient drone per planet: two detuned oscillators through a slowly moving filter.
  setPlanet(k) {
    if (!Audio2.ctx) return;
    const ctx = Audio2.ctx;
    if (Audio2.drone) { const d = Audio2.drone; d.gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.5); setTimeout(() => { try { d.nodes.forEach(n => n.stop()); } catch (e) { /* stopped */ } }, 2000); }
    const roots = [55, 61.7, 73.4, 49, 65.4, 82.4, 69.3, 41.2];
    const root = roots[(k - 1) % roots.length] * (k > 8 ? Math.pow(1.06, k % 5) : 1);
    const gain = ctx.createGain(); gain.gain.value = 0.0001;
    const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 420; filt.Q.value = 6;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + (k % 3) * 0.02;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 260;
    lfo.connect(lfoGain); lfoGain.connect(filt.frequency);
    const nodes = [lfo];
    [[root, 'sawtooth', 0.5], [root * 1.004, 'sawtooth', 0.5], [root * 1.5, 'triangle', 0.35], [root * 2.01, 'sine', 0.25]].forEach(([f, type, v]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
      const gg = ctx.createGain(); gg.gain.value = v;
      o.connect(gg); gg.connect(filt); o.start(); nodes.push(o);
    });
    filt.connect(gain); gain.connect(Audio2.music);
    lfo.start();
    gain.gain.setTargetAtTime(0.08, ctx.currentTime, 2);
    Audio2.drone = { gain, nodes };
  }
};

// Colour helpers and cached sprites (glows, items)
// =====================================================================
const Col = {
  cache: new Map(),
  rgb(hex) {
    let c = Col.cache.get(hex);
    if (c) return c;
    const s = hex.replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(x => x + x).join('') : s, 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    Col.cache.set(hex, c);
    return c;
  },
  hex(r, g, b) { return '#' + [r, g, b].map(v => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); },
  mix(a, b, t) { const A = Col.rgb(a), B = Col.rgb(b); return Col.hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); },
  shade(hex, f) { return f >= 0 ? Col.mix(hex, '#ffffff', f) : Col.mix(hex, '#000000', -f); },
  rgba(hex, a) { const c = Col.rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; },
  hsl(h, s, l) { return 'hsl(' + (h % 360) + ',' + s + '%,' + l + '%)'; },
  prism(t, off = 0) { return Col.hsl(((t * 90 + off) % 360 + 360) % 360, 90, 72); }
};

const Sprites = {
  glows: new Map(),
  items: new Map(),
  // Radial glow sprite (64px) in a given colour.
  glow(color) {
    let c = Sprites.glows.get(color);
    if (c) return c;
    c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, Col.rgba(color, 0.9));
    gr.addColorStop(0.35, Col.rgba(color, 0.45));
    gr.addColorStop(1, Col.rgba(color, 0));
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    Sprites.glows.set(color, c);
    return c;
  },
  // Path for one of the 14 item shapes centred at 0,0 with radius r.
  shapePath(ctx, shape, r) {
    ctx.beginPath();
    const poly = (n, rot = -Math.PI / 2, rr = r) => { for (let i = 0; i < n; i++) { const a = rot + i * Math.PI * 2 / n; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); };
    switch (shape) {
      case 'circle': ctx.arc(0, 0, r, 0, Math.PI * 2); break;
      case 'square': ctx.rect(-r * 0.82, -r * 0.82, r * 1.64, r * 1.64); break;
      case 'diamond': poly(4, -Math.PI / 2, r * 1.1); break;
      case 'triangle': poly(3, -Math.PI / 2, r * 1.15); break;
      case 'hexagon': poly(6, 0); break;
      case 'pentagon': poly(5); break;
      case 'octagon': poly(8, Math.PI / 8); break;
      case 'star': for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.48 : r * 1.1; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); break;
      case 'cross': { const a = r * 0.36; ctx.moveTo(-a, -r); ctx.lineTo(a, -r); ctx.lineTo(a, -a); ctx.lineTo(r, -a); ctx.lineTo(r, a); ctx.lineTo(a, a); ctx.lineTo(a, r); ctx.lineTo(-a, r); ctx.lineTo(-a, a); ctx.lineTo(-r, a); ctx.lineTo(-r, -a); ctx.lineTo(-a, -a); ctx.closePath(); break; }
      case 'ring': ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.moveTo(r * 0.45, 0); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2, true); break;
      case 'crescent': ctx.arc(0, 0, r, Math.PI * 0.25, Math.PI * 1.75); ctx.arc(r * 0.45, 0, r * 0.7, Math.PI * 1.6, Math.PI * 0.4, true); ctx.closePath(); break;
      case 'drop': ctx.moveTo(0, -r * 1.15); ctx.bezierCurveTo(r * 0.9, -r * 0.2, r * 0.95, r, 0, r); ctx.bezierCurveTo(-r * 0.95, r, -r * 0.9, -r * 0.2, 0, -r * 1.15); ctx.closePath(); break;
      case 'capsule': { const w = r * 0.55; ctx.moveTo(-w, -r * 0.5); ctx.arc(0, -r * 0.5, w, Math.PI, 0); ctx.lineTo(w, r * 0.5); ctx.arc(0, r * 0.5, w, 0, Math.PI); ctx.closePath(); break; }
      case 'trapezoid': ctx.moveTo(-r * 0.55, -r * 0.8); ctx.lineTo(r * 0.55, -r * 0.8); ctx.lineTo(r, r * 0.8); ctx.lineTo(-r, r * 0.8); ctx.closePath(); break;
      default: ctx.arc(0, 0, r, 0, Math.PI * 2);
    }
  },
  // Draws an item icon (used for sprites and UI thumbnails).
  drawItem(ctx, res, ref, r, t = 0) {
    const R = DATA.RESOURCES[res];
    const tier = DATA.TIERS[R.tier];
    const fill = R.tier === 7 ? Col.prism(t, res * 120) : R.color;
    Sprites.shapePath(ctx, R.shape, r);
    const gr = ctx.createLinearGradient(-r, -r, r, r);
    gr.addColorStop(0, Col.shade(fill, 0.35));
    gr.addColorStop(1, Col.shade(fill, -0.25));
    ctx.fillStyle = gr;
    ctx.fill('evenodd');
    ctx.lineWidth = Math.max(1, r * 0.16);
    ctx.strokeStyle = R.tier === 0 ? 'rgba(20,16,18,.8)' : Col.shade(tier.color, -0.15);
    if (R.tier === 7) ctx.strokeStyle = Col.prism(t, 180);
    ctx.stroke();
    // highlight
    ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.36, r * 0.22, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
    if (ref > 0) {
      const rc = ref === 1 ? '#e6edf5' : ref === 2 ? '#ffcf4a' : Col.prism(t, 40);
      ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(1, r * (0.12 + ref * 0.05)); ctx.strokeStyle = rc; ctx.stroke();
      if (ref >= 2) { for (let i = 0; i < ref; i++) { const a = -Math.PI / 2 + (i - (ref - 1) / 2) * 0.55; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 1.3, Math.sin(a) * r * 1.3, r * 0.2, 0, Math.PI * 2); ctx.fillStyle = rc; ctx.fill(); } }
    }
  },
  // Cached 40px sprite per (res, ref); exotic/exquisite are drawn live for animation.
  item(res, ref) {
    const key = res * 4 + ref;
    let c = Sprites.items.get(key);
    if (c) return c;
    c = document.createElement('canvas'); c.width = c.height = 48;
    const x = c.getContext('2d');
    x.translate(24, 24);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.ellipse(1, 3, 15, 13, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,.28)'; x.beginPath(); x.arc(0, 0, 17, 0, Math.PI * 2); x.fill();
    Sprites.drawItem(x, res, ref, 14, 0);
    Sprites.items.set(key, c);
    return c;
  },
  // Small canvas for DOM usage (codex, panels).
  itemCanvas(res, ref, size = 40, unknown = false) {
    const c = document.createElement('canvas');
    const d = Math.min(2, window.devicePixelRatio || 1);
    c.width = c.height = Math.round(size * d);
    const x = c.getContext('2d');
    x.scale(d, d); x.translate(size / 2, size / 2);
    if (unknown) {
      Sprites.shapePath(x, DATA.RESOURCES[res].shape, size * 0.3);
      x.fillStyle = '#3a3340'; x.fill('evenodd');
      x.fillStyle = '#9a8f96'; x.font = 'bold ' + Math.round(size * 0.34) + 'px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('?', 0, 1);
    } else {
      const tier = DATA.RESOURCES[res].tier;
      if (tier > 0) { x.globalAlpha = 0.25 + tier * 0.08; x.drawImage(Sprites.glow(DATA.TIERS[tier].color), -size / 2, -size / 2, size, size); x.globalAlpha = 1; }
      Sprites.drawItem(x, res, ref, size * 0.27, 0);
    }
    return c;
  }
};

// Render: camera, terrain chunks, decorations, deposits, particles, overlays
// =====================================================================
const Render = {
  canvas: null, ctx: null,
  chunks: new Map(), chunkGenBudget: 2,
  ox: 0, oy: 0, S: 1,
  particles: [], pool: [],
  palette: null, planetStyle: 1,
  floating: [],
  edgeMarks: [],
  stormT: 0, storm: 0, nextStorm: 300,

  init(canvas) {
    Render.canvas = canvas;
    Render.ctx = canvas.getContext('2d', { alpha: false });
    Render.resize();
  },
  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth, hh = window.innerHeight;
    App.view.w = w; App.view.h = hh; App.view.dpr = dpr;
    Render.canvas.width = Math.round(w * dpr);
    Render.canvas.height = Math.round(hh * dpr);
  },
  setPlanet(planet) {
    Render.chunks.clear();
    Render.palette = planet;
    Render.planetStyle = planet.index <= 8 ? planet.index : (RNG.hash(planet.index, 3) % 8) + 1;
    document.documentElement.style.setProperty('--accent', planet.accent);
    const lum = Col.rgb(planet.accent).reduce((a, c, i) => a + c * [0.299, 0.587, 0.114][i], 0);
    document.documentElement.style.setProperty('--accent-ink', lum > 140 ? '#160b04' : '#ffffff');
  },

  // ---------------- coordinates ----------------
  worldToScreen(x, y) {
    const c = App.cam;
    return [(x - c.x) * c.zoom + App.view.w / 2, (y - c.y) * c.zoom + App.view.h / 2];
  },
  screenToWorld(sx, sy) {
    const c = App.cam;
    return [(sx - App.view.w / 2) / c.zoom + c.x, (sy - App.view.h / 2) / c.zoom + c.y];
  },
  visibleRect(margin = 2) {
    const c = App.cam;
    const hw = App.view.w / 2 / c.zoom, hh = App.view.h / 2 / c.zoom;
    return { x0: Math.floor(c.x - hw - margin), y0: Math.floor(c.y - hh - margin), x1: Math.ceil(c.x + hw + margin), y1: Math.ceil(c.y + hh + margin) };
  },
  setWorldTransform(ctx) {
    const c = App.cam, d = App.view.dpr;
    Render.ox = Math.floor(c.x); Render.oy = Math.floor(c.y);
    const S = d * c.zoom;
    Render.S = S;
    ctx.setTransform(S, 0, 0, S, d * App.view.w / 2 - S * (c.x - Render.ox), d * App.view.h / 2 - S * (c.y - Render.oy));
  },

  // ---------------- terrain ----------------
  smooth(a, b, x) { const t = U.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); },
  terrainColor(w, x, y, out) {
    const P = Render.palette, st = Render.planetStyle;
    const t = World.terrain(w, x, y);
    const v = U.clamp(t.e * 0.6 + 0.5, 0, 1);
    const band = v * 4, fl = Math.floor(band);
    const vv = (fl + Render.smooth(0.4, 0.6, band - fl)) / 4;
    const g0 = Col.rgb(P.ground[0]), g1 = Col.rgb(P.ground[1]), g2 = Col.rgb(P.ground[2]);
    let r, g, b;
    if (vv < 0.5) { const k = vv * 2; r = g0[0] + (g1[0] - g0[0]) * k; g = g0[1] + (g1[1] - g0[1]) * k; b = g0[2] + (g1[2] - g0[2]) * k; }
    else { const k = (vv - 0.5) * 2; r = g1[0] + (g2[0] - g1[0]) * k; g = g1[1] + (g2[1] - g1[1]) * k; b = g1[2] + (g2[2] - g1[2]) * k; }
    const wDune = Render.smooth(0.15, 0.35, t.b), wCrater = Render.smooth(-0.2, -0.4, t.b);
    const wRock = Render.smooth(0.15, 0.35, t.r), wRub = Render.smooth(-0.15, -0.35, t.r);
    let f = 1 + t.d * 0.05;
    if (wDune > 0) { const rip = Math.sin(x * 1.1 + y * 0.45 + t.e * 7); f *= 1 + wDune * (0.07 + rip * 0.04); }
    if (wCrater > 0) f *= 1 - wCrater * 0.12;
    if (wRub > 0 && t.d > 0.25) f *= 1 - wRub * 0.1;
    r *= f; g *= f; b *= f;
    if (wRock > 0) { const rc = Col.rgb(P.rock); const k = wRock * 0.35; r += (rc[0] - r) * k; g += (rc[1] - g) * k; b += (rc[2] - b) * k; }
    // planet specific
    if (st === 2 && t.e < -0.42) { const k = Render.smooth(-0.42, -0.55, t.e); const a = Col.rgb(P.accent); r += (a[0] - r) * k * 0.75; g += (a[1] - g) * k * 0.75; b += (a[2] - b) * k * 0.75; }
    if (st === 3 && t.d > 0.45) { r += (255 - r) * 0.3; g += (255 - g) * 0.3; b += (255 - b) * 0.3; }
    if (st === 4) { const vein = Math.abs(w.noiseC.noise2(x / 14, y / 14)); if (vein < 0.05) { const k = 1 - vein / 0.05; r += (255 - r) * k * 0.85; g += (110 - g) * k * 0.85; b += (30 - b) * k * 0.85; } }
    if (st === 5 && t.d > 0.3) { const k = Render.smooth(0.3, 0.6, t.d) * 0.4; const a = t.b > 0 ? [140, 220, 120] : [170, 100, 230]; r += (a[0] - r) * k; g += (a[1] - g) * k; b += (a[2] - b) * k; }
    if (st === 6) { const gx = ((x % 8) + 8) % 8, gy = ((y % 8) + 8) % 8; if (gx < 0.12 || gy < 0.12) { r += 30; g += 60; b += 80; } }
    if (st === 7 && t.d > 0.55) { r += 40; g += 40; b += 50; }
    if (st === 8 && w.noiseC.noise2(x * 3.1, y * 3.1) > 0.78) { r = 220; g = 220; b = 255; }
    const sky = P.sky;
    out[0] = r * 0.95 + sky[0] * 0.05; out[1] = g * 0.95 + sky[1] * 0.05; out[2] = b * 0.95 + sky[2] * 0.05;
  },
  genChunk(g, cx, cy) {
    const S = CONFIG.chunkSize;
    const spt = App.quality === 'low' ? 2 : 3;
    const n = S * spt;
    const c = document.createElement('canvas'); c.width = c.height = n;
    const x = c.getContext('2d');
    const img = x.createImageData(n, n);
    const d = img.data, col = [0, 0, 0];
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      Render.terrainColor(g.world, cx * S + (i + 0.5) / spt, cy * S + (j + 0.5) / spt, col);
      const o = (j * n + i) * 4;
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    return c;
  },
  drawTerrain(ctx, g, vr) {
    const S = CONFIG.chunkSize;
    const cx0 = Math.floor(vr.x0 / S), cy0 = Math.floor(vr.y0 / S), cx1 = Math.floor(vr.x1 / S), cy1 = Math.floor(vr.y1 / S);
    let budget = Render.chunkGenBudget;
    ctx.imageSmoothingEnabled = true;
    const P = Render.palette;
    const need = [];
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const key = U.chunkKey(cx, cy);
      let ch = Render.chunks.get(key);
      const rx = cx * S - Render.ox, ry = cy * S - Render.oy;
      if (ch) { ch.last = App.frame; ctx.drawImage(ch.canvas, rx, ry, S + 0.02, S + 0.02); }
      else {
        ctx.fillStyle = P.ground[1]; ctx.fillRect(rx, ry, S + 0.02, S + 0.02);
        need.push([cx, cy, U.dist2(cx * S + 16, cy * S + 16, App.cam.x, App.cam.y)]);
      }
    }
    need.sort((a, b) => a[2] - b[2]);
    for (const [cx, cy] of need) {
      if (budget-- <= 0) break;
      Render.chunks.set(U.chunkKey(cx, cy), { canvas: Render.genChunk(g, cx, cy), last: App.frame });
    }
    if (Render.chunks.size > 160) {
      const arr = [...Render.chunks.entries()].sort((a, b) => a[1].last - b[1].last);
      for (let i = 0; i < arr.length - 120; i++) Render.chunks.delete(arr[i][0]);
    }
  },

  drawDecor(ctx, g, vr) {
    const S = CONFIG.chunkSize, P = Render.palette, st = Render.planetStyle;
    const z = App.cam.zoom;
    const cx0 = Math.floor(vr.x0 / S), cy0 = Math.floor(vr.y0 / S), cx1 = Math.floor(vr.x1 / S), cy1 = Math.floor(vr.y1 / S);
    const rock = P.rock, deco = P.deco;
    const tm = App.now / 1000;
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      for (const d of World.chunkDecor(g.world, cx, cy)) {
        if (d.x < vr.x0 - 4 || d.x > vr.x1 + 4 || d.y < vr.y0 - 4 || d.y > vr.y1 + 4) continue;
        const x = d.x - Render.ox, y = d.y - Render.oy;
        switch (d.type) {
          case 'crater': {
            ctx.fillStyle = 'rgba(0,0,0,.16)';
            ctx.beginPath(); ctx.ellipse(x, y, d.size, d.size * 0.82, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,.12)';
            ctx.beginPath(); ctx.ellipse(x + d.size * 0.08, y + d.size * 0.1, d.size * 0.72, d.size * 0.58, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = Math.min(0.12, d.size * 0.05);
            ctx.beginPath(); ctx.ellipse(x, y, d.size, d.size * 0.82, 0, Math.PI * 1.05, Math.PI * 1.65); ctx.stroke();
            break;
          }
          case 'rock': {
            const r = d.size;
            ctx.fillStyle = 'rgba(0,0,0,.22)';
            ctx.beginPath(); ctx.ellipse(x + r * 0.2, y + r * 0.35, r, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = st === 7 ? Col.mix(rock, '#ffffff', 0.4 + 0.2 * Math.sin(tm * 2 + d.v * 9)) : rock;
            ctx.beginPath();
            const n = 6;
            for (let i = 0; i < n; i++) { const a = d.rot + i * Math.PI * 2 / n; const rr = r * (0.75 + ((d.v * 997 * (i + 1)) % 1) * 0.35); const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.8; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.14)';
            ctx.beginPath(); ctx.ellipse(x - r * 0.2, y - r * 0.25, r * 0.4, r * 0.25, -0.4, 0, Math.PI * 2); ctx.fill();
            break;
          }
          case 'pebble':
            if (z < 18) break;
            ctx.fillStyle = Col.rgba(rock, 0.8);
            ctx.beginPath(); ctx.arc(x, y, d.size, 0, Math.PI * 2); ctx.fill();
            break;
          case 'vein':
            ctx.strokeStyle = st === 4 ? Col.rgba('#ff7a2a', 0.55 + 0.25 * Math.sin(tm * 2 + d.v * 7)) : Col.rgba(deco, 0.35);
            ctx.lineWidth = st === 4 ? 0.12 : 0.07; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + Math.cos(d.rot + 0.7) * d.size, y + Math.sin(d.rot + 0.7) * d.size, x + Math.cos(d.rot) * d.size * 2, y + Math.sin(d.rot) * d.size * 2);
            ctx.stroke();
            break;
          case 'ripple':
            if (z < 14) break;
            ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 0.05; ctx.lineCap = 'round';
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
              const yy = y + i * 0.3, len = d.size * (0.6 + 0.2 * i);
              ctx.moveTo(x - len / 2, yy);
              ctx.bezierCurveTo(x - len / 6, yy - 0.18, x + len / 6, yy + 0.18, x + len / 2, yy);
            }
            ctx.stroke();
            break;
        }
        if (st === 5 && d.type === 'pebble' && z >= 18) {
          // little alien plants on Viridia
          ctx.fillStyle = d.v > 0.5 ? '#8aff9a' : '#c07aff';
          for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(x + (i - 1) * 0.12, y - 0.15, 0.06, 0.22, (i - 1) * 0.5, 0, Math.PI * 2); ctx.fill(); }
        }
      }
    }
  },

  // ---------------- deposits ----------------
  drawDeposits(ctx, g, vr) {
    const deps = World.depositsInRect(g.world, vr.x0, vr.y0, vr.x1, vr.y1);
    const tm = App.now / 1000;
    const fx = !App.settings.reducedFx;
    for (const d of deps) {
      const R = DATA.RESOURCES[d.res], T = DATA.TIERS[d.tier];
      const glowCol = d.tier === 7 ? Col.prism(tm, 0) : T.color;
      const pulse = d.tier === 6 ? 0.75 + 0.25 * Math.sin(tm * 3) : 1;
      // ground patch
      for (const t of d.tiles) {
        const x = t[0] - Render.ox, y = t[1] - Render.oy;
        ctx.fillStyle = 'rgba(0,0,0,.22)';
        Render.roundRect(ctx, x + 0.04, y + 0.04, 0.92, 0.92, 0.25); ctx.fill();
        ctx.fillStyle = Col.rgba(Col.shade(R.color, -0.45), 0.55);
        Render.roundRect(ctx, x + 0.08, y + 0.08, 0.84, 0.84, 0.22); ctx.fill();
      }
      if (d.tier > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = (0.12 + T.glow * 0.45) * pulse;
        const spr = Sprites.glow(glowCol);
        for (const t of d.tiles) ctx.drawImage(spr, t[0] - Render.ox - 0.6, t[1] - Render.oy - 0.6, 2.2, 2.2);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
      // crystals / ore lumps
      for (let i = 0; i < d.tiles.length; i++) {
        const t = d.tiles[i];
        const hsh = RNG.hash(t[0], t[1], d.res);
        const x = t[0] - Render.ox, y = t[1] - Render.oy;
        const n = 2 + (hsh % 2);
        for (let k = 0; k < n; k++) {
          const px = x + 0.25 + ((hsh >> (k * 4)) & 15) / 15 * 0.5;
          const py = y + 0.3 + ((hsh >> (k * 4 + 2)) & 15) / 15 * 0.45;
          const s = 0.16 + ((hsh >> (k * 3 + 8)) & 7) / 7 * 0.12;
          ctx.save(); ctx.translate(px, py);
          const fill = d.tier === 7 ? Col.prism(tm, k * 60 + i * 30) : R.color;
          if (d.tier >= 2) {
            // crystal shard
            ctx.rotate(((hsh >> (k + 5)) & 7) / 7 * 0.6 - 0.3);
            ctx.beginPath(); ctx.moveTo(0, -s * 1.6); ctx.lineTo(s * 0.6, 0); ctx.lineTo(0, s * 0.6); ctx.lineTo(-s * 0.6, 0); ctx.closePath();
            ctx.fillStyle = Col.shade(fill, 0.15); ctx.fill();
            ctx.beginPath(); ctx.moveTo(0, -s * 1.6); ctx.lineTo(s * 0.6, 0); ctx.lineTo(0, s * 0.6); ctx.closePath();
            ctx.fillStyle = Col.shade(fill, -0.2); ctx.fill();
          } else {
            ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.75, 0, 0, Math.PI * 2);
            ctx.fillStyle = fill; ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.25, s * 0.3, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
      }
      if (fx && d.tier >= 3 && Math.random() < 0.02 * d.tier * (App.quality === 'low' ? 0.3 : 1)) {
        const t = d.tiles[Math.floor(Math.random() * d.tiles.length)];
        Render.spawn('spark', t[0] + Math.random(), t[1] + Math.random(), (Math.random() - 0.5) * 0.3, -0.4 - Math.random() * 0.4, 1.2, glowCol, 0.08);
      }
      // known marker when zoomed out
      if (g.world.known.has(d.id) && App.cam.zoom < 22) {
        const x = d.x + 0.5 - Render.ox, y = d.y - 0.6 - Render.oy;
        const s = 10 / App.cam.zoom;
        ctx.fillStyle = T.color; ctx.strokeStyle = '#000'; ctx.lineWidth = s * 0.2;
        ctx.beginPath(); ctx.moveTo(x, y + s * 1.4); ctx.lineTo(x - s, y); ctx.arc(x, y, s, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }
  },

  roundRect(ctx, x, y, w, hh, r) {
    r = Math.min(r, w / 2, hh / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + hh - r); ctx.quadraticCurveTo(x + w, y + hh, x + w - r, y + hh);
    ctx.lineTo(x + r, y + hh); ctx.quadraticCurveTo(x, y + hh, x, y + hh - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  },

  // ---------------- particles ----------------
  maxParticles() { return App.settings.reducedFx ? 60 : App.quality === 'low' ? 150 : App.quality === 'medium' ? 400 : 900; },
  spawn(type, x, y, vx, vy, life, color, size) {
    if (Render.particles.length >= Render.maxParticles()) return;
    const p = Render.pool.pop() || {};
    p.type = type; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.color = color; p.size = size;
    Render.particles.push(p);
  },
  updateParticles(dt) {
    const arr = Render.particles;
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      p.life -= dt;
      if (p.life <= 0) { arr[i] = arr[arr.length - 1]; arr.pop(); Render.pool.push(p); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'coin') p.vy += 3 * dt;
      if (p.type === 'smoke' || p.type === 'dust') { p.vx *= 0.98; p.vy *= 0.98; p.size += dt * 0.2; }
    }
  },
  drawParticles(ctx) {
    for (const p of Render.particles) {
      const a = U.clamp(p.life / p.max, 0, 1);
      const x = p.x - Render.ox, y = p.y - Render.oy;
      if (p.type === 'spark' || p.type === 'jet') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      } else if (p.type === 'coin') {
        ctx.globalAlpha = a;
        ctx.fillStyle = '#ffd24a'; ctx.strokeStyle = '#a06a00'; ctx.lineWidth = 0.03;
        ctx.beginPath(); ctx.ellipse(x, y, p.size, p.size * (0.6 + 0.4 * Math.abs(Math.sin(p.life * 10))), 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else {
        ctx.globalAlpha = a * 0.5;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  },

  // Floating texts (+12 ET) in world space.
  float(text, x, y, color = '#7dff8a') {
    if (Render.floating.length > 40) Render.floating.shift();
    Render.floating.push({ text, x, y, t: 0, color });
  },
  drawFloating(ctx, dt) {
    const z = App.cam.zoom;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = Render.floating.length - 1; i >= 0; i--) {
      const f = Render.floating[i];
      f.t += dt;
      if (f.t > 1.6) { Render.floating.splice(i, 1); continue; }
      const a = 1 - Math.max(0, f.t - 1) / 0.6;
      const fs = Math.max(13, 15) / z;
      ctx.font = '700 ' + fs + 'px system-ui, sans-serif';
      ctx.globalAlpha = a;
      ctx.lineWidth = fs * 0.22; ctx.strokeStyle = 'rgba(0,0,0,.75)';
      const x = f.x - Render.ox, y = f.y - Render.oy - f.t * 0.8;
      ctx.strokeText(f.text, x, y); ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
    }
    ctx.globalAlpha = 1;
  },

  // ---------------- atmosphere ----------------
  dayNight(g) {
    if (!App.settings.dayNight) return 0;
    const cycle = 600;
    const ph = ((g.run.time % cycle) / cycle) * Math.PI * 2;
    return U.clamp(-Math.cos(ph) * 0.9 - 0.1, 0, 1) * (Render.planetStyle === 8 ? 0.6 : 1);
  },
  devils: [],
  updateDevils(g, dt) {
    if (App.settings.reducedFx || !App.settings.weather || App.quality === 'low') { Render.devils.length = 0; return; }
    if (Render.devils.length < 2 && Math.random() < dt * 0.04) {
      const p = g.run.player, a = Math.random() * Math.PI * 2, d = 8 + Math.random() * 10;
      Render.devils.push({ x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, life: 8 + Math.random() * 6 });
    }
    for (let i = Render.devils.length - 1; i >= 0; i--) {
      const dv = Render.devils[i];
      dv.life -= dt; dv.x += dv.vx * dt; dv.y += dv.vy * dt;
      if (dv.life <= 0) { Render.devils.splice(i, 1); continue; }
      const k = Math.min(1, dv.life / 2, 1);
      for (let j = 0; j < 2; j++) {
        const ang = App.now / 120 + j * Math.PI + Math.random() * 0.5, r = 0.3 + Math.random() * 0.6;
        Render.spawn('dust', dv.x + Math.cos(ang) * r, dv.y + Math.sin(ang) * r * 0.5 - Math.random() * 0.8, -Math.sin(ang) * 1.5 * k, Math.cos(ang) * 0.7 * k - 0.4, 0.9, Render.palette.particle, 0.07);
      }
    }
  },
  drawAtmosphere(ctx, g, dt) {
    const d = App.view.dpr, W = App.view.w * d, H = App.view.h * d;
    const night = Render.dayNight(g);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (night > 0.01) {
      ctx.fillStyle = 'rgba(8,10,40,' + (night * 0.45).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // dust storm
    if (App.settings.weather && !App.settings.reducedFx) {
      Render.stormT += dt;
      if (Render.storm <= 0 && Render.stormT > Render.nextStorm) { Render.storm = 60; Render.stormT = 0; Render.nextStorm = 360 + Math.random() * 480; }
      if (Render.storm > 0) {
        Render.storm -= dt;
        const k = Math.min(1, Math.min(Render.storm, 60 - Render.storm) / 8);
        ctx.fillStyle = Col.rgba(Render.palette.particle, 0.12 * k);
        ctx.fillRect(0, 0, W, H);
        const n = Math.floor(70 * k * (App.quality === 'low' ? 0.4 : 1));
        ctx.strokeStyle = Col.rgba(Render.palette.particle, 0.35 * k);
        ctx.lineWidth = 1.5 * d;
        const tm = App.now / 1000;
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const sx = ((i * 137.5 + tm * (380 + (i % 7) * 40)) % (W + 200)) - 100;
          const sy = ((i * 89.3 + tm * 60 + i * i) % H);
          ctx.moveTo(sx, sy); ctx.lineTo(sx - 40 * d, sy - 6 * d);
        }
        ctx.stroke();
      }
    }
    return night;
  }
};

// ===== src/app/04_draw.js =====
// =====================================================================
// Draw: buildings, belts, items, customers, astronaut (tile units, relative coords)
// =====================================================================
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
const GRADE_COLORS = ['#8b939c', '#f2c84b', '#4aa8ff', '#ff4fd8'];

const Draw = {
  tm: 0,
  shadow(ctx, x, y, w, hh, r = 0.25) {
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    Render.roundRect(ctx, x + 0.1, y + 0.16, w, hh, r); ctx.fill();
  },
  body(ctx, x, y, w, hh, fill, r = 0.25, stroke = true) {
    Render.roundRect(ctx, x, y, w, hh, r);
    ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.lineWidth = 0.06; ctx.strokeStyle = Col.shade(fill, -0.5); ctx.stroke(); }
  },
  arrow(ctx, cx, cy, dir, s, color) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(dir * Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.6, -s * 0.75); ctx.lineTo(-s * 0.25, 0); ctx.lineTo(-s * 0.6, s * 0.75); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  },
  levelTag(ctx, b, x, y) {
    if (b.level <= 1 || App.cam.zoom < 20) return;
    const fs = Math.max(0.26, 12 / App.cam.zoom);
    const s = fs * 1.3;
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    Render.roundRect(ctx, x + 0.08, y + b.h - s - 0.08, fs * 1.1 + ROMAN[b.level].length * fs * 0.65, s, 0.1); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 ' + fs + 'px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(ROMAN[b.level], x + 0.08 + fs * 0.55, y + b.h - s / 2 - 0.08);
  },
  frontArrow(ctx, b, x, y) {
    const p = Grid.frontPort(b);
    const ax = p[0] - U.DX[b.rot] * 0.62 - Render.ox + 0.5 - (b.x - Render.ox - x);
    const ay = p[1] - U.DY[b.rot] * 0.62 - Render.oy + 0.5 - (b.y - Render.oy - y);
    Draw.arrow(ctx, ax, ay, b.rot, 0.2, 'rgba(255,255,255,.85)');
  },

  // ---------------- belts ----------------
  beltShape(g, b) {
    if (b._sv === g.topoVersion) return b.shape;
    b._sv = g.topoVersion;
    const feeds = d => {
      const o = Grid.at(g, b.x - U.DX[d], b.y - U.DY[d]);
      if (!o) return false;
      if (o.type === 'belt' || o.type === 'merger') return o.x + U.DX[o.rot] === b.x && o.y + U.DY[o.rot] === b.y;
      if (o.type === 'splitter' || o.type === 'fsplitter' || o.type === 'osplitter') return true;
      return false;
    };
    const back = feeds(b.rot), left = feeds((b.rot + 1) & 3), right = feeds((b.rot + 3) & 3);
    // "left" input arrives moving in direction rot+1 (coming from the left-hand tile)
    b.shape = back || (left && right) || (!left && !right) ? 0 : left ? 1 : 2;
    return b.shape;
  },
  belt(ctx, g, b, x, y) {
    const shape = Draw.beltShape(g, b);
    const col = GRADE_COLORS[b.grade];
    const z = App.cam.zoom;
    ctx.save();
    ctx.translate(x + 0.5, y + 0.5);
    ctx.rotate(b.rot * Math.PI / 2);
    const speed = CONFIG.belt.speed[b.grade] * (b.boost || 1);
    const off = App.settings.reducedFx ? 0 : (Draw.tm * speed) % 0.5;
    if (shape === 0) {
      ctx.fillStyle = '#2b2f36'; ctx.fillRect(-0.5, -0.4, 1, 0.8);
      ctx.fillStyle = col; ctx.fillRect(-0.5, -0.42, 1, 0.09); ctx.fillRect(-0.5, 0.33, 1, 0.09);
      if (z >= 14) {
        ctx.strokeStyle = b.grade === 3 ? 'rgba(255,120,230,.75)' : 'rgba(255,255,255,.22)'; ctx.lineWidth = 0.07;
        ctx.beginPath();
        for (let i = -1; i < 2; i++) { const cx = -0.5 + off + i * 0.5; if (cx < -0.55 || cx > 0.45) continue; ctx.moveTo(cx - 0.08, -0.2); ctx.lineTo(cx + 0.08, 0); ctx.lineTo(cx - 0.08, 0.2); }
        ctx.stroke();
      }
    } else {
      // curve: input from side, output to the front (+x). side=-y for shape 2 (right-hand feed) mirrored for shape 1
      const sgn = shape === 1 ? 1 : -1;
      ctx.scale(1, sgn);
      // arc centred at (0.5, -0.5) going from top edge to right edge
      ctx.beginPath(); ctx.arc(0.5, -0.5, 0.92, Math.PI / 2, Math.PI); ctx.arc(0.5, -0.5, 0.08, Math.PI, Math.PI / 2, true); ctx.closePath();
      ctx.fillStyle = '#2b2f36'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 0.09;
      ctx.beginPath(); ctx.arc(0.5, -0.5, 0.875, Math.PI / 2, Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(0.5, -0.5, 0.125, Math.PI / 2, Math.PI); ctx.stroke();
      if (z >= 14) {
        ctx.strokeStyle = b.grade === 3 ? 'rgba(255,120,230,.75)' : 'rgba(255,255,255,.22)'; ctx.lineWidth = 0.07;
        for (let i = 0; i < 2; i++) {
          const a = Math.PI - ((off / 0.5 + i) / 2) * (Math.PI / 2);
          const ca = Math.cos(a), sa = Math.sin(a);
          ctx.beginPath();
          ctx.moveTo(0.5 + ca * 0.3, -0.5 + sa * 0.3); ctx.lineTo(0.5 + ca * 0.5 + sa * 0.08, -0.5 + sa * 0.5 - ca * 0.08); ctx.lineTo(0.5 + ca * 0.7, -0.5 + sa * 0.7);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
    if (b.boost > 1 && z >= 14) { ctx.fillStyle = 'rgba(155,240,106,.18)'; ctx.fillRect(x, y, 1, 1); }
  },
  // Draws many belts with a handful of canvas calls (batched by colour).
  beltsBatch(ctx, g, list) {
    if (!list.length) return;
    const z = App.cam.zoom;
    const ox = Render.ox, oy = Render.oy;
    if (z < 13) {
      ctx.fillStyle = '#2b2f36'; ctx.beginPath();
      for (const b of list) ctx.rect(b.x - ox, b.y - oy + 0.12, 1, 0.76);
      ctx.fill();
      for (let gr = 0; gr < 4; gr++) {
        ctx.fillStyle = GRADE_COLORS[gr]; ctx.beginPath();
        for (const b of list) if (b.grade === gr) { if (b.rot & 1) ctx.rect(b.x - ox + 0.42, b.y - oy, 0.16, 1); else ctx.rect(b.x - ox, b.y - oy + 0.42, 1, 0.16); }
        ctx.fill();
      }
      return;
    }
    // base
    ctx.fillStyle = '#2b2f36'; ctx.beginPath();
    for (const b of list) {
      const x = b.x - ox, y = b.y - oy;
      const shape = Draw.beltShape(g, b);
      if (shape === 0) { if (b.rot & 1) ctx.rect(x + 0.1, y, 0.8, 1); else ctx.rect(x, y + 0.1, 1, 0.8); continue; }
      const c = Draw.curveGeom(b, shape, x, y);
      ctx.moveTo(c.cx + Math.cos(c.a0) * 0.92, c.cy + Math.sin(c.a0) * 0.92);
      ctx.arc(c.cx, c.cy, 0.92, c.a0, c.a1, c.ccw);
      ctx.arc(c.cx, c.cy, 0.08, c.a1, c.a0, !c.ccw);
      ctx.closePath();
    }
    ctx.fill();
    // rails and chevrons per grade
    const off = App.settings.reducedFx ? 0 : (Draw.tm % 1000);
    for (let gr = 0; gr < 4; gr++) {
      ctx.fillStyle = GRADE_COLORS[gr]; ctx.strokeStyle = GRADE_COLORS[gr]; ctx.lineWidth = 0.09;
      ctx.beginPath();
      let curves = false;
      for (const b of list) {
        if (b.grade !== gr) continue;
        const x = b.x - ox, y = b.y - oy;
        if (b.shape === 0) { if (b.rot & 1) { ctx.rect(x + 0.08, y, 0.09, 1); ctx.rect(x + 0.83, y, 0.09, 1); } else { ctx.rect(x, y + 0.08, 1, 0.09); ctx.rect(x, y + 0.83, 1, 0.09); } }
        else curves = true;
      }
      ctx.fill();
      if (curves) {
        ctx.beginPath();
        for (const b of list) {
          if (b.grade !== gr || b.shape === 0) continue;
          const c = Draw.curveGeom(b, b.shape, b.x - ox, b.y - oy);
          ctx.moveTo(c.cx + Math.cos(c.a0) * 0.875, c.cy + Math.sin(c.a0) * 0.875); ctx.arc(c.cx, c.cy, 0.875, c.a0, c.a1, c.ccw);
          ctx.moveTo(c.cx + Math.cos(c.a0) * 0.125, c.cy + Math.sin(c.a0) * 0.125); ctx.arc(c.cx, c.cy, 0.125, c.a0, c.a1, c.ccw);
        }
        ctx.stroke();
      }
      if (z < 14) continue;
      ctx.strokeStyle = gr === 3 ? 'rgba(255,120,230,.75)' : 'rgba(255,255,255,.22)'; ctx.lineWidth = 0.07;
      ctx.beginPath();
      for (const b of list) {
        if (b.grade !== gr || b.shape !== 0) continue;
        const sp = (off * CONFIG.belt.speed[gr] * (b.boost || 1)) % 0.5;
        const dx = U.DX[b.rot], dy = U.DY[b.rot], px = -dy, py = dx;
        const cx0 = b.x - ox + 0.5, cy0 = b.y - oy + 0.5;
        for (let i = -1; i < 2; i++) {
          const t = -0.5 + sp + i * 0.5;
          if (t < -0.55 || t > 0.45) continue;
          const mx = cx0 + dx * t, my = cy0 + dy * t;
          ctx.moveTo(mx - dx * 0.08 + px * 0.2, my - dy * 0.08 + py * 0.2);
          ctx.lineTo(mx + dx * 0.08, my + dy * 0.08);
          ctx.lineTo(mx - dx * 0.08 - px * 0.2, my - dy * 0.08 - py * 0.2);
        }
      }
      ctx.stroke();
    }
    // charger boost tint
    ctx.fillStyle = 'rgba(155,240,106,.18)'; ctx.beginPath();
    let any = false;
    for (const b of list) if (b.boost > 1) { ctx.rect(b.x - ox, b.y - oy, 1, 1); any = true; }
    if (any) ctx.fill();
  },
  // Quarter-ring geometry for a curved belt in world-relative coordinates.
  curveGeom(b, shape, x, y) {
    // local frame: belt moves along +x; feed from -y (shape 1) or +y (shape 2); arc centred at (0.5, -0.5*sgn)
    const sgn = shape === 1 ? 1 : -1;
    const lx = 0.5, ly = -0.5 * sgn;
    const r = b.rot;
    const rotP = (px, py) => { for (let i = 0; i < r; i++) { const t = px; px = -py; py = t; } return [px, py]; };
    const [cxl, cyl] = rotP(lx, ly);
    const base = r * Math.PI / 2;
    // in local frame the arc spans angles PI/2 .. PI (shape 1) or -PI/2 .. -PI (shape 2)
    const a0 = (shape === 1 ? Math.PI : -Math.PI) + base, a1 = (shape === 1 ? Math.PI / 2 : -Math.PI / 2) + base;
    return { cx: x + 0.5 + cxl, cy: y + 0.5 + cyl, a0, a1, ccw: shape === 1 };
  },
  itemPos(b, it, alpha) {
    const p = it.pp + (it.p - it.pp) * alpha;
    const cx = b.x + 0.5, cy = b.y + 0.5;
    if (p < 0.5) {
      const ex = cx - U.DX[it.from] * 0.5, ey = cy - U.DY[it.from] * 0.5;
      const k = p * 2;
      return [ex + (cx - ex) * k, ey + (cy - ey) * k];
    }
    const k = (p - 0.5) * 2;
    return [cx + U.DX[b.rot] * 0.5 * k, cy + U.DY[b.rot] * 0.5 * k];
  },
  item(ctx, res, ref, x, y, s) {
    const tier = DATA.RESOURCES[res].tier;
    if (tier >= 6) {
      ctx.save(); ctx.translate(x, y);
      const pulse = tier === 6 ? 0.7 + 0.3 * Math.sin(Draw.tm * 4) : 1;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6 * pulse;
      ctx.drawImage(Sprites.glow(tier === 7 ? Col.prism(Draw.tm, res * 50) : DATA.TIERS[tier].color), -s * 1.4, -s * 1.4, s * 2.8, s * 2.8);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      Sprites.drawItem(ctx, res, ref, s * 0.58, Draw.tm);
      ctx.restore();
      return;
    }
    ctx.drawImage(Sprites.item(res, ref), x - s, y - s, s * 2, s * 2);
  },

  // ---------------- generic building ----------------
  building(ctx, g, b, x, y) {
    const def = DATA.BUILDINGS[b.type];
    const tm = Draw.tm;
    const w = b.w, hh = b.h;
    if (App.cam.zoom < 13 && !b._thumb && b.id >= 0) {
      // level of detail: flat blocks when zoomed far out
      if (b.type === 'belt') { ctx.fillStyle = '#2b2f36'; ctx.fillRect(x, y + 0.12, 1, 0.76); ctx.fillStyle = GRADE_COLORS[b.grade]; ctx.fillRect(x, y + 0.42, 1, 0.16); return; }
      if (b.type === 'bridge') return;
      ctx.fillStyle = b.type === 'extractor' ? '#ff8a2f' : def.color;
      ctx.fillRect(x + 0.08, y + 0.08, w - 0.16, hh - 0.16);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x + 0.08, y + hh - 0.3, w - 0.16, 0.22);
      return;
    }
    switch (b.type) {
      case 'belt': Draw.belt(ctx, g, b, x, y); return;
      case 'extractor': return Draw.extractor(ctx, g, b, x, y);
      case 'splitter': case 'fsplitter': case 'osplitter': case 'merger': case 'crossing': return Draw.node(ctx, g, b, x, y);
      case 'bridge': return; // drawn in the overlay layer
      case 'silo': return Draw.silo(ctx, g, b, x, y);
      case 'lab': return Draw.lab(ctx, g, b, x, y);
      case 'cooler': {
        Draw.shadow(ctx, x + 0.1, y + 0.1, w - 0.2, hh - 0.2, 0.9);
        ctx.fillStyle = '#3c5a68'; ctx.beginPath(); ctx.arc(x + 1, y + 1, 0.92, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = def.color; ctx.beginPath(); ctx.arc(x + 1, y + 1, 0.78, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#20343c'; ctx.beginPath(); ctx.arc(x + 1, y + 1, 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 0.05;
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + 1, y + 1, 0.55 + i * 0.1, 0, Math.PI * 2); ctx.stroke(); }
        if (!App.settings.reducedFx && Math.random() < 0.08) Render.spawn('smoke', b.x + 1 + (Math.random() - 0.5) * 0.6, b.y + 1, (Math.random() - 0.5) * 0.2, -0.5, 2, '#e8f6ff', 0.18);
        break;
      }
      case 'servo': {
        Draw.shadow(ctx, x + 0.08, y + 0.08, w - 0.16, hh - 0.16);
        Draw.body(ctx, x + 0.08, y + 0.08, w - 0.16, hh - 0.16, '#5a5040');
        ctx.save(); ctx.translate(x + 1, y + 1); ctx.rotate(App.settings.reducedFx ? 0 : tm * 1.5);
        ctx.fillStyle = def.color;
        ctx.beginPath();
        for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8; const r = i % 2 ? 0.55 : 0.72; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#5a5040'; ctx.beginPath(); ctx.arc(0, 0, 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        break;
      }
      case 'charger': {
        Draw.shadow(ctx, x + 0.08, y + 0.08, w - 0.16, hh - 0.16);
        Draw.body(ctx, x + 0.08, y + 0.08, w - 0.16, hh - 0.16, '#2f4a2a');
        const pul = 0.6 + 0.4 * Math.sin(tm * 3);
        ctx.fillStyle = Col.rgba(def.color, 0.5 + pul * 0.5);
        ctx.beginPath(); ctx.moveTo(x + 1.15, y + 0.35); ctx.lineTo(x + 0.7, y + 1.1); ctx.lineTo(x + 1.0, y + 1.1); ctx.lineTo(x + 0.85, y + 1.65); ctx.lineTo(x + 1.3, y + 0.9); ctx.lineTo(x + 1.0, y + 0.9); ctx.closePath(); ctx.fill();
        break;
      }
      case 'path': return Draw.path(ctx, g, b, x, y);
      case 'fence': return Draw.fence(ctx, g, b, x, y);
      case 'lamp': {
        ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x + 0.55, y + 0.8, 0.25, 0.1, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#555c66'; ctx.fillRect(x + 0.46, y + 0.2, 0.08, 0.62);
        ctx.fillStyle = b.level >= 2 ? '#bfe8ff' : def.color; ctx.beginPath(); ctx.arc(x + 0.5, y + 0.2, 0.14 + b.level * 0.02, 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'flag': {
        ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x + 0.5, y + 0.85, 0.2, 0.08, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ddd'; ctx.fillRect(x + 0.3, y + 0.05, 0.06, 0.8);
        const wave = Math.sin(tm * 4 + b.x) * 0.05;
        ctx.fillStyle = b.level >= 2 ? Render.palette.accent : def.color;
        ctx.beginPath(); ctx.moveTo(x + 0.36, y + 0.08); ctx.quadraticCurveTo(x + 0.6, y + 0.05 + wave, x + 0.85, y + 0.12 + wave); ctx.lineTo(x + 0.85, y + 0.42 + wave); ctx.quadraticCurveTo(x + 0.6, y + 0.36 - wave, x + 0.36, y + 0.4); ctx.closePath(); ctx.fill();
        break;
      }
      case 'plant': {
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + 0.55, y + 0.6, 0.42, 0.3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(170,230,255,.25)'; ctx.strokeStyle = 'rgba(200,240,255,.7)'; ctx.lineWidth = 0.04;
        ctx.beginPath(); ctx.arc(x + 0.5, y + 0.5, 0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = def.color;
        for (let i = 0; i < 2 + b.level; i++) { const a = i * 2.1; ctx.beginPath(); ctx.ellipse(x + 0.5 + Math.cos(a) * 0.15, y + 0.52 + Math.sin(a) * 0.12, 0.08, 0.18, a, 0, Math.PI * 2); ctx.fill(); }
        break;
      }
      case 'beacon': {
        ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x + 0.5, y + 0.85, 0.3, 0.1, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4a5564'; ctx.beginPath(); ctx.moveTo(x + 0.3, y + 0.85); ctx.lineTo(x + 0.45, y + 0.25); ctx.lineTo(x + 0.55, y + 0.25); ctx.lineTo(x + 0.7, y + 0.85); ctx.closePath(); ctx.fill();
        const p = 0.5 + 0.5 * Math.sin(tm * 3 + b.x);
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.4 + p * 0.6;
        ctx.drawImage(Sprites.glow(def.color), x - 0.1, y - 0.4, 1.2, 1.2);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        break;
      }
      default:
        if (REFINERY_LEVEL[b.type]) return Draw.refinery(ctx, g, b, x, y);
        if (SELLER_TIER[b.type] !== undefined) return Draw.seller(ctx, g, b, x, y);
        Draw.body(ctx, x, y, w, hh, def.color);
    }
  },

  extractor(ctx, g, b, x, y) {
    const R = b.res !== undefined ? DATA.RESOURCES[b.res] : DATA.RESOURCES[0];
    const working = b.buf ? b.buf.length < CONFIG.maxItemsPerBuffer : true;
    Draw.shadow(ctx, x + 0.06, y + 0.06, 1.88, 1.88, 0.3);
    Draw.body(ctx, x + 0.06, y + 0.06, 1.88, 1.88, '#3a3d44', 0.3);
    Draw.body(ctx, x + 0.22, y + 0.22, 1.56, 1.56, b.level >= 7 ? '#ffa24a' : '#ff8a2f', 0.26);
    // hazard stripes on higher levels
    if (b.level >= 4) {
      ctx.save(); Render.roundRect(ctx, x + 0.22, y + 1.5, 1.56, 0.28, 0.1); ctx.clip();
      ctx.fillStyle = '#222';
      for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(x + 0.1 + i * 0.25, y + 1.78); ctx.lineTo(x + 0.25 + i * 0.25, y + 1.5); ctx.lineTo(x + 0.35 + i * 0.25, y + 1.5); ctx.lineTo(x + 0.2 + i * 0.25, y + 1.78); ctx.fill(); }
      ctx.restore();
    }
    // drill head
    ctx.save(); ctx.translate(x + 1, y + 0.95);
    ctx.fillStyle = '#2a2c31'; ctx.beginPath(); ctx.arc(0, 0, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(working && !App.settings.reducedFx ? Draw.tm * (3 + b.level * 0.4) : 0);
    ctx.fillStyle = '#c9ced6';
    for (let i = 0; i < 3; i++) { ctx.rotate(Math.PI * 2 / 3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0.42, -0.12); ctx.lineTo(0.42, 0.12); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = R.color; ctx.beginPath(); ctx.arc(0, 0, 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // resource lamp
    const tier = R.tier;
    if (tier > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5; ctx.drawImage(Sprites.glow(DATA.TIERS[tier].color), x + 1.25, y + 0.05, 0.7, 0.7); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    ctx.fillStyle = DATA.TIERS[tier].color; ctx.beginPath(); ctx.arc(x + 1.6, y + 0.4, 0.11, 0, Math.PI * 2); ctx.fill();
    // output indicators
    if (b.outs && App.cam.zoom >= 18) for (const o of b.outs) Draw.arrow(ctx, o[0] - U.DX[o[2]] * 0.62 + 0.5 - Render.ox, o[1] - U.DY[o[2]] * 0.62 + 0.5 - Render.oy, o[2], 0.13, 'rgba(255,255,255,.75)');
    Draw.levelTag(ctx, b, x, y);
    if (working && b.made && !App.settings.reducedFx && Math.random() < 0.12 && App.quality !== 'low') {
      Render.spawn('dust', b.x + 1 + (Math.random() - 0.5) * 0.8, b.y + 1.2, (Math.random() - 0.5) * 0.6, -0.2 - Math.random() * 0.3, 0.9, Render.palette.particle, 0.08);
    }
  },

  node(ctx, g, b, x, y) {
    ctx.fillStyle = '#2b2f36'; ctx.fillRect(x + 0.05, y + 0.05, 0.9, 0.9);
    const def = DATA.BUILDINGS[b.type];
    Draw.body(ctx, x + 0.12, y + 0.12, 0.76, 0.76, def.color, 0.16);
    const c = x + 0.5, cy = y + 0.5;
    const white = 'rgba(255,255,255,.9)';
    if (b.type === 'crossing') {
      ctx.fillStyle = white; ctx.fillRect(c - 0.06, y + 0.18, 0.12, 0.64); ctx.fillRect(x + 0.18, cy - 0.06, 0.64, 0.12);
      return;
    }
    const f = b.rot, l = (b.rot + 3) & 3, r = (b.rot + 1) & 3;
    if (b.type === 'merger') {
      Draw.arrow(ctx, c + U.DX[f] * 0.22, cy + U.DY[f] * 0.22, f, 0.16, white);
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(c, cy, 0.1, 0, Math.PI * 2); ctx.fill();
      return;
    }
    Draw.arrow(ctx, c + U.DX[f] * 0.22, cy + U.DY[f] * 0.22, f, 0.14, white);
    const sideCol = b.type === 'osplitter' ? 'rgba(255,255,255,.45)' : white;
    Draw.arrow(ctx, c + U.DX[l] * 0.22, cy + U.DY[l] * 0.22, l, 0.12, sideCol);
    Draw.arrow(ctx, c + U.DX[r] * 0.22, cy + U.DY[r] * 0.22, r, 0.12, sideCol);
    if (b.type === 'fsplitter' && b.filter) {
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.arc(c, cy, 0.16, 0, Math.PI * 2); ctx.fill();
      if (b.filter.kind === 'res') Draw.item(ctx, b.filter.res, 0, c, cy, 0.14);
      else { ctx.fillStyle = b.filter.kind === 'tier' ? DATA.TIERS[b.filter.tier].color : '#ffcf4a'; ctx.beginPath(); ctx.arc(c, cy, 0.1, 0, Math.PI * 2); ctx.fill(); }
    }
  },

  bridge(ctx, g, b, alpha) {
    const ex = b.x + U.DX[b.rot] * (b.len - 1), ey = b.y + U.DY[b.rot] * (b.len - 1);
    const ax = b.x + 0.5 - Render.ox, ay = b.y + 0.5 - Render.oy, bx = ex + 0.5 - Render.ox, by = ey + 0.5 - Render.oy;
    const def = DATA.BUILDINGS.bridge;
    for (const [px, py] of [[ax, ay], [bx, by]]) {
      Draw.shadow(ctx, px - 0.45, py - 0.45, 0.9, 0.9, 0.2);
      Draw.body(ctx, px - 0.45, py - 0.45, 0.9, 0.9, def.color, 0.2);
    }
    // arch
    const mx = (ax + bx) / 2 - (U.DY[b.rot] !== 0 ? 0.25 : 0), my = (ay + by) / 2 - 0.35;
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.55; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax + 0.1, ay + 0.2); ctx.quadraticCurveTo(mx + 0.1, my + 0.4, bx + 0.1, by + 0.2); ctx.stroke();
    ctx.strokeStyle = '#5a6488'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
    ctx.strokeStyle = def.color; ctx.lineWidth = 0.12;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
    Draw.arrow(ctx, bx, by, b.rot, 0.18, '#fff');
    // items riding over the bridge
    for (const q of b.queue) {
      const t = ((q.pt !== undefined ? q.pt + (q.t - q.pt) * alpha : q.t)) / Math.max(1, b.len - 1);
      const u = 1 - t;
      const px = u * u * ax + 2 * u * t * mx + t * t * bx, py = u * u * ay + 2 * u * t * my + t * t * by;
      Draw.item(ctx, q.it.res, q.it.ref, px, py, 0.2);
    }
  },

  silo(ctx, g, b, x, y) {
    const cx = x + b.w / 2, cy = y + b.h / 2;
    Draw.shadow(ctx, x + 0.1, y + 0.1, b.w - 0.2, b.h - 0.2, 0.5);
    Draw.body(ctx, x + 0.1, y + 0.1, b.w - 0.2, b.h - 0.2, '#3c4a5a', 0.4);
    ctx.fillStyle = '#6d8aa8'; ctx.beginPath(); ctx.arc(cx, cy, 1.25, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 0.06; ctx.strokeStyle = '#2a3644'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.arc(cx, cy, 0.95, 0, Math.PI * 2); ctx.stroke();
    // fill gauge
    const cap = Economy.siloCap(g, b);
    const f = U.clamp(b.total / Math.max(1, cap), 0, 1);
    ctx.lineWidth = 0.16; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(cx, cy, 1.1, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
    ctx.strokeStyle = f >= 1 ? '#ff6464' : f > 0.9 ? '#ffc24d' : '#63df74';
    if (f > 0) { ctx.beginPath(); ctx.arc(cx, cy, 1.1, Math.PI * 0.75, Math.PI * 0.75 + Math.PI * 1.5 * f); ctx.stroke(); }
    // top content preview
    let best = -1, bc = 0;
    for (const [k, c] of b.store) if (c > bc) { bc = c; best = k; }
    ctx.fillStyle = '#2a3644'; ctx.beginPath(); ctx.arc(cx, cy, 0.55, 0, Math.PI * 2); ctx.fill();
    if (best >= 0) Draw.item(ctx, best >> 2, best & 3, cx, cy, 0.34);
    if (b.outEnabled) Draw.frontArrow(ctx, b, x, y);
    Draw.levelTag(ctx, b, x, y);
  },

  refinery(ctx, g, b, x, y) {
    const lvl = REFINERY_LEVEL[b.type];
    const def = DATA.BUILDINGS[b.type];
    Draw.shadow(ctx, x + 0.08, y + 0.08, b.w - 0.16, b.h - 0.16);
    Draw.body(ctx, x + 0.08, y + 0.08, b.w - 0.16, b.h - 0.16, '#24363a');
    Draw.body(ctx, x + 0.3, y + 0.3, b.w - 0.6, b.h - 0.6, def.color, 0.3);
    // tanks per level
    for (let i = 0; i < lvl; i++) {
      ctx.fillStyle = '#d8f4f0'; ctx.beginPath(); ctx.arc(x + 0.75 + i * 0.75, y + 0.75, 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = Col.shade(def.color, -0.4); ctx.lineWidth = 0.05; ctx.stroke();
    }
    // processing window
    const working = !!b.cur;
    const wx = x + b.w / 2, wy = y + b.h / 2 + 0.35;
    ctx.fillStyle = '#0d1a1c'; Render.roundRect(ctx, wx - 0.75, wy - 0.38, 1.5, 0.76, 0.15); ctx.fill();
    if (working) {
      ctx.fillStyle = Col.rgba(DATA.RESOURCES[b.cur.res].color, 0.35 + 0.25 * Math.sin(Draw.tm * 6));
      Render.roundRect(ctx, wx - 0.7, wy - 0.33, 1.4 * U.clamp(b.prog, 0, 1), 0.66, 0.12); ctx.fill();
      Draw.item(ctx, b.cur.res, b.cur.ref, wx, wy, 0.22);
      if (!App.settings.reducedFx && Math.random() < 0.15) Render.spawn('smoke', b.x + 0.75 + Math.random() * 0.2, b.y + 0.5, (Math.random() - 0.5) * 0.2, -0.6, 2.2, '#cfd8d8', 0.14);
    }
    // chimney
    ctx.fillStyle = '#18282a'; ctx.fillRect(x + b.w - 0.75, y + 0.35, 0.35, 0.35);
    Draw.frontArrow(ctx, b, x, y);
    Draw.levelTag(ctx, b, x, y);
  },

  lab(ctx, g, b, x, y) {
    const cx = x + 2, cy = y + 2;
    Draw.shadow(ctx, x + 0.1, y + 0.1, 3.8, 3.8, 0.6);
    Draw.body(ctx, x + 0.1, y + 0.1, 3.8, 3.8, '#56607a', 0.6);
    ctx.fillStyle = '#e6edf8'; ctx.beginPath(); ctx.arc(cx, cy, 1.45, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8a96b0'; ctx.lineWidth = 0.06; ctx.stroke();
    ctx.strokeStyle = 'rgba(80,100,140,.35)'; ctx.lineWidth = 0.05;
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.arc(cx, cy, i * 0.36, 0, Math.PI * 2); ctx.stroke(); }
    const active = !!g.run.research.active;
    ctx.save(); ctx.translate(cx + 1.2, cy - 1.2); ctx.rotate(App.settings.reducedFx ? 0 : Draw.tm * 0.6);
    ctx.fillStyle = '#c8d4e8'; ctx.beginPath(); ctx.ellipse(0, 0, 0.45, 0.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#56607a'; ctx.fillRect(-0.04, -0.04, 0.5, 0.08);
    ctx.restore();
    if (active) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(Draw.tm * 3);
      ctx.drawImage(Sprites.glow('#7fd3ff'), cx - 1.2, cy - 1.2, 2.4, 2.4);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    Draw.levelTag(ctx, b, x, y);
  },

  path(ctx, g, b, x, y) {
    const col = b.level >= 2 ? '#c9b48a' : DATA.BUILDINGS.path.color;
    ctx.fillStyle = Col.shade(col, -0.25);
