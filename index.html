      if (b.type === 'terminal') { b.warn = g.run.contracts.length && b.shelfTotal === 0 ? 'empty' : null; continue; }
      const waiting = b.customers.some(c => c.state === 'wait' && c.t > 6 && c.wishes.some(w => w.got < w.qty));
      b.warn = waiting && b.shelfTotal === 0 && !(b.ramps && b.ramps.some(s => s.total > 0)) ? 'empty' : null;
    }
  },
  notifyOnce(g, b, kind) {
    const key = b.id + kind;
    const last = g.notified.get(key);
    if (last !== undefined && g.run.time - last < 90) return;
    g.notified.set(key, g.run.time);
    g.events.push({ type: 'warn', b, kind });
  },

  // ---------------- scanner & probe ----------------
  scan(g) {
    const run = g.run;
    if (run.scanCd > 0) return null;
    const p = run.player;
    const r = g.mods.scanRadius;
    run.scanCd = g.mods.scanCd;
    run.scanPing = { x: p.x, y: p.y, t: 0, r };
    g.stats.scans++;
    World.discover(g.world, p.x, p.y, r);
    const found = World.reveal(g.world, p.x, p.y, r);
    for (const d of found) Progression.seeDeposit(g, d);
    g.events.push({ type: 'scan', found });
    return found;
  },
  probe(g) {
    const run = g.run;
    if (!run.research.done.has('probe') || run.probeCd > 0) return null;
    const p = run.player;
    const S = CONFIG.chunkSize;
    const pcx = Math.floor(p.x / S), pcy = Math.floor(p.y / S);
    let best = null, bestD = Infinity;
    for (let r = 0; r <= 10 && !best; r++) {
      for (let cy = pcy - r; cy <= pcy + r; cy++) for (let cx = pcx - r; cx <= pcx + r; cx++) {
        if (Math.max(Math.abs(cx - pcx), Math.abs(cy - pcy)) !== r) continue;
        for (const d of World.chunkDeposits(g.world, cx, cy)) {
          if (d.tier < 3 || g.world.known.has(d.id)) continue;
          const dd = U.dist2(d.x, d.y, p.x, p.y);
          if (dd < bestD) { bestD = dd; best = d; }
        }
      }
    }
    run.probeCd = 300;
    if (best) {
      g.world.known.add(best.id);
      Progression.seeDeposit(g, best);
      World.discover(g.world, best.x, best.y, 6);
      run.probeTarget = { x: best.x, y: best.y, id: best.id };
    }
    g.events.push({ type: 'probe', d: best });
    return best;
  },

  // ---------------- rebirth ----------------
  rebirth(g, targetPlanet) {
    const p = Progression.rebirthPoints(g);
    if (p <= 0) return null;
    const meta = g.meta;
    const gained = p + meta.bonusRp;
    meta.bonusRp = 0;
    meta.rp += gained;
    meta.rpTotal += gained;
    meta.rebirths++;
    meta.maxPlanet = Math.max(meta.maxPlanet, g.run.planet + 1);
    meta.stats.runs.push({ planet: g.run.planet, earned: g.run.earned, time: g.run.time, points: gained });
    if (meta.stats.runs.length > 50) meta.stats.runs.shift();
    const target = U.clamp(targetPlanet || meta.maxPlanet, 1, meta.maxPlanet);
    const g2 = Game.create(meta, target);
    Progression.checkAchievements(g2);
    return { game: g2, gained };
  },

  // Runs many ticks quickly (debug time-lapse / catch-up). Returns ticks done.
  advance(g, ticks) {
    for (let i = 0; i < ticks; i++) Game.tick(g);
    return ticks;
  }
};

// ===== src/core/11_bot.js =====
// =====================================================================
// Bot: headless greedy player used for the balancing report.
// It plays the real simulation: builds extractor lines (optionally with a
// refinery chain) routed by BFS into a hub of silos surrounded by sellers,
// and always buys the action with the best revenue gain per cost.
// =====================================================================
const Bot = {
  SELLERS: ['bazaar', 'caravan', 'shuttlepad', 'port', 'dock', 'terminal'],
  REF_TYPES: ['refinery1', 'refinery2', 'refinery3'],
  RESEARCH_PLAN: ['drill1', 'haggle1', 'traffic1', 'shelf1', 'belt2', 'ref2', 'silo2', 'patience', 'drill2', 'haggle2', 'service', 'traffic2', 'cooler', 'ref3', 'refSpeed', 'belt3', 'servo', 'marketing', 'drill3', 'silo3', 'haggle3', 'beltSpeed', 'contracts', 'belt4'],

  HUMAN_DELAY: 30, // seconds a human needs per build decision (menus, aiming, checking)
  create(opts = {}) {
    const seed = opts.seed !== undefined ? opts.seed : 1234;
    const meta = opts.meta || Game.createMeta(seed);
    const g = Game.create(meta, opts.planet || 1);
    g.rnd = RNG.mulberry32(RNG.hash(seed, 77));
    const L = CONFIG.landing;
    return { g, meta, hub: { x: L.x, y: L.y + 3 }, silos: [], sellers: [], lines: [], badDeps: new Set(), busyUntil: 0, log: [], marks: {}, exploreR: 20, exploreA: 0, lastScan: -999, lab: null, opts };
  },
  mark(B, key) { if (B.marks[key] === undefined) { B.marks[key] = B.g.run.time; B.log.push([Math.round(B.g.run.time), key]); } },

  // ---------------- geometry ----------------
  free(g, x, y) { return !g.occ.has(U.tileKey(x, y)); },
  fits(g, type, x, y, rot) { return Grid.occTiles(type, x, y, rot).every(t => Bot.free(g, t[0], t[1])); },
  route(g, starts, target, limit = 150000) {
    const tr = Grid.rect(target);
    const goal = new Map();
    for (const p of Grid.perimeter(target)) goal.set(U.tileKey(p[0], p[1]), (p[2] + 2) & 3);
    const minX = Math.min(tr.x, ...starts.map(s => s[0])) - 24, maxX = Math.max(tr.x + tr.w, ...starts.map(s => s[0])) + 24;
    const minY = Math.min(tr.y, ...starts.map(s => s[1])) - 24, maxY = Math.max(tr.y + tr.h, ...starts.map(s => s[1])) + 24;
    const prev = new Map(), q = [];
    for (const s of starts) { const k = U.tileKey(s[0], s[1]); if (!Bot.free(g, s[0], s[1]) || prev.has(k)) continue; prev.set(k, -1); q.push(s); }
    for (let qi = 0; qi < q.length && qi < limit; qi++) {
      const [x, y] = q[qi];
      const k = U.tileKey(x, y);
      if (goal.has(k)) {
        const path = [];
        let cur = k;
        while (cur !== -1) { path.push([U.keyX(cur), U.keyY(cur)]); cur = prev.get(cur); }
        path.reverse();
        return { path, lastDir: goal.get(k) };
      }
      for (let d = 0; d < 4; d++) {
        const nx = x + U.DX[d], ny = y + U.DY[d];
        if (nx < minX || nx > maxX || ny < minY || ny > maxY) continue;
        const nk = U.tileKey(nx, ny);
        if (prev.has(nk) || !Bot.free(g, nx, ny)) continue;
        prev.set(nk, k); q.push([nx, ny]);
      }
    }
    return null;
  },
  beltSpecs(path, lastDir, grade) {
    return path.map((p, i) => {
      let rot = lastDir;
      if (i < path.length - 1) { const dx = path[i + 1][0] - p[0], dy = path[i + 1][1] - p[1]; rot = dx > 0 ? 0 : dx < 0 ? 2 : dy > 0 ? 1 : 3; }
      return { type: 'belt', x: p[0], y: p[1], rot, grade };
    });
  },
  beltCost(g, n, grade) {
    let c = 0; const base = DATA.BELT_GRADES[grade].cost; const n0 = g.run.counts.belt || 0;
    for (let i = 0; i < n; i++) c += base * Math.pow(CONFIG.beltCostGrowth, n0 + i);
    return c;
  },
  spiralSpot(g, cx, cy, type, rot, pred, maxR = 40) {
    for (let r = 0; r <= maxR; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      const x = cx + dx, y = cy + dy;
      if (Bot.fits(g, type, x, y, rot) && (!pred || pred(x, y))) return { x, y };
    }
    return null;
  },
  touches(a, bx, by, bw, bh) {
    const r = Grid.rect(a);
    const ox = Math.min(r.x + r.w, bx + bw) - Math.max(r.x, bx);
    const oy = Math.min(r.y + r.h, by + bh) - Math.max(r.y, by);
    return (ox > 0 && (by + bh === r.y || r.y + r.h === by)) || (oy > 0 && (bx + bw === r.x || r.x + r.w === bx));
  },
  inRect(x, y, r) { return x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; },

  // ---------------- economic model ----------------
  sellerCapOf(g, type, level, b) {
    const t = SELLER_TIER[type];
    if (t === 5) return 0;
    const c = CONFIG.customers[t];
    const am = b ? Economy.arrivalMult(g, b) : g.mods.arrival * Math.pow(CONFIG.sellerLevelArrival, level - 1);
    const iv = (c.interval[0] + c.interval[1]) / 2 / am;
    const svc = CONFIG.serviceRate[t] * Math.pow(1.3, level - 1) * g.mods.service * 1.2;
    return Math.min(svc, (c.qty[0] + c.qty[1]) / 2 / iv) * 0.9;
  },
  model(B) {
    const g = B.g;
    const lines = B.lines.map(L => ({ r: L.rate, v: L.val, t: DATA.RESOURCES[L.res].tier }));
    const caps = [0, 0, 0, 0, 0, 0];
    for (const b of B.sellers) caps[SELLER_TIER[b.type]] += Bot.sellerCapOf(g, b.type, b.level, b);
    return { lines, caps };
  },
  // Revenue estimate: sellers (best first) buy the most valuable items within their wish range.
  revenue(m) {
    const rem = m.lines.map(l => l.r);
    const order = m.lines.map((l, i) => i).sort((a, b) => m.lines[b].v - m.lines[a].v);
    let rev = 0;
    for (let t = 5; t >= 0; t--) {
      let cap = m.caps[t];
      if (cap <= 0) continue;
      const maxT = CONFIG.wishMaxTier[t];
      for (const i of order) {
        if (cap <= 0) break;
        if (m.lines[i].t > maxT || rem[i] <= 0) continue;
        const a = Math.min(cap, rem[i]);
        rev += a * m.lines[i].v * CONFIG.customers[t].factor;
        rem[i] -= a; cap -= a;
      }
      // a few luxury wishes buy anything
      for (const i of order) {
        if (cap <= 0) break;
        if (rem[i] <= 0) continue;
        const a = Math.min(cap * CONFIG.luxuryChance, rem[i]);
        rev += a * m.lines[i].v * CONFIG.customers[t].factor; rem[i] -= a; cap -= a;
      }
    }
    return rev;
  },
  withLine(m, r, v, t) { return { lines: m.lines.concat([{ r, v, t }]), caps: m.caps }; },
  withLineRate(m, idx, r) { const lines = m.lines.slice(); lines[idx] = Object.assign({}, lines[idx], { r }); return { lines, caps: m.caps }; },
  withCap(m, t, dc) { const caps = m.caps.slice(); caps[t] += dc; return { lines: m.lines, caps }; },
  refRate(g, k, level = 1) { return CONFIG.refineRate[k] * Math.pow(1.25, level - 1) * g.mods.refine; },
  lineRate(g, L) {
    let r = L.ex.rate;
    for (const rf of L.refs) r = Math.min(r, rf.rate);
    const grade = L.beltIds.length ? Math.min(...L.beltIds.map(id => { const b = g.buildings.get(id); return b ? b.grade : 3; })) : 3;
    return Math.min(r, CONFIG.belt.throughput[grade] * g.mods.beltSpeed);
  },
  maxRefine(g) { return g.run.research.done.has('ref3') ? 3 : g.run.research.done.has('ref2') ? 2 : 1; },

  // ---------------- hub ----------------
  ensureHub(B) {
    const g = B.g;
    if (!B.sellers.length) {
      const b = Grid.place(g, { type: 'bazaar', x: B.hub.x, y: B.hub.y, rot: 0 }, { ignoreRadius: true });
      if (b) { B.sellers.push(b); Bot.mark(B, 'firstBazaar'); return true; }
      return false;
    }
    if (!B.silos.length) {
      if (g.run.money < Grid.cost(g, 'silo')) return B.lines.length > 0; // save up for the hub silo
      const s = B.sellers[0];
      const spot = Bot.spiralSpot(g, s.x, s.y + s.h, 'silo', 0, (x, y) => Bot.touches(s, x, y, 3, 3), 6);
      if (spot) { const b = Grid.place(g, { type: 'silo', x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true }); if (b) { b.outEnabled = false; B.silos.push(b); return true; } }
    }
    return false;
  },
  targetFor(B) {
    if (B.silos.length) return B.silos.reduce((a, s) => (s.total / Economy.siloCap(B.g, s)) < (a.total / Economy.siloCap(B.g, a)) ? s : a, B.silos[0]);
    return B.sellers[0];
  },

  // ---------------- candidates ----------------
  bestDeposit(B, budget = Infinity) {
    const g = B.g;
    const target = Bot.targetFor(B);
    if (!target) return null;
    let best = null;
    const k = Bot.maxRefine(g);
    for (const id of g.world.known) {
      if (B.badDeps.has(id)) continue;
      const d = World.depositById(g.world, id);
      if (!d || Grid.depositFree(g, d) <= 0) continue;
      const dist = Math.hypot(d.x - target.x, d.y - target.y);
      const val = DATA.RESOURCES[d.res].value * CONFIG.refineFactor[k];
      const cost = Grid.cost(g, 'extractor', { tier: d.tier }) + Bot.beltCost(g, Math.ceil(dist * 1.1), 0);
      if (cost > budget) continue;
      const score = Math.min(CONFIG.extractRate[d.tier], 0.5) * val / (cost + dist * 2);
      if (!best || score > best.score) best = { d, dist, score };
    }
    return best;
  },
  candidates(B) {
    const g = B.g;
    const m = Bot.model(B);
    const R0 = Bot.revenue(m);
    const out = [];
    const add = (cost, m2, act, label) => { const gain = Bot.revenue(m2) - R0; if (gain > 1e-9 && isFinite(cost)) out.push({ cost, gain, ratio: gain / cost, act, label }); };
    // new lines: evaluate every known free deposit with every refine depth, keep the best few
    if (B.silos.length || !B.lines.length) {
      const target = Bot.targetFor(B);
      const lineCands = [];
      const maxK = B.silos.length ? Bot.maxRefine(g) : 0;
      for (const id of g.world.known) {
        if (B.badDeps.has(id)) continue;
        const d = World.depositById(g.world, id);
        if (!d || Grid.depositFree(g, d) <= 0) continue;
        const dist = Math.hypot(d.x - target.x, d.y - target.y);
        const exRate = CONFIG.extractRate[d.tier] * g.mods.extract;
        const baseCost = Grid.cost(g, 'extractor', { tier: d.tier }) + Bot.beltCost(g, Math.ceil(dist * 1.3), 0) + dist * 1.5;
        for (let k = 0; k <= maxK; k++) {
          let rate = Math.min(exRate, CONFIG.belt.throughput[0] * g.mods.beltSpeed), cost = baseCost;
          for (let j = 0; j < k; j++) { rate = Math.min(rate, Bot.refRate(g, j)); cost += Grid.cost(g, Bot.REF_TYPES[j]); }
          const val = DATA.RESOURCES[d.res].value * CONFIG.refineFactor[k];
          const gain = Bot.revenue(Bot.withLine(m, rate, val, d.tier)) - R0;
          if (gain > 0) lineCands.push({ d, k, cost, gain });
        }
      }
      lineCands.sort((a, b) => b.gain / b.cost - a.gain / a.cost);
      for (const lc of lineCands.slice(0, 3)) out.push({ cost: lc.cost, gain: lc.gain, ratio: lc.gain / lc.cost, act: () => Bot.buildLine(B, lc.d, lc.k), label: 'line' + lc.k });
    }
    // upgrade the bottleneck of a line
    B.lines.forEach((L, li) => {
      const comps = [{ b: L.ex, r: L.ex.rate }].concat(L.refs.map(rf => ({ b: rf, r: rf.rate })));
      const grade = Math.min(...L.beltIds.map(id => (g.buildings.get(id) || { grade: 3 }).grade));
      const beltR = CONFIG.belt.throughput[grade] * g.mods.beltSpeed;
      comps.sort((a, c) => a.r - c.r);
      const lo = comps[0];
      if (beltR < lo.r * 0.999) {
        const next = DATA.BELT_GRADES[grade + 1];
        if (!next || (next.research && !g.run.research.done.has(next.research))) return;
        const n = L.beltIds.length;
        const cost = n * (next.cost - DATA.BELT_GRADES[grade].cost * 0.5);
        const nr = Math.min(lo.r, CONFIG.belt.throughput[grade + 1] * g.mods.beltSpeed);
        add(cost, Bot.withLineRate(m, li, nr), () => Bot.upgradeBelts(B, L), 'belts');
        return;
      }
      if (Grid.upgradeBlock(g, lo.b)) return;
      const cost = Grid.upgradeCost(g, lo.b);
      const mult = lo.b.type === 'extractor' ? CONFIG.extractorLevelSpeed : 1.25;
      const second = comps.length > 1 ? comps[1].r : Infinity;
      const nr = Math.min(lo.r * mult, second, beltR);
      add(cost, Bot.withLineRate(m, li, nr), () => { Grid.upgrade(g, lo.b); g.topologyDirty = true; }, 'up-' + lo.b.type);
    });
    // sellers
    if (B.silos.length) {
      for (let t = Math.min(4, g.run.custTier); t >= Math.max(0, g.run.custTier - 3); t--) {
        const type = Bot.SELLERS[t];
        const n = g.run.counts[type] || 0, k = CONFIG.crowding[t] || 0;
        const base = Bot.sellerCapOf(g, type, 1, null);
        const c = (n + 1) * base / (1 + k * n) - (n > 0 ? n * base / (1 + k * (n - 1)) : 0);
        add(Grid.cost(g, type), Bot.withCap(m, t, c), () => Bot.addSeller(B, type), 'seller' + t);
      }
      for (const s of B.sellers) {
        if (SELLER_TIER[s.type] === 5 || Grid.upgradeBlock(g, s)) continue;
        const c0 = Bot.sellerCapOf(g, s.type, s.level, s);
        add(Grid.upgradeCost(g, s), Bot.withCap(m, SELLER_TIER[s.type], c0 * (CONFIG.sellerLevelArrival - 1)), () => { Grid.upgrade(g, s); }, 'up-seller');
      }
    }
    // rebuild a raw (or less refined) line with the best available refinery chain
    const maxK = Bot.maxRefine(g);
    B.lines.forEach((L, li) => {
      if (L.refs.length >= maxK || !B.silos.length) return;
      const k = maxK;
      let rate = L.ex.rate;
      for (let j = 0; j < k; j++) rate = Math.min(rate, Bot.refRate(g, j));
      rate = Math.min(rate, CONFIG.belt.throughput[0] * g.mods.beltSpeed);
      let cost = Grid.cost(g, 'extractor', { tier: L.ex.tier }) + Bot.beltCost(g, L.beltIds.length + 6, 0);
      for (let j = 0; j < k; j++) cost += Grid.cost(g, Bot.REF_TYPES[j]);
      const lines = m.lines.slice();
      lines[li] = Object.assign({}, lines[li], { r: rate, v: DATA.RESOURCES[L.res].value * CONFIG.refineFactor[k] });
      add(cost, { lines, caps: m.caps }, () => Bot.rebuildLine(B, L, k), 'rebuild' + k);
    });
    // research: estimated relative revenue gain
    if (B.lab && !g.run.research.active) {
      const est = { haggle1: 0.08, haggle2: 0.12, haggle3: 0.18, traffic1: 0.1, traffic2: 0.12, ref2: 0.15, ref3: 0.15, refSpeed: 0.08, drill1: 0.04, drill2: 0.05, drill3: 0.06, service: 0.05, patience: 0.05, shelf1: 0.03, belt2: 0.04, belt3: 0.04, belt4: 0.03, beltSpeed: 0.03, marketing: 0.03, cooler: 0.03, servo: 0.03, silo2: 0.02, silo3: 0.02, contracts: 0.05 };
      for (const id of Bot.RESEARCH_PLAN) {
        const r = DATA.RESEARCH_BY_ID[id];
        if (Progression.researchState(g, r) !== 'available') continue;
        const cost = Progression.researchCost(g, r);
        const gain = R0 * (est[id] || 0.02);
        if (gain > 0) out.push({ cost, gain, ratio: gain / cost, act: () => Progression.startResearch(g, id), label: 'research' });
      }
    }
    return { out, m, R0 };
  },

  // ---------------- actions ----------------
  buildLine(B, d, k) {
    const g = B.g;
    const target = Bot.targetFor(B);
    const cands = [];
    for (const t of d.tiles) for (let dy = -2; dy <= 1; dy++) for (let dx = -2; dx <= 1; dx++) cands.push([t[0] + dx, t[1] + dy]);
    cands.sort((a, b) => U.dist2(a[0], a[1], target.x, target.y) - U.dist2(b[0], b[1], target.x, target.y));
    const tried = new Set();
    let attempts = 0;
    for (const c of cands) {
      const key = c[0] + ',' + c[1];
      if (tried.has(key)) continue; tried.add(key);
      const spec = { type: 'extractor', x: c[0], y: c[1], rot: 0 };
      const chk = Grid.canPlace(g, spec, { ignoreRadius: true, ignoreMoney: true });
      if (!chk.ok || chk.dep.id !== d.id) continue;
      if (++attempts > 6) break;
      const ghosts = [];
      const occupy = (type, x, y, rot) => { const b = Grid.make(g, { type, x, y, rot, id: -100 - ghosts.length }); Grid.register(g, b); ghosts.push(b); return b; };
      const cleanup = () => { for (const gb of ghosts) Grid.unregister(g, gb); g.nextId = 1; for (const id of g.buildings.keys()) if (id >= g.nextId) g.nextId = id + 1; };
      const exG = occupy('extractor', c[0], c[1], 0);
      // refinery chain
      const chain = [];
      let prevRect = { x: c[0], y: c[1], w: 2, h: 2 }, prevPort = null, ok = true;
      for (let j = 0; j < k && ok; j++) {
        let found = null;
        const positions = [];
        if (j === 0) { for (let oy = -3; oy <= 2; oy++) for (let ox = -3; ox <= 2; ox++) positions.push([c[0] + ox, c[1] + oy]); }
        else { for (let oy = -2; oy <= 0; oy++) for (let ox = -2; ox <= 0; ox++) positions.push([prevPort[0] + ox, prevPort[1] + oy]); }
        positions.sort((a, b) => U.dist2(a[0], a[1], target.x, target.y) - U.dist2(b[0], b[1], target.x, target.y));
        for (const p of positions) {
          for (let rot = 0; rot < 4 && !found; rot++) {
            if (!Bot.fits(g, 'refinery1', p[0], p[1], rot)) continue;
            const rect = { x: p[0], y: p[1], w: 3, h: 3 };
            if (j === 0 && !Bot.touches(exG, p[0], p[1], 3, 3)) continue;
            if (j > 0 && !Bot.inRect(prevPort[0], prevPort[1], rect)) continue;
            const port = Grid.frontPort({ x: p[0], y: p[1], w: 3, h: 3, rot });
            if (!Bot.free(g, port[0], port[1]) || Bot.inRect(port[0], port[1], prevRect)) continue;
            found = { x: p[0], y: p[1], rot, port, rect };
          }
          if (found) break;
        }
        if (!found) { ok = false; break; }
        occupy('refinery1', found.x, found.y, found.rot);
        chain.push(found); prevRect = found.rect; prevPort = found.port;
      }
      if (!ok) { cleanup(); continue; }
      const starts = chain.length ? [prevPort] : Grid.perimeter(exG).map(p => [p[0], p[1]]);
      const r = Bot.route(g, starts, target);
      cleanup();
      if (!r) continue;
      const belts = Bot.beltSpecs(r.path, r.lastDir, 0);
      const total = Grid.cost(g, 'extractor', { tier: d.tier }) + Bot.beltCost(g, belts.length, 0) + chain.reduce((a, ch, j) => a + Grid.cost(g, Bot.REF_TYPES[j]), 0);
      if (total > g.run.money) return { wait: total };
      const ex = Grid.place(g, spec, { ignoreRadius: true });
      if (!ex) return null;
      const refs = chain.map((ch, j) => Grid.place(g, { type: Bot.REF_TYPES[j], x: ch.x, y: ch.y, rot: ch.rot }, { ignoreRadius: true, ignoreMoney: true }));
      if (refs.length) {
        let mask = 0;
        for (const p of Grid.perimeter(ex)) if (Bot.inRect(p[0], p[1], chain[0].rect)) mask |= 1 << p[2];
        ex.outMask = mask || 15;
        Bot.mark(B, 'firstRefinery');
      }
      const res = Actions.placeMany(g, belts, { ignoreRadius: true });
      g.topologyDirty = true; Game.recompute(g);
      const L = { ex, refs, beltIds: res.placed.map(b => b.id), rate: 0, val: DATA.RESOURCES[d.res].value * CONFIG.refineFactor[refs.length], res: d.res };
      L.rate = Bot.lineRate(g, L);
      B.lines.push(L);
      Bot.mark(B, 'firstExtractor');
      B.busyUntil = g.run.time + Bot.HUMAN_DELAY * 2 + Math.hypot(d.x - B.hub.x, d.y - B.hub.y) * 2 / g.mods.walk + belts.length * 0.3;
      return { ok: true };
    }
    B.badDeps.add(d.id);
    return null;
  },
  rebuildLine(B, L, k) {
    const g = B.g;
    const d = World.depositById(g.world, L.ex.dep);
    if (!d) return null;
    const parts = [L.ex].concat(L.refs, L.beltIds.map(id => g.buildings.get(id)).filter(Boolean));
    for (const b of parts) if (g.buildings.has(b.id)) Grid.remove(g, b);
    B.lines.splice(B.lines.indexOf(L), 1);
    g.topologyDirty = true; Game.recompute(g);
    let r = Bot.buildLine(B, d, k);
    if (!(r && r.ok)) r = Bot.buildLine(B, d, 0);
    B.badDeps.delete(d.id);
    return r;
  },
  upgradeBelts(B, L) {
    const g = B.g;
    for (const id of L.beltIds) { const b = g.buildings.get(id); if (b) Grid.upgrade(g, b); }
    g.topologyDirty = true;
  },
  addSeller(B, type) {
    const g = B.g;
    const sz = Grid.size(type, 0);
    for (const s of B.silos) {
      const spot = Bot.spiralSpot(g, s.x - sz.w, s.y - sz.h, type, 0, (x, y) => Bot.touches(s, x, y, sz.w, sz.h), 12);
      if (spot) {
        const b = Grid.place(g, { type, x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true });
        if (b) {
          B.sellers.push(b);
          if (type === 'bazaar') Bot.layPath(B, b);
          return true;
        }
      }
    }
    // no room left: open a new hub silo next to the existing hub
    const last = B.silos[B.silos.length - 1];
    if (g.run.money >= Grid.cost(g, 'silo')) {
      const spot = Bot.spiralSpot(g, last.x + 14, last.y, 'silo', 0, null, 30);
      if (spot) { const b = Grid.place(g, { type: 'silo', x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true }); if (b) { b.outEnabled = false; B.silos.push(b); } }
    }
    return false;
  },
  layPath(B, b) {
    const g = B.g;
    const specs = [];
    for (let d = 0; d < 4 && specs.length < 8; d++) {
      let x = b.x + (d === 0 ? b.w : d === 2 ? -1 : 1), y = b.y + (d === 1 ? b.h : d === 3 ? -1 : 0);
      for (let i = 0; i < 8 && specs.length < 8; i++) {
        if (!Bot.free(g, x, y)) break;
        specs.push({ type: 'path', x, y, rot: 0 });
        x += U.DX[d]; y += U.DY[d];
      }
    }
    if (specs.length) Actions.placeMany(g, specs, { ignoreRadius: true });
  },
  terminal(B) {
    const g = B.g;
    if (g.run.custTier < 5 || (g.lists.terminal || []).length) return false;
    const cost = Grid.cost(g, 'terminal');
    if (cost > g.run.money * 0.7) return false;
    for (const s of B.silos) {
      const spot = Bot.spiralSpot(g, s.x - 7, s.y - 7, 'terminal', 0, (x, y) => Bot.touches(s, x, y, 7, 7), 16);
      if (spot) { const b = Grid.place(g, { type: 'terminal', x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true }); if (b) { B.sellers.push(b); return true; } }
    }
    return false;
  },
  research(B) {
    const g = B.g;
    if (!B.lab) {
      if (g.run.earned < 3000 || g.run.money < Grid.cost(g, 'lab') + 300) return false;
      const spot = Bot.spiralSpot(g, B.hub.x - 12, B.hub.y - 10, 'lab', 0, null, 30);
      if (!spot) return false;
      B.lab = Grid.place(g, { type: 'lab', x: spot.x, y: spot.y, rot: 0 }, { ignoreRadius: true });
      return !!B.lab;
    }
    if (g.run.research.active) return false;
    // cheap research is always taken right away; expensive research competes in the candidate list
    for (const id of Bot.RESEARCH_PLAN) {
      const r = DATA.RESEARCH_BY_ID[id];
      if (Progression.researchState(g, r) !== 'available') continue;
      if (Progression.researchCost(g, r) > g.run.money * 0.25) return false;
      return !Progression.startResearch(g, id);
    }
    return false;
  },
  explore(B) {
    const g = B.g;
    if (g.run.time - B.lastScan < 30) return;
    B.lastScan = g.run.time;
    B.exploreA += 1.1;
    B.exploreR = Math.min(400, B.exploreR + 4);
    const x = B.hub.x + Math.cos(B.exploreA) * B.exploreR, y = B.hub.y + Math.sin(B.exploreA) * B.exploreR;
    World.discover(g.world, x, y, g.mods.scanRadius);
    World.reveal(g.world, x, y, g.mods.scanRadius);
  },

  decide(B) {
    const g = B.g;
    if (g.run.time < B.busyUntil || g.run.time < 8) return;
    for (const L of B.lines) { L.rate = Bot.lineRate(g, L); }
    if (Bot.ensureHub(B)) return;
    Bot.explore(B);
    if (Bot.research(B)) { B.busyUntil = g.run.time + 4; return; }
    if (Bot.terminal(B)) return;
    if (!B.lines.length) {
      const dep = Bot.bestDeposit(B, g.run.money);
      if (dep) Bot.buildLine(B, dep.d, 0);
      return;
    }
    if (!B.silos.length) return;
    const { out, R0 } = Bot.candidates(B);
    if (!out.length) return;
    out.sort((a, b) => b.ratio - a.ratio);
    const best = out[0];
    const income = Math.max(0.1, R0 * g.mods.sales);
    let pick = null;
    if (best.cost <= g.run.money) pick = best;
    else if ((best.cost - g.run.money) / income > 1800) pick = out.find(o => o.cost <= g.run.money && o.ratio >= best.ratio * 0.3);
    if (!pick) return;
    const r = pick.act();
    if (pick.label.startsWith('line') && !(r && r.ok)) return;
    B.busyUntil = Math.max(B.busyUntil, g.run.time + Bot.HUMAN_DELAY);
  },

  *runIter(opts = {}) {
    const B = Bot.create(opts);
    const g = B.g;
    const maxT = (opts.maxHours || 6) * 3600;
    const th = Progression.threshold(g.run.planet);
    let lastHour = 0, lastEarned = 0;
    const hourly = [];
    while (g.run.time < maxT) {
      for (let i = 0; i < CONFIG.tickRate; i++) Game.tick(g);
      g.events.length = 0;
      if ((g.tick / CONFIG.tickRate) % 2 === 0) Bot.decide(B);
      if (g.run.earned > 0) Bot.mark(B, 'firstSale');
      for (let t = 1; t <= g.run.custTier; t++) Bot.mark(B, 'tier' + (t + 1));
      if (g.run.earned >= th) { Bot.mark(B, 'rebirth'); if (!opts.continueAfterRebirth) break; }
      if (g.run.time - lastHour >= 3600) { lastHour += 3600; hourly.push(g.run.earned - lastEarned); lastEarned = g.run.earned; }
      if (g.tick % (CONFIG.tickRate * 60) === 0) {
        if (opts.trace && g.tick % (CONFIG.tickRate * 600) === 0) {
          const sellers = {}; for (const b of g.lists.seller) sellers[b.type] = (sellers[b.type] || 0) + 1;
          const m = Bot.model(B);
          const P = m.lines.reduce((a, l) => a + l.r, 0), C = m.caps.reduce((a, c) => a + c, 0);
          opts.trace(Fmt.time(g.run.time) + ' earned ' + Fmt.num(g.run.earned) + ' inc ' + Fmt.num(g.income) + '/s money ' + Fmt.num(g.run.money) + ' lines ' + B.lines.length + ' P ' + Fmt.num(P) + ' C ' + Fmt.num(C) + ' est ' + Fmt.num(Bot.revenue(m) * g.mods.sales) + ' tier ' + (g.run.custTier + 1) + ' ' + JSON.stringify(sellers) + ' ref ' + (g.lists.refinery || []).length + ' res ' + g.run.research.done.size + ' b ' + g.buildings.size);
        }
        yield { time: g.run.time, earned: g.run.earned };
      }
    }
    return { marks: B.marks, log: B.log, hourly, time: g.run.time, earned: g.run.earned, buildings: g.buildings.size, lines: B.lines.length, sellers: B.sellers.length, planet: g.run.planet, game: g, bot: B };
  },
  run(opts) { const it = Bot.runIter(opts); let r = it.next(); while (!r.done) r = it.next(); return r.value; },
  format(rep) {
    const m = rep.marks;
    const f = k => m[k] !== undefined ? Fmt.time(m[k]) : '–';
    return [
      'Balancing-Report (Planet ' + rep.planet + ', greedy Bot)',
      'Erster Extraktor:      ' + f('firstExtractor'),
      'Erster Verkauf:        ' + f('firstSale'),
      'Erste Raffinerie:      ' + f('firstRefinery'),
      'Kundenstufe 2:         ' + f('tier2'),
      'Kundenstufe 3:         ' + f('tier3'),
      'Kundenstufe 4:         ' + f('tier4'),
      'Kundenstufe 5:         ' + f('tier5'),
      'Kundenstufe 6:         ' + f('tier6'),
      'Rebirth möglich:       ' + f('rebirth'),
      'Erlös gesamt:          ' + Fmt.money(rep.earned) + ' in ' + Fmt.time(rep.time),
      'Erlös pro Stunde:      ' + rep.hourly.map(v => Fmt.num(v)).join(' / '),
      'Gebäude ' + rep.buildings + ', Linien ' + rep.lines + ', Verkaufsgebäude ' + rep.sellers
    ].join('\n');
  }
};

// SelfTest: determinism, distribution, save roundtrip, offline bounds, NaN guard

const SelfTest = {
  run() {
    const out = [];
    const test = (name, f) => {
      try { const r = f(); out.push({ name, ok: r === true || (r && r.ok), info: r && r.info }); }
      catch (e) { out.push({ name, ok: false, info: 'Ausnahme: ' + e.message }); }
    };
    test('Chunk-Generierung deterministisch', () => {
      const a = World.create(987654, 1), b = World.create(987654, 1);
      for (let i = 0; i < 200; i++) {
        const cx = (i * 37) % 61 - 30, cy = (i * 91) % 53 - 26;
        const da = JSON.stringify(World.genChunkDeposits(a, cx, cy).map(d => [d.x, d.y, d.res, d.tiles]));
        const db = JSON.stringify(World.genChunkDeposits(b, cx, cy).map(d => [d.x, d.y, d.res, d.tiles]));
        if (da !== db) return { ok: false, info: 'Chunk ' + cx + '/' + cy + ' unterschiedlich' };
      }
      const t1 = World.terrain(a, 1234.5, -987.25), t2 = World.terrain(b, 1234.5, -987.25);
      return { ok: t1.e === t2.e && JSON.stringify(a.start) === JSON.stringify(b.start), info: '200 Chunks + Terrain + Glücksstart identisch' };
    });
    test('Weit entfernte Koordinaten (±1.000.000) stabil', () => {
      const w = World.create(42, 1);
      const d = World.genChunkDeposits(w, 31000, -31000);
      const t = World.terrain(w, 999999.5, -999999.5);
      return { ok: isFinite(t.e) && Array.isArray(d), info: 'Terrain ' + t.e.toFixed(3) };
    });
    test('Seltenheitsverteilung (100.000 Vorkommen, ±10 %)', () => {
      const w = World.create(13579, 1);
      const counts = new Array(8).fill(0);
      let n = 0;
      for (let cx = 2000; n < 100000; cx++) for (let cy = -150; cy < 150 && n < 100000; cy++) for (const d of World.genChunkDeposits(w, cx, cy)) { counts[d.tier]++; n++; }
      const tot = CONFIG.tierWeights.reduce((a, b) => a + b, 0);
      const dev = counts.map((c, t) => Math.abs(c / n / (CONFIG.tierWeights[t] / tot) - 1));
      const worst = Math.max(...dev);
      return { ok: worst <= 0.10, info: 'max. Abweichung ' + (worst * 100).toFixed(1) + ' % · ' + counts.map(c => (c / n * 100).toFixed(1)).join('/') };
    });
    test('91 Rohstoffe, Verteilung 25/20/16/12/8/5/3/2, Namen eindeutig', () => {
      const per = DATA.BY_TIER.map(a => a.length).join('/');
      const uniq = new Set(DATA.RESOURCES.map(r => r.name)).size;
      return { ok: DATA.RESOURCES.length === 91 && per === '25/20/16/12/8/5/3/2' && uniq === 91, info: per + ' · ' + uniq + ' eindeutige Namen' };
    });
    test('Glücksstart immer spielbar', () => {
      const luck = [0, 0, 0, 0];
      for (let s = 1; s <= 2000; s++) {
        const w = World.create(s * 7919, 1);
        luck[w.start.luck]++;
        if (!w.start.deposits.some(d => d.tier === 0)) return { ok: false, info: 'Seed ' + s + ' ohne gewöhnliches Vorkommen' };
        const L = CONFIG.landing;
        if (!w.start.deposits.every(d => Math.hypot(d.x - L.x, d.y - L.y) <= CONFIG.startRadius)) return { ok: false, info: 'Vorkommen außerhalb des Startradius' };
      }
      return { ok: true, info: 'Normal/Gut/Jackpot/Wunder: ' + luck.map(c => (c / 20).toFixed(1) + ' %').join(' / ') + ' (Ziel 70/20/8/2)' };
    });
    let g;
    test('Bauen, Logistik und Verkauf', () => {
      g = SelfTest.sampleGame();
      for (let i = 0; i < 20 * 180; i++) Game.tick(g);
      return { ok: g.run.earned > 0, info: Fmt.money(g.run.earned) + ' nach 3 Minuten' };
    });
    test('Speichern/Laden verlustfrei', () => {
      const s1 = Save.serialize(g);
      const back = Save.fromObject(JSON.parse(s1)).game;
      const s2 = Save.serialize(back);
      const a = JSON.parse(s1), b = JSON.parse(s2);
      delete a.savedAt; delete b.savedAt; delete a.lastSeen; delete b.lastSeen;
      const same = JSON.stringify(a) === JSON.stringify(b);
      const exp = Save.parseImport(Save.exportString(g));
      return { ok: same && exp.loaded.game.buildings.size === g.buildings.size, info: g.buildings.size + ' Gebäude, ' + (s1.length / 1024).toFixed(1) + ' KB' };
    });
    test('Offline monoton und auf 8 h begrenzt', () => {
      const s = Save.serialize(g);
      const res = [600, 3600, 4 * 3600, 8 * 3600, 20 * 3600].map(sec => Offline.simulate(Save.fromObject(JSON.parse(s)).game, sec));
      let mono = true;
      for (let i = 1; i < res.length; i++) if (res[i].earned + 1e-6 < res[i - 1].earned) mono = false;
      const capped = res[4].seconds === CONFIG.offlineMax && Math.abs(res[4].earned - res[3].earned) < 1e-6;
      return { ok: mono && capped && res.every(r => isFinite(r.earned)), info: res.map(r => Fmt.num(r.earned)).join(' ≤ ') };
    });
    test('Offline-Berechnung schnell (2.000 Gebäude)', () => {
      const big = SelfTest.bigGame(2000);
      const t0 = Date.now();
      const r = Offline.simulate(big, 8 * 3600);
      const ms = Date.now() - t0;
      return { ok: ms < 300 && isFinite(r.earned), info: ms + ' ms für ' + big.buildings.size + ' Gebäude' };
    });
    test('Keine NaN/Infinity in der Wirtschaft', () => {
      const vals = [g.run.money, g.run.earned, g.meta.totalEarned, g.income, ...g.run.demand.d, ...g.run.demand.s, g.mods.sales];
      const huge = Fmt.num(1e308) + Fmt.num(Infinity) + Fmt.num(NaN);
      return { ok: vals.every(v => isFinite(v)) && !/NaN|Infinity/.test(huge), info: 'Formatierung: ' + Fmt.num(1e45) + ', ' + Fmt.num(NaN) };
    });
    test('Undo/Redo', () => {
      const g2 = SelfTest.sampleGame();
      const n0 = g2.buildings.size, m0 = g2.run.money;
      Actions.placeMany(g2, [{ type: 'belt', x: 40, y: 40, rot: 0 }, { type: 'belt', x: 41, y: 40, rot: 0 }], { ignoreRadius: true });
      const n1 = g2.buildings.size;
      Actions.undo(g2);
      const n2 = g2.buildings.size, m2 = g2.run.money;
      Actions.redo(g2);
      return { ok: n1 === n0 + 2 && n2 === n0 && Math.abs(m2 - m0) < 1e-6 && g2.buildings.size === n1, info: n0 + ' → ' + n1 + ' → ' + n2 + ' → ' + g2.buildings.size };
    });
    return out;
  },

  // Small working setup next to the first common start deposit.
  sampleGame(seed = 4242) {
    const meta = Game.createMeta(seed);
    const g = Game.create(meta, 1);
    g.run.money = 5000;
    const d = g.world.start.deposits.find(x => x.tier === 0);
    let ex = null;
    for (let dy = -2; dy <= 1 && !ex; dy++) for (let dx = -2; dx <= 1 && !ex; dx++) ex = Grid.place(g, { type: 'extractor', x: d.x + dx, y: d.y + dy, rot: 0 }, { ignoreRadius: true });
    if (!ex) return g;
    const bx = ex.x + 2;
    let len = 0;
    for (let i = 0; i < 12; i++) { if (Grid.place(g, { type: 'belt', x: bx + i, y: ex.y, rot: 0 }, { ignoreRadius: true })) len++; else break; }
    Grid.place(g, { type: 'bazaar', x: bx + len, y: ex.y - 1, rot: 0 }, { ignoreRadius: true });
    Grid.place(g, { type: 'silo', x: bx + len, y: ex.y + 1, rot: 0 }, { ignoreRadius: true });
    return g;
  },
  // Synthetic large factory for performance tests.
  bigGame(n) {
    const meta = Game.createMeta(99);
    const g = Game.create(meta, 1);
    g.run.money = 1e15;
    let placed = 0, row = 0;
    const deps = [];
    for (let cx = 3; deps.length < 300 && cx < 40; cx++) for (let cy = -10; cy < 10; cy++) for (const d of World.chunkDeposits(g.world, cx, cy)) deps.push(d);
    for (const d of deps) {
      if (placed >= n) break;
      const ex = Grid.place(g, { type: 'extractor', x: d.x, y: d.y, rot: 0 }, { ignoreRadius: true });
      if (!ex) continue;
      placed++;
      for (let i = 0; i < 4; i++) if (Grid.place(g, { type: 'belt', x: ex.x + 2 + i, y: ex.y, rot: 0 }, { ignoreRadius: true })) placed++;
      if (Grid.place(g, { type: 'silo', x: ex.x + 6, y: ex.y - 1, rot: 0 }, { ignoreRadius: true })) placed++;
      row++;
    }
    let y = -400;
    while (placed < n) { for (let x = 0; x < 40 && placed < n; x++) if (Grid.place(g, { type: 'belt', x: -300 + x, y, rot: 0 }, { ignoreRadius: true })) placed++; y++; }
    Game.recompute(g);
    return g;
  }
};

const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};

// =====================================================================
// Audio: synthesised with Web Audio, started after first user gesture
// =====================================================================
const Audio2 = {
  ctx: null, master: null, sfx: null, music: null, drone: null, started: false, lastPlay: {},

  start() {
    if (Audio2.started) { if (Audio2.ctx && Audio2.ctx.state === 'suspended') Audio2.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const ctx = new AC();
      Audio2.ctx = ctx;
      Audio2.master = ctx.createGain(); Audio2.master.connect(ctx.destination);
      Audio2.sfx = ctx.createGain(); Audio2.sfx.connect(Audio2.master);
      Audio2.music = ctx.createGain(); Audio2.music.connect(Audio2.master);
      Audio2.started = true;
      Audio2.applyVolume();
      if (App.g) Audio2.setPlanet(App.g.run.planet);
    } catch (e) { Audio2.ctx = null; }
  },
  applyVolume() {
    if (!Audio2.ctx) return;
    const s = App.settings;
    const t = Audio2.ctx.currentTime;
    Audio2.master.gain.setTargetAtTime(s.sound ? 1 : 0, t, 0.05);
    Audio2.sfx.gain.setTargetAtTime(s.volume, t, 0.05);
    Audio2.music.gain.setTargetAtTime(s.music * 0.5, t, 0.3);
  },
  ok(name, gap = 0.04) {
    if (!Audio2.ctx || !App.settings.sound) return false;
    const now = Audio2.ctx.currentTime;
    if (Audio2.lastPlay[name] && now - Audio2.lastPlay[name] < gap) return false;
    Audio2.lastPlay[name] = now;
    return true;
  },
  tone(freq, dur, type = 'sine', vol = 0.2, opts = {}) {
    const ctx = Audio2.ctx;
    const t = ctx.currentTime + (opts.delay || 0);
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slide), t + dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + (opts.attack || 0.005));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(opts.dest || Audio2.sfx);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, opts = {}) {
    const ctx = Audio2.ctx;
    const t = ctx.currentTime + (opts.delay || 0);
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = opts.filter || 'lowpass';
    f.frequency.setValueAtTime(opts.f0 || 1200, t);
    if (opts.f1) f.frequency.exponentialRampToValueAtTime(opts.f1, t + dur);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + (opts.attack || 0.01));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(gn); gn.connect(Audio2.sfx);
    src.start(t); src.stop(t + dur + 0.02);
  },
  play(name, arg) {
    if (!Audio2.ok(name, name === 'sell' ? 0.08 : 0.04)) return;
    switch (name) {
      case 'click': Audio2.tone(880, 0.05, 'triangle', 0.08); break;
      case 'open': Audio2.tone(520, 0.08, 'sine', 0.08); Audio2.tone(780, 0.1, 'sine', 0.06, { delay: 0.05 }); break;
      case 'build': Audio2.tone(140, 0.16, 'square', 0.12, { slide: 70 }); Audio2.noise(0.12, 0.12, { f0: 900, f1: 200 }); break;
      case 'belt': Audio2.tone(320, 0.05, 'triangle', 0.06); break;
      case 'remove': Audio2.tone(300, 0.18, 'sawtooth', 0.08, { slide: 90 }); break;
      case 'error': Audio2.tone(180, 0.14, 'square', 0.08); Audio2.tone(140, 0.16, 'square', 0.07, { delay: 0.08 }); break;
      case 'sell': {
        const base = 1046 * Math.pow(1.12, arg || 0);
        Audio2.tone(base, 0.12, 'triangle', 0.09); Audio2.tone(base * 1.5, 0.18, 'sine', 0.07, { delay: 0.06 });
        break;
      }
      case 'coin': Audio2.tone(1568, 0.08, 'square', 0.05); Audio2.tone(2093, 0.12, 'square', 0.04, { delay: 0.05 }); break;
      case 'scan': Audio2.tone(300, 0.9, 'sine', 0.12, { slide: 1400, attack: 0.02 }); Audio2.tone(1400, 0.25, 'sine', 0.05, { delay: 0.6 }); break;
      case 'found': [660, 880, 1320].forEach((f, i) => Audio2.tone(f, 0.18, 'triangle', 0.08, { delay: i * 0.08 })); break;
      case 'event': [523, 659, 784, 1046].forEach((f, i) => Audio2.tone(f, 0.22, 'triangle', 0.08, { delay: i * 0.09 })); break;
      case 'unlock': [392, 523, 659, 784, 1046].forEach((f, i) => Audio2.tone(f, 0.3, 'sine', 0.09, { delay: i * 0.07 })); break;
      case 'upgrade': Audio2.tone(440, 0.1, 'triangle', 0.08); Audio2.tone(660, 0.14, 'triangle', 0.08, { delay: 0.07 }); Audio2.tone(990, 0.16, 'triangle', 0.07, { delay: 0.14 }); break;
      case 'rebirth': Audio2.noise(2.4, 0.25, { f0: 200, f1: 6000, attack: 0.8 }); Audio2.tone(60, 2.5, 'sawtooth', 0.12, { slide: 600, attack: 0.5 }); break;
      case 'land': Audio2.noise(1.2, 0.2, { f0: 3000, f1: 150 }); break;
      case 'warn': Audio2.tone(620, 0.1, 'square', 0.05); Audio2.tone(620, 0.1, 'square', 0.05, { delay: 0.16 }); break;
      case 'horn': Audio2.tone(310, 0.35, 'sawtooth', 0.06); Audio2.tone(370, 0.35, 'sawtooth', 0.05); break;
    }
  },
  // Ambient drone per planet: two detuned oscillators through a slowly moving filter.
  setPlanet(k) {
    if (!Audio2.ctx) return;
    const ctx = Audio2.ctx;
    if (Audio2.drone) { const d = Audio2.drone; d.gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.5); setTimeout(() => { try { d.nodes.forEach(n => n.stop()); } catch (e) { /* stopped */ } }, 2000); }
    const roots = [55, 61.7, 73.4, 49, 65.4, 82.4, 69.3, 41.2];
    const root = roots[(k - 1) % roots.length] * (k > 8 ? Math.pow(1.06, k % 5) : 1);
    const gain = ctx.createGain(); gain.gain.value = 0.0001;
    const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 420; filt.Q.value = 6;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + (k % 3) * 0.02;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 260;
    lfo.connect(lfoGain); lfoGain.connect(filt.frequency);
    const nodes = [lfo];
    [[root, 'sawtooth', 0.5], [root * 1.004, 'sawtooth', 0.5], [root * 1.5, 'triangle', 0.35], [root * 2.01, 'sine', 0.25]].forEach(([f, type, v]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
      const gg = ctx.createGain(); gg.gain.value = v;
      o.connect(gg); gg.connect(filt); o.start(); nodes.push(o);
    });
    filt.connect(gain); gain.connect(Audio2.music);
    lfo.start();
    gain.gain.setTargetAtTime(0.08, ctx.currentTime, 2);
    Audio2.drone = { gain, nodes };
  }
};

const Col = {
  cache: new Map(),
  rgb(hex) {
    let c = Col.cache.get(hex);
    if (c) return c;
    const s = hex.replace('#', '');
    const n = parseInt(s.length === 3 ? s.split('').map(x => x + x).join('') : s, 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    Col.cache.set(hex, c);
    return c;
  },
  hex(r, g, b) { return '#' + [r, g, b].map(v => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); },
  mix(a, b, t) { const A = Col.rgb(a), B = Col.rgb(b); return Col.hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); },
  shade(hex, f) { return f >= 0 ? Col.mix(hex, '#ffffff', f) : Col.mix(hex, '#000000', -f); },
  rgba(hex, a) { const c = Col.rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; },
  hsl(h, s, l) { return 'hsl(' + (h % 360) + ',' + s + '%,' + l + '%)'; },
  // Hex colour (not an hsl() string) so it can be mixed and shaded like every other colour.
  hslHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return Col.hex(f(0) * 255, f(8) * 255, f(4) * 255);
  },
  prism(t, off = 0) { return Col.hslHex(Math.round(((t * 90 + off) % 360 + 360) % 360), 90, 72); }
};

const Sprites = {
  glows: new Map(),
  // Radial glow sprite (64px) in a given colour.
  glow(color) {
    let c = Sprites.glows.get(color);
    if (c) return c;
    c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, Col.rgba(color, 0.9));
    gr.addColorStop(0.35, Col.rgba(color, 0.45));
    gr.addColorStop(1, Col.rgba(color, 0));
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    if (Sprites.glows.size > 400) Sprites.glows.clear();
    Sprites.glows.set(color, c);
    return c;
  },
  // Item sprite at a medium size (used by older call sites).
  item(res, ref) { return ItemArt.sprite(res, ref, 64); },
  // Draws an item centred at 0,0 in the current transform with object radius ~r.
  drawItem(ctx, res, ref, r, t = 0) {
    const m = ctx.getTransform();
    const scale = Math.hypot(m.a, m.b) || 1;
    const ext = r * 1.6;
    const px = ItemArt.sizeFor(ext * 2 * scale);
    const frame = Math.floor(((t || App.now / 1000) * 2)) & 7;
    ctx.drawImage(ItemArt.sprite(res, ref, px, 0, frame), -ext, -ext, ext * 2, ext * 2);
  },
  // Small canvas for DOM usage (codex, panels). Unknown items show a dark silhouette.
  itemCanvas(res, ref, size = 40, unknown = false) {
    const c = document.createElement('canvas');
    const d = Math.min(2, window.devicePixelRatio || 1);
    const px = Math.round(size * d);
    c.width = c.height = px;
    const x = c.getContext('2d');
    const spr = ItemArt.sprite(res, ref, ItemArt.sizeFor(px));
    if (unknown) {
      x.drawImage(spr, 0, 0, px, px);
      x.globalCompositeOperation = 'source-in';
      x.fillStyle = '#3a3340'; x.fillRect(0, 0, px, px);
      x.globalCompositeOperation = 'source-over';
      x.fillStyle = '#a99fa6'; x.font = 'bold ' + Math.round(px * 0.34) + 'px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('?', px / 2, px / 2 + 1);
    } else x.drawImage(spr, 0, 0, px, px);
    return c;
  }
};

// ===== src/app/02a_art.js =====
// =====================================================================
// Art: central art direction (light, palettes, tones, materials, easing,
// 2.5D primitives, LRU sprite cache). Everything visual builds on this.
// =====================================================================
const Art = {
  // Global light from the top left (screen space, normalised)
  LX: -0.62, LY: -0.78,
  V: 0.55,            // vertical projection: 1 tile of height = 0.55 tiles upwards on screen
  SHADOW: [0.55, 0.38], // cast shadow direction per tile of height (towards bottom right)

  // Global building palette: [light, base, shadow]
  PAL: {
    orange:   ['#ffb46e', '#f0842f', '#a9521d'],
    rust:     ['#c98a62', '#9a5a3a', '#5e3322'],
    steel:    ['#b6c8da', '#7891ab', '#46596e'],
    teal:     ['#7ae6d6', '#26aa9b', '#13665e'],
    brass:    ['#f6d98f', '#c99d48', '#80612a'],
    anth:     ['#636a79', '#3d4350', '#23272f'],
    warn:     ['#ff8f80', '#e0473a', '#8a2520'],
    concrete: ['#d3ccbf', '#a69e91', '#6f685e'],
    white:    ['#fbfcfe', '#dce1ea', '#a2aab8'],
    gold:     ['#fff0b0', '#f2c14b', '#a3761b'],
    glass:    ['#e6f8ff', '#8fd3f0', '#3f86ab'],
    cloth1:   ['#ff9ab8', '#e0507e', '#8f2a4d'],
    cloth2:   ['#ffe08a', '#f0b43a', '#9a6a14'],
    violet:   ['#c8a0ff', '#8a5ad6', '#4f2f8a'],
    green:    ['#a6f08a', '#4fc25a', '#2a7232']
  },

  tones(hex) {
    return { hi: Col.shade(hex, 0.32), base: hex, lo: Col.shade(hex, -0.32), edge: Col.shade(hex, -0.62), rim: Col.shade(hex, 0.55) };
  },
  pal(name) { const p = Art.PAL[name]; return { hi: p[0], base: p[1], lo: p[2], edge: Col.shade(p[2], -0.45), rim: Col.shade(p[0], 0.4) }; },

  // ---------------- easing ----------------
  ease: {
    linear: t => t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inCubic: t => t * t * t,
    inOutQuad: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) * 0.6 + 1,
    // damped spring step 0..1 -> overshoots slightly and settles
    spring: t => 1 - Math.exp(-6 * t) * Math.cos(9 * t)
  },
  clamp01: t => t < 0 ? 0 : t > 1 ? 1 : t,
  // deterministic per-object phase 0..1 so that equal machines never run in sync
  phase(id) { return (RNG.hash(id | 0, 911) % 10000) / 10000; },

  // ---------------- canvas + LRU cache ----------------
  canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; },
  cache: new Map(),
  cacheBytes: 0,
  budget() { return App.touch ? 48e6 : 110e6; },
  tick: 0, // advanced once per frame; hits only stamp the entry (no Map re-ordering on the hot path)
  cached(key, make) {
    let e = Art.cache.get(key);
    if (e) { e.t = Art.tick; return e.v; }
    const v = make();
    const c = v && (v.canvas || v);
    const bytes = c && c.width ? c.width * c.height * 4 : 1000;
    e = { v, bytes, t: Art.tick };
    Art.cache.set(key, e);
    Art.cacheBytes += bytes;
    if (Art.cacheBytes > Art.budget()) {
      const arr = [...Art.cache.entries()].sort((a, b) => a[1].t - b[1].t);
      for (const [k, old] of arr) {
        if (Art.cacheBytes <= Art.budget() * 0.8 || old.t >= Art.tick) break;
        Art.cache.delete(k); Art.cacheBytes -= old.bytes;
      }
    }
    return v;
  },
  clearPlanet() {
    for (const [k, e] of Art.cache) if (k.startsWith('P|')) { Art.cache.delete(k); Art.cacheBytes -= e.bytes; }
  },
  // pick a cache resolution (device px per tile) for a requested scale
  bucket(px, maxB = 128) {
    const B = [12, 16, 24, 32, 48, 64, 96, 128, 192];
    for (const b of B) if (b >= px * 0.92) return Math.min(b, maxB);
    return maxB;
  },

  // ---------------- 2.5D primitives (tile units) ----------------
  // Box on the ground rect (x, y, w, d) with height H. Draws front + top faces.
  box(ctx, x, y, w, d, H, t, o = {}) {
    const hv = H * Art.V;
    const r = o.r || 0;
    // front face
    if (hv > 0.005) {
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, t.base); g.addColorStop(1, t.lo);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x, y + d - hv - r); ctx.lineTo(x + w, y + d - hv - r); ctx.lineTo(x + w, y + d - r);
      ctx.quadraticCurveTo(x + w, y + d, x + w - r, y + d); ctx.lineTo(x + r, y + d); ctx.quadraticCurveTo(x, y + d, x, y + d - r);
      ctx.closePath(); ctx.fill();
      // bottom contact darkening
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x, y + d - Math.min(0.06, hv * 0.3), w, Math.min(0.06, hv * 0.3));
    }
    // top face
    const ty = y - hv;
    const g2 = ctx.createLinearGradient(x, ty, x + w * 0.6, ty + d);
    g2.addColorStop(0, o.topHi || t.hi); g2.addColorStop(1, o.top || t.base);
    ctx.fillStyle = g2;
    Art.rrect(ctx, x, ty, w, d, r); ctx.fill();
    // rim light (top + left) and dark edge (bottom + right)
    const lw = o.lw || 0.035;
    ctx.lineWidth = lw;
    ctx.strokeStyle = Col.rgba(t.rim, 0.75);
    ctx.beginPath(); ctx.moveTo(x + r, ty + lw); ctx.lineTo(x + w - r, ty + lw); ctx.moveTo(x + lw, ty + r); ctx.lineTo(x + lw, ty + d - r); ctx.stroke();
    // outline
    ctx.strokeStyle = t.edge; ctx.lineWidth = o.outline || 0.045;
    ctx.beginPath();
    Art.rrectPath(ctx, x, ty, w, d, r);
    if (hv > 0.005) { ctx.moveTo(x, ty + d - r); ctx.lineTo(x, y + d - r); ctx.moveTo(x + w, ty + d - r); ctx.lineTo(x + w, y + d - r); ctx.moveTo(x + r, y + d); ctx.lineTo(x + w - r, y + d); }
    ctx.stroke();
    return { x, y: ty, w, h: d };
  },
  // Vertical cylinder standing on the ground ellipse centred at (cx, cy).
  cyl(ctx, cx, cy, rx, ry, H, t, o = {}) {
    const hv = H * Art.V;
    const g = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
    g.addColorStop(0, t.hi); g.addColorStop(0.35, t.base); g.addColorStop(1, t.lo);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx - rx, cy - hv); ctx.lineTo(cx - rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rx, cy - hv);
    ctx.closePath(); ctx.fill();
    // bands
    if (o.bands) { ctx.strokeStyle = Col.rgba(t.lo, 0.7); ctx.lineWidth = 0.03; for (let i = 1; i <= o.bands; i++) { const yy = cy - hv * i / (o.bands + 1); ctx.beginPath(); ctx.ellipse(cx, yy, rx, ry, 0, 0, Math.PI); ctx.stroke(); } }
    // top
    const tg = ctx.createLinearGradient(cx - rx, cy - hv - ry, cx + rx, cy - hv + ry);
    tg.addColorStop(0, o.topHi || t.rim); tg.addColorStop(1, o.top || t.base);
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.ellipse(cx, cy - hv, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = t.edge; ctx.lineWidth = o.outline || 0.045;
    ctx.beginPath(); ctx.ellipse(cx, cy - hv, rx, ry, 0, 0, Math.PI * 2);
    ctx.moveTo(cx - rx, cy - hv); ctx.lineTo(cx - rx, cy); ctx.moveTo(cx + rx, cy - hv); ctx.lineTo(cx + rx, cy);
    ctx.moveTo(cx + rx, cy); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI);
    ctx.stroke();
    // specular stripe
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.fillRect(cx - rx * 0.62, cy - hv + ry * 0.2, rx * 0.12, hv);
    return { top: cy - hv };
  },
  dome(ctx, cx, cy, rx, ry, H, t) {
    const hv = H * Art.V;
    const g = ctx.createRadialGradient(cx - rx * 0.35, cy - hv * 0.7, rx * 0.05, cx, cy - hv * 0.3, rx * 1.1);
    g.addColorStop(0, t.rim); g.addColorStop(0.45, t.base); g.addColorStop(1, t.lo);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI); ctx.bezierCurveTo(cx - rx, cy - hv * 1.2, cx + rx, cy - hv * 1.2, cx + rx, cy);
    ctx.fill();
    ctx.strokeStyle = t.edge; ctx.lineWidth = 0.045; ctx.stroke();
  },
  rrectPath(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  },
  rrect(ctx, x, y, w, h, r) { ctx.beginPath(); Art.rrectPath(ctx, x, y, w, h, r); },
  // contact shadow (ambient occlusion) under an object
  contact(ctx, x, y, w, d, a = 0.35) {
    const g = ctx.createRadialGradient(x + w / 2, y + d / 2, Math.min(w, d) * 0.3, x + w / 2, y + d / 2, Math.max(w, d) * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - w * 0.15, y - d * 0.15, w * 1.3, d * 1.3);
  },
  rivets(ctx, pts, r = 0.035, t = Art.pal('steel')) {
    for (const [x, y] of pts) {
      ctx.fillStyle = t.lo; ctx.beginPath(); ctx.arc(x + r * 0.3, y + r * 0.3, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = t.hi; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  },
  hazard(ctx, x, y, w, h) {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = '#f2c230'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#26231f';
    for (let i = -h * 2; i < w + h; i += 0.2) { ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.lineTo(x + i + h + 0.1, y); ctx.lineTo(x + i + 0.1, y + h); ctx.fill(); }
    ctx.restore();
  },
  pipe(ctx, pts, w, t) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = t.edge; ctx.lineWidth = w + 0.05; Art.polyline(ctx, pts); ctx.stroke();
    ctx.strokeStyle = t.base; ctx.lineWidth = w; Art.polyline(ctx, pts); ctx.stroke();
    ctx.strokeStyle = Col.rgba(t.rim, 0.6); ctx.lineWidth = w * 0.3; ctx.save(); ctx.translate(-w * 0.18, -w * 0.18); Art.polyline(ctx, pts); ctx.stroke(); ctx.restore();
  },
  polyline(ctx, pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); },
  poly(ctx, pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); },
  light(ctx, x, y, r, color, a = 1) {
    ctx.fillStyle = Col.rgba(color, 0.35 * a); ctx.beginPath(); ctx.arc(x, y, r * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2); ctx.fill();
  },
  window(ctx, x, y, w, h, lit, color = '#ffd88a') {
    ctx.fillStyle = lit ? color : '#20262f'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = lit ? 'rgba(255,255,255,.45)' : 'rgba(140,170,200,.35)'; ctx.fillRect(x, y, w * 0.35, h);
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 0.025; ctx.strokeRect(x, y, w, h);
  },

  // ---------------- facet helpers for organic shapes ----------------
  // Polygon split into triangles from a centre; each facet lit by its normal.
  facets(ctx, pts, cx, cy, t, o = {}) {
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const mx = (a[0] + b[0]) / 2 - cx, my = (a[1] + b[1]) / 2 - cy;
      const len = Math.hypot(mx, my) || 1;
      const dot = (mx / len) * Art.LX + (my / len) * Art.LY; // -1..1 (1 = facing the light)
      const k = dot > 0.35 ? t.hi : dot > -0.25 ? t.base : t.lo;
      ctx.fillStyle = o.flat ? t.base : k;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.closePath(); ctx.fill();
      if (!o.flat) { ctx.strokeStyle = k; ctx.lineWidth = 0.01; ctx.stroke(); }
    }
    if (o.outline !== false) { ctx.strokeStyle = o.edge || t.edge; ctx.lineWidth = o.lw || 0.08; ctx.lineJoin = 'round'; Art.poly(ctx, pts); ctx.stroke(); }
  },
  // Irregular round polygon around (cx, cy).
  blobPts(rnd, cx, cy, rx, ry, n = 8, jag = 0.25, rot = 0) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = rot + i / n * Math.PI * 2 + (rnd() - 0.5) * 0.4;
      const k = 1 - jag / 2 + rnd() * jag;
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    return pts;
  },
  smoothPath(ctx, pts) {
    const n = pts.length;
    ctx.beginPath();
    const m0 = [(pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2];
    ctx.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  },
  glint(ctx, x, y, s, color = '#ffffff', a = 1) {
    ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s); ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s);
    ctx.fill();
    ctx.restore();
  }
};

// M (<=52 px), L (bigger). Coordinates: unit radius 1 around (0,0).
// =====================================================================
// [family, variant, cat, c2, c3]   c1 = resource colour from DATA
const ITEM_SPECS = [
  // ---- Gewöhnlich ----

  ['flakes', 0, 'powder', '#2a2a2e'],            // Ascheflocken
  ['rhomb', 1, 'gem', '#b1a184'],                // Dolomit

const ItemArt = {
  // s[5] (optional) overrides the drawing colour only (DATA colour stays the UI colour)
  spec(res) { const s = ITEM_SPECS[res] || ['rock', 0, 'stone']; return { fam: s[0], v: s[1], cat: s[2], c1: s[5] || DATA.RESOURCES[res].color, c2: s[3] || Col.shade(DATA.RESOURCES[res].color, -0.4), c3: s[4] || Col.shade(DATA.RESOURCES[res].color, 0.4), tier: DATA.RESOURCES[res].tier, res }; },
  T(hex) { return { hi: Col.shade(hex, 0.35), base: hex, lo: Col.shade(hex, -0.35), edge: Col.shade(hex, -0.7), rim: Col.shade(hex, 0.6) }; },
  lum(hex) { const c = Col.rgb(hex); return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; },

  // ---------------- public API ----------------
  // size bucket in device pixels for a sprite of the given on-screen diameter
  sizeFor(px) { const B = [16, 20, 24, 32, 40, 48, 64, 96, 128, 192, 256]; for (const b of B) if (b >= px) return b; return 256; },
  // rot: -1, 0, 1 (±6° variants for belts); frame: animation frame for prismatic items
  // outline: dark ring, light ring for very dark items or on very dark planet grounds (contrast >= 3:1)
  ringColor(sp) {
    const dark = ItemArt.lum(sp.c1) < 0.13 || sp.fam === 'darkmatter' || sp.fam === 'antimatter';
    if (Render.darkGround || (dark && !Render.lightGround)) return '#c8d2eb';
    return Col.shade(sp.c1, -0.86);
  },
  sprite(res, ref, sizePx, rot = 0, frame = 0) {
    const tier = DATA.RESOURCES[res].tier;
    const f = tier === 7 ? frame & 7 : 0;
    const dg = Render.darkGround ? 1 : Render.lightGround ? 2 : 0;
    return Art.cached('IT|' + res + '|' + ref + '|' + sizePx + '|' + rot + '|' + f + '|' + dg, () => ItemArt.render(res, ref, sizePx, rot, f));
  },
  render(res, ref, S, rot, frame) {
    const sp = ItemArt.spec(res);
    const ppu = S / 2.7;
    const simple = S <= 26, medium = S <= 52;
    const o = { simple, medium, ppu, lw: Math.max(0.05, 1.3 / ppu), t: frame / 2, ref };
    // object layer
    const O = Art.canvas(S, S), ox = O.getContext('2d');
    ox.translate(S / 2, S / 2); ox.scale(ppu, ppu);
    if (rot) { ox.translate(0, 0.2); ox.rotate(rot * 0.105); ox.translate(0, -0.2); }
    ItemArt.drawObject(ox, sp, ref, o);
    // final sprite: rarity backdrop, contact shadow, outline ring, object
    const c = Art.canvas(S, S), x = c.getContext('2d');
    x.save(); x.translate(S / 2, S / 2); x.scale(ppu, ppu);
    ItemArt.backdrop(x, sp, o);
    const floating = sp.tier >= 5 && sp.cat === 'special';
    x.fillStyle = 'rgba(0,0,0,' + (floating ? 0.22 : 0.38) + ')';
    x.beginPath(); x.ellipse(0.04, 0.9, floating ? 0.42 : 0.66, floating ? 0.1 : 0.16, 0, 0, Math.PI * 2); x.fill();
    x.restore();

    const ring = Art.canvas(S, S), rx = ring.getContext('2d');
    rx.drawImage(O, 0, 0); rx.globalCompositeOperation = 'source-in';
    const rc = ItemArt.ringColor(sp);
    const w = Math.max(1, simple ? 1.6 : 1.3) * (S >= 96 ? S / 64 : 1);
    // light halo outside a dark outline: keeps >= 3:1 contrast on mid-bright and dark grounds
    {
      rx.fillStyle = rc === '#c8d2eb' ? '#0c0a12' : '#fff4e2'; rx.fillRect(0, 0, S, S);
      x.globalAlpha = 0.7;
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.drawImage(ring, Math.cos(a) * w * 2, Math.sin(a) * w * 2); }
      x.globalAlpha = 1;
    }
    rx.fillStyle = rc; rx.fillRect(0, 0, S, S);
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.drawImage(ring, Math.cos(a) * w, Math.sin(a) * w); }
    x.drawImage(O, 0, 0);

    x.save(); x.translate(S / 2, S / 2); x.scale(ppu, ppu);

    x.restore();

  // Draws behind the object: tier glows, fans, auras
  backdrop(x, sp, o) {
    const t = sp.tier;

      x.drawImage(Sprites.glow(col), -1.25, -1.25, 2.5, 2.5);
      x.globalAlpha = 1;
    }
    if (t >= 4 && !o.simple) {
      x.globalAlpha = t === 4 ? 0.45 : 0.3;
      x.drawImage(FxLib.tinted('fan', 0, t === 4 ? '#ffd76a' : t === 7 ? Col.prism(o.t, 90) : DATA.TIERS[t].color), -1.3, -1.45, 2.6, 2.6);

    }
    if (t === 6 && !o.simple) { x.strokeStyle = Col.rgba('#2ef2e0', 0.5); x.lineWidth = 0.05; x.beginPath(); x.ellipse(0, 0.05, 1.05, 0.38, -0.25, 0, Math.PI * 2); x.stroke(); }
  },
  foreground(x, sp, o, ref) {
    if (o.simple) return;
    if (ref >= 3) { Art.glint(x, -0.45, -0.55, 0.2); Art.glint(x, 0.55, -0.2, 0.12); Art.glint(x, 0.2, 0.45, 0.09); }
    if (sp.tier === 7) { Art.glint(x, 0.5, -0.62, 0.32, '#ffffff'); }
    else if (sp.tier >= 4) Art.glint(x, 0.48, -0.55, 0.16, sp.tier === 4 ? '#fff1b0' : '#ffffff');
  },

  // Object with refinement stage
  drawObject(x, sp, ref, o) {
    if (ref === 0) { ItemArt.raw(x, sp, o); return; }
    const mounted = ref >= 2;
    if (mounted) ItemArt.mount(x, ref === 3 ? 'gold' : 'silver', o, true);
    x.save();
    if (mounted) { x.translate(0, -0.12); x.scale(0.8, 0.8); }
    ItemArt.refined(x, sp, o, ref);
    x.restore();
    if (mounted) ItemArt.mount(x, ref === 3 ? 'gold' : 'silver', o, false);
  },
  // setting: pedestal behind (back=true) and prongs in front
  mount(x, kind, o, back) {

    if (back) {
      // pedestal
      const g = x.createLinearGradient(-0.55, 0, 0.55, 0); g.addColorStop(0, T.hi); g.addColorStop(0.5, T.base); g.addColorStop(1, T.lo);
      x.fillStyle = g;
      x.beginPath(); x.moveTo(-0.55, 0.6); x.lineTo(0.55, 0.6); x.lineTo(0.42, 0.82); x.lineTo(-0.42, 0.82); x.closePath(); x.fill();
      x.fillStyle = T.hi; x.beginPath(); x.ellipse(0, 0.6, 0.55, 0.12, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = T.edge; x.lineWidth = o.lw; x.stroke();

      x.strokeStyle = T.base; x.lineWidth = 0.11; x.lineCap = 'round';
      x.beginPath(); x.moveTo(-0.35, 0.55); x.quadraticCurveTo(-0.78, 0.2, -0.62, -0.35); x.moveTo(0.35, 0.55); x.quadraticCurveTo(0.78, 0.2, 0.62, -0.35); x.stroke();
      if (!o.simple) { x.strokeStyle = T.rim; x.lineWidth = 0.035; x.beginPath(); x.moveTo(-0.38, 0.5); x.quadraticCurveTo(-0.74, 0.2, -0.6, -0.3); x.stroke(); }

      if (kind === 'gold' && !o.simple) { x.fillStyle = '#ff5a7a'; x.beginPath(); x.arc(0, 0.71, 0.06, 0, Math.PI * 2); x.fill(); }
    }
  },

  // ---------------- raw painters ----------------
  raw(x, sp, o) {
    const rnd = RNG.mulberry32(RNG.hash(sp.res, 4711));
    const f = ItemArt.P[sp.fam] || ItemArt.P.rock;
    f(x, sp, rnd, o);
  },
  P: {
    rock(x, sp, rnd, o) {
      const t = ItemArt.T(sp.c1);
      const v = sp.v;
      let pts;
      if (v === 1) pts = [[-0.72, -0.12], [-0.45, -0.5], [0.35, -0.55], [0.75, -0.2], [0.7, 0.45], [0.2, 0.62], [-0.55, 0.55], [-0.78, 0.2]];
      else if (v === 5) pts = [[-0.85, 0.1], [-0.35, -0.35], [0.5, -0.45], [0.88, -0.05], [0.45, 0.42], [-0.4, 0.5]];
      else pts = Art.blobPts(rnd, 0, 0.05, v === 4 ? 0.72 : 0.78, v === 3 ? 0.66 : 0.62, v === 4 ? 10 : 7, v === 4 ? 0.12 : 0.32);

      else Art.facets(x, pts, -0.12, -0.1, t, { lw: o.lw * 0.6 });
      if (o.simple) return;

      } else if (v === 3) { // pumice pores
        for (let i = 0; i < 16; i++) { const px = (rnd() - 0.5) * 1.2, py = (rnd() - 0.5) * 0.9; if (px * px / 0.5 + py * py / 0.3 > 0.8) continue; x.fillStyle = Col.rgba(sp.c2, 0.9); x.beginPath(); x.arc(px, py, 0.035 + rnd() * 0.05, 0, Math.PI * 2); x.fill(); }
      } else if (v === 4) { // gypsum fibres

      } else { for (let i = 0; i < 10; i++) { x.fillStyle = Col.rgba(rnd() < 0.5 ? t.lo : t.hi, 0.6); x.fillRect((rnd() - 0.5) * 1.1, (rnd() - 0.4) * 0.8, 0.05, 0.05); } }
    },
    slate(x, sp, rnd, o) {

    },
    gravel(x, sp, rnd, o) {
      const n = sp.v === 0 ? 4 : 5;
      const pos = sp.v === 0 ? [[-0.4, 0.3, 0.38], [0.35, 0.32, 0.36], [-0.05, -0.2, 0.42], [0.5, -0.25, 0.25]] : [[-0.5, 0.35, 0.3], [0.1, 0.4, 0.33], [0.55, 0.15, 0.28], [-0.25, -0.15, 0.34], [0.3, -0.35, 0.3]];
      for (let i = 0; i < n; i++) {

        const pts = Art.blobPts(rnd, px, py, r, r * 0.8, sp.v === 0 ? 8 : 5, sp.v === 0 ? 0.15 : 0.4);
        if (sp.v === 0) { x.fillStyle = tt.base; Art.smoothPath(x, pts); x.fill(); x.strokeStyle = tt.edge; x.lineWidth = o.lw * 0.6; x.stroke(); x.fillStyle = Col.rgba(tt.hi, 0.8); x.beginPath(); x.ellipse(px - r * 0.3, py - r * 0.35, r * 0.35, r * 0.2, -0.5, 0, Math.PI * 2); x.fill(); }

    },
    powder(x, sp, rnd, o) {

    },
    sand(x, sp, rnd, o) {
      const t = ItemArt.T(sp.c1);
      x.beginPath(); x.moveTo(-0.95, 0.62); x.bezierCurveTo(-0.7, 0.05, -0.2, -0.05, 0.1, 0.05); x.bezierCurveTo(0.45, -0.1, 0.8, 0.2, 0.95, 0.62); x.ellipse(0, 0.62, 0.95, 0.15, 0, 0, Math.PI); x.closePath();

      x.strokeStyle = Col.rgba(t.lo, 0.7); x.lineWidth = 0.035; for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(-0.8, 0.2 + i * 0.12); x.bezierCurveTo(-0.3, 0.12 + i * 0.12, 0.2, 0.3 + i * 0.1, 0.85, 0.2 + i * 0.12); x.stroke(); }

    }

        } else ItemArt.vial(x, Col.shade(sp.c1, -0.15), Col.shade(sp.c1, 0.35), o, 0.62);

      }
      case 'salt': {

        }
      }

  }
};

// ===== src/app/02c_fxlib.js =====
// =====================================================================
// FxLib: pre-rendered effect sprites (particles, coins, flames, rings, bolts)
// All sprites are generated once and reused from the cache.
// =====================================================================
const FxLib = {
  S: 64,
  VARIANTS: { soft: 1, spark: 1, glint4: 1, glint8: 1, fan: 1, beam: 1, ring: 1, ringThick: 1, impact: 1, radar: 1, bolt: 3, steam: 3, smoke: 3, dust: 3, ash: 1, confetti: 1, spore: 1, snow: 1, coin: 8, flame: 4, fire: 1, crack: 1 },
  get(name, v = 0) { return Art.cached('FX|' + name + '|' + v, () => FxLib.make(name, v)); },
  make(name, v) {
    const big = name === 'fan' || name === 'radar' || name === 'ring' || name === 'ringThick' || name === 'beam' || name === 'impact';
    const S = big ? 128 : FxLib.S;
    const c = Art.canvas(S, S), x = c.getContext('2d');
    const h = S / 2;
    const rnd = RNG.mulberry32(RNG.hashString(name) + v * 7919);
    x.translate(h, h);
    switch (name) {
      case 'soft': { const g = x.createRadialGradient(0, 0, 0, 0, 0, h); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(-h, -h, S, S); break; }
      case 'spark': {
        const g = x.createRadialGradient(0, 0, 0, 0, 0, h * 0.5); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = g; x.fillRect(-h, -h, S, S);
        x.fillStyle = '#fff'; x.beginPath(); x.ellipse(0, 0, h * 0.9, h * 0.08, 0, 0, Math.PI * 2); x.fill();
        break;
      }
      case 'glint4': case 'glint8': {
        const n = name === 'glint8' ? 8 : 4;
        const g = x.createRadialGradient(0, 0, 0, 0, 0, h * 0.35); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = g; x.fillRect(-h, -h, S, S);
        x.fillStyle = '#fff';
        for (let i = 0; i < n; i++) { x.save(); x.rotate(i * Math.PI * 2 / n); const L = (i % 2 && n === 8) ? h * 0.55 : h * 0.95; x.beginPath(); x.moveTo(0, -L); x.lineTo(h * 0.05, 0); x.lineTo(0, L * 0.02); x.lineTo(-h * 0.05, 0); x.fill(); x.restore(); }
        break;
      }
      case 'fan': {
        for (let i = 0; i < 9; i++) {
          const a = -Math.PI / 2 + (i - 4) * 0.22 + (rnd() - 0.5) * 0.08;
          const g = x.createLinearGradient(0, 0, Math.cos(a) * h, Math.sin(a) * h);
          g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
          x.fillStyle = g; x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a - 0.05) * h, Math.sin(a - 0.05) * h); x.lineTo(Math.cos(a + 0.05) * h, Math.sin(a + 0.05) * h); x.fill();
        }
        break;
      }
      case 'beam': {
        const g = x.createLinearGradient(0, h, 0, -h); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.6, 'rgba(255,255,255,.25)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = g; x.beginPath(); x.moveTo(-h * 0.22, h); x.lineTo(h * 0.22, h); x.lineTo(h * 0.08, -h); x.lineTo(-h * 0.08, -h); x.fill();
        break;
      }
      case 'ring': case 'ringThick': {
        x.strokeStyle = '#fff'; x.lineWidth = name === 'ring' ? S * 0.025 : S * 0.07;
        x.beginPath(); x.arc(0, 0, h * 0.9, 0, Math.PI * 2); x.stroke();
        x.globalAlpha = 0.35; x.lineWidth *= 2.5; x.stroke();
        break;
      }
      case 'impact': {
        const g = x.createRadialGradient(0, 0, h * 0.55, 0, 0, h); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.75, 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = g; x.scale(1, 0.5); x.beginPath(); x.arc(0, 0, h, 0, Math.PI * 2); x.fill();
        break;
      }
      case 'radar': {
        const g = x.createConicGradient ? x.createConicGradient(-Math.PI / 2, 0, 0) : null;
        if (g) { g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(0.14, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; }
        else x.fillStyle = 'rgba(255,255,255,.3)';
        x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, h, -Math.PI / 2, -Math.PI / 2 + Math.PI * 0.28); x.closePath(); x.fill();
        x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -h); x.stroke();
        break;
      }
      case 'bolt': {
        x.strokeStyle = '#fff'; x.lineCap = 'round'; x.lineJoin = 'round';
        const pts = [[-h * 0.9, (rnd() - 0.5) * h * 0.3]];
        for (let i = 1; i <= 7; i++) pts.push([-h * 0.9 + i * h * 1.8 / 7, (rnd() - 0.5) * h * 0.7]);
        x.lineWidth = S * 0.08; x.globalAlpha = 0.35; Art.polyline(x, pts); x.stroke();
        x.lineWidth = S * 0.03; x.globalAlpha = 1; Art.polyline(x, pts); x.stroke();
        break;
      }
      case 'steam': case 'smoke': case 'dust': {
        const n = 6 + Math.floor(rnd() * 4);
        for (let i = 0; i < n; i++) {
          const px = (rnd() - 0.5) * h * 0.9, py = (rnd() - 0.5) * h * 0.7, r = h * (0.25 + rnd() * 0.3);
          const g = x.createRadialGradient(px, py, 0, px, py, r);
          const a = name === 'steam' ? 0.55 : name === 'smoke' ? 0.5 : 0.45;
          g.addColorStop(0, 'rgba(255,255,255,' + a + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
          x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.fill();
        }
        break;
      }
      case 'ash': { x.fillStyle = '#fff'; x.rotate(rnd() * 3); x.beginPath(); x.moveTo(-h * 0.4, -h * 0.1); x.lineTo(h * 0.2, -h * 0.35); x.lineTo(h * 0.45, h * 0.1); x.lineTo(-h * 0.1, h * 0.3); x.fill(); break; }
      case 'confetti': { x.fillStyle = '#fff'; x.rotate(rnd() * 3); x.fillRect(-h * 0.45, -h * 0.18, h * 0.9, h * 0.36); break; }
      case 'spore': { const g = x.createRadialGradient(0, 0, 0, 0, 0, h * 0.6); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,255,255,.6)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(-h, -h, S, S); break; }
      case 'snow': {
        x.strokeStyle = '#fff'; x.lineWidth = S * 0.06; x.lineCap = 'round';
        for (let i = 0; i < 6; i++) { x.save(); x.rotate(i * Math.PI / 3); x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -h * 0.8); x.moveTo(0, -h * 0.45); x.lineTo(h * 0.2, -h * 0.62); x.moveTo(0, -h * 0.45); x.lineTo(-h * 0.2, -h * 0.62); x.stroke(); x.restore(); }
        break;
      }
      case 'coin': {
        // v = spin frame 0..7: horizontal squash shows the rotation
        const k = Math.abs(Math.cos(v / 8 * Math.PI));
        const w = h * 0.8 * Math.max(0.12, k);
        x.fillStyle = '#9a6406'; x.beginPath(); x.ellipse(h * 0.06, h * 0.04, w, h * 0.8, 0, 0, Math.PI * 2); x.fill();
        const g = x.createLinearGradient(-w, -h * 0.8, w, h * 0.8); g.addColorStop(0, '#fff3b8'); g.addColorStop(0.45, '#f7c946'); g.addColorStop(1, '#c4870f');
        x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, w, h * 0.8, 0, 0, Math.PI * 2); x.fill();
        if (k > 0.35) { x.strokeStyle = 'rgba(150,95,5,.85)'; x.lineWidth = S * 0.04; x.beginPath(); x.ellipse(0, 0, w * 0.68, h * 0.55, 0, 0, Math.PI * 2); x.stroke(); x.fillStyle = 'rgba(150,95,5,.85)'; x.fillRect(-w * 0.12, -h * 0.3, w * 0.24, h * 0.6); }
        x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.ellipse(-w * 0.35, -h * 0.35, w * 0.18, h * 0.16, 0, 0, Math.PI * 2); x.fill();
        break;
      }
      case 'flame': {
        // v = flicker frame 0..3; flame points downwards (engine exhaust)
        const L = h * (0.75 + 0.2 * Math.sin(v * 2.1));
        const g = x.createLinearGradient(0, -h * 0.5, 0, L);
        g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(160,220,255,.95)'); g.addColorStop(0.6, 'rgba(120,160,255,.55)'); g.addColorStop(1, 'rgba(120,160,255,0)');

      case 'fire': {

        g.addColorStop(0, 'rgba(255,255,220,1)'); g.addColorStop(0.3, 'rgba(255,190,60,.95)'); g.addColorStop(0.7, 'rgba(255,90,30,.6)'); g.addColorStop(1, 'rgba(255,60,20,0)');

        x.beginPath(); x.moveTo(-h * 0.35, h * 0.6); x.quadraticCurveTo(-h * 0.45, -L * 0.2, (rnd() - 0.5) * h * 0.2, -L); x.quadraticCurveTo(h * 0.45, -L * 0.2, h * 0.35, h * 0.6); x.closePath(); x.fill();

    }

  },
  // tinted copy of a white sprite (cached)
  tinted(name, v, color) {

      const src = FxLib.get(name, v);
