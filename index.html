<!doctype html>
<!--
=====================================================================
ARES OUTPOST - DESIGN-ENTSCHEIDUNGEN
=====================================================================
Aufbau
- Eine einzige index.html. Der Quelltext liegt zur Pflege in src/ (core = DOM-frei,
  app = Browser) und wird mit tools/build.js zu dieser Datei zusammengefügt.
  Die Simulation (src/core) läuft ohne DOM auch in Node (tools/core.js) für Tests
  und den Balancing-Bot.
- Feste Simulationsrate 20 Ticks/s (Accumulator), Rendering per rAF mit Interpolation.
- Titel, Währung und Kurzform zentral: GAME_TITLE, CURRENCY_NAME, CURRENCY_SHORT.
- Für Tests/Power-User gibt es window.__AO__ (nur Lesezugriff empfohlen).

Welt
- Landeplatz (16,16) = Mitte von Chunk 0/0. Vorkommen-Cluster bleiben innerhalb
  ihres Chunks (Rand 1 Feld), damit Abfragen nur einen Chunk prüfen müssen.
- Normale Vorkommen halten 30 Felder Abstand zum Landeplatz; der Glücksstart setzt
  dort eigene, garantierte Vorkommen (immer mind. ein großes gewöhnliches).
- Entdeckung (Fog of War) in 8x8-Zellen (16 Bit pro Chunk).
- Gleicher Planet = gleiche Karte (Seed aus Basis-Seed + Planetenindex), damit die
  Planetenwahl beim Rebirth "gezielte Vorkommen" erlaubt.
- Zeichnen relativ zu einem Kamera-Ursprung, damit auch bei ±1.000.000 Feldern
  keine Float-Ungenauigkeit sichtbar wird.

Bauen & Logistik
- Ports: Bänder nehmen von hinten und den Seiten an, geben vorne ab. Lager und
  Raffinerien nehmen an allen Seiten an und geben am vorderen Mittelfeld (Pfeil) ab.
  Extraktoren geben an alle Seiten (wählbar) an Bänder/Lager/Verarbeiter/Verkauf ab.
- Banddurchsatz über Geschwindigkeit/Abstand: Basis 1,0 Felder/s bei 0,5 Abstand
  = 2 Items/s (Verbessert 5, Hochleistung 12, Plasma 30).
- Ladestation wirkt auf die gesamte angrenzende Bandstrecke (Engpass-Prinzip: ein
  nur 3 Felder langer Bonus hätte keinen Effekt auf den Durchsatz).
- Brücke = Start- und Zielfeld, dazwischen bis zu 4 freie Felder.
- Verkaufsgebäude: Regal nimmt gewünschte Items an und darf bis zur Hälfte
  vorab gefüllt werden; angrenzende Lager wirken als Verladerampe (+20 %
  Abfertigung, Kunden kaufen direkt aus dem Lager).
- Verschieben ganzer Auswahlen ist nicht rückgängig machbar (Einzel-Verschieben schon).

Wirtschaft
- Sättigung pro Einheit 0,004/(1+0,3*Rohstoffstufe), geteilt durch die typische
  Besuchsgröße der Kundenstufe (sonst würde ein Frachterbesuch jeden Preis sofort
  auf das Minimum drücken).
- Kundenstufen wünschen nur Rohstoffe bis zu einer Stufe (Aliens: bis Ungewöhnlich,
  Karawanen: bis Selten, Shuttles: bis Episch, Handelsschiffe: bis Legendär,
  Frachter: bis Exotisch), mit 8 % Luxus-Wünschen darüber. Seltene Funde lohnen
  sich dadurch erst mit besseren Kunden, ohne frühe Glücksfunde wertlos zu machen.
- Mehr Verkaufsgebäude desselben Typs teilen sich die Kundschaft (abnehmender
  Ertrag 15 %/10 %/8 %/6 %/5 % je weiterem Gebäude); Alien-Wege und Upgrades
  (+25 % Kundenzulauf je Stufe) erhöhen den Zulauf.
- Verkaufsgebäude-Kosten: Basar 30, Karawanenhof 5 Tsd, Landepad 50 Tsd,
  Orbitalhafen 250 Tsd, Frachterdock 2,5 Mio, Handelsterminal 25 Mio. Auf Planet 1
  (Schwelle 1 Mio) reicht es bis zum Orbitalhafen; Dock und Terminal sind die Ziele
  von Planet 2 (Schwelle 20 Mio) und danach.
- Kunden-Takt und Mengen gegenüber den Startwerten gestreckt (Basar alle 10–17 s,
  Karawane 36–58 s/10–26 Stück, Shuttle 80–115 s/30–80, Handelsschiff 120–180 s/150–360,
  Frachter 240–360 s/700–1700, Verträge unverändert), damit die Zielzeiten passen.
- Start: 100 ET reichen für Basar (30) + Extraktor (40) + 15 Bandfelder (je 2).
- Offline: Erwartungswert-Modell in bis zu 480 Schritten über die echten
  Förderketten (Engpass-Skalierung geteilter Bänder), Durchschnittspreis, keine Events.
- Kunden-Trinkgeld (6 %): kleine Münze am Verkaufsgebäude, Einsammeln per Tippen,
  Darüberlaufen oder Forschung "Auto-Sammeln".

Progression
- Rebirth-Multiplikator nach allen je erhaltenen Punkten; Ausgeben im Shop senkt ihn nicht.
- "Startausrüstung" im Shop = Gratis-Bausatz (Extraktor, Basar, Bänder, später
  Lager, Raffinerie, Labor) statt einer festen Blaupause.
- Forschung braucht ein Labor; mehrere Labore bzw. Laborstufen beschleunigen.
- Kodex: "entdeckt" = mindestens eine Einheit abgebaut, "gesichtet" = gesehen/gescannt.

Bedienung
- Touch: Joystick erscheint dort, wo der Daumen links unten aufsetzt; erstes Tippen
  setzt die Bauvorschau, zweites Tippen (oder ✓) baut; Bänder per Wischgeste;
  Bauleiste klappt nach der Auswahl ein. Long-Press auf Baukarten zeigt Details.
- Desktop: siehe Einstellungen (Tastenbelegung).

Balancing (greedy Bot, echte Simulation, Planet 1, Normalstart)
- Der Bot (Debug-Menü "Balancing-Report", Bot in src/core/11_bot.js) spielt das echte
  Spiel: erkundet und scannt, baut Extraktor-Linien mit BFS-Bandrouting und
  Raffinerieketten, Lager-Hub mit Verkaufsgebäuden, forscht, rüstet auf und kauft
  jeweils die Aktion mit dem besten Umsatzgewinn pro Kosten. Menschliche
  Reaktionszeit: 30 s pro Entscheidung plus Laufwege.
- Finale Messung, 6 Karten (Seeds 1/2/3/6/7/8), Median (Spanne):
    Erster Verkauf        0:20      (0:17–0:30)     Ziel < 3 min
    Erste Raffinerie      16 min    (12–31 min)     Ziel 10–15 min
    Kundenstufe 2         16 min    (13–26 min)     Ziel 15–25 min
    Kundenstufe 4         1:29 h    (1:17–1:38 h)   Ziel 1,5–2 h
    Rebirth möglich       3:46 h    (2:28–5:39 h)   Ziel 3–4 h
  Kontrolle mit 20 Ticks/s: Seed 2 Stufe 2 19 min, Stufe 4 1:28 h, Rebirth 2:30 h;
  Seed 3 Stufe 2 21 min, Stufe 4 1:31 h, Rebirth 2:23 h.
  Die Spanne entsteht durch das Kartenglück (wie weit seltene Vorkommen liegen).
- Planet 2 (nach einem Rebirth mit 1 Punkt, Shop: Verkaufserlös 1): Kundenstufe 4
  nach 1:16 h (Planet 1: 1:38 h), Schwelle 20 Mio nach 2:49 h. Die Schwelle wächst
  ×20 pro Planet, Dock und Terminal tragen das Wachstum auf späteren Planeten.
- Offline-Modell gegen echte Simulation (30 min, Basis mit 1.880 Gebäuden):
  1,12 Mio offline gegenüber 1,28 Mio online (87 %). 8 h Offline-Rechnung mit
  2.000 Gebäuden: rund 30 ms.
- Seltenheitsprüfung: 100.000 Vorkommen, maximale Abweichung 2,8 % (Grenze 10 %).

=====================================================================
GRAFIK-ENTSCHEIDUNGEN (Grafik- und Animations-Upgrade)
=====================================================================
Grundsatz
- Nur Optik und Animation geändert. Spiellogik, Ökonomie, Balancing, Speicherstände
  und Steuerung sind unverändert; alte Spielstände laden. Einzige Berührung des
  Kerns: Items.make setzt das reine Render-Merkmal _born zurück (Spawn-Pop).
- Alles bleibt prozedural (Canvas 2D) in einer index.html, ohne externe Bilder,
  Schriften oder Bibliotheken. Texturen enthalten keine Schrift; Stufen, Zahlen und
  Vertragsanzahl sind UI-Overlays.

Stil
- Flacher Vektorstil, aber 2.5D: Draufsicht im 3/4-Winkel (1 Feld Höhe = 0,55 Feld
  nach oben), Licht von links oben. Jede Fläche hat 3 Töne (hell/basis/dunkel),
  dazu Randlicht und eine aus der Grundfarbe abgeleitete, nie schwarze Kontur.
- Kontaktschatten unter jedem Objekt, Schlagschatten proportional zur Höhe, mit dem
  Tageslauf in Richtung und Länge veränderlich. Alle Schlagschatten eines Frames
  werden als ein einziger Pfad gefüllt (überlappende Schatten werden nicht doppelt
  dunkel).
- Bausteine in src/app/02a_art.js: Paletten, Box/Zylinder/Kuppel mit Facettenlicht,
  Easing-Bibliothek, Phasenversatz je Objekt, LRU-Sprite-Cache mit Speicherbudget
  (Desktop 110 MB, Touch 48 MB), planetenspezifische Einträge (Präfix P|) werden
  beim Planetenwechsel verworfen.

Terrain & Nacht
- Farbzonen pro Planet, Mikrokorn (weltverankert), Krater mit Tiefe in 3 Größen und
  6 Varianten, 12 Felsvarianten, Dünen, Kiesel, Planeten-Requisiten (Planet 1-8 fest,
  ab 9 prozedurale Kombination). Fußspuren und Rover-Spuren verblassen in 15 s.
- Nacht als Multiply-Farbgrading (deutlich dunkler und kühler), danach additive
  Lichter: Gebäudefenster, Laternen mit Lichtkegel, Vorkommen-Glühen, Helmlampe.
  UI-Elemente (Sprechblasen, Status-Badges, Stufen) liegen über dem Grading.
- Bei mittlerem und fernem Zoom (bis 64 px/Feld) werden Gelände, Korn und Deko pro
  (Teil-)Chunk in ein Bild gebacken; animierte Deko-Lichter bleiben live.

Vorkommen
- Organische Blob-Form statt Kacheln, Risse mit Ausblendung, verfärbter Boden.
  Seltenheit steigert das Spektakel: Geröll -> Erzadern -> Kristallspitzen ->
  Cluster mit Innenlicht -> legendäres Flimmern -> kreisende Splitter (mythisch) ->
  Energiekern mit Bögen und Gravitationsringen (exotisch) -> prismatische
  Lichtsäule (exquisit). Ab legendär ein Fernleuchtfeuer.

Items
- 91 eigene Kompositionen in über 14 Familien (Pulver, Kies, Brocken, Platten,
  Nadeln, Geoden, Kristalle, Erze, Nuggets, Opale, Meteoriten ...). Legendär und
  höher folgen dem Namen (z. B. Sternenherz: achtstrahliger Sternkristall mit
  pulsierendem Herzkern, Ewigkeitsprisma: Prisma mit Regenbogenfächer).
- Veredelung als Materialwechsel: roh -> veredelt (Barren / geschliffener Stein /
  Pressblock / Phiole) -> hochveredelt (+ Silberfassung) -> perfekt (Goldfassung,
  Glanz, Funken). LOD: klein <= 26 px vereinfacht, mittel <= 52 px, groß.
- Kontur aus der Alpha-Maske; sehr dunkle Items und alle Items auf sehr dunklen
  Planetenböden (Ignis, Nebulon, Singularis) bekommen eine helle Kontur.

Gebäude
- 4 optische Ausbaustufen: Stufe 1-3 roh/genietet, 4-6 sauberer Stahl mit
  Warnmarkierung, 7-9 Anthrazit + Messing mit Zusatzmodulen, 10 Weiß + Gold mit
  Leuchtkanten. Wechsel der Stufe: 250 ms Überblendung, Funken und Lichtpuls.
- Statischer Körper als Sprite (Typ, Stufe, Drehung, Größe, Auflösung), animierte
  Teile pro Frame darüber: Bohrkopf mit Zustandsautomat (aus -> 0,6 s Anlauf ->
  Lauf mit Vibration -> blockiert -> Auslauf), Ressourcenfenster, Silo-Füllfenster
  mit Welle und Zufluss-Puls, Raffinerie-Oberlicht mit Glut, Fortschritt, Dampf und
  Ausgabe-Puff, drehendes Zahnrad, Lichtbögen, Labor-Schüssel und Hologramm,
  Kräne, Portalkran-Laufkatze, Holo-Globus, wehende Flaggen, Leuchtfeuer-Strahl.
- Verkaufsgebäude klar unterscheidbar: Basar (Stoffdach, Kisten, Lichterkette),
  Karawanenhof (Hof, Kegelzelte, Brunnen), Shuttle-Pad (quadratisch, Eckleuchten,
  Warnmarkierung, kein "H"), Orbitalhafen (Turm, zwei Pads, Kräne), Frachterdock
  (Portalkran, Container, Landebucht), Terminal (Schüssel, Holo; Vertragsanzahl als
  UI-Badge). Deko mindestens doppelt so groß, Wege und Zäune mit Auto-Tiling.
- Kleine runde Status-Badges mit Symbol statt großer Warndreiecke.

Bänder
- Grundplatte, genietete Schienen, Profil läuft mit echter Bandgeschwindigkeit,
  echte Viertelkreis-Kurven (Items folgen dem Bogen), Endkappen, T-Einmündungen.
  Stufen: Gummi / gelbe Metalllamellen / stahlblau mit leuchtenden Pfeilen /
  Plasma mit pulsierendem Pink.
- Items: ±8 % seitlicher und ±6° Drehversatz, Spawn-Pop 0,6 -> 1 in 120 ms,
  "Plopp" beim Abgeben, Zittern bei Stau.
- Performance: bis 64 px/Feld wird die statische Bandebene pro 16x16-Teilchunk
  gecacht (fern 32x32), das bewegte Profil als gebündelter Pfad je Stufe
  gezeichnet; darüber Einzel-Sprites mit voller Animation.

Figuren & Fahrzeuge
- Astronaut: 8-Frame-Lauf vorne/hinten/seitlich, Atmen im Stand, Winken nach
  3 s Leerlauf, Jetpack-Flamme beim Sprint, Fußstaub, Fußspuren; Rover mit
  drehenden Speichen. Sechs Alien-Arten (Glibber, Stelzer, Krabbler, Pilzling,
  Schweber, Steinling) mit 6-Frame-Lauf, Stand, Freude, Ungeduld, Enttäuschung.
  Karawane aus 3-5 Käfer-Rovern mit Ladung und Wimpel. Shuttle, Handelsschiff und
  Frachter mit eigener Silhouette und 4-Phasen-Landung (Anflug, Bremsen mit
  Bodenstaub, Aufsetzen mit Federung, Entladen) und umgekehrtem Start;
  weicher, mit der Höhe skalierender Schatten.
- Sprechblase als UI-Element: Pop mit Überschwinger, Geduldsring, live
  herunterzählende Menge, Stimmungs-Glyphe.

Planeten
- Jede Kugel prozedural aus nahtlosem 3D-Rauschen: Krater, Patina-Seen, Eisrisse,
  Lavaadern (leuchten auf der Nachtseite), Dschungel mit Wolken, Gasbänder mit
  Sturm, Kristallfacetten, Dunkelwelt mit Akkretionsring. Weicher Terminator,
  Atmosphärenrand, Ringe, Monde; dunkle Planeten mit starkem Randlicht. Genutzt
  in Titel, Landung, Rebirth und Planetenwahl.

Effekte & Animation
- Effekt-Bibliothek (src/app/02c_fxlib.js): weicher Punkt, Funke, Glanz 4/8,
  Lichtfächer, Strahl, Ringe dünn/dick, Radar, 3 Blitze, Dampf/Rauch/Staub je 3,
  Asche, Konfetti, Münze (8 Drehframes), Flamme (4), Feuer, Riss-Glühen, Sporen,
  Schneeflocke. Partikel-Pool mit Grenzen 150 / 500 / 1500 (niedrig/mittel/hoch).
- Platzieren 0,9 -> 1,06 -> 1,0 in 220 ms; Abriss mit Staubwolke und Münzen;
  Verkauf als Münzfontäne mit "+X ET"; Scanner mit Wellenring, Radarschwenk und
  gestaffelten Markern (40 ms) mit Überschwinger; Kamera-Dämpfung und weicher Zoom;
  UI: Zähl-Puls, Drücken 0,96, Panels easeOutCubic 200 ms, Toasts mit Feder,
  Banner-Schimmer, Seltenheitsrahmen im Kodex. Rebirth als längere Sequenz
  (Start, Hyperraum-Tunnel, Austrittsblitz, planetenspezifische Ankunft).

Messwerte (Headless-Chromium ohne GPU, 1440x900; Median aus 3 abwechselnden Läufen
alt/neu; JS = Zeit pro Frame im Hauptthread)
    Szenario                         JS vorher -> nachher      FPS vorher -> nachher
    200 Gebäude / 750 Bänder, Z16     3,64 -> 3,14 ms (-14 %)   46,5 -> 55,9
    800 Gebäude / 3000 Bänder, Z14    6,99 -> 6,67 ms (-5 %)    34,0 -> 32,2
    3000 Gebäude / 10000 Bänder, Z10  12,32 -> 9,52 ms (-23 %)  24,1 -> 26,8
    800 / 3000 nah, Z30               3,82 -> 3,78 ms (-1 %)    34,7 -> 40,2
    800 / 3000 sehr nah, Z48          2,27 -> 2,09 ms (-8 %)    52,2 -> 57,0
  Kein Szenario mehr als 10 % langsamer. Ohne GPU rastert Chromium in Software;
  die absoluten FPS sind deshalb niedriger als in einem normalen Browser, der
  Vorher/Nachher-Vergleich ist unter gleichen Bedingungen gemessen.
- Start: erster Frame des Titelbildschirms nach rund 65 ms (vorher 61 ms). Die
  Planetenkugel wird nach dem ersten Bild erzeugt (Platzhalter bis dahin).
- Item-Unterscheidbarkeit (tools/qa-items.js): alle 718 Paare innerhalb gleicher
  Seltenheit bei 24 px und 16 px unterscheidbar (Kriterium: CIEDE2000 >= 12 oder
  Silhouetten-IoU <= 0,75 oder Farbverteilung >= 0,35). Dafür wurden Kieselgur,
  Talkum, Graphit, Chromit, Zinkblende, Kobalterz, Manganknollen, Nickelerz,
  Zinnerz, Azurit, Palladiumerz und Amethystdruse in Form oder Farbe geschärft.
- Kontrast gegen alle drei Bodentöne der 8 Planeten: mindestens 3,4:1 (Kontur,
  Halo oder Itemfarbe).
- Speicher: Sprite-Cache 110 MB (Touch 48 MB), gebackene Gelände- und Bandebenen
  je höchstens 11 Mio. Pixel (Touch 6 Mio.), LRU-verdrängt.
- Regression: alter Spielstand (große Basis) lädt, Offline-Ertrag, Rebirth und
  Import/Export laufen, alle eingebauten Selbsttests grün.

=====================================================================
TERRAIN-ENTSCHEIDUNGEN (Map-Detailtiefe, Hitboxen, Intro)
=====================================================================
Grundsatz
- Gelände ist rein optisch: es blockiert nie, verändert keine Vorkommen, Seltenheiten,
  Glücksstarts, Kundenraten, Preise oder Offline-Werte. Gleicher Seed -> gleiche
  Vorkommen und gleicher Glücksstart (20-Seed-Vergleich gegen den Stand davor).
- Eigene Zufallsströme je Zweck und Zelle (Seed + Zweck + Chunk/Zelle); kein
  Math.random im Gelände. Gleicher Chunk -> bytegleiches Bild, egal in welcher
  Reihenfolge gebacken wird.

Pipeline (src/app/03t_terrain.js, rein funktional, läuft im Worker)
- Höhenfeld in Weltkoordinaten (nahtlos über Chunkgrenzen): Makro-fBm mit
  Domain-Warp, Meso-Hügel, Grate (ridged noise), Tafelberge mit Terrassen, Becken,
  Mikrorelief. Darauf Kraterstempel als Höhenänderung (Schüssel, Wall, Auswurf),
  nicht als Farbstempel.
- Abgeleitete Felder: Hangneigung, Krümmung (AO), Dünenkämme, Kraterwall,
  Schüsselinneres, Mineralhof, Landmarken-Material.
- 6 Materialien mit weichem Splat: Staub, Sand, Kruste, Kies, Fels, Salz/Mineral;
  dazu 4 regionale Farbzonen je Planet. Sättigung gegenüber vorher gesenkt (Ares:
  rostbraun statt Signalorange), Schatten kühl violett-braun, nie schwarz.
- Licht: Hillshade mit Sonne links oben (Azimut 315°, Höhe 40°), weicher
  Schattenwurf durch Marsch zur Sonne, Umgebungsverdeckung aus der Krümmung.
  Entscheidung Sonnenwinkel: ein fester Winkel, gleich wie Gebäude, Figuren,
  Planet im Titel und Lander; ein wandernder Sonnenstand hätte die Schatten der
  gebackenen Chunks gegen die Gebäudeschatten laufen lassen. Tageszeit wirkt über
  Farbgrading und Nachtlichter.
- Dunkle Böden (Nebulon, Singularis, teils Ignis): Multiplikatives Licht ist auf
  fast schwarzer Albedo unsichtbar, darum bekommen sonnenzugewandte Hänge einen
  additiven Lichtanteil (Faktor aus der Bodenhelligkeit) und die Paletten sind
  heller und weiter gespreizt.

Krater
- 8 Profile x 3 Größen, Altersstufen frisch / reif / alt / Geist; Größen nach
  Potenzgesetz (viele kleine, wenige große), Ketten, Sekundärfelder um große
  Krater, Einschlagbecken als Landmarke. Junge Krater schneiden alte (Höhen werden
  gemischt, kein Ring-über-Ring). Auswurf unregelmäßig mit Strahlen, Felsen nur
  dort, wo die Dichte es will, nie in Ringen.

Dünen & Wind
- Querdünen, Sicheldünen, Längsdünen, Sterndünen je nach Region; asymmetrisch
  (flache Luv-, steile Leeseite), Rippel quer zum Wind, regionale Windrichtung je
  Planet, Dünenfelder mit organischen Rändern statt Chunkkanten, Windschatten
  hinter Felsen und Tafelbergen.

Felsen & Requisiten (src/app/03v_rocks.js)
- 4 Größen x 6 Formen (24+), dreitönige Facetten mit Licht links oben, Kontakt-
  schatten, Staubkante, teilweise eingesunken; Kiesel, Cluster nach Dichtefeld
  (Poisson-artig), Grundstreuung je 8x8-Feld, damit kein 400-px-Fenster leer ist.
  Planetenrequisiten: Patina, Eis, Lavagestein, Flora, Pylone, Kristalle,
  Leerensplitter; Wracks und Easter Eggs (Sonde, alter Rover, Antenne, Solartrümmer,
  Flagge, Landerreste).

Landmarken & Spuren
- Becken, trockene Flussläufe/Deltas, Canyonnarbe, Tafelbergfelder, Staubteufel-
  spuren, Kraterketten, Wracks; Mineralhöfe um seltene Vorkommen. Landmarken
  erscheinen nach Entdeckung als Symbol auf der Minikarte.
- Vorkommen sind verankert: abgeflachtes Plateau, Kontaktschatten, Kies-/Staub-
  rand, Verfärbung (Aussehen der Vorkommen selbst unverändert).
- Fußspuren links/rechts (20-40 s, auf Staub schneller verweht), Rover- und
  Alienspuren, Trampelpfade als Abnutzungskarte je Chunk, Baustellenboden und
  Fundamentzonen unter Gebäuden.

Atmosphäre
- Höhendunst beim Herauszoomen, weiche Wolkenschatten (<= 8 %), Staubteufel,
  Sanddrift, Vignette; Nacht mit Emission aus dem Gelände (Lavaadern, Neonfugen,
  Biolumineszenz, Funkeln, Leerenpunkte).

Technik (src/app/03u_terrainsys.js)
- Bis zu 2 Web Worker aus dem eigenen Quelltext (Blob-URL), Ergebnis als
  ImageBitmap; ohne Worker 2-ms-Zeitscheiben im Hauptthread.
- 4 Detailstufen (4/10/20/34 px pro Feld), grobe Stufe zuerst, Überblendung
  180 ms, Vorausladen in Laufrichtung, LRU-Budget 190 MB (Touch 110 MB).
- Bis 24 px pro Feld werden Felsen in das Chunkbild komponiert, darüber live und
  scharf gezeichnet.

Tiefensortierung & Hitboxen (src/app/04d_sort.js, src/core/04c_collide.js)
- CONFIG.collision je Typ: none / footprint (Einzug 0,1) / custom. Bänder,
  Brücken, Splitter, Merger, Kreuzungen, Wege, Lampen, Flaggen, Leuchtfeuer, Zäune
  begehbar; Basar nur Körper, Kundenstreifen vorne frei und mit der Drehung
  wandernd; Karawane, Shuttle-Pad, Hafen, Dock: nur massive Teile.
- Sortierung nach Fußlinie, große Stationen in Bodenplatte + hohe Teile zerlegt,
  Röntgen-Ausblendung (40-55 %, 150 ms) wenn der Astronaut verdeckt ist.
- Spieler als Kreis r 0,28 (Rover 0,45), Gleiten an Kanten, Teilschritte,
  Räumliche Abfrage über das Belegungsraster. Wird auf den Spieler gebaut, wird er
  sanft herausgeschoben; nach 1,5 s Feststecken Befreiung mit Hinweis.
  Landezonen schieben weich weg (Hupe + Markierung). Kundenwege per A* um
  Hitboxen (Alienpfade bevorzugt), sonst erscheinen Kunden am Stand.
- Wirkt nur auf Bewegung. Einkommen identisch (siehe Messwerte).

Intro (src/app/15_intro.js, 14b_planetcore.js, 14c_lander.js)
- Läuft nur bei einem echten neuen Spiel. Weiterspielen/Neuladen zeigen es nie.
  Spielstände bekommen nur optionale Felder (introSeen, luckyRevealSeen,
  landerSite); alte Stände laden unverändert. Simulation pausiert während des
  Intros; Glücksstart-Ergebnis und Seeds bleiben unberührt.
- Titel: Wortmarke ARES OUTPOST mit warmem Verlauf, Außenposten-Piktogramm (kein
  Saturn-Symbol), eine Primärtaste (orange, >= 56 x 280 px), Ghost-Tasten,
  Planet unter dem Textblock (nie überlappend), >= 1,5-fache Breite bzw. 2048 px,
  im Worker gebacken (Vorstufe 1024, dann 2048 + Feinkorn), dreht ~4°/min,

.spark { width: 100%; height: 48px; display: block; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.05); cursor: pointer; font-size: 13px; }

select.sel { min-height: 40px; border-radius: 10px; background: #241c2a; color: var(--text); border: 1px solid var(--line-strong); padding: 6px 10px; max-width: 100%; }

/* ---------- modal / menus ---------- */
#modal-root { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.modal-back { position: absolute; inset: 0; background: rgba(6, 3, 8, .62); pointer-events: auto; animation: fade-in 180ms var(--ease); display: grid; place-items: center; padding: calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal)); }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal { width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; animation: pop-in 200ms cubic-bezier(.215,.61,.355,1); }
.modal.small { width: min(520px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 19px; flex: 1; }
.modal-tabs { display: flex; gap: 6px; padding: 8px 12px 0; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.modal-tabs::-webkit-scrollbar { display: none; }
.modal-tab { min-height: 44px; padding: 8px 14px; border: none; border-bottom: 3px solid transparent; background: none; cursor: pointer; font-weight: 700; color: var(--muted); white-space: nowrap; }
.modal-tab.on { color: var(--text); border-bottom-color: var(--accent); }
.modal-body { padding: 14px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.modal-foot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.muted { color: var(--muted); }
.big-num { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: rgba(255,255,255,.04); }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.progress { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width 300ms var(--ease); }
/* codex */
.codex-tiers { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.codex-tier { font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line-strong); }
.codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.codex-cell { border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04); padding: 6px; text-align: center; cursor: pointer; min-height: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.codex-cell canvas { width: 44px; height: 44px; }
.codex-cell .n { font-size: 12px; line-height: 1.15; }
.codex-cell.unknown .n { color: var(--muted); }
.codex-cell:hover { border-color: var(--line-strong); }
/* rarity frames: colour-coded border and inner glow, livelier with rarity, prismatic for exquisite */
.codex-cell.rar { border: 2px solid color-mix(in srgb, var(--rc) 65%, transparent); background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--rc) 20%, transparent), rgba(255,255,255,.03) 72%); }
.codex-cell.rar-0 { border-color: rgba(255,255,255,.14); }
.codex-cell.rar-3, .codex-cell.rar-4 { box-shadow: inset 0 0 12px color-mix(in srgb, var(--rc) 35%, transparent); }
.codex-cell.rar-5, .codex-cell.rar-6 { box-shadow: inset 0 0 14px color-mix(in srgb, var(--rc) 50%, transparent), 0 0 8px color-mix(in srgb, var(--rc) 35%, transparent); animation: rar-pulse 2.4s ease-in-out infinite; }
@keyframes rar-pulse { 50% { box-shadow: inset 0 0 18px color-mix(in srgb, var(--rc) 70%, transparent), 0 0 12px color-mix(in srgb, var(--rc) 55%, transparent); } }
@property --ra { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.codex-cell.rar-7 { border: 2px solid transparent; background: linear-gradient(#211a26, #211a26) padding-box, conic-gradient(from var(--ra), #ff5a5a, #ffd24a, #63df74, #4ad0ff, #a86bff, #ff5ad8, #ff5a5a) border-box; animation: rar-spin 4s linear infinite; box-shadow: 0 0 12px rgba(255,255,255,.25); }
@keyframes rar-spin { to { --ra: 360deg; } }
.codex-detail { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.05); }
.codex-detail canvas { width: 72px; height: 72px; flex: 0 0 auto; }
/* research tree */
.tree-wrap { position: relative; overflow: hidden; height: min(62vh, 560px); border-radius: 14px; background: rgba(0,0,0,.25); touch-action: none; cursor: grab; }
.tree-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tree-node { position: absolute; width: 176px; min-height: 64px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line-strong); background: #221a28; font-size: 12px; cursor: pointer; }
.tree-node b { display: block; font-size: 13px; margin-bottom: 2px; }
.tree-node.done { border-color: var(--good); background: #1b2a1e; }
.tree-node.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tree-node.locked { color: rgba(246,240,234,.55); background: #1c1620; border-color: rgba(255,255,255,.12); }

.tree-node .cost { color: var(--good); font-weight: 700; }

.tree-cat { position: absolute; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tree-zoom { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
/* rebirth */

.planet-list { display: flex; gap: 8px; flex-wrap: wrap; }
.planet-btn { min-height: 64px; min-width: 120px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.05); cursor: pointer; text-align: left; font-size: 13px; }

.planet-btn .pico { float: left; width: 46px; height: 46px; margin: 0 8px 4px 0; }
.planet-btn .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
.chart { width: 100%; height: 180px; display: block; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.stat { padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.05); }

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }

.settings { display: flex; flex-direction: column; gap: 4px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

.switch { width: 52px; height: 30px; border-radius: 15px; background: #3a3340; border: 1px solid var(--line-strong); position: relative; cursor: pointer; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #ddd; transition: transform 160ms var(--ease); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(22px); background: #fff; }
input[type=range] { width: 180px; accent-color: var(--accent); min-height: 30px; }
textarea.io { width: 100%; min-height: 120px; border-radius: 12px; background: #0f0b12; color: var(--text); border: 1px solid var(--line-strong); padding: 10px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
.welcome-num { font-size: 40px; font-weight: 900; color: var(--good); font-variant-numeric: tabular-nums; text-align: center; margin: 8px 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }

.list-plain { margin: 0; padding-left: 18px; font-size: 14px; }

.sales-log { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.sales-log div { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.04); }
.sales-log canvas { width: 18px; height: 18px; }

.pin-list { display: flex; flex-direction: column; gap: 6px; }

/* ---------- map overlay ---------- */
.map-wrap { position: relative; height: min(70vh, 640px); border-radius: 14px; overflow: hidden; background: #000; touch-action: none; }
.map-wrap canvas { width: 100%; height: 100%; display: block; cursor: grab; }
.map-tools { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- tutorial / tooltip ---------- */
#tutorial { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(96px + var(--sab)); width: min(460px, calc(100% - 24px)); background: var(--panel-solid); border: 2px solid var(--accent); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); animation: rise-in 220ms var(--ease); }

.pulse-target { animation: pulse-ring 1.4s var(--ease) infinite; }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(255,138,61,.9), var(--shadow); } 70% { box-shadow: 0 0 0 14px rgba(255,138,61,0), var(--shadow); } 100% { box-shadow: 0 0 0 0 rgba(255,138,61,0), var(--shadow); } }
#tooltip { position: absolute; max-width: 280px; padding: 8px 10px; border-radius: 10px; background: var(--panel-solid); border: 1px solid var(--line-strong); font-size: 13px; pointer-events: none; box-shadow: var(--shadow); z-index: 60; }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; z-index: 100; }
#screen-title { display: grid; place-items: start center; background: #07050b; overflow: hidden; }
#title-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-inner { position: relative; text-align: center; padding: max(5vh, 22px) 16px 8px; display: flex; flex-direction: column; align-items: center; transition: opacity .35s ease, transform .35s ease; }
.title-mark { width: clamp(56px, 9vw, 88px); height: auto; margin-bottom: 6px; filter: drop-shadow(0 2px 10px rgba(255,140,60,.35)); }
.wordmark { font-size: clamp(32px, min(7.4vw, 11vh), 80px); font-weight: 900; letter-spacing: .085em; text-transform: uppercase; line-height: 1.02; margin: 0;
  background: linear-gradient(180deg, #fff3e2 0%, #ffcf96 42%, #ff9447 78%, #f27a35 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 16px rgba(255,120,50,.32)); padding: 0 .04em; }
.title-sub { color: #f6ebe1; margin: 10px 0 24px; font-size: clamp(15px, 2.1vw, 18px); font-weight: 600; letter-spacing: .01em; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
.title-buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.tbtn { min-height: 48px; width: min(360px, 80vw); border-radius: 14px; font: 800 17px/1.1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em; cursor: pointer; padding: 0 22px;
  transition: transform .12s ease, background .15s ease, box-shadow .15s ease, border-color .15s ease, color .15s ease; -webkit-tap-highlight-color: transparent; }
.tbtn.primary { min-height: 56px; min-width: min(280px, 80vw); font-size: 19px; color: #1d0c03; border: 0;
  background: linear-gradient(180deg, #ffa860 0%, #ff8434 100%); box-shadow: 0 8px 26px rgba(255,120,40,.33), inset 0 1px 0 rgba(255,255,255,.38); }
.tbtn.primary:hover { background: linear-gradient(180deg, #ffb878 0%, #ff9142 100%); box-shadow: 0 10px 32px rgba(255,130,50,.45), inset 0 1px 0 rgba(255,255,255,.45); }
.tbtn.ghost { background: rgba(16,10,16,.42); color: #fbf1e7; border: 1.5px solid rgba(255,222,192,.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tbtn.ghost:hover { border-color: rgba(255,222,192,.85); background: rgba(40,24,30,.55); }
.tbtn:focus-visible { outline: 3px solid #ffe2bd; outline-offset: 3px; }
.tbtn:active { transform: translateY(1px) scale(.985); }
.tbtn.hidden { display: none; }
.title-version { color: #cdbfb4; font-size: 12px; margin-top: 18px; }
#screen-title.leaving { background: transparent; pointer-events: none; z-index: 102; }

@media (max-height: 520px) {

// ===== src/core/00_config.js =====

const CURRENCY_NAME = 'Epstein-Taler';

const SAVE_VERSION = 3;

const CONFIG = {

  customers: [

  luxuryChance: 0.08,                // chance that a customer asks for something above its usual range

  sellerLevelArrival: 1.25,          // customer arrival multiplier per seller level
  satisfiedBonus: 0.10,
  pathBonusPerTile: 0.03, pathBonusMax: 0.6, pathRadius: 9,
  contractSlots: 3, contractDuration: 25 * 60,
  contractRpChance: 0.25,
  tipChance: 0.06, tipValue: 0.15, tipLifetime: 25,

  // ---- demand ----
  demandInterval: 5,
  demandRevert: 0.02, demandNoise: 0.03,
  demandMin: 0.5, demandMax: 2.0,
  saturationPerUnit: 0.004, saturationMin: 0.4, saturationRecover: 0.01,
  eventInterval: [180, 480],
  eventPositive: { mult: [1.8, 2.5], dur: [360, 720] },
  eventNegative: { mult: [0.6, 0.6], dur: [300, 480] },
  eventNegativeChance: 0.25,
  historyInterval: 20, historyLength: 30,

  // ---- research ----
  researchTimeFactor: 1.0,

  // ---- rebirth ----
  rebirthBase: 1e6,
  rebirthGrowth: 20,
  rebirthMultPerPoint: 0.10,
  codexTierBonus: 0.02,

  // ---- offline ----

  offlineMin: 60,
  offlineStep: 60,
  onlineCatchup: 60,

  // ---- misc ----

  maxItemsPerBuffer: 4

// ===== src/core/01_util.js =====
// =====================================================================
// RNG / Noise / Math / Formatting / Compression (DOM-free)
// =====================================================================
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  // Guards against NaN/Infinity leaking into the economy.
  safe(v, fallback = 0) {
    if (typeof v !== 'number' || v !== v) return fallback;
    if (v === Infinity) return 1e300;
    if (v === -Infinity) return -1e300;
    return v;
  },
  dist2: (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by),
  // Numeric keys for tiles and chunks (exact for |x|,|y| < 2^24).
  tileKey: (x, y) => (x + 16777216) * 33554432 + (y + 16777216),
  keyX: k => Math.floor(k / 33554432) - 16777216,
  keyY: k => (k % 33554432) - 16777216,
  chunkKey: (cx, cy) => (cx + 1048576) * 2097152 + (cy + 1048576),
  chunkKeyX: k => Math.floor(k / 2097152) - 1048576,
  chunkKeyY: k => (k % 2097152) - 1048576,
  DX: [1, 0, -1, 0],
  DY: [0, 1, 0, -1],
  opp: d => (d + 2) & 3,
  shuffle(arr, rnd) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  },
  pick: (arr, rnd) => arr[Math.floor(rnd() * arr.length) % arr.length],
  randRange: (a, b, rnd) => a + (b - a) * rnd(),
  randInt: (a, b, rnd) => a + Math.floor(rnd() * (b - a + 1)),
  weighted(weights, rnd) {
    let s = 0;
    for (let i = 0; i < weights.length; i++) s += weights[i];
    let r = rnd() * s;
    for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; }
    return weights.length - 1;
  },
  gauss(rnd) {
    let u = 0, v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
};

const RNG = {
  mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },
  // Integer hash of up to four ints, stable across platforms.
  hash(a, b = 0, c = 0, d = 0) {
    let h = 0x811c9dc5 ^ (a | 0);
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
    h ^= (b | 0) + 0x9e3779b9 + (h << 6) + (h >>> 2);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    h ^= (c | 0) + 0x7f4a7c15 + (h << 6) + (h >>> 2);
    h = Math.imul(h ^ (h >>> 16), 0x27d4eb2f);
    h ^= (d | 0) + 0x165667b1 + (h << 6) + (h >>> 2);
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
    h ^= h >>> 13;
    return h >>> 0;
  },
  hashString(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  },
  forChunk(seed, cx, cy, salt = 0) { return RNG.mulberry32(RNG.hash(seed, cx, cy, salt)); },
  newSeed() { return (Math.floor(Math.random() * 4294967295) ^ Date.now()) >>> 0; }
};

// Seeded 2D gradient noise (Perlin-style) with fractal sum.
const Noise = {
  make(seed) {
    const perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    U.shuffle(p, RNG.mulberry32(seed));
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
    const gx = new Float32Array(8), gy = new Float32Array(8);
    for (let i = 0; i < 8; i++) { gx[i] = Math.cos(i * Math.PI / 4); gy[i] = Math.sin(i * Math.PI / 4); }
    const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
    function noise2(x, y) {
      // Large coordinates: wrap integer part into the permutation space without losing fraction precision.
      const xf0 = Math.floor(x), yf0 = Math.floor(y);
      const xi = xf0 & 255, yi = yf0 & 255;
      const xf = x - xf0, yf = y - yf0;
      const aa = perm[perm[xi] + yi] & 7, ab = perm[perm[xi] + yi + 1] & 7;
      const ba = perm[perm[xi + 1] + yi] & 7, bb = perm[perm[xi + 1] + yi + 1] & 7;
      const u = fade(xf), v = fade(yf);
      const n00 = gx[aa] * xf + gy[aa] * yf;
      const n10 = gx[ba] * (xf - 1) + gy[ba] * yf;
      const n01 = gx[ab] * xf + gy[ab] * (yf - 1);
      const n11 = gx[bb] * (xf - 1) + gy[bb] * (yf - 1);
      const nx0 = n00 + (n10 - n00) * u, nx1 = n01 + (n11 - n01) * u;
      return (nx0 + (nx1 - nx0) * v) * 1.41; // ~[-1,1]
    }
    function fbm(x, y, oct = 3) {
      let s = 0, a = 1, f = 1, n = 0;
      for (let i = 0; i < oct; i++) { s += a * noise2(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; }
      return s / n;
    }
    return { noise2, fbm };
  }
};

// Number / time formatting (German).
const Fmt = {
  mode: 'short', // short | sci | full
  units: ['', 'Tsd', 'Mio', 'Mrd', 'Bio', 'Brd', 'Trio', 'Trd', 'Quadr', 'Quadrd', 'Quint', 'Quintd'],
  dec(v, d) {
    return v.toFixed(d).replace('.', ',');
  },
  grouped(v) {
    const s = Math.floor(Math.abs(v)).toString();
    let out = '';
    for (let i = 0; i < s.length; i++) {
      if (i > 0 && (s.length - i) % 3 === 0) out += '.';
      out += s[i];
    }
    return (v < 0 ? '-' : '') + out;
  },
  num(v, mode) {
    v = U.safe(v);
    mode = mode || Fmt.mode;
    const neg = v < 0; const a = Math.abs(v);
    let s;
    if (a < 1000) {
      if (a === 0) s = '0';
      else if (a < 10) s = Fmt.trim(Fmt.dec(a, 2));
      else if (a < 100) s = Fmt.trim(Fmt.dec(a, 1));
      else s = Math.floor(a).toString();
    } else if (mode === 'full' && a < 1e15) {
      s = Fmt.grouped(a);
    } else if (mode === 'sci' || a >= 1e36) {
      let e = Math.floor(Math.log10(a));
      let m = a / Math.pow(10, e);
      if (m >= 9.995) { m /= 10; e++; }
      s = Fmt.dec(m, 2) + 'e' + e;
    } else {
      let i = Math.floor(Math.log10(a) / 3);
      let m = a / Math.pow(1000, i);
      if (m >= 999.5) { i++; m /= 1000; }
      const d = m < 10 ? 2 : m < 100 ? 1 : 0;
      s = Fmt.dec(m, d) + ' ' + Fmt.units[i];
    }
    return (neg ? '-' : '') + s;
  },
  trim(s) { return s.indexOf(',') >= 0 ? s.replace(/0+$/, '').replace(/,$/, '') : s; },
  int(v) { v = U.safe(v); return Math.abs(v) < 1e6 ? Fmt.grouped(Math.round(v)) : Fmt.num(v); },
  money(v) { return Fmt.num(v) + ' ' + CURRENCY_SHORT; },
  pct(v, d = 0) { return Fmt.dec(U.safe(v) * 100, d) + ' %'; },
  time(sec) {
    sec = Math.max(0, Math.floor(U.safe(sec)));
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    const p = n => (n < 10 ? '0' : '') + n;
    return h > 0 ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s);
  },
  duration(sec) {
    sec = Math.max(0, Math.floor(U.safe(sec)));
    const d = Math.floor(sec / 86400), h = Math.floor(sec / 3600) % 24, m = Math.floor(sec / 60) % 60, s = sec % 60;
    if (d > 0) return d + ' T ' + h + ' Std';
    if (h > 0) return h + ' Std ' + m + ' Min';
    if (m > 0) return m + ' Min ' + s + ' s';
    return s + ' s';
  }
};

// Minimal LZW + base64 used for save export strings.
const Codec = {
  utf8Encode(str) {
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
    const out = [];
    for (let i = 0; i < str.length; i++) {
      let c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c < 0xdc00 && i + 1 < str.length) {
        const c2 = str.charCodeAt(++i); const cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return new Uint8Array(out);
  },
  utf8Decode(bytes) {
    if (typeof TextDecoder !== 'undefined') return new TextDecoder().decode(bytes);
    let s = '';
    for (let i = 0; i < bytes.length;) {
      const c = bytes[i++];
      if (c < 0x80) s += String.fromCharCode(c);
      else if (c < 0xe0) s += String.fromCharCode(((c & 31) << 6) | (bytes[i++] & 63));
      else if (c < 0xf0) s += String.fromCharCode(((c & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63));
      else {
        const cp = ((c & 7) << 18) | ((bytes[i++] & 63) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
        s += String.fromCodePoint(cp);
      }
    }
    return s;
  },
  lzwCompress(bytes) {
    const dict = new Map();
    for (let i = 0; i < 256; i++) dict.set(String.fromCharCode(i), i);
    let next = 256, w = '';
    const codes = [];
    for (let i = 0; i < bytes.length; i++) {
      const c = String.fromCharCode(bytes[i]);
      const wc = w + c;
      if (dict.has(wc)) w = wc;
      else {
        codes.push(dict.get(w));
        if (next < 65536) dict.set(wc, next++);
        w = c;
      }
    }
    if (w !== '') codes.push(dict.get(w));
    // varint pack
    const out = [];
    for (const code of codes) {
      let v = code;
      while (v >= 128) { out.push((v & 127) | 128); v >>>= 7; }
      out.push(v);
    }
    return new Uint8Array(out);
  },
  lzwDecompress(packed) {
    const codes = [];
    for (let i = 0; i < packed.length;) {
      let v = 0, shift = 0, b;
      do { b = packed[i++]; v |= (b & 127) << shift; shift += 7; } while (b & 128 && i <= packed.length);
      codes.push(v);
    }
    if (!codes.length) return new Uint8Array(0);
    const dict = [];
    for (let i = 0; i < 256; i++) dict.push([i]);
    let w = dict[codes[0]];
    if (!w) throw new Error('bad lzw');
    const out = w.slice();
    for (let i = 1; i < codes.length; i++) {
      const k = codes[i];
      let entry;
      if (k < dict.length) entry = dict[k];
      else if (k === dict.length) entry = w.concat([w[0]]);
      else throw new Error('bad lzw code');
      for (let j = 0; j < entry.length; j++) out.push(entry[j]);
      if (dict.length < 65536) dict.push(w.concat([entry[0]]));
      w = entry;
    }
    return new Uint8Array(out);
  },
  b64chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/',
  toBase64(bytes) {
    const c = Codec.b64chars; let s = '';
    for (let i = 0; i < bytes.length; i += 3) {
      const a = bytes[i], b = i + 1 < bytes.length ? bytes[i + 1] : 0, d = i + 2 < bytes.length ? bytes[i + 2] : 0;
      const n = (a << 16) | (b << 8) | d;
      s += c[(n >> 18) & 63] + c[(n >> 12) & 63] + (i + 1 < bytes.length ? c[(n >> 6) & 63] : '=') + (i + 2 < bytes.length ? c[n & 63] : '=');
    }
    return s;
  },
  fromBase64(str) {
    str = str.replace(/[^A-Za-z0-9+/=]/g, '');
    const lookup = {}; for (let i = 0; i < 64; i++) lookup[Codec.b64chars[i]] = i;
    const out = [];
    for (let i = 0; i < str.length; i += 4) {
      const a = lookup[str[i]], b = lookup[str[i + 1]], c = lookup[str[i + 2]], d = lookup[str[i + 3]];
      if (a === undefined || b === undefined) throw new Error('bad base64');
      const n = (a << 18) | (b << 12) | ((c || 0) << 6) | (d || 0);
      out.push((n >> 16) & 255);
      if (str[i + 2] !== '=' && c !== undefined) out.push((n >> 8) & 255);
      if (str[i + 3] !== '=' && d !== undefined) out.push(n & 255);
    }
    return new Uint8Array(out);
  },
  pack(str) { return Codec.toBase64(Codec.lzwCompress(Codec.utf8Encode(str))); },
  unpack(b64) { return Codec.utf8Decode(Codec.lzwDecompress(Codec.fromBase64(b64))); }
};

(function buildResources() {
  let idx = 0;
  DATA.RESOURCE_DEFS.forEach((list, tier) => {
    list.forEach((def, j) => {
      const h = RNG.hash(idx * 7919 + 13, tier, 4242);
      const jitter = ((h % 10001) / 10000 * 2 - 1) * CONFIG.valueJitter;
      DATA.RESOURCES.push({
        id: idx,
        key: 'r' + idx,
        name: def[0],
        color: def[1],
        desc: def[2],
        tier,
        shape: DATA.SHAPES[(j * 5 + tier * 3) % DATA.SHAPES.length],
        value: Math.pow(CONFIG.tierValueBase, tier) * (1 + jitter)
      });
      idx++;
    });
  });
  DATA.BY_TIER = DATA.TIERS.map((_, t) => DATA.RESOURCES.filter(r => r.tier === t).map(r => r.id));
})();

};

// Returns planet descriptor for index k (1-based).
DATA.planet = function (k) {
  if (k <= DATA.PLANETS.length) return Object.assign({ index: k }, DATA.PLANETS[k - 1]);
  const rnd = RNG.mulberry32(RNG.hash(k, 777, 4091));
  const hue = Math.floor(rnd() * 360), sat = 25 + rnd() * 45, light = 18 + rnd() * 30;
  const hsl = (h, s, l) => {
    s /= 100; l /= 100;
    const f = n => { const kk = (n + h / 30) % 12; const a = s * Math.min(l, 1 - l); const c = l - a * Math.max(-1, Math.min(kk - 3, 9 - kk, 1)); return Math.round(255 * c).toString(16).padStart(2, '0'); };
    return '#' + f(0) + f(8) + f(4);
  };
  const accentHue = (hue + 120 + rnd() * 120) % 360;
  const specials = Object.keys(DATA.PLANET_SPECIALS);
  return {
    index: k,
    name: U.pick(DATA.PROC_NAMES_A, rnd) + U.pick(DATA.PROC_NAMES_B, rnd) + ' ' + ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][k % 7],
    desc: 'Ein unerforschter Planet am Rand der Karten.',
    ground: [hsl(hue, sat, light * 0.7), hsl(hue, sat, light), hsl(hue, sat * 0.9, Math.min(80, light * 1.4))],
    accent: hsl(accentHue, 80, 60), rock: hsl(hue, sat, light * 0.5), deco: hsl(accentHue, 70, 75),
    sky: [Math.floor(120 + rnd() * 135), Math.floor(120 + rnd() * 135), Math.floor(120 + rnd() * 135)],
    particle: hsl(accentHue, 60, 80), special: specials[Math.floor(rnd() * specials.length)]
  };
};

      noiseC: Noise.make(RNG.hash(seed, 33)),
      depositCache: new Map(),
      decorCache: new Map(),
      discovered: new Map(),   // chunkKey -> 16-bit mask
      known: new Set(),        // known deposit ids
      weights: null,
      start: null
    };
    w.weights = World.tierWeights(w);
    w.start = World.genStart(w);
    return w;
  },

  tierWeights(w) {
    const base = CONFIG.tierWeights;
    const out = base.map((v, t) => {
      let x = v * (1 + CONFIG.planetTierShift * (w.k - 1) * t);
      if (t >= 2) x *= 1 + 0.1 * w.luckLevel;
      if (t >= 4 && w.planet.special === 'rare') x *= 1.25;
      return x;
    });
    const s = out.reduce((a, b) => a + b, 0);
    return out.map(v => v / s);
  },

  // Deterministic lucky start: always a playable set of common deposits plus a bonus by luck class.
  genStart(w) {
    const rnd = RNG.mulberry32(RNG.hash(w.seed, 9001, w.k));
    const p = CONFIG.luckyStart.slice();
    // Luck upgrade moves probability from "normal" into the better classes.
    const shift = Math.min(0.4, 0.04 * w.luckLevel);
    p[0] -= shift; p[1] += shift * 0.55; p[2] += shift * 0.3; p[3] += shift * 0.15;
    const luck = U.weighted(p, rnd);
    const L = CONFIG.landing;
    const list = [];
    const used = [];
    const place = (tier, minD, maxD, sizeClass) => {
      for (let attempt = 0; attempt < 60; attempt++) {
        const ang = rnd() * Math.PI * 2;
        const d = minD + rnd() * (maxD - minD);
        const x = Math.round(L.x + Math.cos(ang) * d), y = Math.round(L.y + Math.sin(ang) * d);
        const cx = Math.floor(x / CONFIG.chunkSize), cy = Math.floor(y / CONFIG.chunkSize);
        const lx = x - cx * CONFIG.chunkSize, ly = y - cy * CONFIG.chunkSize;
        if (lx < 3 || ly < 3 || lx > CONFIG.chunkSize - 4 || ly > CONFIG.chunkSize - 4) continue;
        if (used.some(u => U.dist2(u.x, u.y, x, y) < 81)) continue;
        if (U.dist2(x, y, L.x, L.y) < 16) continue;
        used.push({ x, y });
        const res = U.pick(DATA.BY_TIER[tier], rnd);
        list.push({ x, y, tier, res, sizeClass });
        return true;
      }
      return false;
    };
    // Guaranteed: one large common close by, one or two more common/uncommon.
    place(0, 6, 10, 2);
    place(rnd() < 0.5 ? 0 : 1, 9, 16, 1);
    if (rnd() < 0.6) place(1, 12, 20, 1);
    if (luck > 0) {
      const tiers = World.LUCK_TIERS[luck];
      place(rnd() < 0.65 ? tiers[0] : tiers[1], 14, CONFIG.startRadius - 2, 0);
    }
    return { luck, deposits: list };
  },

  genChunkDeposits(w, cx, cy) {
    const S = CONFIG.chunkSize;
    const rnd = RNG.forChunk(w.seed, cx, cy, 1);
    const out = [];
    const L = CONFIG.landing;
    const count = U.weighted(CONFIG.depositsPerChunk, rnd);
    const centers = [];
    const tryAdd = (x, y, tier, res, sizeClass, r) => {
      const tiles = World.growCluster(x, y, sizeClass, cx, cy, r);
      const dep = {
        id: U.chunkKey(cx, cy) * 8 + out.length,
        x, y, tier, res, sizeClass,
        slots: CONFIG.sizeSlots[sizeClass],
        tiles,
        tileSet: new Set(tiles.map(t => U.tileKey(t[0], t[1])))
      };
      out.push(dep);
      centers.push([x, y]);
    };
    for (let i = 0; i < count; i++) {
      let ok = false, x = 0, y = 0;
      for (let a = 0; a < 12 && !ok; a++) {
        x = cx * S + 4 + Math.floor(rnd() * (S - 8));
        y = cy * S + 4 + Math.floor(rnd() * (S - 8));
        ok = U.dist2(x, y, L.x, L.y) >= CONFIG.depositStartExclusion * CONFIG.depositStartExclusion &&
          centers.every(c => U.dist2(c[0], c[1], x, y) >= CONFIG.depositMinDist * CONFIG.depositMinDist);
      }
      const tier = U.weighted(w.weights, rnd);
      const res = U.pick(DATA.BY_TIER[tier], rnd);
      const sizeClass = U.weighted(CONFIG.sizeChance[tier], rnd);
      if (ok) tryAdd(x, y, tier, res, sizeClass, rnd);
    }
    for (const sd of w.start.deposits) {
      if (Math.floor(sd.x / S) === cx && Math.floor(sd.y / S) === cy) {
        tryAdd(sd.x, sd.y, sd.tier, sd.res, sd.sizeClass, RNG.mulberry32(RNG.hash(w.seed, sd.x, sd.y, 5)));
      }
    }
    return out;
  },

  growCluster(x, y, sizeClass, cx, cy, rnd) {
    const S = CONFIG.chunkSize;
    const range = CONFIG.sizeTiles[sizeClass];
    const n = U.randInt(range[0], range[1], rnd);
    const minX = cx * S + 1, maxX = cx * S + S - 2, minY = cy * S + 1, maxY = cy * S + S - 2;
    const tiles = [[x, y]];
    const set = new Set([U.tileKey(x, y)]);
    let guard = 0;
    while (tiles.length < n && guard++ < 200) {
      const base = tiles[Math.floor(rnd() * tiles.length)];
      const d = Math.floor(rnd() * 4);
      const nx = base[0] + U.DX[d], ny = base[1] + U.DY[d];
      if (nx < minX || nx > maxX || ny < minY || ny > maxY) continue;
      const k = U.tileKey(nx, ny);
      if (set.has(k)) continue;
      set.add(k); tiles.push([nx, ny]);
    }
    return tiles;
  },

  chunkDeposits(w, cx, cy) {
    const key = U.chunkKey(cx, cy);
    let d = w.depositCache.get(key);
    if (!d) {
      d = World.genChunkDeposits(w, cx, cy);
      if (w.depositCache.size > 6000) {
        // drop the oldest quarter (Map keeps insertion order)
        let n = 1500;
        for (const k of w.depositCache.keys()) { w.depositCache.delete(k); if (--n <= 0) break; }
      }
      w.depositCache.set(key, d);
    }
    return d;
  },

  depositById(w, id) {
    const ck = Math.floor(id / 8);
    const list = World.chunkDeposits(w, U.chunkKeyX(ck), U.chunkKeyY(ck));
    return list[id % 8] || null;
  },

  depositAt(w, x, y) {
    const S = CONFIG.chunkSize;
    const list = World.chunkDeposits(w, Math.floor(x / S), Math.floor(y / S));
    const k = U.tileKey(x, y);
    for (const d of list) if (d.tileSet.has(k)) return d;
    return null;
  },

  depositsInRect(w, x0, y0, x1, y1, out = []) {
    const S = CONFIG.chunkSize;
    const cx0 = Math.floor(x0 / S), cy0 = Math.floor(y0 / S), cx1 = Math.floor(x1 / S), cy1 = Math.floor(y1 / S);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      for (const d of World.chunkDeposits(w, cx, cy)) {
        if (d.x >= x0 - 3 && d.x <= x1 + 3 && d.y >= y0 - 3 && d.y <= y1 + 3) out.push(d);
      }
    }
    return out;
  },

  depositsInRadius(w, x, y, r) {
    const list = World.depositsInRect(w, x - r, y - r, x + r, y + r);
    return list.filter(d => U.dist2(d.x, d.y, x, y) <= r * r);
  },

  // ---- terrain ----
  // Returns values used by the renderer: base elevation, biome mix, detail.
  biome(w, x, y) {
    const b = w.noiseA.fbm(x / 170, y / 170, 2);
    const r = w.noiseB.fbm(x / 65 + 50, y / 65 - 20, 2);
    // 0 Staubebene, 1 Dünen, 2 Felsfeld, 3 Kraterfeld, 4 Geröll
    if (b > 0.28) return 1;
    if (b < -0.3) return 3;
    if (r > 0.25) return 2;
    if (r < -0.28) return 4;
    return 0;
  },
  BIOME_NAMES: ['Staubebene', 'Dünen', 'Felsfeld', 'Kraterfeld', 'Geröll'],

  terrain(w, x, y) {
    const e = w.noiseA.fbm(x / 26, y / 26, 3);
    const b = w.noiseA.fbm(x / 170, y / 170, 2);
    const r = w.noiseB.fbm(x / 65 + 50, y / 65 - 20, 2);
    const d = w.noiseC.noise2(x / 5, y / 5);
    return { e, b, r, d };
  },

  // Deterministic cosmetic decorations for a chunk.
  chunkDecor(w, cx, cy) {
    const key = U.chunkKey(cx, cy);
    let list = w.decorCache.get(key);
    if (list) return list;
    const S = CONFIG.chunkSize;
    const rnd = RNG.forChunk(w.seed, cx, cy, 2);
    list = [];
    const n = 26 + Math.floor(rnd() * 16);
    for (let i = 0; i < n; i++) {
      const x = cx * S + rnd() * S, y = cy * S + rnd() * S;
      const bi = World.biome(w, Math.floor(x), Math.floor(y));
      const roll = rnd();
      let type;
      if (bi === 3) type = roll < 0.35 ? 'crater' : roll < 0.7 ? 'rock' : 'pebble';
      else if (bi === 2) type = roll < 0.55 ? 'rock' : roll < 0.75 ? 'vein' : 'pebble';
      else if (bi === 4) type = roll < 0.75 ? 'pebble' : 'rock';
      else if (bi === 1) type = roll < 0.6 ? 'ripple' : roll < 0.8 ? 'pebble' : 'rock';
      else type = roll < 0.12 ? 'crater' : roll < 0.4 ? 'pebble' : roll < 0.55 ? 'rock' : roll < 0.7 ? 'vein' : 'ripple';
      const size = type === 'crater' ? 1.2 + rnd() * 2.8 : type === 'rock' ? 0.35 + rnd() * 0.6 : type === 'vein' ? 1 + rnd() * 2 : type === 'ripple' ? 1.5 + rnd() * 2.5 : 0.12 + rnd() * 0.2;
      list.push({ type, x, y, size, rot: rnd() * Math.PI * 2, v: rnd() });
    }
    if (w.decorCache.size > 800) { let k2 = 200; for (const kk of w.decorCache.keys()) { w.decorCache.delete(kk); if (--k2 <= 0) break; } }
    w.decorCache.set(key, list);
    return list;
  },

  // ---- discovery ----
  discover(w, x, y, r) {
    const C = CONFIG.fogCell, S = CONFIG.chunkSize, per = S / C;
    const gx0 = Math.floor((x - r) / C), gx1 = Math.floor((x + r) / C);
    const gy0 = Math.floor((y - r) / C), gy1 = Math.floor((y + r) / C);
    let changed = false;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const mx = gx * C + C / 2, my = gy * C + C / 2;
      if (U.dist2(mx, my, x, y) > (r + C * 0.7) * (r + C * 0.7)) continue;
      const cx = Math.floor(gx / per), cy = Math.floor(gy / per);
      const bit = 1 << ((gy - cy * per) * per + (gx - cx * per));
      const key = U.chunkKey(cx, cy);
      const m = w.discovered.get(key) || 0;
      if (!(m & bit)) { w.discovered.set(key, m | bit); changed = true; }
    }
    return changed;
  },
  isDiscovered(w, x, y) {
    const C = CONFIG.fogCell, S = CONFIG.chunkSize, per = S / C;
    const gx = Math.floor(x / C), gy = Math.floor(y / C);
    const cx = Math.floor(gx / per), cy = Math.floor(gy / per);
    const m = w.discovered.get(U.chunkKey(cx, cy)) || 0;
    return (m & (1 << ((gy - cy * per) * per + (gx - cx * per)))) !== 0;
  },
  // Marks deposits as known; returns the newly known ones.
  reveal(w, x, y, r) {
    const found = [];
    for (const d of World.depositsInRadius(w, x, y, r)) {
      if (!w.known.has(d.id)) { w.known.add(d.id); found.push(d); }
    }
    return found;
  }
};

// ===== src/core/04_grid.js =====
// =====================================================================
// Grid / Buildings: placement, ports, rotation, costs, upgrades, undo
// =====================================================================
const TRANSPORT = { belt: 1, splitter: 1, merger: 1, crossing: 1, bridge: 1, fsplitter: 1, osplitter: 1 };
const SELLER_TIER = { bazaar: 0, caravan: 1, shuttlepad: 2, port: 3, dock: 4, terminal: 5 };
const REFINERY_LEVEL = { refinery1: 1, refinery2: 2, refinery3: 3 };
const BOOSTER = { cooler: 1, servo: 1, charger: 1 };

const Grid = {
  isTransport: t => TRANSPORT[t] === 1,
  isSeller: t => SELLER_TIER[t] !== undefined,
  isRefinery: t => REFINERY_LEVEL[t] !== undefined,
  isDeco: t => DATA.BUILDINGS[t] && DATA.BUILDINGS[t].cat === 'deco',

  size(type, rot, len) {
    const d = DATA.BUILDINGS[type];
    let w = d.w, h = d.h;
    if (type === 'bridge') { w = len || 2; h = 1; }
    return (rot & 1) ? { w: h, h: w } : { w, h };
  },

  // Tiles a building occupies (bridges only occupy their two ends).
  occTiles(type, x, y, rot, len) {
    const s = Grid.size(type, rot, len);
    if (type === 'bridge') {
      const L = len || 2;
      const ex = x + U.DX[rot] * (L - 1), ey = y + U.DY[rot] * (L - 1);
      return [[x, y], [ex, ey]];
    }
    const out = [];
    for (let j = 0; j < s.h; j++) for (let i = 0; i < s.w; i++) out.push([x + i, y + j]);
    return out;
  },

  // For a bridge, x/y is the entrance tile; footprint rect for rendering spans both ends.
  rect(b) {
    if (b.type === 'bridge') {
      const ex = b.x + U.DX[b.rot] * (b.len - 1), ey = b.y + U.DY[b.rot] * (b.len - 1);
      return { x: Math.min(b.x, ex), y: Math.min(b.y, ey), w: Math.abs(ex - b.x) + 1, h: Math.abs(ey - b.y) + 1 };
    }
    return { x: b.x, y: b.y, w: b.w, h: b.h };
  },

  at(g, x, y) {
    const id = g.occ.get(U.tileKey(x, y));
    return id === undefined ? null : g.buildings.get(id);
  },

  // Front-centre output port: returns [tx, ty] of the tile in front of the building.
  frontPort(b) {
    const r = b.rot;
    if (r === 0) return [b.x + b.w, b.y + (b.h >> 1)];
    if (r === 1) return [b.x + (b.w >> 1), b.y + b.h];
    if (r === 2) return [b.x - 1, b.y + (b.h >> 1)];
    return [b.x + (b.w >> 1), b.y - 1];
  },

  // All tiles directly outside the footprint with the outward direction.
  perimeter(b) {
    const out = [];
    for (let j = 0; j < b.h; j++) { out.push([b.x + b.w, b.y + j, 0]); out.push([b.x - 1, b.y + j, 2]); }
    for (let i = 0; i < b.w; i++) { out.push([b.x + i, b.y + b.h, 1]); out.push([b.x + i, b.y - 1, 3]); }
    return out;
  },

  neighbors(g, b) {
    const set = new Set();
    for (const p of Grid.perimeter(b)) {
      const o = Grid.at(g, p[0], p[1]);
      if (o && o !== b) set.add(o);
    }
    return set;
  },

  // ---------------- costs ----------------
  countKey(type, tier) { return type === 'extractor' ? 'extractor' + tier : type; },
  baseCost(type, opt = {}) {
    if (type === 'extractor') return CONFIG.extractorBaseCost * Math.pow(CONFIG.extractorCostTierFactor, opt.tier || 0);
    if (type === 'belt') return DATA.BELT_GRADES[opt.grade || 0].cost;
    return DATA.BUILDINGS[type].cost;
  },
  cost(g, type, opt = {}) {
    const base = Grid.baseCost(type, opt);
    if (type === 'belt') return base * Math.pow(CONFIG.beltCostGrowth, g.run.counts.belt || 0);
    if (Grid.isDeco(type)) return base;
    if (type === 'bridge') return base * Math.pow(CONFIG.costGrowth, g.run.counts.bridge || 0);
    const n = g.run.counts[Grid.countKey(type, opt.tier)] || 0;
    return base * Math.pow(CONFIG.costGrowth, n);
  },
  maxLevel(g, b) {
    if (b.type === 'extractor') return Math.min(10, g.mods.extCap);
    if (b.type === 'belt') return 4;
    if (Grid.isTransport(b.type) || Grid.isDeco(b.type)) return 3;
    return CONFIG.maxBuildingLevel;
  },
  upgradeCost(g, b) {
    if (b.type === 'belt') {
      const next = b.grade + 1;
      if (next > 3) return Infinity;
      return DATA.BELT_GRADES[next].cost - DATA.BELT_GRADES[b.grade].cost * 0.5;
    }
    const base = Grid.baseCost(b.type, { tier: b.tier });
    if (b.type === 'extractor') return base * Math.pow(CONFIG.extractorLevelCost, b.level);
    if (Grid.isDeco(b.type)) return base * 2 * b.level;
    return Math.max(10, base) * Math.pow(CONFIG.buildingLevelCost, b.level);
  },
  upgradeBlock(g, b) {
    if (b.type === 'belt') {
      if (b.grade >= 3) return 'Höchste Güteklasse erreicht';
      const r = DATA.BELT_GRADES[b.grade + 1].research;
      if (r && !g.run.research.done.has(r)) return 'Forschung nötig: ' + DATA.RESEARCH_BY_ID[r].name;
      return null;
    }
    if (b.level >= Grid.maxLevel(g, b)) return b.type === 'extractor' && b.level < 10 ? 'Obergrenze (Rebirth-Shop erhöht sie)' : 'Höchste Stufe erreicht';
    return null;
  },

  // ---------------- placement checks ----------------
  touchingDeposits(g, x, y, w, h) {
    const found = [];
    const list = World.depositsInRect(g.world, x - 4, y - 4, x + w + 4, y + h + 4);
    for (const d of list) {
      for (const t of d.tiles) {
        if (t[0] >= x - 1 && t[0] <= x + w && t[1] >= y - 1 && t[1] <= y + h) { found.push(d); break; }
      }
    }
    return found;
  },
  depositFree(g, d) { return d.slots - (g.depUse.get(d.id) || 0); },

  unlockReason(g, type, grade) {
    const def = DATA.BUILDINGS[type];
    if (type === 'belt') {
      const r = DATA.BELT_GRADES[grade || 0].research;
      if (r && !g.run.research.done.has(r)) return 'Forschung nötig: ' + DATA.RESEARCH_BY_ID[r].name;
      return null;
    }
    if (def.research && !g.run.research.done.has(def.research)) return 'Forschung nötig: ' + DATA.RESEARCH_BY_ID[def.research].name;
    if (def.tier !== undefined && def.tier > g.run.custTier) return 'Kundenstufe ' + (def.tier + 1) + ' nötig';
    return null;
  },

  canPlace(g, spec, opts = {}) {
    const type = spec.type;
    const def = DATA.BUILDINGS[type];
    if (!def) return { ok: false, reason: 'Unbekannt' };
    const lock = Grid.unlockReason(g, type, spec.grade);
    if (lock) return { ok: false, reason: lock };
    const len = spec.len || 2;
    const s = Grid.size(type, spec.rot, len);
    const tiles = Grid.occTiles(type, spec.x, spec.y, spec.rot, len);
    for (const t of tiles) {
      const id = g.occ.get(U.tileKey(t[0], t[1]));
      if (id !== undefined && !(opts.ignore && opts.ignore.has(id))) return { ok: false, reason: 'Blockiert' };
    }
    const LD = g.run.lander;
    if (LD) for (const t of tiles) if (t[0] >= LD.x - 1 && t[0] < LD.x + 1 && t[1] >= LD.y - 1 && t[1] < LD.y + 1) return { ok: false, reason: 'Versorgungslander' };
    if (type === 'bridge') {
      if (len < 2 || len > 6) return { ok: false, reason: 'Brücke: 1 bis 4 Felder Abstand' };
    }
    if (!opts.ignoreRadius) {
      const R = g.mods.buildRadius;
      const cxm = spec.x + s.w / 2, cym = spec.y + s.h / 2;
      if (U.dist2(cxm, cym, g.run.player.x, g.run.player.y) > R * R) return { ok: false, reason: 'Zu weit weg' };
    }
    let dep = null, tier = 0;
    if (type === 'extractor') {
      const deps = Grid.touchingDeposits(g, spec.x, spec.y, s.w, s.h).filter(d => Grid.depositFree(g, d) > 0 || (opts.ignoreDep === d.id));
      if (!deps.length) {
        const any = Grid.touchingDeposits(g, spec.x, spec.y, s.w, s.h);
        return { ok: false, reason: any.length ? 'Vorkommen ausgelastet' : 'Kein Vorkommen angrenzend' };
      }
      deps.sort((a, b) => b.tier - a.tier);
      dep = deps[0]; tier = dep.tier;
    }
    let cost = opts.free ? 0 : Grid.cost(g, type, { tier, grade: spec.grade });
    if (!opts.free && g.run.kits[type] > 0) cost = 0;
    if (!opts.free && type === 'belt' && g.run.kits.belt > 0) cost = 0;
    if (!opts.ignoreMoney && cost > g.run.money + 1e-9) return { ok: false, reason: 'Zu teuer', cost, dep, tier };
    return { ok: true, cost, dep, tier };
  },

  // ---------------- create / remove ----------------
  make(g, spec) {
    const type = spec.type;
    const s = Grid.size(type, spec.rot, spec.len);
    const b = {
      id: spec.id !== undefined ? spec.id : g.nextId++,
      type, x: spec.x, y: spec.y, rot: spec.rot & 3, w: s.w, h: s.h,
      level: spec.level || 1, paid: spec.paid || 0,
      warn: null, bonus: 0, bonusSrc: null
    };
    if (b.id >= g.nextId) g.nextId = b.id + 1;
    switch (type) {
      case 'extractor':
        b.dep = spec.dep; b.res = spec.res; b.tier = spec.tier; b.acc = 0; b.buf = []; b.rr = 0;
        b.outMask = spec.outMask !== undefined ? spec.outMask : 15; b.blocked = 0; b.made = 0;
        break;
      case 'belt': b.grade = spec.grade || 0; b.items = []; b.boost = 1; break;
      case 'splitter': case 'fsplitter': case 'osplitter': case 'merger':
        b.buf = []; b.rr = 0; b.filter = spec.filter || null; b.lastSide = -1; b.attempt = 0; b.prevAttempt = 0; break;
      case 'crossing': b.lanes = [null, null, null, null]; break;
      case 'bridge': b.len = spec.len || 2; b.queue = []; break;
      case 'silo': b.store = new Map(); b.total = 0; b.rr = 0; b.outFilter = spec.outFilter || null; b.outEnabled = spec.outEnabled !== undefined ? spec.outEnabled : true; break;
      case 'lab': break;
      default:
        if (Grid.isRefinery(type)) { b.inBuf = []; b.outBuf = []; b.prog = 0; b.cur = null; b.made = 0; }
        if (Grid.isSeller(type)) { b.shelf = new Map(); b.shelfTotal = 0; b.customers = []; b.timer = 2 + Math.random() * 3; b.sold = 0; b.ramps = []; b.pathTiles = 0; b.history = []; }
    }
    if (type === 'bridge') { b.w = s.w; b.h = s.h; }
    return b;
  },

  register(g, b) {
    g.buildings.set(b.id, b);
    for (const t of Grid.occTiles(b.type, b.x, b.y, b.rot, b.len)) g.occ.set(U.tileKey(t[0], t[1]), b.id);
    const r = Grid.rect(b);
    const S = CONFIG.chunkSize;
    for (let cy = Math.floor(r.y / S); cy <= Math.floor((r.y + r.h - 1) / S); cy++)
      for (let cx = Math.floor(r.x / S); cx <= Math.floor((r.x + r.w - 1) / S); cx++) {
        const k = U.chunkKey(cx, cy);
        let set = g.bchunk.get(k); if (!set) { set = new Set(); g.bchunk.set(k, set); }
        set.add(b.id);
      }
    if (b.type === 'extractor' && b.dep !== undefined) g.depUse.set(b.dep, (g.depUse.get(b.dep) || 0) + 1);
    g.topologyDirty = true;
  },

  unregister(g, b) {
    g.buildings.delete(b.id);
    for (const t of Grid.occTiles(b.type, b.x, b.y, b.rot, b.len)) {
      const k = U.tileKey(t[0], t[1]);
      if (g.occ.get(k) === b.id) g.occ.delete(k);
    }
    const r = Grid.rect(b);
    const S = CONFIG.chunkSize;
    for (let cy = Math.floor(r.y / S); cy <= Math.floor((r.y + r.h - 1) / S); cy++)
      for (let cx = Math.floor(r.x / S); cx <= Math.floor((r.x + r.w - 1) / S); cx++) {
        const set = g.bchunk.get(U.chunkKey(cx, cy));
        if (set) { set.delete(b.id); if (!set.size) g.bchunk.delete(U.chunkKey(cx, cy)); }
      }
    if (b.type === 'extractor' && b.dep !== undefined) {
      const n = (g.depUse.get(b.dep) || 1) - 1;
      if (n <= 0) g.depUse.delete(b.dep); else g.depUse.set(b.dep, n);
    }
    g.topologyDirty = true;
  },

  // Places a building, pays for it. Returns the building or null.
  place(g, spec, opts = {}) {
    const chk = Grid.canPlace(g, spec, opts);
    if (!chk.ok) return null;
    const full = Object.assign({}, spec);
    if (spec.type === 'extractor') { full.dep = chk.dep.id; full.res = chk.dep.res; full.tier = chk.dep.tier; }
    const b = Grid.make(g, full);
    const fromKit = !opts.free && (g.run.kits[spec.type] || 0) > 0;
    if (fromKit) g.run.kits[spec.type]--;
    g.run.money -= chk.cost;
    b.paid = chk.cost;
    Grid.register(g, b);
    g.run.counts[Grid.countKey(b.type, b.tier)] = (g.run.counts[Grid.countKey(b.type, b.tier)] || 0) + 1;
    if (b.type === 'extractor') g.stats.extractorsBuilt = (g.stats.extractorsBuilt || 0) + 1;
    g.events.push({ type: 'built', b });
    return b;
  },

  // Removes a building; refund fraction of what was paid. Items inside are lost.
  remove(g, b, refundRate = CONFIG.refundRate) {
    if (!g.buildings.has(b.id)) return 0;
    Grid.releaseItems(g, b);
    Grid.unregister(g, b);
    const k = Grid.countKey(b.type, b.tier);
    g.run.counts[k] = Math.max(0, (g.run.counts[k] || 0) - 1);
    const refund = b.paid * refundRate;
    g.run.money += refund;
    g.events.push({ type: 'removed', b });
    return refund;
  },

  releaseItems(g, b) {
    const rel = it => { if (it) Items.free(it); };
    if (b.items) b.items.forEach(rel);
    if (b.buf) b.buf.forEach(rel);
    if (b.inBuf) b.inBuf.forEach(rel);
    if (b.outBuf) b.outBuf.forEach(rel);
    if (b.queue) b.queue.forEach(q => rel(q.it));
    if (b.lanes) b.lanes.forEach(rel);
    if (b.cur) rel(b.cur);
    if (b.customers) b.customers.length = 0;
  },

  upgrade(g, b) {
    if (Grid.upgradeBlock(g, b)) return false;
    const c = Grid.upgradeCost(g, b);
    if (c > g.run.money) return false;
    g.run.money -= c;
    b.paid += c;
    if (b.type === 'belt') b.grade++;
    else b.level++;
    g.topologyDirty = true;
    return true;
  },

  moveFee(g, b) { return Grid.baseCost(b.type, { tier: b.tier, grade: b.grade }) * CONFIG.moveFeeRate; },

  // Moves/rotates a building to a new position. Keeps state, charges the move fee.
  move(g, b, nx, ny, nrot, opts = {}) {
    const spec = { type: b.type, x: nx, y: ny, rot: nrot, len: b.len, grade: b.grade };
    const ignore = new Set([b.id]);
    const chk = Grid.canPlace(g, spec, { ignore, ignoreMoney: true, ignoreDep: b.dep, ignoreRadius: opts.ignoreRadius });
    if (!chk.ok) return chk.reason;
    const fee = opts.free ? 0 : Grid.moveFee(g, b);
    if (fee > g.run.money) return 'Zu teuer';
    if (b.type === 'extractor') {
      // Re-evaluate deposit (may switch to another touching deposit).
      Grid.unregister(g, b);
      const deps = Grid.touchingDeposits(g, nx, ny, Grid.size(b.type, nrot).w, Grid.size(b.type, nrot).h).filter(d => Grid.depositFree(g, d) > 0);
      if (!deps.length) { Grid.register(g, b); return 'Kein freies Vorkommen'; }
      deps.sort((a, c) => c.tier - a.tier);
      const d = deps[0];
      if (d.tier !== b.tier) {
        g.run.counts[Grid.countKey('extractor', b.tier)]--;
        g.run.counts[Grid.countKey('extractor', d.tier)] = (g.run.counts[Grid.countKey('extractor', d.tier)] || 0) + 1;
      }
      b.dep = d.id; b.res = d.res; b.tier = d.tier;
    } else {
      Grid.unregister(g, b);
    }
    const s = Grid.size(b.type, nrot, b.len);
    b.x = nx; b.y = ny; b.rot = nrot; b.w = s.w; b.h = s.h;
    Grid.register(g, b);
    g.run.money -= fee;
    return null;
  },

  // Fast rotate in place (free for 1x1, fee otherwise).
  rotate(g, b) {
    if (b.type === 'bridge') return 'Brücken lassen sich nicht drehen';
    const nr = (b.rot + 1) & 3;
    const free = b.w === 1 && b.h === 1;
    return Grid.move(g, b, b.x, b.y, nr, { free, ignoreRadius: true });
  },

  // ---------------- serialisation helpers ----------------
  toSpec(b) {
    const s = { type: b.type, x: b.x, y: b.y, rot: b.rot, level: b.level, paid: b.paid };
    if (b.type === 'belt') s.grade = b.grade;
    if (b.type === 'bridge') s.len = b.len;
    if (b.filter) s.filter = b.filter;
    if (b.type === 'extractor') { s.dep = b.dep; s.res = b.res; s.tier = b.tier; s.outMask = b.outMask; }
    if (b.type === 'silo') { s.outFilter = b.outFilter; s.outEnabled = b.outEnabled; }
    return s;
  }
};

// ---------------------------------------------------------------------
// Undo / redo of build actions
// ---------------------------------------------------------------------
const Actions = {
  push(g, act) {
    g.undo.push(act);
    const lim = g.mods.undoLimit;
    while (g.undo.length > lim) g.undo.shift();
    g.redo.length = 0;
  },
  // Place several specs as one action.
  placeMany(g, specs, opts = {}) {
    const placed = [];
    let spent = 0, fail = null;
    for (const s of specs) {
      const before = g.run.money;
      const b = Grid.place(g, s, opts);
      if (b) { placed.push(b); spent += before - g.run.money; }
      else if (!fail) fail = Grid.canPlace(g, s, opts).reason;
    }
    if (placed.length) Actions.push(g, { kind: 'place', specs: placed.map(b => Object.assign(Grid.toSpec(b), { id: b.id })), paid: placed.map(b => b.paid) });
    return { placed, spent, fail };
  },
  removeMany(g, list) {
    const specs = [];
    let refund = 0;
    for (const b of list) {
      const spec = Object.assign(Grid.toSpec(b), { id: b.id });
      const r = Grid.remove(g, b);
      spec.refund = r;
      refund += r;
      specs.push(spec);
    }
    if (specs.length) Actions.push(g, { kind: 'remove', specs });
    return refund;
  },
  record(g, act) { Actions.push(g, act); },

  apply(g, act, dir) {
    // dir = -1 undo, +1 redo
    if (act.kind === 'place') {
      if (dir < 0) {
        for (const s of act.specs) {
          const b = g.buildings.get(s.id);
          if (b) { Grid.releaseItems(g, b); Grid.unregister(g, b); g.run.money += b.paid; const k = Grid.countKey(b.type, b.tier); g.run.counts[k] = Math.max(0, (g.run.counts[k] || 0) - 1); }
        }
        return null;
      }
      const total = act.specs.reduce((a, s) => a + s.paid, 0);
      if (total > g.run.money) return 'Zu wenig ' + CURRENCY_SHORT + ' für Wiederholen';
      for (const s of act.specs) {
        if (Grid.occTiles(s.type, s.x, s.y, s.rot, s.len).some(t => g.occ.has(U.tileKey(t[0], t[1])))) continue;
        const b = Grid.make(g, s); b.paid = s.paid; Grid.register(g, b); g.run.money -= s.paid;
        const k = Grid.countKey(b.type, b.tier); g.run.counts[k] = (g.run.counts[k] || 0) + 1;
      }
      return null;
    }
    if (act.kind === 'remove') {
      if (dir < 0) {
        const cost = act.specs.reduce((a, s) => a + s.refund, 0);
        if (cost > g.run.money + 1e-9) return 'Zu wenig ' + CURRENCY_SHORT + ' zum Wiederherstellen';
        for (const s of act.specs) {
          if (Grid.occTiles(s.type, s.x, s.y, s.rot, s.len).some(t => g.occ.has(U.tileKey(t[0], t[1])))) continue;
          if (s.type === 'extractor') { const d = World.depositById(g.world, s.dep); if (!d || Grid.depositFree(g, d) <= 0) continue; }
          const b = Grid.make(g, s); Grid.register(g, b); g.run.money -= s.refund;
          const k = Grid.countKey(b.type, b.tier); g.run.counts[k] = (g.run.counts[k] || 0) + 1;
        }
        return null;
      }
      for (const s of act.specs) { const b = g.buildings.get(s.id); if (b) Grid.remove(g, b); }
      return null;
    }
    if (act.kind === 'move') {
      const b = g.buildings.get(act.id);
      if (!b) return 'Gebäude existiert nicht mehr';
      const to = dir < 0 ? act.from : act.to;
      const err = Grid.move(g, b, to.x, to.y, to.rot, { free: true, ignoreRadius: true });
      if (err) return err;
      g.run.money += dir < 0 ? act.fee : -act.fee;
      return null;
    }
    if (act.kind === 'upgrade') {
      const b = g.buildings.get(act.id);
      if (!b) return 'Gebäude existiert nicht mehr';
      if (dir < 0) {
        if (b.type === 'belt') b.grade--; else b.level--;
        g.run.money += act.cost; b.paid -= act.cost;
      } else {
        if (act.cost > g.run.money) return 'Zu teuer';
        if (b.type === 'belt') b.grade++; else b.level++;
        g.run.money -= act.cost; b.paid += act.cost;
      }
      g.topologyDirty = true;
      return null;
    }
    return null;
  },
  undo(g) {
    const act = g.undo.pop();
    if (!act) return 'Nichts rückgängig zu machen';
    const err = Actions.apply(g, act, -1);
    if (err) { g.undo.push(act); return err; }
    g.redo.push(act);
    return null;
  },
  redo(g) {
    const act = g.redo.pop();
    if (!act) return 'Nichts zu wiederholen';
    const err = Actions.apply(g, act, 1);
    if (err) { g.redo.push(act); return err; }
    g.undo.push(act);
    return null;
  }
};

// ===== src/core/04c_collide.js =====
// =====================================================================
// Collide: building hitboxes and player collision (movement only; never
// touches the economy, customers rates or offline calculation).
// Conveyor belts and all flat transport parts are always walkable.
// Hitboxes are rectangles in world tiles; the player is a circle that
// slides along walls (vector push-out per sub-step, no tunnelling).
// =====================================================================
const Collide = {
  // customer side of a bazaar follows its rotation
  SIDE: [[0, 1], [-1, 0], [0, -1], [1, 0]],
  mode(type) { return (CONFIG.collision && CONFIG.collision[type]) || 'none'; },
  // rectangles [x0, y0, x1, y1] (world) for one building, cached on the building
  boxes(b) {
    const key = b.x + ',' + b.y + ',' + b.rot + ',' + b.w + ',' + b.h;
    if (b._hbk === key) return b._hb;
    const m = Collide.mode(b.type);
    let R = [];
    const X = b.x, Y = b.y, W = b.w, H = b.h, I = 0.1;
    if (m === 'footprint') R = [[X + I, Y + I, X + W - I, Y + H - I]];
    else if (m === 'custom') {
      const rel = Collide.custom(b);
      R = rel.map(r => [X + r[0], Y + r[1], X + r[2], Y + r[3]]);
    }
    b._hb = R; b._hbk = key;
    return R;
  },
  custom(b) {
    const W = b.w, H = b.h;
    switch (b.type) {
      case 'bazaar': {
        // solid stall body (counter, back wall, roof posts) without the customer strip
        const s = Collide.SIDE[b.rot & 3], strip = 0.7, I = 0.1;
        let x0 = I, y0 = I, x1 = W - I, y1 = H - I;
        if (s[1] === 1) y1 = H - strip; else if (s[1] === -1) y0 = strip; else if (s[0] === 1) x1 = W - strip; else x0 = strip;
        return [[x0, y0, x1, y1]];
      }
      case 'caravan': return [[0.08, 0.04, W - 0.08, 0.32], [0.08, 0.32, 0.3, H - 0.2], [W - 0.3, 0.32, W - 0.08, H - 0.2], [0.55, 1.75, 1.45, 2.55], [W - 1.45, 1.75, W - 0.55, 2.55], [W / 2 - 0.35, 0.8, W / 2 + 0.35, 1.2]];
